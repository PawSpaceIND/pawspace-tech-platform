name = "pawspace-tech-platform"
main = "worker/index.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

[vars]
PAWSPACE_AI_EXECUTIVE_ACTIVE = "false"
PAWSPACE_IOT_ACTIVE = "false"
PAWSPACE_VISION_ACTIVE = "false"
PAWSPACE_RPA_ACTIVE = "false"

[triggers]
crons = ["*/5 * * * *", "*/15 * * * *", "15 2 * * *"]

[[ratelimits]]
name = "PUBLIC_CONTACT_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 100
period = 60

[[ratelimits]]
name = "AI_VOICE_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 100
period = 60

[[ratelimits]]
name = "MOONSHOT_TELEMETRY_RATE_LIMITER"
namespace_id = "1003"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "MOONSHOT_VISION_RATE_LIMITER"
namespace_id = "1004"
[ratelimits.simple]
limit = 12
period = 60

[[ratelimits]]
name = "MOONSHOT_RPA_RATE_LIMITER"
namespace_id = "1005"
[ratelimits.simple]
limit = 10
period = 60

[ai]
binding = "AI"
remote = false

[[vectorize]]
binding = "ATLAS_VECTORIZE"
index_name = "pawspace-atlas-memory"
remote = false
