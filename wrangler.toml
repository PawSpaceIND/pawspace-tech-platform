name = "pawspace-tech-platform"
main = "worker/index.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

[vars]
PAWSPACE_AI_EXECUTIVE_ACTIVE = "false"

[triggers]
crons = ["*/5 * * * *", "*/15 * * * *", "15 2 * * *"]

[[ratelimits]]
name = "PUBLIC_CONTACT_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 100
period = 60

[[ratelimits]]
name = "AI_VOICE_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 100
period = 60

[ai]
binding = "AI"
remote = false

[[vectorize]]
binding = "ATLAS_VECTORIZE"
index_name = "pawspace-atlas-memory"
remote = false

# Edge hardening intent (Blocker 4)
# NOTE: Wrangler rate-limit bindings are Worker-consumed bindings; they do not
# replace Cloudflare zone-level WAF / Rate Limiting Rules. Pre-Worker blocking
# for SQLi/XSS/headless traffic must be configured in Cloudflare Rulesets
# (http_request_firewall_managed/custom and http_ratelimit) on the routed zone.
# The standalone verification harness in scripts/security/waf-edge-test.sh is
# fail-closed and must observe HTTP 403/429 from the real Cloudflare edge.

[[ratelimits]]
name = "GLOBAL_API_RATE_LIMITER"
namespace_id = "1003"
[ratelimits.simple]
limit = 100
period = 60

[[ratelimits]]
name = "AUTH_OTP_RATE_LIMITER"
namespace_id = "1004"
[ratelimits.simple]
limit = 5
period = 60

# Blocker 4 certification note:
# These bindings declare Worker-side rate-limit capabilities only. Cloudflare
# zone-level Rulesets must separately enforce the production edge policy before
# Worker execution: global 100 req/min, auth/OTP 5 req/min, managed WAF SQLi/XSS
# block mode, and bot/headless mitigation. The current OAuth token is zone-read
# only, so this repository change intentionally does not claim those zone rules
# have been provisioned.
