name: One-shot provider boundary fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: one-shot-provider-boundary
  cancel-in-progress: true

jobs:
  apply-provider-boundary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: testfix/master-zero-gap-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reconstruct and apply reviewed provider-boundary patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            scripts/provider-boundary-fix.patch.gz.b64.part00 \
            scripts/provider-boundary-fix.patch.gz.b64.part01 \
            | base64 -d | gzip -d > /tmp/provider-boundary-fix.patch
          echo '5ae0c89b189147aed8dd804adf3d45c8377980ec9bae7c315aa398c9ac5f04a3  /tmp/provider-boundary-fix.patch' | sha256sum -c -

          if git apply --check /tmp/provider-boundary-fix.patch; then
            git apply /tmp/provider-boundary-fix.patch
            git diff --check
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          elif grep -q 'return String(body.action||"record")==="reconcile"?"customers.manage":"communications.manage"' lib/api-gateway.ts \
            && grep -q 'if(url.pathname==="/api/booking-command-center")return "bookings.manage"' lib/api-gateway.ts \
            && test -f tests/platform-wide-operations-authorization-boundary.test.mjs \
            && test -f tests/sensitive-vertical-provider-boundary.test.mjs \
            && test -f tests/bot-call-outcome-authorization-boundary.test.mjs; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          else
            echo 'Patch neither applies nor appears to be present.' >&2
            exit 1
          fi
      - name: Install exact dependencies
        if: steps.patch.outputs.apply == 'true'
        run: npm ci
      - name: Typecheck
        if: steps.patch.outputs.apply == 'true'
        run: npm run typecheck
      - name: Lint
        if: steps.patch.outputs.apply == 'true'
        run: npm run lint
      - name: Run focused and adjacent authorization regressions
        if: steps.patch.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            tests/platform-wide-operations-authorization-boundary.test.mjs \
            tests/sensitive-vertical-provider-boundary.test.mjs \
            tests/bot-call-outcome-authorization-boundary.test.mjs \
            tests/boarding-gate5.test.mjs \
            tests/bot-call-disposition.test.mjs \
            tests/food-gate2.test.mjs \
            tests/food-gate5.test.mjs \
            tests/food-hardening.test.mjs \
            tests/food-supply-chain.test.mjs \
            tests/ops-work-queue.test.mjs \
            tests/provider-lms.test.mjs \
            tests/relocation-closure.test.mjs \
            tests/sitting-gate5.test.mjs \
            tests/staff-alert-center.test.mjs \
            tests/taxi-gate5.test.mjs \
            tests/training-hardening.test.mjs \
            tests/unified-case-center.test.mjs \
            tests/walking-gate5.test.mjs \
            tests/walking-taxi-ops-hardening.test.mjs \
            tests/route-authorization-class.test.mjs \
            tests/canonical-bookings-gateway-authorization.test.mjs
      - name: Commit verified provider-boundary source changes
        if: steps.patch.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add app/api lib tests
          git config user.name 'PawSpace zero-gap fixer'
          git config user.email 'actions@pawspace.in'
          git commit -m 'fix: close provider access to platform-wide operations'
          git push origin HEAD:testfix/master-zero-gap-20260824
