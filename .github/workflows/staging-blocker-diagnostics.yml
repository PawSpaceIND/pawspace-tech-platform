name: Staging blocker diagnostics

on:
  push:
    branches:
      - ops/nontrack2-closure-20260901

permissions:
  contents: read

concurrency:
  group: pawspace-staging-blocker-diagnostics
  cancel-in-progress: true

env:
  STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inspect isolated staging D1 auth schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute pawspace-staging --remote --json --command "PRAGMA table_info(app_users)" > app-users-schema.json
          npx wrangler d1 execute pawspace-staging --remote --json --command "PRAGMA table_info(role_definitions)" > role-definitions-schema.json
          npx wrangler d1 execute pawspace-staging --remote --json --command "SELECT name, sql FROM sqlite_master WHERE type='table' AND name IN ('app_users','role_definitions','security_audit_events','identity_bindings') ORDER BY name" > auth-table-ddl.json
          npx wrangler d1 execute pawspace-staging --remote --json --command "SELECT (SELECT COUNT(*) FROM app_users) AS app_users, (SELECT COUNT(*) FROM role_definitions) AS role_definitions" > auth-table-counts.json
          cat app-users-schema.json
          cat role-definitions-schema.json
          cat auth-table-ddl.json
          cat auth-table-counts.json
      - name: Inspect active staging version annotation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name pawspace-staging --json > staging-status.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const status=JSON.parse(fs.readFileSync('staging-status.json','utf8'));
          const versions=Array.isArray(status.versions)?status.versions:[];
          console.log(JSON.stringify(versions.map(v=>({version_id:v.version_id,percentage:v.percentage})),null,2));
          NODE
      - name: Probe staging login without exposing credentials
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base=process.env.STAGING_URL;
          const code=process.env.PAWSPACE_UAT_ACCESS_CODE;
          if(!code) throw new Error('PAWSPACE_UAT_ACCESS_CODE missing');
          for (const [method,body] of [
            ['GET',undefined],
            ['POST',{action:'login',code,email:'founder@pawspace.in'}],
          ]) {
            const response=await fetch(base+'/api/staging-login',{
              method,
              headers: body?{'content-type':'application/json'}:undefined,
              body: body?JSON.stringify(body):undefined,
            });
            const text=await response.text();
            console.log(`${method} /api/staging-login -> ${response.status} ${text.slice(0,1000)}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-blocker-diagnostics-${{ github.sha }}
          path: |
            app-users-schema.json
            role-definitions-schema.json
            auth-table-ddl.json
            auth-table-counts.json
            staging-status.json
          if-no-files-found: warn
