name: Staging blocker diagnostics

on:
  push:
    branches:
      - ops/nontrack2-closure-20260901

permissions:
  contents: read

concurrency:
  group: pawspace-staging-blocker-diagnostics
  cancel-in-progress: true

env:
  STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lightweight read-only D1 capacity probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler d1 execute pawspace-staging --remote --json --command "SELECT code AS capacity_code FROM role_definitions LIMIT 1" > d1-capacity-probe.json 2> d1-capacity-probe.err; then
            cat d1-capacity-probe.err >&2
            test -s d1-capacity-probe.json && cat d1-capacity-probe.json >&2 || true
            exit 1
          fi
          cat d1-capacity-probe.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('d1-capacity-probe.json','utf8'));
          const result=Array.isArray(raw)?raw[0]:raw;
          const rows=result?.results||[];
          const rowsRead=Number(result?.meta?.rows_read||0);
          if(rows.length!==1 || !String(rows[0].capacity_code||'').trim() || rowsRead<1) {
            throw new Error(`probe did not prove a real table-row read: rows=${JSON.stringify(rows)} rows_read=${rowsRead}`);
          }
          NODE
      - name: Read-only scheduling failure forensics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SQL="SELECT 'decisions' AS kind,COUNT(*) AS n FROM scheduling_assignment_decisions WHERE group_id LIKE 'perf-33613186871-1:grp:%' UNION ALL SELECT 'reservations',COUNT(*) FROM scheduling_reservations WHERE group_id LIKE 'perf-33613186871-1:grp:%' UNION ALL SELECT 'offers',COUNT(*) FROM provider_assignment_offers WHERE group_id LIKE 'perf-33613186871-1:grp:%' UNION ALL SELECT 'uat_roster_rows',COUNT(*) FROM scheduling_availability WHERE source='uat_roster' AND date>=date('now','+11 day') AND date<=date('now','+23 day');"
          npx wrangler d1 execute pawspace-staging --remote --json --command "$SQL" > scheduling-failure-forensics.json
          cat scheduling-failure-forensics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-capacity-probe-${{ github.sha }}
          path: |
            d1-capacity-probe.json
            d1-capacity-probe.err
            scheduling-failure-forensics.json
          if-no-files-found: warn
