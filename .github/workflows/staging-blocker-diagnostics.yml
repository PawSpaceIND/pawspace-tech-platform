name: Staging blocker diagnostics

on:
  push:
    branches:
      - ops/nontrack2-closure-20260901

permissions:
  contents: read

concurrency:
  group: pawspace-staging-blocker-diagnostics
  cancel-in-progress: true

env:
  STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bootstrap required staging UAT roles explicitly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/ops/staging-role-seed.mjs "$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute pawspace-staging --remote --yes --file="$RUNNER_TEMP/staging-role-seed.sql"
      - name: Inspect UAT identity and role resolution
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute pawspace-staging --remote --json --command "SELECT email,role_code,status FROM app_users WHERE email='founder@pawspace.in'" > founder-user.json
          npx wrangler d1 execute pawspace-staging --remote --json --command "SELECT code,name,system_role FROM role_definitions WHERE code IN ('founder','finance','manager','service_provider','associate') ORDER BY code" > required-roles.json
          cat founder-user.json
          cat required-roles.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=p=>{const x=JSON.parse(fs.readFileSync(p,'utf8'));return (Array.isArray(x)?x[0]:x)?.results||[]};
          const user=rows('founder-user.json')[0];
          const roles=rows('required-roles.json');
          if(!user || user.email!=='founder@pawspace.in' || user.status!=='active' || user.role_code!=='founder') throw new Error(`founder seed is not active/founder: ${JSON.stringify(user)}`);
          const required=['associate','finance','founder','manager','service_provider'];
          const found=roles.map(r=>String(r.code)).sort();
          if(JSON.stringify(found)!==JSON.stringify(required)) throw new Error(`required roles mismatch: ${JSON.stringify(found)}`);
          NODE
      - name: Probe staging login without exposing credentials
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base=process.env.STAGING_URL;
          const code=process.env.PAWSPACE_UAT_ACCESS_CODE;
          if(!code) throw new Error('PAWSPACE_UAT_ACCESS_CODE missing');
          const response=await fetch(base+'/api/staging-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',code,email:'founder@pawspace.in'})});
          const text=await response.text();
          console.log(`POST /api/staging-login -> ${response.status} ${text.slice(0,1000)}`);
          if(!response.ok) process.exit(1);
          if(!(response.headers.get('set-cookie')||'').includes('pawspace_uat=')) throw new Error('login succeeded without UAT cookie');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-blocker-diagnostics-${{ github.sha }}
          path: |
            founder-user.json
            required-roles.json
          if-no-files-found: warn
