name: Staging blocker diagnostics

on:
  push:
    branches:
      - ops/nontrack2-closure-20260901

permissions:
  contents: read

concurrency:
  group: pawspace-staging-blocker-diagnostics
  cancel-in-progress: true

env:
  STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lightweight read-only D1 capacity probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler d1 execute pawspace-staging --remote --json --command "SELECT code AS capacity_code FROM role_definitions LIMIT 1" > d1-capacity-probe.json 2> d1-capacity-probe.err; then
            cat d1-capacity-probe.err >&2
            test -s d1-capacity-probe.json && cat d1-capacity-probe.json >&2 || true
            exit 1
          fi
          cat d1-capacity-probe.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('d1-capacity-probe.json','utf8'));
          const result=Array.isArray(raw)?raw[0]:raw;
          const rows=result?.results||[];
          const rowsRead=Number(result?.meta?.rows_read||0);
          if(rows.length!==1 || !String(rows[0].capacity_code||'').trim() || rowsRead<1) {
            throw new Error(`probe did not prove a real table-row read: rows=${JSON.stringify(rows)} rows_read=${rowsRead}`);
          }
          NODE
      - name: Read-only canonical booking timeout forensics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PREFIX="perf-33615780135-1"
          SQL="SELECT 'decisions' AS kind,COUNT(*) AS n FROM scheduling_assignment_decisions WHERE group_id LIKE '${PREFIX}:grp:%' UNION ALL SELECT 'reservations',COUNT(*) FROM scheduling_reservations WHERE group_id LIKE '${PREFIX}:grp:%' UNION ALL SELECT 'bookings',COUNT(*) FROM canonical_bookings WHERE idempotency_key LIKE '${PREFIX}:booking:%' UNION ALL SELECT 'work_orders',COUNT(*) FROM provider_work_orders WHERE booking_id IN (SELECT id FROM canonical_bookings WHERE idempotency_key LIKE '${PREFIX}:booking:%') UNION ALL SELECT 'payments',COUNT(*) FROM booking_payments WHERE booking_id IN (SELECT id FROM canonical_bookings WHERE idempotency_key LIKE '${PREFIX}:booking:%');"
          npx wrangler d1 execute pawspace-staging --remote --json --command "$SQL" > canonical-booking-timeout-forensics.json
          cat canonical-booking-timeout-forensics.json
          DETAIL="SELECT idempotency_key,id,created_at FROM canonical_bookings WHERE idempotency_key LIKE '${PREFIX}:booking:%' ORDER BY idempotency_key;"
          npx wrangler d1 execute pawspace-staging --remote --json --command "$DETAIL" > canonical-booking-timeout-detail.json
          cat canonical-booking-timeout-detail.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-capacity-probe-${{ github.sha }}
          path: |
            d1-capacity-probe.json
            d1-capacity-probe.err
            canonical-booking-timeout-forensics.json
            canonical-booking-timeout-detail.json
          if-no-files-found: warn
