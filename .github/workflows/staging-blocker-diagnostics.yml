name: Staging blocker diagnostics

on:
  push:
    branches:
      - ops/nontrack2-closure-20260901

permissions:
  contents: read

concurrency:
  group: pawspace-staging-blocker-diagnostics
  cancel-in-progress: true

env:
  STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lightweight read-only D1 capacity probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler d1 execute pawspace-staging --remote --json --command "SELECT 1 AS capacity_ok" > d1-capacity-probe.json 2> d1-capacity-probe.err; then
            cat d1-capacity-probe.err >&2
            test -s d1-capacity-probe.json && cat d1-capacity-probe.json >&2 || true
            exit 1
          fi
          cat d1-capacity-probe.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('d1-capacity-probe.json','utf8'));
          const rows=(Array.isArray(raw)?raw[0]:raw)?.results||[];
          if(rows.length!==1 || Number(rows[0].capacity_ok)!==1) throw new Error(`unexpected D1 capacity probe result: ${JSON.stringify(rows)}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-capacity-probe-${{ github.sha }}
          path: |
            d1-capacity-probe.json
            d1-capacity-probe.err
          if-no-files-found: warn
