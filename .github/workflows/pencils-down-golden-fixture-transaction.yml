name: Execute Golden transaction on fixture-enabled UAT
on:
  push:
    branches: [ops/pencils-down-staging-ab40dc00]
    paths: [.github/workflows/pencils-down-golden-fixture-transaction.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pawspace-release-preview
    env:
      ORIGIN: https://pawspace-beta-golden-fixture-3218c3.karthik-fce.workers.dev
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
      FORBID_PRODUCTION: 'true'
      CI: 'true'
    steps:
      - name: Checkout proven transaction harness source
        uses: actions/checkout@v4
        with:
          ref: 34a73dd4bfcb7e5d97c4935b5a62fc08d48132e3
          path: infra
          persist-credentials: false
      - name: Checkout exact certified product
        uses: actions/checkout@v4
        with:
          ref: 3218c383ef3afd947847b87b7319600e359e4f9e
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked candidate dependencies
        working-directory: candidate
        run: npm run install:ci
      - name: Install matching Chromium
        working-directory: candidate
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Prepare same-booking browser transaction
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('infra/.github/workflows/pencils-down-golden-transaction.yml').read_text()
          start=src.index("cat > golden.mjs <<'NODE'")+len("cat > golden.mjs <<'NODE'")
          end=src.index('\n          NODE',start)
          script=src[start:end].replace('\n          ','\n').lstrip('\n')
          script=script.replace("9000000927","9000000933")
          script=script.replace("getByRole('button',{name:'Pay online',exact:true})","getByRole('button',{name:/^Pay online/})")
          Path('candidate/golden.mjs').write_text(script)
          print('Prepared same-booking transaction; product source is unchanged.')
          PY
      - name: Run Customer -> booking -> Wallet -> Razorpay Test checkout
        working-directory: candidate
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: node golden.mjs
      - name: Upload transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-fixture-customer-wallet-razorpay
          path: candidate/golden-transaction-evidence/
          if-no-files-found: error
          retention-days: 7
