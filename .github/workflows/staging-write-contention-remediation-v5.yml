name: Remove remaining staging scheduling write storms

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/staging-write-contention-remediation-v5.yml

permissions:
  contents: write

concurrency:
  group: staging-write-contention-remediation-v5
  cancel-in-progress: false

env:
  STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev

jobs:
  remediate-and-certify:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Remove synchronous UAT roster writes and bound lease cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
            if old not in s:
              raise SystemExit(f"{label}: source anchor missing")
            return s.replace(old, new, 1)

          # Bound maintenance cleanup to a small fixed number of groups per request.
          p=Path('lib/scheduling-reservation-leases.ts')
          s=p.read_text()
          old='''    const candidate=await db.prepare(`SELECT r.group_id FROM scheduling_reservations r WHERE r.status='assigned' AND ${expiredLease} ${reservationConfirmed} LIMIT 1`).bind(now,now).first<Row>();if(!candidate)return{groups:0,reservations:0};
    const reason="reservation_lease_expired",hasOffers=await tableExists(db,"provider_assignment_offers");
    const decisionConfirmed=hasCanonical?"AND NOT EXISTS (SELECT 1 FROM canonical_bookings b WHERE b.schedule_group_id=scheduling_assignment_decisions.group_id)":"";
    const offerConfirmed=hasCanonical?"AND NOT EXISTS (SELECT 1 FROM canonical_bookings b WHERE b.schedule_group_id=provider_assignment_offers.group_id)":"";
    const statements=[
      db.prepare(`INSERT OR REPLACE INTO scheduling_reservation_lease_cleanup (group_id,reason,released_at) SELECT DISTINCT r.group_id,?,? FROM scheduling_reservations r WHERE r.status='assigned' AND ${expiredLease} ${reservationConfirmed}`).bind(reason,now,now,now),
      db.prepare(`UPDATE scheduling_reservations AS r SET status='cancelled' WHERE r.status='assigned' ${reservationConfirmed} AND EXISTS (SELECT 1 FROM scheduling_reservation_lease_cleanup c WHERE c.group_id=r.group_id AND c.reason=? AND c.released_at=?)`).bind(reason,now),
      db.prepare(`UPDATE scheduling_assignment_decisions SET status='expired',actor_id='system:reservation-lease-cleanup',reason=?,updated_at=? WHERE status IN ('assigned','awaiting_admin') AND EXISTS (SELECT 1 FROM scheduling_reservation_lease_cleanup c WHERE c.group_id=scheduling_assignment_decisions.group_id AND c.reason=? AND c.released_at=?) ${decisionConfirmed}`).bind(reason,now,reason,now),
    ];
    if(hasOffers)statements.push(db.prepare(`UPDATE provider_assignment_offers SET status='cancelled',responded_at=?,response_reason=?,updated_at=? WHERE status='pending' AND EXISTS (SELECT 1 FROM scheduling_reservation_lease_cleanup c WHERE c.group_id=provider_assignment_offers.group_id AND c.reason=? AND c.released_at=?) ${offerConfirmed}`).bind(now,reason,now,reason,now));
    const result=await db.batch(statements);return{groups:Number(result[0]?.meta?.changes||0),reservations:Number(result[1]?.meta?.changes||0)};'''
          new='''    const expired=await db.prepare(`SELECT DISTINCT r.group_id FROM scheduling_reservations r WHERE r.status='assigned' AND ${expiredLease} ${reservationConfirmed} LIMIT 8`).bind(now,now).all<{group_id:string}>();
    const groupIds=expired.results.map(row=>String(row.group_id));if(!groupIds.length)return{groups:0,reservations:0};
    const placeholders=groupIds.map(()=>"?").join(","),reason="reservation_lease_expired",hasOffers=await tableExists(db,"provider_assignment_offers");
    const statements=[
      db.prepare(`INSERT OR REPLACE INTO scheduling_reservation_lease_cleanup (group_id,reason,released_at) SELECT group_id,?,? FROM scheduling_reservations WHERE group_id IN (${placeholders}) GROUP BY group_id`).bind(reason,now,...groupIds),
      db.prepare(`UPDATE scheduling_reservations SET status='cancelled' WHERE status='assigned' AND group_id IN (${placeholders})`).bind(...groupIds),
      db.prepare(`UPDATE scheduling_assignment_decisions SET status='expired',actor_id='system:reservation-lease-cleanup',reason=?,updated_at=? WHERE status IN ('assigned','awaiting_admin') AND group_id IN (${placeholders})`).bind(reason,now,...groupIds),
    ];
    if(hasOffers)statements.push(db.prepare(`UPDATE provider_assignment_offers SET status='cancelled',responded_at=?,response_reason=?,updated_at=? WHERE status='pending' AND group_id IN (${placeholders})`).bind(now,reason,now,...groupIds));
    const result=await db.batch(statements);return{groups:groupIds.length,reservations:Number(result[1]?.meta?.changes||0)};'''
          s=once(s,old,new,'bounded cleanup')
          p.write_text(s)

          # UAT scheduling no longer persists synthetic availability rows on every discovery request.
          p=Path('app/api/uat-scheduling/route.ts')
          s=p.read_text()
          start=s.index('async function seedUatRoster(')
          end=s.index('\n\nfunction repository(',start)
          replacement='''async function syntheticUatRosterEnabled(){const {env}=await import("cloudflare:workers");return uatRosterSeedingEnabled(env);}
function syntheticUatWindow(input:RequestBody){return input.serviceCode==="boarding"||input.careMode==="overnight"?"00:00-23:59":input.serviceCode==="pet_taxi"?"06:00-22:00":input.serviceCode==="dog_walking"?"06:00-21:00":"09:00-19:00";}'''
          s=s[:start]+replacement+s[end:]
          s=once(s,'function repository(db:Awaited<ReturnType<typeof database>>):PlatformRepository{','function repository(db:Awaited<ReturnType<typeof database>>,input?:RequestBody,syntheticUatRoster=false):PlatformRepository{','repository args')
          old='''    async listAvailability(providerId:string,date:string){if((await blockedProviders(date)).has(providerId))return [];const providerRows=(await availabilityRows(date)).filter(row=>String(row.provider_id)===providerId),authored=providerRows.filter(row=>["partner_app","operations","roster"].includes(String(row.source))),results=authored.length?authored:providerRows;return results.map(row=>({id:String(row.id),providerId:String(row.provider_id),cityId:String(row.city_id),zoneId:String(row.zone_id),date:String(row.date),windows:JSON.parse(String(row.windows_json)),source:String(row.source) as ProviderAvailability["source"],updatedAt:new Date(Number(row.updated_at)).toISOString()}));},'''
          new='''    async listAvailability(providerId:string,date:string){if((await blockedProviders(date)).has(providerId))return [];const providerRows=(await availabilityRows(date)).filter(row=>String(row.provider_id)===providerId),authored=providerRows.filter(row=>["partner_app","operations","roster"].includes(String(row.source))),results=authored.length?authored:providerRows;if(results.length)return results.map(row=>({id:String(row.id),providerId:String(row.provider_id),cityId:String(row.city_id),zoneId:String(row.zone_id),date:String(row.date),windows:JSON.parse(String(row.windows_json)),source:String(row.source) as ProviderAvailability["source"],updatedAt:new Date(Number(row.updated_at)).toISOString()}));if(!syntheticUatRoster||!input)return [];return[{id:`uat_synthetic_${providerId}_${date}_${input.zoneId}`,providerId,cityId:cityIdFor(input),zoneId:input.zoneId,date,windows:[syntheticUatWindow(input)],source:"uat_roster" as ProviderAvailability["source"],updatedAt:new Date(0).toISOString()}];},'''
          s=once(s,old,new,'synthetic availability')
          s=s.replace('schedule(repository(db),{cityId:cityIdFor(original)', 'schedule(repository(db,original,await syntheticUatRosterEnabled()),{cityId:cityIdFor(original)',1)
          old='''await seedUatRoster(input,db);const rules=await activeRules(db,input),requestInput:ScheduleRequest='''
          new='''const syntheticUatRoster=await syntheticUatRosterEnabled();const rules=await activeRules(db,input),requestInput:ScheduleRequest='''
          s=once(s,old,new,'remove roster write')
          s=once(s,'decision=await schedule(repository(db),requestInput);','decision=await schedule(repository(db,input,syntheticUatRoster),requestInput);','synthetic schedule')
          p.write_text(s)

          # Pin the no-write UAT discovery path and bounded cleanup contract.
          p=Path('tests/uat-scheduling-d1-contention.test.mjs')
          s=p.read_text()
          s+='''\n\ntest("Track 3 UAT discovery does not materialize roster writes and cleanup is bounded",()=>{const scheduling=fs.readFileSync(new URL("../app/api/uat-scheduling/route.ts",import.meta.url),"utf8");const leases=fs.readFileSync(new URL("../lib/scheduling-reservation-leases.ts",import.meta.url),"utf8");assert.doesNotMatch(scheduling,/async function seedUatRoster/);assert.match(scheduling,/syntheticUatRosterEnabled/);assert.match(scheduling,/uat_synthetic_/);assert.doesNotMatch(scheduling,/await seedUatRoster\(input,db\)/);assert.match(leases,/LIMIT 8/);assert.match(leases,/groupIds\.map\(\(\)=>"\?"\)/);});\n'''
          p.write_text(s)
          PY
      - name: Focused contention tests
        run: node --experimental-strip-types --test tests/uat-scheduling-d1-contention.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Commit and push follow-up remediation
        run: |
          set -euo pipefail
          git fetch origin fix/staging-performance-remediation
          test "$(git rev-parse origin/fix/staging-performance-remediation)" = "$GITHUB_SHA"
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add lib/scheduling-reservation-leases.ts app/api/uat-scheduling/route.ts tests/uat-scheduling-d1-contention.test.mjs
          git diff --cached --check
          git commit -m "perf(scheduling): remove UAT assignment write storms"
          git push origin HEAD:fix/staging-performance-remediation
          echo "EXPECTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build remediation SHA
        run: npm run build
      - name: Configure isolated staging
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs
      - name: Deploy exact remediation SHA to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/staging-v5-secrets.json"; export SECRETS_FILE
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';const required=['PAWSPACE_UAT_ACCESS_CODE','PAWSPACE_UAT_SIGNING_KEY','PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT','RAZORPAY_WEBHOOK_SECRET_SANDBOX'];const optional=['RAZORPAY_KEY_ID_SANDBOX','RAZORPAY_KEY_SECRET_SANDBOX'];const values=Object.fromEntries(required.map(n=>[n,process.env[n]||'']));if(Object.values(values).some(v=>!v))throw new Error('required Track 3 staging secret missing');for(const n of optional)if(process.env[n])values[n]=process.env[n];values.PAWSPACE_STAGING_LIVE_CUSTOMER_OTP='false';writeFileSync(process.env.SECRETS_FILE,JSON.stringify(values),{mode:0o600});
          NODE
          npx wrangler deploy --message "staging $EXPECTED_SHA" --secrets-file "$SECRETS_FILE" 2>&1 | tee deployment.txt
      - name: Certify staging isolation and exact SHA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
        run: node tests/e2e/staging-certification.mjs --isolation-only
      - name: Seed deterministic staging identities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p scripts/ops
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-role-seed.mjs > scripts/ops/staging-role-seed.mjs
          node --experimental-strip-types scripts/ops/staging-role-seed.mjs "$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --file="$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --file=scripts/employee-seed.sql
      - name: Verify healthz
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const response=await fetch(process.env.STAGING_URL+'/healthz',{signal:AbortSignal.timeout(15000)});const text=await response.text();let body=null;try{body=JSON.parse(text)}catch{}const evidence={url:process.env.STAGING_URL+'/healthz',status:response.status,ok:response.ok,body};fs.writeFileSync('healthz-evidence.json',JSON.stringify(evidence,null,2));console.log(JSON.stringify(evidence,null,2));if(response.status!==200||body?.status!=='ok')process.exit(1);
          NODE
      - name: Run hosted Track 3 workload
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          PERF_RUN_ID: remediation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p scripts/ops
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-performance-gate.mjs > scripts/ops/staging-performance-gate.mjs
          node scripts/ops/staging-performance-gate.mjs
      - name: Verify D1 Track 3 invariants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RUN_ID="$(node -e "const r=require('./staging-performance.json');process.stdout.write(r.runId)")"
          SQL="SELECT (SELECT COUNT(*) FROM canonical_bookings WHERE idempotency_key LIKE '${RUN_ID}:booking:%') bookings,(SELECT COUNT(*) FROM booking_payments WHERE booking_id IN (SELECT id FROM canonical_bookings WHERE idempotency_key LIKE '${RUN_ID}:booking:%')) payments,(SELECT COUNT(*) FROM scheduling_assignment_decisions WHERE group_id LIKE '${RUN_ID}:grp:%') assignments,(SELECT COUNT(*) FROM payment_gateway_events WHERE event_id='${RUN_ID}:evt:replay') webhook_events,(SELECT ROUND(COALESCE(SUM(debit),0)-COALESCE(SUM(credit),0),2) FROM finance_journal_entries) ledger_drift;"
          npx wrangler d1 execute pawspace-staging --remote --json --command "$SQL" > staging-performance-d1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const raw=JSON.parse(fs.readFileSync('staging-performance-d1.json','utf8'));const row=(Array.isArray(raw)?raw[0]:raw)?.results?.[0]||{};const n=k=>Number(row[k]??NaN);console.log(JSON.stringify(row,null,2));if(n('bookings')!==100||n('payments')!==100||n('assignments')!==100||n('webhook_events')!==1||Math.abs(n('ledger_drift'))>0.000001)process.exit(1);
          NODE
      - name: Enforce Track 3 thresholds
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('staging-performance.json','utf8'));const failures=p.failures||[];const lockOr500=failures.filter(x=>/\b500\b|SQLITE_BUSY|database (?:table )?is locked|cannot start a transaction within a transaction/i.test(String(x.error||'')));const p95=Number(p.metrics?.p95Ms??p.metrics?.p95??NaN);const errorRate=Number(p.metrics?.errorRate??NaN);console.log(JSON.stringify({failureCount:failures.length,lockOr500Failures:lockOr500,p95Ms:p95,errorRate,metrics:p.metrics,counts:p.counts,thresholds:p.thresholds},null,2));if(!Number.isFinite(p95)||p95>=750||!Number.isFinite(errorRate)||errorRate>=0.01||lockOr500.length||failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-track3-write-contention-remediation-v5
          path: |
            deployment.txt
            healthz-evidence.json
            staging-performance.json
            staging-performance-d1.json
          if-no-files-found: warn
