name: Profile canonical booking bottleneck exact SHA

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/staging-write-contention-remediation-v5.yml

permissions:
  contents: read

env:
  STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
  APP_SHA: 71b092d9b8045163a30d64bf8243036d8b8512a6

jobs:
  profile:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Verify exact instrumentation SHA
        run: |
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          git log -1 --pretty=%s | grep -Fx "chore(bookings): instrument canonical booking write path to isolate 20s wall-time bottleneck"
      - name: Focused validation
        run: |
          node --experimental-strip-types --test tests/uat-scheduling-d1-contention.test.mjs tests/scheduling-reservation-leases.test.mjs
          npm run typecheck
          npm run build
      - name: Configure isolated staging
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs
      - name: Deploy exact instrumentation SHA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/staging-profile-secrets.json"; export SECRETS_FILE
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';const required=['PAWSPACE_UAT_ACCESS_CODE','PAWSPACE_UAT_SIGNING_KEY','PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT','RAZORPAY_WEBHOOK_SECRET_SANDBOX'];const optional=['RAZORPAY_KEY_ID_SANDBOX','RAZORPAY_KEY_SECRET_SANDBOX'];const values=Object.fromEntries(required.map(n=>[n,process.env[n]||'']));if(Object.values(values).some(v=>!v))throw new Error('required Track 3 staging secret missing');for(const n of optional)if(process.env[n])values[n]=process.env[n];values.PAWSPACE_STAGING_LIVE_CUSTOMER_OTP='false';writeFileSync(process.env.SECRETS_FILE,JSON.stringify(values),{mode:0o600});
          NODE
          npx wrangler deploy --message "profile $APP_SHA" --secrets-file "$SECRETS_FILE" 2>&1 | tee deployment.txt
      - name: Verify staging isolation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
        run: node tests/e2e/staging-certification.mjs --isolation-only
      - name: Seed deterministic staging identities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p scripts/ops
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-role-seed.mjs > scripts/ops/staging-role-seed.mjs
          node --experimental-strip-types scripts/ops/staging-role-seed.mjs "$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --file="$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --file=scripts/employee-seed.sql
      - name: Start Worker tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          nohup npx wrangler tail pawspace-staging --format json > worker-tail.log 2>&1 &
          echo $! > worker-tail.pid
          sleep 5
      - name: Run gate through canonical booking failure
        continue-on-error: true
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          PERF_RUN_ID: booking-profile-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p scripts/ops
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-performance-gate.mjs > scripts/ops/staging-performance-gate.mjs
          node scripts/ops/staging-performance-gate.mjs 2>&1 | tee gate.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Stop tail and summarize timings
        if: always()
        run: |
          test ! -f worker-tail.pid || kill "$(cat worker-tail.pid)" 2>/dev/null || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const text=fs.existsSync('worker-tail.log')?fs.readFileSync('worker-tail.log','utf8'):'';const records=[];for(const line of text.split('\n')){if(!line.includes('canonical_booking_stage'))continue;for(const match of line.matchAll(/\{[^\n]*"event":"canonical_booking_stage"[^\n]*\}/g)){try{records.push(JSON.parse(match[0]))}catch{}}}const grouped={};for(const r of records){const k=r.stage||'unknown';(grouped[k]??=[]).push(Number(r.durationMs||0));}const summary={records:records.length,stages:{}};for(const [stage,values] of Object.entries(grouped)){values.sort((a,b)=>a-b);summary.stages[stage]={count:values.length,min:values[0]??0,p50:values[Math.floor(values.length*.5)]??0,p95:values[Math.min(values.length-1,Math.floor(values.length*.95))]??0,max:values.at(-1)??0};}fs.writeFileSync('booking-profile-summary.json',JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-booking-profile-${{ github.run_id }}
          path: |
            deployment.txt
            worker-tail.log
            gate.log
            booking-profile-summary.json
            staging-performance.json
            staging-performance-d1.json
          if-no-files-found: ignore
