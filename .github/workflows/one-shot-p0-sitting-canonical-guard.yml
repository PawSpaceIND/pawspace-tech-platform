name: One-shot P0 Sitting canonical guard

on:
  push:
    branches:
      - testfix/master-zero-gap-20260824
    paths:
      - .github/workflows/one-shot-p0-sitting-canonical-guard.yml

permissions:
  contents: write

concurrency:
  group: one-shot-p0-sitting-canonical-guard
  cancel-in-progress: false

jobs:
  apply-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: testfix/master-zero-gap-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Retire the ungoverned canonical Pet Sitting path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          route = Path('app/api/canonical-bookings/route.ts')
          text = route.read_text()
          old = 'const input=await request.json() as LifecycleInput;const problem=validate(input);if(problem)return json({error:problem},400);const db=await database();'
          new = 'const input=await request.json() as LifecycleInput;const problem=validate(input);if(problem)return json({error:problem},400);if(input.serviceCode==="pet_sitting")return json({error:"Pet Sitting bookings must use the governed /api/sitting-bookings route"},409);const db=await database();'
          if old not in text:
              raise SystemExit('canonical POST insertion point changed; refusing an unreviewed patch')
          if new in text:
              raise SystemExit('canonical Pet Sitting guard already exists unexpectedly')
          route.write_text(text.replace(old, new, 1))

          worker = Path('tests/booking-fanout-atomicity-worker.ts')
          w = worker.read_text()
          replacements = [
              ('"pet_sitting"', '"grooming"', 2),
              ('"atomicity_visit"', '"dog-bath"', 1),
              ('"Atomicity Sitting Visit"', '"Dog Bath"', 1),
              ('totalAmount:1200,amountDueNow:1200', 'totalAmount:1349,amountDueNow:1349', 1),
          ]
          for old_value, new_value, expected in replacements:
              actual = w.count(old_value)
              if actual != expected:
                  raise SystemExit(f'{worker}: expected {expected} occurrence(s) of {old_value!r}, found {actual}')
              w = w.replace(old_value, new_value)
          worker.write_text(w)
          PY
          cat > tests/canonical-sitting-route-guard.test.mjs <<'TEST'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { DatabaseSync } from "node:sqlite";
          import { installWorkersHooks } from "./helpers/module-hooks.mjs";

          installWorkersHooks("__CANONICAL_SITTING_GUARD_DB__", "__CANONICAL_SITTING_GUARD_ENV__");

          function makeD1(sqlite) {
            const statement = (sql, args) => ({
              bind: (...bound) => statement(sql, bound),
              first: async () => sqlite.prepare(sql).get(...args) ?? null,
              run: async () => {
                const info = sqlite.prepare(sql).run(...args);
                return { success: true, meta: { changes: Number(info.changes) } };
              },
              all: async () => ({ results: sqlite.prepare(sql).all(...args) }),
            });
            return {
              prepare: (sql) => statement(sql, []),
              batch: async (items) => {
                const results = [];
                for (const item of items) results.push(await item.run());
                return results;
              },
              exec: async (sql) => {
                sqlite.exec(sql);
                return { count: 0, duration: 0 };
              },
            };
          }

          function snapshot(sqlite) {
            return sqlite.prepare("SELECT type,name,tbl_name,sql FROM sqlite_master ORDER BY type,name").all();
          }

          function payload(totalAmount) {
            const start = new Date(Date.now() + 48 * 60 * 60_000);
            const end = new Date(start.getTime() + 12 * 60 * 60_000);
            return {
              idempotencyKey: `unguarded-sitting-${totalAmount}`,
              scheduleGroupId: `unguarded-sitting-group-${totalAmount}`,
              customer: {
                id: "CUS-SITTING-GUARD",
                name: "Sitting Guard Customer",
                primaryPhone: "+919999111122",
                email: "sitting.guard@pawspace.test",
              },
              pets: [{
                sourceId: "PET-SITTING-GUARD",
                name: "Guard Dog",
                species: "dog",
                breed: "Indie",
                vaccinationStatus: "verified",
              }],
              cityId: "blr",
              zoneId: "blr-east",
              serviceCode: "pet_sitting",
              packageCode: "free-plan",
              packageName: "Caller invented package",
              scheduledStart: start.toISOString(),
              scheduledEnd: end.toISOString(),
              provider: {
                id: "sit_guard_provider",
                name: "Guard Provider",
                model: "commission",
              },
              totalAmount,
              amountDueNow: totalAmount,
              payment: {
                method: "card",
                mode: "prepaid",
                status: "captured",
                detail: "caller supplied money",
              },
              pricing: { discount: 0, requirements: [] },
            };
          }

          for (const amount of [0, 1]) {
            test(`canonical bookings refuses client-priced Pet Sitting at Rs ${amount} without touching persistence`, async () => {
              const sqlite = new DatabaseSync(":memory:");
              globalThis.__CANONICAL_SITTING_GUARD_DB__ = makeD1(sqlite);
              globalThis.__CANONICAL_SITTING_GUARD_ENV__ = {};
              const before = snapshot(sqlite);
              const route = await import("../app/api/canonical-bookings/route.ts");
              const response = await route.POST(new Request("http://localhost/api/canonical-bookings", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(payload(amount)),
              }));
              const text = await response.text();
              assert.equal(response.status, 409, text);
              assert.equal(response.headers.get("cache-control"), "no-store");
              assert.deepEqual(JSON.parse(text), {
                error: "Pet Sitting bookings must use the governed /api/sitting-bookings route",
              });
              assert.deepEqual(snapshot(sqlite), before,
                "the retired path must not create security, booking, payment, work-order, lifecycle, scheduling, or quote tables");
            });
          }
          TEST
          git diff --check
      - name: Run the new regression and adjacent canonical journeys
        run: >-
          node --experimental-strip-types --test
          tests/canonical-sitting-route-guard.test.mjs
          tests/canonical-bookings-gateway-authorization.test.mjs
          tests/grooming-golden-journey.test.mjs
          tests/ptja-identity-spine.test.mjs
      - name: Prove the converted fanout atomicity Worker when its Wrangler config exists
        shell: bash
        run: |
          set -euo pipefail
          config=$(grep -rl --include='wrangler*.jsonc' 'booking-fanout-atomicity-worker.ts' . | head -n 1 || true)
          if [ -z "$config" ]; then
            echo 'No dedicated fanout atomicity Wrangler config; Release CI typecheck and tracked tests remain authoritative.'
            exit 0
          fi
          rm -rf .fanout-atomicity
          npx wrangler dev --config "$config" --persist-to .fanout-atomicity --port 8799 > /tmp/fanout-atomicity.log 2>&1 &
          worker_pid=$!
          trap 'cat /tmp/fanout-atomicity.log; kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8799/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          status=$(curl -sS -o /tmp/fanout-result.json -w '%{http_code}' http://127.0.0.1:8799/run)
          cat /tmp/fanout-result.json
          test "$status" = 200
          node -e "const r=require('/tmp/fanout-result.json');if(!r.ok||!r.fanoutRolledBack)throw Error(r.error||'fanout atomicity proof failed')"
      - run: npm run typecheck
      - name: Commit the regression and product correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-p0-sitting-canonical-guard.yml
          git add app/api/canonical-bookings/route.ts tests/canonical-sitting-route-guard.test.mjs tests/booking-fanout-atomicity-worker.ts
          git config user.name "PawSpace zero-gap fixer"
          git config user.email "actions@pawspace.in"
          git commit -m "fix(sitting): retire ungoverned canonical booking path"
          git push origin HEAD:testfix/master-zero-gap-20260824
