name: restore-ai-orchestrator-ai02
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/audio-needs-led-successor-20261002-7b15c95
          fetch-depth: 0
      - name: Restore orchestrator from pre-placeholder tip and apply AI-02 gate
        run: |
          set -euo pipefail
          GOOD=754ac3663356f2d3decf5e48bdd3122160fec966
          git show "$GOOD:lib/ai-conversation-orchestrator.ts" > lib/ai-conversation-orchestrator.ts
          python3 <<'PY'
          from pathlib import Path
          path = Path('lib/ai-conversation-orchestrator.ts')
          text = path.read_text()
          old = ' const readOnlyServiceInfo=isSalesInformationQuestion(input)||( /\\b(?:information|details?|pricing|prices?|costs?|packages?)\\b/.test(text)&&/\\b(?:grooming|boarding|sitting|training|taxi|food|walking|relocation|funeral|memorial)\\b/.test(text));\n if(readOnlyServiceInfo)return{intent:"service_info",confidence:0.9,confidenceBasis:"keyword_heuristic_sandbox",signals:["service_information_request"],policyRisk:false};'
          new = ''' // Catalogue/service evidence is required: isSalesInformationQuestion alone matches bare "pay"\n // account questions (AI-02), which must stay unknown for authenticated chat model-first routing.\n const catalogueService=/\\b(?:grooming|boarding|sitting|training|taxi|food|walking|relocation|funeral|memorial)\\b/.test(text);\n const readOnlyServiceInfo=catalogueService&&(isSalesInformationQuestion(input)||/\\b(?:information|details?|pricing|prices?|costs?|packages?)\\b/.test(text));\n if(readOnlyServiceInfo)return{intent:"service_info",confidence:0.9,confidenceBasis:"keyword_heuristic_sandbox",signals:["service_information_request"],policyRisk:false};'''
          if old not in text:
              raise SystemExit('AI-02 patch target not found in restored file')
          path.write_text(text.replace(old, new, 1))
          assert 'catalogueService' in path.read_text()
          print('patched ok', path.stat().st_size)
          PY
          rm -f tmp/mcp-size-probe.txt
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add lib/ai-conversation-orchestrator.ts
          git add -u tmp/mcp-size-probe.txt || true
          git commit -m "fix(ai): restore orchestrator and gate service_info for AI-02"
          git push origin HEAD:integration/audio-needs-led-successor-20261002-7b15c95
