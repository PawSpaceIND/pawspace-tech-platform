name: Deploy WhatsApp UAT staging

# Narrow, staging-only deployment path for Meta WhatsApp UAT.
# The full staging workflow is intentionally unchanged and still fails closed on Exotel.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "whatsapp-uat" to confirm the isolated Meta WhatsApp staging deploy'
        required: true
        default: ''
      expected_sha:
        description: 'Exact 40-character application commit sha to deploy'
        required: true
        default: ''
  push:
    branches:
      - fix/whatsapp-uat-staging-deploy-isolation
    paths:
      - .github/workflows/deploy-whatsapp-uat-staging.yml
      - tests/whatsapp-uat-staging-deploy-isolation.test.mjs

permissions:
  contents: read

jobs:
  deploy-whatsapp-uat:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'whatsapp-uat') || (github.event_name == 'push' && github.ref == 'refs/heads/fix/whatsapp-uat-staging-deploy-isolation') }}
    runs-on: ubuntu-latest
    concurrency: pawspace-staging-deploy
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.expected_sha || '939620de0b7b904a4720f41a9ba301e03747b6c4' }}
      EXPECTED_STAGING_ORIGIN: https://pawspace-staging.karthik-fce.workers.dev

    steps:
      - name: Check deployment workflow contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove WhatsApp isolation and full-stage Exotel fail-closed contract
        run: node --test tests/whatsapp-uat-staging-deploy-isolation.test.mjs tests/exotel-deployment-wiring.test.mjs

      - name: Check out exact WhatsApp gateway application SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact application checkout and clean tree
        run: |
          set -euo pipefail
          case "$TARGET_SHA" in *[!0-9a-f]* | "" ) exit 1 ;; esac
          [ "${#TARGET_SHA}" -eq 40 ]
          [ "$(git rev-parse HEAD)" = "$TARGET_SHA" ]
          [ -z "$(git status --porcelain)" ]
          echo "Exact application SHA verified."
      - name: Install
        run: npm run install:ci
      - name: Re-run focused external webhook regression
        run: node --test tests/external-webhook-reachability.test.mjs
      - name: Build exact application SHA
        run: npm run build

      - name: Configure isolated staging artifact
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs

      - name: Recover Meta UAT identifiers from staging version history without printing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LIST="$RUNNER_TEMP/versions.json"
          IDS="$RUNNER_TEMP/version-ids.txt"
          RECOVERED="$RUNNER_TEMP/recovered-meta-identifiers.json"
          VIEW="$RUNNER_TEMP/version-view.json"
          BULK_LOG="$RUNNER_TEMP/secret-bulk.log"
          export LIST IDS RECOVERED VIEW
          trap 'rm -f "$LIST" "$IDS" "$RECOVERED" "$VIEW" "$BULK_LOG"' EXIT
          if ! npx wrangler versions list --name pawspace-staging --json > "$LIST" 2>/dev/null; then
            echo "Unable to enumerate staging version history; raw output withheld." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const payload=JSON.parse(readFileSync(process.env.LIST,"utf8"));
          const rows=Array.isArray(payload)?payload:Array.isArray(payload?.versions)?payload.versions:Array.isArray(payload?.items)?payload.items:[];
          const ids=rows.map(row=>String(row?.id||row?.version_id||"").trim()).filter(id=>/^[0-9a-f-]{32,36}$/i.test(id)).slice(0,40);
          if(!ids.length)throw new Error("No staging version IDs were returned");
          writeFileSync(process.env.IDS,ids.join("\n"),{mode:0o600});
          NODE
          while IFS= read -r VERSION_ID; do
            [ -n "$VERSION_ID" ] || continue
            if ! npx wrangler versions view "$VERSION_ID" --name pawspace-staging --json > "$VIEW" 2>/dev/null; then continue; fi
            if VERSION_ID="$VERSION_ID" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from "node:fs";
          if(existsSync(process.env.RECOVERED))process.exit(0);
          const root=JSON.parse(readFileSync(process.env.VIEW,"utf8"));
          const findBindings=value=>{
            if(!value||typeof value!=="object")return null;
            if(Array.isArray(value.bindings))return value.bindings;
            for(const child of Object.values(value)){const found=findBindings(child);if(found)return found;}
            return null;
          };
          const bindings=findBindings(root)||[];
          const get=name=>{
            const row=bindings.find(item=>item&&item.name===name&&item.type==="plain_text");
            return String(row?.text??row?.value??"").trim();
          };
          const phoneId=get("META_WHATSAPP_PHONE_NUMBER_ID"),wabaId=get("META_WHATSAPP_WABA_ID");
          if(!/^\d{5,}$/.test(phoneId)||!/^\d{5,}$/.test(wabaId))process.exit(0);
          writeFileSync(process.env.RECOVERED,JSON.stringify({META_WHATSAPP_PHONE_NUMBER_ID:phoneId,META_WHATSAPP_WABA_ID:wabaId}),{mode:0o600});
          NODE
            then :; fi
            [ -f "$RECOVERED" ] && break
          done < "$IDS"
          if [ ! -s "$RECOVERED" ]; then
            echo "Historical staging versions do not contain both recoverable Meta identifiers; values were not exposed." >&2
            exit 1
          fi
          if ! npx wrangler secret bulk "$RECOVERED" --name pawspace-staging > "$BULK_LOG" 2>&1; then
            echo "Recovered Meta identifier installation failed; raw output withheld." >&2
            exit 1
          fi
          echo "Recovered both Meta staging identifiers and stored them as encrypted Worker secrets; values withheld."

      - name: Confirm complete Meta UAT configuration before gateway redeploy
        env:
          STAGING_URL: ${{ env.EXPECTED_STAGING_ORIGIN }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||"").replace(/\/$/,"");
          const login=await fetch(`${base}/api/staging-login`,{method:"POST",redirect:"manual",headers:{"content-type":"application/json",origin:base},body:JSON.stringify({action:"login",code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||""),email:"founder@pawspace.in"}),signal:AbortSignal.timeout(15000)});
          const cookie=String(login.headers.get("set-cookie")||"").split(";")[0];
          if(!(login.status>=200&&login.status<400&&cookie))throw new Error(`staging founder sign-in failed (HTTP ${login.status})`);
          const readiness=await fetch(`${base}/api/integration-readiness`,{headers:{cookie},signal:AbortSignal.timeout(15000)});
          let payload=null;try{payload=await readiness.json()}catch{}
          const modules=payload?.uatSandbox?.modules||payload?.data?.uatSandbox?.modules||[];
          const meta=Array.isArray(modules)?modules.find(module=>module?.code==="meta_whatsapp"):null;
          if(!(readiness.ok&&meta?.configuredForExternalTest===true))throw new Error(`Meta WhatsApp Worker configuration is incomplete (blocker count ${Array.isArray(meta?.blockers)?meta.blockers.length:-1}); values withheld`);
          console.log("Meta WhatsApp UAT Worker configuration is complete; values withheld.");
          NODE

      - name: Record current staging rollback reference
        id: rollback
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --name pawspace-staging > "$RUNNER_TEMP/rollback-reference.txt" 2>&1 || true
          REFERENCE="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/rollback-reference.txt" | tail -n 1 || true)"
          rm -f "$RUNNER_TEMP/rollback-reference.txt"
          [ -n "$REFERENCE" ] || REFERENCE="pre-whatsapp-uat-redeploy"
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          echo "Rollback reference recorded; binding details withheld."

      - name: Deploy exact SHA to pawspace-staging for WhatsApp UAT
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/pawspace-whatsapp-uat-secrets.json"
          DEPLOY_LOG="$RUNNER_TEMP/wrangler-deploy.log"
          export SECRETS_FILE
          trap 'rm -f "$SECRETS_FILE" "$DEPLOY_LOG"' EXIT
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const names=["PAWSPACE_UAT_ACCESS_CODE","PAWSPACE_UAT_SIGNING_KEY","PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT"];
          const values=Object.fromEntries(names.map(name=>[name,String(process.env[name]||"")]));
          if(Object.values(values).some(value=>!value))throw new Error("a required core staging UAT secret is missing");
          values.PAWSPACE_STAGING_LIVE_CUSTOMER_OTP="false";
          const token=String(process.env.META_WHATSAPP_UAT_ACCESS_TOKEN||"").trim();if(token)values.META_WHATSAPP_UAT_ACCESS_TOKEN=token;
          writeFileSync(process.env.SECRETS_FILE,JSON.stringify(values),{mode:0o600});
          NODE
          if ! npx wrangler deploy --keep-vars --message "staging $TARGET_SHA" --secrets-file "$SECRETS_FILE" > "$DEPLOY_LOG" 2>&1; then
            echo "Wrangler staging deploy failed; raw output withheld." >&2; exit 1
          fi
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$DEPLOY_LOG" | tail -n 1 || true)"
          if [ "$URL" != "$EXPECTED_STAGING_ORIGIN" ]; then echo "Unexpected staging origin; raw output withheld." >&2; exit 1; fi
          echo "staging_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Exact gateway SHA deployed to pawspace-staging with existing bindings preserved."

      - name: Certify exact live SHA, worker and isolated D1
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ env.TARGET_SHA }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
        run: node tests/e2e/staging-certification.mjs --isolation-only

      - name: Prove health, public gateway reachability and invalid-signature rejection
        env:
          STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const base=String(process.env.STAGING_URL||"").replace(/\/$/,"");
          const health=await fetch(`${base}/healthz`,{redirect:"manual",signal:AbortSignal.timeout(15000)});if(health.status!==200)throw new Error(`healthz failed with HTTP ${health.status}`);
          const noChallenge=await fetch(`${base}/api/whatsapp/meta-webhook`,{redirect:"manual",signal:AbortSignal.timeout(15000)});if(noChallenge.status!==403)throw new Error(`Meta webhook did not reach its own GET verifier (HTTP ${noChallenge.status})`);
          const invalid=await fetch(`${base}/api/whatsapp/meta-webhook`,{method:"POST",redirect:"manual",headers:{"content-type":"application/json","x-hub-signature-256":"sha256=invalid-uat-probe"},body:JSON.stringify({object:"whatsapp_business_account",entry:[]}),signal:AbortSignal.timeout(15000)});if(invalid.status!==401)throw new Error(`invalid Meta signature was not rejected (HTTP ${invalid.status})`);
          writeFileSync("whatsapp-uat-deploy-evidence.json",JSON.stringify({targetSha:process.env.TARGET_SHA,worker:"pawspace-staging",healthz:200,webhookReachedRouteVerifier:true,invalidSignatureRejected:true,productionTouched:false},null,2));
          console.log("healthz=200; Meta webhook bypasses staging-login; invalid signature rejected.");
          NODE

      - name: Verify Meta configuration and synchronize only allow-listed templates
        env:
          STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync,writeFileSync } from "node:fs";
          const base=String(process.env.STAGING_URL||"").replace(/\/$/,"");
          const login=await fetch(`${base}/api/staging-login`,{method:"POST",redirect:"manual",headers:{"content-type":"application/json",origin:base},body:JSON.stringify({action:"login",code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||""),email:"founder@pawspace.in"}),signal:AbortSignal.timeout(15000)});
          const cookie=String(login.headers.get("set-cookie")||"").split(";")[0];if(!(login.status>=200&&login.status<400&&cookie))throw new Error(`staging sign-in failed (HTTP ${login.status})`);
          const readiness=await fetch(`${base}/api/integration-readiness`,{headers:{cookie},signal:AbortSignal.timeout(15000)});let rp=null;try{rp=await readiness.json()}catch{};
          const modules=rp?.uatSandbox?.modules||rp?.data?.uatSandbox?.modules||[];const meta=Array.isArray(modules)?modules.find(m=>m?.code==="meta_whatsapp"):null;if(!(readiness.ok&&meta?.configuredForExternalTest===true))throw new Error("Meta Worker configuration became incomplete");
          const sync=await fetch(`${base}/api/whatsapp/meta-admin`,{method:"POST",headers:{"content-type":"application/json",origin:base,cookie},body:JSON.stringify({action:"sync_templates"}),signal:AbortSignal.timeout(30000)});let sp=null;try{sp=await sync.json()}catch{};if(!(sync.ok&&sp?.data?.status==="synced"&&Number(sp?.data?.synced||0)>0))throw new Error(`Meta template sync failed closed (HTTP ${sync.status})`);
          const admin=await fetch(`${base}/api/whatsapp/meta-admin`,{headers:{cookie},signal:AbortSignal.timeout(15000)});let ap=null;try{ap=await admin.json()}catch{};const approved=Array.isArray(ap?.data?.templates)?ap.data.templates.filter(t=>t?.status==="approved"):[];if(!admin.ok||approved.length<1)throw new Error("no allow-listed Meta template is approved");
          const path="whatsapp-uat-deploy-evidence.json",e=JSON.parse(readFileSync(path,"utf8"));e.metaWorkerConfigurationPresent=true;e.allowlistedTemplateSyncSucceeded=true;e.approvedTemplateCount=approved.length;writeFileSync(path,JSON.stringify(e,null,2));
          console.log(`Meta configuration complete; ${approved.length} allow-listed approved template(s) validated; names withheld.`);
          NODE

      - name: Upload sanitized WhatsApp UAT deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-uat-deploy-${{ env.TARGET_SHA }}
          path: whatsapp-uat-deploy-evidence.json
          if-no-files-found: warn
