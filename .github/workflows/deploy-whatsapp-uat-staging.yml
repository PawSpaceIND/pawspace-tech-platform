name: Deploy WhatsApp UAT staging

# Narrow, staging-only deployment path for Meta WhatsApp UAT. This workflow deliberately does NOT
# relax the full staging deploy: .github/workflows/deploy-staging.yml continues to require the complete
# Exotel voice credential set. This path exists only so a WhatsApp-only UAT deploy is not blocked by
# unrelated voice credentials.
#
# The workflow definition may run from the isolated workflow branch, but the application artifact is
# always checked out at TARGET_SHA and verified before deployment. The branch-only push trigger is
# intentionally narrow so this one isolated workflow can be exercised without changing main.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "whatsapp-uat" to confirm the isolated Meta WhatsApp staging deploy'
        required: true
        default: ''
      expected_sha:
        description: 'Exact 40-character application commit sha to deploy'
        required: true
        default: ''
  push:
    branches:
      - fix/whatsapp-uat-staging-deploy-isolation
    paths:
      - .github/workflows/deploy-whatsapp-uat-staging.yml
      - tests/whatsapp-uat-staging-deploy-isolation.test.mjs

jobs:
  deploy-whatsapp-uat:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'whatsapp-uat') || (github.event_name == 'push' && github.ref == 'refs/heads/fix/whatsapp-uat-staging-deploy-isolation') }}
    runs-on: ubuntu-latest
    concurrency: pawspace-staging-deploy
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.expected_sha || '939620de0b7b904a4720f41a9ba301e03747b6c4' }}
      EXPECTED_STAGING_ORIGIN: https://pawspace-staging.karthik-fce.workers.dev

    steps:
      - name: Check deployment workflow contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove WhatsApp isolation and full-stage Exotel fail-closed contract
        run: node --test tests/whatsapp-uat-staging-deploy-isolation.test.mjs tests/exotel-deployment-wiring.test.mjs

      - name: Check out exact WhatsApp gateway application SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact application checkout and clean tree
        run: |
          set -euo pipefail
          case "$TARGET_SHA" in
            *[!0-9a-f]* | "" ) echo "TARGET_SHA must be an exact 40-character commit sha." >&2; exit 1 ;;
          esac
          if [ "${#TARGET_SHA}" -ne 40 ]; then
            echo "TARGET_SHA must be an exact 40-character commit sha." >&2
            exit 1
          fi
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$TARGET_SHA" ]; then
            echo "checkout does not match TARGET_SHA; refusing to deploy." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "working tree is dirty; refusing to deploy." >&2
            exit 1
          fi
      - name: Install
        run: npm run install:ci
      - name: Re-run focused external webhook regression
        run: node --test tests/external-webhook-reachability.test.mjs
      - name: Build exact application SHA
        run: npm run build

      - name: Configure isolated staging artifact
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs

      - name: Record current staging rollback reference
        id: rollback
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx wrangler deployments list --name pawspace-staging > "$RUNNER_TEMP/rollback-reference.txt" 2>&1; then
            REFERENCE="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/rollback-reference.txt" | tail -n 1 || true)"
          else
            REFERENCE=""
          fi
          if [ -z "$REFERENCE" ]; then REFERENCE="first-staging-deploy"; fi
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          echo "Rollback target recorded; account details withheld."

      - name: Deploy exact SHA to pawspace-staging for WhatsApp UAT
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/pawspace-whatsapp-uat-secrets.json"
          export SECRETS_FILE
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const requiredNames = [
            "PAWSPACE_UAT_ACCESS_CODE",
            "PAWSPACE_UAT_SIGNING_KEY",
            "PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT",
          ];
          const required = Object.fromEntries(requiredNames.map(name => [name, String(process.env[name] || "")]));
          if (Object.values(required).some(value => !value)) throw new Error("a required core staging UAT secret is missing");
          const values = { ...required, PAWSPACE_STAGING_LIVE_CUSTOMER_OTP: "false" };
          const metaToken = String(process.env.META_WHATSAPP_UAT_ACCESS_TOKEN || "").trim();
          if (metaToken) values.META_WHATSAPP_UAT_ACCESS_TOKEN = metaToken;
          writeFileSync(process.env.SECRETS_FILE, JSON.stringify(values), { mode: 0o600 });
          NODE
          # Wrangler preserves encrypted Worker secrets absent from --secrets-file. Therefore Meta values
          # configured directly on pawspace-staging remain untouched; this workflow never tries to read them.
          npx wrangler deploy --message "staging $TARGET_SHA" --secrets-file "$SECRETS_FILE" 2>&1 | tee "$RUNNER_TEMP/whatsapp-uat-deployment.txt"
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/whatsapp-uat-deployment.txt" | tail -n 1 || true)"
          if [ -z "$URL" ] || [ "$URL" != "$EXPECTED_STAGING_ORIGIN" ]; then
            echo "deployment did not resolve to the certified pawspace-staging origin; refusing to continue." >&2
            exit 1
          fi
          echo "staging_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Certify exact live SHA, worker and isolated D1 before runtime UAT probes
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ env.TARGET_SHA }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
        run: node tests/e2e/staging-certification.mjs --isolation-only

      - name: Prove health, public gateway reachability and invalid-signature rejection
        env:
          STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const base = String(process.env.STAGING_URL || "").replace(/\/$/, "");
          if (!base) throw new Error("staging URL is unavailable");
          const health = await fetch(`${base}/healthz`, { redirect: "manual", signal: AbortSignal.timeout(15000) });
          if (health.status !== 200) throw new Error(`healthz failed with HTTP ${health.status}`);
          const noChallenge = await fetch(`${base}/api/whatsapp/meta-webhook`, { redirect: "manual", signal: AbortSignal.timeout(15000) });
          if (noChallenge.status !== 403) throw new Error(`Meta webhook did not reach its own GET verifier (HTTP ${noChallenge.status})`);
          const invalidSignature = await fetch(`${base}/api/whatsapp/meta-webhook`, {
            method: "POST",
            redirect: "manual",
            headers: { "content-type": "application/json", "x-hub-signature-256": "sha256=invalid-uat-probe" },
            body: JSON.stringify({ object: "whatsapp_business_account", entry: [] }),
            signal: AbortSignal.timeout(15000),
          });
          if (invalidSignature.status !== 401) throw new Error(`invalid Meta signature was not rejected (HTTP ${invalidSignature.status})`);
          const evidence = {
            targetSha: process.env.TARGET_SHA,
            worker: "pawspace-staging",
            healthz: 200,
            webhookReachedRouteVerifier: true,
            invalidSignatureRejected: true,
            productionTouched: false,
          };
          writeFileSync("whatsapp-uat-deploy-evidence.json", JSON.stringify(evidence, null, 2));
          console.log("Staging health is 200; Meta webhook bypasses staging-login and rejects an invalid signature at the route boundary.");
          NODE

      - name: Verify Meta Worker configuration presence and synchronize only allow-listed templates
        env:
          STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const base = String(process.env.STAGING_URL || "").replace(/\/$/, "");
          const code = String(process.env.PAWSPACE_UAT_ACCESS_CODE || "");
          if (!base || !code) throw new Error("staging authentication prerequisite is missing");
          const login = await fetch(`${base}/api/staging-login`, {
            method: "POST",
            redirect: "manual",
            headers: { "content-type": "application/json", origin: base },
            body: JSON.stringify({ action: "login", code, email: "founder@pawspace.in" }),
            signal: AbortSignal.timeout(15000),
          });
          const cookie = String(login.headers.get("set-cookie") || "").split(";")[0];
          if (!(login.status >= 200 && login.status < 400 && cookie)) throw new Error(`staging founder sign-in failed (HTTP ${login.status})`);

          const readiness = await fetch(`${base}/api/integration-readiness`, {
            headers: { cookie },
            signal: AbortSignal.timeout(15000),
          });
          let readinessPayload = null;
          try { readinessPayload = await readiness.json(); } catch {}
          const modules = readinessPayload?.uatSandbox?.modules || readinessPayload?.data?.uatSandbox?.modules || [];
          const meta = Array.isArray(modules) ? modules.find(module => module?.code === "meta_whatsapp") : null;
          if (!(readiness.ok && meta?.configuredForExternalTest === true)) {
            const blockerCount = Array.isArray(meta?.blockers) ? meta.blockers.length : -1;
            throw new Error(`Meta WhatsApp Worker configuration is incomplete (blocker count ${blockerCount}); values withheld`);
          }

          const sync = await fetch(`${base}/api/whatsapp/meta-admin`, {
            method: "POST",
            headers: { "content-type": "application/json", origin: base, cookie },
            body: JSON.stringify({ action: "sync_templates" }),
            signal: AbortSignal.timeout(30000),
          });
          let syncPayload = null;
          try { syncPayload = await sync.json(); } catch {}
          const result = syncPayload?.data;
          if (!(sync.ok && result?.status === "synced" && Number(result?.synced || 0) > 0)) {
            throw new Error(`Meta template synchronization did not produce an allow-listed template (HTTP ${sync.status}); values withheld`);
          }

          const admin = await fetch(`${base}/api/whatsapp/meta-admin`, { headers: { cookie }, signal: AbortSignal.timeout(15000) });
          let adminPayload = null;
          try { adminPayload = await admin.json(); } catch {}
          const templates = adminPayload?.data?.templates;
          const approved = Array.isArray(templates) ? templates.filter(item => item?.status === "approved") : [];
          if (!admin.ok || approved.length < 1) throw new Error("no allow-listed Meta template is currently approved");

          const path = "whatsapp-uat-deploy-evidence.json";
          const evidence = JSON.parse(readFileSync(path, "utf8"));
          evidence.metaWorkerConfigurationPresent = true;
          evidence.allowlistedTemplateSyncSucceeded = true;
          evidence.approvedTemplateCount = approved.length;
          writeFileSync(path, JSON.stringify(evidence, null, 2));
          console.log(`Meta Worker configuration is present and ${approved.length} allow-listed template(s) are approved; credential and template values withheld.`);
          NODE

      - name: Upload sanitized WhatsApp UAT deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-uat-deploy-${{ env.TARGET_SHA }}
          path: whatsapp-uat-deploy-evidence.json
          if-no-files-found: warn
