name: V2 Grooming browser contract
on:
  pull_request:
    paths:
      - 'app/v2/**'
      - 'app/api/v2/**'
      - 'lib/v2/**'
      - 'lib/api-gateway.ts'
      - 'lib/session-api-gateway.ts'
      - 'lib/trusted-workspace-identity.ts'
      - 'app/api/razorpay-checkout-return/route.ts'
      - 'worker/index.ts'
      - 'tests/v2-grooming*.test.mjs'
      - 'e2e/v2-grooming.spec.ts'
      - 'playwright.v2.config.ts'
      - '.github/workflows/v2-grooming.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-grooming-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: V2 Grooming desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: staging
      NODE_ENV: test
      FORBID_PRODUCTION: 'true'
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
      PW_PORT: '4196'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Execute V2 runtime and database contracts
        run: node --experimental-strip-types --test tests/v2-grooming-checkout.test.mjs tests/v2-grooming-integration.test.mjs tests/v2-grooming-foundation.test.mjs tests/v2-grooming-worker-gateway.test.mjs
        env:
          PAWSPACE_LOCAL_PREVIEW: 'on'
          PAWSPACE_TEST_SERVICE_DISCOVERY_FIXTURE: 'on'
      - name: Run browser contracts (SDK and API fixtures, not live provider proof)
        run: npx playwright test --config=playwright.v2.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-grooming-browser-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/v2/browser-results/
            artifacts/v2/browser-report/
          retention-days: 14
