name: Atlas existing staging additive ledger
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type atlas-additive-ledger'
        required: true
      expected_sha:
        description: 'Certified existing staging SHA'
        required: true
permissions:
  contents: read
concurrency:
  group: pawspace-staging-ledger-additive
  cancel-in-progress: false
jobs:
  migrate:
    if: ${{ inputs.confirm == 'atlas-additive-ledger' && startsWith(github.ref, 'refs/heads/ops/atlas-ledger-additive-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: pawspace-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify migration protocol without network
        run: node --test scripts/ops/apply-ledger-hosted.test.mjs
      - name: Apply only reviewed additive ledger and verify retained accounting
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          EVIDENCE_PATH: atlas-additive-ledger.json
        run: node scripts/ops/apply-ledger-hosted.mjs
      - name: Upload sanitized accounting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-additive-ledger-${{ inputs.expected_sha }}
          path: atlas-additive-ledger.json
          if-no-files-found: error
          retention-days: 7
