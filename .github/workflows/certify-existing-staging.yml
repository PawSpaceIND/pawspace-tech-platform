name: Read-only normal staging restoration verification
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
      confirm:
        required: true
permissions:
  contents: read
concurrency:
  group: pawspace-staging-sweep
  cancel-in-progress: false
jobs:
  zero-model:
    if: ${{ inputs.confirm == 'read-only-normal-restore-verification' && startsWith(github.ref, 'refs/heads/ops/atlas-session-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: pawspace-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Exact approved zero-model fixture guard diagnostic
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          EVIDENCE_PATH: diagnostic-receipt.json
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/ops/atlas-session/normal-restore-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-normal-restore-verified-${{ github.sha }}
          path: diagnostic-receipt.json
          if-no-files-found: error
          retention-days: 7
