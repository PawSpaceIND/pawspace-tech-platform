name: Normal independent today TEST booking without payment instrument
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
      confirm:
        required: true
permissions:
  contents: read
concurrency:
  group: pawspace-staging-sweep
  cancel-in-progress: false
jobs:
  bounded-read:
    if: ${{ inputs.confirm == 'normal-independent-future-prepaid-finance-reserve-booking' && startsWith(github.ref, 'refs/heads/ops/atlas-session-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pawspace-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Existing credential read-only target qualification
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          EVIDENCE_PATH: finance-future-prepaid-booking-receipt.json
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/ops/atlas-session/finance-future-prepaid-booking/read-runner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-future-prepaid-booking-${{ github.sha }}
          path: finance-future-prepaid-booking-receipt.json
          if-no-files-found: error
          retention-days: 7
