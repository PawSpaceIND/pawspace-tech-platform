name: Diagnose normal staging provider login
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
      confirm:
        required: true
permissions:
  contents: read
concurrency:
  group: pawspace-staging-sweep
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ inputs.confirm == 'restore-certified-staging' && startsWith(github.ref, 'refs/heads/ops/atlas-restore-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: pawspace-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact normal staging then diagnose one provider login
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          EVIDENCE_PATH: recovery-receipt.json
        run: node scripts/ops/atlas-recovery/recover.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certified-staging-recovery-${{ github.sha }}
          path: recovery-receipt.json
          if-no-files-found: error
          retention-days: 7
