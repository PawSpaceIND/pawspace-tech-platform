name: Read finance preview diagnosis
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
      confirm:
        required: true
permissions:
  contents: read
concurrency:
  group: pawspace-staging-sweep
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ inputs.confirm == 'read-only-finance-preview-diagnosis' && startsWith(github.ref, 'refs/heads/ops/finance-network-read-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: pawspace-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read dedicated D1 cache and configured sandbox fixture flag
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVIDENCE_PATH: finance-network-receipt.json
        run: node --experimental-strip-types scripts/ops/atlas-recovery/recover.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certified-staging-recovery-${{ github.sha }}
          path: finance-network-receipt.json
          if-no-files-found: error
          retention-days: 7
