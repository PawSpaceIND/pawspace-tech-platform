name: One-shot P0 Grooming enforcement mode

on:
  push:
    branches:
      - testfix/master-zero-gap-20260824
    paths:
      - .github/workflows/one-shot-p0-grooming-enforcement-mode.yml

permissions:
  contents: write

concurrency:
  group: one-shot-p0-grooming-enforcement-mode
  cancel-in-progress: false

jobs:
  apply-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: testfix/master-zero-gap-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Reject invalid policy writes and make legacy values fail closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          route = Path('app/api/grooming-commercial-policy/route.ts')
          text = route.read_text()
          post_start = text.find('export async function POST(request:Request)')
          if post_start < 0:
              raise SystemExit('POST handler not found')
          post_end_candidates = [p for p in [text.find('export async function PATCH', post_start), text.find('export async function GET', post_start)] if p >= 0]
          post_end = min(post_end_candidates) if post_end_candidates else len(text)
          post = text[post_start:post_end]
          if 'Enforcement mode must be observe or enforce' in post:
              raise SystemExit('POST validation already exists unexpectedly')
          match = re.search(r'const\s+(\w+)\s*=\s*await\s+request\.json\(\)\s+as\s+[^;]+;', post)
          if not match:
              raise SystemExit('POST request body binding not found')
          body_name = match.group(1)
          insertion = match.end()
          validation = f'if(!["observe","enforce"].includes(String({body_name}.enforcementMode)))return Response.json({{error:"Enforcement mode must be observe or enforce"}},{{status:400,headers:{{"cache-control":"no-store"}}}});'
          post = post[:insertion] + validation + post[insertion:]
          route.write_text(text[:post_start] + post + text[post_end:])

          governance = Path('lib/grooming-policy-governance.ts')
          source = governance.read_text()
          candidates = [
              ('String(row.enforcement_mode)==="enforce"?"enforce":"observe"', 'String(row.enforcement_mode)==="observe"?"observe":"enforce"'),
              ('String(row.enforcement_mode) === "enforce" ? "enforce" : "observe"', 'String(row.enforcement_mode) === "observe" ? "observe" : "enforce"'),
              ('row.enforcement_mode==="enforce"?"enforce":"observe"', 'row.enforcement_mode==="observe"?"observe":"enforce"'),
              ('row.enforcement_mode === "enforce" ? "enforce" : "observe"', 'row.enforcement_mode === "observe" ? "observe" : "enforce"'),
          ]
          replaced = False
          for old, new in candidates:
              if old in source:
                  if source.count(old) != 1:
                      raise SystemExit(f'ambiguous enforcement mapping: {old}')
                  source = source.replace(old, new, 1)
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('permissive rowToPolicy enforcement mapping not found')
          governance.write_text(source)
          PY
          cat > tests/grooming-policy-enforcement-mode.test.mjs <<'TEST'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { DatabaseSync } from "node:sqlite";
          import { installWorkersHooks } from "./helpers/module-hooks.mjs";

          installWorkersHooks("__GROOM_POLICY_MODE_DB__", "__GROOM_POLICY_MODE_ENV__");

          function makeD1(sqlite) {
            const statement = (sql, args) => ({
              bind: (...bound) => statement(sql, bound),
              first: async () => sqlite.prepare(sql).get(...args) ?? null,
              run: async () => {
                const info = sqlite.prepare(sql).run(...args);
                return { success: true, meta: { changes: Number(info.changes) } };
              },
              all: async () => ({ results: sqlite.prepare(sql).all(...args) }),
            });
            return {
              prepare: (sql) => statement(sql, []),
              batch: async (items) => {
                const results = [];
                for (const item of items) results.push(await item.run());
                return results;
              },
              exec: async (sql) => {
                sqlite.exec(sql);
                return { count: 0, duration: 0 };
              },
            };
          }

          function world() {
            const sqlite = new DatabaseSync(":memory:");
            const db = makeD1(sqlite);
            globalThis.__GROOM_POLICY_MODE_DB__ = db;
            globalThis.__GROOM_POLICY_MODE_ENV__ = {};
            return { sqlite, db };
          }

          function policy(enforcementMode) {
            return {
              cityId: "city_blr",
              policyCode: "grooming-blr",
              enforcementMode,
              cancellationCutoffMinutes: 1440,
              refundPercentBeforeCutoff: 100,
              refundPercentAfterCutoff: 0,
              rescheduleCutoffMinutes: 1440,
              rescheduleAllowedAfterCutoff: false,
              maxReschedules: 1,
              rescheduleFeeType: "flat",
              rescheduleFeeValue: 500,
              multiPetMax: 1,
              effectiveFrom: "2026-01-01",
              reason: "City launch policy",
            };
          }

          async function createPolicy(body) {
            const route = await import("../app/api/grooming-commercial-policy/route.ts");
            return route.POST(new Request("http://localhost/api/grooming-commercial-policy", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(body),
            }));
          }

          function schema(sqlite) {
            return sqlite.prepare("SELECT type,name,tbl_name,sql FROM sqlite_master ORDER BY type,name").all();
          }

          for (const invalid of ["Enforce", "OBSERVE", "", "disabled", null]) {
            test(`CREATE rejects invalid Grooming enforcement mode ${JSON.stringify(invalid)} before persistence`, async () => {
              const { sqlite } = world();
              const before = schema(sqlite);
              const response = await createPolicy(policy(invalid));
              const text = await response.text();
              assert.equal(response.status, 400, text);
              assert.equal(response.headers.get("cache-control"), "no-store");
              assert.deepEqual(JSON.parse(text), { error: "Enforcement mode must be observe or enforce" });
              assert.deepEqual(schema(sqlite), before,
                "an invalid control value must not initialize or mutate policy storage");
            });
          }

          test("a legacy invalid persisted mode resolves to enforce rather than permissive observe", async () => {
            const { sqlite, db } = world();
            const created = await createPolicy(policy("enforce"));
            const createdText = await created.text();
            assert.equal(created.status, 201, createdText);
            const table = sqlite.prepare("SELECT name FROM sqlite_master WHERE type='table' AND name LIKE '%groom%policy%' ORDER BY name").get();
            assert.ok(table?.name, "the policy route must create its governed policy table");
            const result = sqlite.prepare(`UPDATE ${table.name} SET enforcement_mode='Enforce'`).run();
            assert.equal(Number(result.changes), 1);

            const { resolveGroomingPolicy } = await import("../lib/grooming-policy-governance.ts");
            const resolved = await resolveGroomingPolicy(db, "city_blr", "zone_1");
            assert.equal(resolved.enforcementMode, "enforce",
              "unknown legacy values must choose the strict branch and never waive refund/cancellation rules");
          });

          test("the two valid policy modes retain their explicit meaning", async () => {
            for (const mode of ["observe", "enforce"]) {
              const { db } = world();
              const created = await createPolicy({ ...policy(mode), policyCode: `grooming-${mode}` });
              const text = await created.text();
              assert.equal(created.status, 201, text);
              const { resolveGroomingPolicy } = await import("../lib/grooming-policy-governance.ts");
              const resolved = await resolveGroomingPolicy(db, "city_blr", "zone_1");
              assert.equal(resolved.enforcementMode, mode);
            }
          });
          TEST
          git diff --check
      - name: Run focused and adjacent Grooming policy regressions
        shell: bash
        run: |
          set -euo pipefail
          tests=(tests/grooming-policy-enforcement-mode.test.mjs tests/grooming-golden-journey.test.mjs)
          while IFS= read -r file; do
            case "$file" in
              tests/grooming-policy-enforcement-mode.test.mjs|tests/grooming-golden-journey.test.mjs) ;;
              *) tests+=("$file") ;;
            esac
          done < <(git ls-files 'tests/*groom*policy*.test.mjs' 'tests/*grooming*commercial*.test.mjs')
          node --experimental-strip-types --test "${tests[@]}"
      - run: npm run typecheck
      - name: Commit the P0 correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-p0-grooming-enforcement-mode.yml
          git add app/api/grooming-commercial-policy/route.ts lib/grooming-policy-governance.ts tests/grooming-policy-enforcement-mode.test.mjs
          git config user.name "PawSpace zero-gap fixer"
          git config user.email "actions@pawspace.in"
          git commit -m "fix(grooming): fail closed on invalid policy mode"
          git push origin HEAD:testfix/master-zero-gap-20260824
