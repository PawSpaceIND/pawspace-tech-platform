name: Assisted overflow diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/assisted-overflow-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Print overflowing elements at 390px
        env:
          PREVIEW_URL: https://pawspace-release-preview.karthik-fce.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const response = await page.goto(`${process.env.PREVIEW_URL}/assisted-booking`, { waitUntil: 'domcontentloaded', timeout: 12000 });
          await page.waitForTimeout(500);
          const result = await page.evaluate(() => {
            const root = document.documentElement;
            const body = document.body;
            const baseline = Math.max(root.scrollWidth, body.scrollWidth);
            const describe = (el) => {
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return {
                tag: el.tagName.toLowerCase(),
                cls: String(el.className || '').slice(0, 180),
                text: (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 100),
                left: Math.round(r.left * 100) / 100,
                right: Math.round(r.right * 100) / 100,
                width: Math.round(r.width * 100) / 100,
                clientWidth: el.clientWidth,
                scrollWidth: el.scrollWidth,
                display: s.display,
                position: s.position,
                overflowX: s.overflowX,
                marginLeft: s.marginLeft,
                marginRight: s.marginRight,
                paddingLeft: s.paddingLeft,
                paddingRight: s.paddingRight,
                boxSizing: s.boxSizing,
                depth: (() => { let n = el, d = 0; while (n?.parentElement) { d++; n = n.parentElement; } return d; })(),
              };
            };
            const all = [...document.querySelectorAll('body *')].filter((el) => {
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
            });
            const rectOverflow = all.map(describe).filter((x) => x.left < -2 || x.right > innerWidth + 2).sort((a,b) => b.right - a.right);
            const scrollContainers = all.map(describe).filter((x) => x.scrollWidth > x.clientWidth + 2).sort((a,b) => (b.scrollWidth-b.clientWidth) - (a.scrollWidth-a.clientWidth));
            const hideHits = [];
            for (const el of all) {
              const beforeStyle = el.getAttribute('style');
              el.style.setProperty('display', 'none', 'important');
              const after = Math.max(root.scrollWidth, body.scrollWidth);
              if (after < baseline) hideHits.push({ ...describe(el), documentWidthAfterHide: after, reduction: baseline - after });
              if (beforeStyle === null) el.removeAttribute('style'); else el.setAttribute('style', beforeStyle);
            }
            const pseudo = all.flatMap((el) => ['::before','::after'].map((which) => {
              const p = getComputedStyle(el, which);
              if (!p || p.content === 'none' || p.content === 'normal' || p.display === 'none') return null;
              return { ...describe(el), pseudo: which, content: p.content.slice(0,120), pseudoDisplay: p.display, pseudoPosition: p.position, pseudoWidth: p.width, pseudoLeft: p.left, pseudoRight: p.right, pseudoMarginLeft: p.marginLeft, pseudoMarginRight: p.marginRight };
            }).filter(Boolean));
            const htmlStyle = getComputedStyle(root), bodyStyle = getComputedStyle(body);
            return {
              innerWidth,
              rootClientWidth: root.clientWidth,
              rootScrollWidth: root.scrollWidth,
              bodyClientWidth: body.clientWidth,
              bodyScrollWidth: body.scrollWidth,
              html: { margin: htmlStyle.margin, padding: htmlStyle.padding, width: htmlStyle.width, overflowX: htmlStyle.overflowX },
              body: { margin: bodyStyle.margin, padding: bodyStyle.padding, width: bodyStyle.width, overflowX: bodyStyle.overflowX },
              rectOverflow: rectOverflow.slice(0, 30),
              scrollContainers: scrollContainers.slice(0, 40),
              hideHits: hideHits.sort((a,b) => b.depth-a.depth || b.reduction-a.reduction).slice(0, 60),
              pseudo: pseudo.slice(0, 60),
            };
          });
          console.log(`status=${response?.status()}`);
          console.log(JSON.stringify(result, null, 2));
          await browser.close();
          NODE
