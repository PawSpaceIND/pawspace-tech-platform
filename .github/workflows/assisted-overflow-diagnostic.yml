name: Assisted overflow diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/assisted-overflow-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prove candidate phone-header fix removes the 6px overflow
        env:
          PREVIEW_URL: https://pawspace-release-preview.karthik-fce.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const response = await page.goto(`${process.env.PREVIEW_URL}/assisted-booking`, { waitUntil: 'domcontentloaded', timeout: 12000 });
          await page.waitForTimeout(500);
          const before = await page.evaluate(() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth));
          await page.addStyleTag({ content: `
            @media (max-width:650px) {
              [class*="_shell_"] header { flex-direction:column; gap:12px; min-width:0; }
              [class*="_shell_"] header > div { min-width:0; }
              [class*="_headerMeta_"] { width:100%; min-width:0; flex-wrap:wrap; justify-content:flex-start; }
              [class*="_headerMeta_"] span,
              [class*="_headerMeta_"] button { min-width:0; max-width:100%; white-space:normal; overflow-wrap:anywhere; }
            }
          ` });
          await page.waitForTimeout(50);
          const after = await page.evaluate(() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth));
          console.log(JSON.stringify({ status: response?.status(), before, after, viewport: 390 }, null, 2));
          if (before !== 396) throw new Error(`Expected current overflow baseline 396px, got ${before}px`);
          if (after > 392) throw new Error(`Candidate CSS did not remove overflow: ${after}px > 392px tolerance`);
          await browser.close();
          NODE
