name: Guarded staging write contention remediation v4

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/staging-write-contention-remediation-v4.yml

permissions:
  contents: write

concurrency:
  group: guarded-staging-write-contention-remediation-v4
  cancel-in-progress: false

env:
  STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev

jobs:
  remediate:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Apply current-shape write remediation
        run: |
          cat > "$RUNNER_TEMP/remediate.py" <<'PY'
          from pathlib import Path

          def once(s,old,new,label):
            if old not in s: raise SystemExit(f'{label}: source anchor missing')
            return s.replace(old,new,1)

          # Bounded retry budget with randomized jitter.
          p=Path('lib/d1-write-retry.ts'); s=p.read_text()
          s=once(s,'  maxDelayMs?:number;','  maxDelayMs?:number;\n  maxTotalDelayMs?:number;','retry option')
          s=once(s,'  const attempts=Math.max(1,Math.floor(options.attempts??6));\n  const baseDelayMs=Math.max(1,Math.floor(options.baseDelayMs??10));\n  const maxDelayMs=Math.max(baseDelayMs,Math.floor(options.maxDelayMs??160));','  const attempts=Math.min(3,Math.max(1,Math.floor(options.attempts??3)));\n  const baseDelayMs=Math.min(50,Math.max(1,Math.floor(options.baseDelayMs??5)));\n  const maxDelayMs=Math.min(50,Math.max(baseDelayMs,Math.floor(options.maxDelayMs??40)));\n  const maxTotalDelayMs=Math.min(100,Math.max(0,Math.floor(options.maxTotalDelayMs??75)));','retry limits')
          s=once(s,'  const random=options.random??Math.random;\n  for(let attempt=0;attempt<attempts;attempt+=1){','  const random=options.random??Math.random;\n  let totalDelayMs=0;\n  for(let attempt=0;attempt<attempts;attempt+=1){','retry total')
          s=once(s,'      const exponential=Math.min(maxDelayMs,baseDelayMs*(2**attempt));\n      const jitter=Math.floor(Math.max(0,Math.min(0.999999,random()))*baseDelayMs);\n      await sleep(exponential+jitter);','      const exponential=Math.min(maxDelayMs,baseDelayMs*(2**attempt));\n      const floor=Math.max(1,Math.ceil(exponential/2));\n      const unit=Math.max(0,Math.min(0.999999,random()));\n      const delay=Math.min(maxDelayMs,floor+Math.floor(unit*(exponential-floor+1)));\n      if(totalDelayMs+delay>maxTotalDelayMs)throw error;\n      totalDelayMs+=delay;\n      await sleep(delay);','retry jitter')
          p.write_text(s)

          # Provider capacity/schema: coalesce in-flight first-use operations and avoid no-op seed writes.
          p=Path('lib/provider-capacity-governance.ts'); s=p.read_text()
          s=once(s,'const capacityTablesEnsured=new WeakSet<Db>();\nconst capacityDefaultsSeeded=new WeakSet<Db>();','const capacityTablesEnsured=new WeakSet<Db>();\nconst capacityDefaultsSeeded=new WeakSet<Db>();\nconst capacityTablesEnsuring=new WeakMap<Db,Promise<void>>();\nconst capacityDefaultsSeeding=new WeakMap<Db,Promise<void>>();\nconst providerBookingGuardEnsured=new WeakSet<Db>();\nconst providerBookingGuardEnsuring=new WeakMap<Db,Promise<void>>();','capacity state')
          s=once(s,'export async function ensureProviderCapacityTables(db:Db){if(capacityTablesEnsured.has(db))return;await db.batch([','export async function ensureProviderCapacityTables(db:Db){if(capacityTablesEnsured.has(db))return;const running=capacityTablesEnsuring.get(db);if(running)return running;const pending=(async()=>{const required=["provider_capacity_profiles","provider_capacity_audit","provider_assignment_offers","provider_recovery_cases","provider_performance_events","provider_unavailability","idx_provider_capacity_profiles_lookup","idx_provider_unavailability_active","idx_provider_unavailability_window","idx_provider_assignment_offers_group"];const existing=await db.prepare(`SELECT name FROM sqlite_master WHERE name IN (${required.map(()=>"?").join(",")})`).bind(...required).all<Row>();if(new Set(existing.results.map(row=>String(row.name))).size===required.length){capacityTablesEnsured.add(db);return;}await db.batch([','capacity ensure open')
          s=once(s,']);capacityTablesEnsured.add(db);}\n\nexport async function seedProviderCapacityDefaults',']);capacityTablesEnsured.add(db);})();capacityTablesEnsuring.set(db,pending);try{return await pending;}finally{if(capacityTablesEnsuring.get(db)===pending)capacityTablesEnsuring.delete(db);}}\n\nexport async function seedProviderCapacityDefaults','capacity ensure close')
          s=once(s,'export async function seedProviderCapacityDefaults(db:Db){if(capacityDefaultsSeeded.has(db))return;await ensureProviderCapacityTables(db);const now=Date.now();await db.batch(defaults.map(p=>db.prepare(','export async function seedProviderCapacityDefaults(db:Db){if(capacityDefaultsSeeded.has(db))return;const running=capacityDefaultsSeeding.get(db);if(running)return running;const pending=(async()=>{await ensureProviderCapacityTables(db);const ids=defaults.map(p=>p.id);const existing=await db.prepare(`SELECT COUNT(*) n FROM provider_capacity_profiles WHERE id IN (${ids.map(()=>"?").join(",")})`).bind(...ids).first<Row>();if(Number(existing?.n||0)===ids.length){capacityDefaultsSeeded.add(db);return;}const now=Date.now();await db.batch(defaults.map(p=>db.prepare(','capacity seed open')
          s=once(s,'now)));capacityDefaultsSeeded.add(db);}\n\nfunction parse<T>','now)));capacityDefaultsSeeded.add(db);})();capacityDefaultsSeeding.set(db,pending);try{return await pending;}finally{if(capacityDefaultsSeeding.get(db)===pending)capacityDefaultsSeeding.delete(db);}}\n\nfunction parse<T>','capacity seed close')
          old='export async function ensureProviderBookingGuard(db:Db){await ensureProviderCapacityTables(db);await db.batch([db.prepare("CREATE TABLE IF NOT EXISTS provider_booking_confirmation_guards (group_id TEXT PRIMARY KEY,created_at INTEGER NOT NULL)"),db.prepare("CREATE TRIGGER IF NOT EXISTS block_unavailable_provider_booking BEFORE INSERT ON provider_booking_confirmation_guards WHEN EXISTS (SELECT 1 FROM scheduling_reservations r JOIN provider_unavailability u ON u.provider_id=r.provider_id AND u.status=\'active\' AND u.starts_at<r.scheduled_end AND u.ends_at>r.scheduled_start WHERE r.group_id=NEW.group_id AND r.status!=\'cancelled\') BEGIN SELECT RAISE(ABORT,\'provider_unavailable_before_booking\'); END")]);}'
          new='export async function ensureProviderBookingGuard(db:Db){if(providerBookingGuardEnsured.has(db))return;const running=providerBookingGuardEnsuring.get(db);if(running)return running;const pending=(async()=>{await ensureProviderCapacityTables(db);const existing=await db.prepare("SELECT name FROM sqlite_master WHERE name IN (\'provider_booking_confirmation_guards\',\'block_unavailable_provider_booking\')").all<Row>();if(new Set(existing.results.map(row=>String(row.name))).size===2){providerBookingGuardEnsured.add(db);return;}await db.batch([db.prepare("CREATE TABLE IF NOT EXISTS provider_booking_confirmation_guards (group_id TEXT PRIMARY KEY,created_at INTEGER NOT NULL)"),db.prepare("CREATE TRIGGER IF NOT EXISTS block_unavailable_provider_booking BEFORE INSERT ON provider_booking_confirmation_guards WHEN EXISTS (SELECT 1 FROM scheduling_reservations r JOIN provider_unavailability u ON u.provider_id=r.provider_id AND u.status=\'active\' AND u.starts_at<r.scheduled_end AND u.ends_at>r.scheduled_start WHERE r.group_id=NEW.group_id AND r.status!=\'cancelled\') BEGIN SELECT RAISE(ABORT,\'provider_unavailable_before_booking\'); END")]);providerBookingGuardEnsured.add(db);})();providerBookingGuardEnsuring.set(db,pending);try{return await pending;}finally{if(providerBookingGuardEnsuring.get(db)===pending)providerBookingGuardEnsuring.delete(db);}}'
          s=once(s,old,new,'provider booking guard'); p.write_text(s)

          # Lease setup: established schema is read-only; cleanup is set based, not one batch per group.
          p=Path('lib/scheduling-reservation-leases.ts'); s=p.read_text()
          s=once(s,'const leaseTablesEnsured=new WeakSet<Db>();','const leaseTablesEnsured=new WeakSet<Db>();\nconst leaseTablesEnsuring=new WeakMap<Db,Promise<boolean>>();\nconst cleanupRunning=new WeakMap<Db,Promise<{groups:number;reservations:number}>>();','lease state')
          a=s.index('export async function ensureSchedulingReservationLeaseGovernance'); b=s.index('export async function reservationLeaseForRequest',a)
          ensure='''export async function ensureSchedulingReservationLeaseGovernance(db:Db){\n  if(leaseTablesEnsured.has(db))return true;\n  const running=leaseTablesEnsuring.get(db);if(running)return running;\n  const pending=(async()=>{\n    if(!(await tableExists(db,"scheduling_reservations")))return false;\n    const columns=await db.prepare("PRAGMA table_info(scheduling_reservations)").all<Row>();\n    const hasLease=columns.results.some(row=>String(row.name)==="lease_expires_at"),hasSession=columns.results.some(row=>String(row.name)==="customer_session_id");\n    const schema=await db.prepare("SELECT name FROM sqlite_master WHERE name IN ('idx_scheduling_reservations_lease','scheduling_reservation_lease_cleanup','booking_reservation_confirmation_guards','block_expired_reservation_booking')").all<Row>();\n    if(hasLease&&hasSession&&new Set(schema.results.map(row=>String(row.name))).size===4){leaseTablesEnsured.add(db);return true;}\n    await ensurePlatformSessionTables(db);\n    if(!hasLease)await db.prepare("ALTER TABLE scheduling_reservations ADD COLUMN lease_expires_at INTEGER").run().catch(error=>{if(!/duplicate column name/i.test(error instanceof Error?error.message:String(error)))throw error;});\n    if(!hasSession)await db.prepare("ALTER TABLE scheduling_reservations ADD COLUMN customer_session_id TEXT").run().catch(error=>{if(!/duplicate column name/i.test(error instanceof Error?error.message:String(error)))throw error;});\n    await db.batch([\n      db.prepare("CREATE INDEX IF NOT EXISTS idx_scheduling_reservations_lease ON scheduling_reservations(status,lease_expires_at,customer_session_id)"),\n      db.prepare("CREATE TABLE IF NOT EXISTS scheduling_reservation_lease_cleanup (group_id TEXT PRIMARY KEY,reason TEXT NOT NULL,released_at INTEGER NOT NULL)"),\n      db.prepare("CREATE TABLE IF NOT EXISTS booking_reservation_confirmation_guards (group_id TEXT PRIMARY KEY,checked_at INTEGER NOT NULL)"),\n      db.prepare("CREATE TRIGGER IF NOT EXISTS block_expired_reservation_booking BEFORE INSERT ON booking_reservation_confirmation_guards WHEN NOT EXISTS (SELECT 1 FROM scheduling_reservations r WHERE r.group_id=NEW.group_id AND r.status!='cancelled') OR EXISTS (SELECT 1 FROM scheduling_reservations r WHERE r.group_id=NEW.group_id AND r.status!='cancelled' AND ((r.lease_expires_at IS NOT NULL AND r.lease_expires_at<=NEW.checked_at) OR (r.customer_session_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM platform_identity_sessions s WHERE s.id=r.customer_session_id AND s.status IN ('active','superseded') AND s.expires_at>NEW.checked_at)))) BEGIN SELECT RAISE(ABORT,'reservation_lease_expired_before_booking'); END"),\n    ]);leaseTablesEnsured.add(db);return true;\n  })();leaseTablesEnsuring.set(db,pending);try{return await pending;}finally{if(leaseTablesEnsuring.get(db)===pending)leaseTablesEnsuring.delete(db);}\n}\n\n'''
          s=s[:a]+ensure+s[b:]
          a=s.index('export async function cleanupExpiredReservationLeases')
          cleanup='''export async function cleanupExpiredReservationLeases(db:Db,now=Date.now()){\n  const running=cleanupRunning.get(db);if(running)return running;\n  const pending=(async()=>{\n    if(!(await ensureSchedulingReservationLeaseGovernance(db)))return{groups:0,reservations:0};\n    const hasCanonical=await tableExists(db,"canonical_bookings");\n    const reservationConfirmed=hasCanonical?"AND NOT EXISTS (SELECT 1 FROM canonical_bookings b WHERE b.schedule_group_id=r.group_id)":"";\n    const expiredLease="((r.lease_expires_at IS NOT NULL AND r.lease_expires_at<=?) OR (r.customer_session_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM platform_identity_sessions s WHERE s.id=r.customer_session_id AND s.status IN ('active','superseded') AND s.expires_at>?)))";\n    const candidate=await db.prepare(`SELECT r.group_id FROM scheduling_reservations r WHERE r.status='assigned' AND ${expiredLease} ${reservationConfirmed} LIMIT 1`).bind(now,now).first<Row>();if(!candidate)return{groups:0,reservations:0};\n    const reason="reservation_lease_expired",hasOffers=await tableExists(db,"provider_assignment_offers");\n    const decisionConfirmed=hasCanonical?"AND NOT EXISTS (SELECT 1 FROM canonical_bookings b WHERE b.schedule_group_id=scheduling_assignment_decisions.group_id)":"";\n    const offerConfirmed=hasCanonical?"AND NOT EXISTS (SELECT 1 FROM canonical_bookings b WHERE b.schedule_group_id=provider_assignment_offers.group_id)":"";\n    const statements=[\n      db.prepare(`INSERT OR REPLACE INTO scheduling_reservation_lease_cleanup (group_id,reason,released_at) SELECT DISTINCT r.group_id,?,? FROM scheduling_reservations r WHERE r.status='assigned' AND ${expiredLease} ${reservationConfirmed}`).bind(reason,now,now,now),\n      db.prepare(`UPDATE scheduling_reservations AS r SET status='cancelled' WHERE r.status='assigned' ${reservationConfirmed} AND EXISTS (SELECT 1 FROM scheduling_reservation_lease_cleanup c WHERE c.group_id=r.group_id AND c.reason=? AND c.released_at=?)`).bind(reason,now),\n      db.prepare(`UPDATE scheduling_assignment_decisions SET status='expired',actor_id='system:reservation-lease-cleanup',reason=?,updated_at=? WHERE status IN ('assigned','awaiting_admin') AND EXISTS (SELECT 1 FROM scheduling_reservation_lease_cleanup c WHERE c.group_id=scheduling_assignment_decisions.group_id AND c.reason=? AND c.released_at=?) ${decisionConfirmed}`).bind(reason,now,reason,now),\n    ];\n    if(hasOffers)statements.push(db.prepare(`UPDATE provider_assignment_offers SET status='cancelled',responded_at=?,response_reason=?,updated_at=? WHERE status='pending' AND EXISTS (SELECT 1 FROM scheduling_reservation_lease_cleanup c WHERE c.group_id=provider_assignment_offers.group_id AND c.reason=? AND c.released_at=?) ${offerConfirmed}`).bind(now,reason,now,reason,now));\n    const result=await db.batch(statements);return{groups:Number(result[0]?.meta?.changes||0),reservations:Number(result[1]?.meta?.changes||0)};\n  })();cleanupRunning.set(db,pending);try{return await pending;}finally{if(cleanupRunning.get(db)===pending)cleanupRunning.delete(db);}\n}\n'''
          s=s[:a]+cleanup; p.write_text(s)

          # Scheduling setup: use exact current function shape. Preserve attempt_id and exact-slot ON CONFLICT safety.
          p=Path('app/api/uat-scheduling/route.ts'); s=p.read_text()
          s=once(s,'const schemaDriftRepaired=new WeakSet<object>();\nasync function ensureSchedulingTables(db:Awaited<ReturnType<typeof database>>){','const schemaDriftRepaired=new WeakSet<object>();\nconst schedulingTablesReady=new WeakMap<object,Promise<void>>();\nasync function ensureSchedulingTablesUncached(db:Awaited<ReturnType<typeof database>>){','scheduling rename')
          s=once(s,'  await ensureProviderCapacityTables(db);\n  await db.batch([','  await ensureProviderCapacityTables(db);\n  const required=["scheduling_assignment_decisions","scheduling_rules","scheduling_availability","scheduling_reservations","idx_scheduling_availability_provider_date","idx_scheduling_availability_date_provider_source","idx_scheduling_reservations_provider","idx_scheduling_reservations_city_status_provider_window","idx_scheduling_reservations_group","idx_scheduling_reservations_attempt"];\n  const existing=await db.prepare(`SELECT name FROM sqlite_master WHERE name IN (${required.map(()=>"?").join(",")})`).bind(...required).all<Record<string,unknown>>();\n  const schemaReady=new Set(existing.results.map(row=>String(row.name))).size===required.length;\n  if(!schemaReady)await db.batch([','scheduling read first open')
          s=once(s,'  db.prepare("CREATE INDEX IF NOT EXISTS idx_scheduling_reservations_group ON scheduling_reservations(group_id)"),\n]);\n  /*','  db.prepare("CREATE INDEX IF NOT EXISTS idx_scheduling_reservations_group ON scheduling_reservations(group_id)"),\n]);\n  /*','scheduling first batch close')
          # Avoid index write if already present while preserving drift repair before index creation.
          s=once(s,'  await db.batch([\n  db.prepare("CREATE INDEX IF NOT EXISTS idx_scheduling_reservations_attempt ON scheduling_reservations(attempt_id)"),\n]);await ensureSchedulingReservationLeaseGovernance(db);}','  if(!schemaReady)await db.batch([\n  db.prepare("CREATE INDEX IF NOT EXISTS idx_scheduling_reservations_attempt ON scheduling_reservations(attempt_id)"),\n]);await ensureSchedulingReservationLeaseGovernance(db);}\nasync function ensureSchedulingTables(db:Awaited<ReturnType<typeof database>>){const key=db as object;let pending=schedulingTablesReady.get(key);if(!pending){pending=ensureSchedulingTablesUncached(db);schedulingTablesReady.set(key,pending);pending.catch(()=>{if(schedulingTablesReady.get(key)===pending)schedulingTablesReady.delete(key);});}return pending;}','scheduling wrapper')
          old="authoredRows=await db.prepare(\"SELECT provider_id,date FROM scheduling_availability WHERE date>=? AND date<=? AND source IN ('partner_app','operations','roster')\").bind(sorted[0]??\"\",sorted[sorted.length-1]??\"\").all<Record<string,unknown>>();const authored=new Set(authoredRows.results.map(row=>`${String(row.provider_id)}|${String(row.date)}`));"
          new='existingRows=await db.prepare("SELECT provider_id,date,zone_id FROM scheduling_availability WHERE date>=? AND date<=?").bind(sorted[0]??"",sorted[sorted.length-1]??"").all<Record<string,unknown>>();const existing=new Set(existingRows.results.map(row=>`${String(row.provider_id)}|${String(row.date)}|${String(row.zone_id)}`));'
          s=once(s,old,new,'roster read'); s=once(s,'if(authored.has(`${provider.id}|${date}`))continue;','if(existing.has(`${provider.id}|${date}|${input.zoneId}`))continue;','roster skip')
          s=once(s,'const results=await db.batch(statements);const inserted=results.reduce((sum,result)=>sum+Number(result?.meta?.changes||0),0);','const results=statements.length===1?[await statements[0]!.run()]:await db.batch(statements);const inserted=results.reduce((sum,result)=>sum+Number(result?.meta?.changes||0),0);','atomic single claim')
          p.write_text(s)

          # Canonical booking burst gets identical retry policy plus read-first schema initialization.
          p=Path('app/api/canonical-bookings/route.ts'); s=p.read_text()
          if 'import {withRetryingD1Writes}' not in s: s=once(s,'import {cityBookingVerdict} from "../../../lib/city-status-authority";','import {cityBookingVerdict} from "../../../lib/city-status-authority";\nimport {withRetryingD1Writes} from "../../../lib/d1-write-retry";','canonical import')
          s=once(s,'async function database(){const {env}=await import("cloudflare:workers");return env.DB;}','async function database(){const {env}=await import("cloudflare:workers");return withRetryingD1Writes(env.DB);}','canonical db')
          s=once(s,'async function ensureTables(db:Awaited<ReturnType<typeof database>>){await db.batch([','async function ensureTablesUncached(db:Awaited<ReturnType<typeof database>>){const required=["canonical_customers","canonical_pets","canonical_bookings","provider_work_orders","booking_payments","booking_lifecycle_events","booking_subscription_usage","customer_grooming_subscriptions","grooming_subscription_purchase_snapshots","idx_booking_lifecycle_events_booking","idx_canonical_pets_customer"];const existing=await db.prepare(`SELECT name FROM sqlite_master WHERE name IN (${required.map(()=>"?").join(",")})`).bind(...required).all<Record<string,unknown>>();if(new Set(existing.results.map(row=>String(row.name))).size===required.length)return;await db.batch([','canonical read first')
          marker='\n/*\n * The service-wide window guard'
          s=once(s,marker,'\nconst canonicalTablesReady=new WeakMap<object,Promise<void>>();\nasync function ensureTables(db:Awaited<ReturnType<typeof database>>){const key=db as object;let pending=canonicalTablesReady.get(key);if(!pending){pending=ensureTablesUncached(db);canonicalTablesReady.set(key,pending);pending.catch(()=>{if(canonicalTablesReady.get(key)===pending)canonicalTablesReady.delete(key);});}return pending;}\n'+marker,'canonical wrapper')
          p.write_text(s)

          # Focused regressions.
          p=Path('tests/uat-scheduling-d1-contention.test.mjs'); s=p.read_text()
          s=s.replace('if(attempts<4)','if(attempts<3)',1).replace('assert.equal(attempts,4);','assert.equal(attempts,3);',1).replace('assert.deepEqual(delays,[10,20,40]);','assert.deepEqual(delays,[5,10]);',1)
          s+='''\n\ntest("D1 retry policy hard-caps caller retry storms",async()=>{let attempts=0;const delays=[];await assert.rejects(()=>retry.withD1WriteRetry(async()=>{attempts+=1;const error=new Error("database is busy");error.code="SQLITE_BUSY";throw error;},{attempts:99,baseDelayMs:100,maxDelayMs:1000,maxTotalDelayMs:1000,random:()=>0.999999,sleep:async delay=>{delays.push(delay);}}),error=>retry.isSqliteBusyError(error));assert.equal(attempts,3);assert.deepEqual(delays,[50,50]);});\n\ntest("Track 3 write hot paths are bounded and atomic",()=>{const scheduling=fs.readFileSync(new URL("../app/api/uat-scheduling/route.ts",import.meta.url),"utf8");const leases=fs.readFileSync(new URL("../lib/scheduling-reservation-leases.ts",import.meta.url),"utf8");const canonical=fs.readFileSync(new URL("../app/api/canonical-bookings/route.ts",import.meta.url),"utf8");assert.match(scheduling,/schedulingTablesReady=new WeakMap/);assert.match(scheduling,/SELECT provider_id,date,zone_id FROM scheduling_availability/);assert.match(scheduling,/statements\\.length===1\\?\\[await statements\\[0\\]!\\.run\\(\\)\\]/);assert.match(scheduling,/ON CONFLICT\\(provider_id,scheduled_start,scheduled_end\\)/);assert.match(leases,/cleanupRunning=new WeakMap/);assert.match(leases,/SELECT DISTINCT r\\.group_id/);assert.doesNotMatch(leases,/for\\(const row of rows\\.results\\)/);assert.match(canonical,/withRetryingD1Writes\\(env\\.DB\\)/);assert.match(canonical,/canonicalTablesReady=new WeakMap/);});\n'''
          p.write_text(s)
          PY
          python3 "$RUNNER_TEMP/remediate.py"
      - name: Focused contention tests
        run: node --experimental-strip-types --test tests/uat-scheduling-d1-contention.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Commit and push application remediation
        run: |
          set -euo pipefail
          git fetch origin fix/staging-performance-remediation
          test "$(git rev-parse origin/fix/staging-performance-remediation)" = "$GITHUB_SHA"
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add lib/d1-write-retry.ts lib/provider-capacity-governance.ts lib/scheduling-reservation-leases.ts app/api/uat-scheduling/route.ts app/api/canonical-bookings/route.ts tests/uat-scheduling-d1-contention.test.mjs
          git diff --cached --check
          git commit -m "perf(scheduling): bound D1 write contention"
          git push origin HEAD:fix/staging-performance-remediation
          echo "EXPECTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build remediation SHA
        run: npm run build
      - name: Configure isolated staging
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs
      - name: Deploy remediation SHA to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/staging-remediation-secrets.json"; export SECRETS_FILE
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';const required=['PAWSPACE_UAT_ACCESS_CODE','PAWSPACE_UAT_SIGNING_KEY','PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT','RAZORPAY_WEBHOOK_SECRET_SANDBOX'];const optional=['RAZORPAY_KEY_ID_SANDBOX','RAZORPAY_KEY_SECRET_SANDBOX'];const values=Object.fromEntries(required.map(n=>[n,process.env[n]||'']));if(Object.values(values).some(v=>!v))throw new Error('required Track 3 staging secret missing');for(const n of optional)if(process.env[n])values[n]=process.env[n];values.PAWSPACE_STAGING_LIVE_CUSTOMER_OTP='false';writeFileSync(process.env.SECRETS_FILE,JSON.stringify(values),{mode:0o600});
          NODE
          npx wrangler deploy --message "staging $EXPECTED_SHA" --secrets-file "$SECRETS_FILE" 2>&1 | tee deployment.txt
      - name: Certify staging isolation and exact SHA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
        run: node tests/e2e/staging-certification.mjs --isolation-only
      - name: Seed deterministic staging identities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p scripts/ops
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-role-seed.mjs > scripts/ops/staging-role-seed.mjs
          node --experimental-strip-types scripts/ops/staging-role-seed.mjs "$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --file="$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --file=scripts/employee-seed.sql
      - name: Verify healthz
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const response=await fetch(process.env.STAGING_URL+'/healthz',{signal:AbortSignal.timeout(15000)});const text=await response.text();let body=null;try{body=JSON.parse(text)}catch{}const evidence={url:process.env.STAGING_URL+'/healthz',status:response.status,ok:response.ok,body};fs.writeFileSync('healthz-evidence.json',JSON.stringify(evidence,null,2));console.log(JSON.stringify(evidence,null,2));if(response.status!==200||body?.status!=='ok')process.exit(1);
          NODE
      - name: Run hosted Track 3 workload
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          PERF_RUN_ID: remediation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p scripts/ops
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-performance-gate.mjs > scripts/ops/staging-performance-gate.mjs
          node scripts/ops/staging-performance-gate.mjs
      - name: Verify D1 Track 3 invariants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RUN_ID="$(node -e "const r=require('./staging-performance.json');process.stdout.write(r.runId)")"
          SQL="SELECT (SELECT COUNT(*) FROM canonical_bookings WHERE idempotency_key LIKE '${RUN_ID}:booking:%') bookings,(SELECT COUNT(*) FROM booking_payments WHERE booking_id IN (SELECT id FROM canonical_bookings WHERE idempotency_key LIKE '${RUN_ID}:booking:%')) payments,(SELECT COUNT(*) FROM scheduling_assignment_decisions WHERE group_id LIKE '${RUN_ID}:grp:%') assignments,(SELECT COUNT(*) FROM payment_gateway_events WHERE event_id='${RUN_ID}:evt:replay') webhook_events,(SELECT ROUND(COALESCE(SUM(debit),0)-COALESCE(SUM(credit),0),2) FROM finance_journal_entries) ledger_drift;"
          npx wrangler d1 execute pawspace-staging --remote --json --command "$SQL" > staging-performance-d1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const raw=JSON.parse(fs.readFileSync('staging-performance-d1.json','utf8'));const row=(Array.isArray(raw)?raw[0]:raw)?.results?.[0]||{};const n=k=>Number(row[k]??NaN);console.log(JSON.stringify(row,null,2));if(n('bookings')!==100||n('payments')!==100||n('assignments')!==100||n('webhook_events')!==1||Math.abs(n('ledger_drift'))>0.000001)process.exit(1);
          NODE
      - name: Enforce Track 3 thresholds and scan failures
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('staging-performance.json','utf8'));const failures=p.failures||[];const lockOr500=failures.filter(x=>/\b500\b|SQLITE_BUSY|database (?:table )?is locked|cannot start a transaction within a transaction/i.test(String(x.error||'')));const p95=Number(p.metrics?.p95Ms??p.metrics?.p95??NaN);const errorRate=Number(p.metrics?.errorRate??NaN);console.log(JSON.stringify({failureCount:failures.length,lockOr500Failures:lockOr500,p95Ms:p95,errorRate,metrics:p.metrics,counts:p.counts,thresholds:p.thresholds},null,2));if(!Number.isFinite(p95)||p95>=750||!Number.isFinite(errorRate)||errorRate>=0.01||lockOr500.length||failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-track3-write-contention-remediation-v4
          path: |
            deployment.txt
            healthz-evidence.json
            staging-performance.json
            staging-performance-d1.json
          if-no-files-found: warn
