name: Finance P0 P1 targeted gate

on:
  push:
    branches:
      - fix/financial-lifecycle-p0-p1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-p0-p1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finance-targeted:
    name: Finance payments + concurrency + typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      APP_ENV: staging
      FORBID_PRODUCTION: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install verified dependencies
        run: npm run install:ci
      - name: Blocking application build
        run: npm run build
      - name: Payment environment + live gate + outbox hardening
        run: node --experimental-strip-types --test tests/payments-production-hardening.test.mjs
      - name: Finance P0/P1 source contracts
        run: node --test tests/financial-lifecycle-concurrency.test.mjs
      - name: Finance P0/P1 executable concurrency and duplicate acceptance
        run: node --test tests/financial-lifecycle-executable-concurrency.test.mjs
      - name: Razorpay payment-level settlement reconciliation acceptance
        run: node --test tests/razorpay-settlement-reconciliation.test.mjs
      - name: Razorpay conflicting settlement identity acceptance
        run: node --test tests/razorpay-settlement-conflict.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
