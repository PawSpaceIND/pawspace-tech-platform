name: Production Sign-Off

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-uat-isolation-gate:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/pre-uat-protocol-isolation' }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm pre-UAT PR never enters the production environment
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "fix/pre-uat-protocol-isolation"
          echo "Pre-UAT protocol PR is intentionally excluded from the GitHub production environment and production secrets."

  master-production-audit:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'fix/pre-uat-protocol-isolation' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      # This is a real production certification gate, not a reporting dry run. Production-only
      # credentials must be present under their canonical names; sandbox/UAT aliases are forbidden.
      # Payments remain deliberately sandbox-only and live approval must remain explicitly false.
      - name: Production readiness strict certification
        env:
          PAWSPACE_PRODUCTION_ENFORCE: 'true'
          PAWSPACE_READINESS_DRY_RUN_STRICT: 'true'
          PAWSPACE_TEST_API_POLICY_OVERRIDE: 'false'
          PAWSPACE_PAYMENT_ENV: 'sandbox'
          PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
          IDFY_API_KEY: ${{ secrets.IDFY_API_KEY }}
          IDFY_ACCOUNT_ID: ${{ secrets.IDFY_ACCOUNT_ID }}
          IDFY_WEBHOOK_SECRET: ${{ secrets.IDFY_WEBHOOK_SECRET }}
          IDFY_URL: ${{ vars.IDFY_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_R2_BUCKET_NAME: ${{ vars.PRODUCTION_R2_BUCKET_NAME }}
          PROVIDER_AGREEMENT_ESIGN_PRIVATE_KEY_PKCS8_B64: ${{ secrets.PROVIDER_AGREEMENT_ESIGN_PRIVATE_KEY_PKCS8_B64 }}
          PROVIDER_AGREEMENT_ESIGN_PUBLIC_KEY_SPKI_B64: ${{ secrets.PROVIDER_AGREEMENT_ESIGN_PUBLIC_KEY_SPKI_B64 }}
          PROVIDER_AGREEMENT_ESIGN_KEY_ID: ${{ vars.PROVIDER_AGREEMENT_ESIGN_KEY_ID }}
          META_WHATSAPP_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_ACCESS_TOKEN }}
          META_WHATSAPP_APP_SECRET: ${{ secrets.META_WHATSAPP_APP_SECRET }}
          META_WHATSAPP_VERIFY_TOKEN: ${{ secrets.META_WHATSAPP_VERIFY_TOKEN }}
          INTERAKT_API_KEY: ${{ secrets.INTERAKT_API_KEY }}
          INTERAKT_WEBHOOK_SECRET: ${{ secrets.INTERAKT_WEBHOOK_SECRET }}
          META_WHATSAPP_WABA_ID: ${{ vars.META_WHATSAPP_WABA_ID }}
          META_WHATSAPP_PHONE_NUMBER_ID: ${{ vars.META_WHATSAPP_PHONE_NUMBER_ID }}
        run: node scripts/assert-production-readiness.mjs
