name: Deploy production

# PRODUCTION deploy for the Bengaluru pilot. Manual only (workflow_dispatch) — never auto-runs on a
# push, never on a schedule, never on a merge. Modelled on deploy-staging.yml, which is the workflow
# this repository has already proven, with three differences that matter:
#
#   1. it deploys to pawspace-prod-bengaluru, and REFUSES if that database is shared with staging
#      or release-preview;
#   2. it carries no UAT or sandbox flags. scripts/prod-config.mjs declares production's complete var
#      set and refuses the deploy if a forbidden one (local preview, UAT login, UAT delivery) appears;
#   3. payment, communication and maps modes are REQUIRED inputs with no default. A pilot that quietly
#      runs on sandbox payments, or quietly charges real cards, is the same class of accident.
#
# It deliberately does NOT seed a staff directory, does NOT enable a shared UAT access code, and does
# NOT send a smoke message. Production is not a test environment.
#
# Required repository configuration:
#   vars.PRODUCTION_D1_ID                     the production database (create it first; this never does)
#   vars.PRODUCTION_R2_BUCKET_NAME            optional private media bucket
#   vars.STAGING_D1_ID                        supplied ONLY so the job can refuse to match it
#   vars.RELEASE_PREVIEW_D1_ID                supplied ONLY so the job can refuse to match it
#   secrets.CLOUDFLARE_API_TOKEN
#   secrets.CLOUDFLARE_ACCOUNT_ID
#   secrets.EXOTEL_API_KEY, secrets.EXOTEL_API_TOKEN, secrets.EXOTEL_SID
#   secrets.EXOTEL_CALLER_ID, secrets.EXOTEL_VOICE_APP_ID, secrets.EXOTEL_WEBHOOK_SECRET

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-production-bengaluru" to confirm this is a real production deploy'
        required: true
        default: ''
      expected_sha:
        description: 'Exact 40-character commit sha to deploy (a branch name does not identify a build)'
        required: true
        default: ''
      payment_env:
        description: 'live or sandbox — decides whether cards are actually charged'
        required: true
        type: choice
        options: [sandbox, live]
      communication_env:
        description: 'live or sandbox — decides whether real people receive real messages'
        required: true
        type: choice
        options: [sandbox, live]
      maps_env:
        description: 'live or sandbox — decides whether location and ETA are real'
        required: true
        type: choice
        options: [sandbox, live]

jobs:
  deploy:
    # A typo in the confirmation string is a no-op, not a production deploy.
    if: ${{ github.event.inputs.confirm == 'deploy-production-bengaluru' }}
    runs-on: ubuntu-latest
    concurrency: pawspace-production-deploy
    steps:
      # Checked out AT the requested sha, so "the production deploy of <sha>" is a fact that can be
      # checked afterwards rather than an assumption, and a merge landing mid-run cannot change what
      # was shipped.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha }}

      - name: Verify the checkout is exactly the requested sha and is clean
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          set -euo pipefail
          case "$EXPECTED_SHA" in
            *[!0-9a-f]* | "" ) echo "expected_sha must be an exact 40-character commit sha." >&2; exit 1 ;;
          esac
          if [ "${#EXPECTED_SHA}" -ne 40 ]; then
            echo "expected_sha must be an exact 40-character commit sha (a branch name or short sha does not identify a build)." >&2
            exit 1
          fi
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$EXPECTED_SHA" ]; then
            echo "checkout is at $ACTUAL, not the requested $EXPECTED_SHA - refusing to deploy." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "working tree is dirty - refusing to deploy a modified artifact." >&2
            exit 1
          fi

      # A production deploy of an uncertified tree is how a regression reaches customers. The sha must
      # carry a green Release CI run of its own; this does not re-run the suite, it requires that one
      # already passed on exactly this commit.
      - name: Require a green Release CI run on this exact sha
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          set -euo pipefail
          CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}" \
            --jq '[.workflow_runs[] | select(.name=="Release CI")] | sort_by(.run_started_at) | last | .conclusion' 2>/dev/null || echo "")"
          if [ "$CONCLUSION" != "success" ]; then
            echo "Release CI on $EXPECTED_SHA is '${CONCLUSION:-missing}', not success - refusing to deploy an uncertified tree." >&2
            exit 1
          fi
          echo "Release CI is green on this exact sha."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm run install:ci

      # HARD, UNSKIPPABLE production-readiness gate — run BEFORE bundling. It refuses the deploy (non-zero
      # exit) if any critical subsystem would run on a sandbox/simulator/mock/fallback driver, is missing a
      # required live binding, or carries a forbidden UAT/preview flag. Live-credential checks only bite
      # when the corresponding mode input is "live", so an explicit sandbox pilot still deploys; a "live"
      # deploy without the live secrets configured is stopped here rather than after real money can move.
      # --require-production makes the gate refuse to run silently inert. Secrets referenced here that are
      # not yet configured resolve to empty and fail the gate closed in live mode, which is the point.
      - name: Assert production readiness (hard gate, before bundling)
        env:
          PAWSPACE_DEPLOYMENT_ENV: production
          PAWSPACE_PAYMENT_ENV: ${{ github.event.inputs.payment_env }}
          PAWSPACE_COMMUNICATION_ENV: ${{ github.event.inputs.communication_env }}
          PAWSPACE_MAPS_ENV: ${{ github.event.inputs.maps_env }}
          PRODUCTION_R2_BUCKET_NAME: ${{ vars.PRODUCTION_R2_BUCKET_NAME }}
          PAWSPACE_IDENTITY_ENV: ${{ vars.PAWSPACE_IDENTITY_ENV }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET_LIVE: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_LIVE }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          PAWSPACE_PAYMENT_LIVE_APPROVED: ${{ secrets.PAWSPACE_PAYMENT_LIVE_APPROVED || vars.PAWSPACE_PAYMENT_LIVE_APPROVED }}
          IDFY_API_KEY: ${{ secrets.IDFY_API_KEY }}
          IDFY_ACCOUNT_ID: ${{ secrets.IDFY_ACCOUNT_ID || vars.IDFY_ACCOUNT_ID }}
          IDFY_URL: ${{ secrets.IDFY_URL || vars.IDFY_URL }}
          IDFY_WEBHOOK_SECRET: ${{ secrets.IDFY_WEBHOOK_SECRET }}
          META_WHATSAPP_APP_SECRET: ${{ secrets.META_WHATSAPP_APP_SECRET }}
          META_WHATSAPP_VERIFY_TOKEN: ${{ secrets.META_WHATSAPP_VERIFY_TOKEN || vars.META_WHATSAPP_VERIFY_TOKEN }}
          PAWSPACE_VOICE_ENV: ${{ vars.PAWSPACE_VOICE_ENV }}
          PAWSPACE_VOICE_TRANSPORT: ${{ vars.PAWSPACE_VOICE_TRANSPORT }}
        run: node scripts/assert-production-readiness.mjs --require-production

      - name: Build (vinext)
        run: npm run build

      # Refuses on a missing database id, on a database shared with staging or release-preview, on an
      # unstated payment/communication/maps mode, and on any forbidden UAT var surviving into the
      # production var set.
      - name: Configure production (name + D1 + explicit runtime modes)
        env:
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_R2_BUCKET_NAME: ${{ vars.PRODUCTION_R2_BUCKET_NAME }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          RELEASE_PREVIEW_D1_ID: ${{ vars.RELEASE_PREVIEW_D1_ID }}
          PAWSPACE_PAYMENT_ENV: ${{ github.event.inputs.payment_env }}
          PAWSPACE_COMMUNICATION_ENV: ${{ github.event.inputs.communication_env }}
          PAWSPACE_MAPS_ENV: ${{ github.event.inputs.maps_env }}
        run: node scripts/prod-config.mjs

      # Captured BEFORE the deploy, so a rollback target exists even when this deploy is the bad one.
      # The moment a rollback reference matters is after it has already gone wrong.
      - name: Record the currently deployed production version (rollback reference)
        id: rollback
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx wrangler deployments list --name pawspace-prod-bengaluru > rollback-reference.txt 2>&1; then
            REFERENCE="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' rollback-reference.txt | tail -n 1 || true)"
          else
            REFERENCE=""
          fi
          if [ -z "$REFERENCE" ]; then REFERENCE="first-production-deploy"; fi
          # Only the marker is exported. The listing itself can carry account detail and is not uploaded.
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          echo "Rollback target recorded."

      # Deploy from the repo ROOT: the @cloudflare/vite-plugin build writes a redirect at
      # .wrangler/deploy/config.json pointing wrangler to dist/server/wrangler.json. Running from
      # dist/server instead makes wrangler find BOTH that redirect and the local wrangler.json and
      # refuse ("Found both a user configuration file ... and a deploy configuration file").
      - name: Deploy to production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
          EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
          EXOTEL_SID: ${{ secrets.EXOTEL_SID }}
          EXOTEL_CALLER_ID: ${{ secrets.EXOTEL_CALLER_ID }}
          EXOTEL_VOICE_APP_ID: ${{ secrets.EXOTEL_VOICE_APP_ID }}
          EXOTEL_WEBHOOK_SECRET: ${{ secrets.EXOTEL_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/pawspace-production-secrets.json"
          export SECRETS_FILE
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const requiredNames = [
              "EXOTEL_API_KEY", "EXOTEL_API_TOKEN", "EXOTEL_SID", "EXOTEL_CALLER_ID",
              "EXOTEL_VOICE_APP_ID", "EXOTEL_WEBHOOK_SECRET"
            ];
            const values = Object.fromEntries(requiredNames.map(name => [name, process.env[name] || ""]));
            if (Object.values(values).some(value => !value)) throw new Error("a required production Exotel secret is missing");
            writeFileSync(process.env.SECRETS_FILE, JSON.stringify(values), { mode: 0o600 });
          '
          npx wrangler deploy --message "production ${{ github.event.inputs.expected_sha }}" --secrets-file "$SECRETS_FILE"

      # The deployed worker must be the production one, bound to the production database, with no
      # preview or UAT authority. Asserted against what was actually written, not what was intended.
      - name: Certify the deployed configuration
        env:
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const cfg = require("./dist/server/wrangler.json");
          const fail = (m) => { console.error("CERTIFICATION FAILED: " + m); process.exit(1); };
          if (cfg.name !== "pawspace-prod-bengaluru") fail(`worker is ${cfg.name}, not pawspace-prod-bengaluru`);
          const bound = (cfg.d1_databases || [])[0];
          if (!bound || bound.database_id !== process.env.PRODUCTION_D1_ID) fail("DB binding is not the production database");
          for (const forbidden of ["PAWSPACE_LOCAL_PREVIEW", "PAWSPACE_UAT_LOGIN", "PAWSPACE_SCHEDULING_ENV", "META_WHATSAPP_UAT_DELIVERY_ENABLED", "PAWSPACE_MEDIA_ENV"]) {
            if (forbidden in (cfg.vars || {})) fail(`${forbidden} is present in a production deploy`);
          }
          if ((cfg.vars || {}).PAWSPACE_DEPLOYMENT_ENV !== "production") fail("PAWSPACE_DEPLOYMENT_ENV is not production");
          console.log("Deployed configuration certified: production worker, production database, no preview or UAT authority.");
          NODE

      - name: Where this went, and how to undo it
        run: |
          echo "Deployed sha:        ${{ github.event.inputs.expected_sha }}"
          echo "Worker:              pawspace-prod-bengaluru"
          echo "Payment mode:        ${{ github.event.inputs.payment_env }}"
          echo "Communication mode:  ${{ github.event.inputs.communication_env }}"
          echo "Maps mode:           ${{ github.event.inputs.maps_env }}"
          echo "Rollback reference:  ${{ steps.rollback.outputs.reference }}"
          echo ""
          echo "To roll back:  npx wrangler rollback --name pawspace-prod-bengaluru <reference>"
