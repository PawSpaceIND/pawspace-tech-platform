name: Release CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr220-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr220-diagnostic:
    name: PR220 bounded diagnostic
    if: github.head_ref == 'tmp/pr220-fix-exec'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout disposable head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Stop after diagnostic is already captured
        id: guard
        shell: bash
        run: |
          if [ -f .github/tmp-pr220-npm-test-failure.txt ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout trusted patch scripts
        if: steps.guard.outputs.done != 'true'
        uses: actions/checkout@v4
        with:
          ref: tmp/pr220-walking-training-fix
          path: .runner
          fetch-depth: 1
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.done != 'true'
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        if: steps.guard.outputs.done != 'true'
        run: npm ci
      - name: Apply bounded Walking and Training fixes
        if: steps.guard.outputs.done != 'true'
        run: |
          python3 .runner/.github/tmp-pr220-patch.py
          python3 .runner/.github/tmp-pr220-patch2.py
      - name: Regenerate deterministic UAT seed
        if: steps.guard.outputs.done != 'true'
        run: node --experimental-strip-types scripts/uat-demo-seed-gen.mjs
      - name: Confirm focused regressions
        if: steps.guard.outputs.done != 'true'
        run: node --experimental-strip-types --test tests/walking-per-session-amount.test.mjs tests/uat-demo-seed.test.mjs tests/grooming-booking-calendar.test.mjs
      - name: Capture exact repository test failure
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          set +e
          npm test > /tmp/npm-test.log 2>&1
          status=$?
          export TEST_STATUS="$status"
          python3 - <<'PY'
          from pathlib import Path
          import os
          lines = Path('/tmp/npm-test.log').read_text(errors='replace').splitlines()
          needles = ('not ok', 'AssertionError', 'ERR_ASSERTION', 'FAIL', 'failed', 'expected:', 'actual:')
          hits = [i for i, line in enumerate(lines) if any(n.lower() in line.lower() for n in needles)]
          picked = []
          seen = set()
          for i in hits:
              for j in range(max(0, i-8), min(len(lines), i+28)):
                  if j not in seen:
                      seen.add(j)
                      picked.append((j, lines[j]))
          if not picked:
              start = max(0, len(lines)-220)
              picked = [(i, lines[i]) for i in range(start, len(lines))]
          out = [f'npm test exit status: {os.environ.get("TEST_STATUS", "unknown")}', '', '--- extracted failure context ---']
          out.extend(f'{i+1}: {line}' for i, line in picked[-500:])
          out += ['', '--- final 120 lines ---']
          start = max(0, len(lines)-120)
          out.extend(f'{i+1}: {lines[i]}' for i in range(start, len(lines)))
          Path('.github/tmp-pr220-npm-test-failure.txt').write_text('\n'.join(out) + '\n')
          PY
      - name: Publish disposable diagnostic
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          git config user.name "PawSpace CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/tmp-pr220-npm-test-failure.txt
          git commit -m "chore: capture PR220 npm test failure"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
