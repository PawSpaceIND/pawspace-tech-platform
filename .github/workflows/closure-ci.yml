name: Release CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr220-final-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr220-final-runner:
    name: PR220 final bounded runner
    if: github.head_ref == 'tmp/pr220-fix-exec'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout disposable head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Checkout trusted patch scripts
        uses: actions/checkout@v4
        with:
          ref: tmp/pr220-walking-training-fix
          path: .runner
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Apply bounded Walking and Training fixes
        run: |
          python3 .runner/.github/tmp-pr220-patch.py
          python3 .runner/.github/tmp-pr220-patch2.py
      - name: Regenerate deterministic UAT seed
        run: node --experimental-strip-types scripts/uat-demo-seed-gen.mjs
      - name: Run focused regressions
        run: node --experimental-strip-types --test tests/walking-per-session-amount.test.mjs tests/uat-demo-seed.test.mjs tests/walking-gate2.test.mjs tests/uat-closure-home-booking.test.mjs tests/grooming-booking-calendar.test.mjs
      - name: Run repository tests
        run: npm test
      - name: Commit clean tested tree to disposable head
        shell: bash
        run: |
          git config user.name "PawSpace CI"
          git config user.email "actions@users.noreply.github.com"
          git checkout af8612bdac973619a124fdb81159f1a5929a7ce4 -- .github/workflows/closure-ci.yml
          git rm -f .github/pr220-exec-marker.txt .github/tmp-pr220-npm-test-failure.txt
          git add -- .github/workflows/closure-ci.yml lib/walking-lifecycle.ts lib/walking-lifecycle-client.ts scripts/uat-demo-seed-gen.mjs scripts/uat-demo-seed.sql tests/walking-per-session-amount.test.mjs tests/uat-demo-seed.test.mjs tests/walking-gate2.test.mjs tests/uat-closure-home-booking.test.mjs
          git commit -m "fix(uat): close walking and training review blockers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

# retry after stale source-format assertion alignment
