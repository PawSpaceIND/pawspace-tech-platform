name: Release CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-revenue-reconciliation-patch:
    name: Apply final Revenue CRM reconciliation correction
    if: github.event.pull_request.head.ref == 'testfix/final-main-independent-audit-20260825'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: testfix/final-main-independent-audit-20260825
      - name: Patch stale synthetic-owner expectation and restore CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/revenue-stack-hardening.test.mjs')
          text = p.read_text()
          replacements = [
            (
              '  // First GET creates the CRM engine tables and seeds leads (owners exist, zero conversions yet).\n',
              '  // First GET initializes/reads the CRM engine only; synthetic owners must not be seeded.\n',
            ),
            (
              '  // Owners with no conversions report honest zeros, not fabricated 19-25k figures.\n  const sanjay = leaderboard.find((row) => row.employee_name === "Sanjay");\n  assert.equal(sanjay.eligible_revenue, 0);',
              '  // Owners absent from real CRM work must not be fabricated into the leaderboard.\n  assert.equal(leaderboard.some((row) => row.employee_name === "Sanjay"), false, "GET must not seed a synthetic owner row");',
            ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          git checkout c1a48154ef2ff430ab215301a32f842dc059f50d -- .github/workflows/closure-ci.yml
          git config user.name "PawSpace CI Closure"
          git config user.email "ci-closure@pawspace.in"
          git add -A
          git diff --cached --check
          git commit -m "test: remove stale synthetic Revenue CRM owner expectation"
          git push origin HEAD:testfix/final-main-independent-audit-20260825
