name: Release CI

on:
  push:
    branches:
      - main
      - grooming-integration-closure
      - agent/food-gates1-5
      - agent/platform-stack-recertification
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean checkout workspace
        run: git clean -ffdx
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Build and run tracked Web tests
        shell: bash
        run: |
          npm run build
          mapfile -t tracked_tests < <(git ls-files 'tests/*.test.mjs' | awk -F/ 'NF == 2')
          test "${#tracked_tests[@]}" -gt 0
          node --test --test-force-exit "${tracked_tests[@]}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  artifact:
    name: Artifact validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:artifact

  runtime-d1:
    name: Runtime D1 regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Execute production flow against isolated local D1
        shell: bash
        run: |
          rm -rf .runtime-d1
          npx wrangler dev --config wrangler.runtime-d1.jsonc --persist-to .runtime-d1 --port 8788 > /tmp/runtime-d1-worker.log 2>&1 &
          worker_pid=$!
          trap 'cat /tmp/runtime-d1-worker.log; kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          status=$(curl -sS -o /tmp/runtime-d1-result.json -w '%{http_code}' http://127.0.0.1:8788/run)
          cat /tmp/runtime-d1-result.json
          test "$status" = 200
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/runtime-d1-result.json','utf8'));if(!r.ok)throw new Error(r.error||'Runtime D1 regression failed');const expected={canonicalPets:2,accountMutations:3};for(const [k,v] of Object.entries(r.assertions||{})){const want=expected[k]??1;if(v!==want)throw new Error(k+' cardinality was '+v+', expected '+want)}"

  scheduler-d1:
    name: Background scheduler D1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Fire real scheduled handler against isolated local D1
        shell: bash
        run: |
          rm -rf .scheduler-d1
          npx wrangler dev --config wrangler.background-scheduler.jsonc --persist-to .scheduler-d1 --port 8789 --test-scheduled > /tmp/scheduler-d1-worker.log 2>&1 &
          worker_pid=$!
          trap 'cat /tmp/scheduler-d1-worker.log; kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8789/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          curl -fsS http://127.0.0.1:8789/seed
          curl -fsS 'http://127.0.0.1:8789/cdn-cgi/handler/scheduled?cron=%2A%2F5+%2A+%2A+%2A+%2A&time=1786458600000&format=json'
          curl -fsS 'http://127.0.0.1:8789/cdn-cgi/handler/scheduled?cron=%2A%2F5+%2A+%2A+%2A+%2A&time=1786458600000&format=json'
          curl -fsS http://127.0.0.1:8789/assert > /tmp/scheduler-state.json
          cat /tmp/scheduler-state.json
          node -e "const s=require('/tmp/scheduler-state.json');if(s.cold?.status!=='active'||Number(s.cold?.recycle_cycle)!==1)throw Error('cold lead did not reopen');if(s.sla?.status!=='sla_breached')throw Error('SLA did not escalate');if(Number(s.ops?.escalation_level)!==1)throw Error('ops did not escalate');if(s.callback?.status!=='missed')throw Error('callback did not sweep');if(Number(s.reports?.count)!==3)throw Error('command reports were not generated');if(Number(s.runs?.count)!==1||Number(s.runs?.attempts)!==1||s.runs?.status!=='completed')throw Error('scheduled replay was not idempotent')"

  pricing-control-d1:
    name: Pricing Control D1 regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Prove Pricing Control changes real canonical quotes
        shell: bash
        run: |
          rm -rf .pricing-control-d1
          npx wrangler dev --config wrangler.pricing-control.jsonc --persist-to .pricing-control-d1 --port 8790 > /tmp/pricing-control-worker.log 2>&1 &
          worker_pid=$!
          trap 'cat /tmp/pricing-control-worker.log; kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8790/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          status=$(curl -sS -o /tmp/pricing-control-result.json -w '%{http_code}' http://127.0.0.1:8790/run)
          cat /tmp/pricing-control-result.json
          test "$status" = 200
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/pricing-control-result.json','utf8'));if(!r.ok)throw new Error(r.error||'Pricing Control regression failed');const e={training:13000,boarding:1600,sitting:1350,grooming:3600,activeCanonicalRows:5};for(const [k,v] of Object.entries(e)){if(r.assertions?.[k]!==v)throw new Error(k+' expected '+v+' got '+r.assertions?.[k]);}if(!r.oldGroomingRejected)throw new Error('old Grooming multi-pet amount was accepted');"

  production-readiness-d1:
    name: Production readiness truth D1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: No code may hardcode productionReady:true - it must always be a computed claim
        shell: bash
        run: |
          if grep -rnoE "productionReady\s*:\s*true" lib/*.ts app/api/*/route.ts 2>/dev/null; then
            echo "A hardcoded productionReady:true literal was found - this must always be a computed expression, never a bare literal, so it can never silently claim readiness a dependency does not actually have."
            exit 1
          fi
          echo "No hardcoded productionReady:true literal found."
      - name: Verify the Production Readiness registry's own safety enforcement cannot be bypassed
        shell: bash
        run: |
          rm -rf .production-readiness-d1
          npx wrangler dev --config wrangler.production-readiness.jsonc --persist-to .production-readiness-d1 --port 8791 > /tmp/production-readiness-worker.log 2>&1 &
          worker_pid=$!
          trap 'cat /tmp/production-readiness-worker.log; kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8791/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          status=$(curl -sS -o /tmp/production-readiness-result.json -w '%{http_code}' http://127.0.0.1:8791/run)
          cat /tmp/production-readiness-result.json
          test "$status" = 200
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/production-readiness-result.json','utf8'));if(!r.ok)throw new Error(r.error||'Production readiness regression failed');const a=r.assertions||{};if(a.razorpayCredentialStatus!=='missing')throw new Error('expected missing credential status, got '+a.razorpayCredentialStatus);if(a.registryProductionReady!==false)throw new Error('registry must honestly report productionReady=false');if(!a.bypassBlocked)throw new Error('controlled_live_verified bypass was not blocked');if(!a.secretLeakBlocked)throw new Error('secret value leak into secret_reference was not blocked');if(!a.razorpayIsLaunchBlocker)throw new Error('Razorpay must appear as a real launch blocker');"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
