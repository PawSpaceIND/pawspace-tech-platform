name: Release CI

on:
  push:
    branches:
      - main
      - grooming-integration-closure
      - agent/food-gates1-5
      - agent/platform-stack-recertification
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run lint

  artifact:
    name: Artifact validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:artifact

  runtime-d1:
    name: Runtime D1 regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Execute production flow against isolated local D1
        shell: bash
        run: |
          rm -rf .runtime-d1
          npx wrangler dev --config wrangler.runtime-d1.jsonc --persist-to .runtime-d1 --port 8788 > /tmp/runtime-d1-worker.log 2>&1 &
          worker_pid=$!
          trap 'cat /tmp/runtime-d1-worker.log; kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          status=$(curl -sS -o /tmp/runtime-d1-result.json -w '%{http_code}' http://127.0.0.1:8788/run)
          cat /tmp/runtime-d1-result.json
          test "$status" = 200
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/runtime-d1-result.json','utf8'));if(!r.ok)throw new Error(r.error||'Runtime D1 regression failed');for(const [k,v] of Object.entries(r.assertions||{})){if(v!==1)throw new Error(k+' cardinality was '+v)}"

  pricing-control-d1:
    name: Pricing Control D1 regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Prove Pricing Control changes real canonical quotes
        shell: bash
        run: |
          rm -rf .pricing-control-d1
          npx wrangler dev --config wrangler.pricing-control.jsonc --persist-to .pricing-control-d1 --port 8789 > /tmp/pricing-control-worker.log 2>&1 &
          worker_pid=$!
          trap 'cat /tmp/pricing-control-worker.log; kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8789/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          status=$(curl -sS -o /tmp/pricing-control-result.json -w '%{http_code}' http://127.0.0.1:8789/run)
          cat /tmp/pricing-control-result.json
          test "$status" = 200
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/pricing-control-result.json','utf8'));if(!r.ok)throw new Error(r.error||'Pricing Control regression failed');const e={training:13000,boarding:1600,sitting:1350,grooming:3600,activeCanonicalRows:5};for(const [k,v] of Object.entries(e)){if(r.assertions?.[k]!==v)throw new Error(k+' expected '+v+' got '+r.assertions?.[k]);}if(!r.oldGroomingRejected)throw new Error('old Grooming multi-pet amount was accepted');"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
