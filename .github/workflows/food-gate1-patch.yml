name: Food Gate 1 patch
on:
  push:
    branches:
      - agent/food-gates1-5
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/food-gates1-5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Food Gate 1 wiring
        run: python scripts/food-gate1-patch.py
      - name: Remove helper and commit Food Gate 1
        run: |
          rm -f .github/workflows/food-gate1-patch.yml scripts/food-gate1-patch.py
          git config user.name "PawSpace Food Closure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Close Food Gate 1 foundation"
          git push origin HEAD:agent/food-gates1-5
