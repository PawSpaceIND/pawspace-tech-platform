name: one-shot fix presentation orchestrator hashes
on:
  push:
    paths:
      - "tmp/fix-presentation-orch-hashes.flag"
permissions:
  contents: write
concurrency:
  group: fix-presentation-orch-hashes
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Update presentation contract orchestrator hashes and self-clean
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OLD=7e0271e8a2ea1b91438eafe1e24c81b162e508162281ac9f105db27c1c465c9b
          NEW=fae47970ba45ee7ad831f396102952a06298fd81fe25b39dda659a3e7ba491d9
          updated=()
          while IFS= read -r -d '' f; do
            if grep -q "$OLD" "$f"; then
              sed -i "s/$OLD/$NEW/g" "$f"
              updated+=("$f")
              echo "updated $f"
            fi
          done < <(find tests/fixtures -type f -name '*-contract.json' -print0)
          test "${#updated[@]}" -ge 1
          # verify no old hash remains in fixtures and new hash present where path is pinned
          if grep -R "$OLD" tests/fixtures --include='*-contract.json'; then
            echo "old hash still present" >&2
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = "fae47970ba45ee7ad831f396102952a06298fd81fe25b39dda659a3e7ba491d9"
          actual = hashlib.sha256(Path("lib/ai-conversation-orchestrator.ts").read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          for p in Path("tests/fixtures").glob("*-contract.json"):
              data = json.loads(p.read_text())
              protected = data.get("protected") or data.get("sources") or {}
              # walk nested dicts for the path key
              def walk(obj):
                  if isinstance(obj, dict):
                      for k,v in obj.items():
                          if k == "lib/ai-conversation-orchestrator.ts":
                              assert v == expected, (p, v)
                          else:
                              walk(v)
                  elif isinstance(obj, list):
                      for i in obj: walk(i)
              walk(data)
          print("all orchestrator pins match", expected)
          PY
          rm -f tmp/fix-presentation-orch-hashes.flag tmp/batch-c-1246-ci-retrigger.txt \
            .github/workflows/one-shot-fix-presentation-orch-hashes.yml
          rmdir tmp 2>/dev/null || true
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add -A
          git status --short
          git commit -m "test(contracts): pin presentation fixtures to AI-02 orchestrator hash"
          git push origin "HEAD:${BRANCH}"
