name: PR674 existing captured payment recovery proof
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Must equal existing-capture-recovery-674'
        required: true
        type: string
      candidate_sha:
        description: 'Exact current PR674 candidate SHA'
        required: true
        type: string
      worker_name:
        description: 'Exact isolated checkout Worker name'
        required: true
        type: string
      worker_origin:
        description: 'Exact isolated checkout Worker origin'
        required: true
        type: string
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      APP_ENV: staging
      FORBID_PRODUCTION: 'true'
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prove existing captured TEST payment recovers without a new charge
        if: ${{ inputs.confirm == 'existing-capture-recovery-674' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          PR674_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PR674_WORKER_NAME: ${{ inputs.worker_name }}
          PR674_WORKER_ORIGIN: ${{ inputs.worker_origin }}
        run: npx playwright test e2e/pr674-existing-capture-recovery-proof.spec.ts --project=chromium --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr674-existing-capture-recovery-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
