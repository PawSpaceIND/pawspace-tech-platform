name: Performance remediation bootstrap

on:
  push:
    branches:
      - fix/performance-concurrency-load-certification

permissions:
  contents: write

env:
  PAWSPACE_PAYMENT_ENV: sandbox
  PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
  FORBID_PRODUCTION: 'true'
  NODE_ENV: test
  APP_ENV: staging

jobs:
  remediate:
    if: github.event.head_commit.message == 'chore: bootstrap performance remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/performance-concurrency-load-certification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm run install:ci
      - name: Apply deterministic remediation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              count=text.count(old)
              if count!=1: raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old,new,1)
          def regex_once(text, pattern, repl, label, flags=0):
              out,count=re.subn(pattern,repl,text,count=1,flags=flags)
              if count!=1: raise SystemExit(f'{label}: expected exactly one regex match, found {count}')
              return out

          # Provider capacity: bounded write retry + CAS + deterministic 409.
          p='app/api/provider-capacity-control/route.ts'; s=read(p)
          s=replace_once(s,'import{seedProviderCapacityDefaults}from"../../../lib/provider-capacity-governance";','import{seedProviderCapacityDefaults}from"../../../lib/provider-capacity-governance";\nimport{withRetryingD1Writes}from"../../../lib/d1-write-retry";','provider retry import')
          s=replace_once(s,'async function database(){const{env}=await import("cloudflare:workers");return env.DB;}','async function database(){const{env}=await import("cloudflare:workers");return withRetryingD1Writes(env.DB);}','provider retry database')
          old='const now=Date.now(),set=entries.map(([key])=>`${key}=?`).join(",");await db.prepare(`UPDATE provider_capacity_profiles SET ${set},version=version+1,updated_by=?,updated_at=? WHERE id=?`).bind(...entries.map(([,value])=>value),actor.email,now,body.providerId).run();const after=await db.prepare("SELECT * FROM provider_capacity_profiles WHERE id=?").bind(body.providerId).first<Row>();'
          new='const now=Date.now(),set=entries.map(([key])=>`${key}=?`).join(","),expectedVersion=Number(before.version||0);const updated=await db.prepare(`UPDATE provider_capacity_profiles SET ${set},version=version+1,updated_by=?,updated_at=? WHERE id=? AND version=?`).bind(...entries.map(([,value])=>value),actor.email,now,body.providerId,expectedVersion).run();if(Number(updated.meta?.changes||0)!==1)return json({error:"CONCURRENT_MODIFICATION",code:"CONCURRENT_MODIFICATION"},409);const after=await db.prepare("SELECT * FROM provider_capacity_profiles WHERE id=?").bind(body.providerId).first<Row>();'
          s=replace_once(s,old,new,'provider CAS')
          write(p,s)

          # Catalogue: version-CAS; route maps stale writers to 409 and uses bounded retry wrapper.
          p='lib/catalogue-governance.ts'; s=read(p)
          old='const now = Date.now(), set = entries.map(([k]) => `${k}=?`).join(",");\n  await db.prepare(`UPDATE catalogue_packages SET ${set},version=version+1,updated_by=?,updated_at=? WHERE id=?`).bind(...entries.map(([k, v]) => k === "active" ? (v ? 1 : 0) : v as never), input.actorId, now, input.id).run();'
          new='const now = Date.now(), set = entries.map(([k]) => `${k}=?`).join(","), expectedVersion = Number(before.version || 0);\n  const updated = await db.prepare(`UPDATE catalogue_packages SET ${set},version=version+1,updated_by=?,updated_at=? WHERE id=? AND version=?`).bind(...entries.map(([k, v]) => k === "active" ? (v ? 1 : 0) : v as never), input.actorId, now, input.id, expectedVersion).run();\n  if (Number(updated.meta?.changes || 0) !== 1) throw new Error("CONCURRENT_MODIFICATION");'
          s=replace_once(s,old,new,'catalogue CAS'); write(p,s)

          p='app/api/catalogue/route.ts'; s=read(p)
          s=replace_once(s,'import{createCataloguePackage,updateCataloguePackage,listCataloguePackages}from"../../../lib/catalogue-governance";','import{createCataloguePackage,updateCataloguePackage,listCataloguePackages}from"../../../lib/catalogue-governance";\nimport{withRetryingD1Writes}from"../../../lib/d1-write-retry";','catalogue retry import')
          s=s.replace('const db=await database(),actor=await resolveActor(request);requirePermission(actor,"pricing.manage");','const db=withRetryingD1Writes(await database()),actor=await resolveActor(request);requirePermission(actor,"pricing.manage");')
          s=replace_once(s,'  }catch(error){return authError(error,"Unable to update package");}\n}','  }catch(error){if(error instanceof Error&&error.message==="CONCURRENT_MODIFICATION")return json({error:"CONCURRENT_MODIFICATION",code:"CONCURRENT_MODIFICATION"},409);return authError(error,"Unable to update package");}\n}','catalogue 409')
          write(p,s)

          # Subscription plans: same CAS/retry contract.
          p='lib/subscription-plan-governance.ts'; s=read(p)
          old='const now = Date.now(), set = normalizedEntries.map(([k]) => `${k}=?`).join(",");\n  await db.prepare(`UPDATE subscription_plans SET ${set},version=version+1,updated_by=?,updated_at=? WHERE id=?`).bind(...normalizedEntries.map(([, v]) => v as never), input.actorId, now, input.id).run();'
          new='const now = Date.now(), set = normalizedEntries.map(([k]) => `${k}=?`).join(","), expectedVersion = Number(before.version || 0);\n  const updated = await db.prepare(`UPDATE subscription_plans SET ${set},version=version+1,updated_by=?,updated_at=? WHERE id=? AND version=?`).bind(...normalizedEntries.map(([, v]) => v as never), input.actorId, now, input.id, expectedVersion).run();\n  if (Number(updated.meta?.changes || 0) !== 1) throw new Error("CONCURRENT_MODIFICATION");'
          s=replace_once(s,old,new,'subscription CAS'); write(p,s)

          p='app/api/subscription-plans/route.ts'; s=read(p)
          s=replace_once(s,'import{createSubscriptionPlan,updateSubscriptionPlan,listSubscriptionPlans}from"../../../lib/subscription-plan-governance";','import{createSubscriptionPlan,updateSubscriptionPlan,listSubscriptionPlans}from"../../../lib/subscription-plan-governance";\nimport{withRetryingD1Writes}from"../../../lib/d1-write-retry";','subscription retry import')
          s=s.replace('const db=await database(),actor=await resolveActor(request);requirePermission(actor,"pricing.manage");','const db=withRetryingD1Writes(await database()),actor=await resolveActor(request);requirePermission(actor,"pricing.manage");')
          s=replace_once(s,'  }catch(error){return authError(error,"Unable to update subscription plan");}\n}','  }catch(error){if(error instanceof Error&&error.message==="CONCURRENT_MODIFICATION")return json({error:"CONCURRENT_MODIFICATION",code:"CONCURRENT_MODIFICATION"},409);return authError(error,"Unable to update subscription plan");}\n}','subscription 409')
          write(p,s)

          # Canonical hot-read indexes + collapse 100-row N+1 fanout into one two-statement batch.
          p='app/api/canonical-bookings/route.ts'; s=read(p)
          marker='  db.prepare("CREATE INDEX IF NOT EXISTS idx_canonical_pets_customer ON canonical_pets(customer_id)"),\n'
          s=replace_once(s,marker,marker+'  db.prepare("CREATE INDEX IF NOT EXISTS idx_canonical_bookings_service_updated ON canonical_bookings(service_code,updated_at DESC)"),\n  db.prepare("CREATE INDEX IF NOT EXISTS idx_canonical_bookings_created ON canonical_bookings(created_at DESC)"),\n','canonical indexes')
          new_get='''export async function GET(request:Request){try{const actor=await resolveActor(request);requirePermission(actor,"bookings.manage");const db=await database();await ensureTables(db);const rows=await db.prepare("SELECT b.*,c.name customer_name,w.id work_order_id,w.provider_name,w.provider_model,w.status work_order_status,w.occurrence_count,p.id payment_id,p.status payment_status,p.amount_due_now,p.gateway FROM canonical_bookings b JOIN canonical_customers c ON c.id=b.customer_id JOIN provider_work_orders w ON w.booking_id=b.id JOIN booking_payments p ON p.booking_id=b.id ORDER BY b.created_at DESC LIMIT 100").all<Record<string,unknown>>();if(!rows.results.length)return json({bookings:[]});const bookingIds=rows.results.map(row=>String(row.id)),customerIds=[...new Set(rows.results.map(row=>String(row.customer_id)))],bookingMarks=bookingIds.map(()=>"?").join(","),customerMarks=customerIds.map(()=>"?").join(",");const[petResult,eventResult]=await db.batch([db.prepare(`SELECT id,customer_id,name,species,breed,vaccination_status FROM canonical_pets WHERE customer_id IN (${customerMarks}) ORDER BY customer_id,name`).bind(...customerIds),db.prepare(`SELECT * FROM booking_lifecycle_events WHERE booking_id IN (${bookingMarks}) ORDER BY booking_id,occurred_at ASC`).bind(...bookingIds)]);const petsByCustomer=new Map<string,Record<string,unknown>[]>,eventsByBooking=new Map<string,Record<string,unknown>[]>;for(const pet of petResult.results as Record<string,unknown>[]){const key=String(pet.customer_id),list=petsByCustomer.get(key)||[];list.push(pet);petsByCustomer.set(key,list);}for(const event of eventResult.results as Record<string,unknown>[]){const key=String(event.booking_id),list=eventsByBooking.get(key)||[];list.push(event);eventsByBooking.set(key,list);}const bookings=rows.results.map(row=>{const wanted=new Set((JSON.parse(String(row.pet_ids_json||"[]")) as unknown[]).map(String));const pets=(petsByCustomer.get(String(row.customer_id))||[]).filter(pet=>wanted.has(String(pet.id)));return{...row,pets,events:eventsByBooking.get(String(row.id))||[]};});return json({bookings});}catch(error){return authError(error,"Unable to load lifecycle records");}}'''
          s=regex_once(s,r'export async function GET\(request:Request\)\{try\{const actor=.*?\}\}\n\nexport async function POST',new_get+'\n\nexport async function POST','canonical N+1 collapse',re.S)
          write(p,s)

          # Finance hot indexes are materialized by both schema owners, including already-created DBs.
          p='app/api/grooming-finance/route.ts'; s=read(p)
          s=replace_once(s,'"idx_payment_gateway_links_payment_link"] as const;','"idx_payment_gateway_links_payment_link","idx_canonical_bookings_service_updated","idx_canonical_bookings_created"] as const;','finance schema objects')
          marker='  db.prepare("CREATE TABLE IF NOT EXISTS canonical_bookings (id TEXT PRIMARY KEY,idempotency_key TEXT NOT NULL UNIQUE,customer_id TEXT NOT NULL,pet_ids_json TEXT NOT NULL,source_pet_ids_json TEXT NOT NULL,city_id TEXT NOT NULL,zone_id TEXT NOT NULL,service_code TEXT NOT NULL,package_code TEXT NOT NULL,package_name TEXT NOT NULL,schedule_group_id TEXT NOT NULL UNIQUE,provider_id TEXT NOT NULL,scheduled_start TEXT NOT NULL,scheduled_end TEXT NOT NULL,status TEXT NOT NULL DEFAULT \'confirmed\',channel TEXT NOT NULL DEFAULT \'customer_app\',total_amount REAL NOT NULL,currency TEXT NOT NULL DEFAULT \'INR\',pricing_json TEXT NOT NULL DEFAULT \'{}\',created_by TEXT NOT NULL,created_at INTEGER NOT NULL,updated_at INTEGER NOT NULL)"),\n'
          s=replace_once(s,marker,marker+'  db.prepare("CREATE INDEX IF NOT EXISTS idx_canonical_bookings_service_updated ON canonical_bookings(service_code,updated_at DESC)"),\n  db.prepare("CREATE INDEX IF NOT EXISTS idx_canonical_bookings_created ON canonical_bookings(created_at DESC)"),\n','finance booking indexes')
          write(p,s)

          p='lib/grooming-payment-reconciliation.ts'; s=read(p)
          s=replace_once(s,'"idx_payment_gateway_links_payment_link"] as const;','"idx_payment_gateway_links_payment_link","idx_payment_recon_status_payment","idx_payment_recon_status_created"] as const;','recon schema objects')
          marker='  db.prepare("CREATE TABLE IF NOT EXISTS payment_reconciliation_exceptions (id TEXT PRIMARY KEY,booking_id TEXT,payment_id TEXT,event_id TEXT,exception_type TEXT NOT NULL,severity TEXT NOT NULL,status TEXT NOT NULL DEFAULT \'open\',detail_json TEXT NOT NULL DEFAULT \'{}\',created_at INTEGER NOT NULL,resolved_at INTEGER,resolved_by TEXT)"),\n'
          s=replace_once(s,marker,marker+'  db.prepare("CREATE INDEX IF NOT EXISTS idx_payment_recon_status_payment ON payment_reconciliation_exceptions(status,payment_id)"),\n  db.prepare("CREATE INDEX IF NOT EXISTS idx_payment_recon_status_created ON payment_reconciliation_exceptions(status,created_at DESC)"),\n','recon indexes')
          write(p,s)

          # Harden hosted load harness: strict isolation, tunable timeout, transient retry only during setup.
          p='scripts/ops/staging-performance-gate.mjs'; s=read(p)
          s=replace_once(s,"const OUT = String(process.env.PERF_EVIDENCE_PATH || 'staging-performance.json');\nif (!BASE || !ACCESS || !WEBHOOK_SECRET) throw new Error('STAGING_URL, PAWSPACE_UAT_ACCESS_CODE, and RAZORPAY_WEBHOOK_SECRET_SANDBOX are required');","const OUT = String(process.env.PERF_EVIDENCE_PATH || 'staging-performance.json');\nconst REQUEST_TIMEOUT_MS = Math.max(5000, Math.min(60000, Number(process.env.PERF_REQUEST_TIMEOUT_MS || 30000)));\nif (process.env.PAWSPACE_PAYMENT_ENV !== 'sandbox' || process.env.FORBID_PRODUCTION !== 'true' || process.env.APP_ENV !== 'staging') throw new Error('Performance gate requires PAWSPACE_PAYMENT_ENV=sandbox, FORBID_PRODUCTION=true, APP_ENV=staging');\nif (!BASE || !ACCESS || !WEBHOOK_SECRET) throw new Error('STAGING_URL, PAWSPACE_UAT_ACCESS_CODE, and RAZORPAY_WEBHOOK_SECRET_SANDBOX are required');","performance isolation")
          s=s.replace('signal: AbortSignal.timeout(20000),','signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),')
          s=s.replace('const ASSIGNMENT_CONCURRENCY = 10;','const ASSIGNMENT_CONCURRENCY = Math.max(1, Math.min(10, Number(process.env.PERF_ASSIGNMENT_CONCURRENCY || 5)));')
          insert='''\nasync function rawRequestWithTransientRetry(path, options = {}) {\n  let lastError;\n  for (let attempt = 0; attempt < 3; attempt += 1) {\n    try {\n      const result = await rawRequest(path, options);\n      if (![429,500,502,503,504].includes(result.response.status)) return result;\n      lastError = new Error(`transient ${result.response.status} from ${path}`);\n    } catch (error) {\n      lastError = error;\n      const transient = error?.name === 'TimeoutError' || /timeout|ECONNRESET|fetch failed/i.test(String(error?.message || error));\n      if (!transient) throw error;\n    }\n    if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 250 * (2 ** attempt)));\n  }\n  throw lastError || new Error(`Transient request retries exhausted for ${path}`);\n}\n'''
          s=replace_once(s,'async function request(path, options = {}) {',insert+'\nasync function request(path, options = {}) {','transient helper')
          s=s.replace("const {response,payload,text} = await rawRequest('/api/uat-scheduling', {method:'POST', cookie, body:schedulingBody});","const {response,payload,text} = await rawRequestWithTransientRetry('/api/uat-scheduling', {method:'POST', cookie, body:schedulingBody});")
          write(p,s)

          # Executable local verification + EXPLAIN guards.
          Path('tests/performance-load-remediation.test.mjs').write_text(r'''import test from "node:test";
import assert from "node:assert/strict";
import {DatabaseSync} from "node:sqlite";
import {readFileSync} from "node:fs";

function locked(){assert.equal(process.env.PAWSPACE_PAYMENT_ENV,"sandbox");assert.equal(process.env.FORBID_PRODUCTION,"true");assert.equal(process.env.NODE_ENV,"test");assert.equal(process.env.APP_ENV,"staging");}
function plan(db,sql){return db.prepare(`EXPLAIN QUERY PLAN ${sql}`).all().map(row=>String(row.detail)).join("\n");}

test("performance audit is sandbox locked",()=>locked());

test("control-plane versioned mutations use CAS and deterministic conflict mapping",()=>{locked();const provider=readFileSync("app/api/provider-capacity-control/route.ts","utf8"),catalogue=readFileSync("lib/catalogue-governance.ts","utf8"),catalogueRoute=readFileSync("app/api/catalogue/route.ts","utf8"),plans=readFileSync("lib/subscription-plan-governance.ts","utf8"),planRoute=readFileSync("app/api/subscription-plans/route.ts","utf8");assert.match(provider,/WHERE id=\? AND version=\?/);assert.match(provider,/CONCURRENT_MODIFICATION/);assert.match(provider,/withRetryingD1Writes/);assert.match(catalogue,/WHERE id=\? AND version=\?/);assert.match(catalogue,/meta\?\.changes/);assert.match(catalogueRoute,/withRetryingD1Writes/);assert.match(catalogueRoute,/CONCURRENT_MODIFICATION[\s\S]*409/);assert.match(plans,/WHERE id=\? AND version=\?/);assert.match(plans,/meta\?\.changes/);assert.match(planRoute,/withRetryingD1Writes/);assert.match(planRoute,/CONCURRENT_MODIFICATION[\s\S]*409/);});

test("canonical booking GET collapses N+1 child reads into one batch",()=>{locked();const source=readFileSync("app/api/canonical-bookings/route.ts","utf8"),get=source.slice(source.indexOf("export async function GET"),source.indexOf("export async function POST"));assert.match(get,/await db\.batch\(\[/);assert.doesNotMatch(get,/for\(const row of rows\.results\)\{const \[pets,events\]=await Promise\.all/);assert.match(source,/idx_canonical_bookings_created/);assert.match(source,/idx_canonical_bookings_service_updated/);});

test("finance hot queries use composite indexes without temp sort trees",()=>{locked();const db=new DatabaseSync(":memory:");db.exec(`CREATE TABLE canonical_bookings(id TEXT PRIMARY KEY,service_code TEXT NOT NULL,updated_at INTEGER NOT NULL,created_at INTEGER NOT NULL);CREATE INDEX idx_canonical_bookings_service_updated ON canonical_bookings(service_code,updated_at DESC);CREATE INDEX idx_canonical_bookings_created ON canonical_bookings(created_at DESC);CREATE TABLE payment_reconciliation_exceptions(id TEXT PRIMARY KEY,payment_id TEXT,status TEXT NOT NULL,created_at INTEGER NOT NULL);CREATE INDEX idx_payment_recon_status_payment ON payment_reconciliation_exceptions(status,payment_id);CREATE INDEX idx_payment_recon_status_created ON payment_reconciliation_exceptions(status,created_at DESC);`);const bookingPlan=plan(db,"SELECT * FROM canonical_bookings WHERE service_code='grooming' ORDER BY updated_at DESC LIMIT 200"),createdPlan=plan(db,"SELECT * FROM canonical_bookings ORDER BY created_at DESC LIMIT 100"),exceptionGroup=plan(db,"SELECT payment_id,COUNT(*) FROM payment_reconciliation_exceptions WHERE status='open' GROUP BY payment_id"),exceptionRecent=plan(db,"SELECT * FROM payment_reconciliation_exceptions WHERE status='open' ORDER BY created_at DESC LIMIT 50");assert.match(bookingPlan,/idx_canonical_bookings_service_updated/i);assert.match(createdPlan,/idx_canonical_bookings_created/i);assert.match(exceptionGroup,/idx_payment_recon_status_payment/i);assert.match(exceptionRecent,/idx_payment_recon_status_created/i);for(const detail of[bookingPlan,createdPlan,exceptionGroup,exceptionRecent])assert.doesNotMatch(detail,/USE TEMP B-TREE/i);});
''')

          Path('scripts/ops/performance-load-certification.mjs').write_text(r'''import {spawnSync} from "node:child_process";
const required={PAWSPACE_PAYMENT_ENV:"sandbox",FORBID_PRODUCTION:"true",NODE_ENV:"test",APP_ENV:"staging"};
for(const [key,value] of Object.entries(required))if(process.env[key]!==value)throw new Error(`${key} must equal ${value}`);
const nodeArgs=["--experimental-strip-types","--test","--test-concurrency=1","tests/performance-load-remediation.test.mjs","tests/schema-query-plan.test.mjs","tests/uat-scheduling-d1-contention.test.mjs"];
const local=spawnSync(process.execPath,nodeArgs,{stdio:"inherit",env:process.env});
if(local.status!==0)process.exit(local.status??1);
if(process.env.PERFORMANCE_LOAD_HOSTED==="true"){
  for(const key of["STAGING_URL","PAWSPACE_UAT_ACCESS_CODE","RAZORPAY_WEBHOOK_SECRET_SANDBOX"])if(!process.env[key])throw new Error(`${key} is required for hosted performance certification`);
  const hosted=spawnSync(process.execPath,["scripts/ops/staging-performance-gate.mjs"],{stdio:"inherit",env:process.env});
  if(hosted.status!==0)process.exit(hosted.status??1);
}else console.log("Hosted load phase skipped; set PERFORMANCE_LOAD_HOSTED=true inside isolated staging certification.");
''')

          # Register requested command.
          p='package.json'; s=read(p)
          s=replace_once(s,'    "test:schema-governance": "PAWSPACE_PAYMENT_ENV=sandbox FORBID_PRODUCTION=true NODE_ENV=test APP_ENV=staging node --experimental-strip-types --test --test-concurrency=1 tests/schema-creation-source-contract.test.mjs tests/schema-governance-runtime.test.mjs tests/schema-migration-idempotency.test.mjs tests/schema-query-plan.test.mjs",','    "test:schema-governance": "PAWSPACE_PAYMENT_ENV=sandbox FORBID_PRODUCTION=true NODE_ENV=test APP_ENV=staging node --experimental-strip-types --test --test-concurrency=1 tests/schema-creation-source-contract.test.mjs tests/schema-governance-runtime.test.mjs tests/schema-migration-idempotency.test.mjs tests/schema-query-plan.test.mjs",\n    "test:performance-load": "PAWSPACE_PAYMENT_ENV=sandbox PAWSPACE_PAYMENT_LIVE_APPROVED=false FORBID_PRODUCTION=true NODE_ENV=test APP_ENV=staging node scripts/ops/performance-load-certification.mjs",','package performance script')
          write(p,s)

          # Unpin Track 3: certify the triggering exact head and trigger for this remediation branch.
          p='.github/workflows/staging-performance-track3-verify.yml'; s=read(p)
          s=s.replace('      - fix/staging-performance-remediation\n    paths:\n      - .github/workflows/staging-performance-track3-verify.yml','      - fix/staging-performance-remediation\n      - fix/performance-concurrency-load-certification')
          s=re.sub(r'  EXPECTED_SHA: [0-9a-f]{40}', '  EXPECTED_SHA: ${{ github.sha }}', s, count=1)
          s=replace_once(s,"  FORBID_PRODUCTION: 'true'","  FORBID_PRODUCTION: 'true'\n  PAWSPACE_PAYMENT_ENV: sandbox",'workflow sandbox env')
          s=s.replace('        run: node scripts/ops/staging-performance-gate.mjs','        run: PERFORMANCE_LOAD_HOSTED=true npm run test:performance-load')
          verify='''      - name: Run local performance/load guards\n        run: npm run test:performance-load\n'''
          s=replace_once(s,'      - name: Configure isolated staging\n',verify+'      - name: Configure isolated staging\n','workflow local guard')
          write(p,s)
          PY
      - name: Run remediation verification
        run: npm run test:performance-load
      - name: Typecheck affected TypeScript
        run: npm run typecheck
      - name: Commit remediation
        run: |
          git config user.name "PawSpace Performance Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json app/api/provider-capacity-control/route.ts app/api/catalogue/route.ts app/api/subscription-plans/route.ts app/api/canonical-bookings/route.ts app/api/grooming-finance/route.ts lib/catalogue-governance.ts lib/subscription-plan-governance.ts lib/grooming-payment-reconciliation.ts scripts/ops/staging-performance-gate.mjs scripts/ops/performance-load-certification.mjs tests/performance-load-remediation.test.mjs .github/workflows/staging-performance-track3-verify.yml
          git commit -m "fix(perf): enforce CAS, batch hot reads, and certify load"
          git push origin HEAD:fix/performance-concurrency-load-certification
