name: Performance remediation bootstrap

on:
  push:
    branches:
      - fix/performance-concurrency-load-certification

permissions:
  contents: write

env:
  PAWSPACE_PAYMENT_ENV: sandbox
  PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
  FORBID_PRODUCTION: 'true'
  NODE_ENV: test
  APP_ENV: staging

jobs:
  remediate:
    if: github.event.head_commit.message == 'chore(perf): repair remediation bootstrap workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/performance-concurrency-load-certification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm run install:ci
      - name: Apply deterministic remediation
        run: python3 scripts/ops/apply-performance-remediation.py
      - name: Run remediation verification
        run: npm run test:performance-load
      - name: Typecheck affected TypeScript
        run: npm run typecheck
      - name: Commit remediation
        run: |
          git config user.name "PawSpace Performance Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json app/api/provider-capacity-control/route.ts app/api/catalogue/route.ts app/api/subscription-plans/route.ts app/api/canonical-bookings/route.ts app/api/grooming-finance/route.ts lib/catalogue-governance.ts lib/subscription-plan-governance.ts scripts/ops/staging-performance-gate.mjs scripts/ops/performance-load-certification.mjs tests/performance-load-remediation.test.mjs .github/workflows/staging-performance-track3-verify.yml
          git commit -m "fix(perf): enforce CAS, batch hot reads, and certify load"
          git push origin HEAD:fix/performance-concurrency-load-certification
