name: Align staging contention remediation harness

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/staging-performance-remediation-harness-fix.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - name: Align v2 source matcher and replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/staging-performance-remediation-apply-v2.yml')
          s=p.read_text()
          old1='all<Record<string,unknown>>(),authored=new Set(authoredRows.results.map(row=>`${String(row.provider_id)}|${String(row.date)}`));'
          new1='all<Record<string,unknown>>();const authored=new Set(authoredRows.results.map(row=>`${String(row.provider_id)}|${String(row.date)}`));'
          old2='all<Record<string,unknown>>(),existing=new Set(existingRows.results.map(row=>`${String(row.provider_id)}|${String(row.date)}|${String(row.zone_id)}`));'
          new2='all<Record<string,unknown>>();const existing=new Set(existingRows.results.map(row=>`${String(row.provider_id)}|${String(row.date)}|${String(row.zone_id)}`));'
          if old1 not in s or old2 not in s:
            raise SystemExit('expected v2 matcher text not found')
          p.write_text(s.replace(old1,new1,1).replace(old2,new2,1))
          PY
      - name: Push aligned harness only
        run: |
          set -euo pipefail
          git fetch origin fix/staging-performance-remediation
          test "$(git rev-parse origin/fix/staging-performance-remediation)" = "$GITHUB_SHA"
          rm .github/workflows/staging-performance-remediation-harness-fix.yml
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add .github/workflows/staging-performance-remediation-apply-v2.yml .github/workflows/staging-performance-remediation-harness-fix.yml
          git diff --cached --check
          git commit -m "ci: align remediation harness with current scheduling route"
          git push origin HEAD:fix/staging-performance-remediation
