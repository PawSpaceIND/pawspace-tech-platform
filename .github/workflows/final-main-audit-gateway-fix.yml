name: Final-main audit Ops gateway fix

on:
  push:
    branches:
      - testfix/final-main-independent-audit-20260825

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align system-wide Ops gateway permissions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("lib/api-gateway.ts")
          s=p.read_text()
          replacements={
            'if(url.pathname==="/api/training-ops")return "bookings.view";':'if(url.pathname==="/api/training-ops")return "bookings.manage";',
            'if(url.pathname==="/api/walking-ops")return method==="GET"?"bookings.view":"bookings.manage";':'if(url.pathname==="/api/walking-ops")return "bookings.manage";',
            'if(url.pathname==="/api/taxi-ops")return method==="GET"?"bookings.view":"bookings.manage";':'if(url.pathname==="/api/taxi-ops")return "bookings.manage";',
            'if(url.pathname==="/api/food-ops")return method==="GET"?"bookings.view":"bookings.manage";':'if(url.pathname==="/api/food-ops")return "bookings.manage";',
            'if(url.pathname==="/api/food-supply-chain")return method==="GET"?"bookings.view":"bookings.manage";':'if(url.pathname==="/api/food-supply-chain")return "bookings.manage";',
            'if(url.pathname==="/api/sitting-ops")return method==="GET"?"bookings.view":"bookings.manage";':'if(url.pathname==="/api/sitting-ops")return "bookings.manage";',
            'if(url.pathname==="/api/boarding-ops")return method==="GET"?"bookings.view":"bookings.manage";':'if(url.pathname==="/api/boarding-ops")return "bookings.manage";',
          }
          changed=0
          for old,new in replacements.items():
            if old in s:
              if s.count(old)!=1: raise SystemExit(f"gateway mapping not unique: {old}")
              s=s.replace(old,new,1); changed+=1
            elif new not in s:
              raise SystemExit(f"gateway mapping missing: {old}")
          if changed==0:
            Path(".gateway-noop").write_text("1")
          else:
            p.write_text(s)
          PY
          git diff --check
      - name: Commit gateway alignment when present
        shell: bash
        run: |
          if [ -f .gateway-noop ]; then exit 0; fi
          git config user.name PawSpaceIND
          git config user.email karthik@pawspace.in
          git add lib/api-gateway.ts
          git commit -m "fix: align system-wide Ops gateway permissions"
          git push origin HEAD:testfix/final-main-independent-audit-20260825
