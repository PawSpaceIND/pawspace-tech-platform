name: P0 Audio Bot STT-TTS Closure

on:
  push:
    branches:
      - remediation/p0-pilot-gates-b379631
    paths:
      - .github/workflows/p0-audio-bot-stt-tts-closure.yml
      - lib/voice-workers-ai.ts
      - scripts/stage-config.mjs
      - tests/voice-workers-ai.test.mjs

permissions:
  contents: read

jobs:
  certify-audio-bot:
    runs-on: ubuntu-24.04
    environment: pawspace-staging
    timeout-minutes: 35
    env:
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
      WRANGLER_CONFIG: dist/server/wrangler.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and run focused voice tests
        shell: bash
        run: |
          set -euo pipefail
          npm run install:ci
          node --experimental-strip-types --test tests/voice-workers-ai.test.mjs tests/voice-speech-failures.test.mjs tests/voice-audio-ssrf.test.mjs tests/voice-route-authorization.test.mjs

      - name: Build staging candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Configure isolated staging with Workers AI binding
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$STAGING_D1_ID" ] || { echo 'STAGING_D1_ID missing' >&2; exit 1; }
          if [ -n "${PRODUCTION_D1_ID:-}" ] && [ "$STAGING_D1_ID" = "$PRODUCTION_D1_ID" ]; then echo 'Refusing production D1.' >&2; exit 1; fi
          node scripts/stage-config.mjs
          SETTINGS="$RUNNER_TEMP/staging-settings.json"; export SETTINGS
          HTTP="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pawspace-staging/settings")"
          [ "$HTTP" = "200" ] || { echo 'Unable to read staging Worker settings.' >&2; exit 1; }
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const settings=JSON.parse(readFileSync(process.env.SETTINGS,'utf8'));
          const bindings=Array.isArray(settings?.result?.bindings)?settings.result.bindings:[];
          const remote={};
          for(const b of bindings){if(b?.type==='plain_text'){const n=String(b.name||'');if(/^[A-Z0-9_]+$/.test(n))remote[n]=String(b.text??b.value??'');}}
          const cfg=JSON.parse(readFileSync(process.env.WRANGLER_CONFIG,'utf8'));
          if(cfg.name!=='pawspace-staging')throw new Error('Refusing non-staging Worker target');
          cfg.vars={...remote,...(cfg.vars||{}),PAWSPACE_PRODUCTION_ENFORCE:'false',VOICE_STT_MODEL:'@cf/openai/whisper',VOICE_TTS_MODEL:'@cf/myshell-ai/melotts'};
          cfg.ai={binding:'AI'};
          cfg.keep_vars=true;
          writeFileSync(process.env.WRANGLER_CONFIG,JSON.stringify(cfg,null,2),{mode:0o600});
          NODE
          rm -f "$SETTINGS"

      - name: Deploy Audio Bot patch to staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/deploy.log"
          npx wrangler deploy --config "$WRANGLER_CONFIG" --keep-vars --message "staging audio-bot-uat ${GITHUB_SHA}" > "$LOG" 2>&1
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$LOG" | tail -n 1 || true)"
          [ "$URL" = "$STAGING_URL" ] || { echo 'Unexpected Worker deployment target.' >&2; exit 1; }
          rm -f "$LOG"
          echo 'Staging-only Audio Bot deployment complete.'

      - name: Obtain temporary founder UAT session
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          COOKIE="$(node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||'').replace(/\/$/,'');
          const code=String(process.env.PAWSPACE_UAT_ACCESS_CODE||'');
          const r=await fetch(`${base}/api/staging-login`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',code,email:'founder@pawspace.in'}),signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw new Error(`staging login HTTP ${r.status}`);
          const c=(r.headers.get('set-cookie')||'').split(';')[0].trim();
          if(!c.includes('='))throw new Error('No UAT session cookie');
          process.stdout.write(c);
          NODE
          )"
          echo "::add-mask::$COOKIE"
          umask 077
          printf '%s' "$COOKIE" > "$RUNNER_TEMP/voice-cookie"

      - name: Verify Workers AI engine status
        shell: bash
        run: |
          set -euo pipefail
          COOKIE="$(cat "$RUNNER_TEMP/voice-cookie")"
          HTTP="$(curl --silent --show-error --output "$RUNNER_TEMP/status.json" --write-out '%{http_code}' -H "cookie: $COOKIE" "$STAGING_URL/api/voice-speech")"
          [ "$HTTP" = "200" ] || { echo "Voice status failed HTTP=$HTTP" >&2; cat "$RUNNER_TEMP/status.json" >&2; exit 1; }
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';
          const b=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/status.json','utf8'));const v=b?.data||{};
          if(v.engine!=='workers_ai'||v.firstParty!==true||v.workersAiBindingPresent!==true)throw new Error(`Workers AI binding not active: ${JSON.stringify(v)}`);
          if(v?.stt?.status!=='connected'||v?.tts?.status!=='connected')throw new Error('STT/TTS not connected');
          console.log('voice_engine=workers_ai stt=connected tts=connected');
          NODE
          rm -f "$RUNNER_TEMP/status.json"

      - name: Run real MeloTTS to Whisper round trip
        shell: bash
        run: |
          set -euo pipefail
          COOKIE="$(cat "$RUNNER_TEMP/voice-cookie")"
          PHRASE='PawSpace authenticated staging voice verification'
          SYNTH="$(curl --silent --show-error --output "$RUNNER_TEMP/tts.json" --write-out '%{http_code}' -X POST -H "cookie: $COOKIE" -H 'content-type: application/json' -H "origin: $STAGING_URL" --data "{\"action\":\"synthesize\",\"text\":\"$PHRASE\",\"language\":\"en\"}" "$STAGING_URL/api/voice-speech")"
          [ "$SYNTH" = "200" ] || { echo "TTS failed HTTP=$SYNTH" >&2; cat "$RUNNER_TEMP/tts.json" >&2; exit 1; }
          node --input-type=module <<'NODE'
          import{readFileSync,writeFileSync}from'node:fs';
          const b=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/tts.json','utf8'));const ref=String(b?.data?.audioRef||'');const p='data:audio/mpeg;base64,';
          if(!ref.startsWith(p))throw new Error('MeloTTS did not return inline MPEG');
          const n=Buffer.from(ref.slice(p.length),'base64').length;if(n<128)throw new Error(`TTS audio too small: ${n}`);
          writeFileSync(process.env.RUNNER_TEMP+'/audio-ref',ref,{mode:0o600});console.log(`melotts=pass audio_bytes=${n}`);
          NODE
          AUDIO_REF="$(cat "$RUNNER_TEMP/audio-ref")"
          export AUDIO_REF COOKIE
          node --input-type=module <<'NODE'
          import{writeFileSync}from'node:fs';
          const base=String(process.env.STAGING_URL||'').replace(/\/$/,'');
          const r=await fetch(`${base}/api/voice-speech`,{method:'POST',headers:{cookie:process.env.COOKIE,'content-type':'application/json',origin:base},body:JSON.stringify({action:'transcribe',audioRef:process.env.AUDIO_REF,language:'en'}),signal:AbortSignal.timeout(60000)});
          const text=await r.text();if(!r.ok)throw new Error(`STT HTTP ${r.status}: ${text.slice(0,300)}`);writeFileSync(process.env.RUNNER_TEMP+'/stt.json',text,{mode:0o600});
          NODE
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';
          const b=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/stt.json','utf8'));const transcript=String(b?.data?.text||'').trim();
          if(!transcript)throw new Error('Whisper returned empty transcript');
          console.log(`whisper=pass transcript_present=true latency_ms=${Number(b?.data?.latencyMs||0)}`);
          NODE
          rm -f "$RUNNER_TEMP/tts.json" "$RUNNER_TEMP/stt.json" "$RUNNER_TEMP/audio-ref" "$RUNNER_TEMP/voice-cookie"

      - name: Closure marker
        run: |
          echo 'Audio Bot STT/TTS UAT — CLOSED ✅'
          echo 'Speech engine: Cloudflare Workers AI'
          echo 'STT: @cf/openai/whisper'
          echo 'TTS: @cf/myshell-ai/melotts'
          echo 'Environment: staging only'
          echo 'Production unchanged'
