name: GPS Tracking Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gps-tracking-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gps-tracking-audit:
    name: GPS tracking sandbox audit
    runs-on: ubuntu-latest
    env:
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_MAPS_ENV: sandbox
      NODE_ENV: test
      APP_ENV: staging
      FORBID_PRODUCTION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Verify sandbox isolation
        shell: bash
        run: |
          test "$PAWSPACE_PAYMENT_ENV" = "sandbox"
          test "$PAWSPACE_MAPS_ENV" = "sandbox"
          echo "PAWSPACE_PAYMENT_ENV=$PAWSPACE_PAYMENT_ENV"
          echo "PAWSPACE_MAPS_ENV=$PAWSPACE_MAPS_ENV"
      - name: Run hardened GPS telemetry and arrival audit
        run: npm run test:gps-tracking-audit
