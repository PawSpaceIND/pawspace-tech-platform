name: Certify Track 3 ledger and finance remediation

on:
  push:
    branches:
      - fix/track3-ledger-finance-certification
    paths:
      - .github/workflows/staging-track3-ledger-finance-certify.yml

permissions:
  contents: read

concurrency:
  group: staging-track3-ledger-finance-certification
  cancel-in-progress: false

env:
  STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
  TARGET_SHA: 82bfe74d79cc07b3536ba291e686836b289e37e5
  BASE_SHA: 96422d8728fea9c88fb014a5b29519df08bc99e4
  FINANCE_FAST_PATH_SHA: 97fcd657214f1e2ea0039fd7392a11652f488b10
  CANONICAL_BATCH_SHA: 65af1a317c457d21cd5520bb273b48a066a0ee2f
  SCHEDULING_FIX_SHA: 7289063beadff7c39ee75a5e95d8e515356b9afb
  CANONICAL_BASE_FIX_SHA: d1a358152e244bcfb19db88684da0991f663965c

jobs:
  certify:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact application SHA and lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git log -1 --pretty=%s | grep -Fx "fix(track3): balance staging seed and accelerate finance reads"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git merge-base --is-ancestor "$FINANCE_FAST_PATH_SHA" HEAD
          git merge-base --is-ancestor "$CANONICAL_BATCH_SHA" HEAD
          git merge-base --is-ancestor "$SCHEDULING_FIX_SHA" HEAD
          git merge-base --is-ancestor "$CANONICAL_BASE_FIX_SHA" HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm run install:ci

      - name: Validate Track 3 application and financial invariants
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            tests/track3-finance-performance-remediation.test.mjs \
            tests/uat-scheduling-d1-contention.test.mjs \
            tests/grooming-closure.test.mjs \
            tests/ptja-p1-regressions.test.mjs \
            tests/financial-lifecycle-concurrency.test.mjs \
            tests/financial-lifecycle-executable-concurrency.test.mjs \
            tests/uat-staging-auth.test.mjs \
            tests/staging-auth-secrets.test.mjs \
            tests/staging-login-identities.test.mjs \
            tests/post-service-payment-link.test.mjs \
            tests/ptja-w2-b2-collection-ledger.test.mjs \
            tests/ptja-w2-08-revenue-reconciliation.test.mjs \
            tests/ptja-w3-lead-attribution.test.mjs \
            tests/lead-engine-hardening.test.mjs \
            tests/ptja-w1-f38-city-status-matrix.test.mjs \
            tests/ptja-w3-waitlist-channel.test.mjs \
            tests/ptja-p0-regressions.test.mjs \
            tests/scheduling-reservation-leases.test.mjs \
            tests/schema-declaration-consistency.test.mjs \
            tests/uat-convergence-source-contract.test.mjs
          npm run typecheck
          npm run build

      - name: Configure isolated staging
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs

      - name: Verify staging-only binding isolation
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('dist/server/wrangler.json','utf8'));
          const binding=(config.d1_databases||[]).find(x=>x.binding==='DB');
          const vars=config.vars||{};
          const evidence={name:config.name,databaseId:binding?.database_id,deploymentEnv:vars.PAWSPACE_DEPLOYMENT_ENV,schedulingEnv:vars.PAWSPACE_SCHEDULING_ENV,paymentEnv:vars.PAWSPACE_PAYMENT_ENV,communicationEnv:vars.PAWSPACE_COMMUNICATION_ENV,targetSha:process.env.TARGET_SHA};
          console.log(JSON.stringify(evidence,null,2));
          if(config.name!=='pawspace-staging'||binding?.database_id!==process.env.STAGING_D1_ID||vars.PAWSPACE_DEPLOYMENT_ENV!=='staging'||vars.PAWSPACE_SCHEDULING_ENV!=='uat'||vars.PAWSPACE_PAYMENT_ENV!=='sandbox'||vars.PAWSPACE_COMMUNICATION_ENV!=='uat') process.exit(1);
          fs.writeFileSync('staging-isolation-evidence.json',JSON.stringify(evidence,null,2));
          NODE

      - name: Pre-create finance read indexes on staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SQL="CREATE INDEX IF NOT EXISTS idx_grooming_finance_bookings_service_updated ON canonical_bookings(service_code,updated_at DESC); CREATE INDEX IF NOT EXISTS idx_payment_reconciliation_exceptions_status_payment ON payment_reconciliation_exceptions(status,payment_id); CREATE INDEX IF NOT EXISTS idx_payment_reconciliation_exceptions_status_created ON payment_reconciliation_exceptions(status,created_at DESC); SELECT name,tbl_name FROM sqlite_master WHERE type='index' AND name IN ('idx_grooming_finance_bookings_service_updated','idx_payment_reconciliation_exceptions_status_payment','idx_payment_reconciliation_exceptions_status_created') ORDER BY name;"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --json --command "$SQL" > staging-track3-indexes.json
          cat staging-track3-indexes.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('staging-track3-indexes.json','utf8'));
          const batches=Array.isArray(raw)?raw:[raw];
          const rows=batches.flatMap(x=>x.results||[]).filter(x=>x?.name);
          const names=new Set(rows.map(x=>x.name));
          for(const name of ['idx_grooming_finance_bookings_service_updated','idx_payment_reconciliation_exceptions_status_payment','idx_payment_reconciliation_exceptions_status_created']) if(!names.has(name)) throw new Error(`missing index ${name}`);
          NODE

      - name: Guard and repair only the known synthetic UAT ledger anomaly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --json --command "SELECT ROUND(COALESCE(SUM(debit),0)-COALESCE(SUM(credit),0),2) drift FROM finance_journal_entries;" > ledger-repair-global-before.json
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --json --command "SELECT source_type,source_id,ROUND(SUM(debit)-SUM(credit),2) drift FROM finance_journal_entries GROUP BY source_type,source_id HAVING ABS(ROUND(SUM(debit)-SUM(credit),2))>0 ORDER BY source_type,source_id;" > ledger-repair-groups-before.json
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --json --command "SELECT id,source_type,source_id,account_code,debit,credit,narration,booking_id,payment_id FROM finance_journal_entries WHERE id IN ('UATD-JRN-BAD-1','UATD-JRN-BAD-2') ORDER BY id;" > ledger-repair-rows-before.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=file=>{const raw=JSON.parse(fs.readFileSync(file,'utf8'));return (Array.isArray(raw)?raw:[raw]).flatMap(x=>x.results||[])};
          const drift=Number(rows('ledger-repair-global-before.json')[0]?.drift??NaN);
          const groups=rows('ledger-repair-groups-before.json');
          const exact=rows('ledger-repair-rows-before.json');
          const evidence={drift,groups,exact,action:null};
          const balancedAlready=drift===0&&groups.length===0;
          if(balancedAlready){evidence.action='noop_already_balanced';fs.writeFileSync('staging-ledger-repair-evidence.json',JSON.stringify(evidence,null,2));process.exit(0)}
          const onlyExpectedGroup=drift===500&&groups.length===1&&groups[0].source_type==='manual'&&groups[0].source_id==='UATD-JRN-BAD'&&Number(groups[0].drift)===500;
          const one=exact.find(x=>x.id==='UATD-JRN-BAD-1');const two=exact.find(x=>x.id==='UATD-JRN-BAD-2');
          const expectedRows=exact.length===2&&one&&two&&one.source_type==='manual'&&two.source_type==='manual'&&one.source_id==='UATD-JRN-BAD'&&two.source_id==='UATD-JRN-BAD'&&Number(one.debit)===5000&&Number(one.credit)===0&&Number(two.debit)===0&&Number(two.credit)===4500&&one.booking_id==null&&two.booking_id==null&&one.payment_id==null&&two.payment_id==null&&one.narration==='Demo seed: deliberately unbalanced journal (anomaly demo)'&&two.narration==='Demo seed: deliberately unbalanced journal (anomaly demo)';
          if(!onlyExpectedGroup||!expectedRows) throw new Error('ledger state is not the exact known synthetic +500 UAT anomaly; refusing mutation');
          evidence.action='repair_exact_synthetic_rows';
          fs.writeFileSync('staging-ledger-repair-evidence.json',JSON.stringify(evidence,null,2));
          fs.writeFileSync('staging-ledger-repair.sql',"UPDATE finance_journal_entries SET narration='Demo seed: balanced manual control journal' WHERE id='UATD-JRN-BAD-1' AND source_type='manual' AND source_id='UATD-JRN-BAD' AND debit=5000 AND credit=0 AND booking_id IS NULL AND payment_id IS NULL AND narration='Demo seed: deliberately unbalanced journal (anomaly demo)';\nUPDATE finance_journal_entries SET credit=5000,narration='Demo seed: balanced manual control journal' WHERE id='UATD-JRN-BAD-2' AND source_type='manual' AND source_id='UATD-JRN-BAD' AND debit=0 AND credit=4500 AND booking_id IS NULL AND payment_id IS NULL AND narration='Demo seed: deliberately unbalanced journal (anomaly demo)';\n");
          NODE
          if [ -f staging-ledger-repair.sql ]; then
            npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --json --file=staging-ledger-repair.sql > ledger-repair-write.json
          else
            echo '[]' > ledger-repair-write.json
          fi
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --json --command "SELECT ROUND(COALESCE(SUM(debit),0)-COALESCE(SUM(credit),0),2) drift FROM finance_journal_entries; SELECT id,debit,credit,narration,booking_id,payment_id FROM finance_journal_entries WHERE id IN ('UATD-JRN-BAD-1','UATD-JRN-BAD-2') ORDER BY id;" > ledger-repair-after.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('ledger-repair-after.json','utf8'));const batches=Array.isArray(raw)?raw:[raw];const resultSets=batches.map(x=>x.results||[]);
          const drift=Number(resultSets[0]?.[0]?.drift??NaN);const exact=resultSets.flat().filter(x=>String(x.id||'').startsWith('UATD-JRN-BAD-'));
          if(drift!==0) throw new Error(`ledger drift remains ${drift}`);
          const two=exact.find(x=>x.id==='UATD-JRN-BAD-2');if(!two||Number(two.credit)!==5000||two.narration!=='Demo seed: balanced manual control journal') throw new Error('synthetic repair postcondition failed');
          NODE

      - name: Deploy exact application SHA to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          SECRETS_FILE="$RUNNER_TEMP/staging-track3-secrets.json"; export SECRETS_FILE
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const required=['PAWSPACE_UAT_ACCESS_CODE','PAWSPACE_UAT_SIGNING_KEY','PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT','RAZORPAY_WEBHOOK_SECRET_SANDBOX'];
          const optional=['RAZORPAY_KEY_ID_SANDBOX','RAZORPAY_KEY_SECRET_SANDBOX'];
          const values=Object.fromEntries(required.map(n=>[n,process.env[n]||'']));
          if(Object.values(values).some(v=>!v)) throw new Error('required Track 3 staging secret missing');
          for(const n of optional) if(process.env[n]) values[n]=process.env[n];
          values.PAWSPACE_STAGING_LIVE_CUSTOMER_OTP='false';
          writeFileSync(process.env.SECRETS_FILE,JSON.stringify(values),{mode:0o600});
          NODE
          npx wrangler deploy --message "staging track3 ledger-finance $TARGET_SHA" --secrets-file "$SECRETS_FILE" 2>&1 | tee deployment.txt

      - name: Seed deterministic staging identities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p scripts/ops
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-role-seed.mjs > scripts/ops/staging-role-seed.mjs
          node --experimental-strip-types scripts/ops/staging-role-seed.mjs "$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --file="$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --file=scripts/employee-seed.sql

      - name: Clear prior Track 3 synthetic reservation capacity only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SQL="SELECT COUNT(*) AS active_before FROM scheduling_reservations WHERE status!='cancelled' AND group_id LIKE 'remediation-%:grp:%'; UPDATE scheduling_reservations SET status='cancelled' WHERE status!='cancelled' AND group_id LIKE 'remediation-%:grp:%'; SELECT COUNT(*) AS active_after FROM scheduling_reservations WHERE status!='cancelled' AND group_id LIKE 'remediation-%:grp:%';"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --json --command "$SQL" > staging-track3-hygiene.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const raw=JSON.parse(fs.readFileSync('staging-track3-hygiene.json','utf8'));const batches=Array.isArray(raw)?raw:[raw];const last=batches.at(-1)?.results?.[0]||{};if(Number(last.active_after??NaN)!==0)process.exit(1);
          NODE

      - name: Verify healthz
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const response=await fetch(process.env.STAGING_URL+'/healthz',{signal:AbortSignal.timeout(15000)});const text=await response.text();let body=null;try{body=JSON.parse(text)}catch{}const evidence={url:process.env.STAGING_URL+'/healthz',status:response.status,ok:response.ok,body};fs.writeFileSync('healthz-evidence.json',JSON.stringify(evidence,null,2));console.log(JSON.stringify(evidence,null,2));if(response.status!==200||body?.status!=='ok')process.exit(1);
          NODE

      - name: Run frozen original 20-second Track 3 gate with Worker tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          PERF_RUN_ID: remediation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +e
          mkdir -p scripts/ops
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-performance-gate.mjs > scripts/ops/staging-performance-gate.mjs
          if grep -F 'AbortSignal.timeout(60000)' scripts/ops/staging-performance-gate.mjs; then echo 'diagnostic timeout mutation detected'; exit 2; fi
          grep -F 'AbortSignal.timeout(20000)' scripts/ops/staging-performance-gate.mjs || exit 2
          timeout 900s npx wrangler tail pawspace-staging --format json > worker-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 5
          node scripts/ops/staging-performance-gate.mjs 2>&1 | tee gate.log
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > gate-status.txt
          sleep 5
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          exit 0

      - name: Verify D1 Track 3 invariants including cancellations
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -f staging-performance.json
          RUN_ID="$(node -e "const r=require('./staging-performance.json');process.stdout.write(r.runId)")"
          SQL="SELECT (SELECT COUNT(*) FROM canonical_bookings WHERE idempotency_key LIKE '${RUN_ID}:booking:%') bookings,(SELECT COUNT(*) FROM booking_payments WHERE booking_id IN (SELECT id FROM canonical_bookings WHERE idempotency_key LIKE '${RUN_ID}:booking:%')) payments,(SELECT COUNT(*) FROM scheduling_assignment_decisions WHERE group_id LIKE '${RUN_ID}:grp:%') assignments,(SELECT COUNT(*) FROM payment_gateway_events WHERE event_id='${RUN_ID}:evt:replay') webhook_events,(SELECT COUNT(*) FROM scheduling_reservations WHERE group_id LIKE '${RUN_ID}:grp:%' AND status='cancelled') cancellations,(SELECT ROUND(COALESCE(SUM(debit),0)-COALESCE(SUM(credit),0),2) FROM finance_journal_entries) ledger_drift;"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --json --command "$SQL" > staging-performance-d1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const raw=JSON.parse(fs.readFileSync('staging-performance-d1.json','utf8'));const row=(Array.isArray(raw)?raw[0]:raw)?.results?.[0]||{};const n=k=>Number(row[k]??NaN);console.log(JSON.stringify(row,null,2));if(n('bookings')!==100||n('payments')!==100||n('assignments')!==100||n('webhook_events')!==1||n('cancellations')!==0||Math.abs(n('ledger_drift'))>0.000001)process.exit(1);
          NODE

      - name: Enforce overall and grooming-finance latency plus zero failures
        if: always()
        run: |
          set -euo pipefail
          test -f staging-performance.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('staging-performance.json','utf8'));
          const failures=p.failures||[];
          const p95=Number(p.metrics?.p95Ms??NaN);
          const financeP95=Number(p.metrics?.byOperation?.['ledger-query']?.p95Ms??NaN);
          const financeCount=Number(p.metrics?.byOperation?.['ledger-query']?.count??NaN);
          const errorRate=Number(p.metrics?.errorRate??NaN);
          const gateStatus=Number(fs.existsSync('gate-status.txt')?fs.readFileSync('gate-status.txt','utf8').trim():NaN);
          const worker=fs.existsSync('worker-tail.log')?fs.readFileSync('worker-tail.log','utf8'):'';
          const workerHttp500=/"status"\s*:\s*500\b/.test(worker);
          const workerBusy=/SQLITE_BUSY|database (?:table )?is locked|cannot start a transaction within a transaction/i.test(worker);
          const evidence={gateStatus,totalRequests:p.metrics?.totalRequests,p95Ms:p95,groomingFinanceP95Ms:financeP95,groomingFinanceCount:financeCount,errorRate,failureCount:failures.length,workerHttp500,workerBusy,thresholds:p.thresholds,counts:p.counts};
          fs.writeFileSync('staging-track3-threshold-evidence.json',JSON.stringify(evidence,null,2));console.log(JSON.stringify(evidence,null,2));
          if(gateStatus!==0||!Number.isFinite(p95)||p95>=750||!Number.isFinite(financeP95)||financeP95>=750||financeCount!==10000||!Number.isFinite(errorRate)||errorRate!==0||failures.length||workerHttp500||workerBusy)process.exit(1);
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-track3-ledger-finance-${{ env.TARGET_SHA }}
          path: |
            deployment.txt
            staging-isolation-evidence.json
            staging-track3-indexes.json
            staging-ledger-repair-evidence.json
            ledger-repair-global-before.json
            ledger-repair-groups-before.json
            ledger-repair-rows-before.json
            ledger-repair-write.json
            ledger-repair-after.json
            staging-track3-hygiene.json
            healthz-evidence.json
            gate.log
            gate-status.txt
            staging-performance.json
            staging-performance-d1.json
            staging-track3-threshold-evidence.json
            worker-tail.log
          if-no-files-found: warn
