name: Apply UAT training partner closure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uat-training-partner-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply remaining Training patch
        run: node scripts/apply-uat-training-remaining.mjs
      - name: Run focused UAT closure acceptance test
        run: node --test tests/uat-training-partner-closure.test.mjs
      - name: Run typecheck
        run: npm ci && npm run typecheck
      - name: Commit patched files
        run: |
          git config user.name "PawSpace Closure Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/mobile-app/training-flow.tsx lib/api-gateway.ts tests/uat-training-partner-closure.test.mjs
          git diff --cached --check
          git commit -m "close remaining Training UAT gaps"
          git push origin HEAD:agent/uat-training-partner-closure
