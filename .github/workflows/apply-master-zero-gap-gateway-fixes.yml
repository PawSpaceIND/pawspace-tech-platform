name: Apply proven zero-gap gateway fixes

on:
  push:
    branches:
      - testfix/master-zero-gap-20260824
    paths:
      - scripts/apply-master-zero-gap-gateway-fixes.mjs
      - .github/workflows/apply-master-zero-gap-gateway-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Apply exact reviewed replacements
        run: node scripts/apply-master-zero-gap-gateway-fixes.mjs
      - name: Prove all reproduced gateway defects are closed
        run: >-
          node --experimental-strip-types --test
          tests/ai-web-chat-worker-gateway.test.mjs
          tests/training-payment-sandbox-gateway-authorization.test.mjs
          tests/uat-provider-switch-worker-gateway.test.mjs
      - name: Verify patch and publish the fix commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --short lib/api-gateway.ts)"
          git config user.name "pawspace-zero-gap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/api-gateway.ts
          git commit -m "fix: align gateway with public and self-service flows"
          git push origin "HEAD:${GITHUB_REF_NAME}"
