name: Certify fixed WhatsApp UAT staging

on:
  push:
    branches:
      - fix/whatsapp-uat-staging-deploy-isolation
    paths:
      - .github/workflows/certify-whatsapp-uat-fixed-staging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-fixed-staging:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: c0cf8ac11349e2953f6b0ca98a6d53364147051f
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify active staging lockdown and exact SHA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ env.TARGET_SHA }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
        run: |
          set -euo pipefail
          SETTINGS="$RUNNER_TEMP/settings.json"; export SETTINGS
          trap 'rm -f "$SETTINGS"' EXIT
          HTTP="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pawspace-staging/settings")"
          [ "$HTTP" = "200" ] || exit 1
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';const p=JSON.parse(readFileSync(process.env.SETTINGS,'utf8'));const b=(p?.result?.bindings||[]).find(x=>x?.type==='plain_text'&&x?.name==='PAWSPACE_PRODUCTION_ENFORCE');if(String(b?.text??b?.value??'')!=='false')throw new Error('staging production enforcement is not false');console.log('PAWSPACE_PRODUCTION_ENFORCE=false verified on pawspace-staging.');
          NODE
          node tests/e2e/staging-certification.mjs --isolation-only
      - name: Verify Meta readiness and template sync
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||'').replace(/\/$/,'');const login=await fetch(`${base}/api/staging-login`,{method:'POST',headers:{'content-type':'application/json',origin:base},body:JSON.stringify({action:'login',code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||''),email:'founder@pawspace.in'})});const cookie=String(login.headers.get('set-cookie')||'').split(';')[0];if(!cookie)throw new Error('staging sign-in failed');const health=await fetch(`${base}/healthz`);if(health.status!==200)throw new Error(`healthz ${health.status}`);const invalid=await fetch(`${base}/api/whatsapp/meta-webhook`,{method:'POST',headers:{'content-type':'application/json','x-hub-signature-256':'sha256=invalid-cert-probe'},body:JSON.stringify({object:'whatsapp_business_account',entry:[]})});if(invalid.status!==401)throw new Error(`invalid-signature boundary ${invalid.status}`);const r=await fetch(`${base}/api/integration-readiness`,{headers:{cookie}});const p=await r.json().catch(()=>null);const modules=p?.uatSandbox?.modules||p?.data?.uatSandbox?.modules||[];const m=Array.isArray(modules)?modules.find(x=>x?.code==='meta_whatsapp'):null;if(!(r.ok&&m?.configuredForExternalTest===true))throw new Error('Meta readiness incomplete');const sync=await fetch(`${base}/api/whatsapp/meta-admin`,{method:'POST',headers:{'content-type':'application/json',origin:base,cookie},body:JSON.stringify({action:'sync_templates'}),signal:AbortSignal.timeout(30000)});const s=await sync.json().catch(()=>null);if(!(sync.ok&&s?.data?.status==='synced'&&Number(s?.data?.synced||0)>=1))throw new Error('template sync not green');console.log(`fixed staging certified; health=200; Meta ready=true; templatesSynced=${Number(s.data.synced)}`);
          NODE
