name: Voice UAT queue inspection

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type inspect-voice-uat'
        required: true
        default: ''
      expected_sha:
        description: 'Exact 40-character commit SHA to inspect'
        required: true
        default: ''

jobs:
  inspect:
    if: ${{ github.event.inputs.confirm == 'inspect-voice-uat' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact clean SHA
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          set -euo pipefail
          case "$EXPECTED_SHA" in *[!0-9a-f]* | "") exit 1;; esac
          [ "${#EXPECTED_SHA}" -eq 40 ]
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]
          [ -z "$(git status --porcelain)" ]
      - name: Inspect one-shot voice UAT queue without dialing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const runId = 'VOICE-UAT-20260911-CONTROLLED-RETRY-7';
          const sql = `
            SELECT
              q.id,
              q.scheduled_for,
              q.status,
              q.last_state,
              q.failure_class,
              q.prepared_at,
              q.started_at,
              q.finished_at,
              q.updated_at,
              CASE WHEN q.call_id IS NULL THEN 0 ELSE 1 END AS has_call_id,
              c.state AS call_state,
              c.provider AS call_provider,
              c.production_call AS production_call,
              c.created_at AS call_created_at,
              c.updated_at AS call_updated_at
            FROM voice_carrier_uat_queue q
            LEFT JOIN voice_call_orders c ON c.id=q.call_id
            WHERE q.id='${runId.replaceAll("'", "''")}'
            LIMIT 1
          `;
          const raw = execFileSync('npx', ['wrangler','d1','execute','pawspace-staging','--remote','--json','--command',sql], {
            encoding: 'utf8', env: process.env, maxBuffer: 8*1024*1024, stdio: ['ignore','pipe','pipe'],
          });
          const starts = [raw.indexOf('['), raw.indexOf('{')].filter(i => i >= 0);
          if (!starts.length) throw new Error('Staging D1 returned no JSON');
          const parsed = JSON.parse(raw.slice(Math.min(...starts)));
          const blocks = Array.isArray(parsed) ? parsed : [parsed];
          const rows = blocks.flatMap(block => Array.isArray(block?.results) ? block.results : []);
          const row = rows[0] || null;
          const safe = row ? {
            runId: row.id,
            scheduledFor: Number(row.scheduled_for || 0),
            status: String(row.status || ''),
            lastState: row.last_state == null ? null : String(row.last_state),
            failureClass: row.failure_class == null ? null : String(row.failure_class),
            hasCallId: Number(row.has_call_id || 0) === 1,
            callState: row.call_state == null ? null : String(row.call_state),
            callProvider: row.call_provider == null ? null : String(row.call_provider),
            productionCall: Number(row.production_call || 0) === 1,
            preparedAt: Number(row.prepared_at || 0),
            startedAt: row.started_at == null ? null : Number(row.started_at),
            finishedAt: row.finished_at == null ? null : Number(row.finished_at),
            updatedAt: Number(row.updated_at || 0),
            callCreatedAt: row.call_created_at == null ? null : Number(row.call_created_at),
            callUpdatedAt: row.call_updated_at == null ? null : Number(row.call_updated_at),
          } : { status: 'not_staged' };
          console.log('VOICE_UAT_QUEUE_INSPECTION='+JSON.stringify(safe));
          NODE
