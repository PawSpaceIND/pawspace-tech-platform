name: One-shot canonical booking fix on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: one-shot-canonical-pr
  cancel-in-progress: true

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: testfix/master-zero-gap-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/cat > \/tmp\/canonical-booking-guard.patch <<'PATCH'/,/^          PATCH$/p" .github/workflows/one-shot-canonical-booking-guard.yml \
            | sed '1d;$d;s/^          //' > /tmp/canonical-booking-guard.patch
          test -s /tmp/canonical-booking-guard.patch
          git apply --check /tmp/canonical-booking-guard.patch
          git apply /tmp/canonical-booking-guard.patch
          git diff --check
      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --experimental-strip-types --test \
            tests/canonical-bookings-gateway-authorization.test.mjs \
            tests/route-authorization-class.test.mjs \
            tests/partner-job-feed.test.mjs \
            tests/provider-workspace.test.mjs \
            tests/grooming-golden-journey.test.mjs \
            tests/ptja-identity-spine.test.mjs
      - name: Commit verified fix and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git show 9412d1eb3c676a897bd638885f887472cc61487f:.github/workflows/master-zero-gap-audit.yml > .github/workflows/master-zero-gap-audit.yml
          git rm .github/workflows/one-shot-canonical-booking-guard.yml .github/workflows/one-shot-canonical-pr.yml
          git add lib/api-gateway.ts app/api/canonical-bookings/route.ts tests/canonical-bookings-gateway-authorization.test.mjs tests/route-authorization-class.test.mjs tests/grooming-golden-journey.test.mjs .github/workflows/master-zero-gap-audit.yml
          git config user.name "PawSpace zero-gap fixer"
          git config user.email "actions@pawspace.in"
          git commit -m "fix: restrict platform-wide canonical booking access"
          git push origin HEAD:testfix/master-zero-gap-20260824
