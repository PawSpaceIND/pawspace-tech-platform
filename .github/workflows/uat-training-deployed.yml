name: UAT deployed Training capture and recovery
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Certified staging origin'
        required: true
        default: 'https://pawspace-staging.karthik-fce.workers.dev'
      suite:
        description: 'training-deployed (capture + recovery), master (full Dog Training E2E across customer, trainer, staff, finance, CRM, maps and AI), cleanup (founder-approved cancellation of stale UAT Training sessions on staging) or trainer-check (read-only: is a tester offered a trainer on /v2/training)'
        required: false
        default: 'training-deployed'
        type: choice
        options:
          - training-deployed
          - master
          - cleanup
          - trainer-check
      apply:
        description: 'cleanup suite only: dry-run lists what would change; apply cancels the listed stale sessions through the governed staff API'
        required: false
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
jobs:
  training-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # contents:write is used only by the master and trainer-check evidence steps, and only on non-main branches.
    permissions:
      contents: write
    concurrency:
      group: pawspace-staging-sweep
      cancel-in-progress: false
      queue: max
    env:
      NODE_ENV: test
      APP_ENV: staging
      FORBID_PRODUCTION: 'true'
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install
        run: npm run install:ci
      - name: Install Playwright Chromium
        if: github.event.inputs.suite != 'cleanup'
        run: npx playwright install --with-deps chromium
      - name: Run deployed Training acceptance
        if: github.event.inputs.suite == 'training-deployed'
        env:
          PW_BASE_URL: ${{ github.event.inputs.base_url }}
          E2E_REPORT: test-results/uat-training-report.md
        run: npx playwright test --config playwright.uat-training.config.ts
      - name: Run Dog Training master E2E
        if: github.event.inputs.suite == 'master'
        env:
          PW_BASE_URL: ${{ github.event.inputs.base_url }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          MASTER_OUT: test-results/training-master
        run: npx playwright test --config playwright.training-master.config.ts
      - name: Check that a tester is offered a Dog Training trainer (read-only)
        if: github.event.inputs.suite == 'trainer-check'
        env:
          PW_BASE_URL: ${{ github.event.inputs.base_url }}
          TRAINER_CHECK_OUT: test-results/training-trainer-check
        run: npx playwright test --config playwright.training-trainer-check.config.ts
      - name: Clean up stale UAT Training sessions (staging only)
        if: github.event.inputs.suite == 'cleanup'
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          DRY_RUN: ${{ github.event.inputs.apply == 'apply' && 'false' || 'true' }}
          CLEANUP_REPORT: test-results/uat-training-cleanup-report.md
        run: node scripts/uat-staging-training-cleanup.mjs
      - name: Print report
        if: always()
        run: |
          echo '===== UAT TRAINING DEPLOYED REPORT ====='
          cat test-results/uat-training-report.md 2>/dev/null || true
          cat test-results/training-master/report.md 2>/dev/null || true
          cat test-results/uat-training-cleanup-report.md 2>/dev/null || true
          cat test-results/training-trainer-check/report.md 2>/dev/null || true
      - name: Commit master evidence to this branch
        if: always() && github.event.inputs.suite == 'master' && github.ref_name != 'main'
        run: |
          set -e
          [ -f test-results/training-master/report.md ] || exit 0
          DEST="docs/qa-evidence/training-staging-${{ github.run_id }}"
          mkdir -p "$DEST"
          cp -r test-results/training-master/. "$DEST"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "test(qa): Dog Training master E2E evidence from staging (run ${{ github.run_id }})" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1
      - name: Commit trainer-check evidence to this branch
        if: always() && github.event.inputs.suite == 'trainer-check' && github.ref_name != 'main'
        run: |
          set -e
          [ -f test-results/training-trainer-check/report.md ] || exit 0
          DEST="docs/qa-evidence/training-trainer-check-${{ github.run_id }}"
          mkdir -p "$DEST"
          cp -r test-results/training-trainer-check/. "$DEST"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "test(qa): Dog Training trainer availability check on staging (run ${{ github.run_id }})" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-training-deployed-evidence
          path: |
            test-results/**
            playwright-report-uat-training/**
          if-no-files-found: warn
