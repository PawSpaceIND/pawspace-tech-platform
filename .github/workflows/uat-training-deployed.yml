name: UAT deployed Training capture and recovery
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Certified staging origin'
        required: true
        default: 'https://pawspace-staging.karthik-fce.workers.dev'
jobs:
  training-acceptance:
    runs-on: ubuntu-latest
    concurrency:
      group: pawspace-staging-sweep
      cancel-in-progress: false
      queue: max
    env:
      NODE_ENV: test
      APP_ENV: staging
      FORBID_PRODUCTION: 'true'
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install
        run: npm run install:ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deployed Training acceptance
        env:
          PW_BASE_URL: ${{ github.event.inputs.base_url }}
          E2E_REPORT: test-results/uat-training-report.md
        run: npx playwright test --config playwright.uat-training.config.ts
      - name: Print report
        if: always()
        run: |
          echo '===== UAT TRAINING DEPLOYED REPORT ====='
          cat test-results/uat-training-report.md 2>/dev/null || echo '(no report file produced)'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-training-deployed-evidence
          path: |
            test-results/**
            playwright-report-uat-training/**
          if-no-files-found: warn
