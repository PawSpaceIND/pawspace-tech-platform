name: Prove WhatsApp UAT provider roundtrip

on:
  push:
    branches:
      - fix/whatsapp-uat-staging-deploy-isolation
    paths:
      - .github/workflows/prove-whatsapp-uat-provider-roundtrip.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-meta-roundtrip:
    runs-on: ubuntu-latest
    concurrency: pawspace-staging-deploy
    env:
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select existing allowlisted consented UAT customer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SETTINGS="$RUNNER_TEMP/settings.json"; CANDIDATES="$RUNNER_TEMP/candidates.json"; export SETTINGS CANDIDATES
          trap 'rm -f "$SETTINGS" "$CANDIDATES"' EXIT
          HTTP="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pawspace-staging/settings")"
          [ "$HTTP" = "200" ] || { echo "Unable to read staging settings; response withheld." >&2; exit 1; }
          node --input-type=module <<'NODE'
          import{readFileSync,appendFileSync}from'node:fs';
          const settings=JSON.parse(readFileSync(process.env.SETTINGS,'utf8'));const bindings=Array.isArray(settings?.result?.bindings)?settings.result.bindings:[];const plain=Object.fromEntries(bindings.filter(b=>b?.type==='plain_text').map(b=>[String(b.name||''),String(b.text??b.value??'')]));
          if(String(plain.PAWSPACE_PRODUCTION_ENFORCE||'')!=='false')throw new Error('pawspace-staging production enforcement is not explicitly false');
          const raw=String(plain.META_WHATSAPP_UAT_ALLOWLIST||plain.PAWSPACE_COMMUNICATION_UAT_ALLOWLIST||'');const recipient=raw.split(',').map(v=>v.trim()).filter(Boolean)[0];if(!recipient)throw new Error('No staging UAT allowlisted recipient configured');
          console.log(`::add-mask::${recipient}`);appendFileSync(process.env.GITHUB_ENV,`UAT_RECIPIENT=${recipient}\n`);console.log('Staging lockdown verified and one UAT recipient selected; value withheld.');
          NODE
          npx --yes wrangler@4 d1 execute pawspace-staging --remote --command "SELECT c.id AS customer_id,c.primary_phone,c.secondary_phone,b.id AS booking_id,p.whatsapp_consent,p.opt_out FROM canonical_customers c JOIN customer_contact_preferences p ON p.customer_id=c.id JOIN canonical_bookings b ON b.customer_id=c.id WHERE p.whatsapp_consent=1 AND COALESCE(p.opt_out,0)<>1 ORDER BY b.id DESC LIMIT 500;" --json > "$CANDIDATES"
          node --input-type=module <<'NODE'
          import{readFileSync,appendFileSync}from'node:fs';const digits=v=>String(v??'').replace(/\D/g,'');const target=digits(process.env.UAT_RECIPIENT);const payload=JSON.parse(readFileSync(process.env.CANDIDATES,'utf8'));const rows=(Array.isArray(payload)?payload:[]).flatMap(b=>Array.isArray(b?.results)?b.results:[]);const match=rows.find(r=>[r.primary_phone,r.secondary_phone].some(v=>digits(v)===target));if(!match?.customer_id||!match?.booking_id)throw new Error('No existing allowlisted WhatsApp-consented staging customer with booking exists; refusing to fabricate certification data');appendFileSync(process.env.GITHUB_ENV,`UAT_CUSTOMER_ID=${String(match.customer_id)}\nUAT_BOOKING_ID=${String(match.booking_id)}\n`);console.log('Existing canonical customer + booking + WhatsApp consent match verified; identifiers withheld.');
          NODE

      - name: Enqueue and dispatch through normal UAT APIs
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import{appendFileSync}from'node:fs';
          const base=String(process.env.STAGING_URL||'').replace(/\/$/,'');
          const login=await fetch(`${base}/api/staging-login`,{method:'POST',headers:{'content-type':'application/json',origin:base},body:JSON.stringify({action:'login',code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||''),email:'founder@pawspace.in'}),redirect:'manual',signal:AbortSignal.timeout(20000)});const cookie=String(login.headers.get('set-cookie')||'').split(';')[0];if(!cookie)throw new Error('staging sign-in failed');
          const controls=await fetch(`${base}/api/whatsapp/meta-admin`,{headers:{cookie},signal:AbortSignal.timeout(20000)});const cb=await controls.json();const templates=Array.isArray(cb?.data?.templates)?cb.data.templates:[];const approved=templates.find(t=>String(t?.status||'')==='approved');if(!controls.ok||!approved?.template_key)throw new Error('No approved persisted staging Meta template available');
          const idempotencyKey=`uat-meta-proof-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const enqueue=await fetch(`${base}/api/communications`,{method:'POST',headers:{'content-type':'application/json',origin:base,cookie},body:JSON.stringify({action:'enqueue',customerId:String(process.env.UAT_CUSTOMER_ID||''),bookingId:String(process.env.UAT_BOOKING_ID||''),cityId:'blr',channel:'whatsapp',purpose:'transactional',idempotencyKey,templateKey:String(approved.template_key),payload:{language:String(approved.approved_language||'en')}}),signal:AbortSignal.timeout(20000)});const eb=await enqueue.json();const messageId=String(eb?.data?.messageId||eb?.data?.message?.id||'');if(!enqueue.ok||!messageId)throw new Error(`UAT communication enqueue failed HTTP ${enqueue.status}`);if(!['queued','retry_pending','scheduled'].includes(String(eb?.data?.status||eb?.data?.message?.status||'')))throw new Error(`UAT communication not dispatchable: ${String(eb?.data?.status||eb?.data?.message?.status||'unknown')}`);
          const dispatch=await fetch(`${base}/api/whatsapp/meta-admin`,{method:'POST',headers:{'content-type':'application/json',origin:base,cookie},body:JSON.stringify({action:'dispatch_uat',messageId,recipient:String(process.env.UAT_RECIPIENT||'')}),signal:AbortSignal.timeout(30000)});const db=await dispatch.json();const result=db?.data||{};if(!dispatch.ok||String(result.status||'')!=='provider_accepted'||result.externalDelivery!==true||result.productionDelivery!==false)throw new Error(`Meta UAT dispatch failed HTTP ${dispatch.status}; status=${String(result.status||'unknown')}`);appendFileSync(process.env.GITHUB_ENV,`UAT_MESSAGE_ID=${messageId}\n`);console.log('Meta accepted the allowlisted UAT outbound message; provider reference withheld; productionDelivery=false.');
          NODE

      - name: Prove genuine Meta status callback persisted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/callback.json"; export OUT
          trap 'rm -f "$OUT"' EXIT
          for attempt in $(seq 1 18); do
            npx --yes wrangler@4 d1 execute pawspace-staging --remote --command "SELECT event_type,COUNT(*) AS count FROM communication_message_delivery_events WHERE message_id='${UAT_MESSAGE_ID}' AND provider='meta_whatsapp' AND event_type IN ('sent','delivered','read','failed') GROUP BY event_type;" --json > "$OUT"
            if node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';const p=JSON.parse(readFileSync(process.env.OUT,'utf8'));const rows=(Array.isArray(p)?p:[]).flatMap(b=>Array.isArray(b?.results)?b.results:[]);const success=rows.filter(r=>['sent','delivered','read'].includes(String(r?.event_type||''))&&Number(r?.count||0)>0);const failed=rows.find(r=>String(r?.event_type||'')==='failed'&&Number(r?.count||0)>0);if(success.length){console.log(`Genuine Meta callback persisted; statusEvents=${success.map(r=>String(r.event_type)).join(',')}.`);process.exit(0);}if(failed){console.error('Meta provider callback persisted a failed delivery status.');process.exit(2);}process.exit(1);
          NODE
            then exit 0
            else code=$?; [ "$code" -eq 2 ] && exit 2
            fi
            sleep 5
          done
          echo "No genuine Meta sent/delivered/read callback was persisted within the bounded verification window." >&2
          exit 1
