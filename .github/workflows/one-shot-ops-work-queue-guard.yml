name: One-shot Operations work queue guard

on:
  push:
    branches:
      - testfix/master-zero-gap-20260824
    paths:
      - .github/workflows/one-shot-ops-work-queue-guard.yml

permissions:
  contents: write

concurrency:
  group: one-shot-ops-work-queue-guard
  cancel-in-progress: false

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: testfix/master-zero-gap-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact authorization corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("lib/api-gateway.ts"): (
                  'if(url.pathname==="/api/ops-work-queue")return method==="GET"?"bookings.view":"bookings.manage";',
                  'if(url.pathname==="/api/ops-work-queue")return "bookings.manage";',
              ),
              Path("app/api/ops-work-queue/route.ts"): (
                  'const actor=await resolveActor(request);requirePermission(actor,"bookings.view");',
                  'const actor=await resolveActor(request);requirePermission(actor,"bookings.manage");',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one old authorization boundary, found {count}")
              if new in text:
                  raise SystemExit(f"{path}: replacement already present unexpectedly")
              path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Install exact dependencies
        run: npm ci
      - name: Run focused and adjacent authorization regressions
        run: >-
          node --experimental-strip-types --test
          tests/ops-work-queue-authorization-boundary.test.mjs
          tests/route-authorization-class.test.mjs
      - name: Commit the correction and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-ops-work-queue-guard.yml
          git add lib/api-gateway.ts app/api/ops-work-queue/route.ts
          git config user.name "PawSpace zero-gap fixer"
          git config user.email "actions@pawspace.in"
          git commit -m "fix: restrict platform Operations work queue"
          git push origin HEAD:testfix/master-zero-gap-20260824
