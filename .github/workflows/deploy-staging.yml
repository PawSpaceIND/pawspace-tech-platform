name: Read-only Atlas hosting quota preflight
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed 40-character preflight commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  read-only-quota:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/preflight/atlas-cf-hosting-quota-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refuse unpinned execution
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Verify checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Read billing evidence once; unknown headroom fails closed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cf-hosting-quota-preflight.mjs
