name: Deploy staging

# One-click ISOLATED STAGING deploy for human UAT. Manual only (workflow_dispatch) — never auto-runs,
# never touches production. Requires two repo secrets (added once by ops, never pasted in chat):
#   CLOUDFLARE_API_TOKEN   — a token scoped to the staging account (Workers Scripts:Edit, D1:Edit)
#   CLOUDFLARE_ACCOUNT_ID  — the staging Cloudflare account id
# Prereqs (one-time, see docs/STAGING_DEPLOY.md): create the staging D1 and paste its id into
# wrangler.staging.jsonc; set sandbox secrets with `wrangler secret put … --config wrangler.staging.jsonc`.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "staging" to confirm this is the isolated staging deploy'
        required: true
        default: ''

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'staging' }}
    runs-on: ubuntu-latest
    concurrency: pawspace-staging-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm run install:ci
      - name: Build (vinext)
        run: npm run build
      - name: Deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.staging.jsonc
      - name: Where to test
        run: echo "Staging deployed. Open https://pawspace-staging.<your-workers-subdomain>.workers.dev and append the module paths from docs/LAUNCH_AUDIT_REPORT.md / the route map."
