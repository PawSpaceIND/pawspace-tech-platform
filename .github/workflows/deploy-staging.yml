name: Deploy staging

# One-click ISOLATED STAGING deploy for human UAT. Manual only (workflow_dispatch) — never auto-runs,
# never touches production. Deploys the vinext build output (dist/server) as worker "pawspace-staging"
# bound to a dedicated staging D1.
#
# Required repo config (added once by ops — never pasted in chat, never committed):
#   Secrets:   CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit)
#              CLOUDFLARE_ACCOUNT_ID
#              PAWSPACE_UAT_ACCESS_CODE                (>=32 chars) tester code for /staging-login
#              PAWSPACE_UAT_SIGNING_KEY                (>=32 chars) signs the UAT session cookie
#              PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT  (>=32 chars) signs OTP identity assertions
#   Variables: STAGING_D1_ID           (from `npx wrangler d1 create pawspace-staging`)
#              PRODUCTION_D1_ID        optional; when set, certification refuses to run if the deploy
#                                      is bound to it
#              PRODUCTION_WORKER_NAME  optional; same, for the worker name
#
# The deploy is CERTIFIED before it is handed to testers. tests/e2e/staging-certification.mjs proves,
# against the deployed origin and the deployed configuration: isolation (the staging worker and its own
# D1, never production), the exact deployed sha, sandbox mode with no live or approval flag, that no UAT
# credential is serialized into the config, that the advertised staff identities exist AND can really
# sign in, that the smoke routes answer for a session and refuse without one, and that a rollback
# reference was captured before the deploy. A required check that could not be run fails. The job fails
# if any check fails, and the sanitized evidence artifact is uploaded either way.
#
# Generate each credential fresh — `openssl rand -hex 32` — and never reuse a value that has appeared
# in this repository, a chat, or a build log. The deploy refuses to run without all three, refuses a
# value shorter than its minimum, and refuses the specific values that were once committed here.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "staging" to confirm this is the isolated staging deploy'
        required: true
        default: ''
      expected_sha:
        description: 'Exact 40-character commit sha to deploy and certify'
        required: true
        default: ''

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'staging' }}
    runs-on: ubuntu-latest
    concurrency: pawspace-staging-deploy
    steps:
      # Checked out AT the requested sha. Before this the workflow deployed whatever the default
      # branch happened to be, so "the staging deploy of <sha>" was an assumption nobody could check
      # afterwards - and a merge landing during the run silently changed what testers were testing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha }}
      - name: Verify the checkout is exactly the requested sha and is clean
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          set -euo pipefail
          case "$EXPECTED_SHA" in
            *[!0-9a-f]* | "" ) echo "expected_sha must be an exact 40-character commit sha." >&2; exit 1 ;;
          esac
          if [ "${#EXPECTED_SHA}" -ne 40 ]; then
            echo "expected_sha must be an exact 40-character commit sha (a branch name or short sha does not identify a build)." >&2
            exit 1
          fi
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$EXPECTED_SHA" ]; then
            echo "checkout is at $ACTUAL, not the requested $EXPECTED_SHA - refusing to deploy." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "working tree is dirty - refusing to deploy a modified artifact." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm run install:ci
      - name: Build (vinext)
        run: npm run build
      # The three UAT credentials come from repository SECRETS. They previously came from committed
      # fallbacks in stage-config.mjs, because this step passed only STAGING_D1_ID — so every deploy
      # shipped credentials that were readable in a public repository. The script now fails closed if
      # any is missing, too short, or equal to one of the values that was committed.
      - name: Configure staging (name + D1 + sandbox)
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs
      # Captured BEFORE the deploy, so a rollback target exists even when this deploy is the bad one.
      # Certification requires it: a deploy with no recorded predecessor has no way back, and the moment
      # that matters is after it has already gone wrong.
      - name: Record the currently deployed staging version (rollback reference)
        id: rollback
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx wrangler deployments list --name pawspace-staging > rollback-reference.txt 2>&1; then
            REFERENCE="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' rollback-reference.txt | tail -n 1 || true)"
          else
            REFERENCE=""
          fi
          if [ -z "$REFERENCE" ]; then REFERENCE="first-staging-deploy"; fi
          # Only the marker is exported. The listing itself can carry account detail and is not uploaded.
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          echo "Rollback target recorded."

      - name: Deploy to staging
        # Deploy from the repo ROOT: the @cloudflare/vite-plugin build writes a redirect at
        # .wrangler/deploy/config.json pointing wrangler to dist/server/wrangler.json. Running from
        # dist/server instead makes wrangler find BOTH that redirect and the local wrangler.json and
        # refuse ("Found both a user configuration file ... and a deploy configuration file").
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --message is what makes the DEPLOYED version attributable to a sha: `wrangler versions list`
        # exposes it, and certification requires an exact match. Without it, "which build is live?" has
        # no answer that does not rely on trusting this log.
        run: npx wrangler deploy --message "staging ${{ github.event.inputs.expected_sha }}"
      # Read-only and deliberately before secret installation or employee seeding. It resolves the
      # one active version, requires it to serve 100% of traffic, and checks that version's actual D1
      # binding and sandbox vars. No command below may write staging data until this has passed.
      - name: Certify deployed isolation before any D1 write
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
        run: node tests/e2e/staging-certification.mjs --isolation-only
      - name: Install UAT credentials as Cloudflare Worker secrets
        # The three UAT credentials are NEVER serialized into wrangler.json (that would put plaintext
        # credentials into the generated deploy artifact and the dashboard `vars`). They are installed
        # into the Worker runtime as encrypted SECRETS here, piped over stdin so the value is never a
        # command argument and never echoed into the build log.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: |
          set -euo pipefail
          for name in PAWSPACE_UAT_ACCESS_CODE PAWSPACE_UAT_SIGNING_KEY PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT; do
            printf '%s' "${!name}" | npx wrangler secret put "$name" --name pawspace-staging
          done
      # The staff directory is loaded HERE rather than being left to a separate manual workflow, because
      # certification requires the advertised staff identities to be able to sign in and UAT sign-in
      # refuses any email that is not an active app_users row. Idempotent: every seed is INSERT OR IGNORE.
      - name: Load the staff directory into the staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
        run: npx wrangler d1 execute "$STAGING_D1_ID" --remote --file=scripts/employee-seed.sql

      - name: Resolve the deployed staging URL
        id: url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # A guessed https://<worker>.workers.dev omits the account subdomain and does not resolve, so
          # the URL is taken from what wrangler itself reports for the deployed worker.
          npx wrangler deployments status --name pawspace-staging > deployment.txt 2>&1 || true
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deployment.txt | tail -n 1 || true)"
          if [ -z "$URL" ]; then
            echo "Could not resolve the deployed staging URL from wrangler output." >&2
            exit 1
          fi
          echo "staging_url=$URL" >> "$GITHUB_OUTPUT"

      # Certification. Proves the eight facts a human UAT round depends on against the DEPLOYED origin
      # and the DEPLOYED configuration: isolation, the exact deployed sha, sandbox mode with no live
      # flag, no credential in the serialized config, the seeded staff identities, that each one can
      # really sign in, that the smoke routes answer for a session and refuse without one, and that a
      # rollback reference exists. A required check that could not be run fails.
      - name: Certify the staging deploy
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          STAGING_URL: ${{ steps.url.outputs.staging_url }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          ROLLBACK_REFERENCE: ${{ steps.rollback.outputs.reference }}
          EVIDENCE_PATH: staging-certification.json
        run: node tests/e2e/staging-certification.mjs

      # Uploaded whether or not certification passed: a failed run's report is the thing worth reading.
      # The artifact is sanitized inside the gate and refused outright if a known sensitive value
      # survives into it.
      - name: Upload the sanitized certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-certification-${{ github.event.inputs.expected_sha }}
          path: staging-certification.json
          if-no-files-found: warn

      - name: Where to test
        env:
          STAGING_URL: ${{ steps.url.outputs.staging_url }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          echo "Certified staging deploy of $EXPECTED_SHA at $STAGING_URL"
          echo "Append the module paths from docs/STAGING_DEPLOY.md. Sign in at /staging-login with the seeded staff identities in docs/UAT-TESTER-GUIDE.md."
