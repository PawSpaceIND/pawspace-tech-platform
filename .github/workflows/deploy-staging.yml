name: Deploy staging

# SAFETY GUARD: this feature branch previously deployed to the shared pawspace-staging Worker and
# overwrote the WATI/CX UAT build. Shared staging is owned by the canonical staging lane; this branch
# must use a dedicated voice-UAT Worker before deployment is re-enabled here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse shared-staging overwrite
        run: |
          echo "Blocked: feat/uat-ai-voice-self-test-20260905 may not deploy to the shared pawspace-staging Worker."
          echo "Create/use a dedicated voice-UAT Worker before re-enabling this workflow on this branch."
          exit 1
