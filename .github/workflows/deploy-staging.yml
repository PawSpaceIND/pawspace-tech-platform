name: Deploy staging

# One-click ISOLATED STAGING deploy for human UAT. Manual only (workflow_dispatch) — never auto-runs,
# never touches production. Deploys the vinext build output (dist/server) as worker "pawspace-staging"
# bound to a dedicated staging D1.
#
# Required repo config (added once by ops — never pasted in chat, never committed):
#   Secrets:   CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit)
#              CLOUDFLARE_ACCOUNT_ID
#              PAWSPACE_UAT_ACCESS_CODE                (>=32 chars) tester code for /staging-login
#              PAWSPACE_UAT_SIGNING_KEY                (>=32 chars) signs the UAT session cookie
#              PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT  (>=32 chars) signs OTP identity assertions
#   Variable:  STAGING_D1_ID  (from `npx wrangler d1 create pawspace-staging`)
#
# Generate each credential fresh — `openssl rand -hex 32` — and never reuse a value that has appeared
# in this repository, a chat, or a build log. The deploy refuses to run without all three, refuses a
# value shorter than its minimum, and refuses the specific values that were once committed here.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "staging" to confirm this is the isolated staging deploy'
        required: true
        default: ''

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'staging' }}
    runs-on: ubuntu-latest
    concurrency: pawspace-staging-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm run install:ci
      - name: Build (vinext)
        run: npm run build
      # The three UAT credentials come from repository SECRETS. They previously came from committed
      # fallbacks in stage-config.mjs, because this step passed only STAGING_D1_ID — so every deploy
      # shipped credentials that were readable in a public repository. The script now fails closed if
      # any is missing, too short, or equal to one of the values that was committed.
      - name: Configure staging (name + D1 + sandbox)
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs
      - name: Deploy to staging
        # Deploy from the repo ROOT: the @cloudflare/vite-plugin build writes a redirect at
        # .wrangler/deploy/config.json pointing wrangler to dist/server/wrangler.json. Running from
        # dist/server instead makes wrangler find BOTH that redirect and the local wrangler.json and
        # refuse ("Found both a user configuration file ... and a deploy configuration file").
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Install UAT credentials as Cloudflare Worker secrets
        # The three UAT credentials are NEVER serialized into wrangler.json (that would put plaintext
        # credentials into the generated deploy artifact and the dashboard `vars`). They are installed
        # into the Worker runtime as encrypted SECRETS here, piped over stdin so the value is never a
        # command argument and never echoed into the build log.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: |
          set -euo pipefail
          for name in PAWSPACE_UAT_ACCESS_CODE PAWSPACE_UAT_SIGNING_KEY PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT; do
            printf '%s' "${!name}" | npx wrangler secret put "$name" --name pawspace-staging
          done
      - name: Where to test
        run: echo "Staging deployed as pawspace-staging. The deploy log above prints the workers.dev URL — open it and append the module paths from docs/STAGING_DEPLOY.md."

  # Does a real browser, signed in as a real person, get a working screen? The unit suite runs as a
  # development-preview superuser against injected rows, so it cannot answer that - every failure
  # found by hand during UAT lived in the seam it does not cross. This walks every route in Chromium
  # and fails the run on a blank screen, a script error, a raw JSON parse error reaching the reader,
  # type below 12px, a horizontal overflow or an unexpected permission wall.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Persona smoke against deployed staging
        env:
          PAWSPACE_E2E_BASE: https://pawspace-staging.karthik-fce.workers.dev
          # Read from the repository secret; never written to a file, a log line or an assertion.
          PAWSPACE_E2E_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: node tests/e2e/persona-smoke.mjs --json smoke-report.json
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-smoke-report
          path: smoke-report.json
