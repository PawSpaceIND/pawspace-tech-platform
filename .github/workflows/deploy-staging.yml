name: Deploy staging

# One-click ISOLATED STAGING deploy for human UAT. Manual only (workflow_dispatch) — never auto-runs,
# never touches production. Deploys the vinext build output (dist/server) as worker "pawspace-staging"
# bound to a dedicated staging D1.
#
# Required repo config (added once by ops — never pasted in chat):
#   Secrets:   CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit), CLOUDFLARE_ACCOUNT_ID
#   Variable:  STAGING_D1_ID  (from `npx wrangler d1 create pawspace-staging`)
# After the first deploy, set the app secret once:
#   npx wrangler secret put PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT --name pawspace-staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "staging" to confirm this is the isolated staging deploy'
        required: true
        default: ''

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'staging' }}
    runs-on: ubuntu-latest
    concurrency: pawspace-staging-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm run install:ci
      - name: Build (vinext)
        run: npm run build
      - name: Configure staging (name + D1 + sandbox)
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
        run: node scripts/stage-config.mjs
      - name: Deploy to staging
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Where to test
        run: echo "Staging deployed as pawspace-staging. The deploy log above prints the workers.dev URL — open it and append the module paths from docs/STAGING_DEPLOY.md."
