name: Connect Training programme ledger

on:
  push:
    branches: [grooming-integration-closure]
    paths:
      - .github/workflows/connect-training-programme.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Connect Training customer flow and gateway
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gateway=Path('lib/api-gateway.ts')
          text=gateway.read_text()
          marker='  if(url.pathname==="/api/canonical-bookings")return method==="GET"?"bookings.view":"scheduling.book";'
          line='  if(url.pathname==="/api/training-programmes")return "scheduling.book";'
          if line not in text:
              assert marker in text
              text=text.replace(marker,marker+'\n'+line,1)
          gateway.write_text(text)

          flow=Path('app/mobile-app/training-flow.tsx')
          text=flow.read_text()
          import_marker='import { createCanonicalLifecycle } from "../../lib/canonical-lifecycle-client";'
          import_line='import { materializeTrainingProgramme } from "../../lib/training-programme-client";'
          if import_line not in text:
              assert import_marker in text
              text=text.replace(import_marker,import_marker+'\n'+import_line,1)
          call='      await materializeTrainingProgramme({bookingId:canonical.bookingId,meetBookingId:meetBookingId||undefined});\n'
          marker='      const booking = createTestTransaction({'
          if call.strip() not in text:
              assert marker in text
              text=text.replace(marker,call+marker,1)
          flow.write_text(text)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit verified Training wiring
        run: |
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add lib/api-gateway.ts app/mobile-app/training-flow.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Connect Training bookings to canonical programme ledger [skip ci]"
          git pull --rebase origin grooming-integration-closure
          git push origin grooming-integration-closure
