name: Final-main audit typecheck diagnostic

on:
  push:
    branches:
      - testfix/final-main-independent-audit-20260825

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
        id: typecheck
      - uses: actions/upload-artifact@v4
        with:
          name: final-main-audit-typecheck-log
          path: typecheck.log
          if-no-files-found: error
      - name: Preserve diagnostic failure signal
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
