name: Service Discovery Certification

on:
  pull_request:
    paths:
      - 'app/api/uat-scheduling/**'
      - 'app/api/grooming-service-location/**'
      - 'app/training/**'
      - 'app/mobile-app/address-picker.tsx'
      - 'backend/src/scheduling.ts'
      - 'lib/address-autocomplete.ts'
      - 'lib/service-discovery-address.ts'
      - 'lib/service-zones.ts'
      - 'lib/uat-scheduling-client.ts'
      - 'tests/service-discovery-capacity.test.mjs'
      - 'package.json'
      - '.github/workflows/service-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-discovery:
    name: Service discovery / capacity governance
    runs-on: ubuntu-latest
    env:
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
      NODE_ENV: test
      APP_ENV: staging
      FORBID_PRODUCTION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Verify service discovery under sandbox isolation
        id: verify
        shell: bash
        run: |
          set +e
          PAWSPACE_PAYMENT_ENV="sandbox" npm run test:service-discovery > service-discovery.log 2>&1
          status=$?
          cat service-discovery.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Typecheck discovery closure
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > service-discovery-typecheck.log 2>&1
          status=$?
          cat service-discovery-typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload service discovery diagnostics
        if: steps.verify.outputs.status != '0' || steps.typecheck.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: service-discovery-failure-log
          path: |
            service-discovery.log
            service-discovery-typecheck.log
          retention-days: 3
      - name: Fail certification on verification error
        if: steps.verify.outputs.status != '0' || steps.typecheck.outputs.status != '0'
        run: exit 1
