name: Boarding Gate 2 restore verifier

on:
  push:
    branches:
      - grooming-integration-closure
    paths:
      - .github/workflows/boarding-gate2-diagnostic.yml

permissions:
  contents: write

jobs:
  restore-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore original rendered tests and patch only Boarding Host assertions
        shell: bash
        run: |
          git show d886083dbc4e86009eca6da7282475ca90f78031:tests/rendered-html.test.mjs > tests/rendered-html.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/rendered-html.test.mjs')
          text=path.read_text()
          replacements={
            '  assert.match(host, /LIVE IN CUSTOMER MARKETPLACE/);':'  assert.match(host, /GOVERNED BOARDING HOST PROFILE/);\n  assert.match(host, /Canonical Care Card/);',
            '  assert.match(host, /15 KM MARKETPLACE/);':'  assert.match(host, /SERVER-OWNED ASSIGNMENT OFFERS/);',
            '  assert.match(host, /Approve booking/);':'  assert.match(host, /Accept & lock capacity/);',
          }
          for old,new in replacements.items():
            if text.count(old)!=1:
              raise SystemExit(f'expected exactly one stale assertion: {old}')
            text=text.replace(old,new,1)
          if '.vinext/worker/index.js' in text or 'createRequire' in text:
            raise SystemExit('accidental diagnostic harness still present')
          if '../dist/server/index.js' not in text:
            raise SystemExit('original rendered test harness was not restored')
          path.write_text(text)
          PY
      - run: npm ci
      - name: Run web tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Validate artifact
        run: npm run validate:artifact
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Commit restored Boarding regressions
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/rendered-html.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Restore Boarding Gate 2 rendered test harness [skip ci]"
          git push origin HEAD:grooming-integration-closure
