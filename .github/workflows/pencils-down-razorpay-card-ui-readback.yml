name: Inspect Razorpay Test card UI
on:
  push:
    branches: [ops/pencils-down-staging-ab40dc00]
    paths: [.github/workflows/pencils-down-razorpay-card-ui-readback.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pawspace-release-preview
    env:
      ORIGIN: https://pawspace-beta-golden-wallet-43ba4002.karthik-fce.workers.dev
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
      FORBID_PRODUCTION: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 43ba4002bacbd129b359bc6c8ec3fd4f260272bf
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm run install:ci
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Capture Cards form only
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          cat > card-ui.mjs <<'NODE'
          import fs from 'node:fs';import playwright from './node_modules/playwright/index.js';const {chromium}=playwright;
          const origin=process.env.ORIGIN,bookingId='PS-UAT-MTV9TAXL-D586',phone='9000000939';const out='card-ui-evidence';fs.mkdirSync(out,{recursive:true});const report={testOnly:true,submittedPayment:false};
          const browser=await chromium.launch({headless:true}),context=await browser.newContext({viewport:{width:390,height:844}}),page=await context.newPage();
          const save=()=>fs.writeFileSync(`${out}/report.json`,JSON.stringify(report,null,2)+'\n');
          async function frame(){for(let n=0;n<120;n++){for(const f of page.frames()){try{if(await f.getByText(/PawSpace Test Checkout|Payment Options/i).first().isVisible({timeout:50}))return f}catch{}}await page.waitForTimeout(100)}throw new Error('checkout frame missing')}
          try{let r=await context.request.post(`${origin}/api/staging-login`,{data:{code:process.env.PAWSPACE_UAT_ACCESS_CODE,email:'founder@pawspace.in'}});if(!r.ok())throw new Error('UAT gate');await page.goto(`${origin}/mobile-app`,{waitUntil:'domcontentloaded'});const browse=page.getByRole('button',{name:'Browse without location',exact:true});if(await browse.isVisible().catch(()=>false))await browse.click();await page.locator('nav').getByRole('button',{name:/account/i}).last().click();await page.getByPlaceholder('10-digit phone number').fill(phone);await page.getByRole('button',{name:'Send OTP'}).click();const sandbox=page.getByText(/Sandbox code \(no real SMS yet\):/i);await sandbox.waitFor();const code=(await sandbox.textContent()).match(/\b(\d{6})\b/)[1];await page.getByPlaceholder('6-digit code').fill(code);await page.getByRole('button',{name:'Verify & continue'}).click();await page.getByPlaceholder('6-digit code').waitFor({state:'hidden'});await page.getByText('Payments & invoice summaries',{exact:true}).click();const rec=page.locator('article').filter({hasText:bookingId});await rec.waitFor();const order=page.waitForResponse(x=>x.url().endsWith('/api/payment-order')&&x.request().method()==='POST');await rec.getByRole('button',{name:'Pay securely (Test)'}).click();await order;let f=await frame();let mobile=null;for(let i=0;i<await f.locator('input').count();i++){const x=f.locator('input').nth(i),ph=String(await x.getAttribute('placeholder')||'');if(await x.isVisible().catch(()=>false)&&/mobile number|phone|contact/i.test(ph)){mobile=x;break}}if(mobile){await mobile.fill(phone);await f.getByRole('button',{name:/^Continue$/i}).last().click();await page.waitForTimeout(1200);f=await frame()}const cards=f.getByText(/^Cards$/i).first();if(!(await cards.isVisible().catch(()=>false)))throw new Error('Cards option missing');await cards.click();await page.waitForTimeout(1000);f=await frame();report.text=(await f.locator('body').innerText()).slice(0,8000);report.inputs=[];for(let i=0;i<await f.locator('input').count();i++){const x=f.locator('input').nth(i);if(await x.isVisible().catch(()=>false))report.inputs.push({placeholder:await x.getAttribute('placeholder'),ariaLabel:await x.getAttribute('aria-label'),type:await x.getAttribute('type')})}report.buttons=await f.getByRole('button').allTextContents();save();await page.screenshot({path:`${out}/card-form.png`,fullPage:true});}catch(e){report.failure=String(e?.message||e);save();process.exitCode=1}finally{await browser.close()}
          NODE
          node card-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razorpay-test-card-ui
          path: card-ui-evidence/
          retention-days: 7
