          Path('e2e/mission-02.spec.ts').write_text('''import { expect, test } from '@playwright/test';

async function login(page:any){page.setDefaultTimeout(15000);await page.goto('/');const login=page.getByRole('button',{name:/login/i}).or(page.getByRole('link',{name:/login/i}));await login.first().click();const dialog=page.getByRole('dialog',{name:/customer login/i});await dialog.getByLabel('Phone number').fill('9876543210');await dialog.getByRole('button',{name:/send otp/i}).click();const otp=dialog.getByLabel('OTP code');await expect(otp).toBeVisible();const text=await dialog.innerText(),code=(text.match(/\\b(\\d{6})\\b/)||[])[1];expect(code).toMatch(/^\\d{6}$/);await otp.fill(code);await dialog.getByRole('button',{name:/verify & continue/i}).click();await expect(page.getByRole('heading',{name:/who needs grooming/i})).toBeVisible();}

test('Mission 02: canonical grooming booking and real Razorpay sandbox capture',async({page})=>{await login(page);await page.getByRole('button',{name:'Dog',exact:true}).click();const petChoices=page.locator('button[aria-pressed]');if(await petChoices.count()===0){await page.getByRole('button',{name:/add or edit pet details/i}).click();await page.getByRole('button',{name:/add pet/i}).click();const form=page.getByText('Add pet',{exact:true}).locator('..').locator('..');await page.getByPlaceholder('Pet name').fill('Mission Dog');const selects=form.locator('select');await selects.nth(0).selectOption('dog');await selects.nth(2).selectOption({index:1});await selects.nth(3).selectOption({index:1});await selects.nth(5).selectOption({index:1});await selects.nth(6).selectOption({index:1});await selects.nth(7).selectOption('no');await form.getByRole('button',{name:'Add pet',exact:true}).click();await expect(page.getByRole('button',{name:/Mission Dog/})).toBeVisible();}const unselected=page.locator('button[aria-pressed="false"]:not([aria-disabled="true"])');if(await unselected.count())await unselected.first().click();await page.getByRole('button',{name:/choose a package/i}).click();const bath=page.getByRole('button',{name:/Bath & Basic/}).first();await bath.click();await expect(bath).toContainText(/₹\\s?1,899|1,899/);await page.getByRole('button',{name:/choose address and requested time/i}).click();await page.getByLabel('Complete doorstep address').fill('21 PawSpace Test Street, Koramangala');await page.getByPlaceholder('e.g., 560034').fill('560034');await page.getByRole('button',{name:'Check',exact:true}).click();await expect(page.getByText(/Available/).first()).toBeVisible();await page.getByRole('button',{name:/11:00 AM–1:00 PM/}).click();await page.getByRole('button',{name:/review booking/i}).click();await page.getByRole('button',{name:/Pay online/}).click();await page.getByRole('button',{name:/confirm booking/i}).click();
const checkout=page.frameLocator('iframe').first();await checkout.getByText(/Card/).first().click().catch(()=>{});const card=checkout.locator('input[name="card[number]"],input[placeholder*="card" i]').first();await card.fill('4111111111111111');await checkout.locator('input[name="card[expiry]"],input[placeholder*="MM"]').first().fill('1230');await checkout.locator('input[name="card[cvv]"],input[placeholder*="CVV" i]').first().fill('123');await checkout.getByRole('button',{name:/pay/i}).last().click();const otp=page.locator('input').filter({has:page.locator('')});await page.waitForTimeout(1000);const otpInput=page.locator('input[placeholder*="OTP" i],input[name*="otp" i]').first();if(await otpInput.isVisible().catch(()=>false)){await otpInput.fill('1234');await page.getByRole('button',{name:/submit|verify|success/i}).last().click();}else{const success=page.getByRole('button',{name:/success/i});if(await success.isVisible().catch(()=>false))await success.click();}
await expect(page.getByText(/BOOKING CONFIRMED/)).toBeVisible({timeout:30000});await page.getByRole('button',{name:'Payment',exact:true}).click();await expect(page.getByText('PAYMENT STATUS · CAPTURED',{exact:true})).toBeVisible();await expect(page.getByText(/Captured by Razorpay Test Mode and verified server-side/)).toBeVisible();const verifiedBadges=page.getByText('✓ Verified',{exact:true});if(await verifiedBadges.count())await expect(verifiedBadges.first()).toBeVisible();});
''')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: NODE_ENV=test node --experimental-strip-types --test tests/mission-02-payment-boundary.test.mjs
      - name: Require real Razorpay test credentials
        run: |
          test -n "$RAZORPAY_KEY_ID_SANDBOX" || { echo 'RAZORPAY_KEY_ID_SANDBOX is not configured'; exit 1; }
          test -n "$RAZORPAY_KEY_SECRET_SANDBOX" || { echo 'RAZORPAY_KEY_SECRET_SANDBOX is not configured'; exit 1; }
          case "$RAZORPAY_KEY_ID_SANDBOX" in rzp_test_*) ;; *) echo 'Sandbox key must start rzp_test_'; exit 1;; esac
      - name: Run qa.sh (Mission 01 + Mission 02)
        run: |
          rm -rf "$HOME/pawspace-tech-platform"
          ln -s "$GITHUB_WORKSPACE" "$HOME/pawspace-tech-platform"
          bash qa.sh feat/mission-02-booking
      - name: Commit validated Mission 02 and remove surgeon
        run: |
          git rm .github/workflows/mission02-surgeon.yml
          git add app/api/payment-order/route.ts app/mobile-app/grooming-flow.tsx lib/razorpay-client.ts lib/razorpay-checkout-client.ts lib/payment-order-intent.ts lib/grooming-payment-reconciliation.ts tests/mission-02-payment-boundary.test.mjs e2e/mission-02.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(mission-02): wire canonical Razorpay sandbox checkout'
          git push origin HEAD:feat/mission-02-booking
