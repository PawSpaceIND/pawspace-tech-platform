name: Mission 02 surgeon
on:
  push:
    branches: [feat/mission-02-booking]
permissions:
  contents: write
jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAWSPACE_PAYMENT_ENV: sandbox
      RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
      RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mission-02-booking
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Apply Mission 02 bounded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing expected source in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1))

          # Sandbox-first and live only behind an explicit gate. Invalid declarations fail closed.
          replace('lib/razorpay-client.ts',
          'export function paymentEnvironment(env: RazorEnv): PaymentEnvironment {\n  return String(env?.PAWSPACE_PAYMENT_ENV || "sandbox").toLowerCase() === "sandbox" ? "sandbox" : "live";\n}',
          '''export function paymentEnvironment(env: RazorEnv): PaymentEnvironment {
  const declared = String(env?.PAWSPACE_PAYMENT_ENV || "sandbox").trim().toLowerCase();
  if (!declared || declared === "sandbox") return "sandbox";
  if (declared === "live" && String(env?.PAWSPACE_ENABLE_LIVE_PAYMENTS || "").trim().toLowerCase() === "true") return "live";
  throw new Error("Live Razorpay is disabled unless PAWSPACE_PAYMENT_ENV=live and PAWSPACE_ENABLE_LIVE_PAYMENTS=true");
}''')
          replace('lib/razorpay-client.ts',
          '  return { environment, keyId, keySecret };\n}',
          '''  const expectedPrefix = environment === "sandbox" ? "rzp_test_" : "rzp_live_";
  if ((keyId && !keyId.startsWith(expectedPrefix)) || (keySecret && !keyId)) return { environment, keyId: "", keySecret: "" };
  return { environment, keyId, keySecret };
}''')
          p=Path('lib/razorpay-client.ts'); s=p.read_text()
          marker='''/**\n * Open a collectable post-service checkout.'''
          insert='''export type CheckoutVerificationResult =
  | { connected: true; environment: PaymentEnvironment; payment: Record<string, unknown> }
  | { connected: false; environment: PaymentEnvironment; reason: string };

function hex(bytes: ArrayBuffer) { return Array.from(new Uint8Array(bytes)).map(byte => byte.toString(16).padStart(2, "0")).join(""); }
function constantTimeEqual(a: string, b: string) { if (a.length !== b.length) return false; let diff = 0; for (let i = 0; i < a.length; i += 1) diff |= a.charCodeAt(i) ^ b.charCodeAt(i); return diff === 0; }

/** Verify Standard Checkout and re-read the payment from Razorpay before any local capture is trusted. */
export async function verifyCheckoutPayment(env: RazorEnv, input: { orderId: string; paymentId: string; signature: string; amountSubunits: number; currency: string }): Promise<CheckoutVerificationResult> {
  let resolved: ReturnType<typeof credentials>;
  try { resolved = credentials(env); } catch (error) { return { connected: false, environment: "sandbox", reason: error instanceof Error ? error.message : "Payment environment is unavailable" }; }
  const { environment, keyId, keySecret } = resolved;
  if (!keyId || !keySecret) return { connected: false, environment, reason: `Razorpay ${environment} API credentials are not configured` };
  if (!input.orderId.startsWith("order_") || !input.paymentId.startsWith("pay_") || !/^[a-f0-9]{64}$/i.test(input.signature)) return { connected: false, environment, reason: "Razorpay checkout proof is malformed" };
  const signingKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(keySecret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const expected = hex(await crypto.subtle.sign("HMAC", signingKey, new TextEncoder().encode(`${input.orderId}|${input.paymentId}`)));
  if (!constantTimeEqual(expected.toLowerCase(), input.signature.toLowerCase())) return { connected: false, environment, reason: "Razorpay checkout signature verification failed" };
  try {
    const { response, body } = await providerRequest(env, environment, `/v1/payments/${encodeURIComponent(input.paymentId)}`, { method: "GET", headers: { authorization: `Basic ${btoa(`${keyId}:${keySecret}`)}` } });
    if (!response.ok) return { connected: false, environment, reason: `Razorpay payment verification failed (${response.status})` };
    if (String(body.id || "") !== input.paymentId || String(body.order_id || "") !== input.orderId) return { connected: false, environment, reason: "Razorpay payment does not belong to this order" };
    if (String(body.status || "") !== "captured") return { connected: false, environment, reason: `Razorpay payment is ${String(body.status || "not captured")}` };
    if (Number(body.amount || 0) !== input.amountSubunits || String(body.currency || "") !== input.currency) return { connected: false, environment, reason: "Razorpay captured amount or currency does not match the order" };
    return { connected: true, environment, payment: body };
  } catch (error) { return { connected: false, environment, reason: `Razorpay verification request failed: ${error instanceof Error ? error.message : String(error)}` }; }
}

'''
          if marker not in s: raise SystemExit('razorpay insertion marker missing')
          p.write_text(s.replace(marker,insert+marker,1))

          # Generalize the existing order linker; keep the sandbox wrapper for existing callers.
          p=Path('lib/grooming-payment-reconciliation.ts'); s=p.read_text()
          pattern=r'export async function linkSandboxGatewayOrder\(db:Db,input:\{bookingId:string;gatewayOrderId:string;actorId:string\}\)\{.*?return\{bookingId:input\.bookingId,paymentId:String\(payment\.id\),gatewayOrderId:input\.gatewayOrderId\};\}'
          replacement='''export async function linkGatewayOrder(db:Db,input:{bookingId:string;gatewayOrderId:string;environment:"sandbox"|"live";actorId:string;expectedAmount:number}){await ensurePaymentReconciliationTables(db);const payment=await db.prepare("SELECT id,amount,currency FROM booking_payments WHERE booking_id=?").bind(input.bookingId).first<Row>();if(!payment)throw new Error("Canonical payment record not found");const now=Date.now(),expectedAmount=Number(input.expectedAmount);if(!(expectedAmount>0))throw new Error("A positive expected gateway amount is required");await db.prepare("INSERT INTO payment_gateway_links (id,booking_id,payment_id,provider,environment,gateway_order_id,status,created_at,updated_at) VALUES (?,?,?,?,?,?,'active',?,?) ON CONFLICT(booking_id) DO UPDATE SET gateway_order_id=excluded.gateway_order_id,provider=excluded.provider,environment=excluded.environment,status='active',updated_at=excluded.updated_at").bind(`PAYLINK-${crypto.randomUUID().slice(0,10).toUpperCase()}`,input.bookingId,payment.id,"razorpay",input.environment,input.gatewayOrderId,now,now).run();await db.prepare("INSERT INTO payment_reconciliation_records (payment_id,booking_id,gateway,environment,expected_amount,captured_amount,refunded_amount,currency,gateway_status,reconciliation_status,variance_amount,last_event_id,updated_at) VALUES (?,?,?,?,?,0,0,?,'order_linked','pending',0,NULL,?) ON CONFLICT(payment_id) DO UPDATE SET gateway=excluded.gateway,environment=excluded.environment,expected_amount=excluded.expected_amount,currency=excluded.currency,gateway_status=CASE WHEN payment_reconciliation_records.gateway_status IN ('captured','refunded','partially_refunded') THEN payment_reconciliation_records.gateway_status ELSE 'order_linked' END,updated_at=excluded.updated_at").bind(payment.id,input.bookingId,"razorpay",input.environment,expectedAmount,String(payment.currency||"INR"),now).run();return{bookingId:input.bookingId,paymentId:String(payment.id),gatewayOrderId:input.gatewayOrderId};}
export async function linkSandboxGatewayOrder(db:Db,input:{bookingId:string;gatewayOrderId:string;actorId:string}){const payment=await db.prepare("SELECT amount FROM booking_payments WHERE booking_id=?").bind(input.bookingId).first<Row>();if(!payment)throw new Error("Canonical payment record not found");return linkGatewayOrder(db,{...input,environment:"sandbox",expectedAmount:Number(payment.amount||0)});}'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('gateway linker replacement failed')
          p.write_text(s2)

          # Add verified browser-return completion to the existing order intent.
          p=Path('lib/payment-order-intent.ts'); s=p.read_text()
          s=s.replace('import { createPaymentOrder, publicKeyId, paymentEnvironment } from "./razorpay-client";','import { createPaymentOrder, publicKeyId, paymentEnvironment, verifyCheckoutPayment } from "./razorpay-client";')
          s=s.replace('import { linkGatewayOrder } from "./grooming-payment-reconciliation";','import { linkGatewayOrder, processGatewayEvent } from "./grooming-payment-reconciliation";')
          anchor='\nexport { paymentEnvironment };'
          completion='''

export async function completeBookingPaymentOrder(db: Db, env: Record<string, unknown>, input: { bookingId: string; customerId: string; actorId: string; razorpayOrderId: string; razorpayPaymentId: string; razorpaySignature: string }) {
  const row = await db.prepare("SELECT b.customer_id customer_id,b.status booking_status,p.id payment_id,p.status payment_status,p.currency,l.gateway_order_id,l.environment,r.expected_amount FROM canonical_bookings b JOIN booking_payments p ON p.booking_id=b.id JOIN payment_gateway_links l ON l.booking_id=b.id JOIN payment_reconciliation_records r ON r.payment_id=p.id WHERE b.id=?").bind(input.bookingId).first<Row>();
  if (!row) throw new Error("Canonical booking payment order was not found");
  if (String(row.customer_id) !== input.customerId) throw governedJsonError({ error: "You can only pay for your own booking" }, 403);
  if (String(row.gateway_order_id) !== input.razorpayOrderId) throw governedJsonError({ error: "Razorpay order does not belong to this booking" }, 409);
  const expectedAmount = Number(row.expected_amount || 0), currency = String(row.currency || "INR");
  const verified = await verifyCheckoutPayment(env, { orderId: input.razorpayOrderId, paymentId: input.razorpayPaymentId, signature: input.razorpaySignature, amountSubunits: Math.round(expectedAmount * 100), currency });
  if (!verified.connected) throw governedJsonError({ error: verified.reason }, 409);
  if (verified.environment !== String(row.environment)) throw governedJsonError({ error: "Razorpay environment does not match the booking order" }, 409);
  const payload = `${input.bookingId}|${input.razorpayOrderId}|${input.razorpayPaymentId}|${expectedAmount}|${currency}`;
  const digest = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(payload)))).map(byte => byte.toString(16).padStart(2, "0")).join("");
  const reconciled = await processGatewayEvent(db, { provider: "razorpay", environment: verified.environment, eventId: `checkout:${input.razorpayPaymentId}:captured`, eventType: "payment.captured", bookingId: input.bookingId, gatewayOrderId: input.razorpayOrderId, gatewayPaymentId: input.razorpayPaymentId, amountSubunits: Math.round(expectedAmount * 100), currency, signatureVerified: true, payloadHash: digest, detail: { source: "standard_checkout_return", actorId: input.actorId } });
  if (String((reconciled as Record<string, unknown>).status || "") !== "processed") throw governedJsonError({ error: "Verified Razorpay payment could not be reconciled", reconciliation: reconciled }, 409);
  const state = await db.prepare("SELECT b.status booking_status,p.status payment_status,p.gateway FROM canonical_bookings b JOIN booking_payments p ON p.booking_id=b.id WHERE b.id=?").bind(input.bookingId).first<Row>();
  if (!state || String(state.payment_status) !== "captured") throw governedJsonError({ error: "Payment capture is not recorded on the canonical booking" }, 409);
  return { bookingId: input.bookingId, bookingStatus: String(state.booking_status), paymentStatus: String(state.payment_status), gateway: String(state.gateway), environment: verified.environment, razorpayPaymentId: input.razorpayPaymentId };
}
'''
          if anchor not in s: raise SystemExit('payment intent export marker missing')
