          Path('app/api/payment-order/route.ts').write_text('''import{authError,database,requireCustomerOwnership,resolveActor,securityAudit}from"../../../lib/server-auth";
import{resolvePlatformSession}from"../../../lib/platform-session";
import{completeBookingPaymentOrder,createBookingPaymentOrder}from"../../../lib/payment-order-intent";
const json=(value:unknown,status=200)=>Response.json(value,{status,headers:{"cache-control":"no-store"}});
function sameOrigin(request:Request){const origin=request.headers.get("origin");if(origin&&origin!==new URL(request.url).origin)throw new Response("Cross-origin payment write blocked",{status:403});}
async function paymentRuntime(){const {env}=await import("cloudflare:workers");return env as unknown as Record<string,unknown>;}
async function ownedContext(request:Request,requestedCustomerId?:string){const db=await database(),actor=await resolveActor(request),session=requestedCustomerId?null:await resolvePlatformSession(db,request);const customerId=String(requestedCustomerId||(session?.subjectType==="customer"?session.subjectId:"")).trim();if(!customerId)throw new Response("Verified customer identity is required",{status:401});await requireCustomerOwnership(db,actor,customerId);return{db,actor,customerId};}
export async function POST(request:Request){try{sameOrigin(request);const body=await request.json() as{action?:"create"|"complete";customerId?:string;bookingId?:string;razorpayOrderId?:string;razorpayPaymentId?:string;razorpaySignature?:string};if(!body.bookingId)return json({error:"A booking is required"},400);const{db,actor,customerId}=await ownedContext(request,body.customerId);const env=await paymentRuntime();if(body.action==="complete"){if(!body.razorpayOrderId||!body.razorpayPaymentId||!body.razorpaySignature)return json({error:"Razorpay checkout proof is required"},400);const data=await completeBookingPaymentOrder(db,env,{bookingId:body.bookingId,customerId,actorId:customerId,razorpayOrderId:body.razorpayOrderId,razorpayPaymentId:body.razorpayPaymentId,razorpaySignature:body.razorpaySignature});await securityAudit(db,actor,"payment.checkout.complete","customer",customerId,"completed",{bookingId:body.bookingId,paymentStatus:data.paymentStatus,environment:data.environment});return json({data});}const data=await createBookingPaymentOrder(db,env,{bookingId:body.bookingId,customerId,actorId:customerId});await securityAudit(db,actor,"payment.order.create","customer",customerId,"completed",{bookingId:body.bookingId,connected:data.connected,environment:data.environment});return json({data},data.connected?201:200);}catch(error){return authError(error,"Unable to process payment");}}
''')

          Path('lib/razorpay-checkout-client.ts').write_text('''export type RazorpayCheckoutSuccess={razorpay_payment_id:string;razorpay_order_id:string;razorpay_signature:string};
type Order={keyId:string;orderId:string;amount:number;currency:string;customerName:string;phone:string;description:string};
declare global{interface Window{Razorpay?:new(options:Record<string,unknown>)=>{open:()=>void;on:(event:string,callback:(value:unknown)=>void)=>void};}}
let loader:Promise<void>|null=null;
function load(){if(typeof window==="undefined")return Promise.reject(new Error("Razorpay Checkout requires a browser"));if(window.Razorpay)return Promise.resolve();if(loader)return loader;loader=new Promise((resolve,reject)=>{const script=document.createElement("script");script.src="https://checkout.razorpay.com/v1/checkout.js";script.async=true;script.onload=()=>window.Razorpay?resolve():reject(new Error("Razorpay Checkout did not initialise"));script.onerror=()=>reject(new Error("Razorpay Checkout could not be loaded"));document.head.appendChild(script);});return loader;}
export async function openRazorpayCheckout(order:Order){await load();if(!order.keyId.startsWith("rzp_test_"))throw new Error("Mission 2 checkout is sandbox-only; a Razorpay test key is required");return new Promise<RazorpayCheckoutSuccess>((resolve,reject)=>{const Razorpay=window.Razorpay;if(!Razorpay)return reject(new Error("Razorpay Checkout is unavailable"));const instance=new Razorpay({key:order.keyId,amount:Math.round(order.amount*100),currency:order.currency,name:"PawSpace",description:order.description,order_id:order.orderId,prefill:{name:order.customerName,contact:`+91${order.phone}`},handler:(result:unknown)=>{const value=result as Partial<RazorpayCheckoutSuccess>;if(!value.razorpay_payment_id||!value.razorpay_order_id||!value.razorpay_signature)return reject(new Error("Razorpay Checkout returned incomplete proof"));resolve(value as RazorpayCheckoutSuccess);},modal:{ondismiss:()=>reject(new Error("Razorpay Checkout was closed before payment"))},retry:{enabled:false}});instance.on("payment.failed",(failure:unknown)=>reject(new Error(`Razorpay payment failed: ${JSON.stringify(failure)}`)));instance.open();});}
''')

