          s=s.replace('This preview shows the canonical UAT payment state. Live Razorpay QR, payment links and external receipt delivery are not connected.','pay==="online"?"Captured by Razorpay Test Mode and verified server-side against this canonical booking.":"Payment remains due after service on this canonical booking."')
