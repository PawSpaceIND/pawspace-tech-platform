const razor=fs.readFileSync(new URL("../lib/razorpay-client.ts",import.meta.url),"utf8"),flow=fs.readFileSync(new URL("../app/mobile-app/grooming-flow.tsx",import.meta.url),"utf8"),route=fs.readFileSync(new URL("../app/api/payment-order/route.ts",import.meta.url),"utf8");
test("Mission 2 Razorpay boundary is fail closed and canonical",()=>{assert.match(razor,/PAWSPACE_ENABLE_LIVE_PAYMENTS/);assert.match(razor,/rzp_test_/);assert.match(razor,/status \|\| ""\) !== "captured"/);assert.match(razor,/order_id/);assert.match(route,/completeBookingPaymentOrder/);assert.match(flow,/openRazorpayCheckout/);assert.doesNotMatch(flow,/createTestTransaction/);assert.match(flow,/PAYMENT STATUS/);assert.match(flow,/providerProof\.verified&&/);});
