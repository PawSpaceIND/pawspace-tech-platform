          s,n=re.subn(r'const booking=createTestTransaction\(\{.*?\},canonical\.bookingId\);setAssignedProvider', '''let finalPaymentStatus="due_after_service";if(pay==="online"){const orderResponse=await fetch("/api/payment-order",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"create",bookingId:canonical.bookingId})}),orderBody=await orderResponse.json() as{data?:{connected:boolean;environment:string;orderId:string;amount:number;currency:string;keyId:string};error?:string};if(!orderResponse.ok||!orderBody.data?.connected)throw new Error(orderBody.error||"Razorpay sandbox is not connected");if(orderBody.data.environment!=="sandbox"||!orderBody.data.keyId.startsWith("rzp_test_"))throw new Error("Online grooming checkout is locked to Razorpay sandbox");const proof=await openRazorpayCheckout({keyId:orderBody.data.keyId,orderId:orderBody.data.orderId,amount:orderBody.data.amount,currency:orderBody.data.currency,customerName:customer.customerName,phone:customer.phone,description:`${pack.name} · ${count} pet${count>1?"s":""}`});const verifyResponse=await fetch("/api/payment-order",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"complete",bookingId:canonical.bookingId,razorpayOrderId:proof.razorpay_order_id,razorpayPaymentId:proof.razorpay_payment_id,razorpaySignature:proof.razorpay_signature})}),verifyBody=await verifyResponse.json() as{data?:{bookingStatus:string;paymentStatus:string;environment:string};error?:string};if(!verifyResponse.ok||verifyBody.data?.bookingStatus!=="confirmed"||verifyBody.data?.paymentStatus!=="captured"||verifyBody.data?.environment!=="sandbox")throw new Error(verifyBody.error||"Razorpay payment was not verified on the canonical booking");finalPaymentStatus="captured";}setPaymentStatus(finalPaymentStatus);setAssignedProvider''',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('grooming test transaction replacement failed')
