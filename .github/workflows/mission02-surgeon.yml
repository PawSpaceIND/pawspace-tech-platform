          p=Path('app/mobile-app/grooming-flow.tsx'); s=p.read_text()
          s=s.replace('import { createTestTransaction } from "../../lib/test-transaction";','import { openRazorpayCheckout } from "../../lib/razorpay-checkout-client";')
