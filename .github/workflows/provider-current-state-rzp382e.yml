name: Inspect current Razorpay Test lifecycle rzp382e
on:
  push:
    branches: [ops/razorpay-provider-cert-20260901]
    paths: [.github/workflows/provider-current-state-rzp382e.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read sanitized provider state
        env:
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
        run: |
          set -euo pipefail
          case "$RAZORPAY_KEY_ID_SANDBOX" in rzp_test_*) ;; *) exit 1;; esac
          node --input-type=module <<'NODE'
          const auth=`Basic ${Buffer.from(`${process.env.RAZORPAY_KEY_ID_SANDBOX}:${process.env.RAZORPAY_KEY_SECRET_SANDBOX}`).toString('base64')}`;
          const get=async p=>{const r=await fetch(`https://api.razorpay.com${p}`,{headers:{authorization:auth},redirect:'manual'});const b=await r.json();if(!r.ok)throw new Error(`HTTP ${r.status}`);return b};
          const sub=await get('/v1/subscriptions/sub_TWg9yixMBHpX2w');
          const pay=await get('/v1/payments/pay_TWgmGExMvHg9kZ');
          const inv=await get('/v1/invoices/inv_TWg9zIJKnpe4UU');
          console.log(JSON.stringify({subscription:{id:sub.id,status:sub.status,paid_count:sub.paid_count},payment:{id:pay.id,status:pay.status,amount:pay.amount,amount_refunded:pay.amount_refunded,refund_status:pay.refund_status,order_id:pay.order_id,subscription_id:pay.subscription_id,invoice_id:pay.invoice_id},invoice:{id:inv.id,status:inv.status,subscription_id:inv.subscription_id,payment_id:inv.payment_id,order_id:inv.order_id}}));
          NODE
