name: Diagnose WhatsApp UAT Meta HTTP 400

on:
  push:
    branches:
      - fix/whatsapp-uat-staging-deploy-isolation
    paths:
      - .github/workflows/diagnose-whatsapp-uat-meta-400.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify-meta-400:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce provider request and emit safe classification only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
          META_WHATSAPP_UAT_ALLOWLIST: ${{ secrets.META_WHATSAPP_UAT_ALLOWLIST }}
        run: |
          set -euo pipefail
          SETTINGS="$RUNNER_TEMP/settings.json"; MSG="$RUNNER_TEMP/message.json"; TEMPLATE="$RUNNER_TEMP/template.json"; export SETTINGS MSG TEMPLATE
          trap 'rm -f "$SETTINGS" "$MSG" "$TEMPLATE"' EXIT
          HTTP="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pawspace-staging/settings")"
          [ "$HTTP" = "200" ] || { echo "Unable to read staging settings; response withheld." >&2; exit 1; }
          npx --yes wrangler@4 d1 execute pawspace-staging --remote --command "SELECT m.template_key,m.payload_json FROM communication_messages m WHERE m.customer_id='UAT-WA-CERT-CUSTOMER' AND m.channel='whatsapp' ORDER BY m.created_at DESC LIMIT 1;" --json > "$MSG"
          npx --yes wrangler@4 d1 execute pawspace-staging --remote --command "SELECT template_key,status,approved_language,category FROM whatsapp_uat_templates WHERE status='approved' ORDER BY updated_at DESC LIMIT 1;" --json > "$TEMPLATE"
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';
          const settings=JSON.parse(readFileSync(process.env.SETTINGS,'utf8'));
          const bindings=Array.isArray(settings?.result?.bindings)?settings.result.bindings:[];
          const plain=Object.fromEntries(bindings.filter(b=>b?.type==='plain_text').map(b=>[String(b.name||''),String(b.text??b.value??'')]));
          if(String(plain.PAWSPACE_PRODUCTION_ENFORCE||'')!=='false'||String(plain.PAWSPACE_COMMUNICATION_ENV||'')!=='uat')throw new Error('Staging/UAT lockdown not verified');
          const phoneId=String(plain.META_WHATSAPP_PHONE_NUMBER_ID||'').trim();
          const graphVersion=String(plain.META_WHATSAPP_GRAPH_VERSION||'v23.0').trim();
          const recipient=String(process.env.META_WHATSAPP_UAT_ALLOWLIST||'').split(',').map(v=>v.trim()).filter(Boolean)[0]||'';
          const token=String(process.env.META_WHATSAPP_UAT_ACCESS_TOKEN||'').trim();
          if(!phoneId||!recipient||!token)throw new Error('Required UAT provider configuration unavailable');
          console.log(`::add-mask::${recipient}`);
          const flatten=p=>(Array.isArray(p)?p:[]).flatMap(b=>Array.isArray(b?.results)?b.results:[]);
          const msg=flatten(JSON.parse(readFileSync(process.env.MSG,'utf8')))[0]||{};
          const tpl=flatten(JSON.parse(readFileSync(process.env.TEMPLATE,'utf8')))[0]||{};
          const templateKey=String(msg.template_key||tpl.template_key||'').trim();
          let payload={};try{payload=JSON.parse(String(msg.payload_json||'{}'))}catch{}
          const language=String(payload.language||tpl.approved_language||'en').trim();
          if(!templateKey)throw new Error('No approved UAT template available');
          const body={messaging_product:'whatsapp',to:recipient.replace(/\D/g,''),type:'template',template:{name:templateKey,language:{code:language}}};
          const response=await fetch(`https://graph.facebook.com/${graphVersion}/${phoneId}/messages`,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(30000)});
          let result={};try{result=await response.json()}catch{}
          if(response.ok){console.log('Meta direct diagnostic accepted the controlled UAT template request; provider reference withheld.');process.exit(0);}
          const err=result?.error||{};
          const code=Number(err.code||0),subcode=Number(err.error_subcode||0),type=String(err.type||'unknown').replace(/[^A-Za-z0-9_-]/g,'_').slice(0,64);
          console.log(`Meta diagnostic rejected request: HTTP=${response.status}; type=${type}; code=${code}; subcode=${subcode}; transient=${Boolean(err.is_transient)}.`);
          process.exit(2);
          NODE
