name: PR1275 focused native input qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr1275-pointer-focused-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-input:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
      FORBID_PRODUCTION: 'true'
      APP_ENV: staging
      PW_PORT: '4291'
    steps:
      - uses: actions/checkout@v4
      - name: Pin independently reviewed application and original spec
        run: |
          test "$(sha256sum app/v2/grooming/page.tsx | cut -d' ' -f1)" = b3bdb51f7c808d39a6734e9288b3a0f5d00ce5f2db339d179ad7bd42365c0e14
          test "$(sha256sum e2e/v2-grooming.spec.ts | cut -d' ' -f1)" = 766d969cf0ea06c1790cd788bbcbcfb052030fb41333784e4578c4c8cdba5230
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/@playwright/test/cli.js install --with-deps webkit
      - name: Only ten focused native controls, no broad matrix
        run: node node_modules/@playwright/test/cli.js test --config playwright.pr1275-pointer-focused.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1275-pointer-focused-${{ github.sha }}
          path: artifacts/pr1275-pointer-focused/
          retention-days: 7
