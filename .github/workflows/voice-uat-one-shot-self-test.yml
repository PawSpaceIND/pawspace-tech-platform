name: Voice UAT one-shot carrier self-test

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type voice-self-test-call for main self-test or voice-native-agentstream-call on the temporary proof branch'
        required: true
        default: ''
      expected_sha:
        description: 'Exact current protected main SHA already activated on staging'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  carrier-self-test:
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'voice-self-test-call' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.expected_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(gh api repos/PawSpaceIND/pawspace-tech-platform/commits/main --jq .sha)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Place one governed allow-listed AI voice self-test call
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          node <<'NODE'
          const account = String(process.env.CLOUDFLARE_ACCOUNT_ID || "").trim();
          const token = String(process.env.CLOUDFLARE_API_TOKEN || "").trim();
          const access = String(process.env.PAWSPACE_UAT_ACCESS_CODE || "");
          const expectedSha = String(process.env.EXPECTED_SHA || "").trim();
          if (!/^[a-f0-9]{32}$/i.test(account) || !token || !access || !/^[a-f0-9]{40}$/.test(expectedSha)) throw new Error("Self-test prerequisites missing");

          const cf = async (path, init = {}) => {
            const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + account + path, {
              ...init,
              headers: { authorization: "Bearer " + token, "content-type": "application/json", ...(init.headers || {}) },
              redirect: "error",
              signal: AbortSignal.timeout(20_000),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success !== true) throw new Error("Cloudflare verification failed");
            return body.result;
          };

          const [subdomain, settings, deployments] = await Promise.all([
            cf("/workers/subdomain"),
            cf("/workers/scripts/pawspace-staging/settings"),
            cf("/workers/scripts/pawspace-staging/deployments"),
          ]);
          const workerSubdomain = String(subdomain?.subdomain || "").trim();
          if (!/^[a-z0-9-]+$/i.test(workerSubdomain)) throw new Error("Workers subdomain unavailable");
          const origin = "https://pawspace-staging." + workerSubdomain + ".workers.dev";
          const bindings = Array.isArray(settings?.bindings) ? settings.bindings : [];
          const plain = Object.fromEntries(bindings.filter(b => b?.type === "plain_text").map(b => [String(b.name), String(b.text ?? b.value ?? "")]));
          if (plain.PAWSPACE_VOICE_ENV !== "uat" || plain.PAWSPACE_VOICE_UAT_APPROVED !== "true" || plain.PAWSPACE_VOICE_UAT_AI_SELF_TEST_APPROVED !== "true") {
            throw new Error("Staging AI voice self-test gate is not fully activated");
          }
          const release = String(plain.PAWSPACE_RELEASE_SHA || plain.PAWSPACE_DEPLOY_SHA || "").trim();
          if (release && release !== expectedSha) throw new Error("Staging release SHA does not match expected main");
          const db = bindings.find(b => b?.type === "d1" && b?.name === "DB");
          if (!db?.id) throw new Error("Staging D1 binding unavailable");

          const login = await fetch(origin + "/api/staging-login", {
            method: "POST",
            headers: { "content-type": "application/json", origin },
            body: JSON.stringify({ email: "founder@pawspace.in", code: access }),
            redirect: "manual",
            signal: AbortSignal.timeout(20_000),
          });
          if (login.status !== 200) throw new Error("Founder staging sign-in failed");
          const cookieHeader = login.headers.get("set-cookie") || "";
          const cookie = cookieHeader.split(";", 1)[0];
          if (!cookie.startsWith("pawspace_uat=")) throw new Error("Staging login did not issue the UAT session cookie");

          const readyResponse = await fetch(origin + "/api/voice-outbound?scope=ai_self_test", {
            headers: { cookie },
            redirect: "error",
            signal: AbortSignal.timeout(20_000),
          });
          const readyBody = await readyResponse.json().catch(() => ({}));
          if (!readyResponse.ok || readyBody?.data?.enabled !== true) {
            throw new Error("AI voice self-test readiness is blocked: " + String(readyBody?.data?.reason || readyBody?.error || readyResponse.status));
          }

          const callResponse = await fetch(origin + "/api/voice-outbound", {
            method: "POST",
            headers: { "content-type": "application/json", origin, cookie },
            body: JSON.stringify({ action: "uat_ai_self_test" }),
            redirect: "error",
            signal: AbortSignal.timeout(30_000),
          });
          const callBody = await callResponse.json().catch(() => ({}));
          if (callResponse.status !== 201 || !callBody?.data?.callId || !callBody?.data?.providerCallId) {
            throw new Error("Exotel self-test dial was not accepted: " + String(callBody?.error || callResponse.status));
          }
          const callId = String(callBody.data.callId);
          console.log("::add-mask::" + callId);
          console.log("::add-mask::" + String(callBody.data.providerCallId));
          console.log("Exotel accepted exactly one governed UAT self-test dial; identifiers withheld.");

          let row = null;
          for (let attempt = 0; attempt < 10; attempt++) {
            await new Promise(resolve => setTimeout(resolve, 3000));
            const result = await cf("/d1/database/" + encodeURIComponent(String(db.id)) + "/query", {
              method: "POST",
              body: JSON.stringify({
                sql: "SELECT state,provider_call_id,stream_sid,last_error,turn_count,connected_at,ended_at FROM ai_voice_self_tests WHERE id=?",
                params: [callId],
              }),
            });
            row = Array.isArray(result) ? result?.[0]?.results?.[0] : result?.results?.[0];
            if (row && (String(row.state) === "failed" || String(row.state) === "streaming" || String(row.state) === "ended")) break;
          }
          if (!row?.provider_call_id) throw new Error("Provider-accepted call was not persisted");
          if (String(row.state) === "failed") throw new Error("AgentStream self-test failed after provider acceptance: " + String(row.last_error || "unknown"));
          const state = String(row.state || "unknown");
          const streamed = Boolean(row.stream_sid || row.connected_at || state === "streaming" || state === "ended");
          console.log("UAT carrier evidence: providerAccepted=yes state=" + state + " agentStreamObserved=" + (streamed ? "yes" : "not-yet") + " turns=" + Number(row.turn_count || 0));
          NODE
      - name: Publish sanitized result
        if: success()
        run: |
          {
            echo '## Voice UAT one-shot carrier self-test'
            echo '- exact current main verified: yes'
            echo '- real staging authentication used: yes'
            echo '- self-test readiness gate: passed'
            echo '- allow-listed destination selected server-side: yes'
            echo '- Exotel accepted one real UAT dial: yes'
            echo '- production voice mode enabled: no'
            echo '- recording enabled: no'
            echo '- no recipient number or provider credential printed: yes'
          } >> "$GITHUB_STEP_SUMMARY"

  native-agentstream-handset-proof:
    if: ${{ github.ref == 'refs/heads/test/native-agentstream-handset-proof' && github.event.inputs.confirm == 'voice-native-agentstream-call' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    concurrency:
      group: pawspace-staging-sweep
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify workflow-only proof branch and deployed app SHA
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" HEAD
          git diff --quiet "$EXPECTED_SHA" HEAD -- . ':(exclude).github/workflows/voice-uat-one-shot-self-test.yml' ':(exclude).github/workflows/voice-uat-staging.yml'
          test -z "$(git status --porcelain)"
      - name: Place one governed native AgentStream Grooming call
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          node <<'NODE'
          const account = String(process.env.CLOUDFLARE_ACCOUNT_ID || "").trim();
          const token = String(process.env.CLOUDFLARE_API_TOKEN || "").trim();
          const access = String(process.env.PAWSPACE_UAT_ACCESS_CODE || "");
          const expectedSha = String(process.env.EXPECTED_SHA || "").trim();
          if (!/^[a-f0-9]{32}$/i.test(account) || !token || !access || !/^[a-f0-9]{40}$/.test(expectedSha)) {
            throw new Error("Native UAT prerequisites missing");
          }
          const cf = async (path, init = {}) => {
            const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + account + path, {
              ...init,
              headers: { authorization: "Bearer " + token, "content-type": "application/json", ...(init.headers || {}) },
              redirect: "error",
              signal: AbortSignal.timeout(20_000),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success !== true) throw new Error("Cloudflare verification failed");
            return body.result;
          };
          const [subdomain, settings, deployments] = await Promise.all([
            cf("/workers/subdomain"),
            cf("/workers/scripts/pawspace-staging/settings"),
            cf("/workers/scripts/pawspace-staging/deployments"),
          ]);
          const workerSubdomain = String(subdomain?.subdomain || "").trim();
          if (!/^[a-z0-9-]+$/i.test(workerSubdomain)) throw new Error("Workers subdomain unavailable");
          const origin = "https://pawspace-staging." + workerSubdomain + ".workers.dev";
          const bindings = Array.isArray(settings?.bindings) ? settings.bindings : [];
          const plain = Object.fromEntries(
            bindings.filter(b => b?.type === "plain_text").map(b => [String(b.name), String(b.text ?? b.value ?? "")]),
          );
          if (plain.PAWSPACE_VOICE_ENV !== "uat"
            || plain.PAWSPACE_VOICE_RUNTIME !== "elevenlabs"
            || plain.PAWSPACE_VOICE_UAT_APPROVED !== "true"
            || plain.PAWSPACE_VOICE_NATIVE_UAT_APPROVED !== "true"
            || plain.PAWSPACE_VOICE_UAT_AI_SELF_TEST_APPROVED !== "true"
            || plain.PAWSPACE_VOICE_SALES_OUTBOUND_APPROVED !== "true") {
            throw new Error("Native AgentStream UAT gate is not fully activated");
          }
          if (plain.VOICE_AGENTSTREAM_STT_LANGUAGE !== "auto") throw new Error("Native UAT STT is not in auto-detect mode");
          if (!String(plain.PAWSPACE_VOICE_STREAM_URL || "").startsWith("wss://")) throw new Error("AgentStream WSS URL is unavailable");
          const active = deployments?.deployments?.[0];
          if (!active?.id || active?.versions?.length !== 1 || active.versions[0]?.percentage !== 100) {
            throw new Error("Staging does not have one 100% active deployment");
          }
          if (String(settings?.annotations?.["workers/message"] || "").trim() !== "staging " + expectedSha) {
            throw new Error("Staging deployment annotation does not match the deployed Phase-2 app");
          }
          const customerId = String(plain.PAWSPACE_VOICE_UAT_CUSTOMER_ID || "").trim();
          if (!customerId) throw new Error("Canonical UAT customer context is unavailable");
          const db = bindings.find(b => b?.type === "d1" && b?.name === "DB");
          if (!db?.id) throw new Error("Staging D1 binding unavailable");

          const login = await fetch(origin + "/api/staging-login", {
            method: "POST",
            headers: { "content-type": "application/json", origin },
            body: JSON.stringify({ email: "founder@pawspace.in", code: access }),
            redirect: "manual",
            signal: AbortSignal.timeout(20_000),
          });
          if (login.status !== 200) throw new Error("Founder staging sign-in failed");
          const cookie = String(login.headers.get("set-cookie") || "").split(";", 1)[0];
          if (!cookie.startsWith("pawspace_uat=")) throw new Error("Staging login did not issue the UAT session cookie");
          const callResponse = await fetch(origin + "/api/voice-outbound", {
            method: "POST",
            headers: { "content-type": "application/json", origin, cookie },
            body: JSON.stringify({ action: "uat_native_agentstream_test", useCase: "grooming_sales", customerId, cityId: "blr" }),
            redirect: "error",
            signal: AbortSignal.timeout(30_000),
          });
          const callBody = await callResponse.json().catch(() => ({}));
          if (callResponse.status !== 201 || callBody?.data?.provider !== "exotel" || !callBody?.data?.callId || !callBody?.data?.providerCallId) {
            throw new Error("Native AgentStream UAT dial was not accepted: " + String(callBody?.error || callResponse.status));
          }
          const callId = String(callBody.data.callId);
          const providerCallId = String(callBody.data.providerCallId);
          console.log("::add-mask::" + callId);
          console.log("::add-mask::" + providerCallId);
          const threadId = "THREAD-VOICE-" + callId.replace(/[^A-Za-z0-9_-]/g, "").slice(0, 96);
          console.log("Native Exotel dial accepted; call and recipient identifiers withheld.");

          let evidence = null;
          for (let attempt = 0; attempt < 20; attempt++) {
            await new Promise(resolve => setTimeout(resolve, 3000));
            const result = await cf("/d1/database/" + encodeURIComponent(String(db.id)) + "/query", {
              method: "POST",
              body: JSON.stringify({
                sql: `SELECT o.state,o.provider,o.provider_call_id,
                  (SELECT COUNT(*) FROM ai_voice_calls c WHERE c.thread_id=?) AS ai_calls,
                  (SELECT COUNT(*) FROM ai_voice_events e JOIN ai_voice_calls c ON c.id=e.call_id WHERE c.thread_id=? AND e.event_type IN ('agentstream_started','agentstream_reconnected')) AS stream_events,
                  (SELECT COUNT(*) FROM ai_voice_events e JOIN ai_voice_calls c ON c.id=e.call_id WHERE c.thread_id=? AND e.event_type='agentstream_turn') AS turn_events,
                  (SELECT e.detail_json FROM ai_voice_events e JOIN ai_voice_calls c ON c.id=e.call_id WHERE c.thread_id=? AND e.event_type='agentstream_turn' ORDER BY e.created_at DESC LIMIT 1) AS latest_turn
                  FROM voice_call_orders o WHERE o.id=?`,
                params: [threadId, threadId, threadId, threadId, callId],
              }),
            });
            evidence = Array.isArray(result) ? result?.[0]?.results?.[0] : result?.results?.[0];
            if (Number(evidence?.stream_events || 0) > 0 && Number(evidence?.turn_events || 0) > 0) break;
          }
          if (!evidence?.provider_call_id || String(evidence.provider) !== "exotel") throw new Error("Native UAT call did not persist as direct Exotel");
          if (Number(evidence.stream_events || 0) < 1) throw new Error("No AgentStream connection was observed for the native UAT call");
          if (Number(evidence.turn_events || 0) < 1) throw new Error("No native STT -> Maya -> TTS turn was observed; answer the test call and speak once");
          let diagnostics = {};
          try { diagnostics = JSON.parse(String(evidence.latest_turn || "{}")); } catch {}
          const safe = {
            state: String(evidence.state || "unknown"),
            agentStreamObserved: true,
            turns: Number(evidence.turn_events || 0),
            configuredSttLanguage: String(diagnostics.configuredSttLanguage || "unknown"),
            detectedSttLanguage: diagnostics.detectedSttLanguage || null,
            ttsLanguage: String(diagnostics.ttsLanguage || "unknown"),
            sttMs: Number(diagnostics.sttMs || 0),
            llmMs: Number(diagnostics.llmMs || 0),
            ttsMs: Number(diagnostics.ttsMs || 0),
            totalMs: Number(diagnostics.totalMs || 0),
            targetMet: diagnostics.targetMet === true,
          };
          console.log("Native UAT evidence " + JSON.stringify(safe));
          NODE
      - name: Publish sanitized native result
        if: success()
        run: |
          {
            echo '## Native AgentStream one-shot handset proof'
            echo '- deployed Phase-2 app SHA verified: yes'
            echo '- ordinary voice runtime remains ElevenLabs: yes'
            echo '- private native AgentStream override used: yes'
            echo '- canonical allow-listed customer selected server-side: yes'
            echo '- Exotel accepted exactly one native UAT dial: yes'
            echo '- AgentStream connected and at least one native STT -> Maya -> TTS turn observed: yes'
            echo '- production voice mode enabled: no'
            echo '- recipient number, transcript and provider credentials printed: no'
          } >> "$GITHUB_STEP_SUMMARY"

  native-agentstream-readback:
    if: ${{ github.ref == 'refs/heads/test/native-agentstream-handset-proof' && github.event.inputs.confirm == 'voice-native-agentstream-readback' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read sanitized latest native UAT state
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const account=String(process.env.CLOUDFLARE_ACCOUNT_ID||"").trim();
          const token=String(process.env.CLOUDFLARE_API_TOKEN||"").trim();
          const expectedSha=String(process.env.EXPECTED_SHA||"").trim();
          if(!/^[a-f0-9]{32}$/i.test(account)||!token||!/^[a-f0-9]{40}$/.test(expectedSha)) throw new Error("Readback prerequisites missing");
          const cf=async(path,init={})=>{
            const response=await fetch("https://api.cloudflare.com/client/v4/accounts/"+account+path,{
              ...init,
              headers:{authorization:"Bearer "+token,"content-type":"application/json",...(init.headers||{})},
              redirect:"error",signal:AbortSignal.timeout(20000),
            });
            const body=await response.json().catch(()=>({}));
            if(!response.ok||body.success!==true) throw new Error("Cloudflare readback failed");
            return body.result;
          };
          const settings=await cf("/workers/scripts/pawspace-staging/settings");
          if(String(settings?.annotations?.["workers/message"]||"").trim()!=="staging "+expectedSha) throw new Error("Readback refused: staging SHA changed");
          const bindings=Array.isArray(settings?.bindings)?settings.bindings:[];
          const db=bindings.find(b=>b?.type==="d1"&&b?.name==="DB");
          if(!db?.id) throw new Error("Staging D1 binding unavailable");
          const result=await cf("/d1/database/"+encodeURIComponent(String(db.id))+"/query",{
            method:"POST",
            body:JSON.stringify({
              sql:"SELECT state,provider,provider_call_id,ai_call_id FROM voice_call_orders WHERE campaign_id='controlled_native_agentstream_uat' ORDER BY requested_at DESC LIMIT 1",
            }),
          });
          const row=Array.isArray(result)?result?.[0]?.results?.[0]:result?.results?.[0];
          if(!row) throw new Error("No controlled native UAT call exists");
          if(row.provider_call_id) console.log("::add-mask::"+String(row.provider_call_id));
          if(row.ai_call_id) console.log("::add-mask::"+String(row.ai_call_id));
          console.log("Native UAT readback "+JSON.stringify({
            state:String(row.state||"unknown"),
            provider:String(row.provider||"unknown"),
            providerAccepted:Boolean(row.provider_call_id),
            agentStreamBound:Boolean(row.ai_call_id),
          }));
          NODE
