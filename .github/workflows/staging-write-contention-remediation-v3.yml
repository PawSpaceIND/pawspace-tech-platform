name: Guarded staging write contention remediation v3

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/staging-write-contention-remediation-v3.yml

permissions:
  contents: write

concurrency:
  group: guarded-staging-write-contention-remediation-v3
  cancel-in-progress: false

env:
  STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev

jobs:
  remediate:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Apply write-path remediation
        run: |
          cat > "$RUNNER_TEMP/remediate.py" <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: expected source not found")
              return text.replace(old, new, 1)

          # 1) Fail-fast D1 retry policy: at most 3 attempts, <=50 ms per sleep,
          # <=100 ms total retry sleep, randomized half-to-full exponential jitter.
          Path('lib/d1-write-retry.ts').write_text(r'''const SQLITE_BUSY_PATTERN=/\bSQLITE_BUSY(?:_[A-Z_]+)?\b|database (?:table )?is locked|database is busy/i;
          const SQLITE_CONSTRAINT_PATTERN=/\bSQLITE_CONSTRAINT(?:_[A-Z_]+)?\b|(?:UNIQUE|FOREIGN KEY|CHECK|NOT NULL) constraint failed/i;

          export type D1WriteRetryOptions={
            attempts?:number;
            baseDelayMs?:number;
            maxDelayMs?:number;
            maxTotalDelayMs?:number;
            sleep?:(delayMs:number)=>Promise<void>;
            random?:()=>number;
          };

          const HARD_MAX_ATTEMPTS=3;
          const HARD_MAX_BACKOFF_MS=50;
          const HARD_MAX_TOTAL_DELAY_MS=100;

          function errorDetails(error:unknown){
            const parts:string[]=[];
            const seen=new Set<unknown>();
            let current:unknown=error;
            for(let depth=0;current!==null&&current!==undefined&&depth<6&&!seen.has(current);depth+=1){
              seen.add(current);
              if(typeof current==="object"){
                const record=current as {code?:unknown;name?:unknown;message?:unknown;cause?:unknown};
                for(const value of [record.code,record.name,record.message])if(value!==undefined&&value!==null)parts.push(String(value));
                current=record.cause;
                continue;
              }
              parts.push(String(current));
              break;
            }
            return parts.join(" ");
          }

          export function isSqliteBusyError(error:unknown){return SQLITE_BUSY_PATTERN.test(errorDetails(error));}
          export function isSqliteConstraintError(error:unknown){return SQLITE_CONSTRAINT_PATTERN.test(errorDetails(error));}

          export async function withD1WriteRetry<T>(work:()=>Promise<T>,options:D1WriteRetryOptions={}):Promise<T>{
            const attempts=Math.min(HARD_MAX_ATTEMPTS,Math.max(1,Math.floor(options.attempts??3)));
            const baseDelayMs=Math.min(HARD_MAX_BACKOFF_MS,Math.max(1,Math.floor(options.baseDelayMs??5)));
            const maxDelayMs=Math.min(HARD_MAX_BACKOFF_MS,Math.max(baseDelayMs,Math.floor(options.maxDelayMs??40)));
            const maxTotalDelayMs=Math.min(HARD_MAX_TOTAL_DELAY_MS,Math.max(0,Math.floor(options.maxTotalDelayMs??75)));
            const sleep=options.sleep??((delayMs:number)=>new Promise<void>(resolve=>setTimeout(resolve,delayMs)));
            const random=options.random??Math.random;
            let totalDelayMs=0;
            for(let attempt=0;attempt<attempts;attempt+=1){
              try{return await work();}
              catch(error){
                if(!isSqliteBusyError(error)||attempt===attempts-1)throw error;
                const exponential=Math.min(maxDelayMs,baseDelayMs*(2**attempt));
                const floor=Math.max(1,Math.ceil(exponential/2));
                const unit=Math.max(0,Math.min(0.999999,random()));
                const delay=Math.min(maxDelayMs,floor+Math.floor(unit*(exponential-floor+1)));
                if(totalDelayMs+delay>maxTotalDelayMs)throw error;
                totalDelayMs+=delay;
                await sleep(delay);
              }
            }
            throw new Error("D1 write retry loop exhausted unexpectedly");
          }

          const rawStatements=new WeakMap<object,D1PreparedStatement>();
          function retryingStatement(statement:D1PreparedStatement):D1PreparedStatement{
            const proxy=new Proxy(statement,{
              get(target,property,receiver){
                if(property==="bind")return(...values:unknown[])=>retryingStatement(target.bind(...values));
                if(property==="run")return()=>withD1WriteRetry(()=>target.run());
                const value=Reflect.get(target,property,receiver);
                return typeof value==="function"?value.bind(target):value;
              },
            }) as D1PreparedStatement;
            rawStatements.set(proxy as object,statement);
            return proxy;
          }

          const retryingDatabases=new WeakMap<object,D1Database>();
          export function withRetryingD1Writes(db:D1Database):D1Database{
            const existing=retryingDatabases.get(db as object);
            if(existing)return existing;
            const proxy=new Proxy(db,{
              get(target,property,receiver){
                if(property==="prepare")return(query:string)=>retryingStatement(target.prepare(query));
                if(property==="batch")return(statements:D1PreparedStatement[])=>withD1WriteRetry(()=>target.batch(statements.map(statement=>rawStatements.get(statement as object)??statement)));
                if(property==="exec")return(query:string)=>withD1WriteRetry(()=>target.exec(query));
                const value=Reflect.get(target,property,receiver);
                return typeof value==="function"?value.bind(target):value;
              },
            }) as D1Database;
            retryingDatabases.set(db as object,proxy);
            return proxy;
          }
          '''.replace('\n          ','\n').lstrip())

          # 2) Provider capacity: make established-schema requests read-only; coalesce first-use writes.
          p=Path('lib/provider-capacity-governance.ts')
          s=p.read_text()
          s=replace_once(s,
            'const capacityTablesEnsured=new WeakSet<Db>();\nconst capacityDefaultsSeeded=new WeakSet<Db>();',
            'const capacityTablesEnsured=new WeakSet<Db>();\nconst capacityDefaultsSeeded=new WeakSet<Db>();\nconst capacityTablesEnsuring=new WeakMap<Db,Promise<void>>();\nconst capacityDefaultsSeeding=new WeakMap<Db,Promise<void>>();\nconst providerBookingGuardEnsured=new WeakSet<Db>();\nconst providerBookingGuardEnsuring=new WeakMap<Db,Promise<void>>();',
            'provider guard state')

          old='export async function ensureProviderCapacityTables(db:Db){if(capacityTablesEnsured.has(db))return;await db.batch(['
          new='export async function ensureProviderCapacityTables(db:Db){if(capacityTablesEnsured.has(db))return;const running=capacityTablesEnsuring.get(db);if(running)return running;const pending=(async()=>{const required=["provider_capacity_profiles","provider_capacity_audit","provider_assignment_offers","provider_recovery_cases","provider_performance_events","provider_unavailability","idx_provider_capacity_profiles_lookup","idx_provider_unavailability_active","idx_provider_unavailability_window","idx_provider_assignment_offers_group"];const existing=await db.prepare(`SELECT name FROM sqlite_master WHERE name IN (${required.map(()=>"?").join(",")})`).bind(...required).all<Row>();if(new Set(existing.results.map(row=>String(row.name))).size===required.length){capacityTablesEnsured.add(db);return;}await db.batch(['
          s=replace_once(s,old,new,'provider ensure open')
          s=replace_once(s,']);capacityTablesEnsured.add(db);}\n\nexport async function seedProviderCapacityDefaults',']);capacityTablesEnsured.add(db);})();capacityTablesEnsuring.set(db,pending);try{return await pending;}finally{if(capacityTablesEnsuring.get(db)===pending)capacityTablesEnsuring.delete(db);}}\n\nexport async function seedProviderCapacityDefaults','provider ensure close')

          old='export async function seedProviderCapacityDefaults(db:Db){if(capacityDefaultsSeeded.has(db))return;await ensureProviderCapacityTables(db);const now=Date.now();await db.batch(defaults.map(p=>db.prepare('
          new='export async function seedProviderCapacityDefaults(db:Db){if(capacityDefaultsSeeded.has(db))return;const running=capacityDefaultsSeeding.get(db);if(running)return running;const pending=(async()=>{await ensureProviderCapacityTables(db);const ids=defaults.map(p=>p.id);const existing=await db.prepare(`SELECT COUNT(*) n FROM provider_capacity_profiles WHERE id IN (${ids.map(()=>"?").join(",")})`).bind(...ids).first<Row>();if(Number(existing?.n||0)===ids.length){capacityDefaultsSeeded.add(db);return;}const now=Date.now();await db.batch(defaults.map(p=>db.prepare('
          s=replace_once(s,old,new,'provider seed open')
          s=replace_once(s,'now)));capacityDefaultsSeeded.add(db);}\n\nfunction parse<T>','now)));capacityDefaultsSeeded.add(db);})();capacityDefaultsSeeding.set(db,pending);try{return await pending;}finally{if(capacityDefaultsSeeding.get(db)===pending)capacityDefaultsSeeding.delete(db);}}\n\nfunction parse<T>','provider seed close')

          old='export async function ensureProviderBookingGuard(db:Db){await ensureProviderCapacityTables(db);await db.batch([db.prepare("CREATE TABLE IF NOT EXISTS provider_booking_confirmation_guards (group_id TEXT PRIMARY KEY,created_at INTEGER NOT NULL)"),db.prepare("CREATE TRIGGER IF NOT EXISTS block_unavailable_provider_booking BEFORE INSERT ON provider_booking_confirmation_guards WHEN EXISTS (SELECT 1 FROM scheduling_reservations r JOIN provider_unavailability u ON u.provider_id=r.provider_id AND u.status=\'active\' AND u.starts_at<r.scheduled_end AND u.ends_at>r.scheduled_start WHERE r.group_id=NEW.group_id AND r.status!=\'cancelled\') BEGIN SELECT RAISE(ABORT,\'provider_unavailable_before_booking\'); END")]);}'
          new='export async function ensureProviderBookingGuard(db:Db){if(providerBookingGuardEnsured.has(db))return;const running=providerBookingGuardEnsuring.get(db);if(running)return running;const pending=(async()=>{await ensureProviderCapacityTables(db);const existing=await db.prepare("SELECT name FROM sqlite_master WHERE name IN (\'provider_booking_confirmation_guards\',\'block_unavailable_provider_booking\')").all<Row>();if(new Set(existing.results.map(row=>String(row.name))).size===2){providerBookingGuardEnsured.add(db);return;}await db.batch([db.prepare("CREATE TABLE IF NOT EXISTS provider_booking_confirmation_guards (group_id TEXT PRIMARY KEY,created_at INTEGER NOT NULL)"),db.prepare("CREATE TRIGGER IF NOT EXISTS block_unavailable_provider_booking BEFORE INSERT ON provider_booking_confirmation_guards WHEN EXISTS (SELECT 1 FROM scheduling_reservations r JOIN provider_unavailability u ON u.provider_id=r.provider_id AND u.status=\'active\' AND u.starts_at<r.scheduled_end AND u.ends_at>r.scheduled_start WHERE r.group_id=NEW.group_id AND r.status!=\'cancelled\') BEGIN SELECT RAISE(ABORT,\'provider_unavailable_before_booking\'); END")]);providerBookingGuardEnsured.add(db);})();providerBookingGuardEnsuring.set(db,pending);try{return await pending;}finally{if(providerBookingGuardEnsuring.get(db)===pending)providerBookingGuardEnsuring.delete(db);}}'
          s=replace_once(s,old,new,'provider booking guard')
          p.write_text(s)

          # 3) Lease governance/cleanup: no repeated DDL on established schema and one set-based cleanup transaction.
          p=Path('lib/scheduling-reservation-leases.ts')
          s=p.read_text()
          s=replace_once(s,'const leaseTablesEnsured=new WeakSet<Db>();','const leaseTablesEnsured=new WeakSet<Db>();\nconst leaseTablesEnsuring=new WeakMap<Db,Promise<boolean>>();\nconst cleanupRunning=new WeakMap<Db,Promise<{groups:number;reservations:number}>>();','lease guard state')
          start=s.index('export async function ensureSchedulingReservationLeaseGovernance')
          end=s.index('export async function reservationLeaseForRequest',start)
          ensure=r'''export async function ensureSchedulingReservationLeaseGovernance(db:Db){
            if(leaseTablesEnsured.has(db))return true;
            const running=leaseTablesEnsuring.get(db);if(running)return running;
            const pending=(async()=>{
              if(!(await tableExists(db,"scheduling_reservations")))return false;
              const columns=await db.prepare("PRAGMA table_info(scheduling_reservations)").all<Row>();
              const hasLease=columns.results.some(row=>String(row.name)==="lease_expires_at");
              const hasSession=columns.results.some(row=>String(row.name)==="customer_session_id");
              const schema=await db.prepare("SELECT type,name FROM sqlite_master WHERE name IN ('idx_scheduling_reservations_lease','scheduling_reservation_lease_cleanup','booking_reservation_confirmation_guards','block_expired_reservation_booking')").all<Row>();
              if(hasLease&&hasSession&&new Set(schema.results.map(row=>String(row.name))).size===4){leaseTablesEnsured.add(db);return true;}
              await ensurePlatformSessionTables(db);
              if(!hasLease)await db.prepare("ALTER TABLE scheduling_reservations ADD COLUMN lease_expires_at INTEGER").run().catch(error=>{if(!/duplicate column name/i.test(error instanceof Error?error.message:String(error)))throw error;});
              if(!hasSession)await db.prepare("ALTER TABLE scheduling_reservations ADD COLUMN customer_session_id TEXT").run().catch(error=>{if(!/duplicate column name/i.test(error instanceof Error?error.message:String(error)))throw error;});
              await db.batch([
                db.prepare("CREATE INDEX IF NOT EXISTS idx_scheduling_reservations_lease ON scheduling_reservations(status,lease_expires_at,customer_session_id)"),
                db.prepare("CREATE TABLE IF NOT EXISTS scheduling_reservation_lease_cleanup (group_id TEXT PRIMARY KEY,reason TEXT NOT NULL,released_at INTEGER NOT NULL)"),
                db.prepare("CREATE TABLE IF NOT EXISTS booking_reservation_confirmation_guards (group_id TEXT PRIMARY KEY,checked_at INTEGER NOT NULL)"),
                db.prepare("CREATE TRIGGER IF NOT EXISTS block_expired_reservation_booking BEFORE INSERT ON booking_reservation_confirmation_guards WHEN NOT EXISTS (SELECT 1 FROM scheduling_reservations r WHERE r.group_id=NEW.group_id AND r.status!='cancelled') OR EXISTS (SELECT 1 FROM scheduling_reservations r WHERE r.group_id=NEW.group_id AND r.status!='cancelled' AND ((r.lease_expires_at IS NOT NULL AND r.lease_expires_at<=NEW.checked_at) OR (r.customer_session_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM platform_identity_sessions s WHERE s.id=r.customer_session_id AND s.status IN ('active','superseded') AND s.expires_at>NEW.checked_at)))) BEGIN SELECT RAISE(ABORT,'reservation_lease_expired_before_booking'); END"),
              ]);
              leaseTablesEnsured.add(db);return true;
            })();
            leaseTablesEnsuring.set(db,pending);try{return await pending;}finally{if(leaseTablesEnsuring.get(db)===pending)leaseTablesEnsuring.delete(db);}
          }

          '''.replace('\n          ','\n')
          s=s[:start]+ensure+s[end:]
          start=s.index('export async function cleanupExpiredReservationLeases')
          cleanup=r'''export async function cleanupExpiredReservationLeases(db:Db,now=Date.now()){
            const running=cleanupRunning.get(db);if(running)return running;
            const pending=(async()=>{
              if(!(await ensureSchedulingReservationLeaseGovernance(db)))return{groups:0,reservations:0};
              const hasCanonical=await tableExists(db,"canonical_bookings");
              const reservationConfirmed=hasCanonical?"AND NOT EXISTS (SELECT 1 FROM canonical_bookings b WHERE b.schedule_group_id=r.group_id)":"";
              const expiredLease="((r.lease_expires_at IS NOT NULL AND r.lease_expires_at<=?) OR (r.customer_session_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM platform_identity_sessions s WHERE s.id=r.customer_session_id AND s.status IN ('active','superseded') AND s.expires_at>?)))";
              const candidate=await db.prepare(`SELECT r.group_id FROM scheduling_reservations r WHERE r.status='assigned' AND ${expiredLease} ${reservationConfirmed} LIMIT 1`).bind(now,now).first<Row>();
              if(!candidate)return{groups:0,reservations:0};
              const reason="reservation_lease_expired",hasOffers=await tableExists(db,"provider_assignment_offers");
              const decisionConfirmed=hasCanonical?"AND NOT EXISTS (SELECT 1 FROM canonical_bookings b WHERE b.schedule_group_id=scheduling_assignment_decisions.group_id)":"";
              const offerConfirmed=hasCanonical?"AND NOT EXISTS (SELECT 1 FROM canonical_bookings b WHERE b.schedule_group_id=provider_assignment_offers.group_id)":"";
              const statements=[
                db.prepare(`INSERT OR REPLACE INTO scheduling_reservation_lease_cleanup (group_id,reason,released_at) SELECT DISTINCT r.group_id,?,? FROM scheduling_reservations r WHERE r.status='assigned' AND ${expiredLease} ${reservationConfirmed}`).bind(reason,now,now,now),
                db.prepare(`UPDATE scheduling_reservations AS r SET status='cancelled' WHERE r.status='assigned' ${reservationConfirmed} AND EXISTS (SELECT 1 FROM scheduling_reservation_lease_cleanup c WHERE c.group_id=r.group_id AND c.reason=? AND c.released_at=?)`).bind(reason,now),
                db.prepare(`UPDATE scheduling_assignment_decisions SET status='expired',actor_id='system:reservation-lease-cleanup',reason=?,updated_at=? WHERE status IN ('assigned','awaiting_admin') AND EXISTS (SELECT 1 FROM scheduling_reservation_lease_cleanup c WHERE c.group_id=scheduling_assignment_decisions.group_id AND c.reason=? AND c.released_at=?) ${decisionConfirmed}`).bind(reason,now,reason,now),
              ];
              if(hasOffers)statements.push(db.prepare(`UPDATE provider_assignment_offers SET status='cancelled',responded_at=?,response_reason=?,updated_at=? WHERE status='pending' AND EXISTS (SELECT 1 FROM scheduling_reservation_lease_cleanup c WHERE c.group_id=provider_assignment_offers.group_id AND c.reason=? AND c.released_at=?) ${offerConfirmed}`).bind(now,reason,now,reason,now));
              const result=await db.batch(statements);
              return{groups:Number(result[0]?.meta?.changes||0),reservations:Number(result[1]?.meta?.changes||0)};
            })();
            cleanupRunning.set(db,pending);try{return await pending;}finally{if(cleanupRunning.get(db)===pending)cleanupRunning.delete(db);}
          }
          '''.replace('\n          ','\n')
          s=s[:start]+cleanup
          p.write_text(s)

          # 4) Scheduling hot path: read-first schema, coalesced setup, no no-op roster writes,
          # and direct single-statement mutation result for the common one-occurrence claim.
          p=Path('app/api/uat-scheduling/route.ts')
          s=p.read_text()
          s=replace_once(s,'const schemaDriftRepaired=new WeakSet<object>();\nasync function ensureSchedulingTables(','const schemaDriftRepaired=new WeakSet<object>();\nconst schedulingTablesReady=new WeakMap<object,Promise<void>>();\nasync function ensureSchedulingTablesUncached(','scheduling setup rename')
          old='async function ensureSchedulingTablesUncached(db:Awaited<ReturnType<typeof database>>){await ensureProviderCapacityTables(db);\n  if(!schemaDriftRepaired.has(db)){await repairSchemaDrift(db);schemaDriftRepaired.add(db);}\n  await db.batch(['
          new='async function ensureSchedulingTablesUncached(db:Awaited<ReturnType<typeof database>>){await ensureProviderCapacityTables(db);\n  if(!schemaDriftRepaired.has(db)){await repairSchemaDrift(db);schemaDriftRepaired.add(db);}\n  const required=["scheduling_assignment_decisions","scheduling_rules","scheduling_availability","scheduling_reservations","idx_scheduling_availability_provider_date","idx_scheduling_availability_date_provider_source","idx_scheduling_reservations_provider","idx_scheduling_reservations_city_status_provider_window","idx_scheduling_reservations_group","idx_provider_unavailability_window","idx_scheduling_reservations_attempt"];\n  const existing=await db.prepare(`SELECT name FROM sqlite_master WHERE name IN (${required.map(()=>"?").join(",")})`).bind(...required).all<Record<string,unknown>>();\n  if(new Set(existing.results.map(row=>String(row.name))).size===required.length){await ensureSchedulingReservationLeaseGovernance(db);return;}\n  await db.batch(['
          s=replace_once(s,old,new,'scheduling read-first schema')
          marker=']);await ensureSchedulingReservationLeaseGovernance(db);}\n\nasync function seedUatRoster'
          wrapper=']);await ensureSchedulingReservationLeaseGovernance(db);}\nasync function ensureSchedulingTables(db:Awaited<ReturnType<typeof database>>){const key=db as object;let pending=schedulingTablesReady.get(key);if(!pending){pending=ensureSchedulingTablesUncached(db);schedulingTablesReady.set(key,pending);pending.catch(()=>{if(schedulingTablesReady.get(key)===pending)schedulingTablesReady.delete(key);});}return pending;}\n\nasync function seedUatRoster'
          s=replace_once(s,marker,wrapper,'scheduling setup wrapper')
          old="authoredRows=await db.prepare(\"SELECT provider_id,date FROM scheduling_availability WHERE date>=? AND date<=? AND source IN ('partner_app','operations','roster')\").bind(sorted[0]??\"\",sorted[sorted.length-1]??\"\").all<Record<string,unknown>>();const authored=new Set(authoredRows.results.map(row=>`${String(row.provider_id)}|${String(row.date)}`));"
          new='existingRows=await db.prepare("SELECT provider_id,date,zone_id FROM scheduling_availability WHERE date>=? AND date<=?").bind(sorted[0]??"",sorted[sorted.length-1]??"").all<Record<string,unknown>>();const existing=new Set(existingRows.results.map(row=>`${String(row.provider_id)}|${String(row.date)}|${String(row.zone_id)}`));'
          s=replace_once(s,old,new,'roster existing rows')
          s=replace_once(s,'if(authored.has(`${provider.id}|${date}`))continue;','if(existing.has(`${provider.id}|${date}|${input.zoneId}`))continue;','roster no-op skip')
          s=replace_once(s,'const results=await db.batch(statements);const inserted=results.reduce((sum,result)=>sum+Number(result?.meta?.changes||0),0);','const results=statements.length===1?[await statements[0]!.run()]:await db.batch(statements);const inserted=results.reduce((sum,result)=>sum+Number(result?.meta?.changes||0),0);','single occurrence mutation')
          p.write_text(s)

          # 5) Canonical booking burst: use same fail-fast wrapper and read-first/coalesced schema setup.
          p=Path('app/api/canonical-bookings/route.ts')
          s=p.read_text()
          anchor='import {cityBookingVerdict} from "../../../lib/city-status-authority";'
          if 'import {withRetryingD1Writes}' not in s:
              s=replace_once(s,anchor,anchor+'\nimport {withRetryingD1Writes} from "../../../lib/d1-write-retry";','canonical retry import')
          s=replace_once(s,'async function database(){const {env}=await import("cloudflare:workers");return env.DB;}','async function database(){const {env}=await import("cloudflare:workers");return withRetryingD1Writes(env.DB);}','canonical retry db')
          s=replace_once(s,'async function ensureTables(db:Awaited<ReturnType<typeof database>>){await db.batch([','async function ensureTablesUncached(db:Awaited<ReturnType<typeof database>>){const required=["canonical_customers","canonical_pets","canonical_bookings","provider_work_orders","booking_payments","booking_lifecycle_events","booking_subscription_usage","customer_grooming_subscriptions","grooming_subscription_purchase_snapshots","idx_booking_lifecycle_events_booking","idx_canonical_pets_customer"];const existing=await db.prepare(`SELECT name FROM sqlite_master WHERE name IN (${required.map(()=>"?").join(",")})`).bind(...required).all<Record<string,unknown>>();if(new Set(existing.results.map(row=>String(row.name))).size===required.length)return;await db.batch([','canonical read-first schema')
          marker='\n/*\n * The service-wide window guard'
          wrapper='\nconst canonicalTablesReady=new WeakMap<object,Promise<void>>();\nasync function ensureTables(db:Awaited<ReturnType<typeof database>>){const key=db as object;let pending=canonicalTablesReady.get(key);if(!pending){pending=ensureTablesUncached(db);canonicalTablesReady.set(key,pending);pending.catch(()=>{if(canonicalTablesReady.get(key)===pending)canonicalTablesReady.delete(key);});}return pending;}\n'
          s=replace_once(s,marker,wrapper+marker,'canonical schema wrapper')
          p.write_text(s)

          # Pin behavior in focused tests.
          p=Path('tests/uat-scheduling-d1-contention.test.mjs')
          s=p.read_text()
          s=s.replace('if(attempts<4)','if(attempts<3)',1).replace('assert.equal(attempts,4);','assert.equal(attempts,3);',1).replace('assert.deepEqual(delays,[10,20,40]);','assert.deepEqual(delays,[5,10]);',1)
          s+=r'''

          test("D1 retry policy hard-caps caller retry storms",async()=>{
            let attempts=0;const delays=[];
            await assert.rejects(()=>retry.withD1WriteRetry(async()=>{attempts+=1;const error=new Error("database is busy");error.code="SQLITE_BUSY";throw error;},{attempts:99,baseDelayMs:100,maxDelayMs:1000,maxTotalDelayMs:1000,random:()=>0.999999,sleep:async delay=>{delays.push(delay);}}),error=>retry.isSqliteBusyError(error));
            assert.equal(attempts,3);assert.deepEqual(delays,[50,50]);
          });

          test("Track 3 write paths avoid retry and setup storms",()=>{
            const scheduling=fs.readFileSync(new URL("../app/api/uat-scheduling/route.ts",import.meta.url),"utf8");
            const leases=fs.readFileSync(new URL("../lib/scheduling-reservation-leases.ts",import.meta.url),"utf8");
            const capacity=fs.readFileSync(new URL("../lib/provider-capacity-governance.ts",import.meta.url),"utf8");
            const canonical=fs.readFileSync(new URL("../app/api/canonical-bookings/route.ts",import.meta.url),"utf8");
            assert.match(scheduling,/schedulingTablesReady=new WeakMap/);
            assert.match(scheduling,/SELECT provider_id,date,zone_id FROM scheduling_availability/);
            assert.match(scheduling,/statements\.length===1\?\[await statements\[0\]!\.run\(\)\]/);
            assert.match(scheduling,/ON CONFLICT\(provider_id,scheduled_start,scheduled_end\)/);
            assert.match(leases,/cleanupRunning=new WeakMap/);
            assert.match(leases,/SELECT DISTINCT r\.group_id/);
            assert.doesNotMatch(leases,/for\(const row of rows\.results\)/);
            assert.match(capacity,/capacityDefaultsSeeding=new WeakMap/);
            assert.match(capacity,/SELECT COUNT\(\*\) n FROM provider_capacity_profiles/);
            assert.match(canonical,/withRetryingD1Writes\(env\.DB\)/);
            assert.match(canonical,/canonicalTablesReady=new WeakMap/);
          });
          '''
          p.write_text(s)
          PY
          python3 "$RUNNER_TEMP/remediate.py"
      - name: Focused contention tests
        run: node --experimental-strip-types --test tests/uat-scheduling-d1-contention.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Commit and push application remediation only
        run: |
          set -euo pipefail
          git fetch origin fix/staging-performance-remediation
          test "$(git rev-parse origin/fix/staging-performance-remediation)" = "$GITHUB_SHA"
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add lib/d1-write-retry.ts lib/provider-capacity-governance.ts lib/scheduling-reservation-leases.ts app/api/uat-scheduling/route.ts app/api/canonical-bookings/route.ts tests/uat-scheduling-d1-contention.test.mjs
          git diff --cached --check
          git commit -m "perf(scheduling): bound D1 write contention"
          git push origin HEAD:fix/staging-performance-remediation
          echo "EXPECTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build remediation SHA
        run: npm run build
      - name: Configure isolated staging
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs
      - name: Deploy remediation SHA to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/staging-remediation-secrets.json"; export SECRETS_FILE
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const required=['PAWSPACE_UAT_ACCESS_CODE','PAWSPACE_UAT_SIGNING_KEY','PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT','RAZORPAY_WEBHOOK_SECRET_SANDBOX'];
          const optional=['RAZORPAY_KEY_ID_SANDBOX','RAZORPAY_KEY_SECRET_SANDBOX'];
          const values=Object.fromEntries(required.map(n=>[n,process.env[n]||'']));
          if(Object.values(values).some(v=>!v))throw new Error('required Track 3 staging secret missing');
          for(const n of optional)if(process.env[n])values[n]=process.env[n];
          values.PAWSPACE_STAGING_LIVE_CUSTOMER_OTP='false';
          writeFileSync(process.env.SECRETS_FILE,JSON.stringify(values),{mode:0o600});
          NODE
          npx wrangler deploy --message "staging $EXPECTED_SHA" --secrets-file "$SECRETS_FILE" 2>&1 | tee deployment.txt
      - name: Certify staging isolation and exact SHA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
        run: node tests/e2e/staging-certification.mjs --isolation-only
      - name: Seed deterministic staging identities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p scripts/ops
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-role-seed.mjs > scripts/ops/staging-role-seed.mjs
          node --experimental-strip-types scripts/ops/staging-role-seed.mjs "$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --file="$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --file=scripts/employee-seed.sql
      - name: Verify healthz
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response=await fetch(process.env.STAGING_URL+'/healthz',{signal:AbortSignal.timeout(15000)});
          const text=await response.text();let body=null;try{body=JSON.parse(text)}catch{}
          const evidence={url:process.env.STAGING_URL+'/healthz',status:response.status,ok:response.ok,body};
          fs.writeFileSync('healthz-evidence.json',JSON.stringify(evidence,null,2));console.log(JSON.stringify(evidence,null,2));
          if(response.status!==200||body?.status!=='ok')process.exit(1);
          NODE
      - name: Run hosted Track 3 workload
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          PERF_RUN_ID: remediation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-performance-gate.mjs > scripts/ops/staging-performance-gate.mjs
          node scripts/ops/staging-performance-gate.mjs
      - name: Verify D1 Track 3 invariants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RUN_ID="$(node -e "const r=require('./staging-performance.json');process.stdout.write(r.runId)")"
          SQL="SELECT (SELECT COUNT(*) FROM canonical_bookings WHERE idempotency_key LIKE '${RUN_ID}:booking:%') bookings,(SELECT COUNT(*) FROM booking_payments WHERE booking_id IN (SELECT id FROM canonical_bookings WHERE idempotency_key LIKE '${RUN_ID}:booking:%')) payments,(SELECT COUNT(*) FROM scheduling_assignment_decisions WHERE group_id LIKE '${RUN_ID}:grp:%') assignments,(SELECT COUNT(*) FROM payment_gateway_events WHERE event_id='${RUN_ID}:evt:replay') webhook_events,(SELECT ROUND(COALESCE(SUM(debit),0)-COALESCE(SUM(credit),0),2) FROM finance_journal_entries) ledger_drift;"
          npx wrangler d1 execute pawspace-staging --remote --json --command "$SQL" > staging-performance-d1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const raw=JSON.parse(fs.readFileSync('staging-performance-d1.json','utf8'));const row=(Array.isArray(raw)?raw[0]:raw)?.results?.[0]||{};const n=k=>Number(row[k]??NaN);console.log(JSON.stringify(row,null,2));if(n('bookings')!==100||n('payments')!==100||n('assignments')!==100||n('webhook_events')!==1||Math.abs(n('ledger_drift'))>0.000001)process.exit(1);
          NODE
      - name: Enforce Track 3 thresholds and scan failures
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('staging-performance.json','utf8'));const failures=p.failures||[];const lockOr500=failures.filter(x=>/\b500\b|SQLITE_BUSY|database (?:table )?is locked|cannot start a transaction within a transaction/i.test(String(x.error||'')));const p95=Number(p.metrics?.p95Ms??p.metrics?.p95??NaN);const errorRate=Number(p.metrics?.errorRate??NaN);console.log(JSON.stringify({failureCount:failures.length,lockOr500Failures:lockOr500,p95Ms:p95,errorRate,metrics:p.metrics,counts:p.counts,thresholds:p.thresholds},null,2));if(!Number.isFinite(p95)||p95>=750||!Number.isFinite(errorRate)||errorRate>=0.01||lockOr500.length||failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
