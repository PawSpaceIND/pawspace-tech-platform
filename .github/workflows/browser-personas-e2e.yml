name: Browser E2E (personas, sandbox locked)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type provider-proof-674 to run one Razorpay TEST capture proof'
        required: true
        type: string
      pr674_candidate_sha:
        description: 'Exact current PR674 candidate SHA'
        required: true
        type: string
      pr674_worker_name:
        description: 'Exact isolated checkout Worker name for that candidate'
        required: true
        type: string
      pr674_worker_origin:
        description: 'Exact https workers.dev origin for that Worker'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: browser-personas-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-personas:
    name: Browser E2E personas
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      APP_ENV: staging
      FORBID_PRODUCTION: 'true'
      PAWSPACE_LOCAL_PREVIEW: 'on'
      PAWSPACE_VOICE_TRANSPORT: local_simulator_non_production
      PAWSPACE_SCHEDULING_ENV: uat
      PAWSPACE_MEDIA_ENV: uat
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Configure server-side UAT Maps for local checkout
        env:
          GOOGLE_MAPS_SERVER_API_KEY_UAT: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY_UAT }}
        run: |
          python3 - <<'PYMAPS'
          import json, os, secrets
          from pathlib import Path
          key = os.environ.get("GOOGLE_MAPS_SERVER_API_KEY_UAT", "").strip()
          if not key:
              raise SystemExit("Customer checkout requires the Google Maps UAT repository secret.")
          access_code = secrets.token_hex(24)
          signing_key = secrets.token_hex(32)
          print("::add-mask::" + access_code)
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write("PW_STAFF_UAT_ACCESS_CODE=" + access_code + "\n")
          bindings = {
              "PAWSPACE_UAT_LOGIN": "on",
              "PAWSPACE_UAT_ACCESS_CODE": access_code,
              "PAWSPACE_UAT_SIGNING_KEY": signing_key,
              "GOOGLE_MAPS_SERVER_API_KEY_UAT": key,
              "PAWSPACE_MAPS_ENV": "sandbox",
              "PAWSPACE_DEPLOYMENT_ENV": "e2e",
              "PAWSPACE_LOCAL_PREVIEW": "on",
              "PAWSPACE_SCHEDULING_ENV": "uat",
              "PAWSPACE_MEDIA_ENV": "uat",
              "PAWSPACE_VOICE_TRANSPORT": "local_simulator_non_production",
              "PAWSPACE_PAYMENT_ENV": "sandbox",
              "PAWSPACE_PAYMENT_LIVE_APPROVED": "false",
              "NODE_ENV": "test",
              "APP_ENV": "staging",
              "FORBID_PRODUCTION": "true",
          }
          target = Path(".dev.vars")
          with target.open("x") as handle:
              os.chmod(target, 0o600)
              handle.write("".join(name + "=" + json.dumps(value) + "\n" for name, value in bindings.items()))
          PYMAPS
      - name: Run sandbox-locked desktop and Pixel 7 persona certification
        if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name != 'uat/pr674-provider-webhook-proof-7310-20260911' }}
        run: npm run test:e2e-personas
      - name: Run PR674 Razorpay Test capture + provider-webhook proof (temporary DO NOT MERGE)
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'uat/pr674-provider-webhook-proof-7310-20260911' && inputs.confirm == 'provider-proof-674' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          PR674_CANDIDATE_SHA: ${{ inputs.pr674_candidate_sha }}
          PR674_WORKER_NAME: ${{ inputs.pr674_worker_name }}
          PR674_WORKER_ORIGIN: ${{ inputs.pr674_worker_origin }}
          PW_BASE_URL: ${{ inputs.pr674_worker_origin }}
        run: npx playwright test e2e/pr674-provider-webhook-proof.spec.ts --project=chromium --retries=0
      - name: Remove local secret bindings
        if: always()
        run: rm -f .dev.vars
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-persona-e2e-evidence
          path: |
            playwright-report/
            test-results/
            /tmp/wrangler-e2e.log
          if-no-files-found: warn

  razorpay-sandbox:
    name: Razorpay sandbox safety and provider check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
      FORBID_PRODUCTION: 'true'
      RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
      RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
      RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
      # This requested lane creates a test order only; no refund has been authorized.
      RAZORPAY_SANDBOX_PAYMENT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Prove live keys are rejected before any provider request
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output=$(RAZORPAY_KEY_ID_SANDBOX=rzp_live_forbidden RAZORPAY_KEY_SECRET_SANDBOX=not-a-secret node scripts/e2e/razorpay-sandbox.mjs 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q 'requires an rzp_test_ key id'
          if printf '%s\n' "$output" | grep -q 'not-a-secret'; then
            echo 'Sandbox harness leaked the credential value.'
            exit 1
          fi
          echo 'PASS live-key rejection and secret redaction guard'
      - name: Run real Razorpay sandbox order probe or report blocked prerequisites
        shell: bash
        run: |
          set -euo pipefail
          npm run test:razorpay:sandbox
