name: Pencils-down Wallet + Razorpay Golden candidate
on:
  push:
    branches: [ops/pencils-down-staging-ab40dc00]
    paths: [.github/workflows/pencils-down-golden-wallet.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pawspace-golden-wallet-23f2ff7a
  cancel-in-progress: false
jobs:
  certify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: pawspace-release-preview
    env:
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
      FORBID_PRODUCTION: 'true'
      APP_ENV: staging
      CI: 'true'
    steps:
      - name: Checkout deployment guardrails
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: infra
          persist-credentials: false
      - name: Checkout exact Wallet+Razorpay candidate
        uses: actions/checkout@v4
        with:
          ref: 23f2ff7a31acbae5bb03c0ddb84f58160e7d14a8
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retarget proven isolated deploy guard to exact candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          script=Path('infra/ops/pencils-down/deploy_golden.py')
          text=script.read_text()
          replacements={
            "8745bbca5e76185b65ca7c0a7fd4bda60acf35e6":"23f2ff7a31acbae5bb03c0ddb84f58160e7d14a8",
            "321312aec6e2a96060496bdf4401d41cf024e40d":"cec814df936f64bbb1aa84a942bfbba2ca50fe9d",
            "pawspace-beta-golden-8745bbca":"pawspace-beta-golden-wallet-23f2ff7a",
            "pawspace-golden-8745bbca":"pawspace-golden-wallet-23f2ff7a",
          }
          for old,new in replacements.items():
            if old not in text: raise SystemExit('expected deploy guard token missing: '+old)
            text=text.replace(old,new)
          fixture_needle="    'PAWSPACE_STAGING_LIVE_CUSTOMER_OTP':'false',"
          if fixture_needle not in text: raise SystemExit('expected sandbox fixture insertion point missing')
          text=text.replace(fixture_needle,"    'PAWSPACE_TEST_SERVICE_DISCOVERY_FIXTURE':'on',\n"+fixture_needle,1)
          script.write_text(text)
          manifest=Path('infra/ops/pencils-down/payment-ui-source-manifest.json')
          data=json.loads(manifest.read_text())
          data['candidate']='23f2ff7a31acbae5bb03c0ddb84f58160e7d14a8'
          data['tree']='cec814df936f64bbb1aa84a942bfbba2ca50fe9d'
          data['payment_ui_wiring']='customer Wallet redemption -> Wallet-adjusted billing projection -> exact due-now -> /api/payment-order -> Razorpay Test checkout; webhook remains authoritative'
          manifest.write_text(json.dumps(data,indent=2)+'\n')
          print('Ephemeral deploy guard retargeted; repository product source unchanged.')
          PY
      - name: Generate isolated session signing keys
        id: keys
        run: |
          python - <<'PY'
          import os,secrets
          for name in ('signing','identity'):
            value=secrets.token_hex(32); print('::add-mask::'+value)
            with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(name+'='+value+'\n')
          PY
      - name: Preflight unused test namespace
        env: &golden_env
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ steps.keys.outputs.signing }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ steps.keys.outputs.identity }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          GOOGLE_MAPS_SERVER_API_KEY_UAT: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY_UAT }}
        run: python infra/ops/pencils-down/deploy_golden.py preflight
      - name: Install locked dependencies
        working-directory: candidate
        run: npm run install:ci
      - name: Focused Wallet, payment and native checks
        working-directory: candidate
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          tests/customer-payment-ui-wiring.test.mjs
          tests/customer-billing.test.mjs
          tests/beta-credit-parity.test.mjs
          tests/payment-order-cross-customer-runtime.test.mjs
          tests/mobile-native-ecosystem.test.mjs
      - name: Full typecheck
        working-directory: candidate
        run: npm run typecheck
      - name: Full build
        working-directory: candidate
        run: npm run build
      - name: Deploy fresh isolated Golden Worker and D1
        id: deploy
        env: *golden_env
        run: python infra/ops/pencils-down/deploy_golden.py deploy
      - name: Authenticate to UAT then verify Maps server adapter
        env:
          ORIGIN: ${{ steps.deploy.outputs.origin }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          python - <<'PY'
          import json,os,urllib.parse,urllib.request,http.cookiejar
          origin=os.environ['ORIGIN']; jar=http.cookiejar.CookieJar(); opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          login=json.dumps({'code':os.environ['PAWSPACE_UAT_ACCESS_CODE'],'email':'founder@pawspace.in'}).encode()
          req=urllib.request.Request(origin+'/api/staging-login',data=login,headers={'content-type':'application/json'},method='POST')
          with opener.open(req,timeout=30) as r: assert r.status==200
          url=origin+'/api/address-autocomplete?'+urllib.parse.urlencode({'mode':'search','query':'Indiranagar Bengaluru','sessionToken':'golden-wallet-preflight'})
          with opener.open(url,timeout=30) as r: data=json.load(r)
          assert data.get('data',{}).get('status')=='configured', data
          assert data['data'].get('suggestions'), data
          print('Authenticated Maps UAT lookup passed; no booking/payment mutation executed.')
          PY
      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-wallet-deployment-evidence
          path: pencils-down-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Golden Wallet URL
        if: success()
        run: echo "GOLDEN_WALLET_ORIGIN=${{ steps.deploy.outputs.origin }}"