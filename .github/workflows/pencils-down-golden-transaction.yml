name: Execute Wallet + Razorpay same-booking Golden transaction
on:
  push:
    branches: [ops/pencils-down-staging-ab40dc00]
    paths: [.github/workflows/pencils-down-golden-transaction.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pawspace-release-preview
    env:
      ORIGIN: https://pawspace-beta-golden-wallet-3218c3.karthik-fce.workers.dev
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
      FORBID_PRODUCTION: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3218c383ef3afd947847b87b7319600e359e4f9e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Install matching Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Run hosted customer booking, Wallet and Razorpay Test checkout
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          cat > golden.mjs <<'NODE'
          import fs from 'node:fs';
          import {chromium,request} from 'playwright';
          const ORIGIN=process.env.ORIGIN, evidence='golden-transaction-evidence';fs.mkdirSync(evidence,{recursive:true});
          const report={candidate:'3218c383ef3afd947847b87b7319600e359e4f9e',origin:ORIGIN,testOnly:true,productionChanged:false,steps:[],payment:{providerDelivered:false}};
          const save=()=>fs.writeFileSync(`${evidence}/report.json`,JSON.stringify(report,null,2)+'\n');
          const step=(name,detail={})=>{report.steps.push({name,ok:true,...detail});save();console.log('PASS',name,JSON.stringify(detail));};
          async function staff(email){const api=await request.newContext({baseURL:ORIGIN});const r=await api.post('/api/staging-login',{data:{code:process.env.PAWSPACE_UAT_ACCESS_CODE,email}});if(!r.ok())throw new Error(`staff login ${email} HTTP ${r.status()}: ${await r.text()}`);return api;}
          const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:390,height:844}});const page=await context.newPage();
          page.on('pageerror',e=>{report.browserErrors??=[];report.browserErrors.push(String(e));save();});
          try{
            const gate=await context.request.post(`${ORIGIN}/api/staging-login`,{data:{code:process.env.PAWSPACE_UAT_ACCESS_CODE,email:'founder@pawspace.in'}});if(!gate.ok())throw new Error(`UAT gate ${gate.status()}: ${await gate.text()}`);step('UAT access gate');
            await page.goto(`${ORIGIN}/mobile-app`,{waitUntil:'domcontentloaded',timeout:60000});
            const services=page.getByRole('region',{name:'Care services'});const browse=page.getByRole('button',{name:'Browse without location',exact:true});await services.or(browse).waitFor({state:'visible',timeout:30000});if(await browse.isVisible().catch(()=>false))await browse.click();
            const account=page.locator('nav').getByRole('button',{name:/account/i}).last();await account.click();await page.getByPlaceholder('10-digit phone number').fill('9000000927');await page.getByRole('button',{name:'Send OTP'}).click();
            const sandbox=page.getByText(/Sandbox code \(no real SMS yet\):/i);await sandbox.waitFor({state:'visible',timeout:20000});const code=(await sandbox.textContent())?.match(/\b(\d{6})\b/)?.[1];if(!code)throw new Error('sandbox OTP missing');await page.getByPlaceholder('6-digit code').fill(code);const name=page.getByPlaceholder('Your name (first time only)');if(await name.isVisible().catch(()=>false))await name.fill('Golden Wallet Customer');await page.getByRole('button',{name:'Verify & continue'}).click();await page.getByPlaceholder('6-digit code').waitFor({state:'hidden',timeout:20000});
            const acct=await context.request.get(`${ORIGIN}/api/customer-account`);if(!acct.ok())throw new Error(`customer account ${acct.status()}`);let body=await acct.json();const customerId=body.data.customerId;report.customerId=customerId;step('Customer sandbox OTP',{customerId});
            if(!body.data.pets?.length){const pet=await context.request.post(`${ORIGIN}/api/customer-account`,{data:{action:'upsert_pet',idempotencyKey:`golden-pet:${customerId}`,pet:{name:'Golden Bruno',species:'dog',breed:'Labrador Retriever',vaccinationStatus:'not_provided'}}});if(!pet.ok())throw new Error(`pet create ${pet.status()}: ${await pet.text()}`);}step('Customer-owned pet ready');
            await page.goto(`${ORIGIN}/mobile-app`,{waitUntil:'domcontentloaded'});await page.locator('nav').getByRole('button',{name:/home/i}).last().click();const grooming=page.getByRole('region',{name:'Care services'}).getByRole('article').filter({hasText:'Grooming'}).first();await grooming.getByRole('button',{name:/book now/i}).click();await page.getByText('Who needs grooming?',{exact:false}).waitFor();
            const choose=page.getByRole('button',{name:/Choose a package/i});if(await choose.isDisabled()){await page.getByText('Golden Bruno',{exact:true}).first().click();}await choose.click();await page.getByText(/Essential Bath|Bath & Basic|Complete Makeover|Just Trim/i).first().waitFor();await page.getByRole('button',{name:'Choose address and requested time',exact:true}).click();
            await page.getByLabel('Complete doorstep address',{exact:true}).fill('42, Indiranagar Double Road, Stage 2, Hoysala Nagar, Indiranagar, Bengaluru');await page.getByLabel('Pincode',{exact:true}).fill('560038');await page.getByRole('button',{name:'Verify map',exact:true}).click();const matches=page.getByRole('region',{name:'Matching map addresses',exact:true});await matches.waitFor({state:'visible',timeout:30000});await matches.getByRole('button').first().click();await page.getByText('Verified service doorstep',{exact:true}).waitFor({timeout:30000});
            const dateButtons=page.locator('button[aria-pressed]').filter({hasText:/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun),/});let picked=false;for(let i=0;i<await dateButtons.count();i++){const b=dateButtons.nth(i);if(await b.isEnabled()){await b.click();picked=true;break;}}if(!picked)throw new Error('No date button available');const slot=page.getByRole('button',{name:/11:00 AM–1:00 PM/}).first();if(await slot.count())await slot.click();else await page.locator('button').filter({hasText:/AM|PM/}).first().click();await page.getByRole('button',{name:'Review booking',exact:true}).click();await page.getByText('Review and confirm',{exact:true}).waitFor();await page.getByRole('button',{name:'Pay online',exact:true}).click();
            const created=page.waitForResponse(r=>r.url().includes('/api/canonical-bookings')&&r.request().method()==='POST',{timeout:60000});await page.getByRole('button',{name:'Confirm booking',exact:true}).click();const cr=await created;if(cr.status()!==201)throw new Error(`booking ${cr.status()}: ${await cr.text()}`);const cb=await cr.json();const bookingId=String(cb.data?.bookingId||'');if(!bookingId)throw new Error('booking id missing');report.bookingId=bookingId;await page.getByText(`BOOKING CONFIRMED · ${bookingId}`,{exact:true}).waitFor({timeout:30000});step('Hosted Grooming booking created',{bookingId});
            const billingBefore=await context.request.get(`${ORIGIN}/api/customer-billing`);const bill0=await billingBefore.json();const payment0=bill0.data.payments.find(p=>String(p.booking_id)===bookingId);if(!payment0)throw new Error('booking payment missing');const originalDue=Number(payment0.amount_due_now);report.payment.originalDueRupees=originalDue;step('Canonical payment before Wallet',{originalDue});
            const maker=await staff('anjali.finance33@tkpetcare.in');const requestCredit=await maker.post('/api/pawspace-wallet',{data:{action:'credit',customerId,amount:454.55,source:'goodwill',sourceId:bookingId,idempotencyKey:`golden-wallet:${bookingId}`,note:'Golden Test only: exact ₹500 applied value'}});const requestBody=await requestCredit.json();if(requestCredit.status()!==202)throw new Error(`wallet maker ${requestCredit.status()}: ${JSON.stringify(requestBody)}`);const requestId=requestBody.data?.id;if(!requestId)throw new Error('wallet request id missing');await maker.dispose();
            const checker=await staff('founder@pawspace.in');const approve=await checker.post('/api/pawspace-wallet',{data:{action:'credit',requestId}});const approveBody=await approve.json();if(!approve.ok())throw new Error(`wallet checker ${approve.status()}: ${JSON.stringify(approveBody)}`);await checker.dispose();step('Wallet maker/checker credit',{requestId,credited:454.55});
            await page.locator('nav').getByRole('button',{name:/account/i}).last().click();const billingPanel=page.getByText('Payments & invoice summaries',{exact:true});await billingPanel.click();const bookingRecord=page.locator('article').filter({hasText:bookingId});await bookingRecord.waitFor({state:'visible',timeout:30000});await bookingRecord.getByRole('button',{name:'Apply PawSpace Wallet'}).click();await page.getByRole('status').filter({hasText:'Wallet applied'}).waitFor({timeout:30000});
            const billingAfter=await context.request.get(`${ORIGIN}/api/customer-billing`);const bill1=await billingAfter.json();const payment1=bill1.data.payments.find(p=>String(p.booking_id)===bookingId);const dueAfter=Number(payment1.amount_due_now);report.payment.dueAfterWalletRupees=dueAfter;report.payment.walletReductionRupees=Math.round((originalDue-dueAfter)*100)/100;if(report.payment.walletReductionRupees!==500)throw new Error(`Wallet reduction ${report.payment.walletReductionRupees}, expected 500`);step('Customer UI Wallet reduced due-now exactly ₹500',{originalDue,dueAfter});
            let orderPayload;page.on('response',async r=>{if(r.url().endsWith('/api/payment-order')&&r.request().method()==='POST'){try{orderPayload=await r.json();}catch{}}});
            await bookingRecord.getByRole('button',{name:'Pay securely (Test)'}).click();const deadline=Date.now()+30000;while(!orderPayload&&Date.now()<deadline)await page.waitForTimeout(100);if(!orderPayload?.data?.orderId)throw new Error('Razorpay payment-order payload not observed');report.payment.orderId=orderPayload.data.orderId;report.payment.amountPaise=orderPayload.data.amountPaise;if(Number(orderPayload.data.amountPaise)!==Math.round(dueAfter*100))throw new Error('Razorpay order amount does not match reduced due-now');step('Real Razorpay Test order created',{orderId:report.payment.orderId,amountPaise:report.payment.amountPaise});
            await page.screenshot({path:`${evidence}/razorpay-open.png`,fullPage:true});
            const frames=page.frames();report.checkoutFrames=frames.map(f=>f.url());save();
            let checkoutFrame=frames.find(f=>/razorpay|checkout/i.test(f.url())&&f!==page.mainFrame());if(!checkoutFrame){await page.waitForTimeout(3000);checkoutFrame=page.frames().find(f=>/razorpay|checkout/i.test(f.url())&&f!==page.mainFrame());}
            if(!checkoutFrame)throw new Error('Razorpay checkout frame not found');
            const upi=checkoutFrame.getByText(/UPI/i).first();if(await upi.isVisible().catch(()=>false))await upi.click();
            let vpaInput=checkoutFrame.getByPlaceholder(/UPI|VPA/i).first();if(!(await vpaInput.count()))vpaInput=checkoutFrame.locator('input').first();await vpaInput.fill('success@razorpay');const payButton=checkoutFrame.getByRole('button',{name:/Pay|Proceed|Continue/i}).last();await payButton.click();
            await page.waitForTimeout(8000);await page.screenshot({path:`${evidence}/razorpay-after-submit.png`,fullPage:true});step('Razorpay Test checkout submitted',{method:'UPI test VPA'});
          } catch(error){report.failure=error instanceof Error?error.message:String(error);save();try{await page.screenshot({path:`${evidence}/failure.png`,fullPage:true});}catch{};console.error(error);process.exitCode=1;} finally{save();await browser.close();}
          NODE
          node golden.mjs
      - name: Upload transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-customer-wallet-razorpay
          path: golden-transaction-evidence/
          if-no-files-found: error
          retention-days: 7