name: Browser E2E (hardened, preview superuser disabled)

# Runs the seeded Playwright journeys against a locally served build (vinext build ->
# wrangler dev --local, Miniflare D1). No Cloudflare credentials are needed: Miniflare creates a
# local SQLite D1, so this works on any runner.
#
# scripts/e2e/run-hardened.sh is the single local/CI entry point. It owns every server start/stop,
# seeds only while Miniflare is stopped, waits for the port to close before restarting, and keeps
# Wrangler's internal diagnostics for transient workerd/Miniflare crashes.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Seeded browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      E2E_PORT: "8788"
      E2E_BASE_URL: http://127.0.0.1:8788
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: "false"
      WRANGLER_LOG_PATH: /tmp/wrangler-e2e.log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the app
        run: npm run build

      - name: Run hardened seeded browser journeys
        env:
          E2E_SKIP_BUILD: "1"
        run: npm run test:e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: |
            test-results/
            /tmp/serve.log
            /tmp/wrangler-e2e.log
          if-no-files-found: ignore
          retention-days: 7
