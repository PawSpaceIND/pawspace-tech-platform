name: P0 Meta Webhook Gateway Closure

on:
  push:
    branches:
      - remediation/p0-pilot-gates-b379631
    paths:
      - .github/workflows/p0-meta-webhook-gateway-closure.yml

permissions:
  contents: write

jobs:
  close-meta-webhook:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    concurrency: pawspace-staging-deploy
    timeout-minutes: 45
    env:
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
      CALLBACK_URL: https://pawspace-staging.karthik-fce.workers.dev/api/whatsapp/meta-webhook
      WRANGLER_CONFIG: dist/server/wrangler.json
      P0_PROVIDER_EVIDENCE: p0-provider-evidence.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backport only the vetted Meta webhook gateway exemption
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const gatewayPath='lib/api-gateway.ts';
          let gateway=readFileSync(gatewayPath,'utf8');
          const old='||url.pathname==="/api/whatsapp-uat-webhook"||url.pathname==="/api/identity-session"';
          const next='||url.pathname==="/api/whatsapp-uat-webhook"||url.pathname==="/api/whatsapp/meta-webhook"||url.pathname==="/api/identity-session"';
          if(!gateway.includes(next)){
            if(!gateway.includes(old)) throw new Error('Expected gateway callback list shape not found; refusing broad rewrite');
            gateway=gateway.replace(old,next);
            writeFileSync(gatewayPath,gateway);
          }
          const testPath='tests/external-webhook-reachability.test.mjs';
          let test=readFileSync(testPath,'utf8');
          const marker='test("Meta WhatsApp webhook is gateway-reachable and retains provider verification"';
          if(!test.includes(marker)){
            test += `\n\ntest("Meta WhatsApp webhook is gateway-reachable and retains provider verification", () => {\n  assert.match(gateway, /url\\.pathname==="\\/api\\/whatsapp\\/meta-webhook"/);\n  const source = read("app/api/whatsapp/meta-webhook/route.ts");\n  assert.match(source, /META_WHATSAPP_VERIFY_TOKEN/);\n  assert.match(source, /META_WHATSAPP_APP_SECRET/);\n  assert.match(source, /x-hub-signature-256/);\n  assert.match(source, /verifyMetaWhatsAppSignature/);\n});\n`;
            writeFileSync(testPath,test);
          }
          NODE
          git diff --check
          git diff -- lib/api-gateway.ts tests/external-webhook-reachability.test.mjs

      - name: Run focused external-webhook security guard
        run: node --experimental-strip-types --test tests/external-webhook-reachability.test.mjs

      - name: Commit the isolated backport to the remediation branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PawSpace Release Bot'
          git config user.email 'release-bot@pawspace.in'
          git add lib/api-gateway.ts tests/external-webhook-reachability.test.mjs
          if git diff --cached --quiet; then
            echo 'Gateway backport already present.'
          else
            git commit -m 'fix(whatsapp): expose Meta webhook through staging gateway'
            git push origin HEAD:remediation/p0-pilot-gates-b379631
          fi
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "uat_candidate_sha=$SHA"

      - name: Install and build UAT candidate
        run: |
          set -euo pipefail
          npm run install:ci
          npm run build

      - name: Configure staging and preserve existing non-secret bindings
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UAT_PHONE_ID: ${{ vars.META_WHATSAPP_PHONE_NUMBER_ID_UAT }}
          UAT_WABA_ID: ${{ vars.META_WHATSAPP_WABA_ID_UAT }}
          UAT_TEMPLATE_ALLOWLIST: ${{ vars.META_WHATSAPP_TEMPLATE_ALLOWLIST }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$STAGING_D1_ID" ] || { echo 'STAGING_D1_ID is required.' >&2; exit 1; }
          if [ -n "${PRODUCTION_D1_ID:-}" ] && [ "$STAGING_D1_ID" = "$PRODUCTION_D1_ID" ]; then echo 'Staging D1 equals production D1; refusing.' >&2; exit 1; fi
          [ -n "$UAT_PHONE_ID" ] && [ -n "$UAT_WABA_ID" ] && [ -n "$UAT_TEMPLATE_ALLOWLIST" ] || { echo 'Meta UAT identifiers are missing.' >&2; exit 1; }
          node scripts/stage-config.mjs
          SETTINGS="$RUNNER_TEMP/p0-staging-settings.json"; export SETTINGS
          trap 'rm -f "$SETTINGS"' EXIT
          HTTP="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pawspace-staging/settings")"
          [ "$HTTP" = "200" ] || { echo 'Unable to snapshot existing staging Worker settings.' >&2; exit 1; }
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const settings=JSON.parse(readFileSync(process.env.SETTINGS,'utf8'));
          const bindings=Array.isArray(settings?.result?.bindings)?settings.result.bindings:[];
          const remote={};
          for(const b of bindings){ if(b?.type==='plain_text'){ const n=String(b.name||''); if(/^[A-Z0-9_]+$/.test(n)) remote[n]=String(b.text??b.value??''); } }
          const cfg=JSON.parse(readFileSync(process.env.WRANGLER_CONFIG,'utf8'));
          if(cfg.name!=='pawspace-staging') throw new Error('Refusing non-staging Worker target');
          cfg.vars={...remote,...(cfg.vars||{}),META_WHATSAPP_PHONE_NUMBER_ID:String(process.env.UAT_PHONE_ID||''),META_WHATSAPP_WABA_ID:String(process.env.UAT_WABA_ID||''),META_WHATSAPP_TEMPLATE_ALLOWLIST:String(process.env.UAT_TEMPLATE_ALLOWLIST||''),PAWSPACE_PRODUCTION_ENFORCE:'false'};
          cfg.keep_vars=true;
          if(bindings.some(b=>String(b?.name||'')==='AI'&&/ai/i.test(String(b?.type||'')))) cfg.ai={binding:'AI'};
          writeFileSync(process.env.WRANGLER_CONFIG,JSON.stringify(cfg,null,2),{mode:0o600});
          NODE

      - name: Deploy only to pawspace-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UAT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/p0-meta-deploy.log"
          trap 'rm -f "$LOG"' EXIT
          npx wrangler deploy --config "$WRANGLER_CONFIG" --keep-vars --message "staging $UAT_SHA meta-webhook-gateway" > "$LOG" 2>&1
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$LOG" | tail -n 1 || true)"
          [ "$URL" = "$STAGING_URL" ] || { echo 'Unexpected Worker origin; deploy output withheld.' >&2; exit 1; }
          echo 'Staging-only deployment completed.'

      - name: Synchronize Meta UAT secrets and fresh webhook verify token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
          META_WHATSAPP_APP_SECRET: ${{ secrets.META_WHATSAPP_APP_SECRET_UAT || secrets.META_WHATSAPP_APP_SECRET }}
          META_WHATSAPP_UAT_ALLOWLIST: ${{ secrets.META_WHATSAPP_UAT_ALLOWLIST }}
        shell: bash
        run: |
          set -euo pipefail
          for name in META_WHATSAPP_UAT_ACCESS_TOKEN META_WHATSAPP_APP_SECRET META_WHATSAPP_UAT_ALLOWLIST; do
            [ -n "${!name:-}" ] || { echo "$name is missing." >&2; exit 1; }
            printf '%s' "${!name}" | npx wrangler secret put "$name" --name pawspace-staging >/dev/null
          done
          VERIFY_TOKEN="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$VERIFY_TOKEN"
          echo "UAT_VERIFY_TOKEN=$VERIFY_TOKEN" >> "$GITHUB_ENV"
          printf '%s' "$VERIFY_TOKEN" | npx wrangler secret put META_WHATSAPP_VERIFY_TOKEN --name pawspace-staging >/dev/null
          echo 'Meta UAT Worker secrets synchronized; values withheld.'

      - name: Subscribe UAT WABA to the staging Meta callback
        env:
          META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
          UAT_WABA_ID: ${{ vars.META_WHATSAPP_WABA_ID_UAT }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=String(process.env.META_WHATSAPP_UAT_ACCESS_TOKEN||'').trim();
          const waba=String(process.env.UAT_WABA_ID||'').trim();
          const callback=String(process.env.CALLBACK_URL||'').trim();
          const verify=String(process.env.UAT_VERIFY_TOKEN||'').trim();
          if(!token||!waba||!callback||!verify) throw new Error('Required UAT subscription inputs unavailable');
          const params=new URLSearchParams({override_callback_uri:callback,verify_token:verify});
          const response=await fetch(`https://graph.facebook.com/v23.0/${encodeURIComponent(waba)}/subscribed_apps`,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/x-www-form-urlencoded'},body:params,signal:AbortSignal.timeout(30000)});
          let body={}; try{body=await response.json()}catch{}
          if(!response.ok){const e=body?.error||{};throw new Error(`Meta WABA subscription HTTP ${response.status} code=${Number(e.code||0)} subcode=${Number(e.error_subcode||0)}`);}
          if(body?.success!==true) throw new Error('Meta did not confirm WABA subscription update');
          const check=await fetch(`https://graph.facebook.com/v23.0/${encodeURIComponent(waba)}/subscribed_apps`,{headers:{authorization:`Bearer ${token}`},signal:AbortSignal.timeout(30000)});
          const checkBody=await check.json(); if(!check.ok) throw new Error(`Meta WABA subscription query HTTP ${check.status}`);
          const rows=Array.isArray(checkBody?.data)?checkBody.data:[];
          if(!rows.length) throw new Error('No subscribed app is visible for the UAT WABA after update');
          console.log(`meta_waba_subscription=confirmed subscribed_app_count=${rows.length}`);
          NODE

      - name: Verify staging gateway reaches the Meta signature verifier
        shell: bash
        run: |
          set -euo pipefail
          GET_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/get-body" --write-out '%{http_code}' "$CALLBACK_URL")"
          [ "$GET_CODE" = "403" ] || { echo "Unsigned verification GET returned HTTP=$GET_CODE, expected 403." >&2; exit 1; }
          POST_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/post-body" --write-out '%{http_code}' -X POST -H 'content-type: application/json' -H 'x-hub-signature-256: sha256=invalid' --data '{}' "$CALLBACK_URL")"
          [ "$POST_CODE" = "401" ] || { echo "Invalid-signature POST returned HTTP=$POST_CODE, expected 401." >&2; exit 1; }
          if grep -q 'sign_in_required' "$RUNNER_TEMP/post-body"; then echo 'Staging login still intercepts the Meta webhook.' >&2; exit 1; fi
          if ! grep -qi 'Invalid Meta webhook signature' "$RUNNER_TEMP/post-body"; then echo 'POST did not reach the Meta signature verifier.' >&2; exit 1; fi
          rm -f "$RUNNER_TEMP/get-body" "$RUNNER_TEMP/post-body"
          echo 'Meta webhook bypasses staging login and remains signature-gated.'

      - name: Execute hosted provider certification
        env:
          P0_STAGING_BASE_URL: ${{ env.STAGING_URL }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
          META_WHATSAPP_APP_SECRET: ${{ secrets.META_WHATSAPP_APP_SECRET_UAT || secrets.META_WHATSAPP_APP_SECRET }}
          META_WHATSAPP_UAT_ALLOWLIST: ${{ secrets.META_WHATSAPP_UAT_ALLOWLIST }}
          META_WHATSAPP_PHONE_NUMBER_ID: ${{ vars.META_WHATSAPP_PHONE_NUMBER_ID_UAT }}
          META_WHATSAPP_WABA_ID: ${{ vars.META_WHATSAPP_WABA_ID_UAT }}
          META_WHATSAPP_TEMPLATE_ALLOWLIST: ${{ vars.META_WHATSAPP_TEMPLATE_ALLOWLIST }}
          META_WHATSAPP_GRAPH_VERSION: v23.0
          GOOGLE_MAPS_SERVER_API_KEY_UAT: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY_UAT }}
        run: node scripts/p0-hosted-provider-sandbox.mjs

      - name: Upload final Meta/provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-meta-webhook-closure-${{ steps.commit.outputs.sha }}
          path: p0-provider-evidence.json
          if-no-files-found: warn
