name: Seed staging D1

# One-shot manual loader for the STAGING staff/UAT seed data. Manual only (workflow_dispatch) — never
# auto-runs, never touches production. It runs `wrangler d1 execute --remote` on the GitHub runner using
# the same repository secrets the deploy uses, so no credential is ever pasted into a chat, a log, or a
# developer's shell. Idempotent: every seed is INSERT OR IGNORE, so re-running is safe.
#
# Why this exists: UAT sign-in (lib/uat-staging-auth.ts) refuses any email that is not an ACTIVE
# app_users row, and the staff identities the /staging-login page advertises live in
# scripts/employee-seed.sql. Without loading it, no advertised staff identity — including Founder — can
# sign in. This workflow loads that staff directory (and, when asked, the module-demo and customer packs).
#
# Required repo config (already set for the deploy):
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "staging" to confirm seeding the isolated staging D1'
        required: true
        default: ''
      include_customer_pack:
        description: 'Also load the 220-customer pack (staging-seed.sql)'
        type: boolean
        default: false
      include_demo_pack:
        description: 'Also load the module-demo pack (uat-demo-seed.sql)'
        type: boolean
        default: false

jobs:
  seed:
    if: ${{ github.event.inputs.confirm == 'staging' }}
    runs-on: ubuntu-latest
    concurrency: pawspace-staging-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm run install:ci
      - name: Load staff directory (employee-seed.sql)
        # The staff sign-in identities the tester guide lists. Loaded first because the module-demo pack
        # references some of them.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute pawspace-staging --remote --file=scripts/employee-seed.sql
      - name: Load customer pack (staging-seed.sql)
        if: ${{ github.event.inputs.include_customer_pack == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute pawspace-staging --remote --file=scripts/staging-seed.sql
      - name: Load module-demo pack (uat-demo-seed.sql)
        if: ${{ github.event.inputs.include_demo_pack == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute pawspace-staging --remote --file=scripts/uat-demo-seed.sql
      - name: Done
        run: echo "Staging D1 seeded. Sign in at /staging-login with the seeded staff identities in docs/UAT-TESTER-GUIDE.md."
