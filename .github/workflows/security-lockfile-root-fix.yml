name: Security lockfile root fixer

on:
  push:
    branches:
      - security/auth-otp-hardening

permissions:
  contents: write

jobs:
  fix-lock-root:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/auth-otp-hardening
      - name: Add explicit Zod root declaration only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const source = fs.readFileSync(path, 'utf8');
          const before = '        "recharts": "^3.10.1"\n';
          const after = '        "recharts": "^3.10.1",\n        "zod": "4.4.3"\n';
          if (source.includes(after)) process.exit(0);
          const matches = source.split(before).length - 1;
          if (matches !== 1) throw new Error(`expected exactly one root recharts declaration, found ${matches}`);
          fs.writeFileSync(path, source.replace(before, after));
          NODE
          git diff --check
          git diff -- package-lock.json
      - name: Commit lockfile correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile root already correct."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: declare zod in root lockfile package"
          git push origin HEAD:security/auth-otp-hardening
