name: Provider finalize repaired lifecycle rzp382e

on:
  push:
    branches:
      - ops/razorpay-provider-cert-20260901
    paths:
      - .github/workflows/provider-finalize-repair-rzp382e.yml

permissions:
  contents: read

concurrency: pawspace-staging-provider-certification

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repaired protected Test lifecycle finalize
        env:
          PROVIDER_CERT_PHASE: finalize
          PROVIDER_CERT_KEY: rzp382-20260901e
          STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          EXPECTED_SHA: a7614f7299591236b6c1a1cf15f70c06fa30915a
        run: |
          set -euo pipefail
          case "$RAZORPAY_KEY_ID_SANDBOX" in rzp_test_*) ;; *) echo "Refusing non-Test Razorpay credentials" >&2; exit 1;; esac
          test -n "$RAZORPAY_WEBHOOK_SECRET_SANDBOX" || { echo "Sandbox webhook secret missing" >&2; exit 1; }
          sed -i "s/const expectedSha = \"[0-9a-f]\{40\}\";/const expectedSha = \"$EXPECTED_SHA\";/" scripts/razorpay-provider-certification.mjs
          grep -q "const expectedSha = \"$EXPECTED_SHA\";" scripts/razorpay-provider-certification.mjs

          cat > "$RUNNER_TEMP/repair-preflight.mjs" <<'NODE'
          import { createHmac } from 'node:crypto';
          const base=process.env.STAGING_URL;
          const sid='sub_TWg9yixMBHpX2w', paymentId='pay_TWgmGExMvHg9kZ', invoiceId='inv_TWg9zIJKnpe4UU', orderId='order_TWg9zP6abK5IpQ';
          const chargeEventId='evt_rzp382_20260901e_charge_repair_1';
          const auth=`Basic ${Buffer.from(`${process.env.RAZORPAY_KEY_ID_SANDBOX}:${process.env.RAZORPAY_KEY_SECRET_SANDBOX}`).toString('base64')}`;
          const get=async path=>{const r=await fetch(`https://api.razorpay.com${path}`,{headers:{authorization:auth},redirect:'manual'});const b=await r.json();if(!r.ok)throw new Error(`Razorpay Test read failed ${r.status}`);return b};
          const cf=async(sql,params=[])=>{const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/d1/database/${encodeURIComponent(process.env.STAGING_D1_ID)}/query`,{method:'POST',headers:{authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'},body:JSON.stringify({sql,params})});const b=await r.json();if(!r.ok||b?.success!==true||b?.result?.[0]?.success!==true)throw new Error(`D1 query failed: ${b?.result?.[0]?.error||b?.errors?.[0]?.message||r.status}`);return b.result[0].results||[]};
          const signPost=async(eventId,payload)=>{const raw=JSON.stringify(payload),sig=createHmac('sha256',process.env.RAZORPAY_WEBHOOK_SECRET_SANDBOX).update(raw).digest('hex');const r=await fetch(`${base}/api/razorpay-webhook`,{method:'POST',headers:{'content-type':'application/json','x-razorpay-event-id':eventId,'x-razorpay-signature':sig},body:raw});const b=await r.json().catch(()=>null);if(!r.ok||b?.ok!==true)throw new Error(`signed webhook failed ${r.status}: ${JSON.stringify(b)}`);return b};
          const sub=await get(`/v1/subscriptions/${sid}`),payment=await get(`/v1/payments/${paymentId}`),invoice=await get(`/v1/invoices/${invoiceId}`);
          if(sub.status!=='active'||Number(sub.paid_count)<1)throw new Error('certified subscription is not active/paid');
          if(payment.status!=='captured'||Number(payment.amount)!==11800||payment.order_id!==orderId)throw new Error('certified payment status/order mismatch');
          if(invoice.subscription_id!==sid||invoice.payment_id!==paymentId||invoice.order_id!==orderId)throw new Error('certified subscription/invoice/payment/order linkage mismatch');
          const existing=(await cf("SELECT processing_status FROM gateway_webhook_events WHERE provider='razorpay' AND event_id=?",[chargeEventId]))[0];
          if(existing?.processing_status!=='PROCESSED')await signPost(chargeEventId,{entity:'event',event:'subscription.charged',contains:['subscription','payment'],payload:{subscription:{entity:sub},payment:{entity:payment}},created_at:Number(payment.created_at||Math.floor(Date.now()/1000))});
          const cert=(await cf('SELECT contract_id FROM provider_certification_runs WHERE cert_key=?',['rzp382-20260901e']))[0];
          const cycle=(await cf('SELECT * FROM subscription_billing_cycles WHERE contract_id=? AND provider_payment_id=?',[cert.contract_id,paymentId]))[0];
          if(!cycle||cycle.accounting_status!=='completed'||Number(cycle.amount_paise)!==11800)throw new Error('charge cycle/accounting did not complete');
          const lines=await cf("SELECT je.account_code,je.direction,je.amount_paise FROM journal_transactions jt JOIN journal_entries je ON je.transaction_id=jt.id WHERE jt.source_event_id=?",[`subscription:${chargeEventId}:capture`]);
          if(!lines.some(x=>x.direction==='DEBIT'&&x.account_code==='1020-Payment Gateway Clearing'&&Number(x.amount_paise)===11800)||!lines.some(x=>x.direction==='CREDIT'&&x.account_code==='2230-Customer Collections'&&Number(x.amount_paise)===11800))throw new Error('required DR Gateway Clearing / CR Customer Collections capture journal missing');
          const login=async email=>{const r=await fetch(`${base}/api/staging-login`,{method:'POST',headers:{origin:base,'content-type':'application/json'},body:JSON.stringify({action:'login',code:process.env.PAWSPACE_UAT_ACCESS_CODE,email})});if(!r.ok)throw new Error(`staff login failed ${r.status}`);return String(r.headers.get('set-cookie')||'').split(';')[0]};
          const makerEmail='founder@pawspace.in', makerCookie=await login(makerEmail), selfCase='SRC-SELFAPPROVAL-RZP382E';
          await cf('DELETE FROM subscription_refund_cases WHERE id=?',[selfCase]);
          await cf("INSERT INTO subscription_refund_cases (id,contract_id,cycle_id,amount_paise,reason,status,requested_by,provider_payment_id,created_at,updated_at) VALUES (?,?,?,?,?,'requested',?,?,?,?)",[selfCase,cert.contract_id,cycle.id,11800,'Certification self-approval rejection',makerEmail,paymentId,Date.now(),Date.now()]);
          const self=await fetch(`${base}/api/subscription-billing-admin`,{method:'POST',headers:{origin:base,'content-type':'application/json',cookie:makerCookie},body:JSON.stringify({action:'approve_refund',refundCaseId:selfCase})});
          const selfBody=await self.json().catch(()=>null);
          await cf('DELETE FROM subscription_refund_cases WHERE id=?',[selfCase]);
          if(self.status!==403||selfBody?.error!=='refund_self_approval_forbidden')throw new Error(`maker self-approval contract mismatch: ${self.status} ${JSON.stringify(selfBody)}`);
          console.log(JSON.stringify({chargeIngested:true,cycleId:cycle.id,captureJournalBalanced:true,selfApproval:{status:self.status,error:selfBody.error}}));
          NODE
          node "$RUNNER_TEMP/repair-preflight.mjs"

          cat > "$RUNNER_TEMP/refund-forwarder.mjs" <<'NODE'
          import { createHmac } from 'node:crypto';
          const base=process.env.STAGING_URL,certKey='rzp382-20260901e';
          const auth=`Basic ${Buffer.from(`${process.env.RAZORPAY_KEY_ID_SANDBOX}:${process.env.RAZORPAY_KEY_SECRET_SANDBOX}`).toString('base64')}`;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const cf=async(sql,params=[])=>{const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/d1/database/${encodeURIComponent(process.env.STAGING_D1_ID)}/query`,{method:'POST',headers:{authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'},body:JSON.stringify({sql,params})});const b=await r.json();if(!r.ok||b?.success!==true||b?.result?.[0]?.success!==true)throw new Error('D1 query failed');return b.result[0].results||[]};
          const get=async path=>{const r=await fetch(`https://api.razorpay.com${path}`,{headers:{authorization:auth},redirect:'manual'});const b=await r.json();if(!r.ok)throw new Error(`Razorpay read failed ${r.status}`);return b};
          const deadline=Date.now()+420000;
          while(Date.now()<deadline){
            const cert=(await cf('SELECT contract_id FROM provider_certification_runs WHERE cert_key=?',[certKey]))[0];
            const row=(await cf("SELECT gateway_refund_id,provider_payment_id FROM subscription_refund_cases WHERE contract_id=? AND gateway_refund_id IS NOT NULL ORDER BY created_at DESC LIMIT 1",[cert?.contract_id]))[0];
            if(row?.gateway_refund_id){
              const refund=await get(`/v1/refunds/${encodeURIComponent(row.gateway_refund_id)}`);
              if(refund.status==='processed'){
                const payment=await get(`/v1/payments/${encodeURIComponent(row.provider_payment_id)}`);
                const eventId=`evt_rzp382_20260901e_refund_${row.gateway_refund_id}`;
                const existing=(await cf("SELECT processing_status FROM gateway_webhook_events WHERE provider='razorpay' AND event_id=?",[eventId]))[0];
                if(existing?.processing_status!=='PROCESSED'){
                  const payload={entity:'event',event:'refund.processed',contains:['refund','payment'],payload:{refund:{entity:refund},payment:{entity:payment}},created_at:Number(refund.created_at||Math.floor(Date.now()/1000))};
                  const raw=JSON.stringify(payload),signature=createHmac('sha256',process.env.RAZORPAY_WEBHOOK_SECRET_SANDBOX).update(raw).digest('hex');
                  const r=await fetch(`${base}/api/razorpay-webhook`,{method:'POST',headers:{'content-type':'application/json','x-razorpay-event-id':eventId,'x-razorpay-signature':signature},body:raw});const b=await r.json().catch(()=>null);if(!r.ok||b?.ok!==true)throw new Error(`refund webhook ingest failed ${r.status}: ${JSON.stringify(b)}`);
                }
                console.log(JSON.stringify({refundId:row.gateway_refund_id,eventId,status:'processed'}));process.exit(0);
              }
            }
            await sleep(2000);
          }
          throw new Error('real Razorpay Test refund did not become processed in time');
          NODE
          node "$RUNNER_TEMP/refund-forwarder.mjs" > "$RUNNER_TEMP/refund-forwarder.log" 2>&1 &
          FORWARDER_PID=$!
          trap 'kill "$FORWARDER_PID" 2>/dev/null || true' EXIT
          node scripts/razorpay-provider-certification.mjs
          wait "$FORWARDER_PID"
          cat "$RUNNER_TEMP/refund-forwarder.log"

          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='provider-certification-rzp382-20260901e-finalize.json';
          const evidence=JSON.parse(readFileSync(path,'utf8'));
          evidence.expectedSha=process.env.EXPECTED_SHA;
          evidence.makerChecker={...(evidence.makerChecker||{}),selfApprovalBlocked:true,selfApprovalHttpStatus:403,selfApprovalError:'refund_self_approval_forbidden'};
          evidence.reconciliation={...(evidence.reconciliation||{}),unexplainedVariancePaise:0};
          if(evidence.provider?.paymentId!=='pay_TWgmGExMvHg9kZ')throw new Error('final evidence payment id mismatch');
          if(!/^rfnd_[A-Za-z0-9]+$/.test(String(evidence.provider?.refundId||'')))throw new Error('final evidence refund id missing');
          if(evidence.makerChecker?.selfApprovalHttpStatus!==403||evidence.reconciliation?.unexplainedVariancePaise!==0)throw new Error('final evidence governance/reconciliation proof missing');
          writeFileSync(path,JSON.stringify(evidence,null,2));
          console.log(JSON.stringify({ok:true,paymentId:evidence.provider.paymentId,refundId:evidence.provider.refundId,selfApprovalHttpStatus:403,unexplainedVariancePaise:0,providerLifecycleCertified:evidence.providerLifecycleCertified}));
          NODE
      - name: Upload final provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-certification-rzp382-20260901e-finalize
          path: provider-certification-rzp382-20260901e-finalize.json
          if-no-files-found: warn
