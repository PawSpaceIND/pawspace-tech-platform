name: Deprecated direct Grooming UAT (use governed app route)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Deprecated: use provider preflight direct-grooming-call with exact UAT context'
        required: true
        default: ''
permissions:
  contents: read
jobs:
  refuse-ungoverned-dial:
    runs-on: ubuntu-latest
    steps:
      - name: Require the canonical app call workflow
        run: |
          echo 'This legacy direct-provider dial path is disabled.'
          echo 'Use ElevenLabs provider preflight: inspect-app-voice, then direct-grooming-call.'
          echo 'The canonical app enforces recipient ownership, consent, opt-out and call limits.'
          exit 1
