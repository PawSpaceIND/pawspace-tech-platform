name: Repoint Razorpay Test webhook

on:
  push:
    branches:
      - uat/razorpay-webhook-diagnostic-20260911

permissions:
  contents: read

jobs:
  repoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
      RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
      RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
      WEBHOOK_ID: TaG3ZzXULiDFUS
      OLD_URL: https://pawspace-checkout-674-34449191667-1.karthik-fce.workers.dev/api/razorpay-webhook
      NEW_URL: https://pawspace-staging.karthik-fce.workers.dev/api/razorpay-webhook
    steps:
      - name: Repoint exactly the stale Test webhook and verify
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const key = process.env.RAZORPAY_KEY_ID_SANDBOX || '';
          const secret = process.env.RAZORPAY_KEY_SECRET_SANDBOX || '';
          const webhookSecret = process.env.RAZORPAY_WEBHOOK_SECRET_SANDBOX || '';
          const id = process.env.WEBHOOK_ID;
          const oldUrl = process.env.OLD_URL;
          const newUrl = process.env.NEW_URL;
          if (!key.startsWith('rzp_test_') || !secret || !webhookSecret) throw new Error('Sandbox webhook credentials are incomplete or not Test Mode');
          const auth = `Basic ${Buffer.from(`${key}:${secret}`).toString('base64')}`;
          const api = `https://api.razorpay.com/v1/webhooks/${id}`;
          const get = async () => {
            const r = await fetch(api, { headers: { authorization: auth }, redirect: 'error', signal: AbortSignal.timeout(15000) });
            if (!r.ok) throw new Error(`Fetch webhook failed HTTP ${r.status}`);
            return r.json();
          };
          const before = await get();
          if (before.id !== id || before.url !== oldUrl || before.active !== true) throw new Error('Webhook state drifted; refusing mutation');
          const events = Array.isArray(before.events) ? before.events : Object.keys(before.events || {}).filter(k => before.events[k]);
          for (const required of ['payment.authorized','payment.captured','payment.failed','order.paid']) {
            if (!events.includes(required)) throw new Error(`Required event missing before update: ${required}`);
          }
          const response = await fetch(api, {
            method: 'PUT',
            headers: { authorization: auth, 'content-type': 'application/json' },
            body: JSON.stringify({ url: newUrl, events, secret: webhookSecret }),
            redirect: 'error',
            signal: AbortSignal.timeout(15000),
          });
          const text = await response.text();
          if (!response.ok) throw new Error(`Update webhook failed HTTP ${response.status}: ${text.slice(0,300)}`);
          const after = await get();
          const afterEvents = Array.isArray(after.events) ? after.events : Object.keys(after.events || {}).filter(k => after.events[k]);
          if (after.id !== id || after.url !== newUrl || after.active !== true) throw new Error('Webhook did not converge to current staging URL');
          for (const required of ['payment.authorized','payment.captured','payment.failed','order.paid']) {
            if (!afterEvents.includes(required)) throw new Error(`Required event lost during update: ${required}`);
          }
          console.log(JSON.stringify({ id: after.id, active: after.active, host: new URL(after.url).host, path: new URL(after.url).pathname, events: afterEvents }));
          NODE
