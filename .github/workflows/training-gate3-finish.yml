name: Training Gate 3 final patch
on:
  push:
    branches: [grooming-integration-closure]
    paths:
      - .github/workflows/training-gate3-finish.yml
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: python3 scripts/training-gate3-finish-v2.py
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit verified Training Gate 3 final patch
        run: |
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add lib/api-gateway.ts lib/session-api-gateway.ts lib/training-finance.ts lib/training-cancellation.ts app/mobile-app/training-flow.tsx app/team/finance/training/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Close Training cancellation recovery and receipt-covered earnings [skip ci]"
          git pull --rebase origin grooming-integration-closure
          git push origin grooming-integration-closure
