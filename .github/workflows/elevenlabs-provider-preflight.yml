name: ElevenLabs and OpenAI provider preflight (no calls)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type no-calls, specialist-call, or direct-grooming-call.'
        required: true
        default: ''
      specialist_use_case:
        description: 'grooming_sales or training_sales when confirm=specialist-call'
        required: false
        default: 'grooming_sales'
permissions:
  contents: read
jobs:
  preflight:
    if: ${{ inputs.confirm == 'no-calls' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read agent and verify one synthetic OpenAI reply without business data
        env:
          PAWSPACE_OPENAI_API_KEY: ${{ secrets.PAWSPACE_OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_ID: ${{ secrets.ELEVENLABS_AGENT_ID }}
        run: node scripts/elevenlabs-provider-preflight.mjs
      - name: Inspect ElevenLabs imported phone bridge metadata (no call)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_PHONE_NUMBER_ID: ${{ secrets.ELEVENLABS_AGENT_PHONE_NUMBER_ID }}
          EXOTEL_CALLER_ID: ${{ secrets.EXOTEL_CALLER_ID }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
          TRAINING_AGENT_ID: ${{ vars.ELEVENLABS_TRAINING_AGENT_ID }}
        run: |
          node <<'NODE'
          const key=String(process.env.ELEVENLABS_API_KEY||'').trim();
          const expectedId=String(process.env.ELEVENLABS_AGENT_PHONE_NUMBER_ID||'').trim();
          if(!key) throw new Error('ELEVENLABS_API_KEY missing');
          const headers={'xi-api-key':key};
          const listResponse=await fetch('https://api.elevenlabs.io/v1/convai/phone-numbers',{headers,signal:AbortSignal.timeout(30000)});
          const list=await listResponse.json().catch(()=>({}));
          if(!listResponse.ok) throw new Error('phone list failed '+listResponse.status);
          const rows=Array.isArray(list?.phone_numbers)?list.phone_numbers:Array.isArray(list)?list:[];
          const safeRows=rows.map(x=>({
            phoneNumberId:x.phone_number_id||x.id||null,label:x.label||null,provider:x.provider||null,
            phoneLast4:String(x.phone_number||'').replace(/\D/g,'').slice(-4)||null,
            agentId:x.agent_id||null,inboundAgentId:x.inbound_agent_id||null,outboundAgentId:x.outbound_agent_id||null,
            hasAccountSid:Boolean(x.account_sid),hasApiKey:Boolean(x.api_key),hasApiToken:Boolean(x.api_token),
            appId:x.app_id||null,region:x.region||x.api_subdomain||null
          }));
          console.log('PHONE_LIST_SAFE='+JSON.stringify(safeRows));
          console.log('EXPECTED_PHONE_ID_PRESENT='+String(safeRows.some(x=>x.phoneNumberId===expectedId)));
          if(expectedId){
            const detailResponse=await fetch('https://api.elevenlabs.io/v1/convai/phone-numbers/'+encodeURIComponent(expectedId),{headers,signal:AbortSignal.timeout(30000)});
            const d=await detailResponse.json().catch(()=>({}));
            console.log('EXPECTED_PHONE_DETAIL_STATUS='+detailResponse.status);
            if(detailResponse.ok) console.log('EXPECTED_PHONE_DETAIL='+JSON.stringify({
              phoneNumberId:d.phone_number_id||d.id||null,label:d.label||null,provider:d.provider||null,
              phoneLast4:String(d.phone_number||'').replace(/\D/g,'').slice(-4)||null,
              agentId:d.agent_id||null,inboundAgentId:d.inbound_agent_id||null,outboundAgentId:d.outbound_agent_id||null,
              hasAccountSid:Boolean(d.account_sid),hasApiKey:Boolean(d.api_key),hasApiToken:Boolean(d.api_token),
              appId:d.app_id||null,region:d.region||d.api_subdomain||null
            }));
            else console.log('EXPECTED_PHONE_ERROR='+JSON.stringify(d).slice(0,1500));
          }
          console.log('SPECIALIST_IDS='+JSON.stringify({grooming:Boolean(process.env.GROOMING_AGENT_ID),training:Boolean(process.env.TRAINING_AGENT_ID)}));
          const ar=await fetch('https://api.elevenlabs.io/v1/convai/agents/'+encodeURIComponent(String(process.env.GROOMING_AGENT_ID||'')),{headers:{'xi-api-key':key},signal:AbortSignal.timeout(30000)});
          const aj=await ar.json().catch(()=>({}));
          if(ar.ok){
            const cc=aj?.conversation_config||{},agent=cc?.agent||{},tts=cc?.tts||{},turn=cc?.turn||{},asr=cc?.asr||{};
            console.log('GROOMING_AGENT_AUDIO_SAFE='+JSON.stringify({
              firstMessage:agent?.first_message||null,
              language:agent?.language||null,
              tts:{modelId:tts?.model_id||tts?.model||null,voiceId:Boolean(tts?.voice_id),stability:tts?.stability??null,similarityBoost:tts?.similarity_boost??null,speed:tts?.speed??null,style:tts?.style??null,optimizeStreamingLatency:tts?.optimize_streaming_latency??null},
              turn:{turnTimeout:turn?.turn_timeout??null,silenceEndCallTimeout:turn?.silence_end_call_timeout??null,mode:turn?.mode||null,softTimeout:turn?.soft_timeout??null},
              asr:{provider:asr?.provider||null,quality:asr?.quality||null,language:asr?.language||null}
            }));
          }
          NODE

      - name: Inspect latest Grooming specialist conversation without dialing
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_LLM_SECRET: ${{ secrets.ELEVENLABS_LLM_SECRET }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
          EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
          EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
          EXOTEL_SID: ${{ secrets.EXOTEL_SID }}
          EXOTEL_SUBDOMAIN: ${{ vars.EXOTEL_SUBDOMAIN }}
        run: |
          node <<'NODE'
          const key=String(process.env.ELEVENLABS_API_KEY||'').trim(),agentId=String(process.env.GROOMING_AGENT_ID||'').trim();if(!key||!agentId)throw new Error('inspection prerequisites missing');
          const listResponse=await fetch(`https://api.elevenlabs.io/v1/convai/conversations?agent_id=${encodeURIComponent(agentId)}&page_size=10`,{headers:{'xi-api-key':key},signal:AbortSignal.timeout(30000)});
          const list=await listResponse.json().catch(()=>({}));if(!listResponse.ok){console.log(JSON.stringify(list).slice(0,2000));throw new Error(`conversation list failed ${listResponse.status}`);}
          const rows=Array.isArray(list?.conversations)?list.conversations:[];if(!rows.length)throw new Error('no Grooming conversations found');
          const latest=rows.sort((a,b)=>Number(b?.start_time_unix_secs||b?.metadata?.start_time_unix_secs||0)-Number(a?.start_time_unix_secs||a?.metadata?.start_time_unix_secs||0))[0];
          const id=String(latest?.conversation_id||'');console.log('::add-mask::'+id);const dResponse=await fetch(`https://api.elevenlabs.io/v1/convai/conversations/${encodeURIComponent(id)}`,{headers:{'xi-api-key':key},signal:AbortSignal.timeout(30000)});const d=await dResponse.json().catch(()=>({}));if(!dResponse.ok)throw new Error(`conversation read failed ${dResponse.status}`);
          const transcript=Array.isArray(d.transcript)?d.transcript:[];
          const meta=d?.metadata&&typeof d.metadata==='object'?d.metadata:{};
          const phoneMeta=meta?.phone_call&&typeof meta.phone_call==='object'?meta.phone_call:{};
          const callSid=String(phoneMeta?.call_sid||phoneMeta?.callSid||meta?.call_sid||meta?.callSid||'').trim();
          if(callSid) console.log('::add-mask::'+callSid);
          console.log('GROOMING_LATEST='+JSON.stringify({status:d.status,agentId:d.agent_id,hasAudio:Boolean(d.has_audio),hasUserAudio:Boolean(d.has_user_audio),hasResponseAudio:Boolean(d.has_response_audio),turns:transcript.length,duration:Number(meta?.call_duration_secs||0),terminationReason:meta?.termination_reason||null,error:meta?.error||null,metadataKeys:Object.keys(meta).sort(),phoneMetadataKeys:Object.keys(phoneMeta).sort(),hasProviderCallSid:Boolean(callSid),agentNumberLast4:String(phoneMeta?.agent_number||'').replace(/\D/g,'').slice(-4)||null,externalNumberLast4:String(phoneMeta?.external_number||'').replace(/\D/g,'').slice(-4)||null,phoneNumberIdPresent:Boolean(phoneMeta?.phone_number_id),safeTranscript:transcript.slice(0,8).map(t=>({role:t.role,message:String(t.message||'').replace(/\s+/g,' ').slice(0,500)}))}));
          const recentDetails=[];
          for(const row of rows.slice(0,10)){
            const cid=String(row?.conversation_id||'');if(!cid)continue;
            const rr=await fetch(`https://api.elevenlabs.io/v1/convai/conversations/${encodeURIComponent(cid)}`,{headers:{'xi-api-key':key},signal:AbortSignal.timeout(20000)});if(!rr.ok)continue;
            const cd=await rr.json().catch(()=>({})),ct=Array.isArray(cd?.transcript)?cd.transcript:[],cm=cd?.metadata&&typeof cd.metadata==='object'?cd.metadata:{},cp=cm?.phone_call&&typeof cm.phone_call==='object'?cm.phone_call:{};
            if(ct.some(x=>x?.role==='user')) recentDetails.push({status:cd?.status||null,turns:ct.length,duration:Number(cm?.call_duration_secs||0),start:Number(cd?.start_time_unix_secs||cm?.start_time_unix_secs||0),agentNumberLast4:String(cp?.agent_number||'').replace(/\D/g,'').slice(-4)||null,externalNumberLast4:String(cp?.external_number||'').replace(/\D/g,'').slice(-4)||null,hasCallSid:Boolean(cp?.call_sid),sample:ct.slice(0,4).map(x=>({role:x.role,message:String(x.message||'').replace(/\s+/g,' ').slice(0,180)}))});
          }
          console.log('GROOMING_RECENT_ANSWERED='+JSON.stringify(recentDetails));
          const trResponse=await fetch(`https://api.elevenlabs.io/v1/convai/conversations/${encodeURIComponent(id)}?format=opentelemetry`,{headers:{'xi-api-key':key},signal:AbortSignal.timeout(30000)});
          if(trResponse.ok){
            const otlp=await trResponse.json().catch(()=>({}));
            const rawOtlp=JSON.stringify(otlp);
            const callId=(rawOtlp.match(/VCALL-[A-Z0-9-]+/)||[])[0]||'';
            const scrub=value=>JSON.parse(JSON.stringify(value,(k,v)=>/authorization|api[_-]?key|token|secret|phone|external_number|call_sid|stream_sid/i.test(k)?undefined:v));
            const compact=JSON.stringify(scrub(otlp));
            const hits=[...compact.matchAll(/.{0,220}(?:error|exception|timeout|llm|response|status_code|http\.status).{0,420}/gi)].slice(0,20).map(m=>m[0]);
            console.log('GROOMING_OTLP_SIGNALS='+JSON.stringify(hits));
            const llmSecret=String(process.env.ELEVENLABS_LLM_SECRET||'').trim();
            if(callId&&llmSecret){
              // A phone caller hears nothing until the FIRST text delta, so total body time is the wrong
              // number to optimise against. Read the stream incrementally and time the first delta on its
              // own; `.text()` would collapse all three measurements into one and hide any streaming win.
              const started=Date.now();
              const probe=await fetch('https://pawspace-staging.karthik-fce.workers.dev/api/elevenlabs/v1/responses',{
                method:'POST',
                headers:{'content-type':'application/json',authorization:'Bearer '+llmSecret},
                body:JSON.stringify({input:'I need grooming today for my dog.',elevenlabs_extra_body:{pawspace_voice_call_id:callId}}),
                signal:AbortSignal.timeout(30000)
              });
              const headersMs=Date.now()-started;
              let firstByteMs=null,firstDeltaMs=null,bodyText='';
              const decoder=new TextDecoder();
              for await (const chunk of probe.body){
                if(firstByteMs===null)firstByteMs=Date.now()-started;
                bodyText+=decoder.decode(chunk,{stream:true});
                if(firstDeltaMs===null&&bodyText.includes('"response.output_text.delta"'))firstDeltaMs=Date.now()-started;
              }
              const totalMs=Date.now()-started;
              console.log('GROOMING_LLM_PROBE='+JSON.stringify({status:probe.status,headersMs,firstByteMs,firstDeltaMs,totalMs,ms:totalMs,contentType:probe.headers.get('content-type'),serverTiming:probe.headers.get('server-timing'),bodyPrefix:bodyText.slice(0,1200)}));
            } else console.log('GROOMING_LLM_PROBE='+JSON.stringify({skipped:true,hasCallId:Boolean(callId),hasSecret:Boolean(llmSecret)}));
          }
          const exKey=String(process.env.EXOTEL_API_KEY||'').trim(),exToken=String(process.env.EXOTEL_API_TOKEN||'').trim(),exSid=String(process.env.EXOTEL_SID||'').trim(),host=(String(process.env.EXOTEL_SUBDOMAIN||'').trim()||'api.exotel.com');
          if(callSid&&exKey&&exToken&&exSid){
            const auth=Buffer.from(exKey+':'+exToken).toString('base64');
            const er=await fetch(`https://${host}/v1/Accounts/${encodeURIComponent(exSid)}/Calls/${encodeURIComponent(callSid)}.json`,{headers:{authorization:'Basic '+auth},signal:AbortSignal.timeout(30000)});
            const ej=await er.json().catch(()=>({}));
            const call=(ej?.Call||ej?.call||ej||{});
            console.log('EXOTEL_GROOMING_CALL_DETAIL='+JSON.stringify({httpStatus:er.status,status:call.Status||call.status||null,direction:call.Direction||call.direction||null,duration:Number(call.Duration||call.duration||0),startTime:call.StartTime||call.start_time||null,endTime:call.EndTime||call.end_time||null,recordingPresent:Boolean(call.RecordingUrl||call.recording_url),failureCode:call.FailureCode||call.failure_code||null,failureReason:call.FailureReason||call.failure_reason||null}));
          } else console.log('EXOTEL_GROOMING_CALL_DETAIL='+JSON.stringify({skipped:true,hasCallSid:Boolean(callSid),hasCredentials:Boolean(exKey&&exToken&&exSid)}));
          NODE

  specialist-call:
    if: ${{ inputs.confirm == 'specialist-call' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Place one controlled PawSpace specialist UAT call and inspect ElevenLabs
        env:
          SPECIALIST_USE_CASE: ${{ inputs.specialist_use_case }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
          TRAINING_AGENT_ID: ${{ vars.ELEVENLABS_TRAINING_AGENT_ID }}
        run: |
          node <<'NODE'
          const origin='https://pawspace-staging.karthik-fce.workers.dev';
          const useCase=String(process.env.SPECIALIST_USE_CASE||'').trim();
          if(!['grooming_sales','training_sales'].includes(useCase))throw new Error('specialist use case must be grooming_sales or training_sales');
          const access=String(process.env.PAWSPACE_UAT_ACCESS_CODE||'');
          const elevenKey=String(process.env.ELEVENLABS_API_KEY||'').trim();
          const agentId=useCase==='grooming_sales'?String(process.env.GROOMING_AGENT_ID||'').trim():String(process.env.TRAINING_AGENT_ID||'').trim();
          const allow=String(process.env.PAWSPACE_VOICE_UAT_ALLOWLIST||'').trim().split(/[\s,;]+/).filter(Boolean);
          if(!access||!elevenKey||!agentId||allow.length!==1)throw new Error('specialist UAT secrets/agent id/allowlist unavailable');
          const digits=allow[0].replace(/\D/g,''); const phone=allow[0].startsWith('+')?allow[0]:(digits.length===10?'+91'+digits:'+'+digits);
          console.log('::add-mask::'+phone);
          const customerId='INBOUND-9513886363';
          const login=await fetch(origin+'/api/staging-login',{method:'POST',headers:{'content-type':'application/json',origin},body:JSON.stringify({email:'founder@pawspace.in',code:access}),redirect:'manual',signal:AbortSignal.timeout(20000)});
          if(login.status!==200)throw new Error('staging founder login failed: '+login.status);
          const cookie=(login.headers.get('set-cookie')||'').split(';',1)[0];
          if(!cookie.startsWith('pawspace_uat='))throw new Error('staging UAT cookie missing');
          const before=Date.now();
          const call=await fetch(origin+'/api/voice-outbound',{method:'POST',headers:{'content-type':'application/json',origin,cookie},body:JSON.stringify({action:'request_call',idempotencyKey:'voice-specialist-uat:'+useCase+':'+Date.now(),useCase,phone,customerId,cityId:'blr',campaignId:'controlled_specialist_uat'}),redirect:'error',signal:AbortSignal.timeout(30000)});
          const body=await call.json().catch(()=>({}));
          const dialed=Boolean(body?.data?.dialed||body?.data?.dialled);
          console.log('PAWSPACE_SPECIALIST_RESPONSE='+JSON.stringify({status:call.status,error:body?.error||null,code:body?.code||null,state:body?.data?.state||null,useCase:body?.data?.useCase||null,provider:body?.data?.provider||null,dialed,phoneLast4:body?.data?.phoneLast4||null,quietHoursDecision:body?.data?.quietHoursDecision||null,blockedBy:body?.data?.blockedBy||null,blockedDetail:body?.data?.blockedDetail||null}));
          if(call.status!==201||!body?.data?.callId||!dialed)throw new Error('specialist call was not accepted by PawSpace');
          console.log('::add-mask::'+String(body.data.callId)); if(body.data.providerCallId)console.log('::add-mask::'+String(body.data.providerCallId));
          let detail=null,conversationId='';
          for(let attempt=0;attempt<40;attempt++){
            await new Promise(r=>setTimeout(r,4000));
            const lr=await fetch(`https://api.elevenlabs.io/v1/convai/conversations?agent_id=${encodeURIComponent(agentId)}&page_size=20`,{headers:{'xi-api-key':elevenKey},signal:AbortSignal.timeout(20000)});
            if(!lr.ok)continue;const list=await lr.json().catch(()=>({}));const rows=Array.isArray(list?.conversations)?list.conversations:[];
            const candidate=rows.filter(x=>Number(x?.start_time_unix_secs||0)*1000>=before-15000).sort((a,b)=>Number(b?.start_time_unix_secs||0)-Number(a?.start_time_unix_secs||0))[0];
            if(!candidate?.conversation_id)continue;conversationId=String(candidate.conversation_id);console.log('::add-mask::'+conversationId);
            const dr=await fetch(`https://api.elevenlabs.io/v1/convai/conversations/${encodeURIComponent(conversationId)}`,{headers:{'xi-api-key':elevenKey},signal:AbortSignal.timeout(20000)});if(!dr.ok)continue;detail=await dr.json().catch(()=>({}));
            const tr=Array.isArray(detail?.transcript)?detail.transcript:[];console.log(`SPECIALIST_POLL useCase=${useCase} status=${String(detail?.status||'')} turns=${tr.length} hasAudio=${Boolean(detail?.has_audio)} userAudio=${Boolean(detail?.has_user_audio)} responseAudio=${Boolean(detail?.has_response_audio)}`);
            if(String(detail?.status)==='failed'||String(detail?.status)==='done'||tr.length>=2||detail?.has_response_audio)break;
          }
          if(!detail||!conversationId)throw new Error('ElevenLabs specialist conversation not observed');
          const tr=Array.isArray(detail.transcript)?detail.transcript:[];
          console.log('SPECIALIST_RESULT='+JSON.stringify({useCase,status:detail.status,agentId:detail.agent_id,expectedAgentId:agentId,hasAudio:Boolean(detail.has_audio),hasUserAudio:Boolean(detail.has_user_audio),hasResponseAudio:Boolean(detail.has_response_audio),turns:tr.length,safeTranscript:tr.slice(0,10).map(t=>({role:t.role,message:String(t.message||'').replace(/\s+/g,' ').slice(0,500)}))}));
          if(String(detail.agent_id)!==agentId)throw new Error('specialist call used the wrong ElevenLabs agent');
          if(String(detail.status)==='failed')throw new Error('ElevenLabs specialist conversation failed');
          NODE

  direct-grooming-call:
    if: ${{ inputs.confirm == 'direct-grooming-call' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Place grounded ElevenLabs Grooming call and inspect carrier
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_PHONE_NUMBER_ID: ${{ secrets.ELEVENLABS_AGENT_PHONE_NUMBER_ID }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
          EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
          EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
          EXOTEL_CALLER_ID: ${{ secrets.EXOTEL_CALLER_ID }}
          EXOTEL_SID: ${{ secrets.EXOTEL_SID }}
          EXOTEL_SUBDOMAIN: ${{ vars.EXOTEL_SUBDOMAIN }}
        run: |
          node <<'NODE'
          const origin='https://pawspace-staging.karthik-fce.workers.dev';
          const access=String(process.env.PAWSPACE_UAT_ACCESS_CODE||''), key=String(process.env.ELEVENLABS_API_KEY||'').trim(), configuredPhoneId=String(process.env.ELEVENLABS_AGENT_PHONE_NUMBER_ID||'').trim(), agentId=String(process.env.GROOMING_AGENT_ID||'').trim();
          const callerDigits=String(process.env.EXOTEL_CALLER_ID||'').replace(/\D/g,'').replace(/^91/,'').replace(/^0/,'').slice(-10);
          let phoneId=configuredPhoneId;
          const elevenHeaders={'xi-api-key':key};
          if(phoneId){
            const check=await fetch('https://api.elevenlabs.io/v1/convai/phone-numbers/'+encodeURIComponent(phoneId),{headers:elevenHeaders,signal:AbortSignal.timeout(20000)});
            if(!check.ok) phoneId='';
          }
          if(!phoneId){
            const lr=await fetch('https://api.elevenlabs.io/v1/convai/phone-numbers?provider=exotel',{headers:elevenHeaders,signal:AbortSignal.timeout(30000)});
            const lj=await lr.json().catch(()=>({}));
            if(!lr.ok) throw new Error('ElevenLabs phone list failed: '+lr.status);
            const rows=Array.isArray(lj?.phone_numbers)?lj.phone_numbers:Array.isArray(lj)?lj:[];
            const exact=rows.find(x=>String(x?.phone_number||'').replace(/\D/g,'').replace(/^91/,'').replace(/^0/,'').slice(-10)===callerDigits);
            const selected=exact||(rows.length===1?rows[0]:null);
            phoneId=String(selected?.phone_number_id||selected?.id||'').trim();
            if(!phoneId){
            const fallbackExKey=String(process.env.EXOTEL_API_KEY||'').trim(),fallbackExToken=String(process.env.EXOTEL_API_TOKEN||'').trim(),fallbackExSid=String(process.env.EXOTEL_SID||'').trim(),fallbackExHost=String(process.env.EXOTEL_SUBDOMAIN||'api.exotel.com').trim()||'api.exotel.com';
            if(!callerDigits||!fallbackExKey||!fallbackExToken||!fallbackExSid) throw new Error('No current Exotel phone_number_id could be resolved');
            const imp=await fetch('https://api.elevenlabs.io/v1/convai/phone-numbers',{
              method:'POST',headers:{...elevenHeaders,'content-type':'application/json'},
              body:JSON.stringify({provider:'exotel',label:'PawSpace Voice UAT',phone_number:'+91'+callerDigits,account_sid:fallbackExSid,api_key:fallbackExKey,api_token:fallbackExToken,api_subdomain:fallbackExHost,app_id:'1347515'}),
              signal:AbortSignal.timeout(30000)
            });
            const ib=await imp.json().catch(()=>({}));
            if(!imp.ok||!ib?.phone_number_id) throw new Error('Self-heal Exotel phone import failed '+imp.status);
            phoneId=String(ib.phone_number_id);
            const patch=await fetch('https://api.elevenlabs.io/v1/convai/phone-numbers/'+encodeURIComponent(phoneId),{
              method:'PATCH',headers:{...elevenHeaders,'content-type':'application/json'},
              body:JSON.stringify({agent_id:agentId,label:'PawSpace Voice UAT'}),signal:AbortSignal.timeout(30000)
