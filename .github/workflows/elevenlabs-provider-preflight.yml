          EXPECTED_SHA: ${{ inputs.expected_staging_sha }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
        run: node tests/e2e/staging-certification.mjs --isolation-only
      - name: Open only the authorized attended staging window
        if: ${{ inputs.confirm == 'attended-specialist-uat' }}
        env:
          PILOT_ACTION: ${{ inputs.confirm }}
          EXPECTED_SHA: ${{ inputs.expected_staging_sha }}
          EXPECTED_TESTER_SHA256: ${{ inputs.expected_tester_sha256 }}
          SPECIALIST_CUSTOMER_ID: ${{ inputs.specialist_customer_id }}
