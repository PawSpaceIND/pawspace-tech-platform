              console.log('LEGS_SAFE='+JSON.stringify(legs.map(x=>({
                direction:x.direction||null,state:x.state||null,terminalStatus:x.terminal_status||x.status||null,
                networkType:x.network_type||null,onCallDurationMs:Number(x.on_call_duration_ms||0),
                bridgeStatus:x?.additional_info?.bridge_status||null,txAudioStatus:x?.additional_info?.tx_audio_status||null,rxAudioStatus:x?.additional_info?.rx_audio_status||null
              }))));
            }
          } else console.log('V3_DETAIL_ERROR='+JSON.stringify(db).slice(0,1200));
          NODE

  repair-with-alternate-ka-exophone:
    if: ${{ inputs.confirm == 'repair-with-alternate-ka-exophone' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Switch ElevenLabs UAT to alternate KA ExoPhone
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OLD_PHONE_NUMBER_ID: ${{ secrets.ELEVENLABS_AGENT_PHONE_NUMBER_ID }}
          EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
          EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
          EXOTEL_SID: ${{ secrets.EXOTEL_SID }}
          EXOTEL_SUBDOMAIN: ${{ vars.EXOTEL_SUBDOMAIN }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
        run: |
          node <<'NODE'
          const elevenKey=String(process.env.ELEVENLABS_API_KEY||'').trim();
          const oldId=String(process.env.OLD_PHONE_NUMBER_ID||'').trim();
          const exKey=String(process.env.EXOTEL_API_KEY||'').trim();
          const exToken=String(process.env.EXOTEL_API_TOKEN||'').trim();
          const exSid=String(process.env.EXOTEL_SID||'').trim();
          const exHost=String(process.env.EXOTEL_SUBDOMAIN||'api.exotel.com').trim()||'api.exotel.com';
          const agentId=String(process.env.GROOMING_AGENT_ID||'').trim();
          if(!elevenKey||!exKey||!exToken||!exSid||!agentId) throw new Error('alternate ExoPhone prerequisites missing');
          const auth='Basic '+Buffer.from(exKey+':'+exToken).toString('base64');
          const xr=await fetch('https://'+exHost+'/v2_beta/Accounts/'+encodeURIComponent(exSid)+'/IncomingPhoneNumbers',{headers:{authorization:auth},signal:AbortSignal.timeout(30000)});
          const xb=await xr.json().catch(()=>({}));
          if(!xr.ok) throw new Error('ExoPhone list failed '+xr.status);
          const phones=(Array.isArray(xb?.incoming_phone_numbers)?xb.incoming_phone_numbers:[]).filter(x=>Boolean(x?.capabilities?.voice)&&x?.phone_number&&String(x.region||'').toUpperCase()==='KA');
          if(phones.length<2) throw new Error('No alternate KA ExoPhone available');
          const chosen=phones.find(x=>String(x.phone_number||'').replace(/\D/g,'').slice(-4)!=='2185')||phones[1];
          let digits=String(chosen.phone_number||'').replace(/\D/g,'');
          let e164='';
          if(digits.length===12&&digits.startsWith('91')) e164='+'+digits;
          else if(digits.length===11&&digits.startsWith('0')) e164='+91'+digits.slice(1);
          else if(digits.length===10) e164='+91'+digits;
          else throw new Error('Alternate ExoPhone cannot be normalized');
          console.log('::add-mask::'+e164);
          console.log('ALTERNATE_EXOPHONE='+JSON.stringify({last4:digits.slice(-4),region:chosen.region||null,numberType:chosen.number_type||null,voiceFlowId:(String(chosen.voice_url||'').match(/start_voice\/(\d+)/)||[])[1]||null}));
          const headers={'xi-api-key':elevenKey};
          if(oldId){
            const del=await fetch('https://api.elevenlabs.io/v1/convai/phone-numbers/'+encodeURIComponent(oldId),{method:'DELETE',headers,signal:AbortSignal.timeout(30000)});
            console.log('OLD_PHONE_DELETE_STATUS='+del.status);
            if(!del.ok&&del.status!==404) throw new Error('old phone delete failed '+del.status);
          }
          const imp=await fetch('https://api.elevenlabs.io/v1/convai/phone-numbers',{
            method:'POST',headers:{...headers,'content-type':'application/json'},
            body:JSON.stringify({provider:'exotel',label:'PawSpace Voice UAT',phone_number:e164,account_sid:exSid,api_key:exKey,api_token:exToken,api_subdomain:exHost,app_id:'1347515'}),
            signal:AbortSignal.timeout(30000)
          });
          const ib=await imp.json().catch(()=>({}));
          if(!imp.ok||!ib?.phone_number_id){console.log('ALTERNATE_IMPORT_ERROR='+JSON.stringify(ib).slice(0,1500));throw new Error('alternate ExoPhone import failed '+imp.status);}
          const newId=String(ib.phone_number_id); console.log('ALTERNATE_PHONE_ID='+newId);
          const patch=await fetch('https://api.elevenlabs.io/v1/convai/phone-numbers/'+encodeURIComponent(newId),{
            method:'PATCH',headers:{...headers,'content-type':'application/json'},body:JSON.stringify({agent_id:agentId,label:'PawSpace Voice UAT'}),signal:AbortSignal.timeout(30000)
          });
          console.log('ALTERNATE_ASSIGN_STATUS='+patch.status);
          if(!patch.ok) throw new Error('alternate Grooming assignment failed '+patch.status);
          NODE

  tune-grooming-audio:
    if: ${{ inputs.confirm == 'tune-grooming-audio' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 3
    steps:
      - name: Tune Grooming agent for clear phone conversation
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
        run: |
          node <<'NODE'
          const key=String(process.env.ELEVENLABS_API_KEY||'').trim(),agentId=String(process.env.GROOMING_AGENT_ID||'').trim();
          if(!key||!agentId) throw new Error('ElevenLabs tuning prerequisites missing');
          const headers={'xi-api-key':key,'content-type':'application/json'};
          const read=await fetch('https://api.elevenlabs.io/v1/convai/agents/'+encodeURIComponent(agentId),{headers:{'xi-api-key':key},signal:AbortSignal.timeout(30000)});
          const current=await read.json().catch(()=>({}));
          if(!read.ok) throw new Error('agent read failed '+read.status);
          const voiceId=current?.conversation_config?.tts?.voice_id;
          if(!voiceId) throw new Error('agent voice_id missing');
          const body={
            conversation_config:{
              agent:{
                first_message:"Hi, this is PawSpace's grooming assistant. How can I help with grooming today?"
              },
              tts:{
                model_id:'eleven_flash_v2',
                voice_id:voiceId,
                stability:0.78,
                similarity_boost:0.75,
                speed:0.9,
                optimize_streaming_latency:0
              },
              turn:{
                turn_timeout:12,
                silence_end_call_timeout:60,
                turn_eagerness:'normal',
                turn_model:'turn_v3',
                soft_timeout_config:{
                  timeout_seconds:4,
                  message:"One moment while I check that for you.",
                  max_soft_timeouts_per_generation:1
                }
              }
            }
          };
          const patch=await fetch('https://api.elevenlabs.io/v1/convai/agents/'+encodeURIComponent(agentId),{
            method:'PATCH',headers,body:JSON.stringify(body),signal:AbortSignal.timeout(30000)
          });
          const result=await patch.json().catch(()=>({}));
          if(!patch.ok){console.log(JSON.stringify(result).slice(0,2000));throw new Error('agent update failed '+patch.status);}
          const cc=result?.conversation_config||{},tts=cc?.tts||{},turn=cc?.turn||{},agent=cc?.agent||{};
          console.log('GROOMING_AUDIO_TUNED='+JSON.stringify({
            firstMessage:agent.first_message||null,
            modelId:tts.model_id||null,
            stability:tts.stability??null,
            similarityBoost:tts.similarity_boost??null,
            speed:tts.speed??null,
            turnTimeout:turn.turn_timeout??null,
            silenceEndCallTimeout:turn.silence_end_call_timeout??null,
            turnModel:turn.turn_model||null,
            softTimeoutSeconds:turn?.soft_timeout_config?.timeout_seconds??null
          }));
          NODE
