name: ElevenLabs and OpenAI provider preflight (no calls)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type no-calls. Makes one synthetic OpenAI request and reads the existing global ElevenLabs agent. No calls or conversations.'
        required: true
        default: ''
permissions:
  contents: read
jobs:
  preflight:
    if: ${{ inputs.confirm == 'no-calls' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read agent and verify one synthetic OpenAI reply without business data
        env:
          PAWSPACE_OPENAI_API_KEY: ${{ secrets.PAWSPACE_OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_ID: ${{ secrets.ELEVENLABS_AGENT_ID }}
        run: node scripts/elevenlabs-provider-preflight.mjs
      - name: Place one allowlisted Grooming specialist UAT call via ElevenLabs Exotel
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_PHONE_NUMBER_ID: ${{ secrets.ELEVENLABS_AGENT_PHONE_NUMBER_ID }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
        run: |
          node <<'NODE'
          const key=String(process.env.ELEVENLABS_API_KEY||'').trim();
          const phoneId=String(process.env.ELEVENLABS_AGENT_PHONE_NUMBER_ID||'').trim();
          const agentId=String(process.env.GROOMING_AGENT_ID||'').trim();
          const entries=String(process.env.PAWSPACE_VOICE_UAT_ALLOWLIST||'').trim().split(/[\s,;]+/).filter(Boolean);
          if(!key||!phoneId||!agentId||entries.length!==1)throw new Error('controlled Grooming UAT prerequisites missing');
          const digits=entries[0].replace(/\D/g,'');
          if(digits.length<10||digits.length>15)throw new Error('allowlisted UAT recipient is invalid');
          const to=entries[0].startsWith('+')?entries[0]:(digits.length===10?`+91${digits}`:`+${digits}`);
          console.log('::add-mask::'+to);
          const cfgResp=await fetch(`https://api.elevenlabs.io/v1/convai/agents/${encodeURIComponent(agentId)}`,{headers:{'xi-api-key':key},signal:AbortSignal.timeout(30000)});
          const cfg=await cfgResp.json().catch(()=>({}));
          const prompt=cfg?.conversation_config?.agent?.prompt||{};
          console.log('GROOMING_AGENT_READY='+JSON.stringify({status:cfgResp.status,name:cfg?.name||null,llm:prompt?.llm||null,customUrl:prompt?.custom_llm?.url||null,apiType:prompt?.custom_llm?.api_type||null,modelId:prompt?.custom_llm?.model_id||null,authConfigured:Boolean(prompt?.custom_llm?.api_key),firstMessage:cfg?.conversation_config?.agent?.first_message||null}));
          if(!cfgResp.ok||prompt?.llm!=='custom-llm'||!prompt?.custom_llm?.url)throw new Error('Grooming agent is not ready for the controlled call');
          const response=await fetch('https://api.elevenlabs.io/v1/convai/exotel/outbound-call',{method:'POST',headers:{'content-type':'application/json','xi-api-key':key},body:JSON.stringify({agent_id:agentId,agent_phone_number_id:phoneId,to_number:to}),signal:AbortSignal.timeout(30000)});
          const body=await response.json().catch(()=>({}));
          if(!response.ok||body?.success!==true||!body?.conversation_id){console.log('GROOMING_CALL_ERROR='+JSON.stringify(body).slice(0,2500));throw new Error(`Grooming UAT call was not accepted: HTTP ${response.status}`);}
          const conversationId=String(body.conversation_id); if(body.callSid)console.log('::add-mask::'+String(body.callSid)); console.log('::add-mask::'+conversationId);
          console.log('GROOMING_CALL_ACCEPTED=yes');
          let detail=null;
          for(let i=0;i<15;i++){await new Promise(r=>setTimeout(r,4000));const r=await fetch(`https://api.elevenlabs.io/v1/convai/conversations/${encodeURIComponent(conversationId)}`,{headers:{'xi-api-key':key},signal:AbortSignal.timeout(20000)});if(r.ok){detail=await r.json();const status=String(detail?.status||'');const transcript=Array.isArray(detail?.transcript)?detail.transcript:[];console.log(`GROOMING_POLL status=${status} transcriptTurns=${transcript.length} hasAudio=${Boolean(detail?.has_audio)} hasUserAudio=${Boolean(detail?.has_user_audio)} hasResponseAudio=${Boolean(detail?.has_response_audio)}`);if(['done','failed','processing'].includes(status)||transcript.length>=2)break;}}
          if(!detail)throw new Error('Grooming conversation could not be inspected');
          const transcript=Array.isArray(detail.transcript)?detail.transcript:[];
          const safe=transcript.slice(0,8).map(t=>({role:t.role,message:String(t.message||'').replace(/\s+/g,' ').slice(0,500)}));
          console.log('GROOMING_CONVERSATION='+JSON.stringify({status:detail.status,agentId:detail.agent_id,agentName:detail.agent_name,hasAudio:Boolean(detail.has_audio),hasUserAudio:Boolean(detail.has_user_audio),hasResponseAudio:Boolean(detail.has_response_audio),turns:transcript.length,safeTranscript:safe}));
          if(String(detail.agent_id)!==agentId)throw new Error('Grooming call used the wrong ElevenLabs agent');
          if(String(detail.status)==='failed')throw new Error('Grooming ElevenLabs conversation failed');
          NODE
