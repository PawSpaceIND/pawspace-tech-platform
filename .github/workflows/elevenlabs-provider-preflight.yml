name: ElevenLabs and OpenAI provider preflight (no calls)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type no-calls, premium-maya-readiness, discover-premium-voices, measure-voice-llm, specialist-call, or direct-grooming-call.'
        required: true
        default: ''
      uat_voice_call_id:
        description: 'Exact UAT call context for confirm=resume-uat-voice (no dial)'
        required: false
        default: ''
      probe_input:
        description: 'Synthetic text for no-calls custom LLM probe'
        required: false
        default: 'I need grooming today for my dog.'
      expected_destination_last4:
        description: 'Required for direct-grooming-call: last four digits confirmed by the tester'
        required: false
        default: ''
      sale_booking_id:
        description: "Exact voice-created booking for sandbox sale proof; blank inspects readiness only"
        required: false
        default: ""
      expected_staging_sha:
        description: "Exact certified staging revision for spoken sandbox sale"
        required: false
        default: ""
      expected_tester_sha256:
        description: 'SHA-256 of the explicitly authorized tester mobile digits for fresh-launch inspection'
        required: false
        default: ''
      audio_profile:
        description: 'Human-call TTS profile: v3_conversational (recommended human-like), flash_v2_5, or flash_v2'
        required: false
        default: 'v3_conversational'
      attended_statement:
        description: 'After the call only: exact participant statement documented in VOICE_HANDSET_TRACE. Never infer confirmation.'
        required: false
        default: ''
      attended_reported_at:
        description: 'UTC time when the participant explicitly confirmed the exact call (ISO 8601 Z)'
        required: false
        default: ''
      specialist_customer_id:
        description: 'Exact existing canonical customer for the attended specialist demo; normal app ownership checks still apply'
        required: false
        default: ''
      specialist_use_case:
        description: 'grooming_sales or training_sales when confirm=specialist-call'
        required: false
        default: 'grooming_sales'
      demo_started_at:
        description: 'Exact failed synthetic demo interval start in UTC (read-only diagnosis)'
        required: false
        default: ''
      demo_ended_at:
        description: 'Exact failed synthetic demo interval end in UTC (maximum five minutes)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  inspect-agent-deadlines:
    if: ${{ inputs.confirm == 'inspect-agent-deadlines' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read current staging agent deadlines and voice metadata (no calls or changes)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {mkdir,writeFile} from 'node:fs/promises';
          const key=process.env.ELEVENLABS_API_KEY,id=process.env.GROOMING_AGENT_ID;
          if(!key||!id)throw Error('Staging agent read prerequisites missing');
          const headers={'xi-api-key':key};
          const r=await fetch('https://api.elevenlabs.io/v1/convai/agents/'+encodeURIComponent(id),{headers,signal:AbortSignal.timeout(15000)});
          if(!r.ok)throw Error('Agent configuration read refused: '+r.status);
          const body=await r.json(),c=body.conversation_config,p=c?.agent?.prompt,t=c?.turn,v=c?.tts;
          if(p?.custom_llm?.url!=='https://pawspace-staging.karthik-fce.workers.dev/api/elevenlabs/v1')throw Error('Exact isolated staging brain is required');
          let voice={metadataReadable:false};
          if(v?.voice_id){const vr=await fetch('https://api.elevenlabs.io/v1/voices/'+encodeURIComponent(v.voice_id),{headers,signal:AbortSignal.timeout(15000)});if(vr.ok){const x=await vr.json();voice={metadataReadable:true,name:x.name??null,category:x.category??null,labels:x.labels??null};}else voice={metadataReadable:false,httpStatus:vr.status};}
          const report={dialed:false,configurationChanged:false,stagingBrain:true,agentModel:p.llm??null,cascadeTimeoutSeconds:p.cascade_timeout_seconds??null,ttsModel:v?.model_id??null,stability:v?.stability??null,speed:v?.speed??null,expressive:v?.expressive_mode===true,turnTimeoutSeconds:t?.turn_timeout??null,softTimeoutSeconds:t?.soft_timeout_config?.timeout_seconds??null,softTimeoutMessage:t?.soft_timeout_config?.message??null,voice};
          await mkdir('artifacts/agent-deadlines',{recursive:true});await writeFile('artifacts/agent-deadlines/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: maya-agent-deadlines
          path: artifacts/agent-deadlines/report.json
          retention-days: 3
  evaluate-runtime-sale:
    if: ${{ inputs.confirm == 'evaluate-runtime-sale' || inputs.confirm == 'evaluate-runtime-concierge' || inputs.confirm == 'evaluate-runtime-all-services' || inputs.confirm == 'evaluate-runtime-all-bookings' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Evaluate actual sales runtime with synthetic database and mocked payments (no calls)
        env:
          VOICE_SALE_ACTION: evaluate-runtime-sale
          VOICE_SALE_SCENARIO: ${{ inputs.confirm == 'evaluate-runtime-all-bookings' && 'all-bookings' || inputs.confirm == 'evaluate-runtime-all-services' && 'all-services' || inputs.confirm == 'evaluate-runtime-concierge' && 'concierge' || 'booking' }}
          PAWSPACE_OPENAI_API_KEY: ${{ secrets.PAWSPACE_OPENAI_API_KEY }}
          PAWSPACE_AI_VOICE_MODEL: ${{ vars.PAWSPACE_AI_VOICE_MODEL }}
          PAWSPACE_LOCAL_PREVIEW: 'on'
          PAWSPACE_VOICE_TRANSPORT: local_simulator_non_production
          PAWSPACE_TEST_SERVICE_DISCOVERY_FIXTURE: 'on'
          PAWSPACE_PAYMENT_ENV: sandbox
          PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
          NODE_ENV: test
          APP_ENV: staging
          FORBID_PRODUCTION: 'true'
        run: node --experimental-strip-types scripts/evaluate-maya-runtime-sale.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maya-isolated-runtime-sale
          path: artifacts/maya-runtime-sale/report.json
          retention-days: 3
          if-no-files-found: ignore
  evaluate-sales-dialogue:
    if: ${{ inputs.confirm == 'evaluate-sales-dialogue' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Evaluate synthetic multi-turn sales dialogue without application or phone access
        env:
          VOICE_SALE_ACTION: evaluate-sales-dialogue
          PAWSPACE_OPENAI_API_KEY: ${{ secrets.PAWSPACE_OPENAI_API_KEY }}
          PAWSPACE_AI_PROVIDER_API_KEY: ${{ secrets.PAWSPACE_AI_PROVIDER_API_KEY }}
          PAWSPACE_AI_VOICE_MODEL: ${{ vars.PAWSPACE_AI_VOICE_MODEL }}
        run: node --experimental-strip-types scripts/evaluate-maya-sales-dialogue.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maya-synthetic-sales-dialogue
          path: artifacts/maya-dialogue/report.json
          retention-days: 3
          if-no-files-found: ignore
  inspect-attended-request:
    if: ${{ inputs.confirm == 'inspect-attended-request' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Inspect exact attended request without dialing or modifying records
        env:
          DEMO_STARTED_AT: ${{ inputs.demo_started_at }}
          DEMO_ENDED_AT: ${{ inputs.demo_ended_at }}
          SPECIALIST_CUSTOMER_ID: ${{ inputs.specialist_customer_id }}
          EXPECTED_TESTER_SHA256: ${{ inputs.expected_tester_sha256 }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          ELEVENLABS_API_BASE: ${{ vars.ELEVENLABS_API_BASE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
        run: node --experimental-strip-types scripts/inspect-attended-request.mjs
  diagnose-voice-demo:
    if: ${{ inputs.confirm == 'diagnose-voice-demo' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Inspect the exact failed synthetic session without dialing or generating
        env:
          DEMO_STARTED_AT: ${{ inputs.demo_started_at }}
          DEMO_ENDED_AT: ${{ inputs.demo_ended_at }}
          SPECIALIST_CUSTOMER_ID: ${{ inputs.specialist_customer_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          ELEVENLABS_API_BASE: ${{ vars.ELEVENLABS_API_BASE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
        run: node scripts/diagnose-voice-demo.mjs
  pause-staging-phone-calls:
    if: ${{ inputs.confirm == 'pause-staging-phone-calls' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply the user-requested phone stop and verify live staging gates
        env:
          PAUSE_PHONE_CALLS: user-requested-stop
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
        run: node scripts/pause-staging-phone-calls.mjs
  demo-three-voice-conversations:
    if: ${{ inputs.confirm == 'demo-three-voice-conversations' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    concurrency:
      group: pawspace-staging-sweep
      cancel-in-progress: false
      queue: max
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install synthetic microphone tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Run three actual audio conversations without dialing
        env:
          EXPECTED_SHA: ${{ inputs.expected_staging_sha }}
          EXPECTED_TESTER_SHA256: ${{ inputs.expected_tester_sha256 }}
          SPECIALIST_CUSTOMER_ID: ${{ inputs.specialist_customer_id }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          ELEVENLABS_API_BASE: ${{ vars.ELEVENLABS_API_BASE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
        run: node --experimental-strip-types scripts/demo-three-voice-conversations.mjs
      - name: Save actual demo transcripts and response audio
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maya-three-voice-demos
          path: voice-demo-results/
          retention-days: 7
  maya-ten-audio-audit:
    if: ${{ inputs.confirm == 'maya-ten-audio-audit' }}
    runs-on: ubuntu-22.04
    environment: pawspace-staging
    concurrency:
      group: pawspace-staging-sweep
      cancel-in-progress: false
      queue: max
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install synthetic microphone tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Run ten multi-turn actual audio conversations without dialing
        env:
          EXPECTED_SHA: ${{ inputs.expected_staging_sha }}
          EXPECTED_TESTER_SHA256: ${{ inputs.expected_tester_sha256 }}
          SPECIALIST_CUSTOMER_ID: ${{ inputs.specialist_customer_id }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          ELEVENLABS_API_BASE: ${{ vars.ELEVENLABS_API_BASE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
        run: node --experimental-strip-types scripts/maya-ten-audio-audit.mjs
      - name: Save actual demo transcripts and response audio
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maya-ten-audio-audit
          path: voice-audit-results/
          retention-days: 7
  diagnose-native-audio:
    if: ${{ inputs.confirm == 'diagnose-native-audio' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Inspect the attended native call and probe synthetic greeting without dialing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
          EXPECTED_TESTER_SHA256: ${{ inputs.expected_tester_sha256 }}
        run: node --experimental-strip-types scripts/diagnose-native-voice-audio.mjs
  # Answers "would streaming actually help, and by how much" without involving staging at all.
  # The shared staging Worker is deployed by several workstreams, so a measurement that needs a
  # particular build to still be live is a race this cannot reliably win. The provider is the same
  # one the Worker calls, so time-to-first-token measured here is the floor the voice turn can reach.
  measure-voice-llm:
    if: ${{ inputs.confirm == 'measure-voice-llm' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Compare blocking and streaming provider latency for one voice turn
        env:
          PAWSPACE_OPENAI_API_KEY: ${{ secrets.PAWSPACE_OPENAI_API_KEY }}
          PAWSPACE_AI_PROVIDER_API_KEY: ${{ secrets.PAWSPACE_AI_PROVIDER_API_KEY }}
          PAWSPACE_AI_PROVIDER: ${{ vars.PAWSPACE_AI_PROVIDER }}
          PAWSPACE_AI_VOICE_MODEL: ${{ vars.PAWSPACE_AI_VOICE_MODEL }}
          PAWSPACE_AI_PROVIDER_MODEL: ${{ vars.PAWSPACE_AI_PROVIDER_MODEL }}
        run: |
          node <<'NODE'
          // Synthetic prompt only: no customer, pet, booking or catalogue data leaves this job.
          const key=String(process.env.PAWSPACE_OPENAI_API_KEY||process.env.PAWSPACE_AI_PROVIDER_API_KEY||'').trim();
          if(!key) throw new Error('no provider credential');
          const configuredVoice=String(process.env.PAWSPACE_AI_VOICE_MODEL||'').trim();
          const configuredMain=String(process.env.PAWSPACE_AI_PROVIDER_MODEL||'').trim();
          const DEFAULT_VOICE='gpt-5.6-luna';
          const model=configuredVoice||configuredMain||DEFAULT_VOICE;
          console.log('MODEL_RESOLUTION='+JSON.stringify({
            providerVar:String(process.env.PAWSPACE_AI_PROVIDER||'').trim()||null,
            voiceModelVar:configuredVoice||null,mainModelVar:configuredMain||null,
            resolvedModel:model,isVoiceDefault:model===DEFAULT_VOICE,
            reasoningShortcutApplies:model===DEFAULT_VOICE}));
          const instructions='You are PawSpace’s AI grooming concierge on a live phone call in India. Keep every spoken reply to one or two short natural sentences and ask only the next necessary question.';
          const input='I need grooming today for my dog.';
          const base={model,instructions,input,max_output_tokens:160,store:false,...(model===DEFAULT_VOICE?{reasoning:{effort:'none'}}:{})};
          const url='https://api.openai.com/v1/responses';
          const headers={'content-type':'application/json',authorization:'Bearer '+key};

          const blocking=async()=>{const t=Date.now();const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(base),signal:AbortSignal.timeout(60000)});const body=await r.text();return{status:r.status,totalMs:Date.now()-t,chars:body.length};};

          const streaming=async()=>{
            const t=Date.now();
            const r=await fetch(url,{method:'POST',headers,body:JSON.stringify({...base,stream:true}),signal:AbortSignal.timeout(60000)});
            const {measureVoiceStream}=await import('./scripts/voice-stream-latency.mjs');
            return measureVoiceStream(r,t);
          };

          // Wrapped in an async IIFE: piped over stdin this is parsed as a script, where `await`
          // inside a loop body is a syntax error rather than top-level await.
          (async()=>{
            for(let run=1;run<=2;run++){
              console.log('BLOCKING_'+run+'='+JSON.stringify(await blocking()));
              console.log('STREAMING_'+run+'='+JSON.stringify(await streaming()));
            }
          })().catch(error=>{console.error(String(error&&error.message||error));process.exit(1);});
          NODE

  preflight:
    if: ${{ inputs.confirm == 'no-calls' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read agent and verify one synthetic OpenAI reply without business data
        env:
          PAWSPACE_OPENAI_API_KEY: ${{ secrets.PAWSPACE_OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_ID: ${{ secrets.ELEVENLABS_AGENT_ID }}
        run: node scripts/elevenlabs-provider-preflight.mjs
      - name: Inspect ElevenLabs imported phone bridge metadata (no call)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_PHONE_NUMBER_ID: ${{ secrets.ELEVENLABS_AGENT_PHONE_NUMBER_ID }}
          EXOTEL_CALLER_ID: ${{ secrets.EXOTEL_CALLER_ID }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
          TRAINING_AGENT_ID: ${{ vars.ELEVENLABS_TRAINING_AGENT_ID }}
        run: |
          node <<'NODE'
          const key=String(process.env.ELEVENLABS_API_KEY||'').trim();
          const expectedId=String(process.env.ELEVENLABS_AGENT_PHONE_NUMBER_ID||'').trim();
          if(!key) throw new Error('ELEVENLABS_API_KEY missing');
          const headers={'xi-api-key':key};
          const listResponse=await fetch('https://api.elevenlabs.io/v1/convai/phone-numbers',{headers,signal:AbortSignal.timeout(30000)});
          const list=await listResponse.json().catch(()=>({}));
          if(!listResponse.ok) throw new Error('phone list failed '+listResponse.status);
          const rows=Array.isArray(list?.phone_numbers)?list.phone_numbers:Array.isArray(list)?list:[];
          const safeRows=rows.map(x=>({
            phoneNumberId:x.phone_number_id||x.id||null,label:x.label||null,provider:x.provider||null,
            phoneLast4:String(x.phone_number||'').replace(/\D/g,'').slice(-4)||null,
            agentId:x.agent_id||null,inboundAgentId:x.inbound_agent_id||null,outboundAgentId:x.outbound_agent_id||null,
            hasAccountSid:Boolean(x.account_sid),hasApiKey:Boolean(x.api_key),hasApiToken:Boolean(x.api_token),
            appId:x.app_id||null,region:x.region||x.api_subdomain||null
          }));
          console.log('PHONE_LIST_SAFE='+JSON.stringify(safeRows));
          console.log('EXPECTED_PHONE_ID_PRESENT='+String(safeRows.some(x=>x.phoneNumberId===expectedId)));
          if(expectedId){
            const detailResponse=await fetch('https://api.elevenlabs.io/v1/convai/phone-numbers/'+encodeURIComponent(expectedId),{headers,signal:AbortSignal.timeout(30000)});
            const d=await detailResponse.json().catch(()=>({}));
            console.log('EXPECTED_PHONE_DETAIL_STATUS='+detailResponse.status);
            if(detailResponse.ok) console.log('EXPECTED_PHONE_DETAIL='+JSON.stringify({
              phoneNumberId:d.phone_number_id||d.id||null,label:d.label||null,provider:d.provider||null,
              phoneLast4:String(d.phone_number||'').replace(/\D/g,'').slice(-4)||null,
              agentId:d.agent_id||null,inboundAgentId:d.inbound_agent_id||null,outboundAgentId:d.outbound_agent_id||null,
              hasAccountSid:Boolean(d.account_sid),hasApiKey:Boolean(d.api_key),hasApiToken:Boolean(d.api_token),
              appId:d.app_id||null,region:d.region||d.api_subdomain||null
            }));
            else console.log('EXPECTED_PHONE_ERROR='+JSON.stringify(d).slice(0,1500));
          }
          console.log('SPECIALIST_IDS='+JSON.stringify({grooming:Boolean(process.env.GROOMING_AGENT_ID),training:Boolean(process.env.TRAINING_AGENT_ID)}));
          const ar=await fetch('https://api.elevenlabs.io/v1/convai/agents/'+encodeURIComponent(String(process.env.GROOMING_AGENT_ID||'')),{headers:{'xi-api-key':key},signal:AbortSignal.timeout(30000)});
          const aj=await ar.json().catch(()=>({}));
          if(ar.ok){
            const cc=aj?.conversation_config||{},agent=cc?.agent||{},tts=cc?.tts||{},turn=cc?.turn||{},asr=cc?.asr||{};
            console.log('GROOMING_AGENT_AUDIO_SAFE='+JSON.stringify({
              firstMessage:agent?.first_message||null,
              customLlmModel:agent?.prompt?.custom_llm?.model_id||null,
              language:agent?.language||null,
              tts:{modelId:tts?.model_id||tts?.model||null,voiceId:Boolean(tts?.voice_id),stability:tts?.stability??null,similarityBoost:tts?.similarity_boost??null,speed:tts?.speed??null,style:tts?.style??null,optimizeStreamingLatency:tts?.optimize_streaming_latency??null},
              turn:{turnTimeout:turn?.turn_timeout??null,silenceEndCallTimeout:turn?.silence_end_call_timeout??null,mode:turn?.mode||null,softTimeout:turn?.soft_timeout??null},
              asr:{provider:asr?.provider||null,quality:asr?.quality||null,language:asr?.language||null}
            }));
