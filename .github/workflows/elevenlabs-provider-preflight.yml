name: ElevenLabs and OpenAI provider preflight (no calls)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type no-calls. Makes one synthetic OpenAI request and reads the existing global ElevenLabs agent. No calls or conversations.'
        required: true
        default: ''
permissions:
  contents: read
jobs:
  preflight:
    if: ${{ inputs.confirm == 'no-calls' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read agent and verify one synthetic OpenAI reply without business data
        env:
          PAWSPACE_OPENAI_API_KEY: ${{ secrets.PAWSPACE_OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_ID: ${{ secrets.ELEVENLABS_AGENT_ID }}
        run: node scripts/elevenlabs-provider-preflight.mjs
      - name: Simulate Grooming and Training specialist sales conversations (no call)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
          TRAINING_AGENT_ID: ${{ vars.ELEVENLABS_TRAINING_AGENT_ID }}
        run: |
          node <<'NODE'
          const key=String(process.env.ELEVENLABS_API_KEY||'').trim();
          const agents=[['grooming',String(process.env.GROOMING_AGENT_ID||'').trim(),"I have a 3-year-old Labrador in Bengaluru and want grooming this weekend. Please understand what I need, explain the suitable one-time or subscription options using PawSpace data, and help me move toward a booking without inventing price or availability."],['training',String(process.env.TRAINING_AGENT_ID||'').trim(),"I have a young dog that pulls on walks and ignores recall. Please understand my needs, recommend the suitable PawSpace training path or assessment using real PawSpace data, and help me move toward a booking without inventing price or availability."]];
          if(!key||agents.some(([,id])=>!id))throw new Error('specialist simulation prerequisites missing');
          for(const [label,id,message] of agents){
            const cfgResponse=await fetch(`https://api.elevenlabs.io/v1/convai/agents/${encodeURIComponent(id)}`,{headers:{'xi-api-key':key},signal:AbortSignal.timeout(30000)});
            const cfg=await cfgResponse.json().catch(()=>({}));
            const prompt=cfg?.conversation_config?.agent?.prompt||{};
            console.log(`${label.toUpperCase()}_CONFIG=${JSON.stringify({status:cfgResponse.status,name:cfg?.name||null,llm:prompt?.llm||null,customUrl:prompt?.custom_llm?.url||null,apiType:prompt?.custom_llm?.api_type||null,modelId:prompt?.custom_llm?.model_id||null,authConfigured:Boolean(prompt?.custom_llm?.api_key),firstMessage:cfg?.conversation_config?.agent?.first_message||null,phoneCount:Array.isArray(cfg?.phone_numbers)?cfg.phone_numbers.length:0})}`);
            const response=await fetch(`https://api.elevenlabs.io/v1/convai/agents/${encodeURIComponent(id)}/simulate-conversation`,{method:'POST',headers:{'content-type':'application/json','xi-api-key':key},body:JSON.stringify({simulation_specification:{simulated_user_config:{first_message:message,language:'en',disable_first_message_interruptions:false}},new_turns_limit:8}),signal:AbortSignal.timeout(120000)});
            const body=await response.json().catch(()=>({}));
            if(!response.ok){console.log(`${label.toUpperCase()}_SIM_ERROR=${JSON.stringify(body).slice(0,2500)}`);throw new Error(`${label} simulation failed: HTTP ${response.status}`);}
            const turns=Array.isArray(body.simulated_conversation)?body.simulated_conversation:[];
            const agentTurns=turns.filter(t=>String(t.role)==='agent');
            if(!agentTurns.length)throw new Error(`${label} simulation returned no agent turn`);
            const joined=agentTurns.map(t=>String(t.message||'')).join(' ').toLowerCase();
            if(/guaranteed|definitely available|confirmed slot/.test(joined))throw new Error(`${label} agent made an ungrounded certainty claim`);
            console.log(`${label.toUpperCase()}_SPECIALIST_SIMULATION=PASS turns=${turns.length} agentTurns=${agentTurns.length}`);
            console.log(`${label.toUpperCase()}_SAMPLE=${agentTurns.slice(0,2).map(t=>String(t.message||'').replace(/\s+/g,' ').slice(0,700)).join(' | ')}`);
          }
          NODE
