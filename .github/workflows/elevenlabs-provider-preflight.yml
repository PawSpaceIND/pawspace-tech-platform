  tune-grooming-audio:
    if: ${{ inputs.confirm == 'tune-grooming-audio' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Tune Grooming agent for clear phone conversation
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
          TRAINING_AGENT_ID: ${{ vars.ELEVENLABS_TRAINING_AGENT_ID }}
          AUDIO_PROFILE: ${{ inputs.audio_profile }}
          ELEVENLABS_VOICE_HI_ID: ${{ vars.ELEVENLABS_VOICE_HI_ID }}
          ELEVENLABS_VOICE_TA_ID: ${{ vars.ELEVENLABS_VOICE_TA_ID }}
          ELEVENLABS_VOICE_ML_ID: ${{ vars.ELEVENLABS_VOICE_ML_ID }}
          ELEVENLABS_VOICE_TE_ID: ${{ vars.ELEVENLABS_VOICE_TE_ID }}
          ELEVENLABS_VOICE_PA_ID: ${{ vars.ELEVENLABS_VOICE_PA_ID }}
          ELEVENLABS_VOICE_MR_ID: ${{ vars.ELEVENLABS_VOICE_MR_ID }}
          ELEVENLABS_VOICE_BN_ID: ${{ vars.ELEVENLABS_VOICE_BN_ID }}
          ELEVENLABS_VOICE_KN_ID: ${{ vars.ELEVENLABS_VOICE_KN_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {humanCallProfile, humanCallPrompt} from './lib/elevenlabs-human-call-profile.mjs';
          import {premiumLanguagePresets,languageDetectionTool,premiumLanguagePrompt,premiumLanguageReadiness} from './lib/elevenlabs-language-profile.mjs';
          const key=String(process.env.ELEVENLABS_API_KEY||'').trim();
          const agents=[
            {label:'GROOMING',agentId:String(process.env.GROOMING_AGENT_ID||'').trim(),keywords:['PawSpace','Salarpuria Greenage','German Shepherd','Essential Bath','Bath and Basic','Just Trim','Complete Makeover','UPI']},
            {label:'TRAINING',agentId:String(process.env.TRAINING_AGENT_ID||'').trim(),keywords:['PawSpace','Dog Training','Puppy Training','Meet and Greet','toilet training','walking','basic cues','UPI']}
          ];
          const profile=humanCallProfile(process.env.AUDIO_PROFILE||'v3_conversational');
          const voiceIds={hi:process.env.ELEVENLABS_VOICE_HI_ID,ta:process.env.ELEVENLABS_VOICE_TA_ID,ml:process.env.ELEVENLABS_VOICE_ML_ID,te:process.env.ELEVENLABS_VOICE_TE_ID,pa:process.env.ELEVENLABS_VOICE_PA_ID,mr:process.env.ELEVENLABS_VOICE_MR_ID,bn:process.env.ELEVENLABS_VOICE_BN_ID,kn:process.env.ELEVENLABS_VOICE_KN_ID};
          const languagePresets=premiumLanguagePresets(voiceIds);
          if(!key||agents.some(agent=>!agent.agentId)) throw new Error('ElevenLabs specialist tuning prerequisites missing');
          const headers={'xi-api-key':key,'content-type':'application/json'};
          for(const {label,agentId,keywords} of agents){
            const read=await fetch('https://api.elevenlabs.io/v1/convai/agents/'+encodeURIComponent(agentId),{headers:{'xi-api-key':key},signal:AbortSignal.timeout(30000)});
            const current=await read.json().catch(()=>({}));
            if(!read.ok) throw new Error(label+' agent read failed '+read.status);
            const currentAgent=current?.conversation_config?.agent||{},currentPrompt=currentAgent?.prompt||{},currentTts=current?.conversation_config?.tts||{},currentTurn=current?.conversation_config?.turn||{},currentAsr=current?.conversation_config?.asr||{};
            const voiceId=currentTts.voice_id;
            if(!voiceId) throw new Error(label+' agent voice_id missing');
            if(currentPrompt?.llm!=='custom-llm'||currentPrompt?.custom_llm?.url!=='https://pawspace-staging.karthik-fce.workers.dev/api/elevenlabs/v1')throw new Error(label+' exact isolated staging custom brain required');
            const voiceRead=await fetch('https://api.elevenlabs.io/v1/voices/'+encodeURIComponent(voiceId),{headers:{'xi-api-key':key},signal:AbortSignal.timeout(30000)});
            const voiceMeta=await voiceRead.json().catch(()=>({}));
            if(voiceRead.ok) console.log(label+'_VOICE_SAFE='+JSON.stringify({name:voiceMeta.name||null,category:voiceMeta.category||null,labels:voiceMeta.labels||null}));
            const body={
              conversation_config:{
                agent:{
                  ...currentAgent,
                  first_message:"Hi, this is Maya from PawSpace. How can I help with your pet today?",
                  hinglish_mode:true,
                  max_conversation_duration_message:"I want to make sure we finish this properly. This call is reaching its time limit, so I can have a PawSpace teammate continue with you.",
                  prompt:{
                    ...currentPrompt,
                    cascade_timeout_seconds:15,
                    prompt:premiumLanguagePrompt(humanCallPrompt(currentPrompt?.prompt)),
                    built_in_tools:{
                      ...(currentPrompt?.built_in_tools||{}),
                      language_detection:languageDetectionTool(currentPrompt?.built_in_tools?.language_detection)
                    }
                  }
                },
                asr:{
                  ...currentAsr,
                  keywords:[...new Set([...keywords,...(Array.isArray(currentAsr.keywords)?currentAsr.keywords:[])])].slice(0,100)
                },
                tts:{
                  ...currentTts,
                  model_id:profile.modelId,
                  voice_id:voiceId,
                  stability:profile.stability,
                  similarity_boost:profile.similarityBoost,
                  speed:profile.speed,
                  optimize_streaming_latency:profile.optimizeStreamingLatency,
                  expressive_mode:profile.expressiveMode===true
                },
                conversation:{
                  ...(current?.conversation_config?.conversation||{}),
                  max_duration_seconds:600
                },
                language_presets:languagePresets,
                turn:{
                  ...currentTurn,
                  turn_timeout:10,
                  silence_end_call_timeout:90,
                  turn_eagerness:'normal',
                  turn_model:'turn_v3',
                  soft_timeout_config:{
                    ...(currentTurn?.soft_timeout_config||{}),
                    timeout_seconds:3,
                    message:"I'm checking that for you.",
                    max_soft_timeouts_per_generation:1
                  }
                }
              }
            };
            const patch=await fetch('https://api.elevenlabs.io/v1/convai/agents/'+encodeURIComponent(agentId),{
              method:'PATCH',headers,body:JSON.stringify(body),signal:AbortSignal.timeout(30000)
            });
            const result=await patch.json().catch(()=>({}));
            if(!patch.ok){console.log(JSON.stringify(result).slice(0,2000));throw new Error(label+' agent update failed '+patch.status);}
            const cc=result?.conversation_config||{},tts=cc?.tts||{},turn=cc?.turn||{},agent=cc?.agent||{};
            if(cc?.agent?.prompt?.cascade_timeout_seconds!==15)throw new Error(label+' model response window did not persist');
            const languageReady=premiumLanguageReadiness(cc);
            if(!languageReady.allLanguagesConfigured||!languageReady.languageDetection)throw new Error(label+' premium multilingual configuration did not persist');
            console.log(label+'_MULTILINGUAL_READY='+JSON.stringify({
              configuredCodes:languageReady.configuredCodes,
              languageDetection:languageReady.languageDetection,
              localizedVoiceCodes:languageReady.localizedVoiceCodes,
              localizedVoicesComplete:languageReady.localizedVoicesComplete,
              premiumCertified:languageReady.premiumCertified
            }));
            console.log(label+'_AUDIO_TUNED='+JSON.stringify({
              modelResponseWindowSeconds:cc?.agent?.prompt?.cascade_timeout_seconds??null,
              profile:profile.id,
              firstMessage:agent.first_message||null,
              modelId:tts.model_id||null,
              stability:tts.stability??null,
              similarityBoost:tts.similarity_boost??null,
              speed:tts.speed??null,
              turnTimeout:turn.turn_timeout??null,
              silenceEndCallTimeout:turn.silence_end_call_timeout??null,
              turnModel:turn.turn_model||null,
              softTimeoutSeconds:turn?.soft_timeout_config?.timeout_seconds??null,
              expressiveMode:tts.expressive_mode===true,
              maxDurationSeconds:cc?.conversation?.max_duration_seconds??null
            }));
          }
          NODE

  discover-premium-voices:
