        env:
          ELEVENLABS_API_BASE: ${{ vars.ELEVENLABS_API_BASE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/discover-premium-maya-voices.mjs

