              startTime:cd.start_time||null,endTime:cd.end_time||null,totalDuration:cd.total_duration??null,totalTalkTime:cd.total_talk_time??null,
              appId:cd.app_id||null,appName:cd.app_name||null,legs:cd.legs||null
            }));
            if(cd.legs){
              const legsUrl='https://'+ccmHost+String(cd.legs);
              const lr=await fetch(legsUrl,{headers:{authorization:auth,'content-type':'application/json'},signal:AbortSignal.timeout(30000)});
              const lj=await lr.json().catch(()=>({}));
              console.log('LEGS_HTTP='+lr.status);
              const raw=lj?.response?.legs||lj?.legs||lj?.response||lj;
              const legs=Array.isArray(raw)?raw:[];
              console.log('LEGS_SAFE='+JSON.stringify(legs.map(x=>({
                direction:x.direction||null,state:x.state||null,terminalStatus:x.terminal_status||x.status||null,
                networkType:x.network_type||null,onCallDurationMs:Number(x.on_call_duration_ms||0),
                bridgeStatus:x?.additional_info?.bridge_status||null,txAudioStatus:x?.additional_info?.tx_audio_status||null,rxAudioStatus:x?.additional_info?.rx_audio_status||null
              }))));
