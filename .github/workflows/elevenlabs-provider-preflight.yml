          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
        run: |
          node --experimental-strip-types scripts/attended-voice-window.mjs
      - name: Place one controlled PawSpace specialist UAT call and inspect ElevenLabs
        env:
          ELEVENLABS_API_BASE: ${{ vars.ELEVENLABS_API_BASE }}
          PILOT_ACTION: ${{ inputs.confirm }}
          EXPECTED_TESTER_SHA256: ${{ inputs.expected_tester_sha256 }}
          SPECIALIST_CUSTOMER_ID: ${{ inputs.specialist_customer_id }}
          EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
          EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
          EXOTEL_SID: ${{ secrets.EXOTEL_SID }}
          EXOTEL_SUBDOMAIN: ${{ vars.EXOTEL_SUBDOMAIN }}
          SPECIALIST_USE_CASE: ${{ inputs.specialist_use_case }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
