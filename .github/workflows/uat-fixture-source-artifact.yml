name: UAT Fixture Source Artifact

on:
  push:
    branches:
      - fix/uat-test-fixture-convergence-20260901

permissions:
  contents: write

jobs:
  apply-fixtures:
    if: github.event.head_commit.message != 'test: converge remaining UAT fixture contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified test-only fixture batch
        shell: bash
        run: |
          set -euo pipefail
          echo '[... ELLIPSIZATION ...][... ELLIPSIZATION ...]' | base64 -d | tar -xzf -
          git config user.name 'PawSpace UAT Convergence'
          git config user.email 'engineering@pawspace.in'
          git add tests/ptja-w2-marketing-regressions.test.mjs tests/city-propagation-closure.test.mjs tests/scheduling-hardening.test.mjs tests/stay-lifecycle-hardening.test.mjs tests/training-hardening.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: converge remaining UAT fixture contracts'
          git push origin HEAD:fix/uat-test-fixture-convergence-20260901
