name: UAT Fixture Source Artifact

on:
  push:
    branches:
      - fix/uat-test-fixture-convergence-20260901

permissions:
  contents: write

jobs:
  apply-fixtures:
    if: github.event.head_commit.message != 'test: converge remaining UAT fixture contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact fixture payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/uat-fixture-chunks/chunk-* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tgz
          echo 'acf67973f01a28d0db3140b62d01a437170011e3198aad054c512486dd0518aa  /tmp/payload.tgz' | sha256sum -c -
          tar -xzf /tmp/payload.tgz
          node --check tests/ptja-w2-marketing-regressions.test.mjs
          node --check tests/city-propagation-closure.test.mjs
          node --check tests/scheduling-hardening.test.mjs
          node --check tests/stay-lifecycle-hardening.test.mjs
          node --check tests/training-hardening.test.mjs
          rm -rf .github/uat-fixture-chunks
          git config user.name 'PawSpace UAT Convergence'
          git config user.email 'engineering@pawspace.in'
          git add tests/ptja-w2-marketing-regressions.test.mjs tests/city-propagation-closure.test.mjs tests/scheduling-hardening.test.mjs tests/stay-lifecycle-hardening.test.mjs tests/training-hardening.test.mjs .github/uat-fixture-chunks
          git commit -m 'test: converge remaining UAT fixture contracts'
          git push origin HEAD:fix/uat-test-fixture-convergence-20260901
