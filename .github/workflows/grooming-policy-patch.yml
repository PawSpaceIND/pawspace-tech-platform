name: Wire Grooming commercial policy snapshot

on:
  push:
    branches:
      - grooming-integration-closure
    paths:
      - .github/workflows/grooming-policy-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Wire policy snapshot into canonical booking and change flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Canonical booking: capture city/zone policy snapshot and enforce multi-pet only when policy is explicitly in enforce mode.
          path=Path('app/api/canonical-bookings/route.ts')
          text=path.read_text()
          anchor='import {governGroomingBooking,subscriptionExpiry} from "../../../lib/grooming-governance";\n'
          extra='import {policySnapshot,policyVersion,resolveGroomingPolicy} from "../../../lib/grooming-policy-governance";\n'
          if extra not in text:
              if anchor not in text: raise SystemExit('canonical import anchor missing')
              text=text.replace(anchor,anchor+extra,1)
          old='  let governed:{packageCode:string;packageName:string;catalogueVersion?:string;offerType?:string;petCount:number;totalAmount:number;amountDueNow:number;subscriptionPlan?:SubscriptionPlan}={packageCode:input.packageCode,packageName:input.packageName,petCount:input.pets.length,totalAmount:input.totalAmount,amountDueNow:input.amountDueNow};\n  if(input.serviceCode==="grooming"){\n'
          new='  let governed:{packageCode:string;packageName:string;catalogueVersion?:string;offerType?:string;petCount:number;totalAmount:number;amountDueNow:number;subscriptionPlan?:SubscriptionPlan}={packageCode:input.packageCode,packageName:input.packageName,petCount:input.pets.length,totalAmount:input.totalAmount,amountDueNow:input.amountDueNow};\n  const commercialPolicy=input.serviceCode==="grooming"?await resolveGroomingPolicy(db,input.cityId,input.zoneId):null;\n  if(commercialPolicy?.enforcementMode==="enforce"&&input.pets.length>commercialPolicy.multiPetMax)return json({error:`This city policy supports up to ${commercialPolicy.multiPetMax} pets per Grooming booking`,policyVersion:policyVersion(commercialPolicy)},409);\n  if(input.serviceCode==="grooming"){\n'
          if old not in text: raise SystemExit('canonical governance anchor missing')
          text=text.replace(old,new,1)
          old='  const pricingJson={...input.pricing,catalogueVersion:governed.catalogueVersion,offerType:governed.offerType,subscription:subscriptionId??undefined,subscriptionPlanCode:governed.subscriptionPlan?.planCode,subscriptionConfig:governed.subscriptionPlan};\n'
          new='  const pricingJson={...input.pricing,catalogueVersion:governed.catalogueVersion,offerType:governed.offerType,subscription:subscriptionId??undefined,subscriptionPlanCode:governed.subscriptionPlan?.planCode,subscriptionConfig:governed.subscriptionPlan,commercialPolicy:commercialPolicy?policySnapshot(commercialPolicy):undefined};\n'
          if old not in text: raise SystemExit('canonical pricing anchor missing')
          text=text.replace(old,new,1)
          old='["booking_created","booking",bookingId,{serviceCode:input.serviceCode,packageName:governed.packageName,catalogueVersion:governed.catalogueVersion}]'
          new='["booking_created","booking",bookingId,{serviceCode:input.serviceCode,packageName:governed.packageName,catalogueVersion:governed.catalogueVersion,commercialPolicyVersion:commercialPolicy?policyVersion(commercialPolicy):undefined}]'
          if old not in text: raise SystemExit('canonical event anchor missing')
          text=text.replace(old,new,1)
          path.write_text(text)

          # Booking changes: evaluate the frozen policy snapshot. Observe mode preserves today's UAT behavior; enforce mode applies cutoff/refund/reschedule rules.
          path=Path('app/api/grooming-booking-change/route.ts')
          text=path.read_text()
          anchor='import{authError,requireCustomerOwnership,requirePermission,resolveActor,securityAudit}from"../../../lib/server-auth";\n'
          extra='import{evaluateBookingChange,parsePolicySnapshot,resolveGroomingPolicy}from"../../../lib/grooming-policy-governance";\n'
          if extra not in text:
              if anchor not in text: raise SystemExit('change import anchor missing')
              text=text.replace(anchor,anchor+extra,1)
          old='    const status=String(booking.status);\n    if(["completed","cancelled"].includes(status))return json({error:`Booking cannot be changed from ${status}`},409);\n    const work=await db.prepare("SELECT * FROM provider_work_orders WHERE booking_id=?").bind(input.bookingId).first<Row>();\n'
          new='    const status=String(booking.status);\n    let pricing:Record<string,unknown>={};try{pricing=JSON.parse(String(booking.pricing_json||"{}")) as Record<string,unknown>;}catch{}\n    const frozenPolicy=parsePolicySnapshot(pricing.commercialPolicy)??await resolveGroomingPolicy(db,String(booking.city_id),String(booking.zone_id),new Date(Number(booking.created_at||Date.now())));\n    const rescheduleHistory=await db.prepare("SELECT COUNT(*) count FROM booking_lifecycle_events WHERE booking_id=? AND event_type=\'booking_rescheduled\'").bind(input.bookingId).first<{count:number}>();\n    const policyEvaluation=evaluateBookingChange(frozenPolicy,{action:input.action,scheduledStart:String(booking.scheduled_start),status,bookingAmount:Number(booking.total_amount||0),rescheduleCount:Number(rescheduleHistory?.count||0)});\n    if(!policyEvaluation.allowed)return json({error:`Booking change is blocked by policy ${policyEvaluation.policyVersion}`,policy:policyEvaluation},409);\n    const work=await db.prepare("SELECT * FROM provider_work_orders WHERE booking_id=?").bind(input.bookingId).first<Row>();\n'
          if old not in text: raise SystemExit('change status anchor missing')
          text=text.replace(old,new,1)
          old='      const captured=["captured","paid"].includes(String(payment.status));\n      const refundId=captured?crypto.randomUUID():null;\n'
          new='      const captured=["captured","paid"].includes(String(payment.status));\n      const refundAmount=captured?Math.round(Number(payment.amount||0)*policyEvaluation.refundPercent)/100:0;\n      const refundId=refundAmount>0?crypto.randomUUID():null;\n'
          if old not in text: raise SystemExit('refund anchor missing')
          text=text.replace(old,new,1)
          old='        db.prepare("UPDATE booking_payments SET status=?,detail_json=json_set(detail_json,\'$.cancelReason\',?),updated_at=? WHERE booking_id=?").bind(captured?"refund_pending":"cancelled",reason,now,input.bookingId),\n'
          new='        db.prepare("UPDATE booking_payments SET status=?,detail_json=json_set(json_set(detail_json,\'$.cancelReason\',?),\'$.commercialPolicyEvaluation\',json(?)),updated_at=? WHERE booking_id=?").bind(refundAmount>0?"refund_pending":"cancelled",reason,JSON.stringify(policyEvaluation),now,input.bookingId),\n'
          if old not in text: raise SystemExit('payment cancel anchor missing')
          text=text.replace(old,new,1)
          old='      if(subscriptionId&&reservedSessions>0)statements.push(db.prepare("UPDATE customer_grooming_subscriptions SET sessions_reserved=MAX(0,sessions_reserved-?),status=CASE WHEN source_booking_id=? THEN ? ELSE status END,updated_at=? WHERE id=?").bind(reservedSessions,input.bookingId,captured?"refund_pending":"cancelled",now,subscriptionId));\n      if(refundId)statements.push(db.prepare("INSERT OR IGNORE INTO booking_refund_cases (id,booking_id,payment_id,amount,reason,status,requested_by,created_at,updated_at) VALUES (?,?,?,?,?,\'requested\',?,?,?)").bind(refundId,input.bookingId,payment.id,Number(payment.amount||0),reason,auditActor,now,now));\n'
          new='      if(subscriptionId&&reservedSessions>0)statements.push(db.prepare("UPDATE customer_grooming_subscriptions SET sessions_reserved=MAX(0,sessions_reserved-?),status=CASE WHEN source_booking_id=? THEN ? ELSE status END,updated_at=? WHERE id=?").bind(reservedSessions,input.bookingId,refundAmount>0?"refund_pending":"cancelled",now,subscriptionId));\n      if(refundId)statements.push(db.prepare("INSERT OR IGNORE INTO booking_refund_cases (id,booking_id,payment_id,amount,reason,status,requested_by,created_at,updated_at) VALUES (?,?,?,?,?,\'requested\',?,?,?)").bind(refundId,input.bookingId,payment.id,refundAmount,reason,auditActor,now,now));\n'
          if old not in text: raise SystemExit('refund case anchor missing')
          text=text.replace(old,new,1)
          old='      await event(db,input.bookingId,"booking_cancelled",auditActor,{customerId:input.customerId,reason,capacityReleased:true,paymentStatus:captured?"refund_pending":"cancelled",refundCaseId:refundId,subscriptionId:subscription?.id??null,subscriptionSessionsReleased:reservedSessions,subscriptionStatus:subscription?captured?"refund_pending":"cancelled":null},now);\n      await securityAudit(db,actor,"grooming.cancel","booking",input.bookingId,"completed",{customerId:input.customerId,refundCaseId:refundId,subscriptionId:subscription?.id??null,reservedSessions});\n      return json({data:{bookingId:input.bookingId,status:"cancelled",paymentStatus:captured?"refund_pending":"cancelled",refundCaseId:refundId,capacityReleased:true,subscriptionSessionsReleased:reservedSessions}});\n'
          new='      await event(db,input.bookingId,"booking_cancelled",auditActor,{customerId:input.customerId,reason,capacityReleased:true,paymentStatus:refundAmount>0?"refund_pending":"cancelled",refundCaseId:refundId,refundAmount,policy:policyEvaluation,subscriptionId:subscription?.id??null,subscriptionSessionsReleased:reservedSessions,subscriptionStatus:subscription?refundAmount>0?"refund_pending":"cancelled":null},now);\n      await securityAudit(db,actor,"grooming.cancel","booking",input.bookingId,"completed",{customerId:input.customerId,refundCaseId:refundId,refundAmount,policy:policyEvaluation,subscriptionId:subscription?.id??null,reservedSessions});\n      return json({data:{bookingId:input.bookingId,status:"cancelled",paymentStatus:refundAmount>0?"refund_pending":"cancelled",refundCaseId:refundId,refundAmount,policy:policyEvaluation,capacityReleased:true,subscriptionSessionsReleased:reservedSessions}});\n'
          if old not in text: raise SystemExit('cancel response anchor missing')
          text=text.replace(old,new,1)
          old='    await event(db,input.bookingId,"booking_rescheduled",auditActor,{customerId:input.customerId,from:{scheduledStart:oldStart,scheduledEnd:oldEnd},to:{scheduledStart:start.toISOString(),scheduledEnd:end.toISOString()},providerId,capacityRevalidated:true},now);\n    await securityAudit(db,actor,"grooming.reschedule","booking",input.bookingId,"completed",{customerId:input.customerId,providerId});\n    return json({data:{bookingId:input.bookingId,status:"assigned",scheduledStart:start.toISOString(),scheduledEnd:end.toISOString(),providerId}});\n'
          new='    await event(db,input.bookingId,"booking_rescheduled",auditActor,{customerId:input.customerId,from:{scheduledStart:oldStart,scheduledEnd:oldEnd},to:{scheduledStart:start.toISOString(),scheduledEnd:end.toISOString()},providerId,capacityRevalidated:true,policy:policyEvaluation,rescheduleFeeAmount:policyEvaluation.feeAmount},now);\n    await securityAudit(db,actor,"grooming.reschedule","booking",input.bookingId,"completed",{customerId:input.customerId,providerId,policy:policyEvaluation,rescheduleFeeAmount:policyEvaluation.feeAmount});\n    return json({data:{bookingId:input.bookingId,status:"assigned",scheduledStart:start.toISOString(),scheduledEnd:end.toISOString(),providerId,policy:policyEvaluation,rescheduleFeeAmount:policyEvaluation.feeAmount}});\n'
          if old not in text: raise SystemExit('reschedule response anchor missing')
          text=text.replace(old,new,1)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit verified policy wiring
        run: |
          git config user.name "PawSpace Closure Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/canonical-bookings/route.ts app/api/grooming-booking-change/route.ts
          git commit -m "Wire Grooming commercial policy snapshots [skip ci]"
          git pull --rebase origin grooming-integration-closure
          git push origin HEAD:grooming-integration-closure
