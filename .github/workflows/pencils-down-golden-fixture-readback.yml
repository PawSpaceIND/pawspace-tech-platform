name: Read back Golden fixture Worker (no redeploy)
on:
  push:
    branches: [ops/pencils-down-staging-ab40dc00]
    paths: [.github/workflows/pencils-down-golden-fixture-readback.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: pawspace-release-preview
    steps:
      - name: Verify active version, sandbox fixture and public origin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request,urllib.error
          acct=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; worker='pawspace-beta-golden-fixture-3218c3'
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def cf(path):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+acct+path,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r: body=json.load(r)
            assert body.get('success') is True, body.get('errors'); return body['result']
          deps=cf('/workers/scripts/'+worker+'/deployments'); rows=deps.get('deployments',deps) if isinstance(deps,dict) else deps
          latest=max(rows,key=lambda x:x.get('created_on','')); versions=latest.get('versions',[]); assert len(versions)==1 and versions[0].get('percentage')==100
          version_id=versions[0]['version_id']; version=cf('/workers/scripts/'+worker+'/versions/'+version_id)
          bindings=version.get('resources',{}).get('bindings',[]); lookup={b.get('name'):b for b in bindings if isinstance(b,dict)}
          expected={'PAWSPACE_RELEASE_SHA':'3218c383ef3afd947847b87b7319600e359e4f9e','PAWSPACE_PAYMENT_ENV':'sandbox','FORBID_PRODUCTION':'true','PAWSPACE_PAYMENT_LIVE_APPROVED':'false','PAWSPACE_SCHEDULING_ENV':'uat','PAWSPACE_TEST_SERVICE_DISCOVERY_FIXTURE':'on'}
          for name,value in expected.items(): assert lookup.get(name,{}).get('text')==value,(name,lookup.get(name))
          sub=cf('/workers/subdomain')['subdomain']; origin=f'https://{worker}.{sub}.workers.dev'; history=[]
          for attempt in range(12):
            row={'attempt':attempt+1}
            for path in ['/healthz','/mobile-app','/staging-login']:
              try:
                req=urllib.request.Request(origin+path,headers={'User-Agent':'PawSpace-readback','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=20) as r: row[path]=r.status
              except urllib.error.HTTPError as e: row[path]=e.code
              except Exception: row[path]='transport_error'
            history.append(row); print(json.dumps(row))
            if all(row[p]==200 for p in ['/healthz','/mobile-app','/staging-login']): break
            time.sleep(5)
          out={'worker':worker,'activeVersion':version_id,'releaseSha':lookup['PAWSPACE_RELEASE_SHA']['text'],'fixture':lookup['PAWSPACE_TEST_SERVICE_DISCOVERY_FIXTURE']['text'],'origin':origin,'poll':history,'productionChanged':False,'redeployed':False}
          open('golden-fixture-readback.json','w').write(json.dumps(out,indent=2)+'\n')
          assert all(history[-1][p]==200 for p in ['/healthz','/mobile-app','/staging-login']), 'Active Worker remained unavailable after bounded propagation poll'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-fixture-readback
          path: golden-fixture-readback.json
          if-no-files-found: warn
          retention-days: 7
