name: Track 5 D1 scratch restore drill

on:
  push:
    branches:
      - ops/d1-backup-restore-track5
    paths:
      - .github/workflows/d1-restore-scratch-drill.yml

permissions:
  contents: read

concurrency:
  group: track5-d1-scratch-restore-drill
  cancel-in-progress: false

jobs:
  scratch-restore-drill:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRATCH_NAME: pawspace-restore-drill-${{ github.run_id }}-${{ github.run_attempt }}
      NODE_ENV: test
      APP_ENV: staging
      FORBID_PRODUCTION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm run install:ci
      - name: Blocking application build
        run: npm run build
      - name: Verify restore safety guards
        run: node --test tests/d1-backup-restore-guards.test.mjs
      - name: Back up staging D1
        run: node scripts/d1-backup.mjs --environment staging --output-dir "$RUNNER_TEMP/track5-backup"
      - name: Restore staging dump into scratch D1 and verify
        run: |
          set -euo pipefail
          SQL_FILE="$(find "$RUNNER_TEMP/track5-backup" -maxdepth 1 -type f -name '*.sql' -print -quit)"
          test -n "$SQL_FILE"
          node scripts/d1-restore.mjs --file "$SQL_FILE" --into-scratch "$SCRATCH_NAME" --execute
          EVIDENCE="$(find ops/evidence -maxdepth 1 -type f -name 'restore-*.json' -print -quit)"
          test -n "$EVIDENCE"
          node - "$EVIDENCE" <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (evidence.drill !== true) throw new Error('restore evidence is not a scratch drill');
          if (evidence.verified !== true) throw new Error('scratch restore was not verified');
          if (!(Number(evidence.tablesAfterRestore) > 0)) throw new Error('scratch restore contains no tables');
          if (!Number.isFinite(Number(evidence.restoreSeconds))) throw new Error('restore RTO measurement is missing');
          console.log(JSON.stringify({drill:evidence.drill,verified:evidence.verified,tablesAfterRestore:evidence.tablesAfterRestore,restoreSeconds:evidence.restoreSeconds}, null, 2));
          NODE
      - name: Upload restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track5-scratch-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/evidence/restore-*.json
          if-no-files-found: warn
      - name: Delete scratch database
        if: always()
        run: npx wrangler d1 delete "$SCRATCH_NAME" -y || true
