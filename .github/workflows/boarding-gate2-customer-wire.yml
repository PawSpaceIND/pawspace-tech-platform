name: Boarding Gate 2 customer wire verifier

on:
  push:
    branches:
      - grooming-integration-closure
    paths:
      - .github/workflows/boarding-gate2-customer-wire.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply customer Boarding wiring
        run: python3 scripts/boarding-gate2-customer-wire.py
      - name: Install web dependencies
        run: npm ci
      - name: Run web tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Validate artifact
        run: npm run validate:artifact
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Commit verified customer wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/mobile-app/stay-flow.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Wire canonical Boarding customer stay UX [skip ci]"
          git push origin HEAD:grooming-integration-closure
