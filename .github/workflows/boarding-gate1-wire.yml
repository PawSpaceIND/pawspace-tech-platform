      - name: Install web dependencies
        run: npm ci
      - name: Run web tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Validate artifact
        run: npm run validate:artifact
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Commit verified Boarding Gate 1 wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/api/canonical-bookings/route.ts lib/api-gateway.ts app/mobile-app/stay-flow.tsx tests/boarding-gate1.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Wire Boarding Gate 1 canonical path [skip ci]"
          git push origin HEAD:grooming-integration-closure
