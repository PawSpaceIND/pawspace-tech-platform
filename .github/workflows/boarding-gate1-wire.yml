name: Boarding Gate 1 wire

on:
  push:
    branches:
      - grooming-integration-closure
    paths:
      - .github/workflows/boarding-gate1-wire.yml

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Wire Boarding Gate 1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text: raise SystemExit(f"expected text not found in {path}: {old[:120]}")
              p.write_text(text.replace(old,new,1))

          path="app/api/canonical-bookings/route.ts"
          replace_once(path,
            'import {consumeTrainingQuote,governTrainingBooking,trainingQuoteLinkStatement} from "../../../lib/training-commercial-governance";\n',
            'import {consumeTrainingQuote,governTrainingBooking,trainingQuoteLinkStatement} from "../../../lib/training-commercial-governance";\nimport {boardingQuoteLinkStatement,boardingStayStatement,consumeBoardingQuote,governBoardingBooking} from "../../../lib/boarding-governance";\n')
