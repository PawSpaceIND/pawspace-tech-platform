          replace_once(path,'type CareWindow = "4 hours" | "12 hours" | "24 hours";','type CareWindow = "4 hours" | "10 hours" | "12 hours" | "24 hours";')
          replace_once(path,'[taxi, setTaxi] = useState(initialMode === "boarding"),','[taxi, setTaxi] = useState(false),')
