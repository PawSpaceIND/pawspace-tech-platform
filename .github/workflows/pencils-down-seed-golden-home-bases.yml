name: Seed isolated Golden groomer home bases
on:
  push:
    branches: [ops/pencils-down-staging-ab40dc00]
    paths: [.github/workflows/pencils-down-seed-golden-home-bases.yml]
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pawspace-release-preview
    env:
      TARGET_DB_NAME: pawspace-beta-golden-wallet-3218c3
    steps:
      - name: Seed test-only governed provider home bases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          db_json=$(curl -fsS "${auth[@]}" "$api/d1/database?per_page=100")
          db_id=$(jq -r --arg n "$TARGET_DB_NAME" '.result[] | select(.name==$n) | (.uuid // .id)' <<<"$db_json" | head -1)
          test -n "$db_id" && test "$db_id" != null
          query(){
            local sql="$1"
            curl -fsS -X POST "${auth[@]}" -H 'content-type: application/json' "$api/d1/database/$db_id/query" --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')"
          }
          before=$(query "SELECT COUNT(*) n FROM provider_home_base WHERE provider_id IN ('groom_arun','groom_kiran','groom_sanjay') AND effective_until IS NULL")
          echo "ACTIVE_GROOMER_BASES_BEFORE=$(jq -r '[.result[]?.results[]?.n] | first // 0' <<<"$before")"
          now=$(date +%s000)
          sql="INSERT INTO provider_home_base (id,provider_id,address,latitude,longitude,effective_from,effective_until,reason,updated_by,created_at) SELECT 'GOLDEN-PHB-groom_arun','groom_arun','PawSpace isolated Golden UAT provider base',12.9716,77.5946,0,NULL,'Isolated Golden-path test data only','system:golden-uat-seed',$now WHERE NOT EXISTS (SELECT 1 FROM provider_home_base WHERE provider_id='groom_arun' AND effective_until IS NULL); INSERT INTO provider_home_base (id,provider_id,address,latitude,longitude,effective_from,effective_until,reason,updated_by,created_at) SELECT 'GOLDEN-PHB-groom_kiran','groom_kiran','PawSpace isolated Golden UAT provider base',12.9736,77.5966,0,NULL,'Isolated Golden-path test data only','system:golden-uat-seed',$now WHERE NOT EXISTS (SELECT 1 FROM provider_home_base WHERE provider_id='groom_kiran' AND effective_until IS NULL); INSERT INTO provider_home_base (id,provider_id,address,latitude,longitude,effective_from,effective_until,reason,updated_by,created_at) SELECT 'GOLDEN-PHB-groom_sanjay','groom_sanjay','PawSpace isolated Golden UAT provider base',12.9756,77.5986,0,NULL,'Isolated Golden-path test data only','system:golden-uat-seed',$now WHERE NOT EXISTS (SELECT 1 FROM provider_home_base WHERE provider_id='groom_sanjay' AND effective_until IS NULL);"
          seeded=$(query "$sql")
          test "$(jq -r '.success' <<<"$seeded")" = true
          after=$(query "SELECT provider_id,latitude,longitude,reason,updated_by FROM provider_home_base WHERE provider_id IN ('groom_arun','groom_kiran','groom_sanjay') AND effective_until IS NULL ORDER BY provider_id")
          count=$(jq '[.result[]?.results[]?] | length' <<<"$after")
          echo "ACTIVE_GROOMER_BASES_AFTER=$count"
          jq -c '[.result[]?.results[]? | {provider_id,latitude,longitude,reason,updated_by}]' <<<"$after"
          test "$count" = 3
          echo 'PASS: isolated Golden D1 now has three governed grooming home bases; production untouched.'
