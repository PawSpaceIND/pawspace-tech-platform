name: Repair WhatsApp UAT WABA webhook subscription

on:
  push:
    branches:
      - fix/whatsapp-uat-staging-deploy-isolation
    paths:
      - .github/workflows/repair-whatsapp-uat-waba-subscription.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    concurrency: pawspace-staging-deploy
    env:
      TARGET_SHA: c0cf8ac11349e2953f6b0ca98a6d53364147051f
      META_APP_ID: '922882727551525'
      META_WABA_ID: '1647621440064984'
      STAGING_URL: 'https://pawspace-staging.karthik-fce.workers.dev'
      CALLBACK_URL: 'https://pawspace-staging.karthik-fce.workers.dev/api/whatsapp/meta-webhook'
      WRANGLER_CONFIG: dist/server/wrangler.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact fixed checkout
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$TARGET_SHA" ]
          [ -z "$(git status --porcelain)" ]
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build fixed SHA
        run: |
          npm run install:ci
          npm run build
      - name: Generate staging config and preserve existing vars
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/stage-config.mjs
          SETTINGS="$RUNNER_TEMP/settings.json"; export SETTINGS
          trap 'rm -f "$SETTINGS"' EXIT
          HTTP="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pawspace-staging/settings")"
          [ "$HTTP" = "200" ] || { echo 'Unable to snapshot staging settings; response withheld.' >&2; exit 1; }
          node --input-type=module <<'NODE'
          import{readFileSync,writeFileSync}from'node:fs';
          const s=JSON.parse(readFileSync(process.env.SETTINGS,'utf8'));const b=Array.isArray(s?.result?.bindings)?s.result.bindings:[];
          const remote={};for(const x of b){if(x?.type==='plain_text'){const n=String(x?.name||'');if(/^[A-Z0-9_]+$/.test(n))remote[n]=String(x?.text??x?.value??'')}}
          const c=JSON.parse(readFileSync(process.env.WRANGLER_CONFIG,'utf8'));if(c.name!=='pawspace-staging')throw new Error('Refusing non-staging target');
          c.vars={...remote,...(c.vars||{}),META_WHATSAPP_PHONE_NUMBER_ID:'1334980146365492',META_WHATSAPP_WABA_ID:'1647621440064984',PAWSPACE_PRODUCTION_ENFORCE:'false'};c.keep_vars=true;
          if(b.some(x=>String(x?.name||'')==='AI'&&/ai/i.test(String(x?.type||''))))c.ai={binding:'AI'};
          writeFileSync(process.env.WRANGLER_CONFIG,JSON.stringify(c,null,2),{mode:0o600});
          NODE
      - name: Generate staging-only verify token and bind it to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VERIFY_TOKEN="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$VERIFY_TOKEN"
          echo "UAT_VERIFY_TOKEN=$VERIFY_TOKEN" >> "$GITHUB_ENV"
          printf '%s' "$VERIFY_TOKEN" | npx wrangler secret put META_WHATSAPP_VERIFY_TOKEN --config "$WRANGLER_CONFIG" >/dev/null
          echo 'Fresh staging-only Meta verify token bound to pawspace-staging; value withheld.'
      - name: Subscribe current UAT app to test WABA and override callback to staging
        env:
          META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=String(process.env.META_WHATSAPP_UAT_ACCESS_TOKEN||'').trim();const waba=String(process.env.META_WABA_ID||'').trim();const callback=String(process.env.CALLBACK_URL||'').trim();const verify=String(process.env.UAT_VERIFY_TOKEN||'').trim();
          if(!token||!waba||!callback||!verify)throw new Error('Required UAT subscription inputs unavailable');
          const params=new URLSearchParams({override_callback_uri:callback,verify_token:verify});
          const r=await fetch(`https://graph.facebook.com/v23.0/${waba}/subscribed_apps`,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/x-www-form-urlencoded'},body:params,signal:AbortSignal.timeout(30000)});
          let p={};try{p=await r.json()}catch{}
          if(!r.ok){const e=p?.error||{};console.log(`WABA subscription update failed: HTTP=${r.status}; code=${Number(e.code||0)}; subcode=${Number(e.error_subcode||0)}.`);process.exit(2);}
          if(p?.success!==true)throw new Error('Meta did not confirm WABA subscription update');
          console.log('Meta confirmed current UAT app subscription to test WABA with staging callback override; sensitive values withheld.');
          NODE
      - name: Verify current UAT app is subscribed to test WABA
        env:
          META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=String(process.env.META_WHATSAPP_UAT_ACCESS_TOKEN||'').trim();const waba=String(process.env.META_WABA_ID||'');const app=String(process.env.META_APP_ID||'');
          const r=await fetch(`https://graph.facebook.com/v23.0/${waba}/subscribed_apps`,{headers:{authorization:`Bearer ${token}`},signal:AbortSignal.timeout(30000)});const p=await r.json();if(!r.ok)throw new Error(`WABA subscription query HTTP ${r.status}`);const rows=Array.isArray(p?.data)?p.data:[];const yes=rows.some(x=>String(x?.id||'')===app);console.log(`currentUatAppSubscribed=${yes}; subscribedAppCount=${rows.length}`);if(!yes)process.exit(3);
          NODE
      - name: Re-deploy exact fixed SHA with UAT secrets and new verify token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          SECRETS="$RUNNER_TEMP/uat-secrets.json"; LOG="$RUNNER_TEMP/deploy.log"; export SECRETS
          trap 'rm -f "$SECRETS" "$LOG"' EXIT
          node --input-type=module <<'NODE'
          import{writeFileSync}from'node:fs';const names=['PAWSPACE_UAT_ACCESS_CODE','PAWSPACE_UAT_SIGNING_KEY','PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT','META_WHATSAPP_UAT_ACCESS_TOKEN','UAT_VERIFY_TOKEN'];const v=Object.fromEntries(names.map(n=>[n,String(process.env[n]||'').trim()]));if(Object.values(v).some(x=>!x))throw new Error('Required UAT-only secret missing');const out={PAWSPACE_UAT_ACCESS_CODE:v.PAWSPACE_UAT_ACCESS_CODE,PAWSPACE_UAT_SIGNING_KEY:v.PAWSPACE_UAT_SIGNING_KEY,PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT:v.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT,META_WHATSAPP_UAT_ACCESS_TOKEN:v.META_WHATSAPP_UAT_ACCESS_TOKEN,META_WHATSAPP_VERIFY_TOKEN:v.UAT_VERIFY_TOKEN,PAWSPACE_STAGING_LIVE_CUSTOMER_OTP:'false'};writeFileSync(process.env.SECRETS,JSON.stringify(out),{mode:0o600});
          NODE
          npx wrangler deploy --config "$WRANGLER_CONFIG" --keep-vars --message "staging $TARGET_SHA meta-waba-subscribed" --secrets-file "$SECRETS" > "$LOG" 2>&1
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$LOG" | tail -n 1 || true)";[ "$URL" = "$STAGING_URL" ] || { echo 'Unexpected Worker origin; output withheld.' >&2;exit 1; }
          echo 'Exact fixed SHA re-deployed to pawspace-staging after Meta subscription repair.'
      - name: Verify production lockdown and webhook verifier boundary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SETTINGS="$RUNNER_TEMP/verify.json"; export SETTINGS
          trap 'rm -f "$SETTINGS"' EXIT
          HTTP="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pawspace-staging/settings")";[ "$HTTP" = "200" ] || exit 1
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';const s=JSON.parse(readFileSync(process.env.SETTINGS,'utf8'));const b=Array.isArray(s?.result?.bindings)?s.result.bindings:[];const p=Object.fromEntries(b.filter(x=>x?.type==='plain_text').map(x=>[String(x.name||''),String(x.text??x.value??'')]));if(p.PAWSPACE_PRODUCTION_ENFORCE!=='false')throw new Error('Production lockdown is not false');const v=b.find(x=>String(x?.name||'')==='META_WHATSAPP_VERIFY_TOKEN');if(!v||!/secret/i.test(String(v?.type||'')))throw new Error('Meta verify-token binding missing');console.log('PAWSPACE_PRODUCTION_ENFORCE=false and Meta verify-token secret binding verified.');
          NODE
          HTTP="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$CALLBACK_URL")";[ "$HTTP" = "403" ] || { echo "Unexpected public verifier probe HTTP=$HTTP" >&2;exit 1; }
          echo 'Public Meta webhook verifier boundary active on staging.'
