name: Deploy staging CX hotfix

# Shared staging is a single Worker. Keep this workflow manual so CX recovery cannot
# silently overwrite another active UAT lane (for example the PR #522 voice build).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: pawspace-staging-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
      STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
      PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
      PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
      PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated hotfix branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'hotfix/staging-chat-cx-runtime'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install
        run: npm run install:ci
      - name: Build
        run: npm run build
      - name: Configure isolated staging
        run: node scripts/stage-config.mjs
      - name: Deploy exact hotfix SHA to staging
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --message "staging-cx-hotfix $GITHUB_SHA"
      - name: Verify deployed version and browser route repeatedly
        shell: bash
        run: |
          set -euo pipefail
          base='https://pawspace-staging.karthik-fce.workers.dev'
          sleep 3
          for attempt in 1 2 3; do
            chat_status="$(curl -sS -L -o /tmp/chat.html -w '%{http_code}' "$base/chat")"
            cx_status="$(curl -sS -L -o /tmp/cx.html -w '%{http_code}' "$base/team/customer-experience" -H 'User-Agent: Mozilla/5.0')"
            rsc_status="$(curl -sS -o /tmp/cx-rsc.txt -w '%{http_code}' "$base/team/customer-experience" -H 'RSC: 1' -H 'Accept: text/x-component')"
            ai_status="$(curl -sS -o /tmp/ai.json -w '%{http_code}' -X POST "$base/api/ai-web-chat" -H 'content-type: application/json' -H "origin: $base" --data '{"mode":"public","query":"dog grooming in Bangalore"}')"
            printf 'attempt=%s chat=%s cx=%s rsc=%s ai=%s\n' "$attempt" "$chat_status" "$cx_status" "$rsc_status" "$ai_status"
            test "$chat_status" = '200'
            test "$cx_status" = '200'
            test "$rsc_status" -ge 200
            test "$rsc_status" -lt 500
            test "$ai_status" -ge 200
            test "$ai_status" -lt 500
            sleep 8
          done

  smoke:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Probe public staging routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://pawspace-staging.karthik-fce.workers.dev'
          chat_status="$(curl -sS -L -o /tmp/chat.html -w '%{http_code}' "$base/chat")"
          cx_status="$(curl -sS -L -o /tmp/cx.html -w '%{http_code}' "$base/team/customer-experience")"
          rsc_status="$(curl -sS -o /tmp/cx-rsc.txt -w '%{http_code}' "$base/team/customer-experience" -H 'RSC: 1' -H 'Accept: text/x-component')"
          browser_status="$(curl -sS -L -o /tmp/cx-browser.html -w '%{http_code}' "$base/team/customer-experience" -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' -H 'User-Agent: Mozilla/5.0')"
          ai_status="$(curl -sS -o /tmp/ai.json -w '%{http_code}' -X POST "$base/api/ai-web-chat" -H 'content-type: application/json' -H "origin: $base" --data '{"mode":"public","query":"dog grooming in Bangalore"}')"
          printf 'chat=%s\ncx=%s\nrsc=%s\nbrowser=%s\nai=%s\n' "$chat_status" "$cx_status" "$rsc_status" "$browser_status" "$ai_status"
          test "$chat_status" = '200'
          test "$cx_status" = '200'
          test "$rsc_status" -ge 200
          test "$rsc_status" -lt 500
          test "$browser_status" = '200'
          test "$ai_status" -ge 200
          test "$ai_status" -lt 500
