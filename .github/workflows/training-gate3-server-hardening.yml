name: Training Gate 3 server hardening
on:
  push:
    branches: [grooming-integration-closure]
    paths:
      - .github/workflows/training-gate3-server-hardening.yml
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply Training Gate 3 hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          commercial=Path('lib/training-commercial-governance.ts')
          text=commercial.read_text()
          old='if(!meet&&!(["prepaid","split"] as string[]).includes(input.paymentMode))throw new Response("Training programmes support full prepaid or approved split payment",{status:409});const basePrice='
          new='if(!meet&&!(["prepaid","split"] as string[]).includes(input.paymentMode))throw new Response("Training programmes support full prepaid or approved split payment",{status:409});if(input.paymentMode==="split"&&String(input.couponCode||"").trim())throw new Response("Training coupons require full prepaid payment",{status:409});const basePrice='
          assert old in text
          commercial.write_text(text.replace(old,new,1))

          ops=Path('app/api/training-ops/route.ts')
          text=ops.read_text()
          old='SELECT id,name,provider_model,rating,quality_score,zones_json,status,live FROM provider_capacity_profiles'
          new='SELECT id,name,provider_model,rating,quality_score,zones_json,services_json,status,live FROM provider_capacity_profiles'
          assert old in text
          ops.write_text(text.replace(old,new,1))

          finance=Path('lib/training-finance.ts')
          text=finance.read_text()
          invoice_table='db.prepare("CREATE TABLE IF NOT EXISTS training_finance_invoices (id TEXT PRIMARY KEY,booking_id TEXT NOT NULL UNIQUE,programme_id TEXT NOT NULL,customer_id TEXT NOT NULL,city_id TEXT NOT NULL,currency TEXT NOT NULL DEFAULT \'INR\',commercial_total REAL NOT NULL,tax_mode TEXT,tax_rate REAL,taxable_amount REAL,tax_amount REAL,invoice_total REAL,invoice_number TEXT,status TEXT NOT NULL,tax_policy_version INTEGER,payment_status TEXT NOT NULL,created_at INTEGER NOT NULL,updated_at INTEGER NOT NULL)"),'
          assert invoice_table in text
          text=text.replace(invoice_table,invoice_table+'\n db.prepare("CREATE TABLE IF NOT EXISTS training_invoice_sequences (city_id TEXT NOT NULL,financial_year TEXT NOT NULL,next_number INTEGER NOT NULL DEFAULT 0,updated_at INTEGER NOT NULL,PRIMARY KEY(city_id,financial_year))"),',1)
          text=text.replace('function periodFrom(ms:number){return new Date(ms).toISOString().slice(0,7)}\n','',1)
          old='if(!input.cityId||!input.effectiveFrom||!Number.isFinite(input.taxRate)||input.taxRate<0||input.taxRate>40||input.reason.trim().length<8)throw new Response("City, 0-40% tax rate, effective date and clear reason are required",{status:400});'
          new='if(!input.cityId||!input.effectiveFrom||!["inclusive","exclusive"].includes(input.taxMode)||!Number.isFinite(input.taxRate)||input.taxRate<0||input.taxRate>40||input.reason.trim().length<8)throw new Response("City, inclusive/exclusive tax mode, 0-40% tax rate, effective date and clear reason are required",{status:400});'
          assert old in text
          text=text.replace(old,new,1)
          marker='export async function approveTrainingPayout'
          assert marker in text
          issue='''export async function issueTrainingInvoice(db:D1Database,input:{bookingId:string;reason:string;actorId:string}){await refreshTrainingFinanceReadModel(db);if(!input.bookingId||input.reason.trim().length<8)throw new Response("Booking and clear invoice issue reason are required",{status:400});const existing=await db.prepare("SELECT * FROM training_finance_invoices WHERE booking_id=?").bind(input.bookingId).first<Row>();if(!existing)throw new Response("Training invoice draft not found",{status:404});if(existing.invoice_number)return{bookingId:input.bookingId,invoiceNumber:String(existing.invoice_number),status:String(existing.status),duplicatePrevented:true,liveTaxFiling:false};if(String(existing.status)!=="draft_ready_for_number")throw new Response("Training invoice is blocked until a published tax policy produces a valid draft",{status:409});if(String(existing.payment_status)!=="captured")throw new Response("Training invoice cannot be issued until the sandbox payment is captured",{status:409});const now=Date.now(),date=new Date(now),year=date.getUTCMonth()>=3?date.getUTCFullYear():date.getUTCFullYear()-1,financialYear=`${String(year).slice(-2)}-${String(year+1).slice(-2)}`,cityId=String(existing.city_id),cityCode=cityId.toUpperCase();await db.prepare("INSERT OR IGNORE INTO training_invoice_sequences (city_id,financial_year,next_number,updated_at) VALUES (?,?,0,?)").bind(cityId,financialYear,now).run();const sequence=await db.prepare("UPDATE training_invoice_sequences SET next_number=next_number+1,updated_at=? WHERE city_id=? AND financial_year=? RETURNING next_number").bind(now,cityId,financialYear).first<{next_number:number}>();if(!sequence)throw new Response("Training invoice sequence could not be reserved",{status:409});const invoiceNumber=`TRN-${cityCode}-${financialYear}-${String(sequence.next_number).padStart(6,"0")}`,result=await db.prepare("UPDATE training_finance_invoices SET invoice_number=?,status='issued_uat',updated_at=? WHERE booking_id=? AND invoice_number IS NULL AND status='draft_ready_for_number' AND payment_status='captured'").bind(invoiceNumber,now,input.bookingId).run();if(Number(result.meta.changes||0)!==1){const raced=await db.prepare("SELECT invoice_number,status FROM training_finance_invoices WHERE booking_id=?").bind(input.bookingId).first<Row>();if(raced?.invoice_number)return{bookingId:input.bookingId,invoiceNumber:String(raced.invoice_number),status:String(raced.status),duplicatePrevented:true,liveTaxFiling:false};throw new Response("Training invoice could not be issued",{status:409});}await financeEvent(db,"training_invoice",input.bookingId,"issued_uat",input.actorId,input.reason,{invoiceNumber,financialYear,liveTaxFiling:false});return{bookingId:input.bookingId,invoiceNumber,status:"issued_uat",duplicatePrevented:false,liveTaxFiling:false};}\n'''
          text=text.replace(marker,issue+marker,1)
          finance.write_text(text)

          route=Path('app/api/training-finance/route.ts')
          text=route.read_text()
          old='import{approveTrainingPayout,listTrainingFinance,saveTrainingCompensationRule,saveTrainingTaxPolicy}from"../../../lib/training-finance";'
          new='import{approveTrainingPayout,issueTrainingInvoice,listTrainingFinance,saveTrainingCompensationRule,saveTrainingTaxPolicy}from"../../../lib/training-finance";'
          assert old in text
          text=text.replace(old,new,1)
          old='else if(action==="approve_payout")data=await approveTrainingPayout(db,{providerId:String(body.providerId||""),periodCode:String(body.periodCode||""),idempotencyKey:String(body.idempotencyKey||""),reason,actorId:actor.email});else return json({error:"Unsupported Training finance action"},400);'
          new='else if(action==="issue_invoice")data=await issueTrainingInvoice(db,{bookingId:String(body.bookingId||""),reason,actorId:actor.email});else if(action==="approve_payout")data=await approveTrainingPayout(db,{providerId:String(body.providerId||""),periodCode:String(body.periodCode||""),idempotencyKey:String(body.idempotencyKey||""),reason,actorId:actor.email});else return json({error:"Unsupported Training finance action"},400);'
          assert old in text
          route.write_text(text.replace(old,new,1))

          gateway=Path('lib/api-gateway.ts')
          text=gateway.read_text()
          old='if(url.pathname==="/api/training-provider-earnings")return "bookings.view";'
          new='if(url.pathname==="/api/training-provider-earnings")return "bookings.view";\n  if(url.pathname==="/api/training-reconciliation")return "reports.view";'
          assert old in text
          gateway.write_text(text.replace(old,new,1))

          team=Path('app/team/finance/page.tsx')
          text=team.read_text()
          text=text.replace('<h1 style={{fontSize:36,margin:"8px 0"}}>Grooming finance & reconciliation</h1><p style={{margin:0,color:"#6d6379"}}>Booking → payment → gateway event → reconciliation → refund → invoice, all linked to the canonical Grooming transaction.</p>','<h1 style={{fontSize:36,margin:"8px 0"}}>Service finance & reconciliation</h1><p style={{margin:0,color:"#6d6379"}}>Canonical service ledgers, reconciliation, invoices and settlement readiness from one Team Finance shell.</p>',1)
          old='<div style={{display:"flex",gap:10}}><button onClick={()=>void load()} style={{padding:"11px 16px",borderRadius:10,border:"1px solid #d9cde8",background:"white",fontWeight:700}}>Refresh</button><Link href="/team"'
          new='<div style={{display:"flex",gap:10}}><button onClick={()=>void load()} style={{padding:"11px 16px",borderRadius:10,border:"1px solid #d9cde8",background:"white",fontWeight:700}}>Refresh</button><Link href="/team/finance/training" style={{padding:"11px 16px",borderRadius:10,border:"1px solid #d9cde8",background:"white",fontWeight:700,textDecoration:"none",color:"#4b168c"}}>Training finance</Link><Link href="/team"'
          assert old in text
          team.write_text(text.replace(old,new,1))

          ui=Path('app/team/finance/training/page.tsx')
          text=ui.read_text()
          old='function approvePayout(row:Row){const reason=window.prompt(`Approve sandbox payout instruction for ${String(row.provider_id)} ${String(row.period_code)}? Add reason.`)||"";if(reason)void action({action:"approve_payout",providerId:row.provider_id,periodCode:row.period_code,idempotencyKey:`training-payout:${String(row.provider_id)}:${String(row.period_code)}`,reason});}'
          new=old+'function issueInvoice(row:Row){const reason=window.prompt(`Issue UAT Training invoice for ${String(row.booking_id)}? Add reason / approval reference.`)||"";if(reason)void action({action:"issue_invoice",bookingId:row.booking_id,reason});}'
          assert old in text
          text=text.replace(old,new,1)
          text=text.replace('["Booking","Commercial total","Tax","Invoice total","Payment","Status","Invoice #"]','["Booking","Commercial total","Tax","Invoice total","Payment","Status","Invoice #","Action"]',1)
          old_cell='<td style={{padding:11}}>{String(row.invoice_number||"Not numbered")}</td></tr>'
          new_cell='<td style={{padding:11}}>{String(row.invoice_number||"Not numbered")}</td><td style={{padding:11}}><button disabled={busy||Boolean(row.invoice_number)||String(row.status)!=="draft_ready_for_number"||String(row.payment_status)!=="captured"} onClick={()=>issueInvoice(row)}>Issue UAT invoice</button></td></tr>'
          assert old_cell in text
          ui.write_text(text.replace(old_cell,new_cell,1))
          PY
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit verified server hardening
        run: |
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add lib/training-commercial-governance.ts app/api/training-ops/route.ts lib/training-finance.ts app/api/training-finance/route.ts lib/api-gateway.ts app/team/finance/page.tsx app/team/finance/training/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Close Training commercial finance and invoice hardening [skip ci]"
          git pull --rebase origin grooming-integration-closure
          git push origin grooming-integration-closure
