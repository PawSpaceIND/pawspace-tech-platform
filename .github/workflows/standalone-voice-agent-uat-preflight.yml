name: Standalone Voice Agent real-UAT preflight

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type standalone-voice-preflight. This workflow never places a call.'
        required: true
        default: ''
      expected_voice_sha:
        description: 'Exact 40-character voice-agent-platform main SHA to certify'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ github.event.inputs.confirm == 'standalone-voice-preflight' }}
    name: Real-provider standalone Voice Agent preflight (no call)
    runs-on: [self-hosted, macOS, ARM64, pawspace-voice-uat]
    environment: pawspace-staging
    timeout-minutes: 20
    concurrency:
      group: standalone-voice-agent-real-uat
      cancel-in-progress: false
    env:
      VOICE_SOURCE_REPO: /Users/karthikeyanparamasivam/Projects/voice-agent-platform
      VOICE_DATA_PATH: /Users/karthikeyanparamasivam/Projects/voice-agent-platform/.uat/voice.sqlite
      VOICE_SERVER_MODE: hosted_uat
      VOICE_PUBLIC_ORIGIN: https://standalone-voice-uat.invalid
      VOICE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VOICE_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VOICE_ANTHROPIC_API_KEY: ${{ secrets.PAWSPACE_AI_PROVIDER_API_KEY }}
      VOICE_ANTHROPIC_MODEL: claude-sonnet-4-6
      EXOTEL_SID: ${{ secrets.EXOTEL_SID || secrets.EXOTEL_ACCOUNT_SID }}
      EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
      EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
      EXOTEL_SUBDOMAIN: api.exotel.com
      EXOTEL_CALLER_ID: ${{ secrets.EXOTEL_CALLER_ID }}
      EXOTEL_VOICE_APP_ID: ${{ secrets.EXOTEL_VOICE_APP_ID }}
      EXOTEL_WEBHOOK_SECRET: ${{ secrets.EXOTEL_WEBHOOK_SECRET }}
      VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
      VOICE_UAT_CALLING_APPROVED: 'true'
      VOICE_UAT_TIMEZONE_OFFSET_MINUTES: '330'
      VOICE_UAT_QUIET_START_HOUR: '21'
      VOICE_UAT_QUIET_END_HOUR: '9'
      VOICE_UAT_ALLOWED_USE_CASES: customer_support
      VOICE_UAT_MAX_CALLS_24H: '2'
      VOICE_CALL_ENV: uat
      VOICE_CALL_LIVE_APPROVED: 'false'
      VOICE_PAYMENT_LIVE_APPROVED: 'false'
      VOICE_PAYMENT_PROVIDER: ''
    steps:
      - name: Prepare exact isolated Voice Agent worktree
        env:
          EXPECTED_VOICE_SHA: ${{ github.event.inputs.expected_voice_sha }}
        run: |
          set -euo pipefail
          case "$EXPECTED_VOICE_SHA" in *[!0-9a-f]* | "") exit 1;; esac
          [ "${#EXPECTED_VOICE_SHA}" -eq 40 ]
          test -d "$VOICE_SOURCE_REPO/.git"
          git -C "$VOICE_SOURCE_REPO" cat-file -e "$EXPECTED_VOICE_SHA^{commit}"
          git -C "$VOICE_SOURCE_REPO" worktree prune
          WORKTREE="$RUNNER_TEMP/voice-agent-uat-$GITHUB_RUN_ID"
          rm -rf "$WORKTREE"
          git -C "$VOICE_SOURCE_REPO" worktree add --detach "$WORKTREE" "$EXPECTED_VOICE_SHA"
          ACTUAL="$(git -C "$WORKTREE" rev-parse HEAD)"
          [ "$ACTUAL" = "$EXPECTED_VOICE_SHA" ]
          [ -z "$(git -C "$WORKTREE" status --porcelain)" ]
          echo "VOICE_REPO=$WORKTREE" >> "$GITHUB_ENV"
          echo "Standalone Voice Agent exact SHA isolated in a clean detached worktree."

      - name: Verify durable UAT database and resolve workspace
        run: |
          set -euo pipefail
          test -f "$VOICE_DATA_PATH"
          INTEGRITY="$(sqlite3 "$VOICE_DATA_PATH" 'PRAGMA integrity_check;')"
          [ "$INTEGRITY" = "ok" ]
          OWNER_COUNT="$(sqlite3 "$VOICE_DATA_PATH" "SELECT COUNT(*) FROM users WHERE role='owner';")"
          [ "$OWNER_COUNT" -ge 1 ]
          TENANT="$(sqlite3 "$VOICE_DATA_PATH" "SELECT tenant_id FROM users WHERE role='owner' ORDER BY rowid LIMIT 1;")"
          [ -n "$TENANT" ]
          echo "::add-mask::$TENANT"
          echo "VOICE_PROVIDER_TENANT_ID=$TENANT" >> "$GITHUB_ENV"
          echo "Durable UAT database integrity and owner workspace verified."

      - name: Generate one-run AgentStream path secret
        run: |
          set -euo pipefail
          SECRET="$(openssl rand -base64 48 | tr -d '\n' | tr '+/' '-_' | tr -d '=')"
          [ "${#SECRET}" -ge 43 ]
          echo "::add-mask::$SECRET"
          echo "EXOTEL_AGENTSTREAM_SECRET=$SECRET" >> "$GITHUB_ENV"
          echo "Fresh one-run AgentStream path secret generated."

      - name: Validate protected secret presence without printing values
        run: |
          set -euo pipefail
          required=(
            VOICE_CLOUDFLARE_ACCOUNT_ID
            VOICE_CLOUDFLARE_API_TOKEN
            VOICE_ANTHROPIC_API_KEY
            EXOTEL_SID
            EXOTEL_API_KEY
            EXOTEL_API_TOKEN
            EXOTEL_CALLER_ID
            EXOTEL_VOICE_APP_ID
            EXOTEL_WEBHOOK_SECRET
            VOICE_UAT_ALLOWLIST
          )
          for name in "${required[@]}"; do
            value="${!name:-}"
            [ -n "$value" ] || { echo "$name missing" >&2; exit 1; }
            echo "::add-mask::$value"
          done
          echo "Protected provider secret presence verified; values withheld."

      - name: Build exact standalone Voice Agent
        run: |
          set -euo pipefail
          cd "$VOICE_REPO"
          npm ci
          npm run build

      - name: Run hosted-UAT structural preflight
        run: |
          set -euo pipefail
          cd "$VOICE_REPO"
          npm run preflight:uat

      - name: Run real-provider readiness gate
        run: |
          set -euo pipefail
          cd "$VOICE_REPO"
          npm run preflight:real-uat

      - name: Publish sanitized readiness summary
        run: |
          {
            echo '## Standalone Voice Agent real-UAT preflight'
            echo '- exact standalone Voice Agent SHA: verified in isolated detached worktree'
            echo '- concurrent local Voice Agent changes touched: no'
            echo '- durable UAT SQLite integrity: passed'
            echo '- owner/workspace binding: passed'
            echo '- Cloudflare protected credentials: present'
            echo '- Anthropic protected credential: present'
            echo '- Exotel SID/API/caller/voice-app credentials: present'
            echo '- callback secret: present'
            echo '- fresh AgentStream path secret: generated for this run only'
            echo '- exactly one allowlisted recipient required: yes'
            echo '- accepted-call cap: <= 2 / 24h'
            echo '- live telephony enabled: no'
            echo '- production payments enabled: no'
            echo '- provider request made by this workflow: no'
            echo '- phone call placed by this workflow: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove isolated Voice Agent worktree
        if: always()
        run: |
          set +e
          if [ -n "${VOICE_REPO:-}" ] && [ -d "${VOICE_REPO:-}" ]; then
            git -C "$VOICE_SOURCE_REPO" worktree remove --force "$VOICE_REPO"
          fi
          git -C "$VOICE_SOURCE_REPO" worktree prune
