name: Voice UAT staging activation

# CI verifies deterministic synthetic UAT configuration without contacting a live provider. Real staging
# activation is manual-only and remains fail-closed on genuine staging variables/secrets.
on:
  push:
    branches:
      - fix/audio-bot-exotel-uat-closure-20260905
      - fix/uat-config-stubs
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/voice-uat-staging.yml'
      - 'scripts/voice-uat-preflight.mjs'
      - 'scripts/stage-voice-uat-config.mjs'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "voice-uat" to activate voice only on isolated staging'
        required: true
        default: ''
      expected_sha:
        description: 'Exact 40-character commit SHA to deploy'
        required: true
        default: ''

jobs:
  ci-config:
    name: Voice UAT CI-only configuration
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      EXOTEL_CALLBACK_URL: https://callback.uat-ci.invalid/exotel/status
      EXOTEL_AGENTSTREAM_WSS_URL: wss://stream.uat-ci.invalid/agentstream
      UAT_CUSTOMER_ID: uat-ci-customer
      UAT_BOOKING_ID: uat-ci-booking
      UAT_CITY_ID: uat-ci-city
      UAT_CONSENT_SOURCE_REF: ci-synthetic-consent-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic CI-only UAT stubs
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const required=["EXOTEL_CALLBACK_URL","EXOTEL_AGENTSTREAM_WSS_URL","UAT_CUSTOMER_ID","UAT_BOOKING_ID","UAT_CITY_ID","UAT_CONSENT_SOURCE_REF"];
            for(const name of required){if(!String(process.env[name]||"").trim())throw new Error(`${name} missing`);}
            const callback=new URL(process.env.EXOTEL_CALLBACK_URL);
            const stream=new URL(process.env.EXOTEL_AGENTSTREAM_WSS_URL);
            if(callback.protocol!=="https:"||!callback.hostname.endsWith(".invalid"))throw new Error("CI callback must be an https .invalid URL");
            if(stream.protocol!=="wss:"||!stream.hostname.endsWith(".invalid"))throw new Error("CI stream must be a wss .invalid URL");
            for(const name of ["UAT_CUSTOMER_ID","UAT_BOOKING_ID","UAT_CITY_ID","UAT_CONSENT_SOURCE_REF"]){if(!process.env[name].startsWith("uat-ci-")&&!process.env[name].startsWith("ci-synthetic-"))throw new Error(`${name} must remain explicitly synthetic`);}
            console.log("CI-only voice UAT stubs are deterministic, synthetic, and non-routable.");
          '

  activate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'voice-uat' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    concurrency: pawspace-staging-deploy
    env:
      DEPLOY_SHA: ${{ github.event.inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact clean SHA
        run: |
          set -euo pipefail
          case "$DEPLOY_SHA" in *[!0-9a-f]* | "") exit 1;; esac
          [ "${#DEPLOY_SHA}" -eq 40 ]
          [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ]
          [ -z "$(git status --porcelain)" ]
      - name: Install and validate voice contracts
        run: |
          npm run install:ci
          node --test tests/voice-operator-console.test.mjs tests/voice-outbound-policy.test.mjs tests/voice-provider-webhook.test.mjs tests/ai-channels-hardening.test.mjs tests/voice-audio-bot-source-contract.test.mjs tests/exotel-agentstream-source-contract.test.mjs
      - name: Build
        run: npm run build
      - name: Configure isolated staging base
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs
      - name: Resolve canonical UAT context from allowlisted owner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const sqlEscape = value => String(value || '').replaceAll("'", "''");
          const entries = String(process.env.PAWSPACE_VOICE_UAT_ALLOWLIST || '').trim().split(/[\s,;]+/).filter(Boolean);
          if (entries.length !== 1) throw new Error('Voice UAT requires exactly one allowlisted recipient');
          const suffix = entries[0].replace(/\D/g, '').slice(-10);
          if (suffix.length !== 10) throw new Error('Voice UAT allowlist is not one valid E.164 recipient');
          const execute = sql => {
            const raw = execFileSync('npx', ['wrangler','d1','execute','pawspace-staging','--remote','--json','--command',sql], {
              encoding: 'utf8', env: process.env, maxBuffer: 8 * 1024 * 1024, stdio: ['ignore','pipe','pipe'],
            });
            const starts = [raw.indexOf('['), raw.indexOf('{')].filter(index => index >= 0);
            if (!starts.length) throw new Error('Staging D1 returned no JSON');
            const parsed = JSON.parse(raw.slice(Math.min(...starts)));
            const blocks = Array.isArray(parsed) ? parsed : [parsed];
            return blocks.flatMap(block => Array.isArray(block?.results) ? block.results : []);
          };
          const owners = execute(`
            WITH matched AS (
              SELECT id,city_id FROM canonical_customers
              WHERE replace(replace(replace(replace(replace(primary_phone,' ',''),'-',''),'+',''),'(',''),')','') LIKE '%${sqlEscape(suffix)}'
            )
            SELECT c.id,c.city_id,COUNT(b.id) AS booking_count
            FROM matched c JOIN canonical_bookings b ON b.customer_id=c.id
            GROUP BY c.id,c.city_id
          `);
          if (owners.length !== 1) throw new Error(`Allowlisted recipient resolves to ${owners.length} booking-owning staging customers; refusing ambiguous carrier UAT`);
          const customerId = String(owners[0].id || '').trim();
          const bookings = execute(`SELECT id,city_id FROM canonical_bookings WHERE customer_id='${sqlEscape(customerId)}' ORDER BY updated_at DESC,created_at DESC,id DESC LIMIT 1`);
          if (bookings.length !== 1) throw new Error('Resolved staging customer has no canonical booking');
          const bookingId = String(bookings[0].id || '').trim();
          const cityId = String(bookings[0].city_id || owners[0].city_id || '').trim();
          if (!customerId || !bookingId || !cityId) throw new Error('Resolved UAT canonical context is incomplete');
          const consentRef = `github-actions-voice-uat-${process.env.GITHUB_RUN_ID}`;
          for (const value of [customerId, bookingId, cityId, consentRef]) console.log(`::add-mask::${value}`);
          appendFileSync(process.env.GITHUB_ENV, `UAT_CUSTOMER_ID=${customerId}\nUAT_BOOKING_ID=${bookingId}\nUAT_CITY_ID=${cityId}\nUAT_CONSENT_SOURCE_REF=${consentRef}\n`);
          console.log('Canonical UAT context resolved from one allowlisted booking owner; identifiers withheld.');
          NODE
      - name: Validate seven-parameter UAT preflight
        env:
          EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
          EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
          EXOTEL_ACCOUNT_SID: ${{ secrets.EXOTEL_ACCOUNT_SID || secrets.EXOTEL_SID }}
          EXOTEL_CALLER_ID: ${{ secrets.EXOTEL_CALLER_ID }}
          EXOTEL_VOICE_APP_ID: ${{ secrets.EXOTEL_VOICE_APP_ID }}
          EXOTEL_WEBHOOK_SECRET: ${{ secrets.EXOTEL_WEBHOOK_SECRET }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
          EXOTEL_CALLBACK_URL: ${{ vars.EXOTEL_CALLBACK_URL || vars.PAWSPACE_VOICE_STATUS_CALLBACK_URL_UAT }}
          EXOTEL_AGENTSTREAM_WSS_URL: ${{ vars.EXOTEL_AGENTSTREAM_WSS_URL || vars.PAWSPACE_VOICE_STREAM_URL_UAT }}
        run: node scripts/voice-uat-preflight.mjs
      - name: Apply voice UAT overlay
        env:
          PAWSPACE_VOICE_UAT_APPROVED: 'true'
          EXOTEL_CALLBACK_URL: ${{ vars.EXOTEL_CALLBACK_URL || vars.PAWSPACE_VOICE_STATUS_CALLBACK_URL_UAT }}
          EXOTEL_AGENTSTREAM_WSS_URL: ${{ vars.EXOTEL_AGENTSTREAM_WSS_URL || vars.PAWSPACE_VOICE_STREAM_URL_UAT }}
        run: node scripts/stage-voice-uat-config.mjs
      - name: Deploy voice-enabled isolated staging
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
          EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
          EXOTEL_SID: ${{ secrets.EXOTEL_SID || secrets.EXOTEL_ACCOUNT_SID }}
          EXOTEL_CALLER_ID: ${{ secrets.EXOTEL_CALLER_ID }}
          EXOTEL_VOICE_APP_ID: ${{ secrets.EXOTEL_VOICE_APP_ID }}
          EXOTEL_WEBHOOK_SECRET: ${{ secrets.EXOTEL_WEBHOOK_SECRET }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/pawspace-voice-uat-secrets.json"
          export SECRETS_FILE
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const names=["PAWSPACE_UAT_ACCESS_CODE","PAWSPACE_UAT_SIGNING_KEY","PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT","EXOTEL_API_KEY","EXOTEL_API_TOKEN","EXOTEL_SID","EXOTEL_CALLER_ID","EXOTEL_VOICE_APP_ID","EXOTEL_WEBHOOK_SECRET","PAWSPACE_VOICE_UAT_ALLOWLIST"];
            const values=Object.fromEntries(names.map(name=>[name,process.env[name]||""]));
            if(Object.values(values).some(value=>!value))throw new Error("required voice UAT secret missing");
            writeFileSync(process.env.SECRETS_FILE,JSON.stringify(values),{mode:0o600});
          '
          npx wrangler deploy --message "staging $DEPLOY_SHA" --secrets-file "$SECRETS_FILE" 2>&1 | tee deployment.txt
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deployment.txt | tail -n 1 || true)"
          [ -n "$URL" ] || { echo "No staging URL reported; refusing guessed origin." >&2; exit 1; }
          echo "staging_url=$URL" >> "$GITHUB_OUTPUT"
      - name: Re-certify isolation after voice activation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ env.DEPLOY_SHA }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
        run: node tests/e2e/staging-certification.mjs --isolation-only
      - name: Publish sanitized activation summary
        env:
          STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
        run: |
          {
            echo '## Voice UAT staging activation'
            echo '- isolated staging deployed: yes'
            echo '- canonical UAT customer/booking/city resolved from allowlisted booking ownership: yes'
            echo '- Workers AI binding requested: yes'
            echo '- STT: @cf/openai/whisper-large-v3-turbo'
            echo '- in-app TTS: @cf/myshell-ai/melotts'
            echo '- carrier TTS: @cf/deepgram/aura-2-en (linear16)'
            echo '- Exotel secret names populated: yes'
            echo '- account SID accepted from EXOTEL_SID or EXOTEL_ACCOUNT_SID alias: yes'
            echo '- seven-parameter UAT preflight: passed'
            echo '- single allow-listed E.164 test recipient validated: yes'
            echo '- AgentStream wss endpoint configured: yes'
            echo '- one-shot dispatch target: 2026-09-06 08:00 IST'
            echo '- real call placed by this workflow: no'
            echo '- consent written by this workflow: no (staging scheduler writes only the explicitly source-attributed record before the due time)'
            echo "- staging origin: $STAGING_URL"
          } >> "$GITHUB_STEP_SUMMARY"
