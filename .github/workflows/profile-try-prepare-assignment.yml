name: Close canonical profile after booking evidence captured

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/profile-try-prepare-assignment.yml

permissions:
  actions: write
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel extended diagnostic after canonical evidence checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/PawSpaceIND/pawspace-tech-platform/actions/runs/33673782979/cancel
