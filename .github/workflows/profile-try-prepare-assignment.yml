name: Profile tryPrepareAssignment staging queries

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/profile-try-prepare-assignment.yml

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 15
    env:
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
      TARGET_SHA: 8e6cb14beeeb836f6f61cd34a73f2f2c3498bff1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Capture Worker tail while reproducing assignment discovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          DIAG_RUN_ID: diag-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          timeout 300s npx wrangler tail pawspace-staging --format json > worker-tail.log 2>&1 &
          TAIL_PID=$!
          cleanup(){ kill "$TAIL_PID" 2>/dev/null || true; wait "$TAIL_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 5
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const BASE=process.env.STAGING_URL.replace(/\/$/,'');
          const ACCESS=process.env.PAWSPACE_UAT_ACCESS_CODE;
          const RUN=process.env.DIAG_RUN_ID;
          const login=await fetch(BASE+'/api/staging-login',{method:'POST',headers:{'content-type':'application/json',origin:BASE},body:JSON.stringify({action:'login',code:ACCESS,email:'founder@pawspace.in'}),signal:AbortSignal.timeout(20000)});
          const cookie=(login.headers.get('set-cookie')||'').split(';')[0];
          if(!login.ok||!cookie) throw new Error(`staging login failed ${login.status}`);
          const candidates=[];
          for(let dayOffset=12;dayOffset<=179;dayOffset++) for(const hour of [5,9]){
            const day=new Date(Date.now()+dayOffset*86400000);day.setUTCHours(0,0,0,0);
            const start=new Date(day);start.setUTCHours(hour,0,0,0);const end=new Date(start.getTime()+120*60*1000);
            candidates.push({start:start.toISOString(),end:end.toISOString(),dayOffset,hour});
          }
          const events=[]; let cursor=0, successful=0, expectedMisses=0, fatal=null;
          async function attempt(window,index){
            const n=index+1,groupId=`${RUN}:grp:${String(n).padStart(3,'0')}`;
            const body={clientRequestId:groupId,customerId:`${RUN}:cust:${String(n).padStart(3,'0')}`,petIds:[`${RUN}:pet:${String(n).padStart(3,'0')}`],serviceCode:'grooming',cityId:'blr',zoneId:'blr-east',scheduledStart:window.start,scheduledEnd:window.end,occurrences:1,assignmentStrategy:'auto'};
            const t=performance.now();
            try{
              const response=await fetch(BASE+'/api/uat-scheduling',{method:'POST',headers:{'content-type':'application/json',origin:BASE,cookie},body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});
              const text=await response.text(); let payload={};try{payload=text?JSON.parse(text):{}}catch{payload={raw:text.slice(0,500)}}
              const elapsedMs=Math.round((performance.now()-t)*100)/100;
              const event={index,status:response.status,elapsedMs,code:String(payload?.code||''),error:String(payload?.error||''),dayOffset:window.dayOffset,hour:window.hour,providerId:payload?.data?.provider?.id||null};
              events.push(event); console.log(JSON.stringify(event));
              if(response.ok&&event.providerId)return 'success';
              if(response.status===409&&(event.code==='SLOT_TAKEN'||event.code==='NO_SCHEDULE_AVAILABLE'))return 'expected';
              throw Object.assign(new Error(`unexpected ${response.status}: ${event.error||event.code}`),{event});
            }catch(error){
              if(!error?.event){const event={index,status:0,elapsedMs:Math.round((performance.now()-t)*100)/100,error:String(error?.message||error),dayOffset:window.dayOffset,hour:window.hour};events.push(event);console.log(JSON.stringify(event));}
              throw error;
            }
          }
          outer: while(successful<100&&cursor<candidates.length){
            const width=Math.min(10,100-successful,candidates.length-cursor);
            const batch=Array.from({length:width},(_,j)=>({window:candidates[cursor+j],index:cursor+j}));cursor+=width;
            const results=await Promise.allSettled(batch.map(x=>attempt(x.window,x.index)));
            for(const result of results){
              if(result.status==='rejected'){fatal=String(result.reason?.message||result.reason);break outer;}
              if(result.value==='success')successful++;else expectedMisses++;
            }
          }
          const summary={runId:RUN,candidatesAttempted:cursor,successful,expectedMisses,fatal,events};
          fs.writeFileSync('assignment-diagnostic.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify({runId:RUN,candidatesAttempted:cursor,successful,expectedMisses,fatal},null,2));
          if(fatal)process.exitCode=2;
          NODE
          STATUS=$?
          sleep 8
          cleanup
          trap - EXIT
          exit $STATUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: try-prepare-assignment-runtime-${{ github.run_id }}
          path: |
            worker-tail.log
            assignment-diagnostic.json
          if-no-files-found: warn
