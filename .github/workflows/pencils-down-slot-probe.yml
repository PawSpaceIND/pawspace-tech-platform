name: Probe isolated Golden scheduling windows
on:
  push:
    branches: [ops/pencils-down-staging-ab40dc00]
    paths: [.github/workflows/pencils-down-slot-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pawspace-release-preview
    env:
      ORIGIN: https://pawspace-beta-golden-wallet-3218c3.karthik-fce.workers.dev
    steps:
      - name: Inspect next 31 UAT scheduling days read-only
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,http.cookiejar,datetime
          origin=os.environ['ORIGIN']; jar=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def req(path,method='GET',body=None):
            r=urllib.request.Request(origin+path,method=method,headers={'content-type':'application/json'},data=None if body is None else json.dumps(body).encode())
            with op.open(r,timeout=30) as x:return json.load(x)
          req('/api/staging-login','POST',{'code':os.environ['PAWSPACE_UAT_ACCESS_CODE'],'email':'founder@pawspace.in'})
          today=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5,minutes=30))).date()
          print('date\tactive_reservations\t15-17_overlaps')
          best=[]
          for i in range(1,31):
            d=today+datetime.timedelta(days=i); data=req('/api/uat-scheduling?date='+d.isoformat())['data']; rows=[r for p in data.get('providers',[]) for r in p.get('reservations',[]) if r.get('status')!='cancelled']
            overlaps=[]
            for r in rows:
              s=datetime.datetime.fromisoformat(r['scheduledStart'].replace('Z','+00:00')).astimezone(datetime.timezone(datetime.timedelta(hours=5,minutes=30)))
              e=datetime.datetime.fromisoformat(r['scheduledEnd'].replace('Z','+00:00')).astimezone(datetime.timezone(datetime.timedelta(hours=5,minutes=30)))
              if s.hour<17 and (e.hour>15 or (e.hour==15 and e.minute>0)): overlaps.append(r)
            print(f'{d.isoformat()}\t{len(rows)}\t{len(overlaps)}')
            if not overlaps: best.append(d.isoformat())
          print('BEST_LATE_SLOT_DATES='+','.join(best[-10:]))
          PY
