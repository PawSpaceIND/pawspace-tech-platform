name: Probe isolated Golden scheduling windows
on:
  push:
    branches: [ops/pencils-down-staging-ab40dc00]
    paths: [.github/workflows/pencils-down-slot-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pawspace-release-preview
    env:
      ORIGIN: https://pawspace-beta-golden-wallet-3218c3.karthik-fce.workers.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect next 31 UAT scheduling days read-only
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          node --input-type=module <<'NODE'
          const origin=process.env.ORIGIN;
          const login=await fetch(origin+'/api/staging-login',{method:'POST',headers:{'content-type':'application/json','user-agent':'Mozilla/5.0 PawSpace-UAT-Scheduler-Probe'},body:JSON.stringify({code:process.env.PAWSPACE_UAT_ACCESS_CODE,email:'founder@pawspace.in'})});
          if(!login.ok)throw new Error(`UAT login HTTP ${login.status}: ${await login.text()}`);
          const cookie=(login.headers.get('set-cookie')||'').split(';',1)[0]; if(!cookie)throw new Error('UAT login cookie missing');
          const get=async path=>{const r=await fetch(origin+path,{headers:{cookie,'user-agent':'Mozilla/5.0 PawSpace-UAT-Scheduler-Probe','cache-control':'no-cache'}});if(!r.ok)throw new Error(`${path} HTTP ${r.status}: ${await r.text()}`);return r.json();};
          const istNow=new Date(Date.now()+330*60000);const base=new Date(Date.UTC(istNow.getUTCFullYear(),istNow.getUTCMonth(),istNow.getUTCDate()));
          console.log('date\tactive_reservations\t15-17_overlaps');const best=[];
          for(let i=1;i<31;i++){
            const d=new Date(base.getTime()+i*86400000);const iso=d.toISOString().slice(0,10);const data=(await get('/api/uat-scheduling?date='+iso)).data;const rows=(data.providers||[]).flatMap(p=>p.reservations||[]).filter(r=>r.status!=='cancelled');
            const overlaps=rows.filter(r=>{const s=new Date(r.scheduledStart).getTime(),e=new Date(r.scheduledEnd).getTime(),start=new Date(`${iso}T15:00:00+05:30`).getTime(),end=new Date(`${iso}T17:00:00+05:30`).getTime();return s<end&&e>start;});
            console.log(`${iso}\t${rows.length}\t${overlaps.length}`);if(!overlaps.length)best.push(iso);
          }
          console.log('BEST_LATE_SLOT_DATES='+best.slice(-10).join(','));
          NODE
