name: Mission 06 local dev

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  mission06:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-otp-inputs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Commit missing Playwright Test dependency atomically
        run: |
          npm install --save-dev @playwright/test@1.62.1
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "test(e2e): declare playwright test runner"
            git push origin HEAD:fix/login-otp-inputs
          fi
      - run: npx playwright install --with-deps chromium
      - name: Run exact local QA harness
        run: |
          ln -s "$GITHUB_WORKSPACE" "$HOME/pawspace-tech-platform"
          bash qa.sh fix/login-otp-inputs
      - name: Print dev server log on failure
        if: failure()
        run: tail -200 /tmp/pawspace-dev.log || true
