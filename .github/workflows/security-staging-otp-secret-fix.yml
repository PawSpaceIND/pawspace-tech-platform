name: Security staging OTP secret wiring fixer

on:
  push:
    branches:
      - security/auth-otp-hardening

permissions:
  contents: write

jobs:
  fix-staging-wiring:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/auth-otp-hardening
      - name: Wire OTP pepper into staging secret deployment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const count = source.split(before).length - 1;
            if (count === 0 && source.includes(after)) return;
            if (count !== 1) throw new Error(`${path}: expected one match, found ${count}: ${before}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          const workflow = '.github/workflows/deploy-staging.yml';
          replaceOnce(workflow,
            '#              PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT  (>=32 chars) signs OTP identity assertions\n',
            '#              PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT  (>=32 chars) signs OTP identity assertions\n#              PAWSPACE_OTP_PEPPER                     (>=32 chars) HMAC key for OTP challenge storage\n');
          replaceOnce(workflow,
            '          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}\n        run: node scripts/stage-config.mjs\n',
            '          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}\n          PAWSPACE_OTP_PEPPER: ${{ secrets.PAWSPACE_OTP_PEPPER }}\n        run: node scripts/stage-config.mjs\n');
          replaceOnce(workflow,
            '          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}\n          RAZORPAY_KEY_ID_SANDBOX:',
            '          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}\n          PAWSPACE_OTP_PEPPER: ${{ secrets.PAWSPACE_OTP_PEPPER }}\n          RAZORPAY_KEY_ID_SANDBOX:');
          replaceOnce(workflow,
            'const requiredNames = ["PAWSPACE_UAT_ACCESS_CODE", "PAWSPACE_UAT_SIGNING_KEY", "PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT"];',
            'const requiredNames = ["PAWSPACE_UAT_ACCESS_CODE", "PAWSPACE_UAT_SIGNING_KEY", "PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT", "PAWSPACE_OTP_PEPPER"];');

          const stage = 'scripts/stage-config.mjs';
          replaceOnce(stage,
            '//   PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT signs customer/partner OTP assertions (>=32 chars)\n',
            '//   PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT signs customer/partner OTP assertions (>=32 chars)\n//   PAWSPACE_OTP_PEPPER                    HMAC key for OTP challenge storage     (>=32 chars)\n');
          replaceOnce(stage,
            '  ["PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT", 32, "This signs customer and partner OTP identity assertions."],\n];',
            '  ["PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT", 32, "This signs customer and partner OTP identity assertions."],\n  ["PAWSPACE_OTP_PEPPER", 32, "This HMACs customer and partner OTP challenges at rest."],\n];');
          replaceOnce(stage,
            '  PAWSPACE_PAYMENT_ENV: "sandbox",\n  PAWSPACE_UAT_LOGIN: "on",',
            '  PAWSPACE_PAYMENT_ENV: "sandbox",\n  PAWSPACE_IDENTITY_ENV: "sandbox",\n  PAWSPACE_UAT_LOGIN: "on",');
          NODE
          git diff --check
          git diff -- .github/workflows/deploy-staging.yml scripts/stage-config.mjs
      - name: Commit staging wiring correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/deploy-staging.yml scripts/stage-config.mjs; then
            echo "Staging OTP secret wiring already correct."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-staging.yml scripts/stage-config.mjs
          git commit -m "fix: wire OTP pepper into staging deployment"
          git push origin HEAD:security/auth-otp-hardening
