name: Atlas Hire provider read-only probe

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type probe-atlas-hire-staging'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  probe-providers:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'probe-atlas-hire-staging' }}
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 10
    env:
      EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
      EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
      EXOTEL_SID: ${{ secrets.EXOTEL_SID }}
      EXOTEL_CALLER_ID: ${{ secrets.EXOTEL_CALLER_ID }}
      META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
      META_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.META_WHATSAPP_PHONE_NUMBER_ID }}
      META_WHATSAPP_WABA_ID: ${{ secrets.META_WHATSAPP_WABA_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate required secret presence
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in EXOTEL_API_KEY EXOTEL_API_TOKEN EXOTEL_SID EXOTEL_CALLER_ID META_WHATSAPP_UAT_ACCESS_TOKEN META_WHATSAPP_PHONE_NUMBER_ID META_WHATSAPP_WABA_ID; do
            value="${!name:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              echo "MISSING: $name"
              missing=1
            else
              echo "PRESENT: $name"
            fi
          done
          [ "$missing" -eq 0 ]
      - name: Probe Exotel read-only account region
        shell: bash
        run: |
          set -euo pipefail
          node scripts/exotel-region-probe.mjs
      - name: Probe Meta WhatsApp read-only metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=String(process.env.META_WHATSAPP_UAT_ACCESS_TOKEN||'').trim();
          const phoneId=String(process.env.META_WHATSAPP_PHONE_NUMBER_ID||'').trim();
          const waba=String(process.env.META_WHATSAPP_WABA_ID||'').trim();
          if(!token||!phoneId||!waba) throw new Error('Meta probe prerequisites missing');
          const get=async url=>{
            const r=await fetch(url,{headers:{authorization:`Bearer ${token}`},redirect:'error',signal:AbortSignal.timeout(30000)});
            let p={};try{p=await r.json()}catch{}
            if(!r.ok){const e=p?.error||{};console.log(`Meta read-only probe HTTP=${r.status}; code=${Number(e.code||0)}; subcode=${Number(e.error_subcode||0)}`);throw new Error('Meta read-only probe failed');}
            return p;
          };
          const phone=await get(`https://graph.facebook.com/v23.0/${encodeURIComponent(phoneId)}?fields=id,verified_name,display_phone_number,quality_rating`);
          const templates=await get(`https://graph.facebook.com/v23.0/${encodeURIComponent(waba)}/message_templates?fields=name,status,category,language&limit=100`);
          const rows=Array.isArray(templates?.data)?templates.data:[];
          console.log(`META_PHONE_METADATA_OK=${Boolean(phone?.id)}`);
          console.log(`META_TEMPLATE_API_OK=true`);
          console.log(`META_TEMPLATES_RETURNED=${rows.length}`);
          console.log(`META_APPROVED_TEMPLATES=${rows.filter(x=>String(x?.status||'').toUpperCase()==='APPROVED').length}`);
          NODE
      - name: Confirm Atlas Hire remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://atlas-hire-india-staging.pages.dev/healthz
          echo
          echo "Provider credentials were probed read-only from PawSpace Actions; Atlas Hire live transports were not enabled."
