name: Pet Taxi Gate 2 patch
on:
  push:
    branches:
      - agent/taxi-gates1-5
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/taxi-gates1-5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Taxi Gate 2 wiring
        run: python scripts/taxi-gate2-patch.py
      - name: Remove helper and commit Taxi Gate 2
        run: |
          rm -f .github/workflows/taxi-gate2-patch.yml scripts/taxi-gate2-patch.py
          git config user.name "PawSpace Taxi Closure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Close Pet Taxi Gate 2 lifecycle"
          git push origin HEAD:agent/taxi-gates1-5
