name: Bounded next ten synthetic audio conversations
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: inspect-only
        options: [inspect-only, prepare-native-duration, execute-reviewed-usd5]
      expected_sha:
        required: true
        description: Exact reviewed source and certified staging revision
      expected_tester_sha256:
        required: false
        description: Existing authorized synthetic tester hash
      customer_id:
        required: false
        description: Existing canonical synthetic customer
permissions:
  contents: read
concurrency:
  group: pawspace-staging-sweep
  cancel-in-progress: false
jobs:
  bounded-audio:
    runs-on: ubuntu-22.04
    environment: pawspace-staging
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_TESTER_SHA256: ${{ inputs.expected_tester_sha256 }}
      SPECIALIST_CUSTOMER_ID: ${{ inputs.customer_id }}
      PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
      PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
      PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
      ELEVENLABS_API_BASE: ${{ vars.ELEVENLABS_API_BASE }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      GROOMING_AGENT_ID: ${{ vars.ELEVENLABS_GROOMING_AGENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pinned checkout and prohibit workflow reruns
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Read native feature and rate gates without generating audio
        run: node scripts/inspect-next-audio-fees.mjs
      - name: Set and verify staging provider hard duration without generating audio
        if: ${{ inputs.mode == 'prepare-native-duration' }}
        run: node scripts/prepare-next-audio-duration.mjs
      - name: Install synthetic microphone tools
        if: ${{ inputs.mode == 'execute-reviewed-usd5' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Execute only through authenticated bounded leases
        if: ${{ inputs.mode == 'execute-reviewed-usd5' }}
        run: node --experimental-strip-types scripts/next-ten-audio-runner.mjs
      - name: Preserve partial audio and metadata receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: next-ten-bounded-audio
          path: |
            voice-audit-results/
            artifacts/agent-deadlines/
          retention-days: 7
