name: Read Golden provider capacity state
on:
  push:
    branches: [ops/pencils-down-staging-ab40dc00]
    paths: [.github/workflows/pencils-down-capacity-readback.yml]
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pawspace-release-preview
    env:
      ORIGIN: https://pawspace-beta-golden-wallet-3218c3.karthik-fce.workers.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read governed grooming provider state
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          node --input-type=module <<'NODE'
          const origin=process.env.ORIGIN;
          const login=await fetch(origin+'/api/staging-login',{method:'POST',headers:{'content-type':'application/json','user-agent':'Mozilla/5.0 PawSpace-UAT-Capacity-Readback'},body:JSON.stringify({code:process.env.PAWSPACE_UAT_ACCESS_CODE,email:'founder@pawspace.in'})});
          if(!login.ok)throw new Error(`login ${login.status}`);const cookie=(login.headers.get('set-cookie')||'').split(';',1)[0];
          const r=await fetch(origin+'/api/provider-capacity-control?cityId=blr&service=grooming',{headers:{cookie,'user-agent':'Mozilla/5.0 PawSpace-UAT-Capacity-Readback','cache-control':'no-cache'}});if(!r.ok)throw new Error(`capacity ${r.status}: ${await r.text()}`);const data=(await r.json()).data;
          console.log('PROFILES='+JSON.stringify((data.profiles||[]).map(p=>({id:p.id,city:p.city_id,model:p.provider_model,services:p.services_json,zones:p.zones_json,live:p.live,status:p.status,effectiveFrom:p.effective_from,effectiveTo:p.effective_to,capacity:p.capacity,buffer:p.travel_buffer_minutes,maxDaily:p.max_daily_jobs,timeout:p.acceptance_timeout_minutes}))));
          console.log('UNAVAILABILITY='+JSON.stringify((data.unavailability||[]).filter(u=>u.status==='active').map(u=>({id:u.id,provider:u.provider_id,start:u.starts_at,end:u.ends_at,reason:u.reason,status:u.status}))));
          console.log('AVAILABILITY_COUNT='+(data.availability||[]).length);
          NODE
