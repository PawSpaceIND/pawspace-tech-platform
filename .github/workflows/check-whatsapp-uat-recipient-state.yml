name: Check WhatsApp UAT recipient staging state

on:
  push:
    branches:
      - fix/whatsapp-uat-staging-deploy-isolation
    paths:
      - .github/workflows/check-whatsapp-uat-recipient-state.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-recipient-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect allowlisted recipient state without exposing identifiers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          META_WHATSAPP_UAT_ALLOWLIST: ${{ secrets.META_WHATSAPP_UAT_ALLOWLIST }}
          PAWSPACE_COMMUNICATION_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_COMMUNICATION_UAT_ALLOWLIST }}
        run: |
          set -euo pipefail
          RECIPIENT_STATE="$RUNNER_TEMP/recipient-state.json"; BOOKINGS="$RUNNER_TEMP/bookings.json"; MESSAGES="$RUNNER_TEMP/messages.json"; export RECIPIENT_STATE BOOKINGS MESSAGES
          trap 'rm -f "$RECIPIENT_STATE" "$BOOKINGS" "$MESSAGES"' EXIT
          RAW="${META_WHATSAPP_UAT_ALLOWLIST:-${PAWSPACE_COMMUNICATION_UAT_ALLOWLIST:-}}"
          [ -n "$RAW" ] || { echo "No UAT allowlist configured." >&2; exit 1; }
          RECIPIENT="$(printf '%s' "$RAW" | cut -d',' -f1 | xargs)"; export RECIPIENT
          echo "::add-mask::$RECIPIENT"
          npx --yes wrangler@4 d1 execute pawspace-staging --remote --command "SELECT c.id AS customer_id,c.primary_phone,c.secondary_phone,p.whatsapp_consent,p.opt_out FROM canonical_customers c JOIN customer_contact_preferences p ON p.customer_id=c.id WHERE p.whatsapp_consent=1 AND COALESCE(p.opt_out,0)<>1 LIMIT 5000;" --json > "$RECIPIENT_STATE"
          npx --yes wrangler@4 d1 execute pawspace-staging --remote --command "SELECT customer_id,COUNT(*) AS booking_count FROM canonical_bookings GROUP BY customer_id;" --json > "$BOOKINGS"
          npx --yes wrangler@4 d1 execute pawspace-staging --remote --command "SELECT m.id AS message_id,m.customer_id,m.template_key,m.status AS message_status,o.status AS outbox_status,o.next_attempt_at,t.status AS template_status FROM communication_messages m JOIN communication_outbox o ON o.message_id=m.id LEFT JOIN whatsapp_uat_templates t ON t.template_key=m.template_key WHERE m.channel='whatsapp' AND o.status IN ('queued','retry_pending','scheduled') ORDER BY o.updated_at DESC LIMIT 2000;" --json > "$MESSAGES"
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';
          const flatten=p=>(Array.isArray(p)?p:[]).flatMap(b=>Array.isArray(b?.results)?b.results:[]);
          const digits=v=>String(v??'').replace(/\D/g,'');
          const target=digits(process.env.RECIPIENT);
          const customers=flatten(JSON.parse(readFileSync(process.env.RECIPIENT_STATE,'utf8')));
          const bookings=flatten(JSON.parse(readFileSync(process.env.BOOKINGS,'utf8')));
          const messages=flatten(JSON.parse(readFileSync(process.env.MESSAGES,'utf8')));
          const customer=customers.find(r=>[r.primary_phone,r.secondary_phone].some(v=>digits(v)===target));
          const customerId=String(customer?.customer_id||'');
          const bookingCount=customerId?Number(bookings.find(r=>String(r.customer_id||'')===customerId)?.booking_count||0):0;
          const dispatchable=customerId?messages.filter(r=>String(r.customer_id||'')===customerId&&String(r.template_status||'')==='approved'&&Number(r.next_attempt_at||0)<=Date.now()).length:0;
          console.log(`allowlistedConsen­tedCustomer=${Boolean(customerId)}; bookingCount=${bookingCount}; existingDispatchableApprovedWhatsApp=${dispatchable}`.replace('Consen­ted','Consented'));
          NODE
