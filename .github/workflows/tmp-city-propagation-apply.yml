name: Temporary city propagation applicator
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/city-propagation-p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded city propagation patch
        run: node scripts/apply-city-propagation-fix.mjs
      - name: Remove disposable applicator
        run: rm scripts/apply-city-propagation-fix.mjs .github/workflows/tmp-city-propagation-apply.yml
      - name: Verify staged contract shape
        run: |
          node --experimental-strip-types --test tests/city-propagation-closure.test.mjs
          git diff --check
      - name: Commit tested patch back to branch
        run: |
          git config user.name 'PawSpaceIND'
          git config user.email 'karthik@pawspace.in'
          git add -A
          git commit -m 'fix: propagate resolved city through customer scheduling'
          git push origin HEAD:${{ github.head_ref }}
