name: Food CI syntax fix
on:
  push:
    branches:
      - agent/food-gates1-5
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/food-gates1-5
      - name: Fix Food subscription invoice-channel declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("lib/food-subscription-governance.ts")
          source = path.read_text()
          old = 'invoiceChannel:String(customer?.email||"").includes("@")?"email":String(sub.communication_channel) as FoodSubscriptionChannel'
          new = 'invoiceChannel=String(customer?.email||"").includes("@")?"email":String(sub.communication_channel) as FoodSubscriptionChannel'
          if old not in source:
              raise SystemExit("Expected Food subscription syntax marker not found")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit focused fix and remove helper
        run: |
          rm -f .github/workflows/food-ci-syntax-fix.yml
          git config user.name "PawSpace Food Closure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(food): correct subscription invoice channel declaration"
          git push origin HEAD:agent/food-gates1-5
