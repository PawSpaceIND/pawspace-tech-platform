name: Training Gate 3 cancellation earnings fix
on:
  push:
    branches: [grooming-integration-closure]
    paths:
      - .github/workflows/training-gate3-cancellation-earnings-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Preserve completed-session earnings and terminal cancellation guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          finance=Path('lib/training-finance.ts')
          text=finance.read_text()
          old='status=String(p.payment_status)==="captured"&&String(p.booking_status)!=="cancelled"?"earned":"held_payment";hold=status==="earned"?null:"Customer payment is not captured or booking is cancelled";'
          new='status=String(p.payment_status)==="captured"?"earned":"held_payment";hold=status==="earned"?null:"Customer payment is not captured";'
          assert old in text
          finance.write_text(text.replace(old,new,1))
          cancellation=Path('lib/training-cancellation.ts')
          text=cancellation.read_text()
          old='if(["completed","cancelled"].includes(String(row.status)))throw new Response("Completed or cancelled Training programmes cannot open a new cancellation request",{status:409});'
          new='if(["completed","completed_with_exceptions","cancelled"].includes(String(row.status)))throw new Response("Terminal or cancelled Training programmes cannot open a new cancellation request",{status:409});'
          assert old in text
          cancellation.write_text(text.replace(old,new,1))
          flow=Path('app/mobile-app/training-flow.tsx')
          text=flow.read_text()
          old='programme?.status==="completed"||programme?.status==="cancelled"'
          new='["completed","completed_with_exceptions","cancelled"].includes(String(programme?.status||""))'
          assert old in text
          flow.write_text(text.replace(old,new,1))
          PY
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit verified earnings preservation
        run: |
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add lib/training-finance.ts lib/training-cancellation.ts app/mobile-app/training-flow.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Preserve completed Training earnings through cancellation [skip ci]"
          git pull --rebase origin grooming-integration-closure
          git push origin grooming-integration-closure
