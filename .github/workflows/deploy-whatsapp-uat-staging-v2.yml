name: Deploy WhatsApp UAT staging v2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "whatsapp-uat" to confirm isolated staging deploy'
        required: true
        default: ''
      expected_sha:
        description: 'Exact application SHA to deploy'
        required: true
        default: '939620de0b7b904a4720f41a9ba301e03747b6c4'
  push:
    branches:
      - fix/whatsapp-uat-staging-deploy-isolation
    paths:
      - .github/workflows/deploy-whatsapp-uat-staging-v2.yml

permissions:
  contents: read

jobs:
  deploy-whatsapp-uat-v2:
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'whatsapp-uat' }}
    runs-on: ubuntu-latest
    concurrency: pawspace-staging-deploy
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.expected_sha || '939620de0b7b904a4720f41a9ba301e03747b6c4' }}
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
      WRANGLER_CONFIG: dist/server/wrangler.json

    steps:
      - name: Check workflow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove isolation contract
        run: node --test tests/whatsapp-uat-staging-deploy-isolation.test.mjs tests/exotel-deployment-wiring.test.mjs

      - name: Check out exact gateway SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact checkout
        run: |
          set -euo pipefail
          case "$TARGET_SHA" in *[!0-9a-f]* | "" ) exit 1 ;; esac
          [ "${#TARGET_SHA}" -eq 40 ]
          [ "$(git rev-parse HEAD)" = "$TARGET_SHA" ]
          [ -z "$(git status --porcelain)" ]
          echo "Exact gateway SHA verified."
      - name: Install
        run: npm run install:ci
      - name: Focused webhook regression
        run: node --test tests/external-webhook-reachability.test.mjs
      - name: Build
        run: npm run build
      - name: Generate staging config
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs

      - name: Ensure source staging Meta readiness is complete
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          READY="$(node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||"").replace(/\/$/,"");
          const login=await fetch(`${base}/api/staging-login`,{method:"POST",redirect:"manual",headers:{"content-type":"application/json",origin:base},body:JSON.stringify({action:"login",code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||""),email:"founder@pawspace.in"}),signal:AbortSignal.timeout(15000)});
          const cookie=String(login.headers.get("set-cookie")||"").split(";")[0];
          if(!cookie){console.log("false");process.exit(0)}
          const r=await fetch(`${base}/api/integration-readiness`,{headers:{cookie},signal:AbortSignal.timeout(15000)});let p=null;try{p=await r.json()}catch{};const ms=p?.uatSandbox?.modules||p?.data?.uatSandbox?.modules||[];const m=Array.isArray(ms)?ms.find(x=>x?.code==="meta_whatsapp"):null;console.log(r.ok&&m?.configuredForExternalTest===true?"true":"false");
          NODE
          )"
          if [ "$READY" != "true" ]; then
            LOG="$RUNNER_TEMP/rollback.log"
            if ! npx wrangler rollback --name pawspace-staging --message "restore staging Meta bindings before WhatsApp UAT deploy" > "$LOG" 2>&1; then rm -f "$LOG"; echo "Staging rollback failed; raw output withheld." >&2; exit 1; fi
            rm -f "$LOG"
          fi
          node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||"").replace(/\/$/,"");
          for(let i=0;i<10;i++){
            const login=await fetch(`${base}/api/staging-login`,{method:"POST",redirect:"manual",headers:{"content-type":"application/json",origin:base},body:JSON.stringify({action:"login",code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||""),email:"founder@pawspace.in"}),signal:AbortSignal.timeout(15000)});const cookie=String(login.headers.get("set-cookie")||"").split(";")[0];
            if(cookie){const r=await fetch(`${base}/api/integration-readiness`,{headers:{cookie},signal:AbortSignal.timeout(15000)});let p=null;try{p=await r.json()}catch{};const ms=p?.uatSandbox?.modules||p?.data?.uatSandbox?.modules||[];const m=Array.isArray(ms)?ms.find(x=>x?.code==="meta_whatsapp"):null;if(r.ok&&m?.configuredForExternalTest===true){console.log("Source staging Meta readiness complete; values withheld.");process.exit(0)}}
            await new Promise(r=>setTimeout(r,3000));
          }
          throw new Error("Source staging Meta readiness incomplete");
          NODE

      - name: Preserve remote plain vars and active-version Meta identifiers without logging values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SETTINGS="$RUNNER_TEMP/settings.json"; STATUS_FILE="$RUNNER_TEMP/status.json"; VIEW_FILE="$RUNNER_TEMP/version.json"
          export SETTINGS STATUS_FILE VIEW_FILE
          trap 'rm -f "$SETTINGS" "$STATUS_FILE" "$VIEW_FILE"' EXIT
          HTTP="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pawspace-staging/settings")"
          [ "$HTTP" = "200" ] || { echo "Settings snapshot failed (HTTP $HTTP); body withheld." >&2; exit 1; }
          npx wrangler deployments status --name pawspace-staging --json > "$STATUS_FILE" 2>/dev/null
          VERSION_ID="$(node --input-type=module <<'NODE'
          import{readFileSync}from"node:fs";const root=JSON.parse(readFileSync(process.env.STATUS_FILE,"utf8"));const c=[];const walk=v=>{if(!v||typeof v!=="object")return;if(typeof v.version_id==="string")c.push(v.version_id);if(typeof v.versionId==="string")c.push(v.versionId);if(typeof v.id==="string"&&/^[0-9a-f-]{36}$/i.test(v.id)&&("percentage"in v||"traffic"in v))c.push(v.id);for(const child of Object.values(v))walk(child)};walk(root);const id=c.find(v=>/^[0-9a-f-]{36}$/i.test(v));if(!id)process.exit(2);process.stdout.write(id);
          NODE
          )"
          npx wrangler versions view "$VERSION_ID" --name pawspace-staging --json > "$VIEW_FILE" 2>/dev/null
          node --input-type=module <<'NODE'
          import{readFileSync,writeFileSync}from"node:fs";
          const settings=JSON.parse(readFileSync(process.env.SETTINGS,"utf8"));const version=JSON.parse(readFileSync(process.env.VIEW_FILE,"utf8"));
          const remoteVars={};for(const b of Array.isArray(settings?.result?.bindings)?settings.result.bindings:[]){if(b?.type!=="plain_text")continue;const n=String(b?.name||"").trim();if(/^[A-Z0-9_]+$/.test(n))remoteVars[n]=String(b?.text??b?.value??"")}
          const wanted=new Set(["META_WHATSAPP_PHONE_NUMBER_ID","META_WHATSAPP_WABA_ID"]);const ids={};const walk=v=>{if(!v||typeof v!=="object")return;if(typeof v.name==="string"&&wanted.has(v.name)&&v.type==="plain_text"){const value=typeof v.text==="string"?v.text:typeof v.value==="string"?v.value:"";if(value)ids[v.name]=value}for(const child of Object.values(v))walk(child)};walk(version);
          if(Object.keys(ids).length!==2)throw new Error("Both Meta identifier bindings could not be recovered without logging values");
          const path=String(process.env.WRANGLER_CONFIG||"");if(path!=="dist/server/wrangler.json")throw new Error("Unexpected generated config path");const config=JSON.parse(readFileSync(path,"utf8"));config.vars={...remoteVars,...ids,...(config.vars||{})};config.keep_vars=true;writeFileSync(path,JSON.stringify(config,null,2),{mode:0o600});
          console.log(`Preserved ${Object.keys(remoteVars).length} script-level plain var(s) plus both active-version Meta identifier bindings; values withheld.`);
          NODE

      - name: Deploy exact SHA to pawspace-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          SECRETS="$RUNNER_TEMP/uat-secrets.json"; LOG="$RUNNER_TEMP/deploy.log"; export SECRETS
          trap 'rm -f "$SECRETS" "$LOG" "$WRANGLER_CONFIG"' EXIT
          node --input-type=module <<'NODE'
          import{writeFileSync}from"node:fs";const names=["PAWSPACE_UAT_ACCESS_CODE","PAWSPACE_UAT_SIGNING_KEY","PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT"];const v=Object.fromEntries(names.map(n=>[n,String(process.env[n]||"")]));if(Object.values(v).some(x=>!x))throw new Error("Core UAT secret missing");v.PAWSPACE_STAGING_LIVE_CUSTOMER_OTP="false";const token=String(process.env.META_WHATSAPP_UAT_ACCESS_TOKEN||"").trim();if(token)v.META_WHATSAPP_UAT_ACCESS_TOKEN=token;writeFileSync(process.env.SECRETS,JSON.stringify(v),{mode:0o600});
          NODE
          if ! npx wrangler deploy --config "$WRANGLER_CONFIG" --keep-vars --message "staging $TARGET_SHA" --secrets-file "$SECRETS" > "$LOG" 2>&1; then echo "Wrangler staging deploy failed; raw output withheld." >&2; exit 1; fi
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$LOG" | tail -n 1 || true)"; [ "$URL" = "$STAGING_URL" ] || { echo "Unexpected deployment origin; raw output withheld." >&2; exit 1; }
          echo "Exact gateway SHA deployed to pawspace-staging; sensitive binding values withheld."

      - name: Certify exact SHA and isolated D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ env.TARGET_SHA }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
        run: node tests/e2e/staging-certification.mjs --isolation-only

      - name: Verify health webhook boundary and Meta readiness
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||"").replace(/\/$/,"");const health=await fetch(`${base}/healthz`,{redirect:"manual",signal:AbortSignal.timeout(15000)});if(health.status!==200)throw new Error(`healthz HTTP ${health.status}`);
          const getProbe=await fetch(`${base}/api/whatsapp/meta-webhook`,{redirect:"manual",signal:AbortSignal.timeout(15000)});if(getProbe.status!==403)throw new Error(`Meta GET verifier boundary HTTP ${getProbe.status}`);
          const invalid=await fetch(`${base}/api/whatsapp/meta-webhook`,{method:"POST",headers:{"content-type":"application/json","x-hub-signature-256":"sha256=invalid-uat-probe"},body:JSON.stringify({object:"whatsapp_business_account",entry:[]}),redirect:"manual",signal:AbortSignal.timeout(15000)});if(invalid.status!==401)throw new Error(`invalid signature HTTP ${invalid.status}`);
          const login=await fetch(`${base}/api/staging-login`,{method:"POST",headers:{"content-type":"application/json",origin:base},body:JSON.stringify({action:"login",code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||""),email:"founder@pawspace.in"}),redirect:"manual",signal:AbortSignal.timeout(15000)});const cookie=String(login.headers.get("set-cookie")||"").split(";")[0];const r=await fetch(`${base}/api/integration-readiness`,{headers:{cookie},signal:AbortSignal.timeout(15000)});let p=null;try{p=await r.json()}catch{};const ms=p?.uatSandbox?.modules||p?.data?.uatSandbox?.modules||[];const m=Array.isArray(ms)?ms.find(x=>x?.code==="meta_whatsapp"):null;if(!(r.ok&&m?.configuredForExternalTest===true))throw new Error("Meta UAT readiness not preserved");
          console.log("healthz=200; webhook bypasses staging-login; invalid signature rejected; Meta readiness preserved.");
          NODE

      - name: Synchronize templates and report aggregate state only
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||"").replace(/\/$/,"");const login=await fetch(`${base}/api/staging-login`,{method:"POST",headers:{"content-type":"application/json",origin:base},body:JSON.stringify({action:"login",code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||""),email:"founder@pawspace.in"}),redirect:"manual",signal:AbortSignal.timeout(15000)});const cookie=String(login.headers.get("set-cookie")||"").split(";")[0];if(!cookie)throw new Error("staging sign-in failed");
          const sync=await fetch(`${base}/api/whatsapp/meta-admin`,{method:"POST",headers:{"content-type":"application/json",origin:base,cookie},body:JSON.stringify({action:"sync_templates"}),signal:AbortSignal.timeout(30000)});let sp=null;try{sp=await sync.json()}catch{};const result=sp?.data||{};console.log(`Template sync HTTP=${sync.status}; status=${String(result.status||"unknown")}; considered=${Number(result.considered??-1)}; allowlistMatches=${Number(result.synced??-1)}`);if(!sync.ok||result.status!=="synced")throw new Error("Meta template sync did not complete");
          const admin=await fetch(`${base}/api/whatsapp/meta-admin`,{headers:{cookie},signal:AbortSignal.timeout(15000)});let ap=null;try{ap=await admin.json()}catch{};const rows=Array.isArray(ap?.data?.templates)?ap.data.templates:[];const approved=rows.filter(x=>x?.status==="approved").length;console.log(`Stored allowlisted templates=${rows.length}; approved allowlisted templates=${approved}`);if(approved<1)throw new Error("No approved allowlisted Meta template available for outbound UAT");
          NODE
