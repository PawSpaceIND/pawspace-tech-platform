name: Harden Grooming media proof ownership

on:
  push:
    branches:
      - grooming-integration-closure
    paths:
      - .github/workflows/grooming-media-proof-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Wire lifecycle to owned service media
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app/api/grooming-lifecycle/route.ts')
          text=path.read_text()
          auth='import{authError,requirePermission,requireProviderOwnership,resolveActor,securityAudit}from"../../../lib/server-auth";\n'
          media='import{assertServiceProofRef}from"../../../lib/service-media-security";\n'
          if media not in text:
              if auth not in text: raise SystemExit('auth import anchor missing')
              text=text.replace(auth,auth+media,1)
          old='function validProofRef(value:string|undefined){if(!value)return true;return value.startsWith("uat://proof/")||value.startsWith("media://asset/");}\n'
          text=text.replace(old,'')
          old_add='if(!validProofRef(input.beforePhotoRef)||!validProofRef(input.afterPhotoRef))return json({error:"Proof media must use a PawSpace media asset reference; arbitrary URLs and data URIs are not accepted"},400);'
          new_add='await assertServiceProofRef(db,{ref:input.beforePhotoRef,bookingId:input.bookingId,providerId:String(work.provider_id),purpose:"before_service"});await assertServiceProofRef(db,{ref:input.afterPhotoRef,bookingId:input.bookingId,providerId:String(work.provider_id),purpose:"after_service"});'
          if old_add not in text: raise SystemExit('add proof validation anchor missing')
          text=text.replace(old_add,new_add,1)
          old_complete='if(!validProofRef(String(proof.before_photo_ref))||!validProofRef(String(proof.after_photo_ref)))return json({error:"Completion proof contains an invalid media reference"},409);'
          new_complete='await assertServiceProofRef(db,{ref:String(proof.before_photo_ref),bookingId:input.bookingId,providerId:String(work.provider_id),purpose:"before_service"});await assertServiceProofRef(db,{ref:String(proof.after_photo_ref),bookingId:input.bookingId,providerId:String(work.provider_id),purpose:"after_service"});'
          if old_complete not in text: raise SystemExit('completion validation anchor missing')
          text=text.replace(old_complete,new_complete,1)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit verified proof ownership patch
        run: |
          git config user.name "PawSpace Closure Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/grooming-lifecycle/route.ts
          git commit -m "Require booking-owned scanned media for Grooming proof [skip ci]"
          git pull --rebase origin grooming-integration-closure
          git push origin HEAD:grooming-integration-closure
