name: Temporary PR 220 bounded fix
on:
  pull_request:
    types: [opened]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout disposable head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: tmp/pr220-walking-training-fix
          path: .runner
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded fixes
        run: python3 .runner/.github/tmp-pr220-patch.py
      - name: Regenerate deterministic UAT seed
        run: node --experimental-strip-types scripts/uat-demo-seed-gen.mjs
      - name: Run focused regression tests
        run: node --experimental-strip-types --test tests/walking-per-session-amount.test.mjs tests/uat-demo-seed.test.mjs tests/grooming-booking-calendar.test.mjs
      - name: Run repository tests
        run: npm test
      - name: Commit tested bounded fix
        shell: bash
        run: |
          git config user.name "PawSpace CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/pr220-exec-marker.txt
          git add lib/walking-lifecycle.ts lib/walking-lifecycle-client.ts scripts/uat-demo-seed-gen.mjs scripts/uat-demo-seed.sql tests/walking-per-session-amount.test.mjs tests/uat-demo-seed.test.mjs
          git commit -m "fix(uat): close walking and training review blockers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
