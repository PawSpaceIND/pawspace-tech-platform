name: Fix Training Gate 2 regression

on:
  push:
    branches: [grooming-integration-closure]
    paths:
      - .github/workflows/fix-training-gate2-regression.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Update stale trainer assertions and terminal programme status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/rendered-html.test.mjs')
          text=path.read_text()
          replacements={
            '  assert.match(trainer, /60 MINUTES PER PET/);':'  assert.match(trainer, /CANONICAL SESSION LEDGER/);',
            '  assert.match(trainer, /Package permits trainer-led outdoor leash\\/toilet practice/);':'  assert.match(trainer, /Trainer-led permitted programme/);',
            '  assert.match(trainer, /Approve slot/);':'  assert.match(trainer, /Complete & consume one session/);',
            '  assert.match(trainer, /dog.pets \\* 60/);':'  assert.match(trainer, /loadTrainerSessions/);',
            '  assert.match(trainer, /selected.pets \\* 60/);':'  assert.match(trainer, /selected.total_sessions/);',
          }
          for old,new in replacements.items():
              assert old in text, old
              text=text.replace(old,new,1)
          path.write_text(text)

          lifecycle=Path('lib/training-session-lifecycle.ts')
          text=lifecycle.read_text()
          old='const terminal=completed+cancelled+noShow===total;const status=terminal?"completed_with_exceptions":active>0||completed>0||noShow>0?"in_progress":"scheduled";'
          new='const terminal=completed+cancelled+noShow===total;const status=terminal?(noShow===0&&cancelled===0?"completed":"completed_with_exceptions"):active>0||completed>0||noShow>0?"in_progress":"scheduled";'
          assert old in text
          lifecycle.write_text(text.replace(old,new,1))
          PY
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit verified Gate 2 regression fix
        run: |
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add tests/rendered-html.test.mjs lib/training-session-lifecycle.ts
          git diff --cached --quiet && exit 0
          git commit -m "Update trainer regressions for canonical session lifecycle [skip ci]"
          git pull --rebase origin grooming-integration-closure
          git push origin grooming-integration-closure
