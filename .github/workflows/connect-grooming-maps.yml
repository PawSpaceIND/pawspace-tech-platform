name: Connect Grooming Maps UAT

on:
  push:
    branches: [grooming-integration-closure]
    paths:
      - .github/workflows/connect-grooming-maps.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Patch customer and Partner Maps wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page=Path('app/page.tsx')
          text=page.read_text()
          old='import { createCanonicalLifecycle } from "../lib/canonical-lifecycle-client";'
          new=old+'\nimport { saveGroomingServiceLocation } from "../lib/grooming-location-client";'
          if 'grooming-location-client' not in text:
              assert old in text
              text=text.replace(old,new,1)
          old='  const [phone, setPhone] = useState("");'
          new=old+'\n  const [serviceAddress, setServiceAddress] = useState("");'
          if 'const [serviceAddress' not in text:
              assert old in text
              text=text.replace(old,new,1)
          old='<label>Doorstep address<input required placeholder="Search Bengaluru address or use current location" /></label>'
          new='<label>Doorstep address<input required value={serviceAddress} onChange={(event) => setServiceAddress(event.target.value)} placeholder="Search Bengaluru address or use current location" /></label>'
          assert old in text or new in text
          text=text.replace(old,new,1)
          marker='      createTestTransaction({customerId,'
          if 'await saveGroomingServiceLocation({bookingId:canonical.bookingId' not in text:
              assert marker in text
              text=text.replace(marker,'      await saveGroomingServiceLocation({bookingId:canonical.bookingId,customerId,address:serviceAddress});\n'+marker,1)
          page.write_text(text)

          partner=Path('app/partner-app/canonical-grooming-jobs.tsx')
          text=partner.read_text()
          old='import{useEffect,useMemo,useState}from"react";'
          new=old+'\nimport GroomingRouteCard from"./grooming-route-card";'
          if 'grooming-route-card' not in text:
              assert old in text
              text=text.replace(old,new,1)
          marker='        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:18}}>'
          if '<GroomingRouteCard bookingId={selected.bookingId}' not in text:
              assert marker in text
              text=text.replace(marker,'        <GroomingRouteCard bookingId={selected.bookingId} providerId={selected.providerId} />\n'+marker,1)
          text=text.replace('opacity:busy||!nextAction?.7:1','opacity:busy||!nextAction?0.7:1')
          partner.write_text(text)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit verified wiring
        run: |
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add app/page.tsx app/partner-app/canonical-grooming-jobs.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Connect canonical Grooming locations to Partner Maps [skip ci]"
          git pull --rebase origin grooming-integration-closure
          git push origin grooming-integration-closure
