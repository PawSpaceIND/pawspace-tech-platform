name: Diagnose WhatsApp UAT staging configuration

on:
  push:
    branches:
      - fix/whatsapp-uat-staging-deploy-isolation
    paths:
      - .github/workflows/diagnose-whatsapp-uat-staging.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure restored Meta runtime is complete
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          READY="$(node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||"").replace(/\/$/,"");
          const login=await fetch(`${base}/api/staging-login`,{method:"POST",redirect:"manual",headers:{"content-type":"application/json",origin:base},body:JSON.stringify({action:"login",code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||""),email:"founder@pawspace.in"}),signal:AbortSignal.timeout(15000)});
          const cookie=String(login.headers.get("set-cookie")||"").split(";")[0];
          if(!cookie){console.log("false");process.exit(0)}
          const response=await fetch(`${base}/api/integration-readiness`,{headers:{cookie},signal:AbortSignal.timeout(15000)});let payload=null;try{payload=await response.json()}catch{}
          const modules=payload?.uatSandbox?.modules||payload?.data?.uatSandbox?.modules||[];const meta=Array.isArray(modules)?modules.find(m=>m?.code==="meta_whatsapp"):null;
          console.log(response.ok&&meta?.configuredForExternalTest===true?"true":"false");
          NODE
          )"
          if [ "$READY" != "true" ]; then
            LOG="$RUNNER_TEMP/rollback.log"
            if ! npx wrangler rollback --name pawspace-staging --message "restore staging before Meta version diagnosis" > "$LOG" 2>&1; then rm -f "$LOG"; echo "Rollback failed; raw output withheld." >&2; exit 1; fi
            rm -f "$LOG"
          fi
          node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||"").replace(/\/$/,"");
          for(let i=0;i<10;i++){
            const login=await fetch(`${base}/api/staging-login`,{method:"POST",redirect:"manual",headers:{"content-type":"application/json",origin:base},body:JSON.stringify({action:"login",code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||""),email:"founder@pawspace.in"}),signal:AbortSignal.timeout(15000)});
            const cookie=String(login.headers.get("set-cookie")||"").split(";")[0];
            if(cookie){const response=await fetch(`${base}/api/integration-readiness`,{headers:{cookie},signal:AbortSignal.timeout(15000)});let payload=null;try{payload=await response.json()}catch{};const modules=payload?.uatSandbox?.modules||payload?.data?.uatSandbox?.modules||[];const meta=Array.isArray(modules)?modules.find(m=>m?.code==="meta_whatsapp"):null;if(response.ok&&meta?.configuredForExternalTest===true){console.log("Meta runtime readiness complete; values withheld.");process.exit(0)}}
            await new Promise(r=>setTimeout(r,3000));
          }
          throw new Error("Meta runtime readiness is incomplete");
          NODE
      - name: Inspect active version Meta binding recoverability only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          STATUS_FILE="$RUNNER_TEMP/deployment-status.json"; VIEW_FILE="$RUNNER_TEMP/version-view.json"; export STATUS_FILE VIEW_FILE
          trap 'rm -f "$STATUS_FILE" "$VIEW_FILE"' EXIT
          npx wrangler deployments status --name pawspace-staging --json > "$STATUS_FILE" 2>/dev/null
          VERSION_ID="$(node --input-type=module <<'NODE'
          import{readFileSync}from"node:fs";const root=JSON.parse(readFileSync(process.env.STATUS_FILE,"utf8"));const c=[];const walk=v=>{if(!v||typeof v!=="object")return;if(typeof v.version_id==="string")c.push(v.version_id);if(typeof v.versionId==="string")c.push(v.versionId);if(typeof v.id==="string"&&/^[0-9a-f-]{36}$/i.test(v.id)&&("percentage"in v||"traffic"in v))c.push(v.id);for(const child of Object.values(v))walk(child)};walk(root);const id=c.find(v=>/^[0-9a-f-]{36}$/i.test(v));if(!id)process.exit(2);process.stdout.write(id);
          NODE
          )"
          npx wrangler versions view "$VERSION_ID" --name pawspace-staging --json > "$VIEW_FILE" 2>/dev/null
          node --input-type=module <<'NODE'
          import{readFileSync}from"node:fs";const root=JSON.parse(readFileSync(process.env.VIEW_FILE,"utf8"));const wanted=new Set(["META_WHATSAPP_PHONE_NUMBER_ID","META_WHATSAPP_WABA_ID"]);const found=new Map();
          const walk=v=>{if(!v||typeof v!=="object")return;if(typeof v.name==="string"&&wanted.has(v.name)){const type=String(v.type||"unknown").replace(/[^a-z0-9_-]/gi,"")||"unknown";const value=typeof v.text==="string"?v.text:typeof v.value==="string"?v.value:"";found.set(v.name,{type,readable:Boolean(value)})}for(const child of Object.values(v))walk(child)};walk(root);
          for(const name of wanted){const row=found.get(name);console.log(`${name}: activeVersionBindingType=${row?.type||"absent"}; recoverableWithoutLogging=${row?.readable===true}`)}
          NODE
