name: Diagnose WhatsApp UAT staging configuration

on:
  push:
    branches:
      - fix/whatsapp-uat-staging-deploy-isolation
    paths:
      - .github/workflows/diagnose-whatsapp-uat-staging.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging Meta readiness and diagnose template API without sensitive output
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          STATUS_FILE="$RUNNER_TEMP/deployment-status.json"; VIEW_FILE="$RUNNER_TEMP/version-view.json"; export STATUS_FILE VIEW_FILE
          trap 'rm -f "$STATUS_FILE" "$VIEW_FILE"' EXIT
          node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||"").replace(/\/$/,"");
          const login=await fetch(`${base}/api/staging-login`,{method:"POST",headers:{"content-type":"application/json",origin:base},body:JSON.stringify({action:"login",code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||""),email:"founder@pawspace.in"}),redirect:"manual",signal:AbortSignal.timeout(15000)});
          const cookie=String(login.headers.get("set-cookie")||"").split(";")[0];if(!cookie)throw new Error("staging sign-in failed");
          const r=await fetch(`${base}/api/integration-readiness`,{headers:{cookie},signal:AbortSignal.timeout(15000)});let p=null;try{p=await r.json()}catch{};const ms=p?.uatSandbox?.modules||p?.data?.uatSandbox?.modules||[];const m=Array.isArray(ms)?ms.find(x=>x?.code==="meta_whatsapp"):null;
          console.log(`Meta configuredForExternalTest=${Boolean(r.ok&&m?.configuredForExternalTest===true)}`);
          console.log(`Meta blockerCount=${Array.isArray(m?.blockers)?m.blockers.length:-1}`);
          if(!(r.ok&&m?.configuredForExternalTest===true))throw new Error("Meta runtime readiness incomplete");
          NODE
          npx wrangler deployments status --name pawspace-staging --json > "$STATUS_FILE" 2>/dev/null
          VERSION_ID="$(node --input-type=module <<'NODE'
          import{readFileSync}from"node:fs";const root=JSON.parse(readFileSync(process.env.STATUS_FILE,"utf8"));const c=[];const walk=v=>{if(!v||typeof v!=="object")return;if(typeof v.version_id==="string")c.push(v.version_id);if(typeof v.versionId==="string")c.push(v.versionId);if(typeof v.id==="string"&&/^[0-9a-f-]{36}$/i.test(v.id)&&("percentage"in v||"traffic"in v))c.push(v.id);for(const child of Object.values(v))walk(child)};walk(root);const id=c.find(v=>/^[0-9a-f-]{36}$/i.test(v));if(!id)process.exit(2);process.stdout.write(id);
          NODE
          )"
          npx wrangler versions view "$VERSION_ID" --name pawspace-staging --json > "$VIEW_FILE" 2>/dev/null
          node --input-type=module <<'NODE'
          import{readFileSync}from"node:fs";
          const root=JSON.parse(readFileSync(process.env.VIEW_FILE,"utf8"));
          const wanted=["META_WHATSAPP_WABA_ID","META_WHATSAPP_VERIFY_TOKEN","META_WHATSAPP_UAT_ALLOWLIST","META_WHATSAPP_TEMPLATE_ALLOWLIST","META_WHATSAPP_APP_SECRET"];
          const rows=new Map();
          const walk=v=>{if(!v||typeof v!=="object")return;if(typeof v.name==="string"&&wanted.includes(v.name)){const type=String(v.type||"unknown").replace(/[^a-z0-9_-]/gi,"")||"unknown";const value=typeof v.text==="string"?v.text:typeof v.value==="string"?v.value:"";rows.set(v.name,{type,value})}for(const child of Object.values(v))walk(child)};walk(root);
          for(const name of wanted){const row=rows.get(name);console.log(`${name}: type=${row?.type||"absent"}; readableWithoutLogging=${Boolean(row?.value)}`)}
          const waba=rows.get("META_WHATSAPP_WABA_ID")?.value||"";const token=String(process.env.META_WHATSAPP_UAT_ACCESS_TOKEN||"").trim();
          if(!waba||!token)throw new Error("Template API prerequisites unavailable");
          const response=await fetch(`https://graph.facebook.com/v23.0/${encodeURIComponent(waba)}/message_templates?fields=name,status,category,language&limit=100`,{headers:{authorization:`Bearer ${token}`},redirect:"error",signal:AbortSignal.timeout(30000)});
          let payload=null;try{payload=await response.json()}catch{}
          const error=payload?.error||{};const data=Array.isArray(payload?.data)?payload.data:[];
          console.log(`Meta template API HTTP=${response.status}`);
          console.log(`Meta error code=${Number.isFinite(Number(error.code))?Number(error.code):-1}`);
          console.log(`Meta error subcode=${Number.isFinite(Number(error.error_subcode))?Number(error.error_subcode):-1}`);
          console.log(`Meta error type present=${Boolean(error.type)}`);
          console.log(`Meta templates returned=${data.length}`);
          console.log(`Meta approved templates returned=${data.filter(row=>String(row?.status||"").toUpperCase()==="APPROVED").length}`);
          NODE
