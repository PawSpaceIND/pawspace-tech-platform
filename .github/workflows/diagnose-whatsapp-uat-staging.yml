name: Diagnose WhatsApp UAT staging configuration

on:
  push:
    branches:
      - fix/whatsapp-uat-staging-deploy-isolation
    paths:
      - .github/workflows/diagnose-whatsapp-uat-staging.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore previous staging version if exact-SHA deploy displaced Meta identifiers
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          READY="$(node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||"").replace(/\/$/,"");
          const login=await fetch(`${base}/api/staging-login`,{method:"POST",redirect:"manual",headers:{"content-type":"application/json",origin:base},body:JSON.stringify({action:"login",code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||""),email:"founder@pawspace.in"}),signal:AbortSignal.timeout(15000)});
          const cookie=String(login.headers.get("set-cookie")||"").split(";")[0];
          if(!cookie){console.log("false");process.exit(0)}
          const response=await fetch(`${base}/api/integration-readiness`,{headers:{cookie},signal:AbortSignal.timeout(15000)});let payload=null;try{payload=await response.json()}catch{}
          const modules=payload?.uatSandbox?.modules||payload?.data?.uatSandbox?.modules||[];const meta=Array.isArray(modules)?modules.find(m=>m?.code==="meta_whatsapp"):null;
          console.log(response.ok&&meta?.configuredForExternalTest===true?"true":"false");
          NODE
          )"
          if [ "$READY" != "true" ]; then
            LOG="$RUNNER_TEMP/rollback.log"
            if ! npx wrangler rollback --name pawspace-staging --message "restore staging before Meta binding diagnosis" > "$LOG" 2>&1; then rm -f "$LOG"; echo "Rollback failed; raw output withheld." >&2; exit 1; fi
            rm -f "$LOG"
            echo "Previous staging version restored; values withheld."
          else
            echo "Meta readiness already complete; rollback not required."
          fi
      - name: Wait for restored Meta readiness
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: |
          node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||"").replace(/\/$/,"");
          for(let i=0;i<10;i++){
            const login=await fetch(`${base}/api/staging-login`,{method:"POST",redirect:"manual",headers:{"content-type":"application/json",origin:base},body:JSON.stringify({action:"login",code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||""),email:"founder@pawspace.in"}),signal:AbortSignal.timeout(15000)});
            const cookie=String(login.headers.get("set-cookie")||"").split(";")[0];
            if(cookie){const response=await fetch(`${base}/api/integration-readiness`,{headers:{cookie},signal:AbortSignal.timeout(15000)});let payload=null;try{payload=await response.json()}catch{};const modules=payload?.uatSandbox?.modules||payload?.data?.uatSandbox?.modules||[];const meta=Array.isArray(modules)?modules.find(m=>m?.code==="meta_whatsapp"):null;if(response.ok&&meta?.configuredForExternalTest===true){console.log("Restored Meta readiness is complete; values withheld.");process.exit(0)}}
            await new Promise(r=>setTimeout(r,3000));
          }
          throw new Error("Meta readiness did not recover after rollback");
          NODE
      - name: Inspect required Meta binding names and types only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SETTINGS="$RUNNER_TEMP/settings.json"; export SETTINGS; trap 'rm -f "$SETTINGS"' EXIT
          STATUS="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pawspace-staging/settings")"
          [ "$STATUS" = "200" ] || { echo "Settings probe failed (HTTP $STATUS); body withheld." >&2; exit 1; }
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const response=JSON.parse(readFileSync(process.env.SETTINGS,"utf8"));
          const bindings=Array.isArray(response?.result?.bindings)?response.result.bindings:[];
          const required=["META_WHATSAPP_PHONE_NUMBER_ID","META_WHATSAPP_WABA_ID"];
          for(const name of required){
            const row=bindings.find(binding=>String(binding?.name||"")===name);
            const type=String(row?.type||"missing").replace(/[^a-z0-9_-]/gi,"");
            const readable=typeof row?.text==="string"&&row.text.length>0||typeof row?.value==="string"&&row.value.length>0;
            console.log(`${name}: type=${type||"unknown"}; readableValue=${readable}`);
          }
          NODE
