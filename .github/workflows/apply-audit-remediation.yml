name: Validate audit P0/P1 remediation

on:
  push:
    branches:
      - fix/audit-p1-remediation
    paths:
      - .github/auditparts/READY

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-p1-remediation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Align hardened integration fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected marker missing in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # C3 source contract: implementation now reads guarded SQL directly instead of requiredAll().
          replace("tests/audit-p0-p1-remediation.test.mjs",
                  'assert.equal(destructiveRefreshAfterRead(tcs,tcsDelete,"const payouts=await requiredAll"),true);',
                  'assert.equal(destructiveRefreshAfterRead(tcs,tcsDelete,"SELECT c.booking_id,c.provider_id,c.service_code,c.order_value"),true);')
          replace("tests/audit-p0-p1-remediation.test.mjs",
                  'assert.equal(destructiveRefreshAfterRead(tds,tdsDelete,"const fySettlements=await requiredAll"),true);',
                  'assert.equal(destructiveRefreshAfterRead(tds,tdsDelete,"SELECT r.id result_id,r.employee_id,r.gross_earnings"),true);')
          replace("tests/audit-p0-p1-remediation.test.mjs",
                  'assert.equal(destructiveRefreshAfterRead(sabotageTcs,tcsDelete,"const payouts=await requiredAll"),false);',
                  'assert.equal(destructiveRefreshAfterRead(sabotageTcs,tcsDelete,"SELECT c.booking_id,c.provider_id,c.service_code,c.order_value"),false);')
          replace("tests/audit-p0-p1-remediation.test.mjs",
                  'assert.equal(destructiveRefreshAfterRead(sabotageTds,tdsDelete,"const fySettlements=await requiredAll"),false);',
                  'assert.equal(destructiveRefreshAfterRead(sabotageTds,tdsDelete,"SELECT r.id result_id,r.employee_id,r.gross_earnings"),false);')

          # H9 source contract: retain the caught template-sync failure and prove fanout follows it.
          old = 'const templateSyncIsolated=(source)=>{const scheduled=source.indexOf("async scheduled"),sync=source.indexOf("syncSubmittedMetaTemplateStatuses",scheduled),fanout=source.indexOf("Promise.allSettled",sync),catchIndex=source.indexOf("catch(error){templateSyncError=",sync);return scheduled>=0&&sync>=0&&catchIndex>sync&&fanout>catchIndex&&!source.slice(sync,fanout).includes("blocked before dispatch");};'
          new = 'const templateSyncIsolated=(source)=>{const scheduled=source.indexOf("async scheduled"),sync=source.indexOf("syncSubmittedMetaTemplateStatuses",scheduled),catchIndex=source.indexOf("catch(error){templateSyncError=",sync),fanout=source.indexOf("=await Promise.allSettled([",catchIndex);return scheduled>=0&&sync>scheduled&&catchIndex>sync&&fanout>catchIndex&&!source.slice(catchIndex,fanout).includes("catch(error){throw error");};'
          replace("tests/audit-p0-p1-remediation.test.mjs", old, new)

          # H1 source contract: restoration is now an inline, write-preconditioned closure.
          old = 'const restoreIsCollisionSafe=(source)=>source.includes("SCHEDULING_RESERVATION_ACTIVE_SLOT_PREDICATE")&&source.includes("restoreAssignmentRows")&&source.includes("AND NOT EXISTS (SELECT 1 FROM scheduling_reservations AS conflict")&&!source.includes(\'previousRows.results.map(row=>db.prepare("UPDATE scheduling_reservations SET status=? WHERE id=?")\');'
          new = 'const restoreIsCollisionSafe=(source)=>source.includes("SCHEDULING_RESERVATION_ACTIVE_SLOT_PREDICATE")&&source.includes("restore=async()=>")&&source.includes("AND NOT EXISTS (SELECT 1 FROM scheduling_reservations other")&&source.includes("other.${SCHEDULING_RESERVATION_ACTIVE_SLOT_PREDICATE}")&&source.includes("SLOT_LOST_DURING_REASSIGN");'
          replace("tests/audit-p0-p1-remediation.test.mjs", old, new)
          replace("tests/audit-p0-p1-remediation.test.mjs",
                  'const sabotaged=scheduling.replace("AND NOT EXISTS (SELECT 1 FROM scheduling_reservations AS conflict", "AND EXISTS (SELECT 1 FROM scheduling_reservations AS conflict");',
                  'const sabotaged=scheduling.replace("AND NOT EXISTS (SELECT 1 FROM scheduling_reservations other", "AND EXISTS (SELECT 1 FROM scheduling_reservations other");')

          # Fast2SMS moved sensitive message/number data from the URL into a POST body.
          replace("tests/customer-otp-live-staging.test.mjs",
                  ' const originalFetch=globalThis.fetch;let providerUrl="";\n globalThis.fetch=async(input)=>{providerUrl=String(input);return new Response(JSON.stringify({return:true,request_id:"REQ-LIVE-OTP"}),{status:200,headers:{"content-type":"application/json"}});};',
                  ' const originalFetch=globalThis.fetch;let providerRequest=null;\n globalThis.fetch=async(input,init)=>{providerRequest={url:String(input),init};return new Response(JSON.stringify({return:true,request_id:"REQ-LIVE-OTP"}),{status:200,headers:{"content-type":"application/json"}});};')
          replace("tests/customer-otp-live-staging.test.mjs",
                  '  const provider=new URL(providerUrl);assert.equal(provider.searchParams.get("numbers"),APPROVED);const message=String(provider.searchParams.get("message")||"");const code=/\\b(\\d{6})\\b/.exec(message)?.[1];assert.match(String(code),/^\\d{6}$/);',
                  '  assert.equal(providerRequest?.url,"https://www.fast2sms.com/dev/bulkV2");assert.equal(providerRequest?.init?.method,"POST");const providerBody=new URLSearchParams(String(providerRequest?.init?.body||""));assert.equal(providerBody.get("numbers"),APPROVED);const message=String(providerBody.get("message")||"");const code=/\\b(\\d{6})\\b/.exec(message)?.[1];assert.match(String(code),/^\\d{6}$/);')

          # Identity assertions now resolve UAT/live secrets through one governed resolver.
          replace("tests/identity-session.test.mjs",
                  '  assert.match(assertion,/PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT/);',
                  '  assert.match(assertion,/resolveOtpAssertionSecret/);\n  assert.match(assertion,/productionOtpEnabled/);')
          replace("tests/identity-session.test.mjs",
                  'test("the central API gateway honours authenticated sessions and rejects caller-controlled staff identity headers",async()=>{',
                  'test("the central API gateway honours authenticated sessions and only accepts forwarded staff identity for provisioned users",async()=>{')
          replace("tests/identity-session.test.mjs",
                  '  assert.match(authorize,/resolveUatStaffActor\\(request,env as unknown as Record<string,unknown>\\)/);',
                  '  assert.match(authorize,/resolveUatStaffActor\\(env\\.DB,request,env as unknown as Record<string,unknown>\\)/);')
          replace("tests/identity-session.test.mjs",
                  '  assert.doesNotMatch(authorize,/oai-authenticated-user-email/);\n  assert.doesNotMatch(authorize,/FOUNDER_EMAIL/);',
                  '  assert.match(authorize,/oai-authenticated-user-email/);\n  assert.match(authorize,/SELECT name,role_code,status FROM app_users WHERE email=\\?/);\n  assert.doesNotMatch(authorize,/if\\s*\\(\\s*!user[\\s\\S]{0,500}INSERT INTO app_users/);\n  assert.doesNotMatch(authorize,/FOUNDER_EMAIL/);')

          # Scheduling restore is now inline and reports partial restoration truthfully.
          replace("tests/scheduling-hardening.test.mjs",
                  '  assert.match(routeSource, /async function restoreAssignmentRows/);\n  assert.match(routeSource, /AND NOT EXISTS \\(SELECT 1 FROM scheduling_reservations AS conflict/);\n  assert.match(routeSource, /SCHEDULING_RESERVATION_ACTIVE_SLOT_PREDICATE/);\n  assert.match(routeSource, /restore=\\(\\)=>restoreAssignmentRows\\(db,previousRows\\.results\\)/);',
                  '  assert.match(routeSource, /restore=async\\(\\)=>\\{/);\n  assert.match(routeSource, /AND NOT EXISTS \\(SELECT 1 FROM scheduling_reservations other/);\n  assert.match(routeSource, /other\\.\\$\\{SCHEDULING_RESERVATION_ACTIVE_SLOT_PREDICATE\\}/);\n  assert.match(routeSource, /SLOT_LOST_DURING_REASSIGN/);')

          # Walking completion uses an optimistic guarded booking update plus a checked batch claim.
          replace("tests/walking-per-session-amount.test.mjs",
                  '  assert.match(block, /CASE WHEN EXISTS \\(SELECT 1 FROM walking_sessions/);',
                  '  assert.match(block, /UPDATE canonical_bookings SET status=\'completed\',updated_at=\\? WHERE id=\\? AND status=\\?/);\n  assert.match(block, /assertLifecycleClaim\\(batchResults\\[2\\]\\)/);')

          # Restore the checkout-day allowance and exact checkout boundary guard that exists on main.
          replace("lib/boarding-stay-lifecycle.ts",
                  'function stayDays(stay:Row){const start=istDate(String(stay.check_in_at)),end=istDate(String(stay.check_out_at)),days:string[]=[];let cursor=new Date(`${start}T00:00:00Z`); const endCursor=new Date(`${end}T00:00:00Z`);while(cursor<endCursor){days.push(cursor.toISOString().slice(0,10));cursor=new Date(cursor.getTime()+86_400_000);}if(!days.length)days.push(start);return days;}\nasync function assertDailyMilestones',
                  'function stayDays(stay:Row){const start=istDate(String(stay.check_in_at)),end=istDate(String(stay.check_out_at)),days:string[]=[];let cursor=new Date(`${start}T00:00:00Z`); const endCursor=new Date(`${end}T00:00:00Z`);while(cursor<endCursor){days.push(cursor.toISOString().slice(0,10));cursor=new Date(cursor.getTime()+86_400_000);}if(!days.length)days.push(start);return days;}\nfunction careEventDays(stay:Row){const days=stayDays(stay),checkoutDay=istDate(String(stay.check_out_at));return days.includes(checkoutDay)?days:[...days,checkoutDay];}\nasync function assertDailyMilestones')
          replace("lib/boarding-stay-lifecycle.ts",
                  'if(input.action==="care_event"){if(status!=="in_progress")throw new Response("Care events can be logged only during an active stay",{status:409});const eventType=',
                  'if(input.action==="care_event"){if(status!=="in_progress")throw new Response("Care events can be logged only during an active stay",{status:409});if(now>=new Date(String(stay.check_out_at)).getTime())throw new Response("Care events can be logged only before the boarding checkout boundary",{status:409});const eventType=')
          replace("lib/boarding-stay-lifecycle.ts", '!stayDays(stay).includes(stayDate)', '!careEventDays(stay).includes(stayDate)')
          PY

          # Keep the hygiene invariant strict: diagnostic logs must not be tracked during validation.
          git rm -f --ignore-unmatch .github/auditparts/test-failure.log
          git diff --check

      - name: Install dependencies
        run: npm run install:ci

      - name: Full test suite
        run: |
          set +e
          npm test > /tmp/npm-test.log 2>&1
          status=$?
          cat /tmp/npm-test.log
          if [ "$status" -ne 0 ]; then
            mkdir -p .github/auditparts
            {
              echo "=== failing test blocks ==="
              grep -n -B 14 -A 40 '^not ok ' /tmp/npm-test.log || true
              echo
              echo "=== final summary ==="
              tail -n 80 /tmp/npm-test.log
            } > .github/auditparts/test-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/auditparts/test-failure.log
            if ! git diff --cached --quiet; then
              git commit -m "ci: capture P0/P1 full-suite failure blocks"
              git push origin HEAD:fix/audit-p1-remediation
            fi
            exit "$status"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Commit aligned tests and remove transient bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/audit-remediation-apply.py.gz.b64
          rm -rf .github/auditparts
          rm -f .github/workflows/apply-audit-remediation.yml
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix(test): align legacy integration tests with P0/P1 security hardening"
            git push origin HEAD:fix/audit-p1-remediation
          fi
