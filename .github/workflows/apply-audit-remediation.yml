name: Apply audit remediation

on:
  push:
    branches:
      - fix/audit-p1-remediation
    paths:
      - .github/auditparts/READY

permissions:
  contents: write

jobs:
  remediate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-p1-remediation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reassemble and apply audited remediation
        run: |
          set -euo pipefail
          cat .github/auditparts/part* | base64 -d | gzip -d > "$RUNNER_TEMP/apply-audit-remediation.py"
          python3 "$RUNNER_TEMP/apply-audit-remediation.py"

      - name: Install dependencies
        run: npm run install:ci

      - name: Run sabotage-focused remediation tests
        run: node --test tests/audit-p0-security-schema-remediation.test.mjs tests/backend-otp-hardening.test.mjs tests/haptik-outbound.test.mjs

      - name: Run full test suite
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Commit validated remediation and remove transient bootstrap
        env:
          BRANCH: fix/audit-p1-remediation
        run: |
          set -euo pipefail
          rm -rf .github/auditparts .github/audit-remediation-apply.py.gz.b64 .github/workflows/apply-audit-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(security): close audit P0 launch blockers"
          git push origin "HEAD:$BRANCH"
