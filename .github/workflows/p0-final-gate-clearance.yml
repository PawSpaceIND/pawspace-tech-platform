name: P0 Final Gate Clearance

on:
  push:
    branches:
      - remediation/p0-pilot-gates-b379631
    paths:
      - .github/workflows/p0-final-gate-clearance.yml

permissions:
  contents: read
  actions: write
  deployments: write

jobs:
  authorize-release-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: remediation/p0-pilot-gates-b379631
      TARGET_ENVIRONMENT: pawspace-release-preview
    steps:
      - name: Grant exact remediation branch access to release-preview
        shell: bash
        run: |
          set -euo pipefail
          ENV_JSON="$(mktemp)"
          if ! gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT" > "$ENV_JSON"; then
            echo 'GitHub token cannot administer the protected release-preview environment.' >&2
            exit 1
          fi
          CUSTOM="$(jq -r '.deployment_branch_policy.custom_branch_policies // false' "$ENV_JSON")"
          PROTECTED="$(jq -r '.deployment_branch_policy.protected_branches // false' "$ENV_JSON")"
          echo "custom_branch_policies=$CUSTOM protected_branches=$PROTECTED"
          if [ "$CUSTOM" != "true" ]; then
            echo 'Release-preview is not using custom deployment branch policies; refusing to weaken or rewrite its protection model.' >&2
            exit 1
          fi
          EXISTING="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT/deployment-branch-policies" --paginate --jq '.branch_policies[]?.name' || true)"
          if printf '%s\n' "$EXISTING" | grep -Fxq "$TARGET_BRANCH"; then
            echo 'Exact remediation branch is already authorized.'
            exit 0
          fi
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/environments/$TARGET_ENVIRONMENT/deployment-branch-policies" \
            -f name="$TARGET_BRANCH" -f type='branch' >/dev/null
          echo 'Exact remediation branch authorization added.'

  configure-meta-staging:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
      META_GRAPH_VERSION: ${{ vars.META_WHATSAPP_GRAPH_VERSION || 'v23.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover UAT WABA, phone number and approved parameterless templates
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const token=String(process.env.META_WHATSAPP_UAT_ACCESS_TOKEN||'').trim();
          if(!token) throw new Error('META_WHATSAPP_UAT_ACCESS_TOKEN is missing');
          const version=String(process.env.META_GRAPH_VERSION||'v23.0').trim();
          const base=`https://graph.facebook.com/${version}`;
          const headers={authorization:`Bearer ${token}`};
          async function get(path){
            const r=await fetch(`${base}${path}`,{headers});
            const text=await r.text();
            let body={}; try{body=text?JSON.parse(text):{}}catch{body={raw:text.slice(0,300)}}
            if(!r.ok) throw new Error(`Meta Graph ${path.split('?')[0]} failed: ${r.status} ${JSON.stringify(body).slice(0,300)}`);
            return body;
          }
          const wabas=new Set();
          try {
            const dbg=await get(`/debug_token?input_token=${encodeURIComponent(token)}`);
            for(const scope of (dbg?.data?.granular_scopes||[])){
              if(String(scope?.scope||'').startsWith('whatsapp_business_')) for(const id of (scope?.target_ids||[])) if(id) wabas.add(String(id));
            }
          } catch {}
          try {
            const businesses=await get('/me/businesses?fields=id&limit=100');
            for(const business of (businesses?.data||[])){
              for(const edge of ['owned_whatsapp_business_accounts','client_whatsapp_business_accounts']){
                try {
                  const res=await get(`/${encodeURIComponent(business.id)}/${edge}?fields=id&limit=100`);
                  for(const item of (res?.data||[])) if(item?.id) wabas.add(String(item.id));
                } catch {}
              }
            }
          } catch {}
          const candidates=[];
          for(const wabaId of wabas){
            try {
              const phones=await get(`/${encodeURIComponent(wabaId)}/phone_numbers?fields=id&limit=100`);
              for(const phone of (phones?.data||[])) if(phone?.id) candidates.push({wabaId,phoneId:String(phone.id)});
            } catch {}
          }
          const unique=[...new Map(candidates.map(x=>[`${x.wabaId}:${x.phoneId}`,x])).values()];
          if(unique.length!==1) throw new Error(`Expected exactly one UAT WhatsApp WABA/phone pair, discovered ${unique.length}; refusing to guess.`);
          const {wabaId,phoneId}=unique[0];
          const inventory=await get(`/${encodeURIComponent(wabaId)}/message_templates?fields=name,status,language,components&limit=100`);
          const templates=(inventory?.data||[])
            .filter(t=>t?.status==='APPROVED' && t?.name && !JSON.stringify(t?.components||[]).includes('{{'))
            .map(t=>String(t.name));
          const allowlist=[...new Set(templates)].sort();
          if(!allowlist.length) throw new Error('No approved parameterless UAT WhatsApp template is available; refusing to configure an unusable allowlist.');
          for(const value of [wabaId,phoneId,allowlist.join(',')]) console.log(`::add-mask::${value}`);
          appendFileSync(process.env.GITHUB_OUTPUT,`waba_id=${wabaId}\nphone_id=${phoneId}\ntemplate_allowlist=${allowlist.join(',')}\n`);
          console.log(`meta_discovery=success waba_count=${wabas.size} pair_count=${unique.length} parameterless_template_count=${allowlist.length}`);
          NODE
      - name: Persist Meta UAT environment variables
        shell: bash
        env:
          WABA_ID: ${{ steps.meta.outputs.waba_id }}
          PHONE_ID: ${{ steps.meta.outputs.phone_id }}
          TEMPLATE_ALLOWLIST: ${{ steps.meta.outputs.template_allowlist }}
        run: |
          set -euo pipefail
          gh variable set META_WHATSAPP_WABA_ID_UAT --env pawspace-staging --body "$WABA_ID"
          gh variable set META_WHATSAPP_PHONE_NUMBER_ID_UAT --env pawspace-staging --body "$PHONE_ID"
          gh variable set META_WHATSAPP_TEMPLATE_ALLOWLIST --env pawspace-staging --body "$TEMPLATE_ALLOWLIST"
          echo 'Meta UAT environment variables persisted.'
