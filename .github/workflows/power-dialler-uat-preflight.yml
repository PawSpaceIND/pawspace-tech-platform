name: Power Dialler UAT preflight

on:
  push:
    branches:
      - fix/power-dialler-live-uat-closure-20260910

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved test-number pool without exposing numbers
        env:
          PAWSPACE_SMS_TEST_NUMBERS: ${{ secrets.PAWSPACE_SMS_TEST_NUMBERS }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
          EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
          EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
          EXOTEL_SID: ${{ secrets.EXOTEL_SID }}
          EXOTEL_CALLER_ID: ${{ secrets.EXOTEL_CALLER_ID }}
          EXOTEL_WEBHOOK_SECRET: ${{ secrets.EXOTEL_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const names=['EXOTEL_API_KEY','EXOTEL_API_TOKEN','EXOTEL_SID','EXOTEL_CALLER_ID','EXOTEL_WEBHOOK_SECRET'];
          if(names.some(n=>!String(process.env[n]||'').trim())) throw new Error('required Exotel secret missing');
          const values=[process.env.PAWSPACE_SMS_TEST_NUMBERS,process.env.PAWSPACE_VOICE_UAT_ALLOWLIST].flatMap(v=>String(v||'').split(/[\s,;]+/)).map(v=>v.replace(/\D/g,'')).filter(Boolean);
          const canonical=[...new Set(values.map(v=>v.slice(-10)).filter(v=>v.length===10))];
          console.log(`approved_test_number_count=${canonical.length}`);
          if(canonical.length<2) throw new Error('Power Dialler live UAT needs at least two distinct approved test numbers (agent + customer)');
          console.log('power_dialler_live_uat_preflight=ready');
          NODE
