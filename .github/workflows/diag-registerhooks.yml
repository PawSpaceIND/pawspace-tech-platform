name: Diagnose registerHooks harness
on:
  push:
    branches: [cert/boarding-sitting-taxi-razorpay-e2e]
    paths: [.github/workflows/diag-registerhooks.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - name: Isolate auth-hook fixture creator
        shell: bash
        run: |
          set -uo pipefail
          echo '--- node/registerHooks ---'
          node --version
          node --input-type=module -e "import Module from 'node:module'; console.log(typeof Module.registerHooks)"

          echo '--- literal references before tests ---'
          grep -RFn --exclude-dir=node_modules 'auth-hook.cjs' . || true
          echo '--- filesystem before tests ---'
          find test tests -maxdepth 2 -type f -name '*auth-hook*' -print 2>/dev/null || true

          echo '--- api-path classifier alone ---'
          PAWSPACE_LOCAL_PREVIEW=on NODE_ENV=test node --experimental-strip-types --test tests/api-path-classification.test.mjs
          classifier_rc=$?
          echo "classifier_rc=$classifier_rc"
          if test -e test/auth-hook.cjs; then
            echo 'CLASSIFIER_CREATED_AUTH_HOOK=1'
            sed -n '1,260p' test/auth-hook.cjs || true
            git status --short
            exit 0
          fi

          echo '--- hook suites one by one ---'
          mapfile -t suites < <(grep -l 'helpers/module-hooks.mjs' tests/*.test.mjs | sort)
          echo "suite_count=${#suites[@]}"
          for suite in "${suites[@]}"; do
            rm -f test/auth-hook.cjs test/auth-hook-register.mjs
            echo "RUN_SUITE=$suite"
            PAWSPACE_LOCAL_PREVIEW=on NODE_ENV=test node --experimental-strip-types --test "$suite" >/tmp/one-suite.tap 2>&1
            rc=$?
            tail -n 12 /tmp/one-suite.tap || true
            echo "SUITE_RC=$rc"
            if test -e test/auth-hook.cjs || test -e test/auth-hook-register.mjs; then
              echo "FIRST_FIXTURE_CREATOR=$suite"
              find test -maxdepth 1 -type f -name '*auth-hook*' -print || true
              if test -e test/auth-hook.cjs; then sed -n '1,280p' test/auth-hook.cjs || true; fi
              if test -e test/auth-hook-register.mjs; then sed -n '1,280p' test/auth-hook-register.mjs || true; fi
              git status --short
              break
            fi
          done

          echo '--- classifier after isolated suite loop ---'
          PAWSPACE_LOCAL_PREVIEW=on NODE_ENV=test node --experimental-strip-types --test tests/api-path-classification.test.mjs || true
          find test tests -maxdepth 2 -type f -name '*auth-hook*' -print 2>/dev/null || true
          git status --short
