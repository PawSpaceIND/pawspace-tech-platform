name: Dispatch provider fix staging candidate

on:
  push:
    branches:
      - ops/razorpay-provider-cert-20260901
    paths:
      - .github/workflows/dispatch-provider-fix-staging.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Razorpay Test provider finalize lifecycle e
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/deploy-staging.yml/dispatches" \
            -d '{"ref":"ops/razorpay-provider-cert-20260901","inputs":{"confirm":"provider-cert","expected_sha":"6c7603fa61fa12bf35dfa61a9ab648838e13c084","sms_smoke":"disabled","provider_cert_phase":"finalize","provider_cert_key":"rzp382-20260901e"}}'
