name: Dispatch provider fix staging candidate

on:
  push:
    branches:
      - ops/razorpay-provider-cert-20260901
    paths:
      - .github/workflows/dispatch-provider-fix-staging.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch isolated staging exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 81b8f374fd721c59715f457c8180a5a27b39f27f
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/deploy-staging.yml/dispatches" \
            -d "{\"ref\":\"ops/razorpay-provider-cert-20260901\",\"inputs\":{\"confirm\":\"staging\",\"expected_sha\":\"$TARGET_SHA\",\"sms_smoke\":\"disabled\",\"provider_cert_phase\":\"none\",\"provider_cert_key\":\"\"}}"
