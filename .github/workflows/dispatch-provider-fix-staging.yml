name: Dispatch provider fix staging candidate

on:
  push:
    branches:
      - ops/razorpay-provider-cert-20260901
    paths:
      - .github/workflows/dispatch-provider-fix-staging.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact PR382 candidate to isolated staging
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/deploy-staging.yml/dispatches" \
            -d '{"ref":"ops/razorpay-provider-cert-20260901","inputs":{"confirm":"staging","expected_sha":"a7614f7299591236b6c1a1cf15f70c06fa30915a","sms_smoke":"disabled","provider_cert_phase":"none","provider_cert_key":"rzp382-20260901e"}}'
