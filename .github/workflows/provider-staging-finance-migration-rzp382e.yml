name: Provider staging finance migration rzp382e

on:
  push:
    branches:
      - ops/razorpay-provider-cert-20260901
    paths:
      - .github/workflows/provider-staging-finance-migration-rzp382e.yml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a7614f7299591236b6c1a1cf15f70c06fa30915a
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply idempotent financial lifecycle migration to dedicated staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
        run: |
          set -euo pipefail
          test "$STAGING_D1_ID" = "1b879a28-c8a9-40b0-830d-1ce439061a00"
          npx --yes wrangler@4 d1 execute pawspace-staging --remote --file drizzle/0017_financial_lifecycle_hardening.sql
          node --input-type=module <<'NODE'
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/d1/database/${encodeURIComponent(process.env.STAGING_D1_ID)}/query`,{method:'POST',headers:{authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'},body:JSON.stringify({sql:'PRAGMA table_info(gateway_webhook_events)',params:[]})});
          const b=await r.json();
          if(!r.ok||b?.success!==true||b?.result?.[0]?.success!==true)throw new Error('staging migration verification query failed');
          const columns=(b.result[0].results||[]).map(x=>x.name);
          for(const required of ['id','provider','environment','event_id','raw_payload','signature','processing_status','failure_reason','received_at','processed_at'])if(!columns.includes(required))throw new Error(`missing webhook column ${required}`);
          console.log(JSON.stringify({ok:true,stagingD1Id:process.env.STAGING_D1_ID,webhookColumns:columns.length}));
          NODE
