name: Read Atlas scheduled slot evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test scoped query and redaction
        run: node --test tests/read-atlas-scheduled-slots.test.mjs
      - name: Verify pinned live staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments status --json --name pawspace-staging > atlas-deployment-provenance.json
          ACTIVE_VERSION="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('atlas-deployment-provenance.json','utf8'));
          if(d.versions?.length!==1||Number(d.versions[0].percentage)!==100||!d.versions[0].version_id)throw new Error('Worker not 100% on one version');
          process.stdout.write(d.versions[0].version_id);
          NODE
          )"
          npx --yes wrangler@4 versions view "$ACTIVE_VERSION" --json --name pawspace-staging > atlas-active-version.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {verifyAtlasProofProvenance,atlasProofProvenanceFields} from './scripts/atlas-proof-provenance.mjs';
          const version=JSON.parse(fs.readFileSync('atlas-active-version.json','utf8'));
          const proof=verifyAtlasProofProvenance({version,expectedSha:'b0c9e4a8b4663cba27d91ff60d20055e90d516a3',targetEnvironment:'pawspace-staging',workerName:'pawspace-staging'});
          fs.writeFileSync('atlas-scheduled-provenance.json',JSON.stringify({proof,...atlasProofProvenanceFields(version)},null,2));
          console.log('Pinned staging provenance passed');
          NODE
      - name: Read only eight historical scheduled slots
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/read-atlas-scheduled-slots.mjs
      - name: Upload sanitized receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-eight-scheduled-slots
          path: |
            atlas-scheduled-provenance.json
            atlas-scheduled-observability-proof.json
