name: Reproduce Golden D1 batch assertion in disposable Worker
on:
  push:
    branches: [ops/pencils-down-staging-ab40dc00]
    paths: [.github/workflows/pencils-down-d1-batch-worker-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: pawspace-release-preview
    env:
      TARGET_DB_NAME: pawspace-beta-golden-wallet-3218c3
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy disposable D1 batch diagnostic
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          db_json=$(curl -fsS "${auth[@]}" "$api/d1/database?per_page=100")
          db_id=$(jq -r --arg n "$TARGET_DB_NAME" '.result[] | select(.name==$n) | (.uuid // .id)' <<<"$db_json" | head -1)
          test -n "$db_id" && test "$db_id" != null
          subdomain=$(curl -fsS "${auth[@]}" "$api/workers/subdomain" | jq -r '.result.subdomain')
          test -n "$subdomain" && test "$subdomain" != null
          work="$RUNNER_TEMP/pawspace-d1-batch-diag"
          mkdir -p "$work"
          worker="pawspace-d1-batch-diag-${GITHUB_RUN_ID}"
          cat > "$work/wrangler.toml" <<EOF
          name = "$worker"
          main = "index.mjs"
          compatibility_date = "2026-09-10"
          workers_dev = true
          [[d1_databases]]
          binding = "DB"
          database_name = "$TARGET_DB_NAME"
          database_id = "$db_id"
          EOF
          cat > "$work/index.mjs" <<'JS'
          export default {
            async fetch(_request, env) {
              const marker = crypto.randomUUID();
              let outcome = { batchSucceeded: false, errorClass: null, rowCountAfter: null, assertCountAfter: null };
              try {
                await env.DB.batch([
                  env.DB.prepare("CREATE TABLE IF NOT EXISTS __pawspace_worker_batch_rows (id TEXT PRIMARY KEY,attempt_id TEXT NOT NULL)"),
                  env.DB.prepare("CREATE TABLE IF NOT EXISTS __pawspace_worker_batch_assert (id TEXT PRIMARY KEY,ok INTEGER NOT NULL CHECK(ok=1))")
                ]);
                await env.DB.batch([
                  env.DB.prepare("DELETE FROM __pawspace_worker_batch_assert"),
                  env.DB.prepare("DELETE FROM __pawspace_worker_batch_rows")
                ]);
                await env.DB.batch([
                  env.DB.prepare("INSERT INTO __pawspace_worker_batch_rows (id,attempt_id) VALUES (?,?)").bind(`row-${marker}`, marker),
                  env.DB.prepare("INSERT INTO __pawspace_worker_batch_assert (id,ok) SELECT ?,CASE WHEN (SELECT COUNT(*) FROM __pawspace_worker_batch_rows WHERE attempt_id=?)=1 THEN 1 ELSE 0 END").bind(`assert-${marker}`, marker),
                  env.DB.prepare("DELETE FROM __pawspace_worker_batch_assert WHERE id=?").bind(`assert-${marker}`),
                  env.DB.prepare("DELETE FROM __pawspace_worker_batch_rows WHERE id=?").bind(`row-${marker}`)
                ]);
                outcome.batchSucceeded = true;
              } catch (error) {
                const text = String(error instanceof Error ? error.message : error);
                outcome.errorClass = /CHECK/i.test(text) ? "CHECK" : /UNIQUE/i.test(text) ? "UNIQUE" : /NOT NULL/i.test(text) ? "NOT_NULL" : /FOREIGN KEY/i.test(text) ? "FOREIGN_KEY" : /CONSTRAINT/i.test(text) ? "CONSTRAINT" : "OTHER";
              } finally {
                outcome.rowCountAfter = Number((await env.DB.prepare("SELECT COUNT(*) n FROM __pawspace_worker_batch_rows").first())?.n || 0);
                outcome.assertCountAfter = Number((await env.DB.prepare("SELECT COUNT(*) n FROM __pawspace_worker_batch_assert").first())?.n || 0);
                await env.DB.batch([
                  env.DB.prepare("DROP TABLE IF EXISTS __pawspace_worker_batch_assert"),
                  env.DB.prepare("DROP TABLE IF EXISTS __pawspace_worker_batch_rows")
                ]);
              }
              return Response.json(outcome, { status: outcome.batchSucceeded ? 200 : 500 });
            }
          };
          JS
          cleanup(){ npx --yes wrangler@4 delete --config "$work/wrangler.toml" --force >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          npx --yes wrangler@4 deploy --config "$work/wrangler.toml" >/tmp/d1-batch-worker-deploy.log
          url="https://${worker}.${subdomain}.workers.dev"
          result=""
          for i in $(seq 1 20); do
            result=$(curl -fsS --max-time 15 "$url" 2>/dev/null || true)
            if jq -e '.batchSucceeded == true' >/dev/null 2>&1 <<<"$result"; then break; fi
            sleep 1
          done
          echo "D1_BATCH_RESULT=$(jq -c '{batchSucceeded,errorClass,rowCountAfter,assertCountAfter}' <<<"$result")"
          test "$(jq -r '.batchSucceeded' <<<"$result")" = true
          test "$(jq -r '.rowCountAfter' <<<"$result")" = 0
          test "$(jq -r '.assertCountAfter' <<<"$result")" = 0
          cleanup
          trap - EXIT
          residue=$(curl -fsS -X POST "${auth[@]}" -H 'content-type: application/json' "$api/d1/database/$db_id/query" --data '{"sql":"SELECT name FROM sqlite_master WHERE name LIKE '\''__pawspace_worker_batch_%'\''"}')
          test "$(jq '[.result[]?.results[]?] | length' <<<"$residue")" = 0
          echo 'PASS: hosted Worker env.DB.batch sees prior writes and diagnostic residue is zero.'
