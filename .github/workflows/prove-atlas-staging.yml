name: Prove Atlas staging business truth

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed product SHA to certify
        required: true
        type: string
      preview_url:
        description: Exact workers.dev URL to prove
        required: true
        type: string
      worker_name:
        description: Cloudflare Worker name
        required: true
        type: string
      target_environment:
        description: GitHub environment containing the matching UAT credential
        required: true
        type: choice
        options:
          - pawspace-staging
          - pawspace-release-preview
      allow_revenue_mission_fixture:
        description: Allow one expired audited Revenue Mission fixture when the isolated target is empty
        required: true
        default: false
        type: boolean

      read_scheduled_slots:
        description: Read only the eight historical staging scheduler slots; skip UI proof
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test read-only diagnostic boundaries
        if: ${{ inputs.read_scheduled_slots }}
        run: node --test --test-name-pattern='certified normal staging|wrong or missing staging|staging SHA binding|sandbox envelope|wrong Worker|release-preview still|diagnostic includes|query is bounded|raw messages|authentication error' tests/staging-certification.test.mjs

      - name: Install dependencies
        if: ${{ !inputs.read_scheduled_slots }}
        run: npm run install:ci

      - name: Verify live Worker provenance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKER_NAME: ${{ inputs.worker_name }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments status --json --name "$WORKER_NAME" > atlas-deployment-provenance.json
          ACTIVE_VERSION="$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          const d=JSON.parse(fs.readFileSync("atlas-deployment-provenance.json","utf8"));
          const versions=Array.isArray(d?.versions)?d.versions:[];
          if(versions.length!==1||Number(versions[0]?.percentage)!==100||!versions[0]?.version_id) throw new Error("Worker is not 100% on one version");
          process.stdout.write(String(versions[0].version_id));
          NODE
          )"
          npx --yes wrangler@4 versions view "$ACTIVE_VERSION" --json --name "$WORKER_NAME" > atlas-active-version.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {atlasProofProvenanceFields,verifyAtlasProofProvenance} from "./scripts/atlas-proof-provenance.mjs";
          const expected=String(process.env.EXPECTED_SHA||"").trim();
          const version=JSON.parse(fs.readFileSync("atlas-active-version.json","utf8"));
          fs.writeFileSync("atlas-provenance-check.json",JSON.stringify({expectedSha:expected,targetEnvironment:process.env.TARGET_ENVIRONMENT,workerName:process.env.WORKER_NAME,...atlasProofProvenanceFields(version)},null,2));
          const proof=verifyAtlasProofProvenance({version,expectedSha:expected,targetEnvironment:process.env.TARGET_ENVIRONMENT,workerName:process.env.WORKER_NAME});
          console.log(`active_product_sha=${proof.sha}; environment=${proof.environment}; provenance=${proof.provenance}; percentage=100`);
          NODE

      - name: Install Chromium
        if: ${{ !inputs.read_scheduled_slots }}
        run: npx playwright install --with-deps chromium

      - name: Prove Atlas UI + business truth
        if: ${{ !inputs.read_scheduled_slots }}
        env:
          STAGING_URL: ${{ inputs.preview_url }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ALLOW_REVENUE_MISSION_FIXTURE: ${{ inputs.allow_revenue_mission_fixture }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.allow_revenue_mission_fixture }}" = "true" ] && [ "${{ inputs.target_environment }}" != "pawspace-release-preview" ]; then
            echo "Revenue Mission fixture seeding is allowed only in pawspace-release-preview" >&2
            exit 1
          fi
          node scripts/prove-atlas-staging.mjs

      - name: Read only historical scheduled slots
        if: ${{ inputs.read_scheduled_slots }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          WORKER_NAME: ${{ inputs.worker_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$TARGET_ENVIRONMENT" != "pawspace-staging" ] || [ "$WORKER_NAME" != "pawspace-staging" ] || [ "$EXPECTED_SHA" != "b0c9e4a8b4663cba27d91ff60d20055e90d516a3" ]; then
            echo "Historical diagnostic is pinned to staging b0c9e4" >&2
            exit 1
          fi
          node scripts/read-atlas-scheduled-slots.mjs > atlas-scheduled-observability-proof.json

      - name: Upload sanitized Atlas proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ inputs.read_scheduled_slots && 'scheduled-slots' || 'business-proof' }}-${{ inputs.expected_sha }}
          path: |
            atlas-scheduled-observability-proof.json
            atlas-staging-proof.json
            atlas-team-ai.png
            atlas-provenance-check.json
          if-no-files-found: error
