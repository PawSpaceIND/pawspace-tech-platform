name: Prove Atlas staging business truth

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed product SHA to certify
        required: true
        type: string
      preview_url:
        description: Exact workers.dev URL to prove
        required: true
        type: string
      worker_name:
        description: Cloudflare Worker name
        required: true
        type: string
      target_environment:
        description: GitHub environment containing the matching UAT credential
        required: true
        type: choice
        options:
          - pawspace-staging
          - pawspace-release-preview

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm run install:ci

      - name: Verify live Worker provenance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKER_NAME: ${{ inputs.worker_name }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments status --json --name "$WORKER_NAME" > atlas-deployment-provenance.json
          ACTIVE_VERSION="$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          const d=JSON.parse(fs.readFileSync("atlas-deployment-provenance.json","utf8"));
          const versions=Array.isArray(d?.versions)?d.versions:[];
          if(versions.length!==1||Number(versions[0]?.percentage)!==100||!versions[0]?.version_id) throw new Error("Worker is not 100% on one version");
          process.stdout.write(String(versions[0].version_id));
          NODE
          )"
          npx --yes wrangler@4 versions view "$ACTIVE_VERSION" --json --name "$WORKER_NAME" > atlas-active-version.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const expected=String(process.env.EXPECTED_SHA||"").trim();
          const version=JSON.parse(fs.readFileSync("atlas-active-version.json","utf8"));
          const bindings=Array.isArray(version?.resources?.bindings)?version.resources.bindings:[];
          const release=bindings.find(x=>x?.name==="PAWSPACE_RELEASE_SHA");
          const env=bindings.find(x=>x?.name==="PAWSPACE_ENVIRONMENT");
          if(String(release?.text||"")!==expected) throw new Error(`Active Worker product SHA mismatch: expected ${expected}, got ${String(release?.text||"missing")}`);
          console.log(`active_product_sha=${expected}; environment=${String(env?.text||"unknown")}; percentage=100`);
          NODE

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prove Atlas UI + business truth
        env:
          STAGING_URL: ${{ inputs.preview_url }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/prove-atlas-staging.mjs

      - name: Upload sanitized Atlas proof
        uses: actions/upload-artifact@v4
        with:
          name: atlas-business-proof-${{ inputs.expected_sha }}
          path: |
            atlas-staging-proof.json
            atlas-team-ai.png
            atlas-deployment-provenance.json
            atlas-active-version.json
          if-no-files-found: error
