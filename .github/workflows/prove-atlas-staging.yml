name: Prove Atlas staging business truth

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed staging SHA to certify
        required: true
        type: string

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm run install:ci

      - name: Verify live staging provenance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments status --json --name pawspace-staging > atlas-deployment-provenance.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const d=JSON.parse(fs.readFileSync("atlas-deployment-provenance.json","utf8"));
          const expected=String(process.env.EXPECTED_SHA||"").trim();
          const message=String(d?.annotations?.["workers/message"]||"");
          const versions=Array.isArray(d?.versions)?d.versions:[];
          if(message!==`staging ${expected}`) throw new Error(`Staging SHA mismatch: expected ${expected}, got ${message||"missing"}`);
          if(versions.length!==1||Number(versions[0]?.percentage)!==100) throw new Error("Staging is not 100% on one certified version");
          console.log(`staging_sha=${expected}; percentage=100`);
          NODE

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prove Atlas staging UI + business truth
        env:
          STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/prove-atlas-staging.mjs

      - name: Upload sanitized Atlas proof
        uses: actions/upload-artifact@v4
        with:
          name: atlas-staging-proof-${{ inputs.expected_sha }}
          path: |
            atlas-staging-proof.json
            atlas-team-ai.png
            atlas-deployment-provenance.json
          if-no-files-found: error
