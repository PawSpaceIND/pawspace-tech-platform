name: Security Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAWSPACE_PAYMENT_ENV: sandbox
  PAWSPACE_PAYMENT_LIVE_APPROVED: "false"
  FORBID_PRODUCTION: "true"

jobs:
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.15.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Block high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Block forbidden dependency licenses
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const denied = ['GPL-2.0','GPL-3.0','AGPL-1.0','AGPL-3.0','SSPL-1.0','BUSL-1.1'];
          const hits = [];
          for (const [path, pkg] of Object.entries(lock.packages || {})) {
            const license = String(pkg?.license || '');
            const terms = license.split(/\s+(?:AND|OR|WITH)\s+|[(),]/i).map((v) => v.trim()).filter(Boolean);
            if (denied.some((token) => terms.includes(token))) hits.push(`${path || '<root>'}: ${license}`);
          }
          if (hits.length) {
            console.error('Forbidden dependency licenses detected:\n' + hits.join('\n'));
            process.exit(1);
          }
          console.log('PASS: no forbidden dependency licenses in package-lock.json');
          NODE

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom-and-vulnerability:
    name: SBOM and High/Critical CVE Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.15.0"
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci --ignore-scripts
      - name: Explicit production vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Report development-tooling vulnerabilities
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high
      - name: Generate CycloneDX SBOM
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: pawspace-sbom.cdx.json
          artifact-name: pawspace-sbom-${{ github.sha }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 30
