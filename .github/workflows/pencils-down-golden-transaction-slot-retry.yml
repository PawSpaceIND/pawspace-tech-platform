name: Retry Wallet + Razorpay Golden on a different governed slot
on:
  push:
    branches: [ops/pencils-down-staging-ab40dc00]
    paths: [.github/workflows/pencils-down-golden-transaction-slot-retry.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pawspace-release-preview
    env:
      ORIGIN: https://pawspace-beta-golden-wallet-3218c3.karthik-fce.workers.dev
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
      FORBID_PRODUCTION: 'true'
      CI: 'true'
    steps:
      - name: Checkout prior harness source
        uses: actions/checkout@v4
        with:
          ref: 34a73dd4bfcb7e5d97c4935b5a62fc08d48132e3
          path: infra
          persist-credentials: false
      - name: Checkout exact certified product candidate
        uses: actions/checkout@v4
        with:
          ref: 3218c383ef3afd947847b87b7319600e359e4f9e
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked candidate dependencies
        working-directory: candidate
        run: npm run install:ci
      - name: Install matching Chromium
        working-directory: candidate
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Prepare retry harness only
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('infra/.github/workflows/pencils-down-golden-transaction.yml').read_text()
          start=src.index("cat > golden.mjs <<'NODE'")+len("cat > golden.mjs <<'NODE'")
          end=src.index('\n          NODE',start)
          script=src[start:end].replace('\n          ','\n').lstrip('\n')
          script=script.replace("9000000927","9000000929")
          script=script.replace("getByRole('button',{name:'Pay online',exact:true})","getByRole('button',{name:/^Pay online/})")
          old="const dateButtons=page.locator('button[aria-pressed]').filter({hasText:/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun),/});let picked=false;for(let i=0;i<await dateButtons.count();i++){const b=dateButtons.nth(i);if(await b.isEnabled()){await b.click();picked=true;break;}}if(!picked)throw new Error('No date button available');const slot=page.getByRole('button',{name:/11:00 AM–1:00 PM/}).first();if(await slot.count())await slot.click();else await page.locator('button').filter({hasText:/AM|PM/}).first().click();"
          new="const dateButtons=page.locator('button[aria-pressed]').filter({hasText:/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun),/});let picked=false;for(let i=(await dateButtons.count())-1;i>=0;i--){const b=dateButtons.nth(i);if(await b.isEnabled()){await b.click();picked=true;break;}}if(!picked)throw new Error('No date button available');const slot=page.getByRole('button',{name:/3:00–5:00 PM/}).first();if(await slot.count())await slot.click();else await page.locator('button').filter({hasText:/AM|PM/}).last().click();"
          if old not in script: raise SystemExit('expected scheduling harness segment not found')
          script=script.replace(old,new)
          Path('candidate/golden.mjs').write_text(script)
          print('Harness selects the latest enabled date and 3:00–5:00 PM; product scheduler is unchanged.')
          PY
      - name: Run hosted Golden transaction on new slot
        working-directory: candidate
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: node golden.mjs
      - name: Upload transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-customer-wallet-razorpay-slot-retry
          path: candidate/golden-transaction-evidence/
          if-no-files-found: error
          retention-days: 7
