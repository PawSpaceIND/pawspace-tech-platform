name: Master E2E (staging)

# End-to-end master test of the DEPLOYED staging worker: customer (Boarding, Sitting, Taxi and the other
# V2 services), partner, employee/CRM/finance and AI journeys in a real browser, with real Razorpay TEST
# checkout payments (Netbanking test bank → Success). Staging only; sandbox payments only.
#
# Secrets are read from the repository and never printed: sign-in uses /api/staging-login,
# /api/uat-customer-switch and /api/uat-provider-switch (no access code is typed into a page, so none can
# appear in a screenshot or video), and every text artefact is redacted. D1 access is read-only SELECT.
on:
  push:
    branches: [claude/adoring-pasteur-tcung9]
    paths: ["e2e/master/**", ".github/workflows/master-e2e-staging.yml"]
  workflow_dispatch:
    inputs:
      suite:
        description: "preflight | all | a comma list of suite names (see e2e/master/run.mjs)"
        required: true
        default: "all"

permissions:
  contents: write  # only to commit the compact evidence copy to this test branch (see last step)

concurrency:
  group: pawspace-staging-sweep
  cancel-in-progress: false

jobs:
  master:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
      MASTER_OUT: artifacts/master
      NODE_ENV: test
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Run master suite
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          MASTER_SUITE: ${{ github.event.inputs.suite }}
        run: node e2e/master/run.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-e2e-${{ github.run_id }}
          path: artifacts/master/
          if-no-files-found: warn
          retention-days: 14
      # The reporting session cannot download Actions artifacts (blob storage is outside its network policy),
      # so a compact copy of the evidence is committed to this test branch under docs/uat-evidence/master-e2e/.
      - name: Publish compact evidence to the test branch
        if: always() && github.ref == 'refs/heads/claude/adoring-pasteur-tcung9'
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -d artifacts/master ] || exit 0
          python3 -m pip install --quiet Pillow
          python3 e2e/master/publish-evidence.py artifacts/master "${{ github.run_number }}"
          for secret in "$PAWSPACE_UAT_ACCESS_CODE" "$CLOUDFLARE_API_TOKEN"; do
            if [ -n "$secret" ] && grep -rqF -- "$secret" docs/uat-evidence/master-e2e; then echo "::error::a secret value was found in the evidence; not publishing"; exit 1; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/uat-evidence/master-e2e
          git commit -q -m "chore(evidence): master E2E run ${{ github.run_number }} [skip ci]" || exit 0
          for attempt in 1 2 3 4; do
            if git pull -q --rebase origin claude/adoring-pasteur-tcung9 && git push -q origin HEAD:claude/adoring-pasteur-tcung9; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::could not push the evidence commit"; exit 1
