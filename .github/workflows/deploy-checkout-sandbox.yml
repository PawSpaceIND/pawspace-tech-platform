name: Deploy isolated checkout sandbox

# RETIRED 2026-09-11: PR #736 received successful product-native Razorpay TEST capture +
# provider-signed webhook proof (Actions run 34580345040). Provisioning is intentionally disabled
# so stale proof automation cannot create orphan Workers/D1 databases after closure.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Retired: type acknowledge-pr736-proof-closed to record a no-op dispatch'
        required: true
        default: ''
permissions:
  contents: read
concurrency:
  group: pawspace-checkout-sandbox-736-retired
  cancel-in-progress: true
jobs:
  retired:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'acknowledge-pr736-proof-closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: PR736 isolated checkout proof is closed
        run: |
          echo 'PR #736 isolated checkout provisioning is retired.'
          echo 'Successful product-native provider proof: Actions run 34580345040.'
          echo 'Merged relay transport fix: PR #750.'
          echo 'No Worker, D1, payment, webhook, staging, preview, or production mutation is performed.'
