name: Deploy isolated checkout sandbox

# Separate resources for the certified #736 payment tree; NEVER repoints frozen preview, shared staging or production.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type checkout-sandbox-736 to provision a separate TEST-only root app'
        required: true
        default: ''
      expected_sha:
        description: 'Exact certified #736 head; no branch names or older candidate substitutions'
        required: true
        default: ''
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: pawspace-checkout-sandbox-736
  cancel-in-progress: false
jobs:
  checkout-sandbox:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'checkout-sandbox-736' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pawspace-release-preview
    env:
      PAWSPACE_PAYMENT_ENV: sandbox
      FORBID_PRODUCTION: 'true'
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
    steps:
      - name: Checkout reviewed hosting infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: infra
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate exact same-repository candidate and completed certification
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const sha = process.env.EXPECTED_SHA;
          if (!/^[a-f0-9]{40}$/.test(sha || '')) throw Error('Exact SHA required');
          const base = 'https://api.github.com/repos/PawSpaceIND/pawspace-tech-platform';
          const get = async path => {
            const r = await fetch(base+path,{headers:{authorization:'Bearer '+process.env.GH_TOKEN},redirect:'error',signal:AbortSignal.timeout(20000)});
            if(!r.ok) throw Error('GitHub candidate verification failed'); return r.json();
          };
          const pr = await get('/pulls/736');
          if(pr.state!=='closed'||pr.merged!==true||pr.head.sha!==sha||pr.head.ref!=='test/razorpay-recon-untrusted-evidence-20260911'||pr.head.repo.full_name!=='PawSpaceIND/pawspace-tech-platform') throw Error('Certified PR736 candidate ownership or merged state mismatches');
          const runs = (await get('/actions/runs?event=pull_request&head_sha='+sha+'&per_page=100')).workflow_runs;
          for(const name of ['Release CI','Pre-UAT Staging Protocol','Browser E2E (hardened, preview superuser disabled)','Browser E2E (personas, sandbox locked)']) {
            const run=runs.filter(r=>r.name===name).sort((a,b)=>b.id-a.id)[0];
            if(!run||run.status!=='completed'||run.conclusion!=='success') throw Error('Candidate certification incomplete: '+name);
          }
          console.log('Exact merged PR736 candidate and four required workflow groups verified. This is not a payment capture claim.');
          NODE
      - name: Checkout immutable product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          path: candidate
      - name: Install candidate locked dependencies without deployment secrets
        working-directory: candidate
        run: npm ci
      - name: Build root customer application without deployment secrets
        working-directory: candidate
        run: npm run build
      - name: Install isolated browser without deployment secrets
        working-directory: candidate
        run: npx playwright install --with-deps chromium
      - name: Create-only isolated root Worker and D1 with encrypted TEST secrets
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          CHECKOUT_EVIDENCE_DIR: ${{ github.workspace }}/checkout-sandbox-evidence
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_PREVIEW_D1_ID: ${{ vars.RELEASE_PREVIEW_D1_ID }}
          RELEASE_PREVIEW_WORKER_NAME: ${{ vars.RELEASE_PREVIEW_WORKER_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          GOOGLE_MAPS_SERVER_API_KEY_UAT: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY_UAT }}
        run: node --experimental-strip-types infra/scripts/deploy-checkout-sandbox.mjs
      - name: Verify authenticated customer UI on the exact hosted candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          CHECKOUT_EVIDENCE_DIR: ${{ github.workspace }}/checkout-sandbox-evidence
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: node --experimental-strip-types infra/scripts/verify-checkout-hosted-browser.mjs
      - name: Retain only redacted hosting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-sandbox-hosting-${{ inputs.expected_sha }}
          path: checkout-sandbox-evidence/
          if-no-files-found: warn
          retention-days: 14
