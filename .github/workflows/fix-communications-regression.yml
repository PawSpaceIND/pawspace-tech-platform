name: Fix communications regression

on:
  push:
    branches: [grooming-integration-closure]
    paths:
      - .github/workflows/fix-communications-regression.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - name: Update stale routed-contact assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/rendered-html.test.mjs')
          text = path.read_text()
          old = '  assert.match(contact, /Exotel sandbox/);'
          new = '  assert.match(contact, /enqueueCommunication/);\n  assert.match(contact, /governed_outbox/);\n  assert.match(contact, /provider:\"not_dispatched\"/);\n  assert.doesNotMatch(contact, /EXOTEL_API_KEY/);'
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit verified regression fix
        run: |
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add tests/rendered-html.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Update routed contact regression for governed outbox [skip ci]"
          git pull --rebase origin grooming-integration-closure
          git push origin grooming-integration-closure
