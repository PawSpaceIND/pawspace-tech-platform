name: Deploy refreshed WhatsApp UAT webhook secrets on fixed staging SHA

on:
  push:
    branches:
      - fix/whatsapp-uat-staging-deploy-isolation
    paths:
      - .github/workflows/deploy-whatsapp-uat-webhook-secrets-fixed-sha.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    concurrency: pawspace-staging-deploy
    env:
      TARGET_SHA: c0cf8ac11349e2953f6b0ca98a6d53364147051f
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
      CALLBACK_URL: https://pawspace-staging.karthik-fce.workers.dev/api/whatsapp/meta-webhook
      WRANGLER_CONFIG: dist/server/wrangler.json
    steps:
      - name: Check out exact fixed Meta UAT SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact clean checkout
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$TARGET_SHA" ]
          [ -z "$(git status --porcelain)" ]
          echo 'Exact fixed Meta UAT SHA verified.'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build
        run: |
          npm run install:ci
          npm run build

      - name: Generate isolated staging config and preserve remote vars
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/stage-config.mjs
          SETTINGS="$RUNNER_TEMP/settings.json"; export SETTINGS
          trap 'rm -f "$SETTINGS"' EXIT
          HTTP="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pawspace-staging/settings")"
          [ "$HTTP" = "200" ] || { echo 'Unable to read pawspace-staging settings; response withheld.' >&2; exit 1; }
          node --input-type=module <<'NODE'
          import{readFileSync,writeFileSync}from'node:fs';
          const s=JSON.parse(readFileSync(process.env.SETTINGS,'utf8'));const b=Array.isArray(s?.result?.bindings)?s.result.bindings:[];
          const remote={};for(const x of b){if(x?.type==='plain_text'){const n=String(x?.name||'');if(/^[A-Z0-9_]+$/.test(n))remote[n]=String(x?.text??x?.value??'')}}
          const c=JSON.parse(readFileSync(process.env.WRANGLER_CONFIG,'utf8'));if(c.name!=='pawspace-staging')throw new Error('Refusing non-staging Worker target');
          c.vars={...remote,...(c.vars||{}),META_WHATSAPP_PHONE_NUMBER_ID:'1334980146365492',META_WHATSAPP_WABA_ID:'1647621440064984',PAWSPACE_PRODUCTION_ENFORCE:'false'};c.keep_vars=true;
          if(b.some(x=>String(x?.name||'')==='AI'&&/ai/i.test(String(x?.type||''))))c.ai={binding:'AI'};
          writeFileSync(process.env.WRANGLER_CONFIG,JSON.stringify(c,null,2),{mode:0o600});
          console.log('Staging vars preserved; PAWSPACE_PRODUCTION_ENFORCE=false pinned.');
          NODE

      - name: Deploy both refreshed Meta UAT secrets to pawspace-staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          META_WHATSAPP_UAT_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_UAT_ACCESS_TOKEN }}
          META_WHATSAPP_VERIFY_TOKEN: ${{ secrets.META_WHATSAPP_VERIFY_TOKEN }}
        run: |
          set -euo pipefail
          SECRETS="$RUNNER_TEMP/uat-secrets.json"; LOG="$RUNNER_TEMP/deploy.log"; export SECRETS
          trap 'rm -f "$SECRETS" "$LOG"' EXIT
          node --input-type=module <<'NODE'
          import{writeFileSync}from'node:fs';
          const names=['PAWSPACE_UAT_ACCESS_CODE','PAWSPACE_UAT_SIGNING_KEY','PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT','META_WHATSAPP_UAT_ACCESS_TOKEN','META_WHATSAPP_VERIFY_TOKEN'];
          const values=Object.fromEntries(names.map(n=>[n,String(process.env[n]||'').trim()]));
          if(Object.values(values).some(v=>!v))throw new Error('Required refreshed UAT secret missing');
          values.PAWSPACE_STAGING_LIVE_CUSTOMER_OTP='false';
          writeFileSync(process.env.SECRETS,JSON.stringify(values),{mode:0o600});
          NODE
          if ! npx wrangler deploy --config "$WRANGLER_CONFIG" --keep-vars --message "staging $TARGET_SHA refreshed-meta-webhook-secrets" --secrets-file "$SECRETS" > "$LOG" 2>&1; then echo 'Staging-only deploy failed; raw output withheld.' >&2; exit 1; fi
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$LOG" | tail -n 1 || true)"
          [ "$URL" = "$STAGING_URL" ] || { echo 'Unexpected Worker origin; output withheld.' >&2; exit 1; }
          echo 'Both refreshed Meta UAT secrets deployed to exact fixed SHA on pawspace-staging only.'

      - name: Verify staging lockdown and required secret bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SETTINGS="$RUNNER_TEMP/verify.json"; export SETTINGS
          trap 'rm -f "$SETTINGS"' EXIT
          HTTP="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pawspace-staging/settings")"; [ "$HTTP" = "200" ] || exit 1
          node --input-type=module <<'NODE'
          import{readFileSync}from'node:fs';const s=JSON.parse(readFileSync(process.env.SETTINGS,'utf8'));const b=Array.isArray(s?.result?.bindings)?s.result.bindings:[];const plain=Object.fromEntries(b.filter(x=>x?.type==='plain_text').map(x=>[String(x.name||''),String(x.text??x.value??'')]));
          if(plain.PAWSPACE_PRODUCTION_ENFORCE!=='false')throw new Error('Production lockdown is not explicitly false');
          for(const name of ['META_WHATSAPP_UAT_ACCESS_TOKEN','META_WHATSAPP_VERIFY_TOKEN','META_WHATSAPP_APP_SECRET']){const x=b.find(v=>String(v?.name||'')===name);if(!x||!/secret/i.test(String(x?.type||'')))throw new Error(`${name} secret binding missing from pawspace-staging`)}
          console.log('Production lockdown false; access token, verify token, and app-secret bindings present on staging.');
          NODE

      - name: Prove Meta webhook verification handshake with refreshed token
        env:
          META_WHATSAPP_VERIFY_TOKEN: ${{ secrets.META_WHATSAPP_VERIFY_TOKEN }}
        run: |
          set -euo pipefail
          CHALLENGE="uat-meta-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BODY="$RUNNER_TEMP/challenge.txt"; trap 'rm -f "$BODY"' EXIT
          HTTP="$(curl --silent --show-error --get --output "$BODY" --write-out '%{http_code}' --data-urlencode 'hub.mode=subscribe' --data-urlencode "hub.verify_token=$META_WHATSAPP_VERIFY_TOKEN" --data-urlencode "hub.challenge=$CHALLENGE" "$CALLBACK_URL")"
          [ "$HTTP" = "200" ] || { echo "Meta verifier handshake HTTP=$HTTP" >&2; exit 1; }
          [ "$(cat "$BODY")" = "$CHALLENGE" ] || { echo 'Meta verifier challenge response mismatch.' >&2; exit 1; }
          BAD_HTTP="$(curl --silent --show-error --get --output /dev/null --write-out '%{http_code}' --data-urlencode 'hub.mode=subscribe' --data-urlencode 'hub.verify_token=definitely-not-the-uat-secret' --data-urlencode 'hub.challenge=bad' "$CALLBACK_URL")"
          [ "$BAD_HTTP" = "403" ] || { echo "Invalid verify-token boundary HTTP=$BAD_HTTP" >&2; exit 1; }
          echo 'Webhook verification handshake passes with refreshed secret and rejects an invalid token.'
