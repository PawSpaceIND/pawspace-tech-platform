name: Certify combined staging Audio AI

# Staging-only certification for the combined WhatsApp + Audio AI build.
# Re-run after bounded MeloTTS provider retry hardening.
on:
  push:
    branches:
      - fix/staging-whatsapp-audio-ai-combined-uat
    paths:
      - .github/workflows/certify-staging-audio-ai-combined.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency: pawspace-staging-deploy

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
      WRANGLER_CONFIG: dist/server/wrangler.json
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact clean branch head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build combined staging app
        run: |
          npm run install:ci
          npm run build
      - name: Configure isolated staging with Workers AI
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: |
          set -euo pipefail
          node scripts/stage-config.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const c=JSON.parse(readFileSync(process.env.WRANGLER_CONFIG,'utf8'));
          if(c.name!=='pawspace-staging') throw new Error('Refusing non-staging target');
          if(c?.ai?.binding!=='AI') throw new Error('Workers AI binding is absent from generated staging config');
          if(c?.vars?.PAWSPACE_PRODUCTION_ENFORCE!=='false') throw new Error('Production enforcement is not explicitly false');
          if(c?.vars?.PAWSPACE_PAYMENT_ENV!=='sandbox') throw new Error('Payment environment is not sandbox');
          console.log('Generated staging config: AI binding present; production enforcement=false; payments=sandbox.');
          NODE
      - name: Deploy combined build to pawspace-staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/deploy.log"; trap 'rm -f "$LOG"' EXIT
          if ! npx wrangler deploy --config "$WRANGLER_CONFIG" --keep-vars --message "staging $GITHUB_SHA combined-whatsapp-audio-ai" > "$LOG" 2>&1; then
            echo 'Combined staging deployment failed; raw output withheld.' >&2
            exit 1
          fi
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$LOG" | tail -n 1 || true)"
          test "$URL" = "$STAGING_URL"
          echo 'Combined app deployed to pawspace-staging only.'
      - name: Verify Workers AI binding and staging lockdown remotely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SETTINGS="$RUNNER_TEMP/settings.json"; export SETTINGS
          trap 'rm -f "$SETTINGS"' EXIT
          HTTP="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pawspace-staging/settings")"
          test "$HTTP" = "200"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const s=JSON.parse(readFileSync(process.env.SETTINGS,'utf8')); const b=Array.isArray(s?.result?.bindings)?s.result.bindings:[];
          const p=Object.fromEntries(b.filter(x=>x?.type==='plain_text').map(x=>[String(x.name||''),String(x.text??x.value??'')]));
          const ai=b.find(x=>String(x?.name||'')==='AI');
          if(!ai || !/ai/i.test(String(ai?.type||''))) throw new Error('Remote pawspace-staging AI binding missing');
          if(p.PAWSPACE_PRODUCTION_ENFORCE!=='false') throw new Error('Remote staging production enforcement is not false');
          if(p.PAWSPACE_PAYMENT_ENV!=='sandbox') throw new Error('Remote staging payment environment is not sandbox');
          console.log('Remote pawspace-staging: Workers AI binding present; production enforcement=false; payments=sandbox.');
          NODE
      - name: Retrieve temporary UAT staff session in memory
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          SESSION_COOKIE="$(node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||'').replace(/\/$/,'');
          const response=await fetch(`${base}/api/staging-login`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',code:String(process.env.PAWSPACE_UAT_ACCESS_CODE||''),email:'founder@pawspace.in'}),signal:AbortSignal.timeout(20000)});
          if(!response.ok) throw new Error(`staging-login failed (${response.status})`);
          const cookie=String(response.headers.get('set-cookie')||'').split(';')[0].trim();
          if(!cookie||!cookie.includes('=')) throw new Error('staging-login did not issue a session cookie');
          process.stdout.write(cookie);
          NODE
          )"
          echo "::add-mask::$SESSION_COOKIE"
          umask 077
          printf '%s' "$SESSION_COOKIE" > "$RUNNER_TEMP/staging-uat-session"
          echo 'Temporary UAT staff session issued and masked.'
      - name: Execute authenticated Cloudflare STT and TTS roundtrip
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          SESSION_COOKIE="$(cat "$RUNNER_TEMP/staging-uat-session")"
          node scripts/staging-voice-auth.mjs --token "$SESSION_COOKIE" --base-url "$STAGING_URL"
          rm -f "$RUNNER_TEMP/staging-uat-session"
