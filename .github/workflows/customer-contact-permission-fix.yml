name: Apply customer contact permission fix

on:
  push:
    branches:
      - testfix/master-zero-gap-20260824

permissions:
  contents: write

concurrency:
  group: customer-contact-permission-fix
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[customer-contact-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testfix/master-zero-gap-20260824
          fetch-depth: 0

      - name: Apply the exact permission-boundary correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("lib/api-gateway.ts"): (
                  '  if(url.pathname==="/api/customer-contact"){const body=method==="POST"?await request.clone().json().catch(()=>({})) as Record<string,unknown>:{};return String(body.channel||"call")==="message"?"communications.message":"communications.call";}',
                  '  // Customer 360 contact can target any imported customer, so it is a system-wide administrative action.\n  // Booking-scoped provider communication remains on routes that enforce assignment and ownership.\n  if(url.pathname==="/api/customer-contact")return "communications.manage";',
              ),
              Path("app/api/customer-contact/route.ts"): (
                  'const actor=await resolveActor(request),body=await request.json() as Record<string,unknown>,requested=String(body.channel||"call"),isMessage=requested==="message";requirePermission(actor,isMessage?"communications.message":"communications.call");',
                  'const actor=await resolveActor(request),body=await request.json() as Record<string,unknown>,requested=String(body.channel||"call"),isMessage=requested==="message";requirePermission(actor,"communications.manage");',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit the reviewed correction and remove this helper
        shell: bash
        run: |
          rm .github/workflows/customer-contact-permission-fix.yml
          git config user.name "pawspace-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/api-gateway.ts app/api/customer-contact/route.ts .github/workflows/customer-contact-permission-fix.yml
          git commit -m "fix: close customer contact authorization [customer-contact-fix]"
          git push origin HEAD:testfix/master-zero-gap-20260824
