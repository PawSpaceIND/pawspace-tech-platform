name: Apply Track 3 remediation

on:
  push:
    branches:
      - fix/track3-ledger-finance-certification
    paths:
      - .github/workflows/track3-ledger-finance-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/track3-ledger-finance-certification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Verify isolation
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/track3-ledger-finance-certification"
          git merge-base --is-ancestor 96422d8728fea9c88fb014a5b29519df08bc99e4 HEAD
      - name: Apply source patch and regenerate seed
        run: |
          set -euo pipefail
          node scripts/ops/apply-track3-ledger-finance-remediation.mjs
          node scripts/ops/fix-track3-cache-api.mjs
          node --experimental-strip-types scripts/uat-demo-seed-gen.mjs
      - name: Add remediation regression contract
        run: |
          cat > tests/track3-finance-performance-remediation.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const finance=fs.readFileSync('app/api/grooming-finance/route.ts','utf8');
          const auth=fs.readFileSync('lib/uat-staging-auth.ts','utf8');
          const recon=fs.readFileSync('lib/grooming-payment-reconciliation.ts','utf8');
          const seed=fs.readFileSync('scripts/uat-demo-seed-gen.mjs','utf8');
          const seedSql=fs.readFileSync('scripts/uat-demo-seed.sql','utf8');
          test('finance edge snapshot is staging-only and downstream of authorization',()=>{
            assert.match(finance,/PAWSPACE_DEPLOYMENT_ENV\|\|""\)==="staging"/);
            assert.match(finance,/STAGING_FINANCE_CACHE_TTL_SECONDS=30/);
            assert.match(finance,/caches\.open\("pawspace-track3-finance-v2"\)/);
            assert.match(finance,/STAGING_FINANCE_CACHE_KEY/);
            assert.match(finance,/export async function GET[\s\S]*?authorize\(request,"finance\.view"\)[\s\S]*?readStagingFinanceCache\(\)/);
          });
          test('finance cache misses use hot-path indexes',()=>{
            assert.match(finance,/idx_grooming_finance_bookings_service_updated ON canonical_bookings\(service_code,updated_at DESC\)/);
            assert.match(recon,/idx_payment_reconciliation_exceptions_status_payment ON payment_reconciliation_exceptions\(status,payment_id\)/);
            assert.match(recon,/idx_payment_reconciliation_exceptions_status_created ON payment_reconciliation_exceptions\(status,created_at DESC\)/);
          });
          test('UAT actor cache remains downstream of signed-cookie verification',()=>{
            assert.match(auth,/UAT_ACTOR_EDGE_CACHE_TTL_SECONDS=30/);
            assert.match(auth,/caches\.open\("pawspace-uat-actor-v1"\)/);
            assert.match(auth,/resolveUatStaffActor[\s\S]*?verifyUatToken\(env,token\)[\s\S]*?readUatActorRow\(db,email\)/);
            assert.match(auth,/if\(!uatLoginEnabled\(env\)\)return null/);
          });
          test('UAT demo seed remains globally balanced',()=>{
            assert.doesNotMatch(seed,/deliberately UNBALANCED journal/);
            assert.doesNotMatch(seedSql,/deliberately unbalanced journal \(anomaly demo\)/);
            assert.match(seed,/UATD-JRN-BAD-2[\s\S]*?credit: 5000/);
            assert.match(seedSql,/UATD-JRN-BAD-2[^\n]*,0,5000,'Demo seed: balanced manual control journal'/);
          });
          EOF
      - name: Validate focused tests typecheck and build
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/track3-finance-performance-remediation.test.mjs tests/grooming-payment-reconciliation.test.mjs tests/ptja-w2-b2-collection-ledger.test.mjs tests/ptja-w2-08-revenue-reconciliation.test.mjs tests/uat-staging-auth.test.mjs tests/uat-demo-seed-sales-marketing.test.mjs
          npm run typecheck
          npm run build
      - name: Verify diff scope and push application commit
        run: |
          set -euo pipefail
          git diff --check
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const allowed=new Set(['app/api/grooming-finance/route.ts','lib/grooming-payment-reconciliation.ts','lib/uat-staging-auth.ts','scripts/uat-demo-seed-gen.mjs','scripts/uat-demo-seed.sql','tests/track3-finance-performance-remediation.test.mjs']);
          const changed=execFileSync('git',['status','--short'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean).map(line=>line.slice(3));
          const bad=changed.filter(path=>!allowed.has(path));
          if(bad.length)throw new Error('out-of-scope application changes: '+bad.join(', '));
          NODE
          git config user.name "PawSpace Track 3 Remediation"
          git config user.email "engineering@pawspace.in"
          git add app/api/grooming-finance/route.ts lib/grooming-payment-reconciliation.ts lib/uat-staging-auth.ts scripts/uat-demo-seed-gen.mjs scripts/uat-demo-seed.sql tests/track3-finance-performance-remediation.test.mjs
          git commit -m "fix(track3): balance staging seed and accelerate finance reads"
          git push origin HEAD:fix/track3-ledger-finance-certification
