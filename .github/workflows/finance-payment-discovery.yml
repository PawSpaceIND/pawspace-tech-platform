name: Finance captured Test payment discovery

on:
  push:
    branches:
      - cert/finance-e2e-razorpay
    paths:
      - .github/workflows/finance-payment-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-captured-payment:
    if: github.ref_name == 'cert/finance-e2e-razorpay'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
    steps:
      - name: Discover recent captured Razorpay Test payments without mutation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const key = String(process.env.RAZORPAY_KEY_ID || '').trim();
          const secret = String(process.env.RAZORPAY_KEY_SECRET || '');
          const fail = message => { console.error(`FINANCE_PAYMENT_DISCOVERY_BLOCKED: ${message}`); process.exit(1); };
          if (!key.startsWith('rzp_test_') || !secret) fail('Razorpay Payments Test credentials are missing or not Test Mode credentials');
          const auth = `Basic ${Buffer.from(`${key}:${secret}`).toString('base64')}`;
          const response = await fetch('https://api.razorpay.com/v1/payments?count=100', { headers: { authorization: auth } });
          const body = await response.json().catch(() => null);
          if (!response.ok) fail(`Razorpay Test payment listing returned HTTP ${response.status}${body?.error?.code ? ` (${body.error.code})` : ''}`);
          const cutoff = Math.floor(Date.now() / 1000) - (72 * 60 * 60);
          const captured = Array.isArray(body?.items) ? body.items
            .filter(item => item?.status === 'captured' && item?.currency === 'INR' && Number(item?.created_at || 0) >= cutoff)
            .sort((a, b) => Number(b.created_at || 0) - Number(a.created_at || 0))
            .slice(0, 10) : [];
          if (!captured.length) fail('no captured INR Razorpay Test payment was found in the last 72 hours');
          console.log(`FINANCE_CAPTURED_PAYMENT_DISCOVERY_OK candidates=${captured.length} mutation=false`);
          for (let index = 0; index < captured.length; index++) {
            const item = captured[index];
            console.log(`FINANCE_CAPTURED_PAYMENT_CANDIDATE rank=${index + 1} payment_id=${item.id} order_id=${item.order_id || 'none'} amount_paise=${Number(item.amount || 0)} amount_refunded_paise=${Number(item.amount_refunded || 0)} created_at=${Number(item.created_at || 0)}`);
          }
          NODE
