          catalogue_effect='''\n  useEffect(()=>{let active=true;void loadTrainingPackages().then(result=>{if(!active)return;const next=buildPlans(result.packages);setPlans(next);setMeetPackage(result.packages.find(item=>item.package_code==="trainer-meet-greet")||null);setPlan(current=>next.find(item=>item.packageCode===current.packageCode)||next.find(item=>item.recommended)||next[0]||emptyPlan);}).catch(problem=>{if(active)setScheduleError(problem instanceof Error?problem.message:"Unable to load Training catalogue");});return()=>{active=false;};},[]);\n'''
          text=text[:first_effect_end]+catalogue_effect+text[first_effect_end:]
          # move quote effect after derived constants
          insert_at=text.index('  const togglePet =')
