          new_start='''            <select value={startDateIndex} onChange={(event)=>setStartDateIndex(Number(event.target.value))}>\n              {startOptions.map((date,index)=><option value={index} key={date.toISOString()}>{slotLabel(date)}</option>)}\n            </select>'''
          assert old_start in text
          text=text.replace(old_start,new_start,1)
          old_preview='''            {["Sat, 9 Aug", "Tue, 12 Aug", "Sat, 16 Aug", "Tue, 19 Aug"].map(\n              (d, i) => (\n                <span key={d}>\n                  <i>{i + 1}</i>\n                  {d}\n                  <em>{time} · {serviceMinutes} min</em>\n                </span>\n              ),\n            )}'''
          new_preview='''            {calendarPreview.map((date,i)=><span key={date.toISOString()}><i>{i+1}</i>{slotLabel(date)}<em>{serviceMinutes} min</em></span>)}'''
          assert old_preview in text
          text=text.replace(old_preview,new_preview,1)
