          text=text.replace('export default function TrainingFlow() {\n  const [stage, setStage] = useState(1),','export default function TrainingFlow() {\n  const [plans,setPlans]=useState<Plan[]>([]);\n  const [meetPackage,setMeetPackage]=useState<TrainingPackage|null>(null);\n  const [checkoutQuote,setCheckoutQuote]=useState<TrainingQuote|null>(null);\n  const [startDateIndex,setStartDateIndex]=useState(0);\n  const [stage, setStage] = useState(1),',1)
