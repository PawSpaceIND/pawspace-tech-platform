name: Pet Taxi recertification patch
on:
  push:
    branches:
      - agent/taxi-gates1-5
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/taxi-gates1-5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Taxi recertification fixes
        run: python scripts/taxi-recertify-patch.py
      - name: Commit exact Taxi recertification tree
        run: |
          rm -f .github/workflows/taxi-recertify-patch.yml scripts/taxi-recertify-patch.py
          git config user.name "PawSpace Taxi Closure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Close Pet Taxi exact-head recertification gaps"
          git push origin HEAD:agent/taxi-gates1-5
