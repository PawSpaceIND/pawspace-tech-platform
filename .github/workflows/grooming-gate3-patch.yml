name: Wire Grooming Gate 3 provider governance

on:
  push:
    branches:
      - grooming-integration-closure
    paths:
      - .github/workflows/grooming-gate3-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Make future provider blackouts scheduling conflicts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('app/api/uat-scheduling/route.ts')
          text=path.read_text()
          if 'provider_unavailability WHERE provider_id=?' not in text:
              pattern=r'  async listBookings\(cityId,providerId\)\{.*?\},\n  async listAvailability'
              replacement='''  async listBookings(cityId,providerId){const [rows,blocks]=await Promise.all([db.prepare("SELECT * FROM scheduling_reservations WHERE city_id=? AND provider_id=? AND status!='cancelled'").bind(cityId,providerId??"").all<Record<string,unknown>>(),db.prepare("SELECT * FROM provider_unavailability WHERE provider_id=? AND status='active'").bind(providerId??"").all<Record<string,unknown>>()]);const reservations=rows.results.map(row=>({id:String(row.id),legacyIds:[],idempotencyKey:String(row.id),cityId:String(row.city_id),zoneId:String(row.zone_id),customerId:String(row.customer_id),petIds:JSON.parse(String(row.pet_ids_json)),serviceCode:String(row.service_code),packageCode:"uat",addonCodes:[],scheduledStart:String(row.scheduled_start),scheduledEnd:String(row.scheduled_end),status:String(row.status) as Booking["status"],channel:"customer_app",totalAmount:0,providerId:String(row.provider_id),assignmentMode:"automatic",scheduleGroupId:String(row.group_id),occurrenceNumber:Number(row.occurrence_number),capacityUnits:Number(row.capacity_units),careMode:row.care_mode as Booking["careMode"],createdBy:String(row.customer_id),createdAt:new Date(Number(row.created_at)).toISOString(),updatedAt:new Date(Number(row.created_at)).toISOString()}));const blackouts=blocks.results.map(row=>({id:`BLOCK-${String(row.id)}`,legacyIds:[],idempotencyKey:String(row.id),cityId,zoneId:"provider_blackout",customerId:"OPS-BLOCK",petIds:[],serviceCode:"grooming",packageCode:"provider_unavailable",addonCodes:[],scheduledStart:String(row.starts_at),scheduledEnd:String(row.ends_at),status:"assigned" as Booking["status"],channel:"operations_assisted" as const,totalAmount:0,providerId:String(providerId??""),assignmentMode:"automatic" as const,scheduleGroupId:`BLOCK-${String(row.id)}`,occurrenceNumber:1,capacityUnits:1,createdBy:String(row.created_by||"operations"),createdAt:new Date(Number(row.created_at||Date.now())).toISOString(),updatedAt:new Date(Number(row.updated_at||row.created_at||Date.now())).toISOString()}));return [...reservations,...blackouts];},
  async listAvailability'''
              text,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
              if count!=1: raise SystemExit('listBookings scheduler anchor missing')
              path.write_text(text)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit verified blackout patch
        run: |
          git config user.name "PawSpace Closure Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/uat-scheduling/route.ts
          if git diff --cached --quiet; then
            echo "Gate 3 blackout patch already present"
          else
            git commit -m "Respect provider blackout intervals in scheduling [skip ci]"
            git pull --rebase origin grooming-integration-closure
            git push origin HEAD:grooming-integration-closure
          fi
