name: Apply BST certification repair

on:
  push:
    branches:
      - cert/boarding-sitting-taxi-razorpay-e2e
    paths:
      - scripts/apply-bst-cert-repair.py
      - .github/workflows/apply-bst-cert-repair.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Apply scoped repair
        run: python scripts/apply-bst-cert-repair.py
      - name: Focused source contract
        run: node --test tests/boarding-sitting-taxi-customer-integrity.test.mjs
      - name: Diff integrity
        run: git diff --check
      - name: Commit repaired candidate source
        run: |
          set -euo pipefail
          rm -f .github/workflows/export-bst-cert-source.yml
          rm -f .github/workflows/apply-bst-cert-repair.yml
          rm -f scripts/apply-bst-cert-repair.py
          git config user.name "PawSpace Certification Bot"
          git config user.email "actions@pawspace.in"
          git add -A
          git diff --cached --check
          git commit -m "Certify Boarding Sitting Taxi booking and Razorpay integrity"
          git push origin HEAD:cert/boarding-sitting-taxi-razorpay-e2e
