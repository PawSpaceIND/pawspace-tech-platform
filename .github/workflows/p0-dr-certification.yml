name: P0 Rollback DR Certification

on:
  push:
    branches:
      - remediation/p0-pilot-gates-b379631
    paths:
      - docs/P0-ROLLBACK-DRILL.md
      - .github/workflows/p0-dr-certification.yml
      - tests/d1-restore-scratch-guard.test.mjs
      - tests/ai-enablement.test.mjs
      - tests/customer-reminder-lifecycle-runtime.test.mjs
      - tests/communication-enqueue-contract-runtime.test.mjs

permissions:
  contents: read

jobs:
  rollback-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: D1 restore compatibility guards
        run: node --experimental-strip-types --test tests/d1-restore-scratch-guard.test.mjs
      - name: Feature kill switch guards
        run: node --experimental-strip-types --test tests/ai-enablement.test.mjs
      - name: Queue and communication replay guards
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/customer-reminder-lifecycle-runtime.test.mjs
          node --experimental-strip-types --test tests/communication-enqueue-contract-runtime.test.mjs
      - name: Record drill protocol artifact
        uses: actions/upload-artifact@v4
        with:
          name: p0-rollback-drill-protocol-${{ github.sha }}
          path: docs/P0-ROLLBACK-DRILL.md
          if-no-files-found: error
