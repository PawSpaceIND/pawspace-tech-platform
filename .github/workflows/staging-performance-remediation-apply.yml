          assert marker in s; s=s.replace(marker,wrapper+marker,1)
          s=s.replace('authoredRows=await db.prepare("SELECT provider_id,date FROM scheduling_availability WHERE date>=? AND date<=? AND source IN (\'partner_app\',\'operations\',\'roster\')").bind(sorted[0]??"",sorted[sorted.length-1]??"").all<Record<string,unknown>>(),authored=new Set(authoredRows.results.map(row=>`${String(row.provider_id)}|${String(row.date)}`));','existingRows=await db.prepare("SELECT provider_id,date,zone_id FROM scheduling_availability WHERE date>=? AND date<=?").bind(sorted[0]??"",sorted[sorted.length-1]??"").all<Record<string,unknown>>(),existing=new Set(existingRows.results.map(row=>`${String(row.provider_id)}|${String(row.date)}|${String(row.zone_id)}`));',1)
          s=s.replace('if(authored.has(`${provider.id}|${date}`))continue;','if(existing.has(`${provider.id}|${date}|${input.zoneId}`))continue;',1)
          a=s.index('async function insertReservations('); b=s.index('async function operateAssignment(',a)
          atomic=r'''async function insertReservations(db:Awaited<ReturnType<typeof database>>,groupId:string,input:RequestBody,decision:ScheduleDecision,lease:ReservationLease){if(!decision.provider)throw new Error("No eligible provider selected");const createdAt=Date.now();await assertProviderAssignable(db,decision.provider.id,createdAt);const overnight=input.serviceCode==="boarding"||(input.serviceCode==="pet_sitting"&&input.careMode==="overnight"),capacity=Number(decision.provider.capacity??1),units=input.petIds.length,bufferMs=(decision.provider.travelBufferMinutes??scheduleRules[input.serviceCode].bufferMinutes)*60_000,maxDailyJobs=Number(decision.provider.maxDailyJobs??6),offsetMinutes=cityOffsetMinutes(cityIdFor(input)),cityOffsetModifier=`+${offsetMinutes} minutes`,shift=(value:string,ms:number)=>new Date(new Date(value).getTime()+ms).toISOString(),bufferedEnd=(value:string)=>shift(value,bufferMs),bufferedStart=(value:string)=>shift(value,-bufferMs),localDayOf=(value:string)=>shift(value,offsetMinutes*60_000).slice(0,10);const statements=decision.occurrences.map(occ=>{const values=[`${groupId}_${decision.provider!.id}_${occ.occurrenceNumber}_${createdAt}`,groupId,decision.provider!.id,input.serviceCode,cityIdFor(input),input.zoneId,input.customerId,JSON.stringify(input.petIds),occ.start,occ.end,units,occ.occurrenceNumber,input.careMode??null,"assigned",JSON.stringify(decision.explanation),createdAt,lease.leaseExpiresAt,lease.customerSessionId];return overnight?db.prepare(`INSERT INTO scheduling_reservations (${RESERVATION_COLUMNS}) SELECT ?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,? WHERE (SELECT COALESCE(SUM(capacity_units),0) FROM scheduling_reservations WHERE provider_id=? AND status!='cancelled' AND scheduled_start<? AND scheduled_end>?)+?<=? AND EXISTS (SELECT 1 FROM provider_capacity_profiles WHERE id=? AND live=1 AND status='active')`).bind(...values,decision.provider!.id,occ.end,occ.start,units,capacity,decision.provider!.id):db.prepare(`INSERT INTO scheduling_reservations (${RESERVATION_COLUMNS}) SELECT ?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,? WHERE NOT EXISTS (SELECT 1 FROM scheduling_reservations WHERE provider_id=? AND status!='cancelled' AND scheduled_start<? AND scheduled_end>?) AND (SELECT COUNT(*) FROM scheduling_reservations WHERE provider_id=? AND status!='cancelled' AND substr(datetime(scheduled_start,?),1,10)=?)<? AND EXISTS (SELECT 1 FROM provider_capacity_profiles WHERE id=? AND live=1 AND status='active')`).bind(...values,decision.provider!.id,bufferedEnd(occ.end),bufferedStart(occ.start),decision.provider!.id,cityOffsetModifier,localDayOf(occ.start),maxDailyJobs,decision.provider!.id);});if(statements.length===1){const result=await statements[0]!.run();if(Number(result.meta?.changes||0)===1)return;await assertProviderAssignable(db,decision.provider.id);throw new SlotConflictError();}const results=await db.batch(statements);if(results.every(result=>Number(result.meta?.changes||0)===1))return;await db.prepare("DELETE FROM scheduling_reservations WHERE group_id=? AND created_at=?").bind(groupId,createdAt).run();await assertProviderAssignable(db,decision.provider.id);throw new SlotConflictError();}
          '''.replace('\n          ','\n')
          s=s[:a]+atomic+s[b:]; p.write_text(s)

          p=Path('app/api/canonical-bookings/route.ts'); s=p.read_text()
          anchor='import {cityBookingVerdict} from "../../../lib/city-status-authority";'; assert anchor in s
          s=s.replace(anchor,anchor+'\nimport {withRetryingD1Writes} from "../../../lib/d1-write-retry";',1)
          old='async function database(){const {env}=await import("cloudflare:workers");return env.DB;}'; assert old in s
          s=s.replace(old,'async function database(){const {env}=await import("cloudflare:workers");return withRetryingD1Writes(env.DB);}',1)
          old='async function ensureTables(db:Awaited<ReturnType<typeof database>>){await db.batch(['; assert old in s
          pre='async function ensureTablesUncached(db:Awaited<ReturnType<typeof database>>){const required=["canonical_customers","canonical_pets","canonical_bookings","provider_work_orders","booking_payments","booking_lifecycle_events","booking_subscription_usage","customer_grooming_subscriptions","grooming_subscription_purchase_snapshots","idx_booking_lifecycle_events_booking","idx_canonical_pets_customer"];const rows=await db.prepare(`SELECT name FROM sqlite_master WHERE name IN (${required.map(()=>"?").join(",")})`).bind(...required).all<Record<string,unknown>>();if(new Set(rows.results.map(row=>String(row.name))).size===required.length)return;await db.batch(['
          s=s.replace(old,pre,1)
          marker='\n/*\n * The service-wide window guard'; assert marker in s
          wrapper='\nconst canonicalTablesReady=new WeakMap<object,Promise<void>>();\nasync function ensureTables(db:Awaited<ReturnType<typeof database>>){const key=db as object;let pending=canonicalTablesReady.get(key);if(!pending){pending=ensureTablesUncached(db);canonicalTablesReady.set(key,pending);pending.catch(()=>{if(canonicalTablesReady.get(key)===pending)canonicalTablesReady.delete(key);});}return pending;}\n'
          s=s.replace(marker,wrapper+marker,1); p.write_text(s)

          p=Path('tests/uat-scheduling-d1-contention.test.mjs'); s=p.read_text()
          s=s.replace('if(attempts<4)','if(attempts<3)',1).replace('assert.equal(attempts,4);','assert.equal(attempts,3);',1).replace('assert.deepEqual(delays,[10,20,40]);','assert.deepEqual(delays,[5,10]);',1)
          s+=r'''

          test("D1 retry policy hard-caps attempts, per-sleep backoff and total wait",async()=>{
            let attempts=0;const delays=[];
            await assert.rejects(()=>retry.withD1WriteRetry(async()=>{attempts+=1;const error=new Error("database is busy");error.code="SQLITE_BUSY";throw error;},{attempts:99,baseDelayMs:100,maxDelayMs:1000,maxTotalDelayMs:1000,random:()=>0.999999,sleep:async delay=>{delays.push(delay);}}),error=>retry.isSqliteBusyError(error));
            assert.equal(attempts,3);assert.deepEqual(delays,[50,50]);
          });

          test("Track 3 write hot paths avoid repeated DDL and read-after-write slot verification",()=>{
            const scheduling=fs.readFileSync(new URL("../app/api/uat-scheduling/route.ts",import.meta.url),"utf8");
            const leases=fs.readFileSync(new URL("../lib/scheduling-reservation-leases.ts",import.meta.url),"utf8");
            const capacity=fs.readFileSync(new URL("../lib/provider-capacity-governance.ts",import.meta.url),"utf8");
            const canonical=fs.readFileSync(new URL("../app/api/canonical-bookings/route.ts",import.meta.url),"utf8");
            const insert=scheduling.slice(scheduling.indexOf("async function insertReservations"),scheduling.indexOf("async function operateAssignment"));
            assert.match(scheduling,/schedulingTablesReady=new WeakMap/);
            assert.match(scheduling,/SELECT provider_id,date,zone_id FROM scheduling_availability/);
            assert.match(insert,/statements\.length===1[\s\S]*?\.run\(\)[\s\S]*?meta\?\.changes/);
            assert.doesNotMatch(insert,/SELECT COUNT\(\*\) count FROM scheduling_reservations WHERE group_id/);
            assert.match(leases,/cleanupRunning=new WeakMap/);
            assert.match(leases,/INSERT OR REPLACE INTO scheduling_reservation_lease_cleanup[\s\S]*?SELECT DISTINCT/);
            assert.doesNotMatch(leases,/for\(const row of rows\.results\)/);
            assert.match(capacity,/capacityDefaultsSeeding=new WeakMap/);
            assert.match(capacity,/providerBookingGuardEnsuring=new WeakMap/);
            assert.match(canonical,/withRetryingD1Writes\(env\.DB\)/);
            assert.match(canonical,/canonicalTablesReady=new WeakMap/);
          });
          '''
          p.write_text(s)
          PY
      - name: Focused contention tests
        run: node --experimental-strip-types --test tests/uat-scheduling-d1-contention.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Commit isolated concurrency remediation
        run: |
          set -euo pipefail
          git fetch origin fix/staging-performance-remediation
          test "$(git rev-parse origin/fix/staging-performance-remediation)" = "$GITHUB_SHA"
          rm .github/workflows/staging-performance-remediation-apply.yml
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add lib/d1-write-retry.ts lib/scheduling-reservation-leases.ts lib/provider-capacity-governance.ts app/api/uat-scheduling/route.ts app/api/canonical-bookings/route.ts tests/uat-scheduling-d1-contention.test.mjs .github/workflows/staging-performance-remediation-apply.yml
          git diff --cached --check
          git commit -m "perf(scheduling): bound D1 write contention"
          git push origin HEAD:fix/staging-performance-remediation
          echo "EXPECTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build remediation SHA
        run: npm run build
      - name: Configure isolated staging
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs
      - name: Deploy remediation SHA to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/staging-remediation-secrets.json"; export SECRETS_FILE
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const required=['PAWSPACE_UAT_ACCESS_CODE','PAWSPACE_UAT_SIGNING_KEY','PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT','RAZORPAY_WEBHOOK_SECRET_SANDBOX'];
          const optional=['RAZORPAY_KEY_ID_SANDBOX','RAZORPAY_KEY_SECRET_SANDBOX'];
          const values=Object.fromEntries(required.map(n=>[n,process.env[n]||'']));
          if(Object.values(values).some(v=>!v)) throw new Error('required Track 3 staging secret missing');
          for(const n of optional)if(process.env[n])values[n]=process.env[n];
          values.PAWSPACE_STAGING_LIVE_CUSTOMER_OTP='false';
          writeFileSync(process.env.SECRETS_FILE,JSON.stringify(values),{mode:0o600});
          NODE
          npx wrangler deploy --message "staging $EXPECTED_SHA" --secrets-file "$SECRETS_FILE" 2>&1 | tee deployment.txt
      - name: Certify staging isolation and exact SHA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
          PRODUCTION_WORKER_NAME: ${{ vars.PRODUCTION_WORKER_NAME }}
        run: node tests/e2e/staging-certification.mjs --isolation-only
      - name: Seed deterministic staging identities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p scripts/ops
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-role-seed.mjs > scripts/ops/staging-role-seed.mjs
          node --experimental-strip-types scripts/ops/staging-role-seed.mjs "$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --file="$RUNNER_TEMP/staging-role-seed.sql"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --file=scripts/employee-seed.sql
      - name: Verify healthz
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const response=await fetch(process.env.STAGING_URL+'/healthz',{signal:AbortSignal.timeout(15000)});const text=await response.text();let body=null;try{body=JSON.parse(text)}catch{}const evidence={url:process.env.STAGING_URL+'/healthz',status:response.status,ok:response.ok,body};fs.writeFileSync('healthz-evidence.json',JSON.stringify(evidence,null,2));console.log(JSON.stringify(evidence,null,2));if(response.status!==200||body?.status!=='ok')process.exit(1);
          NODE
      - name: Run hosted Track 3 workload
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          PERF_RUN_ID: remediation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-performance-gate.mjs > scripts/ops/staging-performance-gate.mjs
          node scripts/ops/staging-performance-gate.mjs
      - name: Verify D1 Track 3 invariants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RUN_ID="$(node -e "const r=require('./staging-performance.json');process.stdout.write(r.runId)")"
          SQL="SELECT (SELECT COUNT(*) FROM canonical_bookings WHERE idempotency_key LIKE '${RUN_ID}:booking:%') bookings,(SELECT COUNT(*) FROM booking_payments WHERE booking_id IN (SELECT id FROM canonical_bookings WHERE idempotency_key LIKE '${RUN_ID}:booking:%')) payments,(SELECT COUNT(*) FROM scheduling_assignment_decisions WHERE group_id LIKE '${RUN_ID}:grp:%') assignments,(SELECT COUNT(*) FROM payment_gateway_events WHERE event_id='${RUN_ID}:evt:replay') webhook_events,(SELECT ROUND(COALESCE(SUM(debit),0)-COALESCE(SUM(credit),0),2) FROM finance_journal_entries) ledger_drift;"
          npx wrangler d1 execute pawspace-staging --remote --json --command "$SQL" > staging-performance-d1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const raw=JSON.parse(fs.readFileSync('staging-performance-d1.json','utf8'));const row=(Array.isArray(raw)?raw[0]:raw)?.results?.[0]||{};const n=k=>Number(row[k]??NaN);console.log(JSON.stringify(row,null,2));if(n('bookings')!==100||n('payments')!==100||n('assignments')!==100||n('webhook_events')!==1||Math.abs(n('ledger_drift'))>0.000001)process.exit(1);
          NODE
      - name: Enforce Track 3 thresholds and scan failures
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('staging-performance.json','utf8'));const failures=p.failures||[];const lockOr500=failures.filter(x=>/\b500\b|SQLITE_BUSY|database (?:table )?is locked|cannot start a transaction within a transaction/i.test(String(x.error||'')));const p95=Number(p.metrics?.p95Ms??p.metrics?.p95??NaN);const errorRate=Number(p.metrics?.errorRate??NaN);const evidence={failureCount:failures.length,lockOr500Failures:lockOr500,p95Ms:p95,errorRate,metrics:p.metrics,counts:p.counts,thresholds:p.thresholds};console.log(JSON.stringify(evidence,null,2));if(!Number.isFinite(p95)||p95>=750||!Number.isFinite(errorRate)||errorRate>=0.01||lockOr500.length||failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-track3-write-contention-remediation
          path: |
            deployment.txt
            healthz-evidence.json
            staging-performance.json
            staging-performance-d1.json
          if-no-files-found: warn
