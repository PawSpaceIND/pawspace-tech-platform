              ]);capacityTablesEnsured.add(db);
            })();capacityTablesEnsuring.set(db,pending);try{return await pending;}finally{if(capacityTablesEnsuring.get(db)===pending)capacityTablesEnsuring.delete(db);}
          }

          export async function seedProviderCapacityDefaults(db:Db){
            if(capacityDefaultsSeeded.has(db))return;
            const running=capacityDefaultsSeeding.get(db);if(running)return running;
            const pending=(async()=>{await ensureProviderCapacityTables(db);const ids=defaults.map(p=>p.id);const existing=await db.prepare(`SELECT COUNT(*) count FROM provider_capacity_profiles WHERE id IN (${ids.map(()=>"?").join(",")})`).bind(...ids).first<Row>();if(Number(existing?.count||0)===ids.length){capacityDefaultsSeeded.add(db);return;}const now=Date.now();await db.batch(defaults.map(p=>db.prepare("INSERT OR IGNORE INTO provider_capacity_profiles (id,city_id,name,provider_model,services_json,zones_json,live,rating,quality_score,capacity,travel_buffer_minutes,max_daily_jobs,acceptance_timeout_minutes,status,version,effective_from,effective_to,updated_by,updated_at) VALUES (?,?,?,?,?,?,1,?,?,?,?,?,?,'active',1,'2026-08-01',NULL,'founder_seed',?)").bind(p.id,p.cityId,p.name,p.model,JSON.stringify(p.services),JSON.stringify(p.zones),p.rating,p.qualityScore,p.capacity,p.travelBufferMinutes,p.maxDailyJobs,p.acceptanceTimeoutMinutes,now)));capacityDefaultsSeeded.add(db);})();capacityDefaultsSeeding.set(db,pending);try{return await pending;}finally{if(capacityDefaultsSeeding.get(db)===pending)capacityDefaultsSeeding.delete(db);}
          }

          '''.replace('\n          ','\n')
          s=s[:a]+replacement+s[b:]
          a=s.index('export async function ensureProviderBookingGuard')
          b=s.index('export async function getProviderAcceptanceTimeout',a)
          guard=r'''export async function ensureProviderBookingGuard(db:Db){if(providerBookingGuardEnsured.has(db))return;const running=providerBookingGuardEnsuring.get(db);if(running)return running;const pending=(async()=>{await ensureProviderCapacityTables(db);const required=["provider_booking_confirmation_guards","block_unavailable_provider_booking"];const rows=await db.prepare(`SELECT name FROM sqlite_master WHERE name IN (?,?)`).bind(...required).all<Row>();if(new Set(rows.results.map(row=>String(row.name))).size===required.length){providerBookingGuardEnsured.add(db);return;}await db.batch([db.prepare("CREATE TABLE IF NOT EXISTS provider_booking_confirmation_guards (group_id TEXT PRIMARY KEY,created_at INTEGER NOT NULL)"),db.prepare("CREATE TRIGGER IF NOT EXISTS block_unavailable_provider_booking BEFORE INSERT ON provider_booking_confirmation_guards WHEN EXISTS (SELECT 1 FROM scheduling_reservations r JOIN provider_unavailability u ON u.provider_id=r.provider_id AND u.status='active' AND u.starts_at<r.scheduled_end AND u.ends_at>r.scheduled_start WHERE r.group_id=NEW.group_id AND r.status!='cancelled') BEGIN SELECT RAISE(ABORT,'provider_unavailable_before_booking'); END")]);providerBookingGuardEnsured.add(db);})();providerBookingGuardEnsuring.set(db,pending);try{return await pending;}finally{if(providerBookingGuardEnsuring.get(db)===pending)providerBookingGuardEnsuring.delete(db);}}
          '''.replace('\n          ','\n')
          s=s[:a]+guard+s[b:]; p.write_text(s)

          p=Path('app/api/uat-scheduling/route.ts'); s=p.read_text()
          old='async function ensureSchedulingTables(db:Awaited<ReturnType<typeof database>>){await db.batch(['
          assert old in s
          pre='async function ensureSchedulingTablesUncached(db:Awaited<ReturnType<typeof database>>){const required=["scheduling_assignment_decisions","scheduling_rules","scheduling_availability","scheduling_reservations","idx_scheduling_availability_provider_date","idx_scheduling_availability_date_provider_source","idx_scheduling_reservations_provider","idx_scheduling_reservations_city_status_provider_window","idx_scheduling_reservations_group","idx_provider_unavailability_window"];const rows=await db.prepare(`SELECT name FROM sqlite_master WHERE name IN (${required.map(()=>"?").join(",")})`).bind(...required).all<Record<string,unknown>>();if(new Set(rows.results.map(row=>String(row.name))).size===required.length){await ensureSchedulingReservationLeaseGovernance(db);return;}await db.batch(['
          s=s.replace(old,pre,1)
          marker='\n\nasync function seedUatRoster'
