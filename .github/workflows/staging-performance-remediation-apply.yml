          s=s.replace('const capacityTablesEnsured=new WeakSet<Db>();\nconst capacityDefaultsSeeded=new WeakSet<Db>();','const capacityTablesEnsured=new WeakSet<Db>();\nconst capacityDefaultsSeeded=new WeakSet<Db>();\nconst capacityTablesEnsuring=new WeakMap<Db,Promise<void>>();\nconst capacityDefaultsSeeding=new WeakMap<Db,Promise<void>>();\nconst providerBookingGuardEnsured=new WeakSet<Db>();\nconst providerBookingGuardEnsuring=new WeakMap<Db,Promise<void>>();',1)
          a=s.index('export async function ensureProviderCapacityTables')
