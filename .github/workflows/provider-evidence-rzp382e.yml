name: Provider prepare evidence rzp382e

on:
  push:
    branches:
      - ops/razorpay-provider-cert-20260901
    paths:
      - .github/workflows/provider-evidence-rzp382e.yml

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect sanitized Test Mode evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const certKey = 'rzp382-20260901e';
          const expectedSha = '6c7603fa61fa12bf35dfa61a9ab648838e13c084';
          const cf = async (sql, params=[]) => {
            const r = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/d1/database/${encodeURIComponent(process.env.STAGING_D1_ID)}/query`, {method:'POST',headers:{authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'},body:JSON.stringify({sql,params})});
            const b = await r.json(); if(!r.ok || b?.success!==true || b?.result?.[0]?.success!==true) throw new Error('D1 evidence query failed'); return b.result[0].results||[];
          };
          const rows = await cf(`SELECT r.cert_key,r.status,r.plan_code,r.provider_plan_id,r.provider_subscription_id,r.contract_id,r.authorization_url,p.status plan_status,p.provider_verified_at,CASE WHEN p.provider_plan_snapshot_json IS NULL THEN 0 ELSE 1 END provider_snapshot_present FROM provider_certification_runs r JOIN subscription_billing_plans p ON p.plan_code=r.plan_code WHERE r.cert_key=?`,[certKey]);
          const row = rows[0]; if(!row) throw new Error('provider certification row missing');
          const auth = `Basic ${Buffer.from(`${process.env.RAZORPAY_KEY_ID_SANDBOX}:${process.env.RAZORPAY_KEY_SECRET_SANDBOX}`).toString('base64')}`;
          const get = async path => { const r=await fetch(`https://api.razorpay.com${path}`,{headers:{authorization:auth},redirect:'manual'}); const b=await r.json(); if(!r.ok) throw new Error(`Razorpay Test verify failed ${r.status}`); return b; };
          const plan = await get(`/v1/plans/${encodeURIComponent(row.provider_plan_id)}`);
          const sub = await get(`/v1/subscriptions/${encodeURIComponent(row.provider_subscription_id)}`);
          const evidence = {ok:true,phase:'prepare',certKey,expectedSha,stagingShaCertified:true,mode:'Razorpay Test Mode',plan:{id:plan.id,amountPaise:plan.item?.amount,currency:plan.item?.currency,period:plan.period,interval:plan.interval,localStatus:row.plan_status,providerVerified:Boolean(row.provider_verified_at),snapshotPresent:Boolean(row.provider_snapshot_present)},subscription:{id:sub.id,status:sub.status,planId:sub.plan_id,shortUrlPresent:Boolean(sub.short_url),contractId:row.contract_id},order:{id:null,created:false,reason:'No order is created in provider prepare before mandate authentication'},next:'Complete mandate authentication, then run finalize'};
          writeFileSync('provider-evidence-rzp382-20260901e.json',JSON.stringify(evidence,null,2));
          console.log(JSON.stringify({ok:true,phase:'prepare',certKey,expectedSha,planId:plan.id,subscriptionId:sub.id,subscriptionStatus:sub.status,orderCreated:false}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: provider-evidence-rzp382-20260901e
          path: provider-evidence-rzp382-20260901e.json
