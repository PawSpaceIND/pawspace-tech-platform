name: Food Gate 2 due-ledger fix
on:
  push:
    branches:
      - agent/food-gates1-5
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/food-gates1-5
      - name: Enforce canonical payment-due verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("lib/food-fulfilment-governance.ts")
          source = path.read_text()
          old = ']);await event(db,String(order.id),"food_delivered",input.actorId,{method,otpConnected:false,paymentEventId,paymentStatus:"due",liveMoney:false});'
          new = ']);const dueEvent=await db.prepare("SELECT id FROM food_order_payment_events WHERE id=? AND order_id=? AND status=\'due\'").bind(paymentEventId,order.id).first<Row>();if(!dueEvent)throw new Response("Food delivery payment event was not recorded as due",{status:500});await event(db,String(order.id),"food_delivered",input.actorId,{method,otpConnected:false,paymentEventId,paymentStatus:"due",liveMoney:false});'
          if new in source:
              raise SystemExit(0)
          if old not in source:
              raise SystemExit("Expected Food Gate 2 delivery marker not found")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit focused fix and remove helper
        run: |
          rm -f .github/workflows/food-gate2-due-fix.yml
          git config user.name "PawSpace Food Closure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(food): verify Gate 2 payment due ledger"
          git push origin HEAD:agent/food-gates1-5
