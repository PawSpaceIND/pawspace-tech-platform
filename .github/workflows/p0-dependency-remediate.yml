name: P0 Dependency Remediation

on:
  push:
    branches:
      - remediation/p0-pilot-gates-b379631
    paths:
      - .github/workflows/p0-dependency-remediate.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/p0-pilot-gates-b379631
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch production and compatible tooling dependencies
        run: |
          set -euo pipefail
          npm install --save-exact next@16.3.4 react@19.2.8 react-dom@19.2.8
          npm install --save-dev --save-exact eslint-config-next@16.3.4 react-server-dom-webpack@19.2.8 @cloudflare/vite-plugin@1.54.4 vite@8.2.2 wrangler@4.129.0
          npm audit fix --package-lock-only || true
      - name: Patch backend transitive dependencies without forced majors
        working-directory: backend
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only || true
      - name: Prove no production high or critical advisories remain
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          npm --prefix backend audit --omit=dev --audit-level=high
      - name: Capture residual all-dependency advisories
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/root-residual.json"
          npm --prefix backend audit --json > "$RUNNER_TEMP/backend-residual.json"
          exit 0
      - name: Validate root build and typecheck
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run build
      - name: Validate backend
        working-directory: backend
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
      - name: Write residual security disposition
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const reports=[['root',`${process.env.RUNNER_TEMP}/root-residual.json`],['backend',`${process.env.RUNNER_TEMP}/backend-residual.json`]];
          const rows=[];
          for(const [scope,file] of reports){
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            for(const [pkg,v] of Object.entries(report.vulnerabilities||{})){
              if(!['high','critical'].includes(String(v.severity))) continue;
              rows.push({scope,package:pkg,severity:v.severity,direct:Boolean(v.isDirect),range:v.range,fixAvailable:v.fixAvailable,via:v.via});
            }
          }
          const acceptedPackages=new Set(['vinext','image-size']);
          const untriaged=rows.filter(r=>!acceptedPackages.has(r.package));
          const accepted=rows.filter(r=>acceptedPackages.has(r.package)).map(r=>({...r,
            disposition:'temporary-risk-acceptance',
            reachability:'development/build-time Vinext image metadata path; absent from production-only dependency audit',
            controls:['repository-controlled build inputs only','production audit remains high/critical-free','do not process untrusted ICNS/JXL/HEIF through this build path','upgrade Vinext to patched compatible beta/stable after separate compatibility certification']
          }));
          const out={generatedAt:new Date().toISOString(),highCriticalRows:rows,temporaryRiskAcceptances:accepted,untriaged};
          fs.writeFileSync('p0-dependency-disposition.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          if(untriaged.length){console.error(`Untriaged high/critical rows: ${untriaged.length}`);process.exit(1)}
          NODE
      - name: Commit validated dependency remediation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json backend/package.json backend/package-lock.json; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git config user.name 'pawspace-p0-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json backend/package.json backend/package-lock.json
          git commit -m 'fix(p0): patch dependency advisories without forced majors'
          git push origin HEAD:remediation/p0-pilot-gates-b379631
      - name: Upload dependency disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-dependency-remediation-${{ github.sha }}
          path: p0-dependency-disposition.json
          if-no-files-found: warn
