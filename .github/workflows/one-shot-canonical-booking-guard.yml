name: One-shot canonical booking guard

on:
  push:
    branches:
      - testfix/master-zero-gap-20260824
    paths:
      - .github/workflows/one-shot-canonical-booking-guard.yml

permissions:
  contents: write

concurrency:
  group: one-shot-canonical-booking-guard
  cancel-in-progress: false

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: testfix/master-zero-gap-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the reviewed canonical booking boundary patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/canonical-booking-guard.patch <<'PATCH'
          --- a/lib/api-gateway.ts
          +++ b/lib/api-gateway.ts
          @@ -143,7 +143,7 @@
             if(url.pathname==="/api/city-governance")return method==="GET"?"launch.view":"launch.manage";
             if(url.pathname==="/api/integration-readiness")return method==="GET"?"launch.view":"launch.manage";
