name: Apply Track 3 concurrent read coalescing

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/apply-try-prepare-assignment-optimization.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Apply concurrent read coalescing
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > "$RUNNER_TEMP/track3_coalesce_patch.py"
          python3 "$RUNNER_TEMP/track3_coalesce_patch.py"
      - name: Validate coalescing and existing finance/auth invariants
        run: |
          node --experimental-strip-types --test tests/uat-scheduling-d1-contention.test.mjs tests/grooming-closure.test.mjs tests/uat-staging-auth.test.mjs tests/staging-auth-secrets.test.mjs tests/staging-login-identities.test.mjs tests/financial-lifecycle-concurrency.test.mjs tests/financial-lifecycle-executable-concurrency.test.mjs tests/post-service-payment-link.test.mjs
          npm run typecheck
          npm run build
          git diff --check
          printf '%s\n' "$(git diff --name-only)"
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app/api/grooming-finance/route.ts lib/uat-staging-auth.ts tests/uat-scheduling-d1-contention.test.mjs "
      - name: Commit and push concurrent read coalescing
        run: |
          git config user.name "PawSpace Release Bot"
          git config user.email "release-bot@pawspace.in"
          git commit -am "perf(staging): coalesce concurrent finance and actor reads"
          git push origin HEAD:fix/staging-performance-remediation
