name: Prove verification race baseline

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/apply-try-prepare-assignment-optimization.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1a358152e244bcfb19db88684da0991f663965c
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Run verification revocation race on unmodified application baseline
        run: node --experimental-strip-types --test tests/ptja-w1-f53-verification-expiry-gate.test.mjs
