name: Pin instrumented scheduling SHA

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/apply-try-prepare-assignment-optimization.yml

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - name: Pin certification target
        run: |
          sed -i 's/TARGET_SHA: 8e6cb14beeeb836f6f61cd34a73f2f2c3498bff1/TARGET_SHA: e1f028f1be6bd2570d6c0ceca7b27562f23cff5a/' .github/workflows/staging-write-contention-certify-v6.yml
          grep 'TARGET_SHA:' .github/workflows/staging-write-contention-certify-v6.yml
          git diff --check
      - name: Commit target pin
        run: |
          git config user.name "PawSpace Release Bot"
          git config user.email "release-bot@pawspace.in"
          git add .github/workflows/staging-write-contention-certify-v6.yml
          git commit -m "ci: certify instrumented scheduling SHA"
          git push origin HEAD:fix/staging-performance-remediation
