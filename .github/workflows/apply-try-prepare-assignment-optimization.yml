name: Remove canonical governance schema storms

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/apply-try-prepare-assignment-optimization.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Make canonical governance setup read-first
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Shared service-policy tables: a steady-state policy resolution must not execute four DDL writes.
          p=Path('lib/service-policy-governance.ts'); s=p.read_text()
          old='''const tablesEnsured=new WeakSet<Db>();\nexport async function ensureServicePolicyTables(db:Db){\n  if(tablesEnsured.has(db))return;\n  await db.batch([\n    db.prepare("CREATE TABLE IF NOT EXISTS service_policy_configs (id TEXT PRIMARY KEY,policy_domain TEXT NOT NULL,service_code TEXT NOT NULL DEFAULT '*',city_id TEXT NOT NULL DEFAULT '*',config_json TEXT NOT NULL DEFAULT '{}',notes TEXT NOT NULL DEFAULT '',active INTEGER NOT NULL DEFAULT 1,version INTEGER NOT NULL DEFAULT 1,effective_from TEXT NOT NULL,effective_to TEXT,updated_by TEXT NOT NULL,updated_at INTEGER NOT NULL)"),\n    db.prepare("CREATE INDEX IF NOT EXISTS idx_service_policy_lookup ON service_policy_configs(policy_domain,service_code,city_id,active,effective_from,effective_to)"),\n    db.prepare("CREATE TABLE IF NOT EXISTS service_policy_audit (id TEXT PRIMARY KEY,policy_id TEXT NOT NULL,policy_domain TEXT NOT NULL,service_code TEXT NOT NULL,city_id TEXT NOT NULL,action TEXT NOT NULL,before_json TEXT,after_json TEXT NOT NULL,actor_id TEXT NOT NULL,reason TEXT NOT NULL,created_at INTEGER NOT NULL)"),\n    db.prepare("CREATE INDEX IF NOT EXISTS idx_service_policy_audit_domain ON service_policy_audit(policy_domain,created_at)"),\n  ]);\n  tablesEnsured.add(db);\n}\n'''
          new='''const tablesEnsured=new WeakSet<Db>();\nconst tablesEnsuring=new WeakMap<Db,Promise<void>>();\nasync function servicePolicySchemaReady(db:Db){\n  try{const rows=await db.prepare("SELECT name FROM sqlite_master WHERE name IN ('service_policy_configs','idx_service_policy_lookup','service_policy_audit','idx_service_policy_audit_domain')").all<Row>();return new Set(rows.results.map(row=>String(row.name))).size===4;}catch{return false;}\n}\nasync function ensureServicePolicyTablesUncached(db:Db){\n  if(await servicePolicySchemaReady(db))return;\n  await db.batch([\n    db.prepare("CREATE TABLE IF NOT EXISTS service_policy_configs (id TEXT PRIMARY KEY,policy_domain TEXT NOT NULL,service_code TEXT NOT NULL DEFAULT '*',city_id TEXT NOT NULL DEFAULT '*',config_json TEXT NOT NULL DEFAULT '{}',notes TEXT NOT NULL DEFAULT '',active INTEGER NOT NULL DEFAULT 1,version INTEGER NOT NULL DEFAULT 1,effective_from TEXT NOT NULL,effective_to TEXT,updated_by TEXT NOT NULL,updated_at INTEGER NOT NULL)"),\n    db.prepare("CREATE INDEX IF NOT EXISTS idx_service_policy_lookup ON service_policy_configs(policy_domain,service_code,city_id,active,effective_from,effective_to)"),\n    db.prepare("CREATE TABLE IF NOT EXISTS service_policy_audit (id TEXT PRIMARY KEY,policy_id TEXT NOT NULL,policy_domain TEXT NOT NULL,service_code TEXT NOT NULL,city_id TEXT NOT NULL,action TEXT NOT NULL,before_json TEXT,after_json TEXT NOT NULL,actor_id TEXT NOT NULL,reason TEXT NOT NULL,created_at INTEGER NOT NULL)"),\n    db.prepare("CREATE INDEX IF NOT EXISTS idx_service_policy_audit_domain ON service_policy_audit(policy_domain,created_at)"),\n  ]);\n}\nexport async function ensureServicePolicyTables(db:Db){\n  if(tablesEnsured.has(db))return;const running=tablesEnsuring.get(db);if(running)return running;\n  const pending=ensureServicePolicyTablesUncached(db).then(()=>{tablesEnsured.add(db);});tablesEnsuring.set(db,pending);\n  try{await pending;}finally{if(tablesEnsuring.get(db)===pending)tablesEnsuring.delete(db);}\n}\n'''
          assert old in s, 'service policy ensure not found'; s=s.replace(old,new,1)
          old='''export async function seedServicePolicyDefault(db:Db,domain:string,effectiveFrom="2026-08-01"){\n  const spec=registry.get(domain);\n  if(!spec)throw new Error(`Unknown policy domain ${domain}`);\n  await ensureServicePolicyTables(db);\n  await db.prepare("INSERT OR IGNORE INTO service_policy_configs (id,policy_domain,service_code,city_id,config_json,notes,active,version,effective_from,effective_to,updated_by,updated_at) VALUES (?,?,?,?,?,?,1,1,?,NULL,'founder_seed',?)")\n    .bind(`spolicy_${domain}_default`,domain,POLICY_ANY,POLICY_ANY,JSON.stringify(spec.defaults),`${spec.label} - platform default`,effectiveFrom,Date.now()).run();\n}\n'''
          new='''const defaultPolicySeedsReady=new WeakMap<Db,Set<string>>();\nexport async function seedServicePolicyDefault(db:Db,domain:string,effectiveFrom="2026-08-01"){\n  const spec=registry.get(domain);if(!spec)throw new Error(`Unknown policy domain ${domain}`);await ensureServicePolicyTables(db);\n  let ready=defaultPolicySeedsReady.get(db);if(!ready){ready=new Set();defaultPolicySeedsReady.set(db,ready);}if(ready.has(domain))return;\n  const existing=await db.prepare("SELECT id FROM service_policy_configs WHERE policy_domain=? AND service_code='*' AND city_id='*' LIMIT 1").bind(domain).first<Row>();\n  if(!existing)await db.prepare("INSERT OR IGNORE INTO service_policy_configs (id,policy_domain,service_code,city_id,config_json,notes,active,version,effective_from,effective_to,updated_by,updated_at) VALUES (?,?,?,?,?,?,1,1,?,NULL,'founder_seed',?)")\n    .bind(`spolicy_${domain}_default`,domain,POLICY_ANY,POLICY_ANY,JSON.stringify(spec.defaults),`${spec.label} - platform default`,effectiveFrom,Date.now()).run();\n  ready.add(domain);\n}\n'''
          assert old in s, 'service policy seed not found'; p.write_text(s.replace(old,new,1))

          # City launch governance: read existing schema/seed and reserve writes for cold or old DBs.
          p=Path('lib/city-governance.ts'); s=p.read_text()
          old='''export async function ensureCityLaunchTables(db:Db){await db.batch([\n  db.prepare("CREATE TABLE IF NOT EXISTS city_launch_configs (id TEXT PRIMARY KEY,city_code TEXT NOT NULL UNIQUE,city TEXT NOT NULL,state TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'Draft',centre TEXT NOT NULL DEFAULT '',radius_km REAL NOT NULL DEFAULT 15,pincodes TEXT NOT NULL DEFAULT '',gst_included INTEGER NOT NULL DEFAULT 1,services_json TEXT NOT NULL DEFAULT '{}',version INTEGER NOT NULL DEFAULT 1,updated_by TEXT NOT NULL,created_at INTEGER NOT NULL,updated_at INTEGER NOT NULL)"),\n  db.prepare("CREATE INDEX IF NOT EXISTS idx_city_launch_status ON city_launch_configs(status)"),\n  db.prepare("CREATE TABLE IF NOT EXISTS city_launch_config_audit (id TEXT PRIMARY KEY,city_config_id TEXT NOT NULL,city TEXT NOT NULL,action TEXT NOT NULL,before_json TEXT,after_json TEXT NOT NULL,actor_id TEXT NOT NULL,created_at INTEGER NOT NULL)"),\n]);}\n\nexport async function seedDefaultCityLaunchConfigs(db:Db){await ensureCityLaunchTables(db);const now=Date.now();\n  const services:Record<CityLaunchService,CityServicePrice>={Grooming:{enabled:true,price:1349},Training:{enabled:true,price:3500},Boarding:{enabled:true,price:899},"Pet Sitting":{enabled:true,price:699}};\n  const exactPincodes=BENGALURU_SUPPORTED_PINCODES.join(",");\n  await db.prepare("INSERT OR IGNORE INTO city_launch_configs (id,city_code,city,state,status,centre,radius_km,pincodes,gst_included,services_json,version,updated_by,created_at,updated_at) VALUES ('bengaluru','blr','Bengaluru','Karnataka','Live','12.9716, 77.5946',35,?,1,?,1,'founder_seed',?,?)").bind(exactPincodes,JSON.stringify(services),now,now).run();\n  // Correct the previous seed which advertised every pincode from 560001-560110 even though only\n  // explicitly mapped zones are fulfilment-ready. Never overwrite an operator-managed config.\n  await db.prepare("UPDATE city_launch_configs SET pincodes=?,version=version+1,updated_at=? WHERE id='bengaluru' AND updated_by='founder_seed' AND REPLACE(pincodes,'–','-')='560001-560110'").bind(exactPincodes,now).run();\n}\n'''
          new='''const cityLaunchTablesReady=new WeakSet<Db>();\nconst cityLaunchSeedReady=new WeakSet<Db>();\nexport async function ensureCityLaunchTables(db:Db){\n  if(cityLaunchTablesReady.has(db))return;\n  const rows=await db.prepare("SELECT name FROM sqlite_master WHERE name IN ('city_launch_configs','idx_city_launch_status','city_launch_config_audit')").all<Row>().catch(()=>({results:[] as Row[]}));\n  if(new Set(rows.results.map(row=>String(row.name))).size!==3)await db.batch([\n    db.prepare("CREATE TABLE IF NOT EXISTS city_launch_configs (id TEXT PRIMARY KEY,city_code TEXT NOT NULL UNIQUE,city TEXT NOT NULL,state TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'Draft',centre TEXT NOT NULL DEFAULT '',radius_km REAL NOT NULL DEFAULT 15,pincodes TEXT NOT NULL DEFAULT '',gst_included INTEGER NOT NULL DEFAULT 1,services_json TEXT NOT NULL DEFAULT '{}',version INTEGER NOT NULL DEFAULT 1,updated_by TEXT NOT NULL,created_at INTEGER NOT NULL,updated_at INTEGER NOT NULL)"),\n    db.prepare("CREATE INDEX IF NOT EXISTS idx_city_launch_status ON city_launch_configs(status)"),\n    db.prepare("CREATE TABLE IF NOT EXISTS city_launch_config_audit (id TEXT PRIMARY KEY,city_config_id TEXT NOT NULL,city TEXT NOT NULL,action TEXT NOT NULL,before_json TEXT,after_json TEXT NOT NULL,actor_id TEXT NOT NULL,created_at INTEGER NOT NULL)"),\n  ]);\n  cityLaunchTablesReady.add(db);\n}\n\nexport async function seedDefaultCityLaunchConfigs(db:Db){\n  if(cityLaunchSeedReady.has(db))return;await ensureCityLaunchTables(db);\n  const existing=await db.prepare("SELECT id,pincodes,updated_by FROM city_launch_configs WHERE id='bengaluru'").first<Row>();\n  const exactPincodes=BENGALURU_SUPPORTED_PINCODES.join(",");\n  if(!existing){const now=Date.now();const services:Record<CityLaunchService,CityServicePrice>={Grooming:{enabled:true,price:1349},Training:{enabled:true,price:3500},Boarding:{enabled:true,price:899},"Pet Sitting":{enabled:true,price:699}};await db.prepare("INSERT OR IGNORE INTO city_launch_configs (id,city_code,city,state,status,centre,radius_km,pincodes,gst_included,services_json,version,updated_by,created_at,updated_at) VALUES ('bengaluru','blr','Bengaluru','Karnataka','Live','12.9716, 77.5946',35,?,1,?,1,'founder_seed',?,?)").bind(exactPincodes,JSON.stringify(services),now,now).run();}\n  else if(String(existing.updated_by)==='founder_seed'&&String(existing.pincodes).replace('–','-')==='560001-560110'){const now=Date.now();await db.prepare("UPDATE city_launch_configs SET pincodes=?,version=version+1,updated_at=? WHERE id='bengaluru' AND updated_by='founder_seed' AND REPLACE(pincodes,'–','-')='560001-560110'").bind(exactPincodes,now).run();}\n  cityLaunchSeedReady.add(db);\n}\n'''
          assert old in s, 'city launch block not found'; p.write_text(s.replace(old,new,1))

          # Grooming commercial policy: no schema/seed writes when the default row is already present.
          p=Path('lib/grooming-policy-governance.ts'); s=p.read_text()
          old='''const groomingPolicyTablesEnsured=new WeakSet<Db>();\nexport async function ensureGroomingPolicyTables(db:Db){if(groomingPolicyTablesEnsured.has(db))return;await db.batch([\n  db.prepare("CREATE TABLE IF NOT EXISTS grooming_commercial_policies (id TEXT PRIMARY KEY,policy_code TEXT NOT NULL DEFAULT 'grooming-default',city_id TEXT NOT NULL,zone_id TEXT,enforcement_mode TEXT NOT NULL DEFAULT 'observe',cancellation_cutoff_minutes INTEGER NOT NULL DEFAULT 0,refund_percent_before_cutoff REAL NOT NULL DEFAULT 100,refund_percent_after_cutoff REAL NOT NULL DEFAULT 100,reschedule_cutoff_minutes INTEGER NOT NULL DEFAULT 0,reschedule_allowed_after_cutoff INTEGER NOT NULL DEFAULT 1,max_reschedules INTEGER NOT NULL DEFAULT 0,reschedule_fee_type TEXT NOT NULL DEFAULT 'none',reschedule_fee_value REAL NOT NULL DEFAULT 0,no_show_refund_percent REAL NOT NULL DEFAULT 0,multi_pet_max INTEGER NOT NULL DEFAULT 4,multi_pet_pricing_mode TEXT NOT NULL DEFAULT 'catalogue',change_lock_statuses_json TEXT NOT NULL DEFAULT '[\\"completed\\",\\"cancelled\\"]',active INTEGER NOT NULL DEFAULT 1,version INTEGER NOT NULL DEFAULT 1,effective_from TEXT NOT NULL,effective_to TEXT,updated_by TEXT NOT NULL,updated_at INTEGER NOT NULL)"),\n  db.prepare("CREATE INDEX IF NOT EXISTS idx_grooming_policy_lookup ON grooming_commercial_policies(city_id,zone_id,active,effective_from,effective_to)"),\n  db.prepare("CREATE TABLE IF NOT EXISTS grooming_commercial_policy_audit (id TEXT PRIMARY KEY,policy_id TEXT NOT NULL,policy_code TEXT NOT NULL,city_id TEXT NOT NULL,action TEXT NOT NULL,before_json TEXT,after_json TEXT NOT NULL,actor_id TEXT NOT NULL,reason TEXT NOT NULL,created_at INTEGER NOT NULL)"),\n]);groomingPolicyTablesEnsured.add(db);}\n\nconst groomingPolicySeeded=new WeakSet<Db>();\nexport async function seedDefaultGroomingPolicy(db:Db){if(groomingPolicySeeded.has(db))return;await ensureGroomingPolicyTables(db);const now=Date.now();groomingPolicySeeded.add(db);await db.prepare("INSERT OR IGNORE INTO grooming_commercial_policies (id,policy_code,city_id,zone_id,enforcement_mode,cancellation_cutoff_minutes,refund_percent_before_cutoff,refund_percent_after_cutoff,reschedule_cutoff_minutes,reschedule_allowed_after_cutoff,max_reschedules,reschedule_fee_type,reschedule_fee_value,no_show_refund_percent,multi_pet_max,multi_pet_pricing_mode,change_lock_statuses_json,active,version,effective_from,effective_to,updated_by,updated_at) VALUES ('gpolicy_blr_default','grooming-default','blr',NULL,'observe',0,100,100,0,1,0,'none',0,0,4,'catalogue','[\\"completed\\",\\"cancelled\\"]',1,1,'2026-08-01',NULL,'founder_seed',?)").bind(now).run();}\n'''
          new='''const groomingPolicyTablesEnsured=new WeakSet<Db>();\nexport async function ensureGroomingPolicyTables(db:Db){if(groomingPolicyTablesEnsured.has(db))return;const rows=await db.prepare("SELECT name FROM sqlite_master WHERE name IN ('grooming_commercial_policies','idx_grooming_policy_lookup','grooming_commercial_policy_audit')").all<Row>().catch(()=>({results:[] as Row[]}));if(new Set(rows.results.map(row=>String(row.name))).size!==3)await db.batch([\n  db.prepare("CREATE TABLE IF NOT EXISTS grooming_commercial_policies (id TEXT PRIMARY KEY,policy_code TEXT NOT NULL DEFAULT 'grooming-default',city_id TEXT NOT NULL,zone_id TEXT,enforcement_mode TEXT NOT NULL DEFAULT 'observe',cancellation_cutoff_minutes INTEGER NOT NULL DEFAULT 0,refund_percent_before_cutoff REAL NOT NULL DEFAULT 100,refund_percent_after_cutoff REAL NOT NULL DEFAULT 100,reschedule_cutoff_minutes INTEGER NOT NULL DEFAULT 0,reschedule_allowed_after_cutoff INTEGER NOT NULL DEFAULT 1,max_reschedules INTEGER NOT NULL DEFAULT 0,reschedule_fee_type TEXT NOT NULL DEFAULT 'none',reschedule_fee_value REAL NOT NULL DEFAULT 0,no_show_refund_percent REAL NOT NULL DEFAULT 0,multi_pet_max INTEGER NOT NULL DEFAULT 4,multi_pet_pricing_mode TEXT NOT NULL DEFAULT 'catalogue',change_lock_statuses_json TEXT NOT NULL DEFAULT '[\\"completed\\",\\"cancelled\\"]',active INTEGER NOT NULL DEFAULT 1,version INTEGER NOT NULL DEFAULT 1,effective_from TEXT NOT NULL,effective_to TEXT,updated_by TEXT NOT NULL,updated_at INTEGER NOT NULL)"),\n  db.prepare("CREATE INDEX IF NOT EXISTS idx_grooming_policy_lookup ON grooming_commercial_policies(city_id,zone_id,active,effective_from,effective_to)"),\n  db.prepare("CREATE TABLE IF NOT EXISTS grooming_commercial_policy_audit (id TEXT PRIMARY KEY,policy_id TEXT NOT NULL,policy_code TEXT NOT NULL,city_id TEXT NOT NULL,action TEXT NOT NULL,before_json TEXT,after_json TEXT NOT NULL,actor_id TEXT NOT NULL,reason TEXT NOT NULL,created_at INTEGER NOT NULL)"),\n]);groomingPolicyTablesEnsured.add(db);}\n\nconst groomingPolicySeeded=new WeakSet<Db>();\nexport async function seedDefaultGroomingPolicy(db:Db){if(groomingPolicySeeded.has(db))return;await ensureGroomingPolicyTables(db);const existing=await db.prepare("SELECT id FROM grooming_commercial_policies WHERE id='gpolicy_blr_default'").first<Row>();if(!existing)await db.prepare("INSERT OR IGNORE INTO grooming_commercial_policies (id,policy_code,city_id,zone_id,enforcement_mode,cancellation_cutoff_minutes,refund_percent_before_cutoff,refund_percent_after_cutoff,reschedule_cutoff_minutes,reschedule_allowed_after_cutoff,max_reschedules,reschedule_fee_type,reschedule_fee_value,no_show_refund_percent,multi_pet_max,multi_pet_pricing_mode,change_lock_statuses_json,active,version,effective_from,effective_to,updated_by,updated_at) VALUES ('gpolicy_blr_default','grooming-default','blr',NULL,'observe',0,100,100,0,1,0,'none',0,0,4,'catalogue','[\\"completed\\",\\"cancelled\\"]',1,1,'2026-08-01',NULL,'founder_seed',?)").bind(Date.now()).run();groomingPolicySeeded.add(db);}\n'''
          assert old in s, 'grooming policy block not found'; p.write_text(s.replace(old,new,1))

          # Pricing control: one schema-read and one seed-count read replace DDL + ~50 INSERT OR IGNORE writes.
          p=Path('lib/pricing-control-runtime.ts'); s=p.read_text()
          old='''export async function ensurePricingControlSchema(db:Db){if(pricingSchemaEnsured.has(db))return;await db.batch([\n  db.prepare("CREATE TABLE IF NOT EXISTS service_packages (id text PRIMARY KEY NOT NULL,service_code text NOT NULL,package_code text NOT NULL UNIQUE,name text NOT NULL,description text NOT NULL,base_price real NOT NULL,currency text DEFAULT 'INR' NOT NULL,tax_inclusive integer DEFAULT 1 NOT NULL,slot_minutes integer NOT NULL,blocking_minutes integer NOT NULL,active integer DEFAULT 1 NOT NULL,version integer DEFAULT 1 NOT NULL,effective_from text NOT NULL,effective_to text,updated_by text NOT NULL,updated_at integer NOT NULL)"),\n  db.prepare("CREATE TABLE IF NOT EXISTS dynamic_pricing_rules (id text PRIMARY KEY NOT NULL,name text NOT NULL,service_code text NOT NULL,package_code text,city_id text DEFAULT 'blr' NOT NULL,zone_id text,rule_type text NOT NULL,days_json text DEFAULT '[]' NOT NULL,start_time text,end_time text,effective_from text NOT NULL,effective_to text,adjustment_type text NOT NULL,adjustment_value real NOT NULL,coupon_policy text DEFAULT 'stackable' NOT NULL,priority integer DEFAULT 100 NOT NULL,status text DEFAULT 'draft' NOT NULL,version integer DEFAULT 1 NOT NULL,updated_by text NOT NULL,updated_at integer NOT NULL)"),\n  db.prepare("CREATE TABLE IF NOT EXISTS pricing_audit_events (id text PRIMARY KEY NOT NULL,entity_type text NOT NULL,entity_id text NOT NULL,action text NOT NULL,before_json text,after_json text NOT NULL,actor_id text NOT NULL,reason text NOT NULL,created_at integer NOT NULL)"),\n]);pricingSchemaEnsured.add(db);}\n\nexport async function seedCanonicalPricingPackages(db:Db){\n  if(pricingPackagesSeeded.has(db))return;\n  await ensurePricingControlSchema(db);const now=Date.now();\n  await db.batch(seeds.map(item=>db.prepare("INSERT OR IGNORE INTO service_packages (id,service_code,package_code,name,description,base_price,currency,tax_inclusive,slot_minutes,blocking_minutes,active,version,effective_from,effective_to,updated_by,updated_at) VALUES (?,?,?,?,?,?,'INR',1,?,?,0,1,'2026-08-01',NULL,'founder_seed',?)")\n    .bind(item.id,item.serviceCode,item.packageCode,item.name,item.description,item.basePrice,item.slotMinutes,item.blockingMinutes,now)));\n  pricingPackagesSeeded.add(db);\n}\n'''
          new='''export async function ensurePricingControlSchema(db:Db){if(pricingSchemaEnsured.has(db))return;const rows=await db.prepare("SELECT name FROM sqlite_master WHERE name IN ('service_packages','dynamic_pricing_rules','pricing_audit_events')").all<Record<string,unknown>>().catch(()=>({results:[] as Record<string,unknown>[]}));if(new Set(rows.results.map(row=>String(row.name))).size!==3)await db.batch([\n  db.prepare("CREATE TABLE IF NOT EXISTS service_packages (id text PRIMARY KEY NOT NULL,service_code text NOT NULL,package_code text NOT NULL UNIQUE,name text NOT NULL,description text NOT NULL,base_price real NOT NULL,currency text DEFAULT 'INR' NOT NULL,tax_inclusive integer DEFAULT 1 NOT NULL,slot_minutes integer NOT NULL,blocking_minutes integer NOT NULL,active integer DEFAULT 1 NOT NULL,version integer DEFAULT 1 NOT NULL,effective_from text NOT NULL,effective_to text,updated_by text NOT NULL,updated_at integer NOT NULL)"),\n  db.prepare("CREATE TABLE IF NOT EXISTS dynamic_pricing_rules (id text PRIMARY KEY NOT NULL,name text NOT NULL,service_code text NOT NULL,package_code text,city_id text DEFAULT 'blr' NOT NULL,zone_id text,rule_type text NOT NULL,days_json text DEFAULT '[]' NOT NULL,start_time text,end_time text,effective_from text NOT NULL,effective_to text,adjustment_type text NOT NULL,adjustment_value real NOT NULL,coupon_policy text DEFAULT 'stackable' NOT NULL,priority integer DEFAULT 100 NOT NULL,status text DEFAULT 'draft' NOT NULL,version integer DEFAULT 1 NOT NULL,updated_by text NOT NULL,updated_at integer NOT NULL)"),\n  db.prepare("CREATE TABLE IF NOT EXISTS pricing_audit_events (id text PRIMARY KEY NOT NULL,entity_type text NOT NULL,entity_id text NOT NULL,action text NOT NULL,before_json text,after_json text NOT NULL,actor_id text NOT NULL,reason text NOT NULL,created_at integer NOT NULL)"),\n]);pricingSchemaEnsured.add(db);}\n\nexport async function seedCanonicalPricingPackages(db:Db){\n  if(pricingPackagesSeeded.has(db))return;await ensurePricingControlSchema(db);\n  const ids=seeds.map(item=>item.id);const row=await db.prepare(`SELECT COUNT(*) n FROM service_packages WHERE id IN (${ids.map(()=>"?").join(",")})`).bind(...ids).first<Record<string,unknown>>();\n  if(Number(row?.n||0)!==seeds.length){const now=Date.now();await db.batch(seeds.map(item=>db.prepare("INSERT OR IGNORE INTO service_packages (id,service_code,package_code,name,description,base_price,currency,tax_inclusive,slot_minutes,blocking_minutes,active,version,effective_from,effective_to,updated_by,updated_at) VALUES (?,?,?,?,?,?,'INR',1,?,?,0,1,'2026-08-01',NULL,'founder_seed',?)").bind(item.id,item.serviceCode,item.packageCode,item.name,item.description,item.basePrice,item.slotMinutes,item.blockingMinutes,now)));}\n  pricingPackagesSeeded.add(db);\n}\n'''
          assert old in s, 'pricing runtime block not found'; p.write_text(s.replace(old,new,1))

          # Lead attribution: static table/column readiness is checked read-only before any repair DDL.
          p=Path('lib/lead-conversion-attribution.ts'); s=p.read_text()
          old='''export async function ensureLeadWorkItemsTable(db:Db){\n  if(leadWorkItemsEnsured.has(db))return;\n  await db.batch([\n    db.prepare("CREATE TABLE IF NOT EXISTS lead_work_items (id TEXT PRIMARY KEY, customer_id TEXT NOT NULL, source TEXT NOT NULL, service TEXT NOT NULL, owner TEXT NOT NULL, manager TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'active', stage TEXT NOT NULL DEFAULT 'day_1', work_day INTEGER NOT NULL DEFAULT 1, assigned_at INTEGER NOT NULL, first_action_due_at INTEGER NOT NULL, manager_alert_at INTEGER NOT NULL, first_action_at INTEGER, call_attempts INTEGER NOT NULL DEFAULT 0, whatsapp_attempts INTEGER NOT NULL DEFAULT 0, last_outcome TEXT, next_action_at INTEGER, recycle_at INTEGER, recycle_cycle INTEGER NOT NULL DEFAULT 0, opt_out INTEGER NOT NULL DEFAULT 0, converted_booking_id TEXT, created_at INTEGER NOT NULL, updated_at INTEGER NOT NULL)"),\n    db.prepare("CREATE INDEX IF NOT EXISTS idx_lead_work_items_customer ON lead_work_items(customer_id,status,assigned_at)"),\n  ]);\n  // initiated_booking_id records WHICH booking a lead was linked to before payment, so the later\n  // payment-capture conversion credits that exact lead. Without it, a customer with two open leads\n  // could have the wrong one marked converted (attribution went to whichever was newest).\n  // The table is created inline by several routes with a fixed column list, so migrate additively.\n  const columns=await db.prepare("PRAGMA table_info(lead_work_items)").all<Row>().catch(()=>({results:[] as Row[]}));\n  if(columns.results.length&&!columns.results.some(column=>String(column.name)==="initiated_booking_id")){\n    await db.prepare("ALTER TABLE lead_work_items ADD COLUMN initiated_booking_id TEXT").run().catch(()=>{});\n  }\n  /*\n   * The booking's ORIGIN, recorded once per booking. [PTJA-W3-LA]\n   *\n   * The approved rule says a booking with no matching lead credits nobody and is recorded as a direct\n   * booking - and that if the Identity Spine needs an originating record, it gets a clearly labelled\n   * system one rather than an unrelated marketing lead being modified. This is that record. PRIMARY KEY\n   * on booking_id, so a replayed hook cannot inflate either figure.\n   */\n  await db.prepare("CREATE TABLE IF NOT EXISTS booking_attribution (booking_id TEXT PRIMARY KEY,customer_id TEXT NOT NULL,service_code TEXT NOT NULL,attribution_type TEXT NOT NULL,lead_id TEXT,source TEXT NOT NULL DEFAULT 'system',detail_json TEXT NOT NULL DEFAULT '{}',recorded_at INTEGER NOT NULL)").run();\n  await db.prepare("CREATE INDEX IF NOT EXISTS idx_booking_attribution_type ON booking_attribution(attribution_type,recorded_at)").run().catch(()=>{});\n  leadWorkItemsEnsured.add(db);\n}\n'''
