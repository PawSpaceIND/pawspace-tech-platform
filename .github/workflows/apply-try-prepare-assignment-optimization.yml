name: Apply canonical D1 batching remediation

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/apply-try-prepare-assignment-optimization.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Apply canonical D1 batching remediation
        env:
          PATCH_A: ""
          PATCH_B: ""
        run: |
          printf '%s%s' "$PATCH_A" "$PATCH_B" | base64 -d | gzip -d > "$RUNNER_TEMP/canonical_patch.py"
          python3 "$RUNNER_TEMP/canonical_patch.py"
      - name: Validate canonical batching and invariants
        run: |
          node --experimental-strip-types --test tests/ptja-w2-b2-collection-ledger.test.mjs tests/ptja-w2-08-revenue-reconciliation.test.mjs tests/ptja-w3-lead-attribution.test.mjs tests/lead-engine-hardening.test.mjs tests/ptja-w1-f38-city-status-matrix.test.mjs tests/ptja-w3-waitlist-channel.test.mjs tests/ptja-p0-regressions.test.mjs tests/uat-scheduling-d1-contention.test.mjs tests/scheduling-reservation-leases.test.mjs tests/schema-declaration-consistency.test.mjs tests/uat-convergence-source-contract.test.mjs
          npm run typecheck
          npm run build
          git diff --check
          printf '%s\n' "$(git diff --name-only)"
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app/api/canonical-bookings/route.ts lib/collection-ledger.ts lib/finance-accounts.ts lib/grooming-policy-governance.ts lib/lead-conversion-attribution.ts tests/uat-scheduling-d1-contention.test.mjs "
      - name: Commit and push exact canonical remediation
        run: |
          git config user.name "PawSpace Release Bot"
          git config user.email "release-bot@pawspace.in"
          git commit -am "fix(canonical): batch ledger and verdict D1 transactions to resolve staging gate timeout"
          git push origin HEAD:fix/staging-performance-remediation
