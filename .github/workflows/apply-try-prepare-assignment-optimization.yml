name: Inspect staging reservation slot uniqueness

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/apply-try-prepare-assignment-optimization.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect duplicate exact active slots
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute pawspace-staging --remote --json --command "SELECT provider_id,scheduled_start,scheduled_end,COUNT(*) AS n FROM scheduling_reservations WHERE status!='cancelled' AND service_code!='boarding' AND care_mode IS NOT 'overnight' GROUP BY provider_id,scheduled_start,scheduled_end HAVING COUNT(*)>1 ORDER BY n DESC LIMIT 20;"
          npx wrangler d1 execute pawspace-staging --remote --json --command "SELECT name,sql FROM sqlite_master WHERE type='index' AND tbl_name='scheduling_reservations' ORDER BY name;"
