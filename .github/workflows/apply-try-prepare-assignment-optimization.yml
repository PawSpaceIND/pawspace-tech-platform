name: Instrument canonical booking write bottleneck

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/apply-try-prepare-assignment-optimization.yml

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Instrument canonical booking phases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/api/canonical-bookings/route.ts')
          s=p.read_text()
          marker='const json=(value:unknown,status=200)=>Response.json(value,{status,headers:{"cache-control":"no-store"}});'
          assert marker in s
          helper='''const json=(value:unknown,status=200)=>Response.json(value,{status,headers:{"cache-control":"no-store"}});\nconst BOOKING_TRACE_THRESHOLD_MS=50;\nfunction bookingTrace(stage:string,status:"start"|"complete"|"error",startedAt:number,context:Record<string,unknown>={},error?:unknown){const now=Date.now(),resolved=error instanceof Error?error:error===undefined?null:new Error(String(error));const record={event:"canonical_booking_stage",stage,status,durationMs:now-startedAt,...context,...(resolved?{errorName:resolved.name,errorMessage:resolved.message,stack:resolved.stack??null}:{})};const line=JSON.stringify(record);if(status==="error")console.error(line);else console.log(line);}\nasync function timedBookingStage<T>(stage:string,context:Record<string,unknown>,run:()=>Promise<T>,announce=false){const started=Date.now();if(announce)bookingTrace(stage,"start",started,context);try{const result=await run(),duration=Date.now()-started;if(announce||duration>=BOOKING_TRACE_THRESHOLD_MS)bookingTrace(stage,"complete",started,context);return result;}catch(error){bookingTrace(stage,"error",started,context,error);throw error;}}'''
          s=s.replace(marker,helper,1)

          old='export async function POST(request:Request){try{const db=await database();await ensureSchedulingReservationLeaseGovernance(db);await cleanupExpiredReservationLeases(db);const actor=await resolveActor(request);requirePermission(actor,"scheduling.book");const input=await request.json() as LifecycleInput;'
          new='''export async function POST(request:Request){const requestStarted=Date.now();let traceContext:Record<string,unknown>={};try{const db=await timedBookingStage("database",traceContext,()=>database());await timedBookingStage("lease_governance",traceContext,()=>ensureSchedulingReservationLeaseGovernance(db));await timedBookingStage("lease_cleanup",traceContext,()=>cleanupExpiredReservationLeases(db));const actor=await timedBookingStage("actor_resolution",traceContext,()=>resolveActor(request));requirePermission(actor,"scheduling.book");const input=await request.json() as LifecycleInput;traceContext={serviceCode:String(input.serviceCode||""),cityId:String(input.cityId||""),bookingKey:String(input.idempotencyKey||input.scheduleGroupId||"").slice(-24)};'''
          assert old in s
          s=s.replace(old,new,1)

          old='const problem=validate(input);if(problem)return json({error:problem},400);await ensureTables(db);await requireCustomerOwnership(db,actor,input.customer.id);const replayInput={customerId:input.customer.id,serviceCode:input.serviceCode,idempotencyKey:input.idempotencyKey,scheduleGroupId:input.scheduleGroupId};const prior=await findCustomerReplay(db,replayInput);if(prior)return json({data:await readBundle(db,prior,true)});if(await hasForeignReplayConflict(db,replayInput))return json({error:BOOKING_REPLAY_CONFLICT},409);'
          new='const problem=validate(input);if(problem)return json({error:problem},400);await timedBookingStage("canonical_schema",traceContext,()=>ensureTables(db),true);await timedBookingStage("customer_ownership",traceContext,()=>requireCustomerOwnership(db,actor,input.customer.id));const replayInput={customerId:input.customer.id,serviceCode:input.serviceCode,idempotencyKey:input.idempotencyKey,scheduleGroupId:input.scheduleGroupId};const prior=await timedBookingStage("replay_lookup",traceContext,()=>findCustomerReplay(db,replayInput));if(prior)return json({data:await readBundle(db,prior,true)});if(await timedBookingStage("foreign_replay_check",traceContext,()=>hasForeignReplayConflict(db,replayInput)))return json({error:BOOKING_REPLAY_CONFLICT},409);'
          assert old in s
          s=s.replace(old,new,1)

          old='const cityVerdict=await cityBookingVerdict(db,{cityId:input.cityId,serviceCode:input.serviceCode,pincode:(input as{pincode?:string}).pincode??null,channel:(input as{channel?:string}).channel??"customer_app"});'
          new='const cityVerdict=await timedBookingStage("city_booking_verdict",traceContext,()=>cityBookingVerdict(db,{cityId:input.cityId,serviceCode:input.serviceCode,pincode:(input as{pincode?:string}).pincode??null,channel:(input as{channel?:string}).channel??"customer_app"}));'
          assert old in s
          s=s.replace(old,new,1)
          old='if(!cityVerdict.allowed)return json({error:"PawSpace is not taking new bookings in this city right now",code:cityVerdict.reason,cityId:cityVerdict.cityId,cityStatus:cityVerdict.status,existingBookingsUnaffected:cityVerdict.existingWorkHandling==="continue"},409);if(await hasReplayConflict(db,replayInput))return json({error:BOOKING_WRITE_CONFLICT},409);'
          new='if(!cityVerdict.allowed)return json({error:"PawSpace is not taking new bookings in this city right now",code:cityVerdict.reason,cityId:cityVerdict.cityId,cityStatus:cityVerdict.status,existingBookingsUnaffected:cityVerdict.existingWorkHandling==="continue"},409);if(await timedBookingStage("replay_conflict_check",traceContext,()=>hasReplayConflict(db,replayInput)))return json({error:BOOKING_WRITE_CONFLICT},409);'
          assert old in s
          s=s.replace(old,new,1)

          old='const commercialPolicy=input.serviceCode==="grooming"?await resolveGroomingPolicy(db,input.cityId,input.zoneId):null;'
          new='const commercialPolicy=input.serviceCode==="grooming"?await timedBookingStage("grooming_policy",traceContext,()=>resolveGroomingPolicy(db,input.cityId,input.zoneId)):null;'
          assert old in s
          s=s.replace(old,new,1)
          old='    await ensureProviderBookingGuard(db);'
          new='    await timedBookingStage("provider_booking_guard",traceContext,()=>ensureProviderBookingGuard(db),true);'
          assert old in s
          s=s.replace(old,new,1)
          old='try{governed=await governGroomingBookingWithLiveMultiPet(db,{packageCode:input.packageCode,packageName:input.packageName,pets:input.pets.map(pet=>({species:(pet.species??"other") as "dog"|"cat"|"other"})),submittedTotal:governedGross-groomingAddOnTotal,submittedAmountDueNow:input.payment.mode==="prepaid"?governedGross-groomingAddOnTotal:0,paymentMode:input.payment.mode,cityId:input.cityId,zoneId:input.zoneId,scheduledStart:input.scheduledStart});}'
          new='try{governed=await timedBookingStage("grooming_governance",traceContext,()=>governGroomingBookingWithLiveMultiPet(db,{packageCode:input.packageCode,packageName:input.packageName,pets:input.pets.map(pet=>({species:(pet.species??"other") as "dog"|"cat"|"other"})),submittedTotal:governedGross-groomingAddOnTotal,submittedAmountDueNow:input.payment.mode==="prepaid"?governedGross-groomingAddOnTotal:0,paymentMode:input.payment.mode,cityId:input.cityId,zoneId:input.zoneId,scheduledStart:input.scheduledStart}));}'
          assert old in s
          s=s.replace(old,new,1)

          old='const assignment=await db.prepare("SELECT selected_provider_id,status,shortlist_json FROM scheduling_assignment_decisions WHERE group_id=?").bind(input.scheduleGroupId).first<Record<string,unknown>>();'
          new='const assignment=await timedBookingStage("assignment_read",traceContext,()=>db.prepare("SELECT selected_provider_id,status,shortlist_json FROM scheduling_assignment_decisions WHERE group_id=?").bind(input.scheduleGroupId).first<Record<string,unknown>>());'
          assert old in s
          s=s.replace(old,new,1)
          old='const reservations=await db.prepare("SELECT id,provider_id,customer_id,service_code,city_id,zone_id,scheduled_start,scheduled_end,occurrence_number,status FROM scheduling_reservations WHERE group_id=? AND status!=\'cancelled\' ORDER BY occurrence_number").bind(input.scheduleGroupId).all<Record<string,unknown>>();'
          new='const reservations=await timedBookingStage("reservation_read",traceContext,()=>db.prepare("SELECT id,provider_id,customer_id,service_code,city_id,zone_id,scheduled_start,scheduled_end,occurrence_number,status FROM scheduling_reservations WHERE group_id=? AND status!=\'cancelled\' ORDER BY occurrence_number").bind(input.scheduleGroupId).all<Record<string,unknown>>());'
          assert old in s
          s=s.replace(old,new,1)
          old='const unavailable=(await Promise.all(reservations.results.map(row=>providerUnavailableForWindow(db,{providerId:String(row.provider_id),scheduledStart:String(row.scheduled_start),scheduledEnd:String(row.scheduled_end)})))).some(Boolean);'
          new='const unavailable=(await timedBookingStage("provider_unavailability",traceContext,()=>Promise.all(reservations.results.map(row=>providerUnavailableForWindow(db,{providerId:String(row.provider_id),scheduledStart:String(row.scheduled_start),scheduledEnd:String(row.scheduled_end)})))).then(rows=>rows)).some(Boolean);'
          assert old in s
          s=s.replace(old,new,1)

          old='try{await db.batch(statements)}catch(error){'
          new='try{await timedBookingStage("atomic_booking_batch",traceContext,()=>db.batch(statements),true)}catch(error){'
          assert old in s
          s=s.replace(old,new,1)

          old='    await postCollectionEvent(db,{'
          new='    await timedBookingStage("collection_ledger",traceContext,()=>postCollectionEvent(db,{'
          assert old in s
          s=s.replace(old,new,1)
          old='    }).catch(error=>{console.warn("[collection-ledger] posting deferred",error instanceof Error?error.message:String(error));});'
          new='    }),true).catch(error=>{console.warn("[collection-ledger] posting deferred",error instanceof Error?error.message:String(error));});'
          assert old in s
          s=s.replace(old,new,1)

          old='await attributeBookingToOpenLead(db,{customerId:input.customer.id,bookingId});const booking=await db.prepare("SELECT * FROM canonical_bookings WHERE id=?").bind(bookingId).first<Record<string,unknown>>();return json({data:await readBundle(db,booking!,false)},201);'
          new='await timedBookingStage("lead_attribution",traceContext,()=>attributeBookingToOpenLead(db,{customerId:input.customer.id,bookingId}),true);const booking=await timedBookingStage("booking_readback",traceContext,()=>db.prepare("SELECT * FROM canonical_bookings WHERE id=?").bind(bookingId).first<Record<string,unknown>>());const responseData=await timedBookingStage("bundle_readback",traceContext,()=>readBundle(db,booking!,false));bookingTrace("request","complete",requestStarted,traceContext);return json({data:responseData},201);'
          assert old in s
          s=s.replace(old,new,1)
          old='}catch(error){if(error instanceof Response){const body=await governedRefusalBody(error);return json(body??{error:"Canonical booking validation failed"},error.status||409);}return json({error:error instanceof Error?error.message:"Unable to create shared booking lifecycle"},500);}}'
          new='}catch(error){if(error instanceof Response){const body=await governedRefusalBody(error);return json(body??{error:"Canonical booking validation failed"},error.status||409);}bookingTrace("request","error",requestStarted,traceContext,error);return json({error:error instanceof Error?error.message:"Unable to create shared booking lifecycle"},500);}}'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate instrumentation
        run: |
          node --experimental-strip-types --test tests/uat-scheduling-d1-contention.test.mjs tests/scheduling-reservation-leases.test.mjs
          npm run typecheck
          npm run build
          git diff --check
          test "$(git diff --name-only)" = "app/api/canonical-bookings/route.ts"
      - name: Commit instrumentation
        run: |
          git config user.name "PawSpace Release Bot"
          git config user.email "release-bot@pawspace.in"
          git add -u app/api/canonical-bookings/route.ts
          git commit -m "chore(bookings): instrument canonical booking write path to isolate 20s wall-time bottleneck"
          git push origin HEAD:fix/staging-performance-remediation
