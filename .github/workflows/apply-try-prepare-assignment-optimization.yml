name: Arm exact-SHA runtime capture

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/apply-try-prepare-assignment-optimization.yml

permissions:
  contents: write

jobs:
  arm-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - name: Pin instrumentation SHA and add Worker tail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/staging-write-contention-certify-v6.yml')
          s=p.read_text()
          s=s.replace('TARGET_SHA: 8e6cb14beeeb836f6f61cd34a73f2f2c3498bff1','TARGET_SHA: e1f028f1be6bd2570d6c0ceca7b27562f23cff5a')
          old='''      - name: Run hosted Track 3 workload
        env:
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          PERF_RUN_ID: remediation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p scripts/ops
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-performance-gate.mjs > scripts/ops/staging-performance-gate.mjs
          node scripts/ops/staging-performance-gate.mjs
'''
          new='''      - name: Run hosted Track 3 workload with Worker tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          PERF_RUN_ID: remediation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +e
          mkdir -p scripts/ops
          git show origin/ops/nontrack2-closure-20260901:scripts/ops/staging-performance-gate.mjs > scripts/ops/staging-performance-gate.mjs
          timeout 900s npx wrangler tail pawspace-staging --format json > worker-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 5
          node scripts/ops/staging-performance-gate.mjs
          STATUS=$?
          sleep 5
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          exit $STATUS
'''
          if old not in s: raise SystemExit('hosted gate block not found')
          s=s.replace(old,new,1)
          s=s.replace('            staging-performance-d1.json\n','            staging-performance-d1.json\n            worker-tail.log\n')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit capture workflow
        run: |
          git config user.name "PawSpace Release Bot"
          git config user.email "release-bot@pawspace.in"
          git add .github/workflows/staging-write-contention-certify-v6.yml
          git commit -m "ci: capture instrumented scheduling failure"
          git push origin HEAD:fix/staging-performance-remediation
