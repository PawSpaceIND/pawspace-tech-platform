name: Apply canonical booking schema contention fix

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/apply-try-prepare-assignment-optimization.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Eliminate repeated finance schema writes from booking hot path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          finance=Path('lib/finance-accounts.ts')
          s=finance.read_text()
          old='''export async function ensureFinanceJournalTable(db: Db) {\n  await db.prepare("CREATE TABLE IF NOT EXISTS finance_journal_entries (id text PRIMARY KEY NOT NULL,entry_date text NOT NULL,source_type text NOT NULL,source_id text NOT NULL,account_code text NOT NULL,cost_centre text,vertical text,debit real DEFAULT 0 NOT NULL,credit real DEFAULT 0 NOT NULL,narration text NOT NULL,period_code text NOT NULL,posted integer DEFAULT 0 NOT NULL,created_at integer NOT NULL)").run();\n  for (const [column, type] of COLLECTION_COLUMNS) {\n    await db.prepare(`ALTER TABLE finance_journal_entries ADD COLUMN ${column} ${type}`).run()\n      .catch((error: unknown) => { if (!/duplicate column name/i.test(error instanceof Error ? error.message : String(error))) throw error; });\n  }\n}\n'''
          new='''const FINANCE_JOURNAL_BASE_COLUMNS=["id","entry_date","source_type","source_id","account_code","debit","credit","narration","period_code","posted","created_at"] as const;\nconst financeJournalReady=new WeakSet<Db>();\nconst financeJournalEnsuring=new WeakMap<Db,Promise<void>>();\n\nasync function financeJournalSchemaReady(db:Db){\n  try{\n    const info=await db.prepare("PRAGMA table_info(finance_journal_entries)").all<Row>();\n    const names=new Set(info.results.map(row=>String(row.name??"")));\n    if(!names.size)return false;\n    return FINANCE_JOURNAL_BASE_COLUMNS.every(column=>names.has(column))&&COLLECTION_COLUMNS.every(([column])=>names.has(column));\n  }catch{return false;}\n}\n\nasync function ensureFinanceJournalTableUncached(db:Db){\n  // Steady-state requests must not replay schema writes. Under 100-way booking concurrency the old\n  // CREATE + fourteen ALTER attempts serialized D1 even though every column already existed, and\n  // postCollectionEvent called this path twice per request. A single read-only PRAGMA proves the\n  // deployed schema is complete; DDL is reserved for an actually missing/old schema.\n  if(await financeJournalSchemaReady(db))return;\n  await db.prepare("CREATE TABLE IF NOT EXISTS finance_journal_entries (id text PRIMARY KEY NOT NULL,entry_date text NOT NULL,source_type text NOT NULL,source_id text NOT NULL,account_code text NOT NULL,cost_centre text,vertical text,debit real DEFAULT 0 NOT NULL,credit real DEFAULT 0 NOT NULL,narration text NOT NULL,period_code text NOT NULL,posted integer DEFAULT 0 NOT NULL,created_at integer NOT NULL)").run();\n  for (const [column, type] of COLLECTION_COLUMNS) {\n    await db.prepare(`ALTER TABLE finance_journal_entries ADD COLUMN ${column} ${type}`).run()\n      .catch((error: unknown) => { if (!/duplicate column name/i.test(error instanceof Error ? error.message : String(error))) throw error; });\n  }\n}\n\nexport async function ensureFinanceJournalTable(db:Db){\n  if(financeJournalReady.has(db))return;\n  const inFlight=financeJournalEnsuring.get(db);\n  if(inFlight)return inFlight;\n  const work=ensureFinanceJournalTableUncached(db)\n    .then(()=>{financeJournalReady.add(db);})\n    .finally(()=>{financeJournalEnsuring.delete(db);});\n  financeJournalEnsuring.set(db,work);\n  return work;\n}\n'''
          assert old in s, 'finance ensure block not found'
          finance.write_text(s.replace(old,new,1))

          ledger=Path('lib/collection-ledger.ts')
          s=ledger.read_text()
          old='''const ledgerReady=new WeakSet<Db>();\nexport async function ensureCollectionLedgerTables(db:Db){\n  if(ledgerReady.has(db))return;\n  const{ensureFinanceJournalTable}=await import("./finance-accounts");\n  await ensureFinanceJournalTable(db);\n  await db.prepare("CREATE TABLE IF NOT EXISTS collection_ledger_postings (group_key TEXT PRIMARY KEY,event TEXT NOT NULL,payment_id TEXT,settlement_id TEXT,reversal_reference TEXT,amount REAL NOT NULL,period_code TEXT NOT NULL,manual_entry INTEGER NOT NULL DEFAULT 0,verification_status TEXT NOT NULL DEFAULT 'posted',verified_by TEXT,verified_at INTEGER,verification_reason TEXT,created_by TEXT NOT NULL,created_at INTEGER NOT NULL)").run();\n  await db.prepare("CREATE INDEX IF NOT EXISTS idx_collection_postings_period ON collection_ledger_postings(period_code,verification_status)").run();\n  ledgerReady.add(db);\n}\n'''
          new='''const ledgerReady=new WeakSet<Db>();\nconst ledgerEnsuring=new WeakMap<Db,Promise<void>>();\nasync function collectionLedgerSchemaReady(db:Db){\n  try{\n    const rows=await db.prepare("SELECT name FROM sqlite_master WHERE name IN ('collection_ledger_postings','idx_collection_postings_period')").all<Row>();\n    const names=new Set(rows.results.map(row=>text(row.name)));\n    return names.has("collection_ledger_postings")&&names.has("idx_collection_postings_period");\n  }catch{return false;}\n}\nasync function ensureCollectionLedgerTablesUncached(db:Db){\n  const{ensureFinanceJournalTable}=await import("./finance-accounts");\n  await ensureFinanceJournalTable(db);\n  // Avoid issuing idempotent DDL on every captured booking. The finance schema readiness check above\n  // and this sqlite_master probe are reads, so steady-state booking requests no longer contend on\n  // schema locks before posting their real journal rows.\n  if(await collectionLedgerSchemaReady(db))return;\n  await db.prepare("CREATE TABLE IF NOT EXISTS collection_ledger_postings (group_key TEXT PRIMARY KEY,event TEXT NOT NULL,payment_id TEXT,settlement_id TEXT,reversal_reference TEXT,amount REAL NOT NULL,period_code TEXT NOT NULL,manual_entry INTEGER NOT NULL DEFAULT 0,verification_status TEXT NOT NULL DEFAULT 'posted',verified_by TEXT,verified_at INTEGER,verification_reason TEXT,created_by TEXT NOT NULL,created_at INTEGER NOT NULL)").run();\n  await db.prepare("CREATE INDEX IF NOT EXISTS idx_collection_postings_period ON collection_ledger_postings(period_code,verification_status)").run();\n}\nexport async function ensureCollectionLedgerTables(db:Db){\n  if(ledgerReady.has(db))return;\n  const inFlight=ledgerEnsuring.get(db);\n  if(inFlight)return inFlight;\n  const work=ensureCollectionLedgerTablesUncached(db)\n    .then(()=>{ledgerReady.add(db);})\n    .finally(()=>{ledgerEnsuring.delete(db);});\n  ledgerEnsuring.set(db,work);\n  return work;\n}\n'''
          assert old in s, 'ledger ensure block not found'
          ledger.write_text(s.replace(old,new,1))
          PY
      - name: Validate financial and booking invariants
        run: |
          node --experimental-strip-types --test tests/ptja-w2-b2-collection-ledger.test.mjs tests/ptja-w2-08-revenue-reconciliation.test.mjs tests/uat-scheduling-d1-contention.test.mjs tests/scheduling-reservation-leases.test.mjs
          npm run typecheck
          npm run build
          git diff --check
          printf '%s\n' "$(git diff --name-only)"
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "lib/collection-ledger.ts lib/finance-accounts.ts "
      - name: Commit and push exact remediation
        run: |
          git config user.name "PawSpace Release Bot"
          git config user.email "release-bot@pawspace.in"
          git commit -am "fix(bookings): eliminate synchronous write contention in canonical booking phase"
          git push origin HEAD:fix/staging-performance-remediation
