name: Apply scheduling reservation contention remediation

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/apply-try-prepare-assignment-optimization.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Optimize reservation claim lane and cleanup marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          route=Path('app/api/uat-scheduling/route.ts')
          s=route.read_text()
          pattern=r'async function insertReservations\(.*?\nasync function operateAssignment'
          replacement=r'''const reservationClaimTails=new Map<string,Promise<void>>();
async function withReservationClaimLane<T>(key:string,work:()=>Promise<T>):Promise<T>{
  const predecessor=(reservationClaimTails.get(key)??Promise.resolve()).catch(()=>{});
  let release!:()=>void;
  const turn=new Promise<void>(resolve=>{release=()=>resolve();});
  const tail=predecessor.then(()=>turn);
  reservationClaimTails.set(key,tail);
  await predecessor;
  try{return await work();}
  finally{release();if(reservationClaimTails.get(key)===tail)reservationClaimTails.delete(key);}
}

async function insertReservations(db:Awaited<ReturnType<typeof database>>,groupId:string,input:RequestBody,decision:ScheduleDecision,lease:ReservationLease){
  if(!decision.provider)throw new Error("No eligible provider selected");
  const createdAt=Date.now(),attemptId=crypto.randomUUID();
  await assertProviderAssignable(db,decision.provider.id,createdAt);
  const overnight=input.serviceCode==="boarding"||(input.serviceCode==="pet_sitting"&&input.careMode==="overnight"),capacity=Number(decision.provider.capacity??1),units=input.petIds.length,bufferMs=(decision.provider.travelBufferMinutes??scheduleRules[input.serviceCode].bufferMinutes)*60_000,maxDailyJobs=Number(decision.provider.maxDailyJobs??6),offsetMinutes=cityOffsetMinutes(cityIdFor(input)),cityOffsetModifier=`+${offsetMinutes} minutes`,shift=(value:string,ms:number)=>new Date(new Date(value).getTime()+ms).toISOString(),bufferedEnd=(value:string)=>shift(value,bufferMs),bufferedStart=(value:string)=>shift(value,-bufferMs),localDayOf=(value:string)=>shift(value,offsetMinutes*60_000).slice(0,10);
  const statements=decision.occurrences.map(occ=>{
    const values=[`${groupId}_${decision.provider!.id}_${occ.occurrenceNumber}_${createdAt}`,groupId,decision.provider!.id,input.serviceCode,cityIdFor(input),input.zoneId,input.customerId,JSON.stringify(input.petIds),occ.start,occ.end,units,occ.occurrenceNumber,input.careMode??null,"assigned",JSON.stringify(decision.explanation),createdAt,lease.leaseExpiresAt,lease.customerSessionId,attemptId];
    if(overnight)return db.prepare(`INSERT INTO scheduling_reservations (${RESERVATION_COLUMNS}) SELECT ?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,? WHERE (SELECT COALESCE(SUM(capacity_units),0) FROM scheduling_reservations WHERE provider_id=? AND status!='cancelled' AND scheduled_start<? AND scheduled_end>?)+?<=? AND EXISTS (SELECT 1 FROM provider_capacity_profiles WHERE id=? AND live=1 AND status='active')`).bind(...values,decision.provider!.id,occ.end,occ.start,units,capacity,decision.provider!.id);
    return db.prepare(`INSERT INTO scheduling_reservations (${RESERVATION_COLUMNS}) SELECT ?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,? WHERE NOT EXISTS (SELECT 1 FROM scheduling_reservations WHERE provider_id=? AND status!='cancelled' AND scheduled_start<? AND scheduled_end>?) AND (SELECT COUNT(*) FROM scheduling_reservations WHERE provider_id=? AND status!='cancelled' AND substr(datetime(scheduled_start,?),1,10)=?)<? AND EXISTS (SELECT 1 FROM provider_capacity_profiles WHERE id=? AND live=1 AND status='active') ON CONFLICT(provider_id,scheduled_start,scheduled_end) WHERE status!='cancelled' AND service_code!='boarding' AND care_mode IS NOT 'overnight' DO NOTHING`).bind(...values,decision.provider!.id,bufferedEnd(occ.end),bufferedStart(occ.start),decision.provider!.id,cityOffsetModifier,localDayOf(occ.start),maxDailyJobs,decision.provider!.id);
  });
  const executeAtomicClaim=async()=>{
    // The scheduler plans from a read snapshot. Under concurrent requests another claim may land after
    // that snapshot but before this write. For the one-occurrence non-overnight hot path, serialize only
    // same-provider/day contenders inside this isolate and use one indexed read to reject a now-obvious
    // loser before it joins D1's single-writer queue. The INSERT ... SELECT below remains the authoritative
    // cross-isolate atomic check, so buffer, daily-capacity and provider-live invariants are unchanged.
    if(!overnight&&decision.occurrences.length===1){
      const occ=decision.occurrences[0]!,day=localDayOf(occ.start),dayStart=new Date(Date.parse(`${day}T00:00:00.000Z`)-offsetMinutes*60_000).toISOString(),dayEnd=new Date(new Date(dayStart).getTime()+86_400_000).toISOString();
      const state=await db.prepare("SELECT EXISTS(SELECT 1 FROM scheduling_reservations WHERE city_id=? AND provider_id=? AND status!='cancelled' AND scheduled_start<? AND scheduled_end>? LIMIT 1) overlap,(SELECT COUNT(*) FROM scheduling_reservations WHERE city_id=? AND provider_id=? AND status!='cancelled' AND scheduled_start>=? AND scheduled_start<?) daily_jobs")
        .bind(cityIdFor(input),decision.provider!.id,bufferedEnd(occ.end),bufferedStart(occ.start),cityIdFor(input),decision.provider!.id,dayStart,dayEnd)
        .first<{overlap:number;daily_jobs:number}>();
      if(Number(state?.overlap||0)>0||Number(state?.daily_jobs||0)>=maxDailyJobs)throw new SlotConflictError();
    }
    try{return statements.length===1?[await statements[0]!.run()]:await db.batch(statements);}
    catch(error){schedulingDiagnostic("reservation_claim",error,{groupId,providerId:decision.provider!.id,serviceCode:input.serviceCode,occurrences:decision.occurrences.length});throw error;}
  };
  const single=decision.occurrences.length===1&&!overnight,claimKey=single?`${decision.provider.id}|${localDayOf(decision.occurrences[0]!.start)}`:"";
  const results=single?await withReservationClaimLane(claimKey,executeAtomicClaim):await executeAtomicClaim();
  const inserted=results.reduce((sum,result)=>sum+Number(result?.meta?.changes||0),0);
  if(inserted!==decision.occurrences.length){if(inserted>0)await db.prepare("UPDATE scheduling_reservations SET status='cancelled' WHERE attempt_id=?").bind(attemptId).run();await assertProviderAssignable(db,decision.provider.id);throw new SlotConflictError();}
}
async function operateAssignment'''
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          assert n==1, f'insertReservations replacement count={n}'
          route.write_text(ns)

          leases=Path('lib/scheduling-reservation-leases.ts')
          s=leases.read_text()
          old='db.prepare(`INSERT OR REPLACE INTO scheduling_reservation_lease_cleanup (group_id,reason,released_at) SELECT DISTINCT r.group_id,?,? FROM scheduling_reservations r WHERE r.group_id IN (${placeholders}) AND r.status=\'assigned\' AND ${expiredLease} ${confirmedClause}`).bind(reason,now,...groupIds,now,now),'
          new='''// A cleanup batch owns a group by inserting its durable marker. OR IGNORE is deliberate:\n      // a concurrent cleaner must never replace the winner's released_at value and thereby make the\n      // winner's marker-guarded UPDATE statements miss. Because the marker and all guarded updates are\n      // in one D1 batch, the ownership insert cannot commit without its corresponding cleanup writes.\n      db.prepare(`INSERT OR IGNORE INTO scheduling_reservation_lease_cleanup (group_id,reason,released_at) SELECT DISTINCT r.group_id,?,? FROM scheduling_reservations r WHERE r.group_id IN (${placeholders}) AND r.status='assigned' AND ${expiredLease} ${confirmedClause}`).bind(reason,now,...groupIds,now,now),'''
          assert old in s, 'cleanup marker statement not found'
          leases.write_text(s.replace(old,new,1))

          tests=Path('tests/uat-scheduling-d1-contention.test.mjs')
          s=tests.read_text()
          addition='''\n\ntest("reservation claim filters obvious same-provider/day losers before the atomic write",()=>{\n  const scheduling=fs.readFileSync(new URL("../app/api/uat-scheduling/route.ts",import.meta.url),"utf8");\n  assert.match(scheduling,/reservationClaimTails=new Map<string,Promise<void>>/);\n  assert.match(scheduling,/withReservationClaimLane\(claimKey,executeAtomicClaim\)/);\n  assert.match(scheduling,/SELECT EXISTS\(SELECT 1 FROM scheduling_reservations[\\s\\S]*?daily_jobs/);\n  assert.match(scheduling,/ON CONFLICT\(provider_id,scheduled_start,scheduled_end\)/,"the optimistic read must not replace the authoritative atomic cross-isolate claim");\n});\n\ntest("lease cleanup never replaces a concurrent cleanup marker",()=>{\n  const leases=fs.readFileSync(new URL("../lib/scheduling-reservation-leases.ts",import.meta.url),"utf8");\n  assert.match(leases,/INSERT OR IGNORE INTO scheduling_reservation_lease_cleanup/);\n  assert.doesNotMatch(leases,/INSERT OR REPLACE INTO scheduling_reservation_lease_cleanup/);\n  assert.match(leases,/released_at=\\?/);\n});\n'''
          if 'reservation claim filters obvious same-provider/day losers before the atomic write' not in s:
              tests.write_text(s+addition)
          PY
      - name: Validate scheduling concurrency and lease invariants
        run: |
          node --experimental-strip-types --test tests/uat-scheduling-d1-contention.test.mjs tests/scheduling-reservation-leases.test.mjs tests/schema-declaration-consistency.test.mjs tests/uat-convergence-source-contract.test.mjs
          npm run typecheck
          npm run build
          git diff --check
          printf '%s\n' "$(git diff --name-only)"
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app/api/uat-scheduling/route.ts lib/scheduling-reservation-leases.ts tests/uat-scheduling-d1-contention.test.mjs "
      - name: Commit and push exact scheduling remediation
        run: |
          git config user.name "PawSpace Release Bot"
          git config user.email "release-bot@pawspace.in"
          git commit -am "fix(scheduling): optimize reservation-claim concurrency and eliminate cleanup race"
          git push origin HEAD:fix/staging-performance-remediation
