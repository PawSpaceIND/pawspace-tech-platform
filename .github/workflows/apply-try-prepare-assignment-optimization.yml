name: Remove scheduling hot-path schema storms

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/apply-try-prepare-assignment-optimization.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-performance-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Remove repeated schema and seed writes from scheduler hot path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Shared service-policy kernel: steady-state resolution becomes read-only.
          p=Path('lib/service-policy-governance.ts')
          s=p.read_text()
          old='''const tablesEnsured=new WeakSet<Db>();\nexport async function ensureServicePolicyTables(db:Db){\n  if(tablesEnsured.has(db))return;\n  await db.batch([\n    db.prepare("CREATE TABLE IF NOT EXISTS service_policy_configs (id TEXT PRIMARY KEY,policy_domain TEXT NOT NULL,service_code TEXT NOT NULL DEFAULT '*',city_id TEXT NOT NULL DEFAULT '*',config_json TEXT NOT NULL DEFAULT '{}',notes TEXT NOT NULL DEFAULT '',active INTEGER NOT NULL DEFAULT 1,version INTEGER NOT NULL DEFAULT 1,effective_from TEXT NOT NULL,effective_to TEXT,updated_by TEXT NOT NULL,updated_at INTEGER NOT NULL)"),\n    db.prepare("CREATE INDEX IF NOT EXISTS idx_service_policy_lookup ON service_policy_configs(policy_domain,service_code,city_id,active,effective_from,effective_to)"),\n    db.prepare("CREATE TABLE IF NOT EXISTS service_policy_audit (id TEXT PRIMARY KEY,policy_id TEXT NOT NULL,policy_domain TEXT NOT NULL,service_code TEXT NOT NULL,city_id TEXT NOT NULL,action TEXT NOT NULL,before_json TEXT,after_json TEXT NOT NULL,actor_id TEXT NOT NULL,reason TEXT NOT NULL,created_at INTEGER NOT NULL)"),\n    db.prepare("CREATE INDEX IF NOT EXISTS idx_service_policy_audit_domain ON service_policy_audit(policy_domain,created_at)"),\n  ]);\n  tablesEnsured.add(db);\n}\n'''
          new='''const tablesEnsured=new WeakSet<Db>();\nconst tablesEnsuring=new WeakMap<Db,Promise<void>>();\nasync function servicePolicySchemaReady(db:Db){\n  try{\n    const rows=await db.prepare("SELECT name FROM sqlite_master WHERE name IN ('service_policy_configs','idx_service_policy_lookup','service_policy_audit','idx_service_policy_audit_domain')").all<Row>();\n    return new Set(rows.results.map(row=>String(row.name))).size===4;\n  }catch{return false;}\n}\nasync function ensureServicePolicyTablesUncached(db:Db){\n  if(await servicePolicySchemaReady(db))return;\n  await db.batch([\n    db.prepare("CREATE TABLE IF NOT EXISTS service_policy_configs (id TEXT PRIMARY KEY,policy_domain TEXT NOT NULL,service_code TEXT NOT NULL DEFAULT '*',city_id TEXT NOT NULL DEFAULT '*',config_json TEXT NOT NULL DEFAULT '{}',notes TEXT NOT NULL DEFAULT '',active INTEGER NOT NULL DEFAULT 1,version INTEGER NOT NULL DEFAULT 1,effective_from TEXT NOT NULL,effective_to TEXT,updated_by TEXT NOT NULL,updated_at INTEGER NOT NULL)"),\n    db.prepare("CREATE INDEX IF NOT EXISTS idx_service_policy_lookup ON service_policy_configs(policy_domain,service_code,city_id,active,effective_from,effective_to)"),\n    db.prepare("CREATE TABLE IF NOT EXISTS service_policy_audit (id TEXT PRIMARY KEY,policy_id TEXT NOT NULL,policy_domain TEXT NOT NULL,service_code TEXT NOT NULL,city_id TEXT NOT NULL,action TEXT NOT NULL,before_json TEXT,after_json TEXT NOT NULL,actor_id TEXT NOT NULL,reason TEXT NOT NULL,created_at INTEGER NOT NULL)"),\n    db.prepare("CREATE INDEX IF NOT EXISTS idx_service_policy_audit_domain ON service_policy_audit(policy_domain,created_at)"),\n  ]);\n}\nexport async function ensureServicePolicyTables(db:Db){\n  if(tablesEnsured.has(db))return;\n  const running=tablesEnsuring.get(db);if(running)return running;\n  const pending=ensureServicePolicyTablesUncached(db).then(()=>{tablesEnsured.add(db);});\n  tablesEnsuring.set(db,pending);\n  try{await pending;}finally{if(tablesEnsuring.get(db)===pending)tablesEnsuring.delete(db);}\n}\n'''
          assert old in s, 'service policy ensure block not found'
          s=s.replace(old,new,1)

          old='''export async function seedServicePolicyDefault(db:Db,domain:string,effectiveFrom="2026-08-01"){\n  const spec=registry.get(domain);\n  if(!spec)throw new Error(`Unknown policy domain ${domain}`);\n  await ensureServicePolicyTables(db);\n  await db.prepare("INSERT OR IGNORE INTO service_policy_configs (id,policy_domain,service_code,city_id,config_json,notes,active,version,effective_from,effective_to,updated_by,updated_at) VALUES (?,?,?,?,?,?,1,1,?,NULL,'founder_seed',?)")\n    .bind(`spolicy_${domain}_default`,domain,POLICY_ANY,POLICY_ANY,JSON.stringify(spec.defaults),`${spec.label} - platform default`,effectiveFrom,Date.now()).run();\n}\n'''
          new='''const defaultSeedsReady=new WeakMap<Db,Set<string>>();\nconst defaultSeedsRunning=new WeakMap<Db,Map<string,Promise<void>>>();\nexport async function seedServicePolicyDefault(db:Db,domain:string,effectiveFrom="2026-08-01"){\n  const spec=registry.get(domain);\n  if(!spec)throw new Error(`Unknown policy domain ${domain}`);\n  await ensureServicePolicyTables(db);\n  let ready=defaultSeedsReady.get(db);if(!ready){ready=new Set();defaultSeedsReady.set(db,ready);}\n  if(ready.has(domain))return;\n  let running=defaultSeedsRunning.get(db);if(!running){running=new Map();defaultSeedsRunning.set(db,running);}\n  const existingRun=running.get(domain);if(existingRun)return existingRun;\n  const pending=(async()=>{\n    const existing=await db.prepare("SELECT id FROM service_policy_configs WHERE policy_domain=? AND service_code='*' AND city_id='*' LIMIT 1").bind(domain).first<Row>();\n    if(!existing)await db.prepare("INSERT OR IGNORE INTO service_policy_configs (id,policy_domain,service_code,city_id,config_json,notes,active,version,effective_from,effective_to,updated_by,updated_at) VALUES (?,?,?,?,?,?,1,1,?,NULL,'founder_seed',?)")\n      .bind(`spolicy_${domain}_default`,domain,POLICY_ANY,POLICY_ANY,JSON.stringify(spec.defaults),`${spec.label} - platform default`,effectiveFrom,Date.now()).run();\n    ready!.add(domain);\n  })();\n  running.set(domain,pending);\n  try{await pending;}finally{if(running.get(domain)===pending)running.delete(domain);}\n}\n'''
          assert old in s, 'service policy default seed block not found'
          s=s.replace(old,new,1)

          old='''  await ensureServicePolicyTables(db);\n  const service=normalise(serviceCode),city=normalise(cityId);\n  await db.prepare("INSERT OR IGNORE INTO service_policy_configs (id,policy_domain,service_code,city_id,config_json,notes,active,version,effective_from,effective_to,updated_by,updated_at) VALUES (?,?,?,?,?,?,1,1,?,NULL,'founder_seed',?)")\n    .bind(`spolicy_${domain}_${service}_${city}`.replace(/\\*/g,"any"),domain,service,city,JSON.stringify({...spec.defaults,...config}),notes,effectiveFrom,Date.now()).run();\n}\n'''
          new='''  await ensureServicePolicyTables(db);\n  const service=normalise(serviceCode),city=normalise(cityId);\n  const existing=await db.prepare("SELECT id FROM service_policy_configs WHERE policy_domain=? AND service_code=? AND city_id=? LIMIT 1").bind(domain,service,city).first<Row>();\n  if(existing)return;\n  await db.prepare("INSERT OR IGNORE INTO service_policy_configs (id,policy_domain,service_code,city_id,config_json,notes,active,version,effective_from,effective_to,updated_by,updated_at) VALUES (?,?,?,?,?,?,1,1,?,NULL,'founder_seed',?)")\n    .bind(`spolicy_${domain}_${service}_${city}`.replace(/\\*/g,"any"),domain,service,city,JSON.stringify({...spec.defaults,...config}),notes,effectiveFrom,Date.now()).run();\n}\n'''
          assert old in s, 'service policy scope seed block not found'
          p.write_text(s.replace(old,new,1))

          # 2) Booking time policy: one readiness read, not seven INSERT OR IGNORE writes per validation.
          p=Path('lib/booking-time-policy.ts')
          s=p.read_text()
          old='''export async function seedBookingTimePolicies(db:Db){\n  const{seedServicePolicyDefault,seedServicePolicyScope}=await import("./service-policy-governance");\n  await seedServicePolicyDefault(db,BOOKING_TIME_POLICY_DOMAIN);\n  for(const service of SCHEDULABLE_SERVICES){\n    await seedServicePolicyScope(db,BOOKING_TIME_POLICY_DOMAIN,service,"*",\n      {...APPROVED_BOOKING_TIME_DEFAULT,...APPROVED_BOOKING_TIME_BY_SERVICE[service]},\n      `Booking time rules - ${service}`);\n  }\n}\n'''
          new='''const bookingTimePoliciesReady=new WeakSet<Db>();\nconst bookingTimePoliciesRunning=new WeakMap<Db,Promise<void>>();\nexport async function seedBookingTimePolicies(db:Db){\n  if(bookingTimePoliciesReady.has(db))return;\n  const running=bookingTimePoliciesRunning.get(db);if(running)return running;\n  const pending=(async()=>{\n    const{ensureServicePolicyTables,seedServicePolicyDefault,seedServicePolicyScope}=await import("./service-policy-governance");\n    await ensureServicePolicyTables(db);\n    const scopes=["*",...SCHEDULABLE_SERVICES];\n    const rows=await db.prepare(`SELECT service_code FROM service_policy_configs WHERE policy_domain=? AND city_id='*' AND service_code IN (${scopes.map(()=>"?").join(",")})`).bind(BOOKING_TIME_POLICY_DOMAIN,...scopes).all<Record<string,unknown>>();\n    const present=new Set(rows.results.map(row=>String(row.service_code)));\n    if(scopes.every(scope=>present.has(scope)))return;\n    await seedServicePolicyDefault(db,BOOKING_TIME_POLICY_DOMAIN);\n    for(const service of SCHEDULABLE_SERVICES){\n      await seedServicePolicyScope(db,BOOKING_TIME_POLICY_DOMAIN,service,"*",\n        {...APPROVED_BOOKING_TIME_DEFAULT,...APPROVED_BOOKING_TIME_BY_SERVICE[service]},\n        `Booking time rules - ${service}`);\n    }\n  })().then(()=>{bookingTimePoliciesReady.add(db);});\n  bookingTimePoliciesRunning.set(db,pending);\n  try{await pending;}finally{if(bookingTimePoliciesRunning.get(db)===pending)bookingTimePoliciesRunning.delete(db);}\n}\n'''
          assert old in s, 'booking time seed block not found'
          p.write_text(s.replace(old,new,1))

          # 3) Provider home-base: no CREATE/INDEX on every shortlist read.
          p=Path('lib/provider-home-base.ts')
          s=p.read_text()
          old='''// Home-base reads are fanned out for the provider shortlist. The local D1 harness implements each\n// db.batch() as a real SQLite transaction, so concurrent currentHomeBase() calls must not each start\n// their own setup transaction on the same connection. Share one in-flight setup and run the idempotent\n// DDL statements directly; callers already execute against the active database connection.\nconst homeBaseTablesReady=new WeakMap<Db,Promise<void>>();\n\nexport async function ensureProviderHomeBaseTables(db:Db){\n let ready=homeBaseTablesReady.get(db);\n if(!ready){\n  ready=(async()=>{\n   await db.prepare("CREATE TABLE IF NOT EXISTS provider_home_base (id TEXT PRIMARY KEY,provider_id TEXT NOT NULL,address TEXT NOT NULL,latitude REAL NOT NULL,longitude REAL NOT NULL,effective_from INTEGER NOT NULL,effective_until INTEGER,reason TEXT NOT NULL,updated_by TEXT NOT NULL,created_at INTEGER NOT NULL)").run();\n   await db.prepare("CREATE INDEX IF NOT EXISTS idx_provider_home_base_provider ON provider_home_base(provider_id,effective_from)").run();\n  })();\n  homeBaseTablesReady.set(db,ready);\n }\n try{await ready;}catch(error){homeBaseTablesReady.delete(db);throw error;}\n}\n'''
          new='''// Shortlist reads are steady-state traffic. Prove the home-base schema with one read and reserve DDL\n// for a genuinely cold database; otherwise concurrent assignment requests serialize on no-op schema writes.\nconst homeBaseTablesReady=new WeakSet<Db>();\nconst homeBaseTablesRunning=new WeakMap<Db,Promise<void>>();\nasync function homeBaseSchemaReady(db:Db){\n try{const rows=await db.prepare("SELECT name FROM sqlite_master WHERE name IN ('provider_home_base','idx_provider_home_base_provider')").all<Row>();return new Set(rows.results.map(row=>String(row.name))).size===2;}catch{return false;}\n}\nexport async function ensureProviderHomeBaseTables(db:Db){\n if(homeBaseTablesReady.has(db))return;\n const running=homeBaseTablesRunning.get(db);if(running)return running;\n const pending=(async()=>{\n  if(await homeBaseSchemaReady(db))return;\n  await db.prepare("CREATE TABLE IF NOT EXISTS provider_home_base (id TEXT PRIMARY KEY,provider_id TEXT NOT NULL,address TEXT NOT NULL,latitude REAL NOT NULL,longitude REAL NOT NULL,effective_from INTEGER NOT NULL,effective_until INTEGER,reason TEXT NOT NULL,updated_by TEXT NOT NULL,created_at INTEGER NOT NULL)").run();\n  await db.prepare("CREATE INDEX IF NOT EXISTS idx_provider_home_base_provider ON provider_home_base(provider_id,effective_from)").run();\n })().then(()=>{homeBaseTablesReady.add(db);});\n homeBaseTablesRunning.set(db,pending);\n try{await pending;}finally{if(homeBaseTablesRunning.get(db)===pending)homeBaseTablesRunning.delete(db);}\n}\n'''
          assert old in s, 'home base ensure block not found'
          p.write_text(s.replace(old,new,1))

          # 4) Verification mandate: no DDL/ALTER storm during provider eligibility reads.
          p=Path('lib/provider-verification-mandate.ts')
          s=p.read_text()
          start=s.index('async function ensureVerificationMandateTablesUncached(db: Db) {')
          end=s.index('/** The statuses that mean a check is NOT currently satisfied.',start)
          old=s[start:end]
          new='''async function verificationMandateSchemaReady(db:Db){\n  try{\n    const schema=await db.prepare("SELECT name FROM sqlite_master WHERE name IN ('provider_category_verification_mandates','provider_verifications','idx_provider_verifications_app','provider_onboarding_applications','idx_provider_onboarding_provider_updated')").all<Row>();\n    const names=new Set(schema.results.map(row=>String(row.name)));\n    if(!names.has("provider_category_verification_mandates")||!names.has("provider_verifications")||!names.has("idx_provider_verifications_app"))return false;\n    const columns=await db.prepare("PRAGMA table_info(provider_verifications)").all<Row>();\n    if(!columns.results.some(row=>String(row.name)==="expires_at"))return false;\n    return !names.has("provider_onboarding_applications")||names.has("idx_provider_onboarding_provider_updated");\n  }catch{return false;}\n}\nasync function ensureVerificationMandateTablesUncached(db: Db) {\n  if(await verificationMandateSchemaReady(db))return;\n  await db.batch([\n    db.prepare("CREATE TABLE IF NOT EXISTS provider_category_verification_mandates (category TEXT NOT NULL,verification_type TEXT NOT NULL,required INTEGER NOT NULL DEFAULT 1,updated_by TEXT NOT NULL,updated_at INTEGER NOT NULL,PRIMARY KEY(category,verification_type))"),\n    db.prepare("CREATE TABLE IF NOT EXISTS provider_verifications (id TEXT PRIMARY KEY,application_id TEXT NOT NULL,category TEXT NOT NULL,verification_type TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'pending',automated INTEGER NOT NULL DEFAULT 0,provider_ref TEXT,detail_json TEXT NOT NULL DEFAULT '{}',updated_by TEXT NOT NULL,created_at INTEGER NOT NULL,updated_at INTEGER NOT NULL,UNIQUE(application_id,verification_type))"),\n    db.prepare("CREATE INDEX IF NOT EXISTS idx_provider_verifications_app ON provider_verifications(application_id)"),\n  ]);\n  await db.prepare("ALTER TABLE provider_verifications ADD COLUMN expires_at INTEGER").run()\n    .catch((error: unknown) => { if (!/duplicate column name/i.test(error instanceof Error ? error.message : String(error))) throw error; });\n  await db.prepare("CREATE INDEX IF NOT EXISTS idx_provider_onboarding_provider_updated ON provider_onboarding_applications(provider_id,updated_at DESC)").run().catch((error: unknown) => { if (!/no such table/i.test(error instanceof Error ? error.message : String(error))) throw error; });\n}\nconst verificationMandateTablesReady=new WeakSet<Db>();\nconst verificationMandateTablesRunning=new WeakMap<Db,Promise<void>>();\nexport async function ensureVerificationMandateTables(db: Db) {if(verificationMandateTablesReady.has(db))return;const running=verificationMandateTablesRunning.get(db);if(running)return running;const pending=ensureVerificationMandateTablesUncached(db).then(()=>{verificationMandateTablesReady.add(db);});verificationMandateTablesRunning.set(db,pending);try{await pending;}finally{if(verificationMandateTablesRunning.get(db)===pending)verificationMandateTablesRunning.delete(db);}}\n\n'''
          p.write_text(s[:start]+new+s[end:])

          # 5) Healthy scheduler schema already proves attempt_id via its required attempt index.
          p=Path('app/api/uat-scheduling/route.ts')
          s=p.read_text()
          old='''  if(!schemaDriftRepaired.has(db)){await repairSchemaDrift(db);schemaDriftRepaired.add(db);}\n'''
          new='''  if(!schemaReady&&!schemaDriftRepaired.has(db)){await repairSchemaDrift(db);schemaDriftRepaired.add(db);}\n'''
          assert old in s, 'schema drift hot-path guard not found'
          p.write_text(s.replace(old,new,1))

          # 6) Lease governance steady state: one object-read is sufficient when all guards/indexes exist.
          p=Path('lib/scheduling-reservation-leases.ts')
          s=p.read_text()
          old='''  const pending=(async()=>{\n    if(!(await tableExists(db,"scheduling_reservations")))return false;\n    const columns=await db.prepare("PRAGMA table_info(scheduling_reservations)").all<Row>();\n    const hasLease=columns.results.some(row=>String(row.name)==="lease_expires_at"),hasSession=columns.results.some(row=>String(row.name)==="customer_session_id");\n    const schema=await db.prepare("SELECT name FROM sqlite_master WHERE name IN ('idx_scheduling_reservations_lease','scheduling_reservation_lease_cleanup','booking_reservation_confirmation_guards','block_expired_reservation_booking')").all<Row>();\n    if(hasLease&&hasSession&&new Set(schema.results.map(row=>String(row.name))).size===4){leaseTablesEnsured.add(db);return true;}\n'''
          new='''  const pending=(async()=>{\n    const schema=await db.prepare("SELECT name FROM sqlite_master WHERE name IN ('scheduling_reservations','idx_scheduling_reservations_lease','scheduling_reservation_lease_cleanup','booking_reservation_confirmation_guards','block_expired_reservation_booking')").all<Row>();\n    const names=new Set(schema.results.map(row=>String(row.name)));\n    if(!names.has("scheduling_reservations"))return false;\n    if(names.has("idx_scheduling_reservations_lease")&&names.has("scheduling_reservation_lease_cleanup")&&names.has("booking_reservation_confirmation_guards")&&names.has("block_expired_reservation_booking")){leaseTablesEnsured.add(db);return true;}\n    const columns=await db.prepare("PRAGMA table_info(scheduling_reservations)").all<Row>();\n    const hasLease=columns.results.some(row=>String(row.name)==="lease_expires_at"),hasSession=columns.results.some(row=>String(row.name)==="customer_session_id");\n'''
          assert old in s, 'lease governance steady-state block not found'
          p.write_text(s.replace(old,new,1))

          # 7) Worker no longer runs a duplicate awaited cleanup before routes that already clean synchronously.
          p=Path('worker/index.ts')
          s=p.read_text()
          old='''      if(request.method==="POST"&&(url.pathname==="/api/uat-scheduling"||url.pathname==="/api/canonical-bookings"))await cleanupExpiredReservationLeases(env.DB);\n'''
          new='''      // Scheduling and canonical-booking routes perform their own synchronous lease cleanup before writing.\n      // Repeating it here serialized duplicate governance reads ahead of auth on every POST; the scheduled\n      // worker still runs the maintenance sweep independently.\n'''
          assert old in s, 'duplicate worker lease cleanup not found'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate scheduling, policy, verification and lease invariants
        run: |
          node --experimental-strip-types --test \
            tests/ptja-w3-booking-time-policy.test.mjs \
            tests/ptja-w1-f53-verification-expiry-gate.test.mjs \
            tests/uat-scheduling-d1-contention.test.mjs \
            tests/scheduling-reservation-leases.test.mjs \
            tests/schema-declaration-consistency.test.mjs \
            tests/uat-convergence-source-contract.test.mjs
          npm run typecheck
          npm run build
          git diff --check
          git diff --name-only | sort
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app/api/uat-scheduling/route.ts lib/booking-time-policy.ts lib/provider-home-base.ts lib/provider-verification-mandate.ts lib/scheduling-reservation-leases.ts lib/service-policy-governance.ts worker/index.ts "
      - name: Commit and push scheduling contention remediation
        run: |
          git config user.name "PawSpace Release Bot"
          git config user.email "release-bot@pawspace.in"
          git commit -am "perf(scheduling): remove schema writes from assignment hot path"
          git push origin HEAD:fix/staging-performance-remediation
