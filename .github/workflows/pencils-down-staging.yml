name: Pencils-down isolated frontend (ab40dc00)

on:
  push:
    branches: [ops/pencils-down-staging-ab40dc00]
    paths:
      - .github/workflows/pencils-down-staging.yml
      - ops/pencils-down/**
  workflow_dispatch: {}

permissions:
  contents: read
concurrency:
  group: pawspace-pencils-down-ab40dc00
  cancel-in-progress: false

jobs:
  staging:
    if: github.repository == 'PawSpaceIND/pawspace-tech-platform' && github.ref == 'refs/heads/ops/pencils-down-staging-ab40dc00'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pawspace-release-preview
    env:
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
      FORBID_PRODUCTION: 'true'
      APP_ENV: staging
      CI: 'true'
    steps:
      - name: Checkout deployment tools only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: infra
          persist-credentials: false
      - name: Checkout frozen product without local changes
        uses: actions/checkout@v4
        with:
          ref: ab40dc009471e0fdac41b07034aaef18784f0a02
          path: candidate
          persist-credentials: false
      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # These keys belong ONLY to the newly created test Worker. Do not rotate or
      # reuse any existing environment's signing keys. The human UAT access code
      # remains the existing approved access code. No key is passed to npm/build.
      - name: Generate distinct private signing keys for the new test Worker
        id: test_keys
        run: |
          python - <<'PY'
          import os, secrets
          signing = secrets.token_hex(32)
          identity = secrets.token_hex(32)
          assert signing != identity
          for name, value in [('signing', signing), ('identity', identity)]:
              print('::add-mask::' + value)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(name + '=' + value + '\n')
          print('Two independent test signing keys generated and masked; no existing secret changed.')
          PY
      - name: Check test credentials and unused namespace without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ steps.test_keys.outputs.signing }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ steps.test_keys.outputs.identity }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
        run: python infra/ops/pencils-down/deploy_frozen.py preflight
      - name: Install frozen dependencies (no deployment secrets)
        working-directory: candidate
        run: npm run install:ci
      - name: Build exact frozen product
        working-directory: candidate
        run: npm run build
      - name: Deploy only the dedicated test frontend and verify active bindings
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ steps.test_keys.outputs.signing }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ steps.test_keys.outputs.identity }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
        run: python infra/ops/pencils-down/deploy_frozen.py deploy
      - name: Install browser for one customer-shell smoke
        working-directory: candidate
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Read-only customer-shell browser smoke (no orders or external calls)
        run: node infra/ops/pencils-down/frontend-smoke.cjs
      - name: Upload sanitized deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pencils-down-staging-evidence
          path: pencils-down-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Test URL and remaining gates
        if: ${{ success() }}
        run: |
          echo "Test frontend: ${{ steps.deploy.outputs.origin }}"
          echo "Product: ab40dc009471e0fdac41b07034aaef18784f0a02"
          echo "Test/UAT only. Production activation requires approval after human testing."
          echo "Hosted checkout, authenticated booking and device checks remain NOT RUN."
