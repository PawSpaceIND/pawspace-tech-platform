name: Wire Grooming customer booking ownership

on:
  push:
    branches:
      - grooming-integration-closure
    paths:
      - .github/workflows/grooming-customer-identity-patch.yml

permissions:
  contents: write

# Retry after permanent regression was aligned to exact provider ownership.
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Enforce customer ownership on canonical booking creation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app/api/canonical-bookings/route.ts')
          text=path.read_text()
          anchor='import {governGroomingBooking,subscriptionExpiry} from "../../../lib/grooming-governance";\n'
          extra='import {requireCustomerOwnership,resolveActor} from "../../../lib/server-auth";\n'
          if extra not in text:
              if anchor not in text: raise SystemExit('canonical import anchor missing')
              text=text.replace(anchor,anchor+extra,1)
          old='export async function POST(request:Request){try{const input=await request.json() as LifecycleInput;const problem=validate(input);if(problem)return json({error:problem},400);const db=await database();await ensureTables(db);const prior=await db.prepare("SELECT * FROM canonical_bookings WHERE idempotency_key=? OR schedule_group_id=?").bind(input.idempotencyKey,input.scheduleGroupId).first<Record<string,unknown>>();'
          new='export async function POST(request:Request){try{const input=await request.json() as LifecycleInput;const problem=validate(input);if(problem)return json({error:problem},400);const db=await database();await ensureTables(db);const actor=await resolveActor(request);await requireCustomerOwnership(db,actor,input.customer.id);const prior=await db.prepare("SELECT * FROM canonical_bookings WHERE idempotency_key=? OR schedule_group_id=?").bind(input.idempotencyKey,input.scheduleGroupId).first<Record<string,unknown>>();'
          if old not in text: raise SystemExit('canonical POST anchor missing')
          text=text.replace(old,new,1)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit verified customer ownership wiring
        run: |
          git config user.name "PawSpace Closure Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/canonical-bookings/route.ts
          git commit -m "Enforce customer ownership on canonical booking creation [skip ci]"
          git pull --rebase origin grooming-integration-closure
          git push origin HEAD:grooming-integration-closure
