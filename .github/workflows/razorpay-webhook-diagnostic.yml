name: Razorpay webhook diagnostic

on:
  push:
    branches:
      - uat/razorpay-webhook-diagnostic-20260911

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
      RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
      PAYMENT_ID: pay_TaZx544X5XCXbx
      ORDER_ID: order_TaZwvGwxOSRPHg
    steps:
      - uses: actions/checkout@v4
      - name: Query stable staging webhook inbox read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_D1_ID"
          echo '--- payment_gateway_events ---'
          npx --yes wrangler@4.92.0 d1 execute "$STAGING_D1_ID" --remote --json --command "SELECT event_type,processing_status,signature_verified,gateway_payment_id,gateway_order_id FROM payment_gateway_events WHERE gateway_payment_id='$PAYMENT_ID' OR gateway_order_id='$ORDER_ID' ORDER BY received_at DESC LIMIT 20;"
          echo '--- gateway_webhook_events ---'
          npx --yes wrangler@4.92.0 d1 execute "$STAGING_D1_ID" --remote --json --command "SELECT event_type,processing_status,failure_reason,event_id FROM gateway_webhook_events WHERE raw_payload LIKE '%' || '$PAYMENT_ID' || '%' OR raw_payload LIKE '%' || '$ORDER_ID' || '%' ORDER BY received_at DESC LIMIT 20;"
      - name: Inspect Razorpay Test webhook inventory when provider API supports it
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const key = process.env.RAZORPAY_KEY_ID_SANDBOX || '';
          const secret = process.env.RAZORPAY_KEY_SECRET_SANDBOX || '';
          if (!key || !secret) throw new Error('Razorpay sandbox credentials missing');
          const auth = Buffer.from(`${key}:${secret}`).toString('base64');
          const response = await fetch('https://api.razorpay.com/v1/webhooks', {
            headers: { authorization: `Basic ${auth}` },
            redirect: 'error',
            signal: AbortSignal.timeout(15000),
          });
          console.log(`RAZORPAY_WEBHOOK_API_STATUS=${response.status}`);
          const text = await response.text();
          if (!response.ok) {
            console.log(`RAZORPAY_WEBHOOK_API_SUPPORTED=false`);
            process.exit(0);
          }
          let body;
          try { body = JSON.parse(text); } catch { body = {}; }
          const items = Array.isArray(body.items) ? body.items : Array.isArray(body) ? body : [];
          const safe = items.map(item => ({
            id: item.id || null,
            active: item.active ?? item.status ?? null,
            host: (() => { try { return new URL(item.url || '').host; } catch { return null; } })(),
            path: (() => { try { return new URL(item.url || '').pathname; } catch { return null; } })(),
            events: Array.isArray(item.events) ? item.events : item.events ? Object.keys(item.events).filter(k => item.events[k]) : [],
          }));
          console.log(`RAZORPAY_WEBHOOK_API_SUPPORTED=true`);
          console.log(JSON.stringify(safe));
          NODE
