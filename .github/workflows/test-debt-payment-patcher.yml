name: Test debt payment patcher

on:
  push:
    branches:
      - fix/inherited-test-debt-baseline

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ci): apply isolated payment test-debt patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inherited-test-debt-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Apply test-only payment baseline corrections
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replaceExact(file, from, to) {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(from)) throw new Error(`expected text not found in ${file}: ${from.slice(0,120)}`);
            text = text.replace(from, to);
            fs.writeFileSync(file, text);
          }

          replaceExact(
            'tests/money-hardening.test.mjs',
            'function freshDb(env = { RAZORPAY_WEBHOOK_SECRET_SANDBOX: "uat-test-secret" }) {',
            'function freshDb(env = { PAWSPACE_PAYMENT_ENV: "sandbox", RAZORPAY_WEBHOOK_SECRET_SANDBOX: "uat-test-secret" }) {'
          );
          replaceExact(
            'tests/money-hardening.test.mjs',
            '  freshDb({}); baseTables();',
            '  freshDb({ PAWSPACE_PAYMENT_ENV: "sandbox" }); baseTables();'
          );

          replaceExact(
            'tests/ptja-p1-regressions.test.mjs',
            '  const { sqlite, db } = world({ RAZORPAY_WEBHOOK_SECRET_SANDBOX: SECRET });',
            '  const { sqlite, db } = world({ PAWSPACE_PAYMENT_ENV: "sandbox", RAZORPAY_WEBHOOK_SECRET_SANDBOX: SECRET });'
          );
          {
            const file = 'tests/ptja-p1-regressions.test.mjs';
            let text = fs.readFileSync(file, 'utf8');
            const start = 'test("W2-PAY-07: the credential default documented as the rollback is unchanged", async () => {';
            const startIndex = text.indexOf(start);
            if (startIndex < 0) throw new Error('W2-PAY-07 stale credential-default test not found');
            const endIndex = text.indexOf('\n});', startIndex);
            if (endIndex < 0) throw new Error('W2-PAY-07 test terminator not found');
            const replacement = `test("W2-PAY-07: the strict payment boundary rejects undeclared or malformed environments", async () => {
  const client = await import("../lib/razorpay-client.ts");
  const gate = await import("../lib/payment-webhook-gate.ts");
  const environment = await import("../lib/payment-environment.ts");
  assert.throws(() => client.paymentEnvironment({}), /PAWSPACE_PAYMENT_ENV must be exactly/,
    "an undeclared environment fails closed instead of selecting credentials");
  assert.equal(client.paymentEnvironment({ PAWSPACE_PAYMENT_ENV: "sandbox" }), "sandbox");
  assert.equal(client.paymentEnvironment({ PAWSPACE_PAYMENT_ENV: "live" }), "live");
  assert.throws(() => gate.paymentMode({}), /PAWSPACE_PAYMENT_ENV must be exactly/,
    "webhook secret selection uses the same strict parser");
  assert.equal(environment.sandboxCapabilitiesUnlocked({}), false);
  assert.equal(environment.sandboxCapabilitiesUnlocked({ PAWSPACE_PAYMENT_ENV: "sandbox" }), true);
  assert.equal(environment.sandboxCapabilitiesUnlocked({ PAWSPACE_PAYMENT_ENV: "  SANDBOX " }), false,
    "whitespace/case aliases do not unlock sandbox capabilities");
  assert.equal(environment.sandboxCapabilitiesUnlocked({ PAWSPACE_PAYMENT_ENV: "" }), false);
});`;
            text = text.slice(0, startIndex) + replacement + text.slice(endIndex + 4);
            fs.writeFileSync(file, text);
          }

          replaceExact(
            'tests/payment-provider-contract.test.mjs',
            'const live = await client.createPaymentOrder({ ...environment(server.url), PAWSPACE_PAYMENT_ENV: "live", RAZORPAY_KEY_ID: "rzp_live_never_contacted", RAZORPAY_KEY_SECRET: "never-contacted" },',
            'const live = await client.createPaymentOrder({ ...environment(server.url), PAWSPACE_PAYMENT_ENV: "live", PAWSPACE_PAYMENT_LIVE_APPROVED: "true", RAZORPAY_KEY_ID: "rzp_live_never_contacted", RAZORPAY_KEY_SECRET: "never-contacted" },'
          );

          replaceExact(
            'tests/post-service-payment-link.test.mjs',
            '  installFinancialLifecycleSchema(sqlite);',
            '  sqlite.exec("ALTER TABLE booking_payments ADD COLUMN method TEXT NOT NULL DEFAULT \'upi\'");\n  installFinancialLifecycleSchema(sqlite);'
          );

          replaceExact(
            'tests/staging-activation.test.mjs',
            '  assert.match(gate, /if \\(!isTrue\\(env\\?\\.PAWSPACE_PAYMENT_LIVE_APPROVED\\)\\) return \\{ ok: false/);',
            '  assert.match(gate, /const liveApproved = \\(env: Env\\) => env\\?\\.PAWSPACE_PAYMENT_LIVE_APPROVED === "true"/);\n  assert.match(gate, /if \\(!liveApproved\\(env\\)\\) return \\{ ok: false/);'
          );

          replaceExact(
            'tests/whatsapp-template-lifecycle-execution.test.mjs',
            '  assert.match(page, /Approve verified/);\n  assert.match(page, /Reject verified/);',
            '  assert.match(page, /Verify with Meta/);\n  assert.match(page, /There is no manual approve\\/reject control/);'
          );
          NODE
      - name: Verify targeted payment and template suites
        run: >-
          PAWSPACE_LOCAL_PREVIEW=on PAWSPACE_VOICE_TRANSPORT=local_simulator_non_production NODE_ENV=test
          node --experimental-strip-types --test --test-concurrency=1
          tests/money-hardening.test.mjs
          tests/ptja-p1-regressions.test.mjs
          tests/payment-provider-contract.test.mjs
          tests/post-service-payment-link.test.mjs
          tests/staging-activation.test.mjs
          tests/whatsapp-template-lifecycle-execution.test.mjs
      - name: Commit verified test-only patch and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/test-debt-payment-patcher.yml
          git config user.name 'PawSpaceIND'
          git config user.email 'karthik@pawspace.in'
          git add tests
          git diff --cached --name-only | grep -Ev '^(tests/)' && { echo 'Non-test path staged'; exit 1; } || true
          git commit -m 'fix(tests): resolve payment webhook verification test debt'
          git push origin HEAD:fix/inherited-test-debt-baseline
