name: Verify Track 3 run 33725580590 invariants

on:
  push:
    branches:
      - fix/staging-performance-remediation
    paths:
      - .github/workflows/staging-track3-invariants-33725580590.yml

permissions:
  contents: read

concurrency:
  group: staging-track3-invariants-33725580590
  cancel-in-progress: false

env:
  TARGET_SHA: 96422d8728fea9c88fb014a5b29519df08bc99e4
  PERF_RUN_ID: remediation-33725580590-1

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact application SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git log -1 --pretty=%s | grep -Fx "perf(staging): coalesce concurrent finance and actor reads"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm run install:ci
      - run: npm run build

      - name: Configure isolated staging binding
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
        run: node scripts/stage-config.mjs

      - name: Verify staging-only D1 binding
        env:
          STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('dist/server/wrangler.json','utf8'));
          const binding=(config.d1_databases||[]).find(x=>x.binding==='DB');
          const vars=config.vars||{};
          const evidence={name:config.name,databaseId:binding?.database_id,deploymentEnv:vars.PAWSPACE_DEPLOYMENT_ENV,schedulingEnv:vars.PAWSPACE_SCHEDULING_ENV,paymentEnv:vars.PAWSPACE_PAYMENT_ENV,communicationEnv:vars.PAWSPACE_COMMUNICATION_ENV,targetSha:process.env.TARGET_SHA,runId:process.env.PERF_RUN_ID};
          fs.writeFileSync('staging-invariant-isolation.json',JSON.stringify(evidence,null,2));
          console.log(JSON.stringify(evidence,null,2));
          if(config.name!=='pawspace-staging'||binding?.database_id!==process.env.STAGING_D1_ID||vars.PAWSPACE_DEPLOYMENT_ENV!=='staging'||vars.PAWSPACE_SCHEDULING_ENV!=='uat'||vars.PAWSPACE_PAYMENT_ENV!=='sandbox'||vars.PAWSPACE_COMMUNICATION_ENV!=='uat') process.exit(1);
          NODE

      - name: Run strict read-only D1 invariants and ledger drift check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RUN_ID="$PERF_RUN_ID"
          SQL="SELECT (SELECT COUNT(*) FROM canonical_bookings WHERE idempotency_key LIKE '${RUN_ID}:booking:%') bookings,(SELECT COUNT(*) FROM booking_payments WHERE booking_id IN (SELECT id FROM canonical_bookings WHERE idempotency_key LIKE '${RUN_ID}:booking:%')) payments,(SELECT COUNT(*) FROM scheduling_assignment_decisions WHERE group_id LIKE '${RUN_ID}:grp:%') assignments,(SELECT COUNT(*) FROM payment_gateway_events WHERE event_id='${RUN_ID}:evt:replay') webhook_events,(SELECT ROUND(COALESCE(SUM(debit),0)-COALESCE(SUM(credit),0),2) FROM finance_journal_entries) ledger_drift,(SELECT COUNT(*) FROM scheduling_reservations WHERE group_id LIKE '${RUN_ID}:grp:%' AND status='cancelled') cancellations;"
          npx wrangler d1 execute DB --config dist/server/wrangler.json --remote --yes --json --command "$SQL" > staging-performance-d1.json
          cat staging-performance-d1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('staging-performance-d1.json','utf8'));
          const row=(Array.isArray(raw)?raw[0]:raw)?.results?.[0]||{};
          const n=k=>Number(row[k]??NaN);
          console.log(JSON.stringify(row,null,2));
          if(n('bookings')!==100||n('payments')!==100||n('assignments')!==100||n('webhook_events')!==1||Math.abs(n('ledger_drift'))>0.000001||n('cancellations')!==0) process.exit(1);
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-track3-invariants-33725580590
          path: |
            staging-invariant-isolation.json
            staging-performance-d1.json
          if-no-files-found: warn
