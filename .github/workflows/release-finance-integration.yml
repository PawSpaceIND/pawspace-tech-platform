name: Release Finance Integration

on:
  push:
    branches:
      - integration/release-v1.0.0-beta-finance-closure
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-finance-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-and-certify:
    if: ${{ !contains(github.event.head_commit.message, '[release-finance-integrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: test
      APP_ENV: staging
      PAWSPACE_LOCAL_PREVIEW: 'on'
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
      FORBID_PRODUCTION: 'true'
      PAWSPACE_TEST_SERVICE_DISCOVERY_FIXTURE: 'on'
      PAWSPACE_VOICE_TRANSPORT: local_simulator_non_production
      PAWSPACE_SCHEDULING_ENV: uat
      PAWSPACE_MEDIA_ENV: uat
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "integration/release-v1.0.0-beta-finance-closure"
          test "$(git rev-parse origin/release/v1.0.0-beta)" = "31363c9b28b2f12e08134e32fde0d12ea8d168de"
          git cat-file -e 0f5e42f4003dc6dc1cbbc268bffbde152ad22a9a^{commit}
          test "$(git show -s --format=%P 0f5e42f4003dc6dc1cbbc268bffbde152ad22a9a | awk '{print $1}')" = "2fa3d85c209409ea857f395b1fe94c5c507b7244"
          echo "RELEASE_BASE=$(git rev-parse HEAD)"
          echo "FINANCE_VERIFIED=0f5e42f4003dc6dc1cbbc268bffbde152ad22a9a"
      - name: Create controlled two-parent merge candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PawSpace Release Integration Bot"
          git config user.email "release-integration@pawspace.invalid"
          git merge -s ours --no-commit 0f5e42f4003dc6dc1cbbc268bffbde152ad22a9a

          finance_files=(
            app/api/booking-operations/route.ts
            app/api/grooming-payment-sandbox/route.ts
            app/api/razorpay-webhook/route.ts
            app/api/ops-work-queue/route.ts
            lib/grooming-payment-reconciliation.ts
            lib/company-analytics.ts
            lib/unit-economics.ts
            lib/pnl-reporting.ts
            lib/ops-work-queue.ts
          )
          git diff --binary 2fa3d85c209409ea857f395b1fe94c5c507b7244 0f5e42f4003dc6dc1cbbc268bffbde152ad22a9a -- "${finance_files[@]}" > /tmp/finance-certified.patch
          git apply --3way --index /tmp/finance-certified.patch

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/api/grooming-booking-change/route.ts')
          s=p.read_text()
          def repl(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing expected release shape: {label}')
              s=s.replace(old,new,1)

          repl('import{listAuthoritativeAvailability}from"../../../lib/scheduling-roster-authority";\n',
               'import{listAuthoritativeAvailability}from"../../../lib/scheduling-roster-authority";\nimport{bridgeLifecycleCommunications}from"../../../lib/lifecycle-communications";\n',
               'communication bridge import')
          repl('  db.prepare("CREATE TABLE IF NOT EXISTS booking_refund_cases (id TEXT PRIMARY KEY,booking_id TEXT NOT NULL,payment_id TEXT,amount REAL NOT NULL DEFAULT 0,reason TEXT NOT NULL,status TEXT NOT NULL DEFAULT \'requested\',requested_by TEXT NOT NULL,approved_by TEXT,gateway_reference TEXT,created_at INTEGER NOT NULL,updated_at INTEGER NOT NULL)"),\n',
               '  db.prepare("CREATE TABLE IF NOT EXISTS booking_refund_cases (id TEXT PRIMARY KEY,booking_id TEXT NOT NULL,payment_id TEXT,amount REAL NOT NULL DEFAULT 0,reason TEXT NOT NULL,status TEXT NOT NULL DEFAULT \'requested\',requested_by TEXT NOT NULL,approved_by TEXT,gateway_reference TEXT,created_at INTEGER NOT NULL,updated_at INTEGER NOT NULL)"),\n  db.prepare("CREATE TABLE IF NOT EXISTS booking_customer_notifications (id TEXT PRIMARY KEY,booking_id TEXT NOT NULL,customer_id TEXT,channel TEXT NOT NULL,template_code TEXT NOT NULL,message TEXT NOT NULL,status TEXT NOT NULL DEFAULT \'queued\',event_id TEXT NOT NULL,created_at INTEGER NOT NULL)"),\n',
               'notification table')
          repl('      const refundAmount=refundEvaluation.customerRefundAmount;\n      const refundId=refundAmount>0?crypto.randomUUID():null;\n',
               '      const refundAmount=refundEvaluation.customerRefundAmount;\n      const refundId=refundAmount>0?crypto.randomUUID():null;\n      const cancellationEventId=crypto.randomUUID();\n      const cancellationMessage=refundAmount>0?`Your PawSpace Grooming booking is cancelled. A refund of ₹${refundAmount.toFixed(2)} is pending reconciliation.`:"Your PawSpace Grooming booking is cancelled.";\n',
               'cancellation notification variables')
          repl('        db.prepare("UPDATE booking_payments SET status=?,detail_json=json_set(json_set(detail_json,\'$.cancelReason\',?),\'$.commercialPolicyEvaluation\',json(?)),updated_at=? WHERE booking_id=?").bind(refundAmount>0?"refund_pending":"cancelled",reason,JSON.stringify(policyEvaluation),now,input.bookingId),\n        db.prepare("UPDATE booking_subscription_usage SET sessions_reserved=0,status=CASE WHEN sessions_consumed=0 THEN \'reversed\' ELSE status END,updated_at=? WHERE booking_id=?").bind(now,input.bookingId),\n',
               '        db.prepare("UPDATE booking_payments SET status=?,detail_json=json_set(json_set(detail_json,\'$.cancelReason\',?),\'$.commercialPolicyEvaluation\',json(?)),updated_at=? WHERE booking_id=?").bind(refundAmount>0?"refund_pending":"cancelled",reason,JSON.stringify(policyEvaluation),now,input.bookingId),\n        db.prepare("INSERT INTO booking_customer_notifications (id,booking_id,customer_id,channel,template_code,message,status,event_id,created_at) VALUES (?,?,?,?,?,?,?,?,?)").bind(crypto.randomUUID(),input.bookingId,input.customerId,"whatsapp",refundAmount>0?"grooming_booking_cancelled_refund_pending":"grooming_booking_cancelled",cancellationMessage,"queued",cancellationEventId,now),\n        db.prepare("UPDATE booking_subscription_usage SET sessions_reserved=0,status=CASE WHEN sessions_consumed=0 THEN \'reversed\' ELSE status END,updated_at=? WHERE booking_id=?").bind(now,input.bookingId),\n',
               'durable notification insert')
          repl('      let referral:unknown;try{referral=await handleReferralBookingCancellation(db,{bookingId:input.bookingId,actorId:auditActor,reason});}catch(error){referral={applicable:true,status:"review_required",reason:error instanceof Error?error.message:"Referral cancellation consequence requires review"};}\n      return json({data:{bookingId:input.bookingId,status:"cancelled",paymentStatus:refundAmount>0?"refund_pending":"cancelled",refundCaseId:refundId,refundAmount,policy:policyEvaluation,capacityReleased:true,subscriptionSessionsReleased:reservedSessions,referral}});\n',
               '      const customerCommunication=await bridgeLifecycleCommunications(db,{bookingId:input.bookingId,source:"booking_customer_notifications",actorId:auditActor});\n      let referral:unknown;try{referral=await handleReferralBookingCancellation(db,{bookingId:input.bookingId,actorId:auditActor,reason});}catch(error){referral={applicable:true,status:"review_required",reason:error instanceof Error?error.message:"Referral cancellation consequence requires review"};}\n      return json({data:{bookingId:input.bookingId,status:"cancelled",paymentStatus:refundAmount>0?"refund_pending":"cancelled",refundCaseId:refundId,refundAmount,policy:policyEvaluation,capacityReleased:true,subscriptionSessionsReleased:reservedSessions,customerCommunication,referral}});\n',
               'post-commit communication handoff')
          p.write_text(s)
          PY
          git add app/api/grooming-booking-change/route.ts

          closure_assets=(
            e2e/helpers/correlated-grooming.ts
            e2e/helpers/cancellation-refund-recovery.ts
            e2e/journeys/08-http-cancellation-demo.spec.ts
            tests/remote-finance-closure.test.mjs
            scripts/e2e/run-finance-closure.sh
            scripts/assert-human-beta-sandbox.mjs
          )
          for path in "${closure_assets[@]}"; do
            git checkout 0f5e42f4003dc6dc1cbbc268bffbde152ad22a9a -- "$path"
          done

          # Align legacy release assertions with the certified accounting contract without weakening
          # coverage: gross-refund behavior is still tested with a final processed refund, while the
          # finance-closure regression separately proves processing refunds are not recognized.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/analytics-hardening.test.mjs')
          s=p.read_text()
          old="sqlite.prepare(\"INSERT INTO booking_refund_cases (id,booking_id,amount,status) VALUES ('REF-1','B-REF',3000,'processing')\").run();"
          new="sqlite.prepare(\"INSERT INTO booking_refund_cases (id,booking_id,amount,status) VALUES ('REF-1','B-REF',3000,'processed')\").run();"
          if old not in s: raise SystemExit('missing analytics refund fixture shape')
          s=s.replace(old,new,1)
          old_status='booking_refund_cases_processing_processed_completed'
          if s.count(old_status)!=1: raise SystemExit('unexpected analytics refund status assertion count')
          s=s.replace(old_status,'booking_refund_cases_processed_completed')
          p.write_text(s)

          p=Path('tests/cross-module-journey-gate.test.mjs')
          s=p.read_text()
          old_status='booking_refund_cases_processing_processed_completed'
          if s.count(old_status)!=1: raise SystemExit('unexpected cross-module refund status assertion count')
          s=s.replace(old_status,'booking_refund_cases_processed_completed')
          p.write_text(s)
          PY
          git add tests/analytics-hardening.test.mjs tests/cross-module-journey-gate.test.mjs

          # This workflow is integration scaffolding, not release product code.
          git rm .github/workflows/release-finance-integration.yml

          git diff --check --cached
          git status --short
          git commit -m "[release-finance-integrated] merge verified finance closure 0f5e42f4 into beta"
          git log -1 --format='parents=%P%nsha=%H%nsubject=%s'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Assert fail-closed payment environment
        shell: bash
        run: |
          set -euo pipefail
          echo "PAWSPACE_PAYMENT_ENV=$PAWSPACE_PAYMENT_ENV"
          echo "FORBID_PRODUCTION=$FORBID_PRODUCTION"
          echo "PAWSPACE_PAYMENT_LIVE_APPROVED=$PAWSPACE_PAYMENT_LIVE_APPROVED"
          node --input-type=module -e 'import { assertHumanBetaSandbox } from "./scripts/assert-human-beta-sandbox.mjs"; assertHumanBetaSandbox(process.env); console.log("SANDBOX_LOCK=PASS")'
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee release-finance-npm-test.log
      - name: Build certification
        run: npm run build
      - name: Focused finance regression proof
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 tests/remote-finance-closure.test.mjs 2>&1 | tee release-finance-focused.tap
      - name: Push certified integration candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:integration/release-v1.0.0-beta-finance-closure
      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-finance-integration-evidence
          path: |
            release-finance-npm-test.log
            release-finance-focused.tap
          if-no-files-found: warn
