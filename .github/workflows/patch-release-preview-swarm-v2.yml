name: Patch release-preview swarm fixtures v2

on:
  push:
    branches:
      - fix/release-preview-swarm-provider-fixtures
    paths:
      - .github/workflows/patch-release-preview-swarm-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-preview-swarm-provider-fixtures
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply swarm fixture patch
        run: python3 scripts/patch-release-preview-swarm.py
      - name: Run focused gate regressions
        run: node --test tests/release-preview-current-contract-adapter.test.mjs tests/release-preview-swarm-provider-fixtures.test.mjs tests/release-preview-gate-behavior.test.mjs
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "PawSpace Release Bot"
          git config user.email "release-bot@pawspace.test"
          git add -A
          git commit -m "test(preview): make swarm fixtures slot-valid"
          git push origin HEAD:fix/release-preview-swarm-provider-fixtures
