name: Inspect Razorpay Test mandate rzp382e

on:
  push:
    branches:
      - ops/razorpay-provider-cert-20260901
    paths:
      - .github/workflows/provider-mandate-browser-rzp382e.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH_URL: https://rzp.io/rzp/4QgT6Lh
      SUBSCRIPTION_ID: sub_TWg9yixMBHpX2w
      RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
      RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
    steps:
      - name: Guard Test Mode subscription
        shell: bash
        run: |
          set -euo pipefail
          case "$RAZORPAY_KEY_ID_SANDBOX" in rzp_test_*) ;; *) echo "Refusing non-test Razorpay key" >&2; exit 1;; esac
          node --input-type=module <<'NODE'
          const id=process.env.SUBSCRIPTION_ID;
          const auth=`Basic ${Buffer.from(`${process.env.RAZORPAY_KEY_ID_SANDBOX}:${process.env.RAZORPAY_KEY_SECRET_SANDBOX}`).toString('base64')}`;
          const r=await fetch(`https://api.razorpay.com/v1/subscriptions/${encodeURIComponent(id)}`,{headers:{authorization:auth},redirect:'manual'});
          const b=await r.json(); if(!r.ok||b.id!==id) throw new Error('Test subscription guard failed');
          console.log(JSON.stringify({mode:'test',id:b.id,status:b.status,planId:b.plan_id,shortUrlPresent:Boolean(b.short_url)}));
          NODE
      - name: Inspect payment form after valid synthetic contact
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mandate-browser"; mkdir -p "$WORK"; cd "$WORK"
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > inspect.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          await page.goto(process.env.AUTH_URL,{waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(4000);
          await page.getByRole('button',{name:'Start Subscription'}).click(); await page.waitForTimeout(7000);
          const checkout=page.frames().find(f=>f.url().includes('/v1/checkout/public')); if(!checkout) throw new Error('checkout frame missing');
          const contact=checkout.locator('input[name="contact"]'); if(await contact.count()) await contact.fill('9876543210');
          const email=checkout.locator('input[name="email"]'); if(await email.count()) await email.fill('provider-cert-e@example.com');
          const cont=checkout.getByRole('button',{name:'Continue'}); if(await cont.count()!==1) throw new Error('Contact Continue button missing');
          await cont.click(); await page.waitForTimeout(4000);
          const overlay=checkout.locator('#overlay-backdrop');
          const overlayVisible=await overlay.isVisible().catch(()=>false);
          const overlayText=overlayVisible ? (await overlay.innerText().catch(()=>'')) : '';
          let selected='none';
          if(!overlayVisible){
            const card=checkout.locator('[data-testid="card"]');
            if(await card.count()){await card.click(); selected='card'; await page.waitForTimeout(3500);}
          }
          const controls=await checkout.locator('input,button,[role="button"],[data-testid]').evaluateAll(els=>els.slice(0,160).map((e,i)=>({i,tag:e.tagName,testid:e.getAttribute('data-testid'),type:e.getAttribute('type'),name:e.getAttribute('name'),placeholder:e.getAttribute('placeholder'),autocomplete:e.getAttribute('autocomplete'),text:(e.innerText||e.textContent||'').trim().replace(/\s+/g,' ').slice(0,180),disabled:Boolean(e.disabled)})));
          const captchaFrames=page.frames().filter(f=>f.url().includes('hcaptcha')).map(f=>f.url());
          console.log(JSON.stringify({mode:'test',subscriptionId:process.env.SUBSCRIPTION_ID,contactAccepted:!overlayVisible,overlayText:overlayText.trim().replace(/\s+/g,' ').slice(0,500),selected,captchaFrameCount:captchaFrames.length,controls},null,2));
          await page.screenshot({path:'mandate-valid-contact-form.png',fullPage:true});
          await browser.close();
          NODE
          node inspect.mjs | tee mandate-valid-contact-form.json.log
          cp mandate-valid-contact-form.png "$GITHUB_WORKSPACE/mandate-valid-contact-form.png"
          cp mandate-valid-contact-form.json.log "$GITHUB_WORKSPACE/mandate-valid-contact-form.json.log"
      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: mandate-valid-contact-form-rzp382-20260901e
          path: |
            mandate-valid-contact-form.png
            mandate-valid-contact-form.json.log
