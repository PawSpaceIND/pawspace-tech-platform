name: P0 Exotel Provider Callback Probe

on:
  push:
    branches:
      - remediation/p0-pilot-gates-b379631
    paths:
      - .github/workflows/p0-exotel-provider-callback-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: pawspace-staging
    timeout-minutes: 4
    env:
      EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
      EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
      EXOTEL_SID: ${{ secrets.EXOTEL_SID }}
      EXOTEL_CALLER_ID: ${{ secrets.EXOTEL_CALLER_ID }}
      EXOTEL_VOICE_APP_ID: ${{ secrets.EXOTEL_VOICE_APP_ID }}
      EXOTEL_WEBHOOK_SECRET: ${{ secrets.EXOTEL_WEBHOOK_SECRET }}
      EXOTEL_SUBDOMAIN: ${{ secrets.EXOTEL_SUBDOMAIN }}
      PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Place one authorized carrier probe with authenticated callback
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const env=process.env;
          const entries=String(env.PAWSPACE_VOICE_UAT_ALLOWLIST||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
          if(entries.length!==1) throw new Error(`Expected exactly one UAT allowlisted recipient, got ${entries.length}`);
          const phone=entries[0];
          const digits=phone.replace(/\D/g,'');
          if(!/^91\d{10}$/.test(digits)) throw new Error('UAT recipient is not a valid +91 E.164 number');
          const to=`+${digits}`;
          const key=String(env.EXOTEL_API_KEY||''), token=String(env.EXOTEL_API_TOKEN||''), sid=String(env.EXOTEL_SID||'');
          const caller=String(env.EXOTEL_CALLER_ID||''), app=String(env.EXOTEL_VOICE_APP_ID||''), secret=String(env.EXOTEL_WEBHOOK_SECRET||'');
          const subdomain=String(env.EXOTEL_SUBDOMAIN||'').trim()||'api.exotel.com';
          if(!key||!token||!sid||!caller||!app||!secret) throw new Error('Exotel staging configuration is incomplete');
          for(const v of [phone,to,key,token,sid,caller,app,secret]) console.log('::add-mask::'+v);
          const cb=new URL('https://pawspace-staging.karthik-fce.workers.dev/api/voice-provider-webhook');
          cb.username='exotel'; cb.password=secret;
          const callback=cb.toString(); console.log('::add-mask::'+callback);
          const body=new URLSearchParams({
            From:to,
            CallerId:caller,
            Url:`http://my.exotel.com/${sid}/exoml/start_voice/${app}`,
            CallType:'trans',
            StatusCallback:callback,
            CustomField:`EXOTEL-TAIL-PROBE-${process.env.GITHUB_RUN_ID}`,
            TimeOut:'30',
            Record:'false'
          });
          const auth=Buffer.from(`${key}:${token}`).toString('base64');
          const r=await fetch(`https://${subdomain}/v1/Accounts/${encodeURIComponent(sid)}/Calls/connect.json`,{method:'POST',headers:{authorization:`Basic ${auth}`,'content-type':'application/x-www-form-urlencoded'},body:body.toString(),signal:AbortSignal.timeout(20000)});
          const text=await r.text();
          if(!r.ok) throw new Error(`Exotel probe dial HTTP ${r.status}`);
          let j={};try{j=JSON.parse(text)}catch{throw new Error('Exotel probe response was not JSON')}
          const callSid=String(j?.Call?.Sid||''); if(!callSid) throw new Error('Exotel returned no Call Sid');
          console.log('::add-mask::'+callSid);
          console.log(`EXOTEL_PROVIDER_PROBE_DIAL_ACCEPTED sid_suffix=${callSid.slice(-8)} status=${String(j?.Call?.Status||'unknown')}`);
          await new Promise(r=>setTimeout(r,45000));
          const u=new URL(`https://${subdomain}/v1/Accounts/${encodeURIComponent(sid)}/Calls.json`);u.searchParams.set('Sid',callSid);u.searchParams.set('details','true');
          const d=await fetch(u,{headers:{authorization:`Basic ${auth}`},signal:AbortSignal.timeout(20000)});const dt=await d.text();if(!d.ok)throw new Error(`Exotel detail HTTP ${d.status}`);let dj={};try{dj=JSON.parse(dt)}catch{}
          const c=Array.isArray(dj?.Calls)?dj.Calls[0]:null;
          console.log(`EXOTEL_PROVIDER_PROBE_FINAL status=${String(c?.Status||'unknown')} duration=${String(c?.Duration||'')} recording_url_present=${Boolean(c?.RecordingUrl)}`);
          NODE
