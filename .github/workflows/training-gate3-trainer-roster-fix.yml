name: Training Gate 3 trainer roster fix
on:
  push:
    branches: [grooming-integration-closure]
    paths:
      - .github/workflows/training-gate3-trainer-roster-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Replace fixture trainer choices with canonical capacity roster
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app/mobile-app/training-flow.tsx')
          text=path.read_text()
          old='import { loadTrainingPackages, quoteTraining, type TrainingPackage, type TrainingQuote } from "../../lib/training-commercial-client";'
          new='import { loadTrainingPackages, loadTrainingTrainers, quoteTraining, type TrainingPackage, type TrainingQuote, type TrainingTrainer } from "../../lib/training-commercial-client";'
          assert old in text
          text=text.replace(old,new,1)
          start=text.index('const trainers = [')
          end=text.index('const money =',start)
          text=text[:start]+text[end:]
          old='  const [plans,setPlans]=useState<Plan[]>([]);\n  const [meetPackage,setMeetPackage]=useState<TrainingPackage|null>(null);'
          new='  const [plans,setPlans]=useState<Plan[]>([]);\n  const [trainers,setTrainers]=useState<TrainingTrainer[]>([]);\n  const [trainerId,setTrainerId]=useState("");\n  const [confirmedTrainerName,setConfirmedTrainerName]=useState("");\n  const [meetTrainerName,setMeetTrainerName]=useState("");\n  const [meetPackage,setMeetPackage]=useState<TrainingPackage|null>(null);'
          assert old in text
          text=text.replace(old,new,1)
          text=text.replace('    [trainer, setTrainer] = useState(trainers[0]),\n','',1)
          marker='  const recommendedPlan=plans.find(item=>item.packageCode==="training-8-basic")||plan;\n'
          assert marker in text
          roster='''  const recommendedPlan=plans.find(item=>item.packageCode==="training-8-basic")||plan;\n  const selectedTrainer=trainers.find(item=>item.id===trainerId)||trainers[0]||null;\n  useEffect(()=>{let active=true;void loadTrainingTrainers({cityId:"blr",zoneId:"blr-east",at:selectedStartIso}).then(result=>{if(!active)return;setTrainers(result.providers);setTrainerId(current=>result.providers.some(item=>item.id===current)?current:result.providers[0]?.id||"");}).catch(problem=>{if(active){setTrainers([]);setTrainerId("");setScheduleError(problem instanceof Error?problem.message:"Unable to load eligible Training trainers");}});return()=>{active=false;};},[selectedStartIso]);\n'''
          text=text.replace(marker,roster,1)
          text=text.replace('trainer.name.replaceAll(" ","")','selectedTrainer?.id||"auto"')
          text=text.replace('preferredProviderId:trainer.name==="Kiran S."?"train_kiran":"train_ramesh"','preferredProviderId:selectedTrainer?.id')
          text=text.replace('setMeetBookingId(canonical.bookingId);setMeet(false);setCheckoutQuote(null);','setMeetBookingId(canonical.bookingId);setMeetTrainerName(decision.provider.name);setMeet(false);setCheckoutQuote(null);',1)
          old_inline='linkedMeetBookingId=meetCanonical.bookingId;setMeetBookingId(linkedMeetBookingId);}'
          new_inline='linkedMeetBookingId=meetCanonical.bookingId;setMeetBookingId(linkedMeetBookingId);setMeetTrainerName(meetDecision.provider.name);}'
          assert old_inline in text
          text=text.replace(old_inline,new_inline,1)
          text=text.replace('        await materializeTrainingProgramme({bookingId:canonical.bookingId,meetBookingId:linkedMeetBookingId||undefined});\n        const booking=','        await materializeTrainingProgramme({bookingId:canonical.bookingId,meetBookingId:linkedMeetBookingId||undefined});\n        setConfirmedTrainerName(decision.provider.name);\n        const booking=',1)
          old_dashboard='''      <TrainingDashboard\n        bookingId={bookingId}\n        plan={plan}\n        trainer={trainer}\n        pets={selectedPets}'''
          new_dashboard='''      <TrainingDashboard\n        bookingId={bookingId}\n        plan={plan}\n        trainerName={confirmedTrainerName||selectedTrainer?.name||"Assigned trainer"}\n        pets={selectedPets}'''
          assert old_dashboard in text
          text=text.replace(old_dashboard,new_dashboard,1)
          old_cards='''          <div className={styles.trainers}>\n            {trainers.map((item) => (\n              <button\n                key={item.name}\n                className={trainer.name === item.name ? styles.selected : ""}\n                onClick={() => setTrainer(item)}\n              >\n                <i>\n                  {item.name\n                    .split(" ")\n                    .map((x) => x[0])\n                    .join("")}\n                </i>\n                <div>\n                  <span>{item.match}</span>\n                  <h4>\n                    {item.name} · {item.score} ★\n                  </h4>\n                  <p>{item.jobs} trained · English, Kannada, Hindi</p>\n                  <small>{item.model} · accepts before confirmation</small>\n                </div>\n                <em>{trainer.name === item.name ? "✓" : ""}</em>\n              </button>\n            ))}\n          </div>'''
          new_cards='''          <div className={styles.trainers}>\n            {trainers.length===0&&<p>No eligible trainer is currently available for this start date and zone.</p>}\n            {trainers.map((item) => (\n              <button key={item.id} className={trainerId===item.id?styles.selected:""} onClick={()=>setTrainerId(item.id)}>\n                <i>{item.name.split(" ").map((x)=>x[0]).join("")}</i>\n                <div>\n                  <span>Canonical capacity roster</span>\n                  <h4>{item.name} · {item.rating.toFixed(1)} ★</h4>\n                  <p>Quality {item.qualityScore}/100 · capacity {item.capacity} · {item.travelBufferMinutes} min travel buffer</p>\n                  <small>{item.model.replaceAll("_"," ")} · final assignment after whole-calendar conflict checks</small>\n                </div>\n                <em>{trainerId===item.id?"✓":""}</em>\n              </button>\n            ))}\n          </div>'''
          assert old_cards in text
          text=text.replace(old_cards,new_cards,1)
          text=text.replace('{meetBookingId && <article className={styles.meetConfirmed}><b>✓ Meet & Greet booked</b><span>{slotLabel(new Date(meetSlot))} · {trainer.name} · {meetBookingId}</span>','{meetBookingId && <article className={styles.meetConfirmed}><b>✓ Meet & Greet booked</b><span>{slotLabel(new Date(meetSlot))} · {meetTrainerName||selectedTrainer?.name||"Assigned trainer"} · {meetBookingId}</span>',1)
          text=text.replace('<button className={styles.primary} onClick={() => setStage(4)}>\n            Build session calendar\n          </button>','<button className={styles.primary} disabled={!selectedTrainer} onClick={() => setStage(4)}>\n            Build session calendar\n          </button>',1)
          text=text.replace('<span>Trainer</span>\n              <b>{trainer.name} · acceptance required</b>','<span>Preferred trainer</span>\n              <b>{selectedTrainer?`${selectedTrainer.name} · final assignment checked server-side`:"No eligible trainer selected"}</b>',1)
          old_sig='function TrainingDashboard({bookingId,plan,trainer,pets,serviceMinutes,view,setView}:{bookingId:string;plan:Plan;trainer:(typeof trainers)[number];pets:string[];serviceMinutes:number;view:"plan"|"homework"|"progress";setView:(v:"plan"|"homework"|"progress")=>void;}) {'
          new_sig='function TrainingDashboard({bookingId,plan,trainerName,pets,serviceMinutes,view,setView}:{bookingId:string;plan:Plan;trainerName:string;pets:string[];serviceMinutes:number;view:"plan"|"homework"|"progress";setView:(v:"plan"|"homework"|"progress")=>void;}) {'
          assert old_sig in text
          text=text.replace(old_sig,new_sig,1)
          text=text.replace('${trainer.name}', '${trainerName}')
          path.write_text(text)

          gateway=Path('lib/api-gateway.ts')
          text=gateway.read_text()
          old='if(url.pathname==="/api/pricing-quote"||url.pathname==="/api/training-commercial"||url.pathname==="/api/razorpay-webhook"||url.pathname==="/api/identity-session")return null;'
          new='if(url.pathname==="/api/pricing-quote"||url.pathname==="/api/training-commercial"||url.pathname==="/api/training-trainers"||url.pathname==="/api/razorpay-webhook"||url.pathname==="/api/identity-session")return null;'
          assert old in text
          gateway.write_text(text.replace(old,new,1))
          PY
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit canonical trainer roster fix
        run: |
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add app/mobile-app/training-flow.tsx lib/api-gateway.ts
          git diff --cached --quiet && exit 0
          git commit -m "Use canonical trainer capacity in Training customer journey [skip ci]"
          git pull --rebase origin grooming-integration-closure
          git push origin grooming-integration-closure
