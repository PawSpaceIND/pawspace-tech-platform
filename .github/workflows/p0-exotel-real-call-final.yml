name: P0 Exotel Real Call Final

on:
  push:
    branches: [remediation/p0-pilot-gates-b379631]
    paths: [.github/workflows/p0-exotel-real-call-final.yml]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    environment: pawspace-staging
    timeout-minutes: 12
    env:
      STAGING_URL: https://pawspace-staging.karthik-fce.workers.dev
      STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
      PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Execute one explicit-consent internal UAT call
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base=String(process.env.STAGING_URL||'').replace(/\/$/,'');
          const dbId=String(process.env.STAGING_D1_ID||'');
          const account=String(process.env.CLOUDFLARE_ACCOUNT_ID||'');
          const cfToken=String(process.env.CLOUDFLARE_API_TOKEN||'');
          const accessCode=String(process.env.PAWSPACE_UAT_ACCESS_CODE||'');
          const entries=String(process.env.PAWSPACE_VOICE_UAT_ALLOWLIST||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
          if(!base||!dbId||!account||!cfToken||!accessCode||entries.length!==1) throw new Error('Expected complete staging config and exactly one UAT recipient');
          const phone=entries[0]; const key=String(phone).replace(/\D/g,'').slice(-10);
          if(key.length!==10) throw new Error('UAT recipient is not a valid Indian dial key');
          console.log(`::add-mask::${phone}`); console.log(`::add-mask::${key}`);
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const d1=async(sql,params=[])=>{const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${dbId}/query`,{method:'POST',headers:{authorization:`Bearer ${cfToken}`,'content-type':'application/json'},body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(20000)});const j=await r.json().catch(()=>null);if(!r.ok||!j?.success)throw new Error(`D1 HTTP ${r.status}`);return j.result?.[0]?.results||[]};
          const exec=(sql,params=[])=>d1(sql,params);
          const login=await fetch(`${base}/api/staging-login`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',code:accessCode,email:'founder@pawspace.in'}),signal:AbortSignal.timeout(20000)});
          if(!login.ok)throw new Error(`staging login HTTP ${login.status}`);const cookie=(login.headers.get('set-cookie')||'').split(';')[0];console.log(`::add-mask::${cookie}`);
          const api=async(body)=>{const r=await fetch(`${base}/api/voice-outbound`,{method:'POST',headers:{cookie,'content-type':'application/json',origin:base},body:JSON.stringify(body),signal:AbortSignal.timeout(30000)});const j=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,j}};
          const norm=v=>String(v||'').replace(/\D/g,'').slice(-10);

          // Remove only the stale synthetic owner created by the previous failed certification if it collides.
          let customers=await d1('SELECT id,primary_phone,secondary_phone FROM canonical_customers');
          let owners=customers.filter(r=>[r.primary_phone,r.secondary_phone].some(v=>norm(v)===key));
          if(owners.length>1&&owners.some(r=>String(r.id)==='UAT-EXOTEL-CERT-1')){
            await exec("DELETE FROM canonical_bookings WHERE customer_id='UAT-EXOTEL-CERT-1' AND created_by='exotel_uat_cert'");
            await exec("DELETE FROM canonical_customers WHERE id='UAT-EXOTEL-CERT-1' AND source='exotel_uat_cert'");
            customers=await d1('SELECT id,primary_phone,secondary_phone FROM canonical_customers');
            owners=customers.filter(r=>[r.primary_phone,r.secondary_phone].some(v=>norm(v)===key));
          }
          if(owners.length>1)throw new Error(`Recipient ownership collision remains (${owners.length})`);
          const now=Date.now();
          let customerId=owners[0]?String(owners[0].id):'UAT-EXOTEL-CERT-1';
          if(!owners.length)await exec("INSERT INTO canonical_customers (id,city_id,name,primary_phone,secondary_phone,email,source,consent_json,created_at,updated_at) VALUES (?,?,?,?,NULL,NULL,'exotel_uat_cert','{}',?,?)",[customerId,'blr','Exotel UAT Certification',phone,now,now]);
          const bookingId=`UAT-EXOTEL-${customerId.replace(/[^A-Za-z0-9]/g,'').slice(-20)}`;
          const priorBooking=await d1('SELECT id FROM canonical_bookings WHERE id=?',[bookingId]);
          if(!priorBooking.length)await exec("INSERT INTO canonical_bookings (id,idempotency_key,customer_id,pet_ids_json,source_pet_ids_json,city_id,zone_id,service_code,package_code,package_name,schedule_group_id,provider_id,scheduled_start,scheduled_end,status,channel,total_amount,currency,pricing_json,created_by,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",[bookingId,'idem-'+bookingId,customerId,'[]','[]','blr','blr-uat','dog_training','uat-cert','UAT certification','SG-'+bookingId,'UAT-PROVIDER',new Date(now+3600000).toISOString(),new Date(now+7200000).toISOString(),'confirmed','internal_uat',0,'INR','{}','exotel_uat_cert',now,now]);

          const consent=await api({action:'record_consent',phone,subjectType:'customer',subjectId:customerId,granted:true,source:'user_explicit_chat_2026-09-05_exotel_uat'});
          if(!consent.ok)throw new Error(`consent HTTP ${consent.status}`);
          console.log(`explicit_consent=recorded phone_last4=${key.slice(-4)}`);

          const p1=await api({action:'policy_preview',useCase:'booking_confirmation',phone,cityId:'blr',customerId,bookingId});
          if(!p1.ok)throw new Error(`policy preview HTTP ${p1.status}: ${String(p1.j?.error||'unknown')}`);
          const blocked=Array.isArray(p1.j?.data?.blockedBy)?p1.j.data.blockedBy:[];
          const nonQuiet=blocked.filter(x=>String(x)!=='quiet_hours');
          if(nonQuiet.length)throw new Error(`non-time policy blockers: ${nonQuiet.join(',')}`);

          const policies=await d1("SELECT version,quiet_start_hour,quiet_end_hour FROM communication_policies WHERE city_id='blr' AND active=1 ORDER BY version DESC LIMIT 1");
          if(!policies.length)throw new Error('active BLR communication policy missing');
          const pol=policies[0]; let restored=false;
          const restore=async()=>{if(restored)return;await exec("UPDATE communication_policies SET quiet_start_hour=?,quiet_end_hour=? WHERE city_id='blr' AND version=?",[Number(pol.quiet_start_hour),Number(pol.quiet_end_hour),Number(pol.version)]);restored=true;console.log('staging_quiet_hours=restored')};
          let call;
          try{
            await exec("UPDATE communication_policies SET quiet_start_hour=0,quiet_end_hour=0 WHERE city_id='blr' AND version=?",[Number(pol.version)]);
            const p2=await api({action:'policy_preview',useCase:'booking_confirmation',phone,cityId:'blr',customerId,bookingId});
            if(!p2.ok||p2.j?.data?.allowed!==true)throw new Error(`internal UAT preview blocked: ${JSON.stringify(p2.j?.data?.blockedBy||p2.j?.error||'unknown')}`);
            const placed=await api({action:'request_call',idempotencyKey:`exotel-final-${process.env.GITHUB_RUN_ID}`,useCase:'booking_confirmation',phone,cityId:'blr',customerId,bookingId});
            call=placed.j?.data||{};
            if(!placed.ok||!call.callId||call.provider!=='exotel'||call.dialled!==true)throw new Error(`Exotel dial failed HTTP ${placed.status} state=${call.state||'unknown'}`);
            console.log(`EXOTEL_DIAL_ACCEPTED call_id=${call.callId} phone_last4=${key.slice(-4)}`);
          } finally {await restore()}

          const bad=new Set(['busy','no_answer','failed','provider_error','provider_unavailable','cancelled']);
          let row=null;
          for(let i=1;i<=48;i++){const rs=await d1('SELECT * FROM voice_call_orders WHERE id=?',[call.callId]);row=rs[0]||null;const state=String(row?.state||'');if(i===1||i%6===0)console.log(`call_progress=${state}`);if(bad.has(state))throw new Error(`carrier terminal failure=${state}`);if(state==='completed'||state==='ended')break;await sleep(5000)}
          if(!row||!['completed','ended'].includes(String(row.state)))throw new Error('Timed out waiting for Exotel completion callback');
          if(String(row.state)==='completed'){const done=await api({action:'complete',callId:call.callId,reason:'Internal Exotel UAT certification completed'});if(!done.ok)throw new Error(`close HTTP ${done.status}`)}
          const final=(await d1('SELECT * FROM voice_call_orders WHERE id=?',[call.callId]))[0]||{};
          const ev=(await d1('SELECT COUNT(*) n,SUM(CASE WHEN applied=1 THEN 1 ELSE 0 END) applied FROM voice_call_provider_events WHERE call_id=?',[call.callId]))[0]||{};
          const states=(await d1('SELECT to_state FROM voice_call_state_transitions WHERE call_id=? ORDER BY sequence',[call.callId])).map(x=>String(x.to_state||''));
          if(String(final.state)!=='ended'||!final.provider_call_id||!final.dialed_at||!final.connected_at||!final.ended_at)throw new Error('final carrier ledger incomplete');
          if(Number(ev.n||0)<1||Number(ev.applied||0)<1)throw new Error('signed provider callback evidence missing');
          if(!states.includes('connected')||!states.includes('completed')||!states.includes('ended'))throw new Error(`lifecycle incomplete ${states.join('>')}`);
          console.log(`EXOTEL_REAL_CALL_UAT_CLOSED call_id=${call.callId} phone_last4=${key.slice(-4)} callbacks=${ev.n} applied=${ev.applied}`);
          NODE
