name: Training Gate 3 customer patch v2
on:
  push:
    branches: [grooming-integration-closure]
    paths:
      - .github/workflows/training-gate3-customer-patch-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grooming-integration-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Reuse verified Training customer patch
        run: |
          awk "/python3 - <<'PY'/{flag=1;next}/^          PY$/{flag=0}flag{sub(/^          /,\"\");print}" .github/workflows/training-gate3-customer-patch.yml > /tmp/training-customer-patch.py
          python3 /tmp/training-customer-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app/mobile-app/training-flow.tsx')
          text=path.read_text()
          old='programme?.total_sessions??plan.sessions||1'
          assert old in text
          path.write_text(text.replace(old,'(programme?.total_sessions??plan.sessions)||1',1))
          PY
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run validate:artifact
      - name: Commit verified customer hardening
        run: |
          git config user.name "PawSpaceIND"
          git config user.email "karthik@pawspace.in"
          git add app/mobile-app/training-flow.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Move Training customer journey to canonical quote and programme truth [skip ci]"
          git pull --rebase origin grooming-integration-closure
          git push origin grooming-integration-closure
