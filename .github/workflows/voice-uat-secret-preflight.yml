name: Voice UAT secret preflight

on:
  push:
    branches:
      - fix/audio-bot-exotel-uat-closure-20260905
  workflow_dispatch:

jobs:
  verify-secret-presence:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    steps:
      - name: Verify Exotel staging secret names without exposing values
        env:
          EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
          EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
          EXOTEL_ACCOUNT_SID: ${{ secrets.EXOTEL_ACCOUNT_SID || secrets.EXOTEL_SID }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
        run: |
          set -euo pipefail
          missing=0
          for name in EXOTEL_API_KEY EXOTEL_API_TOKEN EXOTEL_ACCOUNT_SID PAWSPACE_VOICE_UAT_ALLOWLIST; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING: $name"
              missing=1
            else
              echo "PRESENT: $name"
            fi
          done
          [ "$missing" -eq 0 ]
