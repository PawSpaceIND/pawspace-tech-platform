name: Voice UAT secret preflight

on:
  push:
    branches:
      - fix/audio-bot-exotel-uat-closure-20260905
  workflow_dispatch:

jobs:
  verify-secret-presence:
    runs-on: ubuntu-latest
    environment: pawspace-staging
    steps:
      - name: Verify Exotel staging secret names without exposing values
        env:
          EXOTEL_API_KEY: ${{ secrets.EXOTEL_API_KEY }}
          EXOTEL_API_TOKEN: ${{ secrets.EXOTEL_API_TOKEN }}
          EXOTEL_ACCOUNT_SID: ${{ secrets.EXOTEL_ACCOUNT_SID || secrets.EXOTEL_SID }}
          PAWSPACE_VOICE_UAT_ALLOWLIST: ${{ secrets.PAWSPACE_VOICE_UAT_ALLOWLIST }}
        run: |
          set -euo pipefail
          missing=0
          for name in EXOTEL_API_KEY EXOTEL_API_TOKEN EXOTEL_ACCOUNT_SID PAWSPACE_VOICE_UAT_ALLOWLIST; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING: $name"
              missing=1
            else
              echo "PRESENT: $name"
            fi
          done
          [ "$missing" -eq 0 ]
  certify-one-shot:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify-secret-presence
    runs-on: ubuntu-latest
    environment: pawspace-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only one-shot carrier certification
        run: |
          set -euo pipefail
          run_sql() { npx --yes wrangler@4 d1 execute pawspace-staging --remote --json --command "$1"; }
          RUN_ID='VOICE-UAT-20260906-CONTROLLED-RETRY-1'
          IDEM='voice-carrier-uat:2026-09-06:controlled-retry-1'
          run_sql "SELECT status,last_state,COALESCE(failure_class,'') AS failure_class,CASE WHEN call_id IS NULL THEN 0 ELSE 1 END AS has_call_id FROM voice_carrier_uat_queue WHERE id='$RUN_ID';" > /tmp/q.json
          run_sql "SELECT COUNT(*) AS order_count,state,provider,CASE WHEN provider_call_id IS NULL THEN 0 ELSE 1 END AS has_provider_call,CASE WHEN ai_call_id IS NULL THEN 0 ELSE 1 END AS has_ai_call FROM voice_call_orders WHERE idempotency_key='$IDEM';" > /tmp/o.json
          run_sql "SELECT COUNT(*) AS customer_segments FROM ai_voice_segments WHERE call_id=(SELECT ai_call_id FROM voice_call_orders WHERE idempotency_key='$IDEM' LIMIT 1) AND speaker='customer' AND length(trim(transcript_text))>0;" > /tmp/s.json
          run_sql "SELECT COUNT(*) AS provider_events FROM voice_call_provider_events WHERE call_id=(SELECT id FROM voice_call_orders WHERE idempotency_key='$IDEM' LIMIT 1);" > /tmp/e.json
          run_sql "SELECT COUNT(*) AS disposition_count,COALESCE(MIN(primary_tag),'') AS primary_tag FROM bot_call_dispositions WHERE call_ref=(SELECT provider_call_id FROM voice_call_orders WHERE idempotency_key='$IDEM' LIMIT 1) AND bot_provider='exotel_agentstream';" > /tmp/d.json
          node <<'NODE'
          const fs=require('node:fs');
          function rows(path){const raw=fs.readFileSync(path,'utf8'); const i=[raw.indexOf('['),raw.indexOf('{')].filter(x=>x>=0); if(!i.length)return[]; const p=JSON.parse(raw.slice(Math.min(...i))); const blocks=Array.isArray(p)?p:[p]; return blocks.flatMap(b=>Array.isArray(b?.results)?b.results:[])}
          const q=rows('/tmp/q.json')[0]||{}, o=rows('/tmp/o.json')[0]||{}, s=rows('/tmp/s.json')[0]||{}, e=rows('/tmp/e.json')[0]||{}, d=rows('/tmp/d.json')[0]||{};
          const out={queue_status:q.status||'missing',queue_last_state:q.last_state||null,failure_class:q.failure_class||null,has_call_id:Number(q.has_call_id||0),order_count:Number(o.order_count||0),order_state:o.state||null,provider:o.provider||null,has_provider_call:Number(o.has_provider_call||0),has_ai_call:Number(o.has_ai_call||0),customer_segments:Number(s.customer_segments||0),provider_events:Number(e.provider_events||0),disposition_count:Number(d.disposition_count||0),primary_tag:d.primary_tag||null};
          console.log(JSON.stringify(out));
          if(out.queue_status==='pending'||out.queue_status==='running') process.exit(2);
          if(out.queue_status!=='completed') process.exit(3);
          if(out.order_count!==1||out.has_provider_call!==1) process.exit(4);
          if(out.has_ai_call!==1||out.customer_segments<1) process.exit(5);
          if(out.disposition_count!==1) process.exit(6);
          NODE

