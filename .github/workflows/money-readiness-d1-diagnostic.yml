name: Money readiness D1 diagnostic

on:
  push:
    branches: [fix/money-readiness]
    paths:
      - .github/workflows/money-readiness-d1-diagnostic.yml
      - scripts/money-readiness-d1-diagnostic.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-read:
    name: Read-only schema (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            worker: pawspace-staging
          - environment: production
            worker: pawspace-prod-bengaluru
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_D1_ID: ${{ secrets.PRODUCTION_D1_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute read-only schema and journal diagnostics
        shell: bash
        run: |
          set -euo pipefail
          set +x
          RAW="$RUNNER_TEMP/money-readiness-${{ matrix.environment }}"
          mkdir -p "$RAW"
          CONFIG="$RUNNER_TEMP/money-readiness-${{ matrix.environment }}-wrangler.json"
          if [ "${{ matrix.environment }}" = "production" ]; then
            if [ -z "$PRODUCTION_D1_ID" ]; then echo "Protected production D1 secret is not configured." >&2; exit 1; fi
            CONFIG="$CONFIG" node -e '
              const fs=require("node:fs"),id=String(process.env.PRODUCTION_D1_ID||"");
              fs.writeFileSync(process.env.CONFIG,JSON.stringify({name:"money-readiness-read-only-diagnostic",compatibility_date:"2026-09-06",d1_databases:[{binding:"DB",database_name:"money-readiness-protected-target",database_id:id}]}));'
          else
            SETTINGS="$RAW/worker-settings.json"
            HTTP="$(curl --silent --show-error --output "$SETTINGS" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/${{ matrix.worker }}/settings")"
            if [ "$HTTP" != "200" ]; then echo "Protected Worker settings could not be read; response is intentionally suppressed." >&2; exit 1; fi
            CONFIG="$CONFIG" SETTINGS="$SETTINGS" node -e '
              const fs=require("node:fs"),payload=JSON.parse(fs.readFileSync(process.env.SETTINGS,"utf8")),bindings=Array.isArray(payload?.result?.bindings)?payload.result.bindings:[];
              const matches=bindings.filter((item)=>String(item?.name||"")==="DB"&&String(item?.type||"")==="d1"),id=String(matches[0]?.id||matches[0]?.database_id||"");
              if(matches.length!==1||!id){console.error("Expected exactly one D1 binding on the protected Worker.");process.exit(1);}
              fs.writeFileSync(process.env.CONFIG,JSON.stringify({name:"money-readiness-read-only-diagnostic",compatibility_date:"2026-09-06",d1_databases:[{binding:"DB",database_name:"money-readiness-protected-target",database_id:id}]}));'
          fi
          if ! npx --yes wrangler@4 d1 execute DB --config "$CONFIG" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;" --json > "$RAW/tables.json" 2> "$RAW/tables.err"; then
            echo "Read-only table-map query failed; raw provider output is intentionally suppressed." >&2
            exit 1
          fi
          set +e
          npx --yes wrangler@4 d1 execute DB --config "$CONFIG" --remote --command "SELECT COUNT(*) AS row_count FROM journal_entries;" --json > "$RAW/journal.json" 2> "$RAW/journal.err"
          JOURNAL_STATUS=$?
          npx --yes wrangler@4 d1 execute DB --config "$CONFIG" --remote --command "SELECT COUNT(*) AS row_count FROM finance_journal_entries;" --json > "$RAW/finance.json" 2> "$RAW/finance.err"
          FINANCE_STATUS=$?
          set -e
          node scripts/money-readiness-d1-diagnostic.mjs \
            --environment "${{ matrix.environment }}" \
            --tables "$RAW/tables.json" \
            --journal "$RAW/journal.json" --journal-status "$JOURNAL_STATUS" \
            --finance "$RAW/finance.json" --finance-status "$FINANCE_STATUS" \
            | tee "$RUNNER_TEMP/money-readiness-${{ matrix.environment }}-summary.json"
      - name: Upload sanitized schema evidence
        uses: actions/upload-artifact@v4
        with:
          name: money-readiness-${{ matrix.environment }}-schema
          path: ${{ runner.temp }}/money-readiness-${{ matrix.environment }}-summary.json
          if-no-files-found: error
          retention-days: 7
