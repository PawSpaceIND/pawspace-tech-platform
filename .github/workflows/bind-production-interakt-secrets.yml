name: Bind production Interakt secrets
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "bind-interakt-production" to update PawSpace production Worker secrets'
        required: true
        default: ''
jobs:
  bind:
    if: ${{ github.event.inputs.confirm == 'bind-interakt-production' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-save wrangler@4.92.0
      - name: Require all Interakt secret values
        env:
          INTERAKT_API_KEY: ${{ secrets.INTERAKT_API_KEY }}
          INTERAKT_WEBHOOK_SECRET: ${{ secrets.INTERAKT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          for name in INTERAKT_API_KEY INTERAKT_WEBHOOK_SECRET; do
            test -n "${!name:-}" || { echo "$name is missing; refusing partial secret binding" >&2; exit 1; }
          done
      - name: Bind secrets to production Worker without writing plaintext config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERAKT_API_KEY: ${{ secrets.INTERAKT_API_KEY }}
          INTERAKT_WEBHOOK_SECRET: ${{ secrets.INTERAKT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$INTERAKT_API_KEY" | npx wrangler secret put INTERAKT_API_KEY --name pawspace-prod-bengaluru
          printf '%s' "$INTERAKT_WEBHOOK_SECRET" | npx wrangler secret put INTERAKT_WEBHOOK_SECRET --name pawspace-prod-bengaluru
          echo "Interakt production Worker secrets bound. Values were not printed or written to wrangler.json."
