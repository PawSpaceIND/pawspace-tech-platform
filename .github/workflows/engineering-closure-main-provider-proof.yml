name: Engineering closure main Razorpay provider proof

on:
  push:
    branches:
      - uat/engineering-closure-main-provider-proof-20260911

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: engineering-closure-main-provider-proof
  cancel-in-progress: false

jobs:
  proof:
    if: ${{ github.ref == 'refs/heads/uat/engineering-closure-main-provider-proof-20260911' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: pawspace-release-preview
    env:
      PAWSPACE_PAYMENT_ENV: sandbox
      PAWSPACE_PAYMENT_LIVE_APPROVED: 'false'
      FORBID_PRODUCTION: 'true'
      WEBHOOK_ID: TaG3ZzXULiDFUS
      PRODUCT_SHA: 513c6f894345105c472447a1240cf63cae15d529
      PROOF_CONFIRM: main-provider-proof-674
    steps:
      - name: Checkout disposable proof infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: infra
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify current main is exactly merged and certified PR734 source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ env.PRODUCT_SHA }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expected=process.env.EXPECTED_SHA||'';
          if(!/^[0-9a-f]{40}$/.test(expected))throw new Error('Exact current main SHA required');
          const base='https://api.github.com/repos/PawSpaceIND/pawspace-tech-platform';
          const get=async path=>{const r=await fetch(base+path,{headers:{authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(20000)});if(!r.ok)throw new Error(`GitHub verification failed ${r.status} ${path}`);return r.json();};
          const [main,pr]=await Promise.all([get('/branches/main'),get('/pulls/734')]);
          if(main?.commit?.sha!==expected)throw new Error('Protected main moved; refusing stale proof');
          if(pr?.merged!==true||pr?.merge_commit_sha!==expected||pr?.head?.repo?.full_name!=='PawSpaceIND/pawspace-tech-platform')throw new Error('Expected main is not the merged #734 closure');
          const [mainCommit,headCommit]=await Promise.all([get('/git/commits/'+expected),get('/git/commits/'+pr.head.sha)]);
          if(mainCommit?.tree?.sha!==headCommit?.tree?.sha)throw new Error('Merged main tree differs from certified #734 head tree');
          const runs=(await get('/actions/runs?event=pull_request&head_sha='+pr.head.sha+'&per_page=100')).workflow_runs||[];
          for(const name of ['Release CI','Pre-UAT Staging Protocol','Browser E2E (hardened, preview superuser disabled)','Browser E2E (personas, sandbox locked)']){
            const run=runs.filter(r=>r.name===name).sort((a,b)=>b.id-a.id)[0];
            if(!run||run.status!=='completed'||run.conclusion!=='success')throw new Error('Certified #734 workflow missing/failed: '+name);
          }
          console.log(JSON.stringify({main:expected,certifiedHead:pr.head.sha,tree:mainCommit.tree.sha,requiredWorkflowGroups:4}));
          NODE
      - name: Checkout immutable main product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: candidate
      - name: Install exact candidate dependencies
        working-directory: candidate
        run: npm ci
      - name: Build exact main product candidate
        working-directory: candidate
        run: npm run build
      - name: Install Chromium for hosted proof
        working-directory: candidate
        run: npx playwright install --with-deps chromium
      - name: Create isolated TEST-only Worker and D1 from exact main
        env:
          CONFIRM: ${{ env.PROOF_CONFIRM }}
          EXPECTED_SHA: ${{ env.PRODUCT_SHA }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          CHECKOUT_EVIDENCE_DIR: ${{ github.workspace }}/checkout-sandbox-evidence
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_PREVIEW_D1_ID: ${{ vars.RELEASE_PREVIEW_D1_ID }}
          RELEASE_PREVIEW_WORKER_NAME: ${{ vars.RELEASE_PREVIEW_WORKER_NAME }}
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
          PAWSPACE_UAT_SIGNING_KEY: ${{ secrets.PAWSPACE_UAT_SIGNING_KEY }}
          PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT: ${{ secrets.PAWSPACE_IDENTITY_ASSERTION_SECRET_UAT }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
          GOOGLE_MAPS_SERVER_API_KEY_UAT: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY_UAT }}
        run: node --experimental-strip-types infra/scripts/deploy-main-checkout-sandbox.mjs
      - name: Verify hosted customer UI without payment
        env:
          EXPECTED_SHA: ${{ env.PRODUCT_SHA }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          CHECKOUT_EVIDENCE_DIR: ${{ github.workspace }}/checkout-sandbox-evidence
          PAWSPACE_UAT_ACCESS_CODE: ${{ secrets.PAWSPACE_UAT_ACCESS_CODE }}
        run: node --experimental-strip-types infra/scripts/verify-checkout-hosted-browser.mjs
      - name: Export exact isolated Worker identity
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('checkout-sandbox-evidence/hosting-report.json','utf8'));
          if(report.hosted!==true||report.customerUiVerified!==true||!/^pawspace-checkout-674-[0-9]+-[0-9]+$/.test(report.worker||''))throw new Error('Hosted proof identity is incomplete');
          const url=new URL(report.origin);if(url.protocol!=='https:'||!url.hostname.startsWith(report.worker+'.'))throw new Error('Hosted proof origin mismatch');
          appendFileSync(process.env.GITHUB_ENV,`PROOF_WORKER=${report.worker}\nPROOF_ORIGIN=${report.origin}\n`);
          console.log(JSON.stringify({worker:report.worker,host:url.host,candidate:report.candidateSha}));
          NODE
      - name: Temporarily repoint exactly the active Razorpay TEST webhook to isolated Worker
        env:
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const key=process.env.RAZORPAY_KEY_ID_SANDBOX||'',secret=process.env.RAZORPAY_KEY_SECRET_SANDBOX||'',webhookSecret=process.env.RAZORPAY_WEBHOOK_SECRET_SANDBOX||'';
          const id=process.env.WEBHOOK_ID,target=`${process.env.PROOF_ORIGIN}/api/razorpay-webhook`;
          if(!/^rzp_test_[A-Za-z0-9]+$/.test(key)||!secret||!webhookSecret)throw new Error('Genuine Razorpay TEST webhook credentials required');
          const auth=`Basic ${Buffer.from(`${key}:${secret}`).toString('base64')}`,api=`https://api.razorpay.com/v1/webhooks/${id}`;
          const normalize=raw=>{if(Array.isArray(raw))return [...new Set(raw.flatMap(v=>typeof v==='string'?[v]:typeof v?.name==='string'?[v.name]:[]))];if(!raw||typeof raw!=='object')return[];return [...new Set([...Object.keys(raw).filter(k=>k.includes('.')&&Boolean(raw[k])),...Object.values(raw).flatMap(v=>typeof v==='string'&&v.includes('.')?[v]:v&&typeof v==='object'?['name','event','event_name'].flatMap(k=>typeof v[k]==='string'&&v[k].includes('.')?[v[k]]:[]):[])])];};
          const get=async()=>{const r=await fetch(api,{headers:{authorization:auth},redirect:'error',signal:AbortSignal.timeout(15000)});if(!r.ok)throw new Error('Razorpay webhook read failed HTTP '+r.status);return r.json();};
          const before=await get();
          if(before.id!==id||before.active!==true||!/^https:\/\/pawspace-staging\.[a-z0-9-]+\.workers\.dev\/api\/razorpay-webhook$/i.test(before.url||''))throw new Error('Test webhook is not the expected active stable-staging receiver; refusing mutation');
          const events=normalize(before.events);for(const required of ['payment.authorized','payment.captured','payment.failed','order.paid'])if(!events.includes(required))throw new Error('Required Test webhook event missing: '+required);
          const eventMap=Object.fromEntries(events.map(event=>[event,true]));writeFileSync(`${process.env.RUNNER_TEMP}/razorpay-webhook-original.json`,JSON.stringify({url:before.url,events:eventMap}));
          const r=await fetch(api,{method:'PUT',headers:{authorization:auth,'content-type':'application/json'},body:JSON.stringify({url:target,events:eventMap,secret:webhookSecret}),redirect:'error',signal:AbortSignal.timeout(15000)});if(!r.ok)throw new Error('Razorpay webhook update failed HTTP '+r.status+': '+(await r.text()).slice(0,200));
          const after=await get();if(after.id!==id||after.active!==true||after.url!==target)throw new Error('Test webhook did not converge to isolated Worker');
          console.log(JSON.stringify({id,active:true,targetHost:new URL(target).host,eventCount:events.length}));
          NODE
      - name: Run one INR 1 Razorpay TEST capture and require signed provider webhook persistence
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          PR674_CANDIDATE_SHA: ${{ env.PRODUCT_SHA }}
          PR674_WORKER_NAME: ${{ env.PROOF_WORKER }}
          PR674_WORKER_ORIGIN: ${{ env.PROOF_ORIGIN }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/infra/e2e/engineering-closure-provider-webhook-proof.spec.ts" e2e/.engineering-closure-provider-webhook-proof.spec.ts
          trap 'rm -f e2e/.engineering-closure-provider-webhook-proof.spec.ts' EXIT
          npx playwright test e2e/.engineering-closure-provider-webhook-proof.spec.ts --project=chromium --retries=0
      - name: Restore Razorpay TEST webhook to stable staging
        if: always()
        env:
          RAZORPAY_KEY_ID_SANDBOX: ${{ secrets.RAZORPAY_KEY_ID_SANDBOX }}
          RAZORPAY_KEY_SECRET_SANDBOX: ${{ secrets.RAZORPAY_KEY_SECRET_SANDBOX }}
          RAZORPAY_WEBHOOK_SECRET_SANDBOX: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_SANDBOX }}
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          const file=`${process.env.RUNNER_TEMP}/razorpay-webhook-original.json`;if(!existsSync(file)){console.log('No webhook mutation manifest exists; nothing to restore.');process.exit(0)}
          const original=JSON.parse(readFileSync(file,'utf8')),key=process.env.RAZORPAY_KEY_ID_SANDBOX||'',secret=process.env.RAZORPAY_KEY_SECRET_SANDBOX||'',webhookSecret=process.env.RAZORPAY_WEBHOOK_SECRET_SANDBOX||'',id=process.env.WEBHOOK_ID;
          if(!/^rzp_test_[A-Za-z0-9]+$/.test(key)||!secret||!webhookSecret)throw new Error('Cannot safely restore Razorpay TEST webhook credentials');
          const auth=`Basic ${Buffer.from(`${key}:${secret}`).toString('base64')}`,api=`https://api.razorpay.com/v1/webhooks/${id}`,target=`${process.env.PROOF_ORIGIN||''}/api/razorpay-webhook`;
          const get=async()=>{const r=await fetch(api,{headers:{authorization:auth},redirect:'error',signal:AbortSignal.timeout(15000)});if(!r.ok)throw new Error('Webhook restore read failed HTTP '+r.status);return r.json();};
          const before=await get();if(before.url!==target&&before.url!==original.url)throw new Error('Webhook URL drifted during proof; refusing blind restore');
          if(before.url===target){const r=await fetch(api,{method:'PUT',headers:{authorization:auth,'content-type':'application/json'},body:JSON.stringify({url:original.url,events:original.events,secret:webhookSecret}),redirect:'error',signal:AbortSignal.timeout(15000)});if(!r.ok)throw new Error('Webhook restore failed HTTP '+r.status+': '+(await r.text()).slice(0,200));}
          const after=await get();if(after.id!==id||after.active!==true||after.url!==original.url)throw new Error('Razorpay TEST webhook restore verification failed');
          console.log(JSON.stringify({id,restoredHost:new URL(after.url).host,active:true}));
          NODE
      - name: Retain redacted proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-closure-main-razorpay-proof-${{ env.PRODUCT_SHA }}
          path: |
            checkout-sandbox-evidence/
            candidate/playwright-report/
            candidate/test-results/
          if-no-files-found: warn
          retention-days: 14
